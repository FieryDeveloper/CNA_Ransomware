losed","s":"TELA Bio, Inc. experienced a ransomware attack that impacted procedures at some of their largest accounts, contributing to a shortfall in revenue growth. The company reported a revenue of $16.1 million for the second quarter of 2024, reflecting an 11% increase from the previous year, despite the disruptions caused by the cyberattack.","src":["https://www.sec.gov/Archives/edgar/data/1561921/000110465924088353/tm2421368d1_ex99-1.htm"]},{"v":"Stryker","g":"handala","d":"03/23/2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Stryker experienced a network disruption but found no evidence of ransomware or malware. The incident was contained, and there was no indication of malicious activity directed towards customers or partners. The company is prioritizing the restoration of systems that support customer operations and manufacturing capabilities.","src":["https://www.sec.gov/Archives/edgar/data/310764/000119312526118634/d94012dex992.htm"]},{"v":"Allied Healthcare Products, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Allied Healthcare Products, Inc. experienced a ransomware attack during the COVID-19 pandemic, which contributed to operational inefficiencies and cash strain. The company is now implementing strategic transformation initiatives under new leadership to improve operational effectiveness and drive growth.","src":["https://www.sec.gov/Archives/edgar/data/874710/000110465923033243/tm239758d1_ex99-2.htm"]},{"v":"Change Healthcare Solutions LLC","g":"not publicly disclosed","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Change Healthcare Solutions LLC experienced a ransomware cyberattack that disrupted patient billing and collections, impacting the broader healthcare industry. This incident contributed to a decrease in revenue for Greenbrook TMS Inc. in Q1 2024, despite their efforts to restructure and expand treatment offerings.","src":["https://www.sec.gov/Archives/edgar/data/1735948/000110465924061255/tm2414236d1_ex99-1.htm"]},{"v":"Medical Computer Business Services (MCBS)","g":"PEAR (Pure Extraction and Ransom)","d":"2025-09-22","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1,261,464 individuals affected; exposed data includes full name, physical address, Social Security number, date of birth, health plan beneficiary number, health insurance policy number, subscriber identification number, medical history, mental and physical condition, medical treatment information, diagnosis information.","s":"Medical Computer Business Services (MCBS) experienced a data breach that affected 1.26 million individuals, exposing sensitive personal and health information. The breach occurred between September 22 and 26, 2025, and was claimed by the PEAR ransomware group, which alleges to have exfiltrated 3.3 terabytes of data from MCBS systems.","src":["https://www.bleepingcomputer.com/news/security/data-breach-at-medical-billing-firm-mcbs-affects-126-million-people/"]},{"v":"McKesson","g":"ShinyHunters","d":"August 25, 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$55,236,150","dt":"not publicly disclosed","di":"approximately 284 million data records including names, addresses, dates of birth, Social Security numbers, patient IDs, phone numbers, email addresses, Medicaid numbers, medical record numbers, medication and allergy information, illnesses, disabilities, appointment information, and physician information","s":"McKesson disclosed a cybersecurity incident involving unauthorized access and data theft, with the ShinyHunters group claiming to have stolen approximately 284 million patient data records. The attackers used social engineering techniques to compromise employee accounts and accessed sensitive data from McKesson's systems, demanding a ransom of over $55 million.","src":["https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/"]},{"v":"ChipSoft","g":"not publicly disclosed","d":"","c":"Netherlands","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"ChipSoft took offline its website and digital services; some systems are reportedly unavailable at various hospitals.","di":"not publicly disclosed","s":"ChipSoft, a Dutch healthcare IT solutions provider, was hit by a ransomware attack that forced the company to disable its website and digital services. The incident has affected multiple hospitals in the Netherlands and Belgium, prompting the company to advise healthcare centers to disconnect from its systems during the recovery process.","src":["https://www.bleepingcomputer.com/news/security/healthcare-it-solutions-provider-chipsoft-hit-by-ransomware-attack/"]},{"v":"University of Mississippi Medical Center","g":"not publicly disclosed","d":"February 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Epic electronic health record system taken offline across 35 clinics and more than 200 telehealth sites, forcing cancellation of chemotherapy appointments and postponement of non-emergency surgeries.","di":"not publicly disclosed","s":"In February 2026, the University of Mississippi Medical Center suffered a ransomware attack that disrupted its Epic electronic health record system, affecting numerous clinics and telehealth sites. This incident led to the cancellation of critical medical appointments and forced staff to revert to paper-based workflows, impacting patient care significantly.","src":["https://www.bleepingcomputer.com/news/security/evolution-of-ransomware-multi-extortion-ransomware-attacks/"]},{"v":"Covenant Health","g":"Qilin","d":"May 18, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"478,188 individuals affected; names, addresses, dates of birth, medical record numbers, Social Security numbers, health insurance information, treatment details","s":"Covenant Health experienced a data breach on May 18, 2025, impacting nearly 500,000 patients. The Qilin ransomware group claimed responsibility for the attack, stating they stole 852 GB of data, including sensitive patient information. Covenant Health is offering affected individuals 12 months of free identity protection services.","src":["https://www.bleepingcomputer.com/news/security/covenant-health-says-may-data-breach-impacted-nearly-478-000-patients/"]},{"v":"medical billing services company, ski resort, school district, health clinic","g":"Black Kingdom","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"$10,000 in Bitcoin","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Rami Khaled Ahmed, a Yemeni national, has been indicted for conducting 1,500 ransomware attacks using Black Kingdom malware on Microsoft Exchange servers. The attacks targeted various U.S.-based victims, including a medical billing services company and a health clinic, demanding ransom payments of $10,000 in Bitcoin. Ahmed faces multiple charges, including conspiracy and intentional damage to a protected computer, with potential sentences totaling up to 15 years if convicted.","src":["https://www.bleepingcomputer.com/news/security/us-indicts-black-kingdom-ransomware-admin-for-microsoft-exchange-attacks/"]},{"v":"Frederick Health Medical Group","g":"not publicly disclosed","d":"January 27, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"934,326 patients affected; sensitive personal information including names, addresses, dates of birth, Social Security numbers, driver's license numbers, medical record numbers, health insurance information, and clinical information","s":"Frederick Health Medical Group experienced a ransomware attack on January 27, 2025, leading to a data breach affecting nearly one million patients. The attackers gained unauthorized access to the network and copied sensitive files, prompting the health system to notify law enforcement and hire a forensic firm for investigation.","src":["https://www.bleepingcomputer.com/news/security/frederick-health-data-breach-impacts-nearly-1-million-patients/"]},{"v":"STIIIZY","g":"Everest","d":"November 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Everest ransomware gang's dark web leak site was defaced by an unknown attacker, leading to its current offline status. Everest has shifted from data theft to ransomware attacks, targeting various organizations, including healthcare entities, and has claimed numerous victims over the years.","src":["https://www.bleepingcomputer.com/news/security/everest-ransomwares-dark-web-leak-site-defaced-now-offline/"]},{"v":"Fred Hutch Cancer Center","g":"Hunters International","d":"December 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 800,000 cancer patients' data","s":"Hunters International, a ransomware group, has shifted to data extortion, launching a new operation called 'World Leaks'. In December 2023, they breached the Fred Hutch Cancer Center, threatening to leak data of over 800,000 cancer patients if a ransom was not paid.","src":["https://www.bleepingcomputer.com/news/security/hunters-international-rebrands-as-world-leaks-in-shift-to-data-extortion/"]},{"v":"Advanced Computer Software Group Ltd","g":"LockBit","d":"2022-08-01","c":"UK","fin":"£3.07 million","ran":"not publicly disclosed","dt":"significant outages, recovery took long with help from experts","di":"79,404 people affected, sensitive personal data including NHS patients' information","s":"Advanced Computer Software Group Ltd was fined £3.07 million by the UK Information Commissioner's Office for a ransomware attack in 2022 that exposed the sensitive personal data of 79,404 individuals, including NHS patients. The LockBit ransomware group was responsible for the breach, which highlighted significant security shortcomings in the company's systems.","src":["https://www.bleepingcomputer.com/news/security/uk-fines-software-provider-307-million-for-2022-ransomware-breach/"]},{"v":"BayMark Health Services","g":"RansomHub","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"BayMark Health Services, North America's largest addiction treatment provider, was breached by the RansomHub ransomware gang. This incident is part of a broader trend where RansomHub has targeted multiple high-profile victims and engaged in data-theft-based extortion rather than traditional ransomware encryption.","src":["https://www.bleepingcomputer.com/news/security/ransomhub-ransomware-uses-new-betruger-multi-function-backdoor/"]},{"v":"Minneapolis Public Schools","g":"Medusa","d":"March 2023","c":"United States","fin":"$8 million","ran":"$8 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Medusa ransomware operation has impacted over 300 organizations in critical infrastructure sectors in the United States, including the Minneapolis Public Schools. The group has claimed over 400 victims worldwide and has been active since 2021, with a significant increase in attacks observed in early 2025.","src":["https://www.bleepingcomputer.com/news/security/cisa-medusa-ransomware-hit-over-300-critical-infrastructure-orgs/"]},{"v":"Genea","g":"Termite","d":"January 31, 2025","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"940.7GB of sensitive healthcare data including full names, emails, addresses, phone numbers, date of birth, emergency contacts, Medicare card numbers, medical record numbers, medical history, diagnoses and treatments, medications and prescriptions, and appointment details.","s":"Genea, a major Australian fertility services provider, was breached by the Termite ransomware gang, which claimed responsibility for stealing sensitive healthcare data. The attackers exfiltrated approximately 940.7GB of data, including personal and health information of patients, and published some of it online.","src":["https://www.bleepingcomputer.com/news/security/australian-ivf-giant-genea-breached-by-termite-ransomware-gang/"]},{"v":"New York Blood Center","g":"not publicly disclosed","d":"January 26, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Some appointments had to be rescheduled and certain systems were taken offline to contain the threat.","di":"not publicly disclosed","s":"The New York Blood Center experienced a ransomware attack that disrupted its operations, leading to the rescheduling of blood donation appointments. The organization is working with cybersecurity experts to restore its systems and has not confirmed whether any personal or health information was accessed or stolen during the incident.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-disrupts-new-york-blood-donation-giant/"]},{"v":"UnitedHealth Group","g":"BlackCat","d":"February 2024","c":"United States","fin":"$2.45 billion","ran":"$22 million","dt":"not publicly disclosed","di":"190 million individuals affected; health insurance information, medical records, billing and payment information, personal information including phone numbers, addresses, Social Security Numbers, and government ID numbers","s":"In February 2024, UnitedHealth's subsidiary Change Healthcare suffered a massive ransomware attack by the BlackCat gang, impacting 190 million individuals. The attack led to significant disruptions in the healthcare system, with UnitedHealth confirming a ransom payment of $22 million to receive a decryptor and prevent data leaks, which ultimately did not stop the threat actors from leaking some of the stolen data.","src":["https://www.bleepingcomputer.com/news/security/unitedhealth-now-says-190-million-impacted-by-2024-data-breach/"]},{"v":"OneBlood","g":"not publicly disclosed","d":"July 14, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"OneBlood confirmed that personal data was stolen in a ransomware attack that occurred from July 14 to July 29, 2024. The attack led to the encryption of virtual machines, forcing the organization to revert to manual processes and causing critical blood shortages. The investigation revealed that names and Social Security numbers were among the data copied from their network without authorization.","src":["https://www.bleepingcomputer.com/news/security/oneblood-confirms-personal-data-stolen-in-july-ransomware-attack/"]},{"v":"Rhode Island's RIBridges social services platform","g":"Brain Cipher","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"RIBridges was shut down to remediate the threat after confirmation of the breach.","di":"Approximately 650,000 people were impacted; personal data including names, addresses, dates of birth, Social Security numbers, and certain banking information was exposed.","s":"The Brain Cipher ransomware gang leaked data stolen from Rhode Island's RIBridges social services platform, which manages various assistance programs. The breach, confirmed on December 10, affected around 650,000 individuals, exposing sensitive personal information. State officials are advising residents to monitor their credit and be cautious of phishing scams.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-leaks-data-stolen-in-rhode-islands-ribridges-breach/"]},{"v":"Ascension","g":"Black Basta","d":"May 8, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Ascension had to take some devices offline and pause non-emergent elective procedures, tests, and appointments, diverting emergency medical services to other healthcare units.","di":"5,599,699 individuals affected; personal and health data including medical information, payment information, insurance information, government identification information, and other personal information.","s":"Ascension, a major U.S. healthcare system, experienced a ransomware attack linked to the Black Basta group, resulting in the theft of personal and health data of approximately 5.6 million patients and employees. The breach was caused by an employee mistakenly downloading a malicious file, leading to significant operational disruptions and the need for identity theft protection services for affected individuals.","src":["https://www.bleepingcomputer.com/news/security/ascension-health-data-of-56-million-stolen-in-ransomware-attack/"]},{"v":"Artivion","g":"not publicly disclosed","d":"November 21, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company is working to securely restore its systems as quickly as possible.","di":"not publicly disclosed","s":"Artivion, a manufacturer of heart surgery medical devices, experienced a ransomware attack on November 21 that disrupted its operations and forced it to take some systems offline. The attackers encrypted some of its systems and stole data from compromised systems, prompting the company to engage external advisors for incident response.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-hits-leading-heart-surgery-device-maker/"]},{"v":"Anna Jaques Hospital","g":"Money Message","d":"December 25, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"316,342 patients affected; exposed data includes demographic information, medical information, health insurance information, Social Security numbers, driver's license numbers, financial information, and other personal or health information.","s":"Anna Jaques Hospital suffered a ransomware attack on December 25, 2023, which exposed sensitive health data for over 316,000 patients. The Money Message ransomware group publicly extorted the hospital, threatening to leak data unless their demands were met, and ultimately released all stolen data on January 26, 2024.","src":["https://www.bleepingcomputer.com/news/security/anna-jaques-hospital-ransomware-breach-exposed-data-of-300k-patients/"]},{"v":"Boston Children's Health Physicians","g":"BianLian","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"BianLian ransomware has shifted its focus to exclusively data theft extortion, abandoning file encryption tactics. The group has been active since 2022 and has listed 154 victims on its extortion portal, including notable breaches against organizations like Boston Children's Health Physicians.","src":["https://www.bleepingcomputer.com/news/security/cisa-says-bianlian-ransomware-now-focuses-only-on-data-theft/"]},{"v":"various public and private entities","g":"Phobos","d":"not publicly disclosed","c":"United States","fin":"more than $16 million","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 1,000 entities affected","s":"Evgenii Ptitsyn, a Russian national and suspected administrator of the Phobos ransomware operation, was extradited from South Korea to the United States to face cybercrime charges. The Phobos ransomware gang has been linked to breaches of over 1,000 public and private entities, extorting more than $16 million in ransom payments by encrypting victims' data and threatening to leak stolen files if payments were not made.","src":["https://www.bleepingcomputer.com/news/security/us-charges-phobos-ransomware-admin-after-south-korea-extradition/"]},{"v":"Henry Schein","g":"BlackCat Ransomware","d":"2023-10-15","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"forced to take some systems offline to contain a cyberattack","di":"166,432 people affected; personal information stolen","s":"Henry Schein disclosed a data breach following two cyberattacks in 2023 by the BlackCat Ransomware gang, revealing that over 160,000 people's personal information was stolen. The gang claimed to have stolen 35 TB of sensitive files and threatened to encrypt the network a second time if a ransom was not paid, leading to the release of some stolen data on their leak site.","src":["https://www.bleepingcomputer.com/news/security/henry-schein-discloses-data-breach-a-year-after-ransomware-attack/"]},{"v":"major London hospitals","g":"Qilin","d":"not publicly disclosed","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Qilin ransomware strain, specifically the new Rust-based version Qilin.B, has been observed in attacks targeting major London hospitals. This ransomware employs advanced encryption techniques and disrupts data recovery mechanisms, posing a significant threat to affected organizations.","src":["https://www.bleepingcomputer.com/news/security/new-qilin-ransomware-encryptor-features-stronger-encryption-evasion/"]},{"v":"UMC Health System","g":"not publicly disclosed","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Certain departments remain closed or can only provide services with significant delays; ongoing investigation into the incident.","di":"Sensitive medical information of hundreds of thousands could be impacted.","s":"UMC Health System in Texas experienced a ransomware attack that forced the diversion of some patients to other locations. The attack impacted its operations, leading to an IT outage and significant delays in services, particularly in radiology.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-forces-umc-health-system-to-divert-some-patients/"]},{"v":"Centers for Medicare Medicaid Services (CMS)","g":"Cl0p","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"3,112,815 individuals affected; data types include Name, Social Security Number, Date of Birth, Mailing Address, Gender, Hospital Account Number, Dates of Service, Medicare Beneficiary Identifier, Health Insurance Claim Number","s":"The Centers for Medicare Medicaid Services (CMS) reported a data breach affecting over 3 million health plan beneficiaries due to the MOVEit attacks by the Cl0p ransomware group. The breach involved the exposure of sensitive health and personal information after hackers compromised the Wisconsin Physicians Service (WPS) network, which provides Medicare administrative services.","src":["https://www.bleepingcomputer.com/news/healthcare/us-govt-agency-cms-says-data-breach-impacted-31-million-people/"]},{"v":"Planned Parenthood","g":"RansomHub","d":"August 28, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"parts of its infrastructure taken offline to contain the damage","di":"93GB of data allegedly stolen, including confidential documents","s":"Planned Parenthood confirmed a cyberattack affecting its IT systems, with the RansomHub group claiming responsibility and threatening to leak stolen data. The organization is investigating the incident and has reported it to federal law enforcement, while also taking proactive measures to secure its network.","src":["https://www.bleepingcomputer.com/news/security/planned-parenthood-confirms-cyberattack-as-ransomhub-claims-breach/"]},{"v":"Kootenai Health","g":"3AM","d":"February 22, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems were disrupted; investigation ongoing","di":"464,000 patients; Full names, Dates of birth, Social Security numbers (SSNs), Driver's Licenses, Government ID numbers, Medical record numbers, Medical treatment and condition information, Medical diagnoses, Health insurance information","s":"Kootenai Health experienced a data breach affecting over 464,000 patients due to a cyberattack by the 3AM ransomware group. The attackers gained unauthorized access to the organization's systems on February 22, 2024, and leaked sensitive patient data on their darknet portal, indicating that a ransom was not paid.","src":["https://www.bleepingcomputer.com/news/security/3am-ransomware-stole-data-of-464-000-kootenai-health-patients/"]},{"v":"McLaren Health Care","g":"INC Ransom","d":"","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"2.2 million people; names, Social Security numbers, health insurance and physician information, Medicare/Medicaid, prescription/medication, diagnostic results and treatment information","s":"McLaren Health Care experienced a disruption to its IT and phone systems due to an attack linked to the INC Ransom ransomware operation. The incident resulted in the potential exposure of personal and health information of approximately 2.2 million individuals, prompting the health system to notify affected parties of the breach.","src":["https://www.bleepingcomputer.com/news/security/mclaren-hospitals-disruption-linked-to-inc-ransomware-attack/"]},{"v":"Cencora","g":"Dark Angels","d":"February 2024","c":"not publicly disclosed","fin":"$75 million","ran":"$75 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"In February 2024, pharmaceutical giant Cencora reportedly paid a record-breaking ransom of $75 million to the Dark Angels ransomware gang. This payment is the highest known ransom to date, surpassing the previous record of $40 million. The attack involved the encryption of corporate data and the potential theft of sensitive information, although specific details about the data impact have not been disclosed.","src":["https://www.bleepingcomputer.com/news/security/dark-angels-ransomware-receives-record-breaking-75-million-ransom/"]},{"v":"MediSecure","g":"not publicly disclosed","d":"April 13, 2024","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"MediSecure shut down its website and phone lines; the data was restored from a server backup on May 17, 2024.","di":"12.9 million people affected; personal and health information including names, dates of birth, addresses, contact information, individual healthcare identifiers, Medicare card numbers, prescription medication details, and concession card numbers.","s":"MediSecure, an Australian prescription delivery service, experienced a ransomware attack in April 2024 that resulted in the theft of personal and health information of approximately 12.9 million individuals. The company shut down its website and phone lines to contain the breach and successfully restored the data from a backup by May 17, 2024.","src":["https://www.bleepingcomputer.com/news/security/medisecure-ransomware-gang-stole-data-of-129-million-people/"]},{"v":"Synnovis","g":"Qilin","d":"June 2024","c":"UK","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"forced cancellation of hundreds of operations and appointments","di":"not publicly disclosed","s":"The Qilin ransomware group, linked to the Scattered Spider gang, attacked pathology services provider Synnovis in early June 2024. This incident impacted several major NHS hospitals in London, leading to the cancellation of hundreds of operations and appointments.","src":["https://www.bleepingcomputer.com/news/security/microsoft-links-scattered-spider-hackers-to-qilin-ransomware-attacks/"]},{"v":"All India Institute Of Medical Sciences (AIIMS)","g":"ChamelGang","d":"not publicly disclosed","c":"India","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"causing major disruptions in healthcare services","di":"192 computers compromised","s":"ChamelGang, a suspected Chinese APT, targeted the All India Institute Of Medical Sciences (AIIMS) using CatB ransomware, leading to significant disruptions in healthcare services. The attack is part of a broader trend where ransomware is employed in cyberespionage to obscure attribution and achieve financial gain alongside data theft.","src":["https://www.bleepingcomputer.com/news/security/chinese-cyberspies-employ-ransomware-in-attacks-for-diversion/"]},{"v":"Change Healthcare","g":"BlackCat (aka ALPHV)","d":"February","c":"not publicly disclosed","fin":"$872 million","ran":"$22 million","dt":"widespread outages in the US healthcare system, preventing doctors and pharmacies from filing claims","di":"6 TB of data stolen, including health insurance information, health information, billing, claims and payment information, and personal information such as Social Security numbers","s":"Change Healthcare suffered a ransomware attack in February, leading to the theft of 6 TB of sensitive medical and personal data. The attack, conducted by the BlackCat ransomware gang, resulted in significant disruptions in the US healthcare system and a reported financial impact of $872 million.","src":["https://www.bleepingcomputer.com/news/security/change-healthcare-lists-the-medical-data-stolen-in-ransomware-attack/"]},{"v":"Singing River Health System","g":"Rhysida","d":"August 19, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"operational disruptions at its hospitals","di":"895,204 people affected; exposed data includes full name, date of birth, physical address, Social Security Number (SSN), medical information, health information","s":"Singing River Health System suffered a ransomware attack in August 2023, impacting 895,204 individuals. The Rhysida ransomware gang claimed responsibility for the attack, which resulted in operational disruptions and significant data theft, including sensitive personal and health information.","src":["https://www.bleepingcomputer.com/news/security/singing-river-health-system-data-of-895-000-stolen-in-ransomware-attack/"]},{"v":"Hôpital de Cannes - Simone Veil (CHC-SV)","g":"LockBit 3.0","d":"April 17, 2024","c":"France","fin":"not publicly disclosed","ran":"received a ransom demand","dt":"severe operational disruption, all computers taken offline, non-emergency procedures and appointments rescheduled","di":"not publicly disclosed","s":"The Hôpital de Cannes - Simone Veil (CHC-SV) in France experienced a ransomware attack from the LockBit 3.0 group, leading to significant operational disruptions. The hospital announced it would not pay the ransom and has reported the incident to authorities while working to restore its systems.","src":["https://www.bleepingcomputer.com/news/security/french-hospital-chc-sv-refuses-to-pay-lockbit-extortion-demand/"]},{"v":"Synlab Italia","g":"not publicly disclosed","d":"April 18","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All laboratory analysis and sample collection services have been suspended until further notice. The company has started gradually reactivating some services, but no specific recovery timeline was provided.","di":"not publicly disclosed","s":"Synlab Italia suspended all medical diagnostic and testing services following a ransomware attack that forced its IT systems offline. The attack occurred in the early hours of April 18, leading to a complete shutdown of the corporate infrastructure to limit damage. There are concerns that some sensitive medical data may have been exposed to the attackers.","src":["https://www.bleepingcomputer.com/news/security/synlab-italia-suspends-operations-following-ransomware-attack/"]},{"v":"Group Health Cooperative of South Central Wisconsin (GHC-SCW)","g":"BlackSuit","d":"January 25, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"several systems temporarily unavailable; systems secured and brought back online after isolation","di":"533,809 individuals; personal and medical information including names, addresses, telephone numbers, e-mail addresses, dates of birth and/or deaths, social security numbers, member numbers, and Medicare and/or Medicaid numbers","s":"GHC-SCW experienced a ransomware attack in January 2024, where a gang stole personal and medical data of over 533,000 individuals. Although the attackers did not encrypt the devices, they claimed responsibility for the breach and the stolen data included sensitive health information. GHC-SCW has since implemented security measures to prevent future incidents.","src":["https://www.bleepingcomputer.com/news/security/ghc-scw-ransomware-gang-stole-health-data-of-533-000-people/"]},{"v":"NHS Dumfries and Galloway","g":"INC Ransom","d":"March 15, 2023","c":"Scotland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The INC Ransom extortion gang is threatening to leak 3TB of stolen data from NHS Dumfries and Galloway unless a ransom is paid. The data includes sensitive medical information about patients and staff, and the attack has been confirmed to have compromised the organization's IT systems. The Scottish Government is working with various agencies to assess the impact of the breach.","src":["https://www.bleepingcomputer.com/news/security/inc-ransom-threatens-to-leak-3tb-of-nhs-scotland-stolen-data/"]},{"v":"Optum","g":"ALPHV/BlackCat","d":"March 1st","c":"United States","fin":"not publicly disclosed","ran":"$22 million","dt":"not publicly disclosed","di":"4TB of critical data from Optum, affecting tens of insurance companies and other providers","s":"The ALPHV/BlackCat ransomware gang allegedly scammed an affiliate out of a $22 million ransom paid by Optum for the Change Healthcare platform. The affiliate claims to possess 4TB of critical data and has threatened to leak it if their demands are not met. The gang has since shut down its servers, leading to speculation about an exit scam.","src":["https://www.bleepingcomputer.com/news/security/blackcat-ransomware-turns-off-servers-amid-claim-they-stole-22-million-ransom/"]},{"v":"Lurie Children's Hospital","g":"Rhysida","d":"","c":"United States","fin":"not publicly disclosed","ran":"$3.6 million","dt":"Ongoing efforts to restore IT systems; service disruptions still impact operational segments.","di":"600 GB of sensitive medical data; records of over 200,000 children affected.","s":"Lurie Children's Hospital in Chicago was attacked by the Rhysida ransomware gang, which claims to have stolen 600 GB of sensitive data. The hospital's IT systems were taken offline, leading to postponed medical care and significant operational disruptions. The gang is demanding $3.6 million for the stolen data, threatening to leak it if not paid within a week.","src":["https://www.bleepingcomputer.com/news/security/rhysida-ransomware-wants-36-million-for-childrens-stolen-data/"]},{"v":"UnitedHealth Group subsidiary Optum","g":"BlackCat","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"ongoing outage impacting Change Healthcare","di":"not publicly disclosed","s":"The FBI, CISA, and HHS warned U.S. healthcare organizations of targeted BlackCat ransomware attacks, particularly affecting the healthcare sector. The advisory follows a series of breaches linked to the BlackCat gang, which has been active since late 2021 and has extorted over $300 million from victims. The gang's recent activities have led to significant disruptions in healthcare services, including an ongoing outage at Change Healthcare.","src":["https://www.bleepingcomputer.com/news/security/fbi-cisa-warn-us-hospitals-of-targeted-blackcat-ransomware-attacks/"]},{"v":"Capital Health","g":"LockBit","d":"November 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The organization experienced an IT systems outage following the cyberattack, impacting operations for at least a week. All systems have been restored and operations have returned to normal.","di":"7 terabytes of sensitive medical data, over 10 million files","s":"Capital Health, a healthcare service provider, was attacked by the LockBit ransomware gang, which claimed to have stolen sensitive medical data and threatened to leak it if ransom demands were not met. The organization experienced an IT systems outage due to the attack but has since restored operations and is investigating the extent of the data theft.","src":["https://www.bleepingcomputer.com/news/security/capital-health-attack-claimed-by-lockbit-ransomware-risk-of-data-leak/"]},{"v":"Carthage Area Hospital and Claxton-Hepburn Medical Center","g":"LockBit","d":"September 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Carthage Area Hospital and Claxton-Hepburn Medical Center were attacked by the LockBit ransomware gang in September 2023, leading to a disruption in services. The hospitals are now seeking a court order to retrieve stolen data stored on a cloud service provider's servers.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-29th-2023-lockbit-targets-hospitals/"]},{"v":"Katholische Hospitalvereinigung Ostwestfalen (KHO)","g":"Lockbit 3.0","d":"2023-12-24","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Emergency care is unavailable; patient treatment continues with some technical restrictions.","di":"not publicly disclosed","s":"The Lockbit ransomware attack on December 24, 2023, disrupted emergency care at three hospitals operated by KHO in Germany. While patient treatment continues, emergency services are unavailable, leading to potential delays for those needing urgent medical attention.","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-disrupts-emergency-care-at-german-hospitals/"]},{"v":"Integris Health","g":"not publicly disclosed","d":"November 28, 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 2 million patients; includes Social Security Numbers, dates of birth, addresses, phone numbers, insurance information, and employer information","s":"Integris Health, Oklahoma's largest not-for-profit health network, suffered a cyberattack that led to the theft of patient data. Patients received extortion emails claiming their data was stolen and would be sold unless a ransom was paid. The investigation revealed unauthorized access to certain files on November 28, 2023.","src":["https://www.bleepingcomputer.com/news/security/integris-health-patients-get-extortion-emails-after-cyberattack/"]},{"v":"ESO Solutions","g":"not publicly disclosed","d":"September 28","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"2.7 million patients; Full name, Dates of birth, Phone number, Patient account/medical record number, Injury type and date, Diagnosis information, Treatment type and date, Procedure information, Social Security Number (SSN)","s":"ESO Solutions, a healthcare software provider, experienced a ransomware attack that compromised data belonging to 2.7 million patients. The attack involved data exfiltration and encryption of company systems, with sensitive personal data accessed from one machine. The incident was reported to the FBI and state authorities, and impacted customers were notified.","src":["https://www.bleepingcomputer.com/news/security/healthcare-software-provider-data-breach-impacts-27-million/"]},{"v":"Fred Hutchinson Cancer Center","g":"Hunters International","d":"November 19, 2023","c":"USA","fin":"not publicly disclosed","ran":"$50 to prevent data from being sold","dt":"The health organization quarantined the impacted servers and took its clinical network offline to prevent the spread of the threat.","di":"over 800,000 patients' names, Social Security numbers, phone numbers, medical history, lab results, and insurance history","s":"The Hunters International ransomware gang attacked the Fred Hutchinson Cancer Center, threatening to leak sensitive data of over 800,000 patients. The organization took immediate action by quarantining servers and notifying law enforcement, while the attackers sent personalized extortion emails to patients, demanding payment to prevent data disclosure.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-behind-threats-to-fred-hutch-cancer-patients/"]},{"v":"Norton Healthcare","g":"BlackCat/ALPHV","d":"2023-05-09","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"2.5 million individuals; names, contact information, Social Security Numbers, dates of birth, health information, insurance information, medical identification numbers, financial account numbers, driver's licenses, digital signatures","s":"Norton Healthcare confirmed a ransomware attack in May 2023 that exposed personal information of approximately 2.5 million individuals, including patients and employees. The attack was claimed by the BlackCat/ALPHV gang, who alleged to have stolen 4.7TB of data and leaked sensitive files as proof of the breach.","src":["https://www.bleepingcomputer.com/news/security/norton-healthcare-discloses-data-breach-after-may-ransomware-attack/"]},{"v":"Ardent Health Services","g":"not publicly disclosed","d":"November 23, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Ardent took its entire network offline and is working to restore encrypted systems; no definitive timeline for restoration provided.","di":"not publicly disclosed","s":"Ardent Health Services experienced a ransomware attack that disrupted emergency services across six states. The organization took its network offline and is currently investigating the extent of the attack while working to restore access to its systems.","src":["https://www.bleepingcomputer.com/news/security/ardent-hospital-ers-disrupted-in-6-states-after-ransomware-attack/"]},{"v":"Welltok","g":"Clop ransomware gang","d":"July 26, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"8,493,379 individuals; full names, email addresses, physical addresses, telephone numbers, Social Security Numbers, Medicare/Medicaid ID numbers, Health Insurance information","s":"Welltok experienced a data breach that exposed the personal data of nearly 8.5 million patients in the U.S. due to a hack of their MOVEit Transfer server. The breach, attributed to the Clop ransomware gang, involved the theft of sensitive patient information, including Social Security Numbers and health insurance details.","src":["https://www.bleepingcomputer.com/news/security/welltok-data-breach-exposes-data-of-85-million-us-patients/"]},{"v":"MCNA Dental","g":"not publicly disclosed","d":"not publicly disclosed","c":"not publicly disclosed","fin":"$4.45 million","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"8.9 million patients; names, addresses, Social Security numbers, and more","s":"MCNA Dental, one of the largest dental insurance companies in the U.S., suffered a massive ransomware attack that exposed the personal data of up to 8.9 million patients. The incident highlights the vulnerability of healthcare organizations to cybercriminals and the serious implications for patient care.","src":["https://www.bleepingcomputer.com/news/security/the-rise-of-ransomware-in-healthcare-what-it-leaders-need-to-know/"]},{"v":"TransForm Shared Service Organization","g":"DAIXIN Team","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not applicable","dt":"Operational disruptions caused by the attack forced healthcare providers to reschedule appointments and redirect non-emergency cases to other clinics.","di":"Data on 5.6 million patient visits corresponding to 267,000 unique patients; data on 1,446 individuals from Chatham-Kent Health Alliance; data on 352 employees from Erie Shores HealthCare; limited patient data from Windsor Regional Hospital; some patient data from Hôpital-Dieu Grace Healthcare.","s":"TransForm, a shared service provider for multiple hospitals in Ontario, was hit by a ransomware attack that compromised a database containing information on 5.6 million patient visits. The attackers, identified as the DAIXIN Team, exfiltrated data and threatened to leak it, but TransForm confirmed they would not pay the ransom.","src":["https://www.bleepingcomputer.com/news/security/transform-says-ransomware-data-breach-affects-267-000-patients/"]},{"v":"Better Outcomes Registry Network (BORN)","g":"Clop","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"BORN engaged with cybersecurity experts to isolate the impacted servers and contain the threat, which allowed its operations to continue.","di":"3.4 million people affected; exposed data includes full name, home address, postal code, date of birth, health card number, and additional data such as dates of service/care, lab test results, pregnancy risk factors, type of birth, procedures, pregnancy and birth outcomes.","s":"The Better Outcomes Registry Network (BORN) in Ontario experienced a data breach due to the Clop ransomware's MOVEit hacking spree, affecting approximately 3.4 million individuals. The breach involved the theft of sensitive information related to newborns and pregnancy care patients, with BORN taking steps to contain the threat and monitor for any misuse of the data.","src":["https://www.bleepingcomputer.com/news/security/born-ontario-child-registry-data-breach-affects-34-million-people/"]},{"v":"Mayanei Hayeshua hospital","g":"Ragnar Locker","d":"August 2023","c":"Israel","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1 TB of data stolen","s":"The Ragnar Locker ransomware gang claimed responsibility for an attack on Israel's Mayanei Hayeshua hospital, threatening to leak 1 TB of data allegedly stolen during the cyberattack. This incident highlights the ongoing threat of ransomware operations targeting healthcare institutions.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-september-8th-2023-conti-indictments/"]},{"v":"Mom's Meals (PurFoods)","g":"not publicly disclosed","d":"February 22, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1,237,681 people; Date of birth, Driver's license, State identification number, Financial account information, Payment card information, Medical record number, Medicare and Medicaid identification, Health information, Treatment information, Diagnosis code, Meal category and cost, Health insurance information, Patient ID number, Social Security Numbers (for 1% of the exposed people)","s":"Mom's Meals, a medical meal delivery service, experienced a ransomware attack that compromised the personal information of 1.2 million customers and employees. The breach was identified on February 22, 2023, after suspicious activity was detected on their networks, revealing that files had been encrypted and sensitive data accessed by hackers.","src":["https://www.bleepingcomputer.com/news/security/moms-meals-discloses-data-breach-impacting-12-million-people/"]},{"v":"Prospect Medical Holdings","g":"Rhysida","d":"August 3rd","c":"United States","fin":"not publicly disclosed","ran":"50 Bitcoins (worth $1.3 million)","dt":"Hospitals shut down IT networks, forced to use paper charts; systems are now up and running but still restoring patient records.","di":"500,000 social security numbers, passports, driver's licenses, corporate documents, and patient's medical information.","s":"The Rhysida ransomware gang claimed responsibility for a cyberattack on Prospect Medical Holdings, threatening to sell stolen data including 500,000 social security numbers and patient records. The attack, which occurred on August 3rd, forced hospitals to revert to paper records as they shut down their IT networks to contain the breach.","src":["https://www.bleepingcomputer.com/news/security/rhysida-claims-ransomware-attack-on-prospect-medical-threatens-to-sell-data/","https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-11th-2023-targeting-healthcare/"]},{"v":"Comprehensive Medical Care Program (PAMI)","g":"not publicly disclosed","d":"August 2nd 2023","c":"Argentina","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"the site was taken down but was mitigated","di":"not publicly disclosed","s":"The Comprehensive Medical Care Program (PAMI) in Argentina suffered a ransomware cyberattack that encrypted files and demanded a ransom. Official sources confirmed the attack and stated that they are investigating the source of the intrusion, while assuring that operations such as shifts and medicine purchases continued normally.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-4th-2023-targeting-vmware-esxi/"]},{"v":"Eisai","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Eisai, a pharmaceutical company, disclosed that it suffered a ransomware incident that impacted its operations, admitting that attackers encrypted some of its servers. The attack was attributed to the Clop ransomware gang, which has been exploiting vulnerabilities in the MOVEit Transfer platform.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-9th-2023-its-clop-again/"]},{"v":"Harvard Pilgrim Health Care","g":"not publicly disclosed","d":"April 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"2,550,922 people affected; sensitive data stolen","s":"Harvard Pilgrim Health Care disclosed that a ransomware attack in April 2023 impacted over 2.5 million individuals. The threat actors not only encrypted data but also stole sensitive information from compromised systems.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-2nd-2023-whodunit/"]},{"v":"Managed Care of North America (MCNA) Dental","g":"LockBit","d":"March 6, 2023","c":"United States","fin":"not publicly disclosed","ran":"$10 million","dt":"MCNA has taken all appropriate steps to remediate the situation and enhance the security of its systems.","di":"8,923,662 people; personal data including full name, address, date of birth, phone number, email, Social Security number, driver's license number, government-issued ID number, health insurance information, and dental care records.","s":"MCNA Dental experienced a ransomware attack that compromised the personal data of approximately 8.9 million patients. The LockBit ransomware gang claimed responsibility for the attack, threatening to publish sensitive information unless a ransom of $10 million was paid. Following the breach, MCNA has implemented measures to enhance security and has offered identity theft protection to affected individuals.","src":["https://www.bleepingcomputer.com/news/security/mcna-dental-data-breach-impacts-89-million-people-after-ransomware-attack/"]},{"v":"nonprofit behavioral healthcare organization","g":"LockBit, Babuk, Hive","d":"May 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Mikhail Pavlovich Matveev, a Russian citizen, has been charged for his involvement in multiple ransomware operations targeting U.S. critical infrastructure, including healthcare and law enforcement organizations. Notably, in May 2022, he and the Hive ransomware gang encrypted the systems of a nonprofit behavioral healthcare organization in New Jersey.","src":["https://www.bleepingcomputer.com/news/security/russian-ransomware-affiliate-charged-with-attacks-on-critical-infrastructure/"]},{"v":"PharMerica","g":"Money Message","d":"March 12, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"5,815,591 individuals affected; full names, addresses, dates of birth, social security numbers, medications, health insurance information","s":"PharMerica experienced a significant data breach affecting over 5.8 million patients, with hackers stealing sensitive medical data. The Money Message ransomware gang claimed responsibility for the attack, which occurred on March 12, 2023, and published the stolen data on their extortion site on April 9, 2023.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-steals-data-of-58-million-pharmerica-patients/"]},{"v":"Brightline","g":"Clop","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Fortra deactivated the unauthorized user's credentials, turned off the service, and rebuilt their version to eliminate the vulnerability.","di":"783,606 individuals affected; data types include full names, physical addresses, dates of birth, member identification numbers, date of health plan coverage, and employer names.","s":"Brightline, a pediatric mental health provider, experienced a data breach affecting 783,606 patients due to a ransomware attack by the Clop gang, which exploited a zero-day vulnerability in their secure file-sharing platform. The stolen data included sensitive personal health information, prompting Brightline to implement immediate security measures and offer affected individuals identity theft protection services.","src":["https://www.bleepingcomputer.com/news/security/brightline-data-breach-impacts-783k-pediatric-mental-health-patients/"]},{"v":"Hospital Cl nic de Barcelona","g":"DoppelPaymer","d":"March 7th 2023","c":"Spain","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"severely disrupting its healthcare services","di":"not publicly disclosed","s":"The Hospital Cl nic de Barcelona suffered a ransomware attack on March 7th, 2023, which severely disrupted its healthcare services. The attack targeted the institution's virtual machines, leading to significant operational challenges.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-march-10th-2023-police-take-action/"]},{"v":"Regal Medical Group, Lakeside Medical Organization, ADOC Medical Group, Greater Covina Medical","g":"not publicly disclosed","d":"December 1, 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"System restoration process was initiated after the attack was discovered.","di":"3,300,638 patients; Full name, Social Security Number (SSN), Date of birth, Address, Medical diagnosis and treatment, Laboratory test results, Prescription data, Radiology reports, Health plan member number, Phone number","s":"A ransomware attack on multiple medical groups in the Heritage Provider Network in California exposed sensitive information of 3.3 million patients. The attack occurred on December 1, 2022, leading to the compromise of various personal and medical data. The affected organizations have since implemented additional security measures to prevent future incidents.","src":["https://www.bleepingcomputer.com/news/security/california-medical-group-data-breach-impacts-33-million-patients/"]},{"v":"Regal Medical Group","g":"not publicly disclosed","d":"December 1, 2022","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"System restoration process initiated after malware infection was confirmed.","di":"3,300,638 patients; Full name, Social Security Number (SSN), Date of birth, Address, Medical diagnosis and treatment, Laboratory test results, Prescription data, Radiology reports, Health plan member number, Phone number.","s":"Multiple medical groups in the Heritage Provider Network in California suffered a ransomware attack, exposing sensitive patient information of over 3.3 million patients. The attack occurred on December 1, 2022, leading to a significant data breach that included various personal and medical details.","src":["https://www.bleepingcomputer.com/news/security/california-medical-group-data-breach-impacts-33-million-patients/"]},{"v":"AmerisourceBergen","g":"Lorenz","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"AmerisourceBergen confirmed a security breach involving the Lorenz ransomware gang, which leaked allegedly stolen data from one of its subsidiaries. The company is investigating whether sensitive data was compromised and has contained the intrusion.","src":["https://www.bleepingcomputer.com/news/security/drug-distributor-amerisourcebergen-confirms-security-breach/"]},{"v":"Tallahassee Memorial HealthCare (TMH)","g":"not publicly disclosed","d":"February 2nd 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems taken offline and non-emergency procedures suspended","di":"not publicly disclosed","s":"Tallahassee Memorial HealthCare (TMH) suffered a cyberattack that led to the suspension of non-emergency procedures and the taking offline of its IT systems. The attack occurred on February 2nd, 2023, and is part of a larger trend of ransomware attacks targeting healthcare facilities.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-february-3rd-2023-ending-with-a-mess/"]},{"v":"SickKids children's hospital","g":"LockBit","d":"January 1st 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"delays in receiving lab and imaging results and longer wait times for patients","di":"not publicly disclosed","s":"The LockBit ransomware gang attacked the SickKids children's hospital, leading to operational delays. They later provided a free decryptor after claiming that a rogue affiliate violated their policies by targeting the healthcare organization.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-january-6th-2023-targeting-healthcare/"]},{"v":"Hospital for Sick Children (SickKids)","g":"LockBit","d":"2022-12-18","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"SickKids announced that it had restored 50% of its priority systems by December 29th, including those causing diagnostic or treatment delays.","di":"not publicly disclosed","s":"The LockBit ransomware gang attacked SickKids on December 18th, impacting internal systems and causing delays in patient care. Following the incident, the gang apologized and provided a free decryptor, stating that the attack violated their policies against targeting medical institutions.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-apologizes-gives-sickkids-hospital-free-decryptor/"]},{"v":"Lake Charles Memorial Health System","g":"Hive","d":"October 21, 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"269,752 individuals affected; includes full names, physical addresses, dates of birth, medical records, patient identification numbers, health insurance information, payment information, limited clinical information, and Social Security numbers (in some cases)","s":"The Lake Charles Memorial Health System experienced a ransomware attack that impacted nearly 270,000 patients. Hackers gained unauthorized access to the network, stole sensitive files, and the Hive ransomware group later claimed responsibility for the attack, listing LCMHS on their data leak site after failed ransom negotiations.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-at-louisiana-hospital-impacts-270-000-patients/"]},{"v":"Andr-Mignot teaching hospital","g":"not publicly disclosed","d":"December 5th 2022","c":"France","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"significant disruption, causing some patients to be rerouted to other hospitals","di":"not publicly disclosed","s":"The Andr-Mignot teaching hospital in Paris experienced a ransomware attack that led to the shutdown of its phone and computer systems. This incident caused significant disruption, requiring the rerouting of some patients to other hospitals.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-9th-2022-wide-impact/"]},{"v":"CommonSpirit Health","g":"not publicly disclosed","d":"October 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"623,774 patients; Full name, address, phone number(s), date of birth, unique ID","s":"CommonSpirit Health experienced a ransomware attack in October 2022, which exposed the personal data of 623,774 patients. The organization confirmed that unauthorized access occurred between September 16 and October 3, 2022, and that certain files containing personal information were accessed by the threat actors.","src":["https://www.bleepingcomputer.com/news/security/commonspirit-health-ransomware-attack-exposed-data-of-623-000-patients/"]},{"v":"Keralty","g":"RansomHouse","d":"November 30th 2022","c":"Colombia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Patients have had to wait upwards of twelve hours to receive care, with reports of people fainting due to the lack of medical attention.","di":"3TB of data stolen","s":"Keralty, a major healthcare provider in Colombia, suffered a ransomware attack by the RansomHouse group, severely disrupting its operations and websites. The attack resulted in significant delays in patient care, with reports of patients waiting for over twelve hours for medical attention.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-2nd-2022-disrupting-health-care/"]},{"v":"Medibank","g":"REvil","d":"October 26, 2022","c":"Australia","fin":"not publicly disclosed","ran":"no ransom payment will be made","dt":"not publicly disclosed","di":"approximately 9.7 million current and former customers' personal data including names, addresses, dates of birth, phone numbers, email addresses, Medicare numbers, and some health claims data","s":"Medibank, a major Australian health insurer, reported a data breach where the REvil ransomware group leaked sensitive customer information. The leaked data includes personal and health information of millions of customers, and Medibank has stated it will not pay any ransom to the attackers.","src":["https://www.bleepingcomputer.com/news/security/medibank-warns-customers-their-data-was-leaked-by-ransomware-gang/","https://www.medibank.com.au","https://www.afp.gov.au"]},{"v":"Medibank Private Limited","g":"BlogXX","d":"not publicly disclosed","c":"Australia","fin":"not publicly disclosed","ran":"not disclosed","dt":"not publicly disclosed","di":"Approximately 9.7 million current and former customers' names, dates of birth, addresses, phone numbers, email addresses, Medicare numbers, passport numbers, visa details, health claims data for roughly 480,000 customers, health provider details.","s":"A ransomware gang, believed to be a relaunch of REvil and tracked as BlogXX, has threatened to leak stolen data from Medibank, one of Australia's largest health insurers. Medibank confirmed that sensitive information belonging to millions of customers was accessed, including personal details and health claims data, but stated it would not pay the ransom demanded by the attackers.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-threatens-to-release-stolen-medibank-data/"]},{"v":"Australian Clinical Labs","g":"Quantum","d":"February 2022","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"223,000 people affected; 128,608 Medicare numbers, 28,286 credit card numbers, 17,539 individual medical and health records","s":"Australian Clinical Labs disclosed a ransomware attack that exposed sensitive patient data, including Medicare numbers and credit card information, affecting 223,000 individuals. The Quantum ransomware group claimed responsibility and leaked 86GB of data on the dark web, prompting ACL to notify impacted clients and offer credit monitoring services.","src":["https://www.bleepingcomputer.com/news/security/australian-clinical-labs-says-patient-data-stolen-in-ransomware-attack/"]},{"v":"CommonSpirit","g":"not publicly disclosed","d":"October 12th 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Our facilities are following existing protocols for system outages, which includes taking certain systems offline, such as electronic health records.","di":"not publicly disclosed","s":"CommonSpirit confirmed that they suffered a ransomware attack, prompting immediate protective measures and an investigation. They engaged cybersecurity specialists and notified law enforcement to assist in the response process.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-october-14th-2022-bitcoin-trickery/"]},{"v":"Consorci Sanitari Integral (CSI)","g":"not publicly disclosed","d":"October 7th 2022","c":"Spain","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Health activity and patient care are maintained in what does not require computer services, with consultations practically only for emergencies.","di":"not publicly disclosed","s":"The Consorci Sanitari Integral (CSI) suffered a ransomware attack affecting all its healthcare centers in Barcelona and Baix Llobregat. Health workers do not have access to patient information or procedures through computers, limiting consultations to emergencies only.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-october-7th-2022-a-20-year-sentence/"]},{"v":"Consorci Sanitari Integral","g":"not publicly disclosed","d":"October 7th 2022","c":"Spain","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Health activity and patient care are maintained in what does not require computer services, with consultations practically only for emergencies.","di":"not publicly disclosed","s":"The Consorci Sanitari Integral (CSI) suffered a ransomware attack affecting all its healthcare centers in Barcelona and Baix Llobregat. This incident is the second ransomware attack on the organization in two years, severely limiting access to patient information and procedures for health workers.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-october-7th-2022-a-20-year-sentence/"]},{"v":"Empress EMS","g":"LockBit","d":"September 17th 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"customer information","s":"Empress EMS, a New York-based emergency response and ambulance service provider, disclosed a data breach that exposed customer information following a ransomware attack. The incident was attributed to the LockBit ransomware operation.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-september-23rd-2022-lockbit-leak/"]},{"v":"Center Hospitalier Sud Francilien (CHSF)","g":"LockBit 3.0","d":"","c":"France","fin":"$10,000,000","ran":"$10,000,000","dt":"The hospital has referred patients to other establishments and postponed surgeries due to the cyberattack, with ongoing IT system outages affecting operations.","di":"not publicly disclosed","s":"The Center Hospitalier Sud Francilien (CHSF) in France was hit by a ransomware attack that demanded a ransom of $10 million. The attack rendered the hospital's business software and patient information systems inaccessible, leading to the referral of patients to other medical centers and postponement of surgeries.","src":["https://www.bleepingcomputer.com/news/security/french-hospital-hit-by-10m-ransomware-attack-sends-patients-elsewhere/"]},{"v":"Advanced (Managed Service Provider for NHS)","g":"not publicly disclosed","d":"August 4, 2023","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Full service recovery may take a month; reconnecting to environments expected to take at least three to four weeks for some customers.","di":"not publicly disclosed","s":"A ransomware attack on the managed service provider Advanced disrupted emergency services for the UK's National Health Service (NHS). The attack began on August 4, 2023, and has affected several hundred customers using various software solutions. Full recovery is anticipated to take a month as Advanced works to restore services securely.","src":["https://www.bleepingcomputer.com/news/security/uk-nhs-service-recovery-may-take-a-month-after-msp-ransomware-attack/"]},{"v":"Kansas hospital and other American health care providers","g":"Maui","d":"May 2021","c":"United States","fin":"$500,000","ran":"$100,000 and $120,000","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The FBI recovered approximately $500,000 paid by American healthcare providers to the Maui ransomware gang, which targets healthcare organizations. A Kansas hospital paid about $100,000 in May 2021 to restore its IT network after a ransomware attack, and another medical provider in Colorado paid $120,000 shortly thereafter. The quick reporting of these incidents allowed law enforcement to track and seize the ransom payments.","src":["https://www.bleepingcomputer.com/news/security/fbi-recovers-500-000-healthcare-orgs-paid-to-maui-ransomware/"]},{"v":"Professional Finance Company Inc. (PFC)","g":"Quantum","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"affecting over 600 healthcare organizations","s":"Professional Finance Company Inc. (PFC) experienced a ransomware attack in late February that led to a data breach. The incident affected over 600 healthcare organizations, highlighting the significant impact of ransomware on the healthcare sector.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-july-8th-2022-one-down-many-to-go/"]},{"v":"Moises Luis Zagala Gonzalez","g":"Jigsaw and Thanos","d":"not publicly disclosed","c":"Venezuela","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Moises Luis Zagala Gonzalez, a 55-year-old cardiologist, allegedly created and rented Jigsaw and Thanos ransomware to cybercriminals, profiting from a global ransomware ecosystem. He provided support and training to attackers on how to use the ransomware tools, which included features like a 'Doomsday' counter that deletes files until a ransom is paid.","src":["https://www.bleepingcomputer.com/news/security/us-links-thanos-and-jigsaw-ransomware-to-55-year-old-doctor/"]},{"v":"Ireland's Health Service Executive (HSE)","g":"Conti","d":"not publicly disclosed","c":"Ireland","fin":"not publicly disclosed","ran":"$20 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The US Department of State is offering up to $15 million for information on the Conti ransomware gang, which has targeted over 1,000 victims and caused payouts exceeding $150 million. The Conti group is linked to various cybercrime activities and has been responsible for numerous ransomware incidents, including attacks on healthcare organizations.","src":["https://www.bleepingcomputer.com/news/security/us-offers-15-million-reward-for-info-on-conti-ransomware-gang/"]}],"stats":[{"m":"Total Healthcare-sector victims posted on ransomware leak sites (2015-2026, cumulative)","v":"2,443 victims","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint (pulled 2026-07-19/20)","u":"https://api.ransomware.live/v2/sectorvictims/Healthcare"},{"m":"Healthcare-sector victims by year (ransomware.live)","v":"2020: 34 | 2021: 106 | 2022: 206 | 2023: 443 | 2024: 627 | 2025: 627 | 2026 (through Jul 19): 387","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Top ransomware groups targeting Healthcare (by posted-victim count)","v":"Qilin 178, LockBit3 143, Inc Ransom 128, BianLian 92, RansomHub 81, Clop 72, ALPHV/BlackCat 68, Everest 63, Medusa 63","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Top countries for Healthcare-sector victims","v":"US 1,092, GB 58, AU 58, CA 57, IN 56, DE 55, FR 47, BR 45","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Average cost of a US healthcare data breach (2025)","v":"$7.42 million (down from ~$9.77M in 2024); highest of any industry for 14 consecutive years; average detection+containment time 279 days (longest of any industry)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average cost per exposed record / per breach, healthcare","v":"$398 per exposed record; $3.5 million per breach (global, all countries)","s":"IBM Cost of a Data Breach Report 2025 (as reported via HIPAA Journal/IBM insights)","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-healthcare-industry"},{"m":"Healthcare ransom demand and payment trend, 2025","v":"Average ransom demand fell 91% year-over-year to $343K (from $4M in 2024); average ransom paid fell to $150K (from $1.47M) - lowest of any sector surveyed; only 36% of healthcare providers paid (down from 61% in 2022)","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-healthcare"},{"m":"Healthcare mean ransomware recovery cost (excluding ransom), 2025","v":"$1.02 million, down 60% from $2.57 million in 2024","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-healthcare-2025"},{"m":"Data-encryption rate in healthcare ransomware incidents, 2025","v":"34% of attacks resulted in data encryption - a 5-year low; attacks stopped before encryption at a 5-year high","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-healthcare-2025"},{"m":"Confirmed ransomware attacks on healthcare providers, 2024 vs 2025","v":"2024: 181 confirmed attacks on providers, ~25.6 million records affected, avg demand $5.7M, avg paid $900K. 2025: 445 attacks on hospitals/clinics/direct-care providers plus 191 on healthcare businesses (vendors/billing/pharma), avg demand ~$600K","s":"Comparitech Healthcare Ransomware Roundup 2025","u":"https://www.comparitech.com/news/healthcare-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Median ransom paid by healthcare victims, 2025","v":"~$150,000 - among the lowest of any industry tracked","s":"Coveware Quarterly Ransomware Report (via industry press coverage)","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Share of healthcare breaches involving ransomware","v":"48% of all healthcare breaches involved ransomware in the 2026 DBIR reporting period (Nov 2024-Oct 2025), up from 44% the prior year","s":"Verizon 2026 Data Breach Investigations Report, Healthcare Snapshot","u":"https://www.verizon.com/business/resources/reports/2026-dbir-healthcare-snapshot.pdf"},{"m":"Healthcare share of all ransomware attacks, Q2 2025","v":"13.7% of ransomware attacks in Q2 2025 targeted healthcare, among the most-targeted sectors","s":"Coveware Q2 2025 Ransomware Report (via Veeam press release)","u":"https://www.veeam.com/company/press-release/coveware-by-veeam-reveals-q2-2025-ransomware-surge-social-engineering-and-data-exfiltration-drive-record-payouts.html"}]},{"name":"Information Technology","tag":"Technology","overview":"The Information Technology sector (software vendors, IT-services/MSPs, SaaS/cloud hosts, distributors, semiconductor/EDA and telecom-adjacent firms) is one of the two most-targeted industries in ransomware, consistently ranking behind only manufacturing. Its defining risk feature is systemic/aggregation exposure: IT companies sit upstream of thousands of downstream customers, so a single intrusion into an MSP platform (Kaseya), a managed file-transfer product (MOVEit/Progress), a SaaS provider (CDK Global), or a distributor (Ingram Micro) cascades into mass downstream outages and data loss far larger than the direct victim. Beyond encryption-based extortion, the sector is disproportionately exposed to data-theft/leak extortion and intellectual-property theft (source code, chip designs, product blueprints). Common initial-access paths are the sector's own internet-facing edge (VPNs, RMM tools, MFT appliances), leaked/infostealer credentials, and exploitation of vulnerabilities in products the companies themselves ship. Regulatory exposure is intensifying (SEC cyber-disclosure rules, GDPR, breach-notification statutes, and large class-action liability). Sector-level economics per Sophos 2025 and IBM 2025: technology accounts for roughly 9% of ransomware incidents; the average technology-sector data-breach cost is about $4.79M, and the average ransomware/extortion incident costs about $5.08M.","distinct":"One of the two most-targeted industries, behind only manufacturing. Its defining feature is systemic aggregation exposure: software vendors, MSPs, SaaS hosts and distributors sit upstream of thousands of customers, so a single intrusion cascades into mass downstream outage and data loss, Kaseya, MOVEit, CDK Global and Ingram Micro each proved this at scale. For a cyber portfolio this is the sector most capable of generating a single correlated accumulation event across an entire book, and privileged remote-management access makes IT firms both victim and weapon.","leverage":"Downstream customer impact and reputational destruction of the platform, plus source code, IP and customer data theft. Contractual liability to thousands of customers often dwarfs the insured's own restoration cost.","tolerance":"Very low. Minutes to hours for SaaS and hosting under contractual SLAs, with customer attrition and contractual penalties beginning almost immediately.","bulk":{"total":3146,"years":{"2017":1,"2019":8,"2020":34,"2021":163,"2022":198,"2023":401,"2024":783,"2025":1024,"2026":534},"groups":[["clop",213],["qilin",182],["lockbit3",161],["akira",130],["ransomhub",129],["play",117],["incransom",95],["thegentlemen",68]],"countries":[["US",1011],["DE",128],["CA",105],["GB",94],["IN",90],["IT",81]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Kaseya (VSA platform)","g":"REvil / Sodinokibi","d":"2021-07-02","c":"United States","fin":"Direct financial loss to Kaseya not publicly disclosed; downstream impact spanned 800-1,500 businesses across ~17 countries (e.g., Sweden's Coop grocery chain closed ~800 stores). Broader economic cost not authoritatively quantified.","ran":"REvil demanded a single universal-decryptor payment of $70 million in Bitcoin. Kaseya states it did NOT pay the ransom; it obtained a universal decryptor from a 'trusted third party' (later reported as provided via the FBI).","dt":"VSA SaaS and on-prem servers taken offline as a precaution on July 2; p
