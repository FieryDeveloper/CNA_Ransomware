-leaked-nude","https://whyy.org/articles/lehigh-valley-health-data-breach-settlement/"]},{"v":"Medibank Private (major Australian health insurer)","g":"REvil-affiliated actor (Aleksandr Ermakov, later sanctioned by Australia)","d":"Attack detected October 2022; extortion/data leaks began November 2022","c":"Australia","fin":"Not fully quantified in a single public figure in the sources reviewed; the incident drove significant remediation, regulatory, and reputational costs and a multi-year AFP-led international investigation; precise total company cost not publicly disclosed in the sources found.","ran":"Initial demand of roughly US$10 million (A$15 million), later reduced to approximately US$9.7 million; Medibank refused to pay, consistent with Australian government guidance against ransom payments.","dt":"Primarily a data-theft/extortion event rather than an encryption/operational-outage event; core insurance operations were not reported as extensively down.","di":"Personal and health data of approximately 9.7 million current and former customers was compromised, including about 1.8 million international customers; data included Medicare, passport, and driver's licence numbers plus sensitive medical history.","s":"Attackers stole and threatened to publish highly sensitive personal and health data of Medibank's customers, including records revealing abortions, addiction treatment, and mental-health conditions, after the insurer refused a ransom demand, one of Australia's largest ever data breaches and a landmark case in international ransomware attribution/sanctions.","src":["https://techcrunch.com/2022/11/08/ransomware-medibank-australia-health-data/","https://www.insurancejournal.com/news/international/2022/11/14/694867.htm","https://www.minister.defence.gov.au/media-releases/2025-02-12/further-cyber-sanctions-response-medibank-private-cyberattack","https://heimdalsecurity.com/blog/australian-insurer-medibank-confirms-ransomware-attack/"]},{"v":"Synnovis (pathology/blood-testing partner for NHS trusts in London)","g":"Qilin","d":"June 3-4, 2024","c":"United Kingdom","fin":"Specific total financial cost to Synnovis or the NHS trusts was not found publicly quantified in a single disclosed figure in the sources reviewed; disruption was extensive across South-East London NHS services for months.","ran":"Not publicly disclosed.","dt":"Severe disruption began June 3, 2024, with over 11,000 outpatient/elective procedure appointments delayed; some services were affected for months, with normal service levels reported restored by December 2024, roughly six months.","di":"Qilin published approximately 400GB of stolen data on June 20, 2024, including patient names, NHS numbers, and descriptions of blood tests.","s":"A ransomware attack on a third-party pathology provider partnered with Guy's and St Thomas' and King's College Hospital NHS Trusts caused a critical shortage of O-negative blood, cancelled thousands of appointments and procedures, and was later formally identified as a contributing factor in a patient death, one of the clearest documented cases of ransomware causing loss of life via a healthcare supply-chain/third-party vector.","src":["https://www.hipaajournal.com/care-disrupted-at-london-hospitals-due-to-ransomware-attack-on-pathology-vendor/","https://therecord.media/ransomware-nhs-cyberattack-disruption","https://www.england.nhs.uk/synnovis-cyber-incident/","https://insight.scmagazineuk.com/synnovis-2024-attack-contributing-factor-in-patient-death","https://www.infosecurity-magazine.com/news/synnovis-breach-notification-2024/"]},{"v":"Enzo Biochem, Inc.","g":"not publicly disclosed","d":"2023-04-06","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company activated its disaster recovery plan, allowing it to continue operations while restoring systems. Back-up procedures caused operational challenges and delays in processing laboratory specimens.","di":"Certain data was extracted from the Company’s information technology systems; specific records or data types not publicly disclosed.","s":"On April 6, 2023, Enzo Biochem, Inc. experienced a ransomware attack that impacted its IT systems. The Company implemented containment measures and launched an investigation, discovering that certain data was extracted from its systems as part of the incident.","src":["https://www.sec.gov/Archives/edgar/data/316253/000121390023029594/ea176929-8k_enzo.htm"]},{"v":"Omnicell, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Omnicell, Inc. experienced a ransomware incident that led to significant operational challenges. The company has been focused on addressing the impact of this incident while continuing to provide medication management solutions.","src":["https://www.sec.gov/Archives/edgar/data/926326/000092632623000027/exhibit991q2-23.htm"]},{"v":"Akumin Inc.","g":"bianlian","d":"2023-11-02","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The majority of systems have been restored, with most cancer centers treating patients and operations online, though some services remain unavailable and certain locations are temporarily closed.","di":"not publicly disclosed","s":"Akumin Inc. announced on November 2, 2023, that it has made significant progress in restoring its business activities and systems following a ransomware incident disclosed on October 16, 2023. Most of its cancer centers are now operational, allowing patient appointments to be scheduled, although some services and locations are still not fully restored.","src":["https://www.sec.gov/Archives/edgar/data/1776197/000177619723000028/aku-20231102.htm","https://akumin.com/service-updates/"]},{"v":"DaVita Inc.","g":"interlock","d":"2025-04-12","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"On April 12, 2025, DaVita Inc. experienced a ransomware incident that encrypted certain elements of their network. The company activated response protocols, isolated impacted systems, and is working with cybersecurity professionals to assess and remediate the situation while continuing to provide patient care.","src":["https://www.sec.gov/Archives/edgar/data/927066/000119312525079593/d948299d8k.htm"]},{"v":"TELA Bio, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"TELA Bio, Inc. experienced a ransomware attack that impacted procedures at some of their largest accounts, contributing to a shortfall in revenue growth. The company reported a revenue of $16.1 million for the second quarter of 2024, reflecting an 11% increase from the previous year, despite the disruptions caused by the cyberattack.","src":["https://www.sec.gov/Archives/edgar/data/1561921/000110465924088353/tm2421368d1_ex99-1.htm"]},{"v":"Stryker","g":"handala","d":"03/23/2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Stryker experienced a network disruption but found no evidence of ransomware or malware. The incident was contained, and there was no indication of malicious activity directed towards customers or partners. The company is prioritizing the restoration of systems that support customer operations and manufacturing capabilities.","src":["https://www.sec.gov/Archives/edgar/data/310764/000119312526118634/d94012dex992.htm"]},{"v":"Allied Healthcare Products, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Allied Healthcare Products, Inc. experienced a ransomware attack during the COVID-19 pandemic, which contributed to operational inefficiencies and cash strain. The company is now implementing strategic transformation initiatives under new leadership to improve operational effectiveness and drive growth.","src":["https://www.sec.gov/Archives/edgar/data/874710/000110465923033243/tm239758d1_ex99-2.htm"]},{"v":"Change Healthcare Solutions LLC","g":"not publicly disclosed","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Change Healthcare Solutions LLC experienced a ransomware cyberattack that disrupted patient billing and collections, impacting the broader healthcare industry. This incident contributed to a decrease in revenue for Greenbrook TMS Inc. in Q1 2024, despite their efforts to restructure and expand treatment offerings.","src":["https://www.sec.gov/Archives/edgar/data/1735948/000110465924061255/tm2414236d1_ex99-1.htm"]}],"stats":[{"m":"Total Healthcare-sector victims posted on ransomware leak sites (2015-2026, cumulative)","v":"2,443 victims","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint (pulled 2026-07-19/20)","u":"https://api.ransomware.live/v2/sectorvictims/Healthcare"},{"m":"Healthcare-sector victims by year (ransomware.live)","v":"2020: 34 | 2021: 106 | 2022: 206 | 2023: 443 | 2024: 627 | 2025: 627 | 2026 (through Jul 19): 387","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Top ransomware groups targeting Healthcare (by posted-victim count)","v":"Qilin 178, LockBit3 143, Inc Ransom 128, BianLian 92, RansomHub 81, Clop 72, ALPHV/BlackCat 68, Everest 63, Medusa 63","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Top countries for Healthcare-sector victims","v":"US 1,092, GB 58, AU 58, CA 57, IN 56, DE 55, FR 47, BR 45","s":"ransomware.live v2 API, sectorvictims/Healthcare endpoint","u":""},{"m":"Average cost of a US healthcare data breach (2025)","v":"$7.42 million (down from ~$9.77M in 2024); highest of any industry for 14 consecutive years; average detection+containment time 279 days (longest of any industry)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average cost per exposed record / per breach, healthcare","v":"$398 per exposed record; $3.5 million per breach (global, all countries)","s":"IBM Cost of a Data Breach Report 2025 (as reported via HIPAA Journal/IBM insights)","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-healthcare-industry"},{"m":"Healthcare ransom demand and payment trend, 2025","v":"Average ransom demand fell 91% year-over-year to $343K (from $4M in 2024); average ransom paid fell to $150K (from $1.47M) - lowest of any sector surveyed; only 36% of healthcare providers paid (down from 61% in 2022)","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-healthcare"},{"m":"Healthcare mean ransomware recovery cost (excluding ransom), 2025","v":"$1.02 million, down 60% from $2.57 million in 2024","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-healthcare-2025"},{"m":"Data-encryption rate in healthcare ransomware incidents, 2025","v":"34% of attacks resulted in data encryption - a 5-year low; attacks stopped before encryption at a 5-year high","s":"Sophos State of Ransomware in Healthcare 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-healthcare-2025"},{"m":"Confirmed ransomware attacks on healthcare providers, 2024 vs 2025","v":"2024: 181 confirmed attacks on providers, ~25.6 million records affected, avg demand $5.7M, avg paid $900K. 2025: 445 attacks on hospitals/clinics/direct-care providers plus 191 on healthcare businesses (vendors/billing/pharma), avg demand ~$600K","s":"Comparitech Healthcare Ransomware Roundup 2025","u":"https://www.comparitech.com/news/healthcare-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Median ransom paid by healthcare victims, 2025","v":"~$150,000 - among the lowest of any industry tracked","s":"Coveware Quarterly Ransomware Report (via industry press coverage)","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Share of healthcare breaches involving ransomware","v":"48% of all healthcare breaches involved ransomware in the 2026 DBIR reporting period (Nov 2024-Oct 2025), up from 44% the prior year","s":"Verizon 2026 Data Breach Investigations Report, Healthcare Snapshot","u":"https://www.verizon.com/business/resources/reports/2026-dbir-healthcare-snapshot.pdf"},{"m":"Healthcare share of all ransomware attacks, Q2 2025","v":"13.7% of ransomware attacks in Q2 2025 targeted healthcare, among the most-targeted sectors","s":"Coveware Q2 2025 Ransomware Report (via Veeam press release)","u":"https://www.veeam.com/company/press-release/coveware-by-veeam-reveals-q2-2025-ransomware-surge-social-engineering-and-data-exfiltration-drive-record-payouts.html"}]},{"name":"Information Technology","tag":"Technology","overview":"The Information Technology sector (software vendors, IT-services/MSPs, SaaS/cloud hosts, distributors, semiconductor/EDA and telecom-adjacent firms) is one of the two most-targeted industries in ransomware, consistently ranking behind only manufacturing. Its defining risk feature is systemic/aggregation exposure: IT companies sit upstream of thousands of downstream customers, so a single intrusion into an MSP platform (Kaseya), a managed file-transfer product (MOVEit/Progress), a SaaS provider (CDK Global), or a distributor (Ingram Micro) cascades into mass downstream outages and data loss far larger than the direct victim. Beyond encryption-based extortion, the sector is disproportionately exposed to data-theft/leak extortion and intellectual-property theft (source code, chip designs, product blueprints). Common initial-access paths are the sector's own internet-facing edge (VPNs, RMM tools, MFT appliances), leaked/infostealer credentials, and exploitation of vulnerabilities in products the companies themselves ship. Regulatory exposure is intensifying (SEC cyber-disclosure rules, GDPR, breach-notification statutes, and large class-action liability). Sector-level economics per Sophos 2025 and IBM 2025: technology accounts for roughly 9% of ransomware incidents; the average technology-sector data-breach cost is about $4.79M, and the average ransomware/extortion incident costs about $5.08M.","distinct":"One of the two most-targeted industries, behind only manufacturing. Its defining feature is systemic aggregation exposure: software vendors, MSPs, SaaS hosts and distributors sit upstream of thousands of customers, so a single intrusion cascades into mass downstream outage and data loss, Kaseya, MOVEit, CDK Global and Ingram Micro each proved this at scale. For a cyber portfolio this is the sector most capable of generating a single correlated accumulation event across an entire book, and privileged remote-management access makes IT firms both victim and weapon.","leverage":"Downstream customer impact and reputational destruction of the platform, plus source code, IP and customer data theft. Contractual liability to thousands of customers often dwarfs the insured's own restoration cost.","tolerance":"Very low. Minutes to hours for SaaS and hosting under contractual SLAs, with customer attrition and contractual penalties beginning almost immediately.","bulk":{"total":3146,"years":{"2017":1,"2019":8,"2020":34,"2021":163,"2022":198,"2023":401,"2024":783,"2025":1024,"2026":534},"groups":[["clop",213],["qilin",182],["lockbit3",161],["akira",130],["ransomhub",129],["play",117],["incransom",95],["thegentlemen",68]],"countries":[["US",1011],["DE",128],["CA",105],["GB",94],["IN",90],["IT",81]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Kaseya (VSA platform)","g":"REvil / Sodinokibi","d":"2021-07-02","c":"United States","fin":"Direct financial loss to Kaseya not publicly disclosed; downstream impact spanned 800-1,500 businesses across ~17 countries (e.g., Sweden's Coop grocery chain closed ~800 stores). Broader economic cost not authoritatively quantified.","ran":"REvil demanded a single universal-decryptor payment of $70 million in Bitcoin. Kaseya states it did NOT pay the ransom; it obtained a universal decryptor from a 'trusted third party' (later reported as provided via the FBI).","dt":"VSA SaaS and on-prem servers taken offline as a precaution on July 2; patched VSA restored around July 11-12; a universal decryptor was distributed on July 22-23, 2021 to help victims restore data. Recovery for downstream MSP clients ran days to weeks.","di":"Primarily encryption/availability impact rather than mass data theft; up to ~1,500 downstream organizations had systems encrypted.","s":"REvil exploited zero-day vulnerabilities in Kaseya's VSA remote-monitoring-and-management software to push ransomware through ~60 direct MSP customers to their downstream clients, the archetypal IT supply-chain cascade attack.","src":["https://en.wikipedia.org/wiki/Kaseya_VSA_ransomware_attack","https://www.cisa.gov/news-events/alerts/2021/07/04/cisa-fbi-guidance-msps-and-their-customers-affected-kaseya-vsa-supply-chain-ransomware-attack","https://www.csoonline.com/article/571081/the-kaseya-ransomware-attack-a-timeline.html"]},{"v":"Progress Software (MOVEit Transfer)","g":"Clop (Cl0p / TA505)","d":"2023-05-27","c":"United States","fin":"Aggregate downstream cost estimated by Emsisoft at roughly $10.6B-$15.8B (using IBM's per-record cost); some scaled estimates ran far higher. Progress Software's own direct costs not fully disclosed; it faced an SEC investigation and dozens of class-action lawsuits (40M+ claimants).","ran":"Clop did not encrypt systems; it demanded extortion payments from individual victim organizations (amounts varied and were not publicly itemized). Many victims declined to pay.","dt":"This was a data-theft (not encryption) event, so impact was breach-remediation and notification rather than operational downtime; remediation and victim-notification stretched over many months into 2024.","di":"Over 2,700 organizations confirmed impacted and approximately 93.3 million individuals' personal data exposed (estimates ranged 64M-95M+ over time).","s":"Clop mass-exploited a zero-day SQL-injection flaw (CVE-2023-34362) in Progress Software's MOVEit managed-file-transfer product to steal data from thousands of organizations worldwide, one of the largest supply-chain data-extortion campaigns on record.","src":["https://en.wikipedia.org/wiki/2023_MOVEit_data_breach","https://www.emsisoft.com/en/blog/44123/unpacking-the-moveit-breach-statistics-and-analysis/","https://techcrunch.com/2023/08/25/moveit-mass-hack-by-the-numbers/","https://www.cybersecuritydive.com/news/progress-software-moveit-meltdown/703659/"]},{"v":"CDK Global","g":"BlackSuit","d":"2024-06-18","c":"United States","fin":"Anderson Economic Group estimated total dealer losses exceeding $1 billion (revised up from ~$944M) from roughly two-plus weeks of disruption.","ran":"BlackSuit initially demanded ~$10M, reportedly escalating toward $50M+. CDK is widely reported to have paid approximately $25 million in Bitcoin (wallets tied to BlackSuit received ~$25M about two days after the attack, per CyberScoop).","dt":"Dealerships reverted to manual/pen-and-paper processes for nearly two weeks; CDK announced services restored for nearly all dealerships by around July 4, 2024.","di":"Primarily operational outage; extent of any data exfiltration less publicly quantified than the operational and financial disruption.","s":"BlackSuit ransomware crippled CDK Global's Dealer Management System SaaS, which powers operations for ~15,000 auto dealerships across the U.S. and Canada; a second intrusion during recovery on June 19 prolonged the outage.","src":["https://cyberscoop.com/cdk-ransom-blacksuit-25-million/","https://www.techtarget.com/whatis/feature/The-CDK-Global-outage-Explaining-how-it-happened","https://www.blackfog.com/cdk-global-ransomware-attack/"]},{"v":"Ingram Micro","g":"SafePay","d":"2025-07-03","c":"United States","fin":"Specific revenue loss not publicly disclosed; multi-day global halt of order processing at a distributor with ~$48B annual revenue implies material lost/delayed transactions, though the company did not quantify it publicly.","ran":"Ransom amount not publicly disclosed; on July 29-30, 2025 SafePay threatened to leak ~3.5TB of allegedly stolen data unless paid. No confirmation of payment.","dt":"Systems failed around 8:00 AM ET on July 3; website and staged order processing resumed July 7-8; the company reported operations back to normal worldwide by July 9, 2025.","di":"Reported exposure of personal data of over 42,000 employees and applicants; SafePay claimed ~3.5TB of data.","s":"SafePay ransomware caused a global outage at Ingram Micro, one of the world's largest IT distributors; intrusion is attributed to compromised credentials on the Palo Alto GlobalProtect VPN, halting worldwide order processing.","src":["https://www.bleepingcomputer.com/news/security/ingram-micro-outage-caused-by-safepay-ransomware-attack/","https://www.darkreading.com/cyberattacks-data-breaches/ransomware-attack-outage-ingram-micro","https://www.webpronews.com/ingram-micro-ransomware-attack-by-safepay-exposes-42000-employee-records/"]},{"v":"Quanta Computer (Apple supplier)","g":"REvil / Sodinokibi","d":"2021-04-20","c":"Taiwan","fin":"Not publicly disclosed. Impact was primarily reputational and IP-confidentiality loss (leaked device blueprints) rather than reported revenue loss.","ran":"REvil demanded $50 million, reportedly escalating toward $100M; the ransom was not paid by Quanta (and REvil eventually removed the leaked files). No confirmed payment.","dt":"Operational downtime not the primary reported impact; this was chiefly a data-exfiltration/IP-leak extortion event.","di":"Theft and partial publication of confidential design schematics/blueprints for unreleased Apple devices (MacBook, Apple Watch drawings).","s":"After Quanta (a major Apple ODM) declined to pay, REvil pivoted to extort Apple directly, publishing stolen schematics for unreleased products, timed to Apple's 'Spring Loaded' launch event, a landmark IP-theft extortion in the tech hardware supply chain.","src":["https://www.techrepublic.com/article/apple-supplier-quanta-hit-with-50-million-ransomware-attack-from-revil/","https://www.forbes.com/sites/daveywinder/2021/04/23/ransomware-gang-demands-50-million-for-apple-watch-and-macbook-pro-blueprints/","https://www.cnbc.com/2021/04/23/axis-of-revil-inside-the-hacker-collective-taunting-apple.html"]},{"v":"Software AG","g":"Clop (Cl0p)","d":"2020-10-03","c":"Germany","fin":"Direct financial loss not fully disclosed; the company reported internal-network disruption but said customer-facing cloud services were unaffected.","ran":"Clop demanded approximately $23 million. Software AG refused to pay.","dt":"Internal network, help desk and some internal communications were disrupted for a period in October 2020; customer cloud services remained operational.","di":"About 1TB of data stolen, including employee passport/ID data, health-related documents and internal emails; screenshots and files leaked publicly after negotiations broke down.","s":"Clop ransomware struck German enterprise-software giant Software AG, encrypting internal systems and stealing about 1TB of data, then publishing files after the company refused to negotiate, an early high-profile double-extortion case in the software industry.","src":["https://www.bleepingcomputer.com/news/security/software-ag-it-giant-hit-with-23-million-ransom-by-clop-ransomware/","https://threatpost.com/software-ag-data-clop-ransomware/160042/","https://www.infosecurity-magazine.com/news/software-ag-datastealing/"]},{"v":"Tata Technologies","g":"Hunters International","d":"2025-01","c":"India","fin":"Not publicly disclosed; the company said client-delivery services remained unaffected. No quantified revenue loss reported.","ran":"Specific ransom amount not disclosed; Hunters International threatened public release of the data and, when unpaid, leaked it (~730,000 files) on its dark-web site in March 2025.","dt":"Temporary disruption to some IT services per the January stock-exchange disclosure; client delivery reported unaffected. Detailed recovery timeline not publicly quantified.","di":"Claimed theft of 1.4TB (~730,000 files) including current/former employee personal details, purchase orders and confidential customer contracts (India and U.S. customers).","s":"Hunters International claimed a January 2025 ransomware attack on Tata Technologies (engineering/IT-services arm of the Tata group), later leaking 1.4TB of stolen data; Tata Motors disclosed a ransomware incident to Indian stock exchanges.","src":["https://www.bleepingcomputer.com/news/security/hunters-international-ransomware-claims-attack-on-tata-technologies/","https://techcrunch.com/2025/03/11/tata-technologies-data-leaked-by-ransomware-gang/","https://securityaffairs.com/174953/data-breach/ransomware-group-hunters-international-claims-to-have-hacked-tata-technologies.html"]},{"v":"QuickLogic Corporation","g":"not publicly disclosed","d":"January 20, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company has continued its business operations during this incident and successfully restored all of its critical operational data.","di":"not publicly disclosed","s":"On January 20, 2023, QuickLogic Corporation detected a ransomware infection affecting a limited number of IT systems. The Company promptly began an assessment, notified law enforcement, and engaged cybersecurity professionals to investigate the incident.","src":["https://www.sec.gov/Archives/edgar/data/882508/000143774923006511/ex_488676.htm"]},{"v":"NCR Corporation","g":"not publicly disclosed","d":"2023-04-17","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"On April 17, 2023, NCR Corporation announced that a single data center outage affecting some functionality for its commerce customers was caused by a cyber ransomware incident. The company is assessing the impact of the incident on its operations and financial results.","src":["https://www.sec.gov/Archives/edgar/data/70866/000119312523103016/d472247d8k.htm","https://www.sec.gov"]},{"v":"DISH Network Corporation","g":"not publicly disclosed","d":"February 23, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Corporation's internal communications, customer call centers, and internet sites have been affected, but DISH, Sling, and their wireless and data networks remain operational. The Corporation is actively engaged in restoring the affected systems and is making steady progress.","di":"It is possible that the extracted data includes personal information.","s":"On February 23, 2023, DISH Network Corporation announced a network outage due to a cyber-security incident. Following the incident, it was determined that certain data was extracted from the Corporation's IT systems, potentially including personal information, prompting an ongoing investigation.","src":["https://www.sec.gov/Archives/edgar/data/1001082/000155837023002254/dish-20230223x8k.htm"]},{"v":"NCR Voyix Corporation","g":"not publicly disclosed","d":"April 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"NCR Voyix Corporation experienced a ransomware incident in April 2023, which impacted its business operations. The company has since been working on efforts to prevent or mitigate such incidents in the future.","src":["https://www.sec.gov/Archives/edgar/data/70866/000007086624000023/exhibit992-q12024callsli.htm"]},{"v":"AFG Companies, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"AFG Companies, Inc. is facing a lawsuit from Brand Engagement Network Inc. (BEN) for allegedly concealing a ransomware attack on their network prior to an agreement signed in August 2023. The lawsuit claims that this concealment hindered BEN's ability to deliver AI solutions to automotive dealerships, causing significant delays and damaging trust in the partnership.","src":["https://www.sec.gov/Archives/edgar/data/1838163/000149315225002670/ex99-1.htm"]},{"v":"Rackspace Technology","g":"not publicly disclosed","d":"late 2022","c":"not publicly disclosed","fin":"~$30M","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Rackspace Technology experienced a ransomware attack at the end of 2022, which was highly publicized and resulted in a loss of approximately $30 million in high-margin revenue. The company has since implemented a strategy to transform its business and mitigate the impact of the attack.","src":["https://www.sec.gov/Archives/edgar/data/1810019/000181001924000029/rxtlenderpresentationcle.htm"]},{"v":"Ingram Micro Holding Corporation","g":"not publicly disclosed","d":"July 5, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company is working diligently to restore the affected systems to process and ship orders.","di":"not publicly disclosed","s":"Ingram Micro identified ransomware on certain internal systems and took steps to secure the environment, including taking systems offline. The Company is investigating the incident with cybersecurity experts and has notified law enforcement.","src":["https://www.sec.gov/Archives/edgar/data/1897762/000162828025034372/pressrelease-cybersecurity.htm"]},{"v":"Data I/O Corporation","g":"not publicly disclosed","d":"August 16, 2025","c":"USA","fin":"$180,000","ran":"not publicly disclosed","dt":"All systems operational with no impact to customers or orders; incident contained and remediated.","di":"not publicly disclosed","s":"Data I/O Corporation reported a ransomware incident that was identified on August 16, 2025. The attack was not targeted and originated from a vulnerability in a third-party firewall service. The company has restored all systems and believes there was no revenue loss due to the incident.","src":["https://www.sec.gov/Archives/edgar/data/351998/000165495425010613/daio_ex990.htm"]},{"v":"Trio-Tech International","g":"not publicly disclosed","d":"2026-03-11","c":"Singapore","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The subsidiary took its network offline and is in the process of restoring affected systems.","di":"The scope of the data potentially affected has not yet been fully determined.","s":"On March 11, 2026, Trio-Tech International's subsidiary in Singapore experienced a ransomware incident that resulted in the encryption of certain files. The incident escalated on March 18, leading to the unauthorized disclosure of company data, prompting the company to activate response protocols and notify law enforcement.","src":["https://www.sec.gov/Archives/edgar/data/732026/000143774926009193/trt20260320_8k.htm"]},{"v":"Brand Engagement Network Inc.","g":"not publicly disclosed","d":"2025-01-16","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Brand Engagement Network Inc. reported a ransomware attack on its network shortly before the termination of an Exclusive Reseller Agreement with AFG Companies, Inc. The company has filed a lawsuit against AFG alleging fraudulent misrepresentation and breach of contract related to the attack.","src":["https://www.sec.gov/Archives/edgar/data/1838163/000149315225002670/form8-k.htm"]}],"stats":[{"m":"Technology share of ransomware incidents (2nd most-targeted sector, behind manufacturing at 14%)","v":"~9% of incidents","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/content/state-of-ransomware"},{"m":"Average ransomware recovery cost (all sectors, excl. ransom)","v":"$1.53M (down 44% from $2.73M in 2024)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Median ransom payment (all sectors)","v":"$1.0M (down from $1.26M prior year)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average cost of an extortion/ransomware incident","v":"$5.08M","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Average data-breach cost, Technology sector","v":"$4.79M","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average data-breach cost (all industries)","v":"$4.44M (down 9% from $4.88M)","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Average ransom payment, Q4 2024","v":"$553,959 (+16% QoQ)","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Median ransom payment, Q4 2024","v":"$110,890 (-45% QoQ)","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Share of victims paying a ransom, Q4 2024 (all-time low)","v":"25%","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Share of breaches involving ransomware","v":"44% (up from 32% prior year); 88% among SMBs","s":"Verizon DBIR 2025","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Median ransomware payout / share refusing to pay","v":"Median $115K; 64% of victims refused to pay","s":"Verizon DBIR 2025","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Total tracked ransom payments, 2024","v":"~$813.55M (down ~35% from $1.25B record in 2023)","s":"Chainalysis 2025 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-crime-ransomware-victim-extortion-2025/"},{"m":"CDK Global downstream dealer losses (single IT-SaaS incident)","v":">$1B (Anderson Economic Group)","s":"Anderson Economic Group via TechTarget/CyberScoop","u":"https://www.techtarget.com/whatis/feature/The-CDK-Global-outage-Explaining-how-it-happened"},{"m":"MOVEit/Progress downstream scope (single IT supply-chain incident)","v":"2,700+ organizations; ~93.3M individuals; est. aggregate cost ~$10.6B-$15.8B","s":"Emsisoft / Wikipedia MOVEit analysis","u":"https://www.emsisoft.com/en/blog/44123/unpacking-the-moveit-breach-statistics-and-analysis/"}]},{"name":"Manufacturing","tag":"Manufacturing","overview":"Manufacturing has been the single most-targeted sector by ransomware operators for five consecutive years through 2025, driven by a combination of high operational-downtime sensitivity (which pressures victims toward paying quickly), widespread reliance on legacy OT/ICS equipment with long refresh cycles, deep tiered supply-chain interdependency that multiplies contingent business-interruption exposure, and valuable intellectual property/trade-secret data. The ransomware.live \"Manufacturing\" sector tag alone contains 4,434 recorded victim postings, with year-over-year posting volume roughly quadrupling from 2021 (295) to 2025 (1,204), and the sector accounting for an estimated one in four ransomware attacks globally by 2025 per industry trackers. Attack economics are shifting: per Sophos's 2025 manufacturing-specific report, successful encryption rates have fallen sharply (74% to 40% YoY) as defenses improve, but attackers are compensating by shifting toward pure data theft and extortion, and average ransom demands against manufacturers have risen even as median demands/payments across all sectors trend down. High-profile incidents, from Norsk Hydro's ~$70M LockerGoga attack (2019) through Honda's global OT-targeted Snake/EKANS shutdown (2020), Foxconn Mexico's $34M DoppelPaymer demand (2020), Bridgestone's 30-plant, 10-day shutdown (2022), Continental's 40TB data-theft/$50M extortion (2022), and Nissan Australia's 100,000-person PII breach (2023), illustrate the sector's dual exposure to both OT-driven physical-production disruption and conventional IT-driven data-theft/extortion, often within the same threat-actor toolkit.","distinct":"The most-targeted sector for five consecutive years through 2025, with 4,434 leak-site postings. Combines legacy OT/ICS estates on decade-plus refresh cycles with deep tiered supply-chain interdependency and valuable trade-secret data. A weak IT/OT boundary means an IT-side encryption event routinely halts physical production, and a single Tier-2 supplier outage idles multiple OEMs, producing contingent business interruption invisible on the direct victim's own policy.","leverage":"Production downtime. Ransom is priced against per-hour output loss and contractual delivery penalties, secondarily against theft of designs, process IP and trade secrets.","tolerance":"Very low. Hours to a few days; continuous-process and just-in-time operations tolerate least, and idle-line cost accrues immediately regardless of data outcome.","bulk":{"total":4439,"years":{"2016":1,"2017":5,"2018":1,"2019":6,"2020":46,"2021":296,"2022":511,"2023":880,"2024":816,"2025":1204,"2026":673},"groups":[["akira",363],["lockbit3",323],["qilin",304],["play",263],["blackbasta",148],["lockbit2",145],["clop",142],["alphv",112]],"countries":[["US",1371],["DE",251],["CA",165],["GB",135],["IT",134],["JP",96]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Norsk Hydro","g":"LockerGoga","d":"2019-03-18","c":"Norway","fin":"Total financial impact reached approximately $70-75 million, per Norsk Hydro's own quarterly financial disclosures; initial Q1 2019 losses were estimated at $35-41 million with additional Q2 losses of $23-29 million.","ran":"Ransom amount not publicly disclosed by attackers in a fixed figure; Norsk Hydro refused to pay the ransom entirely and rebuilt systems from backups instead.","dt":"Several aluminum extrusion plants were forced to switch to manual operations for an extended period; full IT recovery took multiple weeks, with the company reporting it was still not at 100% normal operations several weeks after the attack. Microsoft's incident response team was brought in to assist recovery.","di":"Primarily an availability/encryption event rather than a large-scale data-exfiltration/extortion case (LockerGoga predates widespread double-extortion); no large trove of stolen customer data was reported leaked.","s":"One of the most consequential OT-impacting ransomware attacks in manufacturing history; the global aluminum producer was forced into manual/paper-based operations across dozens of plants after LockerGoga encrypted IT systems that also touched production processes. Norsk Hydro refused to pay the ransom and publicly disclosed the incident in near-real time, becoming a widely cited case study in transparent incident response.","src":["https://www.securityweek.com/ransomware-attack-costs-norsk-hydro-tens-millions-dollars/","https://www.computerweekly.com/news/252467199/Norsk-Hydro-cyber-attack-could-cost-up-to-75m","https://news.microsoft.com/source/features/digital-transformation/hackers-hit-norsk-hydro-ransomware-company-responded-transparency/","https://www.darkreading.com/cyberattacks-data-breaches/6-things-to-know-about-the-ransomware-that-hit-norsk-hydro"]},{"v":"Honda Motor Co.","g":"Snake/EKANS","d":"2020-06-07","c":"Japan (global operations affected)","fin":"Not publicly disclosed as a specific dollar figure by Honda; industry analyses characterize the loss as significant given multi-day, multi-plant global production stoppage but no official cost figure was released.","ran":"Not publicly disclosed; no confirmed ransom payment reported.","dt":"Production and sales of cars, motorcycles, and power/marine products was suspended at plants across multiple countries for several days before systems were restored; exact recovery timeline varied by site.","di":"Primarily an OT/production-availability event; no large confirmed customer data leak was publicly reported in connection with this specific 2020 incident.","s":"EKANS ransomware, one of the first ransomware strains purpose-built to target ICS/OT process-control software, hit Honda's internal network, forcing production and sales halts at multiple plants worldwide (Japan, US, UK, Turkey, Brazil, India, and elsewhere). Likely initial access was via an exposed RDP connection.","src":["https://www.theregister.com/2020/06/09/honda_ransomware_snake_ekans_malware/","https://www.computerweekly.com/news/252484389/Honda-investigates-suspected-Snake-ransomware-attack","https://cyote.inl.gov/content/uploads/24/2025/12/CyOTE-Case-Study_EKANS.pdf"]},{"v":"Foxconn (CTBG MX plant, Ciudad Juárez)","g":"DoppelPaymer","d":"2020-11-29","c":"Mexico","fin":"Not publicly disclosed as an official incident-cost figure by Foxconn; the destruction of 20-30 TB of backup data materially increased recovery cost and complexity beyond the ransom figure itself.","ran":"DoppelPaymer demanded 1,804.0955 BTC, reported at the time as approximately $34 million (some sources cite ~$32.97 million); Foxconn did not pay, and stolen data was later published on the dark web.","dt":"Foxconn confirmed the ransomware disrupted production operations at the affected Mexico facility; precise recovery timeline in days not independently confirmed in public reporting beyond confirmation that normal operations were eventually restored.","di":"Approximately 100 GB of unencrypted files were stolen prior to encryption (double-extortion); 20-30 TB of backup data was deliberately deleted by the attackers to hamper recovery.","s":"Electronics-manufacturing giant Foxconn's Mexico facility was hit over the Thanksgiving 2020 weekend; attackers encrypted roughly 1,200 servers, exfiltrated data, and destroyed a large volume of backups before demanding a very large ransom.","src":["https://www.bleepingcomputer.com/news/security/foxconn-electronics-giant-hit-by-ransomware-34-million-ransom/","https://www.securityweek.com/foxconn-confirms-ransomware-hit-factory-mexico/","https://securityaffairs.com/112033/cyber-crime/foxconn-doppelpaymer-ransomware.html"]},{"v":"Volvo Car Corporation","g":"Snatch","d":"2021-11-30","c":"Sweden","fin":"Not publicly disclosed; Volvo did not report a specific financial cost figure for the incident.","ran":"Not publicly disclosed; no confirmed ransom demand amount or payment reported. Volvo stated it maintained control of its data and did not indicate paying any ransom.","dt":"No significant production/operational downtime was publicly reported; this was primarily a data-theft/extortion event rather than an OT-disruptive encryption event.","di":"Snatch leaked approximately 35.6 MB of sample stolen R&D files as proof of the larger theft; Volvo stated it saw no indication of impact to customer safety, vehicle security, or personal customer data.","s":"The Snatch ransomware/extortion group claimed to have breached a Volvo Cars file repository and stole a portion of the automaker's proprietary R&D data, leaking sample files as proof. Volvo disputed being a 'victim of ransomware' per se, framing it as unauthorized third-party access to one file server, but confirmed R&D data theft.","src":["https://techcrunch.com/2021/12/10/volvo-had-some-rd-data-stolen-in-security-breach/","https://www.bleepingcomputer.com/news/security/volvo-cars-discloses-security-breach-leading-to-randd-data-theft/","https://www.cpomagazine.com/cyber-security/volvo-security-breach-led-to-rd-data-theft-by-snatch-threat-actors/"]},{"v":"Bridgestone Americas","g":"LockBit 2.0","d":"2022-02-27","c":"United States (Latin America/North America plants affected)","fin":"Not publicly disclosed as an official total-cost figure; Bridgestone engaged Accenture Security for incident response, adding external forensic/recovery costs on top of ~10 days of idled production across ~30 plants.","ran":"Specific ransom demand amount not publicly disclosed; Bridgestone did not confirm payment, and LockBit proceeded to leak stolen data after the deadline passed.","dt":"Approximately 30 plants across North America and Latin America were shut down for about 10 days; all plants had resumed normal operations by March 9, 2022.","di":"Business records were accessed and stolen, including files containing Social Security numbers, bank information, and other sensitive data belonging to some customers.","s":"The tire and rubber manufacturer detected a security incident in late February 2022; LockBit 2.0 claimed responsibility on March 11, 2022, and threatened to publicly release stolen business and customer data unless a ransom was paid. Bridgestone proactively disconnected manufacturing and retreading facilities across North and Latin America to contain the incident.","src":["https://www.bleepingcomputer.com/news/security/bridgestone-americas-confirms-ransomware-attack-lockbit-leaks-data/","https://www.msspalert.com/news/bridgestone-cyberattack-timeline-and-ransomware-recovery-details","https://industrialcyber.co/threats-attacks/bridgestone-cyberattack-disrupts-manufacturing-raises-supply-chain-concerns/","https://www.darkreading.com/ics-ot-security/bridgestone-ciso-lessons-ransomware-attack-acting-thinking"]},{"v":"Continental AG","g":"LockBit","d":"2022-08 (attack disclosed); extortion escalated Nov-Dec 2022","c":"Germany","fin":"Not publicly disclosed as an official incident-cost figure by Continental beyond confirming systems access occurred; no confirmed operational-loss figure released.","ran":"LockBit publicly listed the stolen data for sale at $50 million on November 9, 2022, reduced to $40 million by November 29, 2022; negotiation transcripts published by LockBit show discussions beginning September 23, 2022, but Continental has stated it aborted contact with the group rather than paying.","dt":"No major manufacturing/plant downtime was publicly reported; this was chiefly a data-exfiltration/extortion event rather than an OT-encryption event.","di":"Attackers claimed to have stolen roughly 40 terabytes of internal files (some early reports mis-stated this as 40 GB), including technical documents and source code, based on screenshots published on the leak site.","s":"The German automotive-parts giant was breached via an employee's browser download; LockBit gained access to internal systems and, after negotiations broke down, publicly offered the stolen dataset for sale on its leak site for a headline figure of $50 million (later reduced to $40 million).","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-claims-attack-on-continental-automotive-giant/","https://www.scworld.com/brief/stolen-data-from-continental-ransomware-attack-for-sale-for-50m","https://www.securityweek.com/ransomware-gang-offers-sell-files-stolen-continental-50-million/","https://borncity.com/win/2022/12/17/ransomware-at-continental-infection-via-an-employees-browser-download/"]},{"v":"Yamaha Motor Philippines, Inc.","g":"INC Ransom","d":"2023-10-25","c":"Philippines","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Yamaha stood up a countermeasures team and launched an investigation; no specific downtime duration was publicly disclosed, and the impact was described as limited to one server.","di":"Approximately 37 GB of allegedly stolen data was published, including employee ID information, backup files, and corporate/sales information; partial leakage of employees' personal information was confirmed by Yamaha.","s":"A single server managed by Yamaha's Philippines motorcycle-manufacturing/sales subsidiary was breached and hit with ransomware; INC Ransom added the company to its leak site roughly three weeks later and published stolen employee and corporate data.","src":["https://www.bleepingcomputer.com/news/security/yamaha-motor-confirms-ransomware-attack-on-philippines-subsidiary/","https://www.securityweek.com/yamaha-motor-confirms-data-breach-following-ransomware-attack/","https://gbhackers.com/yamaha-ransomware-attack/"]},{"v":"Nissan Australia (Nissan Oceania)","g":"Akira","d":"2023-12-05","c":"Australia (and New Zealand)","fin":"Not publicly disclosed as an official cost figure by Nissan.","ran":"Specific dollar ransom demand not publicly disclosed; negotiations with Nissan reportedly failed and the company did not pay, after which Akira threatened to leak the data.","dt":"No major production-line/OT downtime was publicly reported; primarily a data-breach/extortion event rather than an operational-disruption event.","di":"Approximately 100 GB of documents stolen, affecting an estimated 100,000 individuals; exposed data included around 4,000 Medicare card numbers, 7,500 driver's license numbers, 220 passport numbers, and 1,300 tax file numbers, alongside employee personal information, NDAs, and partner/client details.","s":"Nissan detected an intrusion into its Australian division's network in December 2023; the Akira ransomware gang claimed responsibility and, after negotiations reportedly failed, threatened to leak stolen business and personal data. Nissan confirmed in 2024 that the breach affected roughly 100,000 individuals across Australia and New Zealand, including customers, dealers, and current/former employees.","src":["https://www.bleepingcomputer.com/news/security/nissan-australia-cyberattack-claimed-by-akira-ransomware-gang/","https://www.securityweek.com/nissan-data-breach-affects-100000-individuals/","https://www.cpomagazine.com/cyber-security/nissan-oceania-data-breach-impacts-100000-individuals-in-australia-and-new-zealand/","https://securityaffairs.com/156283/cyber-crime/akira-ransomware-breached-nissan-australia.html"]},{"v":"MKS Instruments, Inc.","g":"not publicly disclosed","d":"February 3, 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Global operations restored following ransomware incident","di":"not publicly disclosed","s":"MKS Instruments, Inc. experienced a ransomware incident identified on February 3, 2023, which disrupted their operations. The company reported that they have restored global operations and are on track to recover revenue by the end of the second quarter of 2023.","src":["https://www.sec.gov/Archives/edgar/data/1049502/000095017023017248/mksi-ex99_1.htm"]},{"v":"Gates Industrial Corporation plc","g":"not publicly disclosed","d":"2023-02-11","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The attack resulted in the temporary inability of most facilities to produce and ship products. Production and shipping have been restored at some facilities, with full restoration expected in the coming days.","di":"It is possible that personally identifiable information (PII) was accessed, but the extent is not yet determined.","s":"On February 11, 2023, Gates Industrial Corporation plc reported being the target of a ransomware attack. The company activated its incident response plans and engaged cybersecurity experts to assess and remediate the situation, which temporarily disrupted production and shipping operations.","src":["https://www.sec.gov/Archives/edgar/data/1718512/000171851223000016/gtes-20230211.htm"]},{"v":"Tecogen Inc.","g":"not publicly disclosed","d":"2023-04-28","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company's network was fully operational on May 1, 2023, after restoring files from the previous evening's back-up.","di":"not publicly disclosed","s":"Tecogen Inc. experienced a ransomware attack on April 28, 2023, which was identified as a spear phishing attack targeting the company's VPN. The company took immediate action to limit access, investigate the threat, and restore affected files, successfully returning to full operational status by May 1, 2023.","src":["https://www.sec.gov/Archives/edgar/data/1537435/000153743523000036/tgen-20230503.htm"]},{"v":"Ultralife Corporation","g":"avoslocker","d":"2023-01-25","c":"United States","fin":"not publicly disclosed","ran":"not applicable","dt":"approximately two weeks of production and shipping downtime; systems have been restored and production resumed","di":"not publicly disclosed","s":"Ultralife Corporation experienced an unauthorized entry into its IT systems, leading to a partial disruption of operations at its Newark and Virginia Beach locations. The company engaged external incident response professionals and did not pay any ransom, as they restored their systems and resumed production.","src":["https://www.sec.gov/Archives/edgar/data/875657/000143774923005169/ulbi20230301_8k.htm"]},{"v":"Hillman Solutions Corp.","g":"not publicly disclosed","d":"May 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hillman Solutions Corp. experienced a ransomware attack in May 2023, which resulted in direct and indirect costs associated with the incident. The company is also expecting insurance receivables related to this cybersecurity incident.","src":["https://www.sec.gov/Archives/edgar/data/1822492/000182249224000059/hillmanpr-termnoterepricin.htm"]},{"v":"PGT Innovations, Inc.","g":"royal","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"PGT Innovations, Inc. reported that their fourth quarter financial results were impacted by a ransomware incident, which affected their ability to expand gross margin. The incident, along with Hurricane Ian, resulted in a revenue impact of approximately $15 million.","src":["https://www.sec.gov/Archives/edgar/data/1354327/000095017023003596/pgti-ex99_1.htm"]},{"v":"HanesBrands Inc.","g":"not publicly disclosed","d":"May 31, 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"HanesBrands Inc. announced that it experienced a ransomware attack on May 31, 2022. The incident raised concerns regarding the adequacy and security of their information technology systems.","src":["https://www.sec.gov/Archives/edgar/data/1359841/000119312523031373/d438262dex991.htm"]},{"v":"Sensata Technologies Holding plc","g":"not publicly disclosed","d":"2025-04-06","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident has temporarily impacted operations, including shipping, receiving, and manufacturing production. The timeline for full restoration is not yet known.","di":"Files were taken from the Company’s environment; specific records or individuals affected are not disclosed.","s":"On April 6, 2025, Sensata Technologies experienced a ransomware incident that encrypted devices in its network. The company activated response protocols, took its network offline, and is investigating the incident with third-party cybersecurity professionals.","src":["https://www.sec.gov/Archives/edgar/data/1477294/000147729425000047/st-20250406.htm"]},{"v":"The Coca-Cola Company","g":"everest","d":"2026-07-16","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production operations at fairlife in the United States are temporarily suspended; investigation and restoration efforts are ongoing.","di":"not publicly disclosed","s":"On July 16, 2026, The Coca-Cola Company announced that its subsidiary fairlife, LLC experienced unauthorized access to its systems due to a ransomware event. The company activated its incident response protocols and is investigating the impact, with production operations in the U.S. temporarily suspended.","src":["https://www.sec.gov/Archives/edgar/data/21344/000162828026048466/ko-20260716.htm"]},{"v":"Mueller Water Products, Inc.","g":"not publicly disclosed","d":"2023-10-28","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company has largely restored the impacted applications and systems and continues to execute business continuity and restoration plans for the remaining impacted applications and systems.","di":"not publicly disclosed","s":"Mueller Water Products, Inc. experienced a cybersecurity incident involving unauthorized access and deployment of ransomware, which disrupted access to business applications and limited the ability to take orders and ship products. The company has contained the incident and is in the process of restoring operations and verifying data.","src":["https://www.sec.gov/Archives/edgar/data/1350593/000135059323000054/mwa-20231129.htm"]},{"v":"Johnson Controls International plc","g":"not publicly disclosed","d":"2023-09-23","c":"Ireland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company has largely restored the impacted applications and systems and continues to execute business continuity and restoration plans for the remaining impacted applications and systems.","di":"not publicly disclosed","s":"Johnson Controls International plc experienced a ransomware incident that disrupted portions of its internal IT infrastructure and applications. The incident was detected on September 23, 2023, and the company has since implemented its incident management and response plan, engaging cybersecurity experts to assist in the investigation and remediation efforts.","src":["https://www.sec.gov/Archives/edgar/data/833444/000083344423000038/jci-20231113.htm"]},{"v":"Hillman Group","g":"not publicly disclosed","d":"May 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hillman Group experienced a ransomware attack in May 2023, which has had direct and indirect costs associated with the incident. The company has mentioned the receipt of expected insurance receivables related to this cybersecurity incident.","src":["https://www.sec.gov/Archives/edgar/data/1822492/000182249224000085/hillmanq12024earningscal.htm"]}],"stats":[{"m":"Manufacturing as share of ransomware attacks (industry rank)","v":"Manufacturing was the most-targeted sector globally for the 5th consecutive year in 2025; ~1 in 4 attacks (roughly 25%) hit manufacturing per one industry tracker, with incidents rising from 937 (2024) to 1,466 (2025), a 56% increase","s":"Industrial Cyber / cyber-insurance industry report roundup, citing 2025 ransomware tracking data","u":"https://industrialcyber.co/reports/global-ransomware-attacks-rose-32-in-2025-as-manufacturers-emerged-as-top-target/"},{"m":"Manufacturing ransomware incident growth (alternate count)","v":"Ransomware attacks against manufacturing rose from 520 to 838 incidents, a 61% year-over-year increase","s":"Industrial Cyber, citing 2025 threat intelligence report","u":"https://industrialcyber.co/manufacturing/manufacturing-absorbs-56-ransomware-surge-of-global-attacks-in-2025-as-raas-legacy-ot-supply-chains-fuel-spike/"},{"m":"Average ransom demand, manufacturing","v":"Rose from $523,000 to $1.16 million year-over-year (per one 2025 tracker); Sophos separately reports average ransom demand of $1.2M in 2025 (down 20% from $1.5M in 2024)","s":"Industrial Cyber (tracker) and Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Median attack cost / ransom payment, manufacturing","v":"Median attack cost ~$500,000 (excluding longer-term operational losses, per tracker); Sophos: median ransom paid $1.0 million in 2025 (down from $1.2M average demand), average payment $1.0M (down from $1.2M in 2024)","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Rate of ransom payment among affected manufacturers","v":"51% of manufacturing organizations with encrypted data paid the ransom in 2025 (Sophos); Coveware separately reported manufacturing had the highest payment rate of any sector in 2024 at 62%, driven by pressure to avoid operational downtime","s":"Sophos 2025 and Coveware 2024/2025 quarterly reports","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Rate of successful encryption vs. attack disruption","v":"40% of attacks on manufacturers resulted in data encryption in 2025 (lowest in 5 years, down from 74% in 2024); 50% of manufacturers stopped the attack before encryption (up from 24% the prior year)","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Mean recovery cost (excluding ransom paid), manufacturing","v":"$1.3 million in 2025, down ~24% from $1.7 million in 2024","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Root causes of manufacturing ransomware incidents","v":"Exploited vulnerabilities are the leading root cause (32% of incidents); lack of in-house expertise to detect/stop attacks cited by 42.5% of victims","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Dominant threat actor groups against manufacturing (2025)","v":"Akira, Qilin, and Play identified as the three most active ransomware groups targeting manufacturing/production organizations","s":"Sophos X-Ops, State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Average total cost of a data breach, industrial sector","v":"$5.56 million (2024 IBM report figure); ~$5M cited in some 2025 summaries. Time to identify/contain a breach: 199 days to identify, 73 days to contain (above the 194/64-day global average)","s":"IBM Cost of a Data Breach Report (2024/2025 industrial sector analysis)","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-industrial-sector"},{"m":"Cost of unplanned manufacturing downtime","v":"Unplanned downtime from ransomware can cost up to $125,000 per hour in manufacturing environments","s":"IBM Cost of a Data Breach industrial sector analysis","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-industrial-sector"},{"m":"Coveware overall average/median ransom payment trend (all sectors, Q4 2025, for context)","v":"Q4 2025 average ransom payment $591,988 (up 57% QoQ); median ransom payment $325,000 (up 132% QoQ). Q3 2025 average was ~$377,000, median $140,000","s":"Coveware Quarterly Ransomware Report, Q3-Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"ransomware.live Manufacturing sector victim count (this pull)","v":"4,434 total victim/leak-site postings tagged \"Manufacturing\" as of 2026-07-20; top groups by posting volume: Akira (363), LockBit3 (323), Qilin (303), Play (263), Black Basta (148), LockBit2 (145), Clop (142), ALPHV/BlackCat (112); top countries: US (1,370), Germany (249), Canada (164), UK (134), Italy (134); year-over-year posting counts show sharp growth: 2021=295, 2022=511, 2023=880, 2024=816, 2025=1,204, 2026 YTD=668","s":"ransomware.live API v2 (/v2/sectorvictims/Manufacturing), direct pull","u":"https://api.ransomware.live/v2/sectorvictims/Manufacturing"}]},{"name":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","tag":"Business Services","overview":"This composite industry group spans consultancies, IT/managed services, law and accounting firms, engineering firms, staffing and BPO providers, travel management companies, commercial real estate services, and wholesale/logistics distributors. Ransomware.live's 'Business Services' sector tag is one of the most heavily populated on the platform, logging dozens of new claimed victims per week in mid-2026, with RaaS/extortion groups Qilin, DragonForce, INC Ransom, TheGentlemen, Akira, RansomHouse, Deadlock, and data-extortion crews like ShinyHunters posting new victims almost daily. The sector's risk profile is distinctive because these firms sit at a structural chokepoint: (1) they hold sensitive, often privileged or regulated client/third-party data (legal, financial, M&A, PII) that amplifies extortion leverage; (2) many are themselves suppliers/vendors (MSPs, SAP integrators, BPOs, staffing firms, travel managers) whose compromise cascades into downstream client organizations, making them attractive 'one-to-many' targets; and (3) wholesale trade/logistics operations depend on time-sensitive order, warehouse, and freight systems where even short outages create cascading supply-chain and revenue impact. Reported financial impact ranges enormously by incident type - from multi-hundred-million-dollar remediation and litigation costs at large diversified BPOs (Conduent) and IT consultancies (Cognizant, Sopra Steria) down to smaller professional firms where impact is mostly data-exposure/breach-notification driven rather than large ransom payments. Across the sector, exfiltration-only and SaaS/CRM (e.g., Salesforce) compromise via vishing/social engineering has become as common a threat vector as classic file-encryption ransomware.","distinct":"One of the most heavily populated leak-site categories, logging dozens of new claimed victims weekly in mid-2026. Spans consultancies, MSPs, law and accounting firms, engineering, staffing/BPO, commercial real estate and wholesale distribution. The defining feature is custodianship of other organizations' confidential material: privileged legal files, audit workpapers, M&A data and client PII. A single firm's breach becomes many clients' breach, and MSPs within this group double as an access path into downstream victims.","leverage":"Confidentiality of privileged and client-owned data, with professional-liability, contractual and regulatory consequence flowing to clients rather than only the insured.","tolerance":"Moderate to high. Days to weeks for most advisory work; wholesale/logistics sub-segments are materially tighter due to order and fulfilment obligations.","bulk":{"total":5209,"years":{"2019":2,"2020":15,"2021":266,"2022":452,"2023":952,"2024":1740,"2025":978,"2026":803},"groups":[["lockbit3",415],["akira",330],["qilin",276],["play",221],["ransomhub",213],["clop",190],["incransom",166],["alphv",162]],"countries":[["US",1970],["GB",262],["CA",209],["DE",152],["FR",131],["AU",112]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Cognizant Technology Solutions","g":"Maze","d":"2020-04-18 (attack); recovery through Q2 2020","c":"United States (global operations)","fin":"Cognizant CFO disclosed in a Q1 2020 SEC filing / earnings call that the incident would cost the company an estimated $50 million to $70 million in Q2 2020, covering investigation, containment, remediation, legal fees, and security investment (not counting potential lost revenue).","ran":"Not publicly disclosed whether a ransom was demanded of a specific dollar figure or paid.","dt":"Multi-week disruption to internal systems and client-facing services during April-May 2020; full remediation cost/timeline tracked into Q2 2020 earnings.","di":"Some client and employee data reported affected; full scope not publicly quantified in detail.","s":"IT consulting/professional services giant hit by Maze ransomware; internal systems encrypted, disrupting service delivery to client accounts and forcing Cognizant to advise clients to disconnect from Cognizant-managed connections.","src":["https://www.computerweekly.com/news/252482950/Maze-ransomware-attack-will-cost-Cognizant-at-least-50m-to-70m","https://www.ciodive.com/news/cognizant-maze-ransomware/577677/","https://www.secureworld.io/industry-news/cognizant-ceo-on-ransomware-attack-cost-impact"]},{"v":"Accenture","g":"LockBit 2.0","d":"2021-08-11","c":"Ireland (global professional/IT services)","fin":"No specific dollar loss figure was ever disclosed by Accenture; the company confirmed in its Q4/full-year FY2021 financial report (Oct 18, 2021) that data was encrypted and stolen, without quantifying cost.","ran":"LockBit demanded $50 million; Accenture has not confirmed paying any ransom.","dt":"Accenture stated it restored affected systems from backups and reported no material impact to its own operations, though exact downtime duration was not disclosed.","di":"Attackers claimed 6TB of data stolen; roughly 2,000+ files were leaked publicly on the dark web, including internal presentations and client case studies.","s":"LockBit 2.0 claimed to have stolen roughly 6 terabytes of data from Accenture, a top-tier global consulting/IT services firm, and demanded ransom, later publishing files including PowerPoint decks and case studies when payment was not made public.","src":["https://www.bleepingcomputer.com/news/security/accenture-confirms-data-breach-after-august-ransomware-attack/","https://www.securityweek.com/accenture-confirms-data-stolen-ransomware-attack/","https://www.infosecurity-magazine.com/news/accenture-tied-up-in-50m-ransom/"]},{"v":"CWT (Carlson Wagonlit Travel)","g":"Ragnar Locker","d":"2020-07-27","c":"United States (global travel management/business services)","fin":"Direct incident cost beyond the ransom payment not separately disclosed; company cited COVID-19-driven financial strain as a factor in negotiating the ransom down.","ran":"Initial demand of $10 million negotiated down to a paid ransom of $4.5 million (414 BTC), received by attackers July 28, 2020.","dt":"Approximately 30,000 CWT computers were knocked offline; systems were restored following payment, exact full-recovery timeline not publicly detailed.","di":"Attackers claimed to have exfiltrated 2 terabytes of files including financial reports, security documents, and employee personal data (email addresses, salary data).","s":"The world's fifth-largest business travel management company had roughly 30,000 computers taken offline; attackers initially demanded $10 million, citing COVID-19 financial pressure in negotiations.","src":["https://siliconangle.com/2020/08/02/travel-management-company-cwt-hands-4-5m-following-ransomware-attack/","https://www.darkreading.com/cyberattacks-data-breaches/travel-management-firm-cwt-pays-4-5m-to-ransomware-attackers","https://www.theregister.com/2020/07/31/carlson_wagonlit_travel_ragnarlocker_ransom_paid/"]},{"v":"Sopra Steria","g":"Ryuk (new variant)","d":"2020-10-20","c":"France (European IT/professional services)","fin":"Company estimated the negative impact on gross operating margin at between EUR40 million and EUR50 million (roughly $48M-$60M), of which approximately EUR30 million was expected to be covered by cyber insurance.","ran":"Not publicly disclosed; no confirmation Sopra Steria paid a ransom.","dt":"Attack occurred the evening of Oct 20, 2020; company reported 'differing levels of unavailability' of systems persisting for weeks afterward, driving the bulk of the cost.","di":"Limited public detail on records/data types exposed beyond internal systems disruption.","s":"Major French IT services firm hit by a then-new version of Ryuk ransomware, causing extended unavailability across parts of its network and requiring extensive remediation.","src":["https://www.bleepingcomputer.com/news/security/sopra-steria-expects-50-million-loss-after-ryuk-ransomware-attack/","https://www.theregister.com/2020/11/25/sopra_steria_ransomware_damage_50m_euros/","https://www.securityweek.com/financial-impact-ransomware-attack-sopra-steria-could-reach-50-million/"]},{"v":"Toll Group","g":"Nefilim (second attack); earlier 2020 attack attributed to a different ransomware family","d":"2020-01-31 (first attack) and 2020-05-05 (second attack)","c":"Australia (global freight/logistics - wholesale trade)","fin":"No specific total dollar cost figure was publicly disclosed for either incident; company acknowledged 'financial and reputational consequences' without quantifying them.","ran":"Not publicly disclosed; Toll Group publicly stated it would not pay the ransom, and Nefilim subsequently leaked stolen data.","dt":"The May 2020 attack disrupted the MyToll customer portal and back-office systems for approximately six days; freight shipments were largely unaffected but parcel/portal services were degraded.","di":"Exfiltrated data included commercial agreements with current and former enterprise customers and employee personal data from at least one compromised server.","s":"Global freight and logistics provider (1,200+ locations, 50 countries) was hit by ransomware twice in the same year; the May attack used Nefilim and led to exfiltration of commercial and employee data after Toll refused to pay.","src":["https://www.bleepingcomputer.com/news/security/toll-group-hit-by-ransomware-a-second-time-deliveries-affected/","https://www.itnews.com.au/news/toll-groups-corporate-data-stolen-by-attackers-548033","https://www.securitymagazine.com/articles/92334-toll-group-suffers-ransomware-attack-again"]},{"v":"Estes Express Lines","g":"LockBit","d":"2023-09-26 (network access); ransomware deployed and discovered Oct 1, 2023","c":"United States (trucking/freight - wholesale trade logistics)","fin":"No specific total incident cost publicly disclosed; company faced a class-action lawsuit over the breach.","ran":"Amount not publicly disclosed; Estes confirmed it did not pay the ransom.","dt":"Forensic investigation concluded Nov 7, 2023; breach notification letters were not sent to affected individuals until December 2023 (roughly 2.5 months after discovery), pending law enforcement investigation.","di":"Personal information of more than 21,000 individuals exposed, including names and Social Security numbers; data published on LockBit's leak site Nov 13, 2023.","s":"Major U.S. trucking/freight carrier had data stolen and ransomware deployed; LockBit claimed responsibility in November 2023 and published the stolen data after Estes refused to pay, following FBI/regulator guidance.","src":["https://www.securityweek.com/estes-express-lines-says-personal-data-stolen-in-ransomware-attack/","https://www.truckingdive.com/news/estes-express-lines-cyberattack-social-security-numbers-update/703427/","https://www.theregister.com/2024/01/03/estes_ransomware/"]},{"v":"Conduent Business Services, LLC","g":"SafePay (claimed the leak-site listing, later removed - suggesting ransom payment)","d":"Unauthorized access Oct 21, 2024 - Jan 13, 2025 (discovered); publicly disclosed April 2025","c":"United States (government/BPO professional services contractor)","fin":"Company disclosed in SEC 8-K filings that it incurred approximately $9 million in breach-response costs with the expectation of spending a further $16 million by Q1 2026; total related expenses (including likely settlements) estimated to exceed $50 million.","ran":"SafePay claimed theft of ~8.5 terabytes of data and listed Conduent on its leak site, then removed the listing - widely interpreted as evidence a ransom was paid, though Conduent has not confirmed a payment or amount.","dt":"Breach window spanned nearly 3 months (Oct 2024-Jan 2025) before detection; public notification did not begin until October 2025, roughly 9 months after discovery.","di":"Affected individual count grew from an initial ~10.5 million to 25.5 million (Feb 2026) to 62.2 million by June 2026; data types included names, Social Security numbers, addresses, medical histories, and health insurance details. Nearly a dozen class-action lawsuits and multi-state enforcement actions followed.","s":"Major business-process-outsourcing/government-services contractor (payments, healthcare claims, back-office processing) suffered one of the largest reported U.S. breaches of 2025, with the scope of affected individuals repeatedly revised upward over the year.","src":["https://securityboulevard.com/2025/11/conduent-faces-financial-hit-lawsuits-from-breach-affecting-10-5-million/","https://www.hipaajournal.com/conduent-business-solutions-data-breach/","https://cyberpress.org/conduent-data-breach-steals-8-tb/","https://www.cpomagazine.com/cyber-security/data-breach-at-government-contractor-conduent-sparks-nearly-a-dozen-class-action-lawsuits/"]},{"v":"Cushman & Wakefield","g":"ShinyHunters (vishing/Salesforce data theft) and Qilin (separate, coincidentally-timed claim)","d":"2026-05-03 to 2026-05-05 (confirmed)","c":"United States / global (commercial real estate services)","fin":"Not publicly disclosed as of this research; company has not released cost estimates. A shareholder/customer lawsuit has been filed over the breach.","ran":"ShinyHunters demanded an undisclosed ransom with a deadline of May 6, 2026, threatening to leak data; when negotiations reportedly stalled, the group published a 50GB dataset. No confirmation Cushman & Wakefield paid.","dt":"Company described the incident as 'limited' in scope; no significant operational downtime was publicly reported, consistent with a SaaS/CRM data-theft (non-encryption) incident rather than an operational-technology outage.","di":"Over 500,000 Salesforce records containing PII and internal corporate/client data claimed stolen; illustrates third-party/SaaS supply-chain exposure distinct from traditional on-prem ransomware.","s":"One of the world's largest commercial real estate services firms confirmed a 'limited' breach originating from a vishing (voice phishing) social-engineering attack that gave ShinyHunters access to its Salesforce CRM environment; Qilin separately listed the company on its ransomware leak site around the same time.","src":["https://www.theregister.com/security/2026/05/05/cushman-wakefield-confirms-vishing-cyberattack/5228718","https://cybernews.com/news/cushman-wakefield-shinyhunters-salesforce-breach-claim/","https://www.cyberdaily.au/security/13553-real-estate-giant-cushman-wakefield-confirms-cyber-incident-qilin-and-shinyhunters-claim-attack","https://www.credaily.com/briefs/cushman-wakefield-faces-lawsuit-after-data-breach/"]}],"stats":[{"m":"Global median ransom payment (2025)","v":"$1,000,000 (down ~50% from $2,000,000 in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average ransom payment, Q2 2025","v":"$1.13 million (up 104% from Q1 2025); median $400,000 (up 100% QoQ)","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://blocksandfiles.com/2025/08/13/coveware-charts-rise-of-data-exfiltration/"},{"m":"Share of ransomware victims that pay","v":"26% (Coveware Q2 2025); professional services, manufacturing, and healthcare rank among the most-targeted sectors","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://www.veeam.com/company/press-release/coveware-by-veeam-reveals-q2-2025-ransomware-surge-social-engineering-and-data-exfiltration-drive-record-payouts.html"},{"m":"Cases involving data exfiltration (vs. encryption-only)","v":"74% of ransomware cases in Q2 2025 involved exfiltration","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://blocksandfiles.com/2025/08/13/coveware-charts-rise-of-data-exfiltration/"},{"m":"Global average total cost of a data breach (2025)","v":"$4.44 million (down from $4.88 million in 2024); Technology sector average $4.79 million, Industrial sector average $5.00 million (closest published proxies to professional/tech
