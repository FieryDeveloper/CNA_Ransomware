ontrasted with the CDK/M&S/MGM enterprise-scale cases) illustrating that ransomware targets consumer-services retailers across the full size spectrum, not just national chains. RansomHouse claimed encryption of dealership systems.","src":["https://dysruptionhub.com/karl-auto-group-iowa-cyberattack/"]},{"v":"PChome (pchome.com.tw) / NetHome Group and subsidiary Bibian","g":"Settra","d":"Claimed June 10, 2026; disclosed publicly late June 2026","c":"Taiwan","fin":"Not publicly disclosed.","ran":"Not disclosed.","dt":"PChome stated its main platforms and payment channels continued operating normally with no evidence of an actual breach to core systems; no confirmed outage was reported.","di":"Settra claimed approximately 102GB of internal data stolen, including personal information for roughly 3.5 million members, nine years of operational records, system architecture diagrams, and employee personnel files; subsidiary Bibian separately confirmed exposure of member names, phone numbers, addresses, and purchase history, which reportedly led to follow-on phishing campaigns against customers.","s":"A major Taiwanese e-commerce/payment platform targeted by the emerging Settra group, illustrating ransomware risk to online-retail and embedded-payment infrastructure outside the US/UK. The parent company publicly disputed that its core systems were breached, while an affiliated subsidiary (Bibian) confirmed a related, separate data breach - a useful example of attacker claims vs. victim denial/dispute dynamics common in this sector.","src":["https://cyberq.tw/2026/06/30/nethome-group-is-caught-in-a-double/"]},{"v":"Citi Trends, Inc.","g":"Hive","d":"2023-01-14","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company activated its incident response and business continuity plan to support the restoration of affected systems. Critical operating systems were restored, and the flow of merchandise to stores began to normalize during the third week of February 2023.","di":"Sensitive customer data is not retained on its systems.","s":"Citi Trends, Inc. experienced a disruption of its back office and distribution center IT systems due to Hive ransomware on January 14, 2023. The FBI provided tools to help restore affected systems, and the company's stores and financial systems remained operational throughout the incident.","src":["https://www.sec.gov/Archives/edgar/data/1318484/000110465923024793/tm237638d1_8k.htm","https://www.sec.gov/Archives/edgar/data/1318484/000131848423000004/ct-20230223.htm"]},{"v":"Marks Spencer","g":"DragonForce","d":"","c":"UK","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"disrupted online orders, contactless payments, and Click Collect service","di":"not publicly disclosed","s":"Marks Spencer suffered a ransomware attack attributed to the DragonForce group, disrupting various online services. The attack utilized tactics associated with Scattered Spider, leading to significant operational disruptions.","src":["https://www.bleepingcomputer.com/news/security/uk-shares-security-tips-after-major-retail-cyberattacks/"]},{"v":"Ahold Delhaize","g":"INC Ransom","d":"November 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems taken offline for protection","di":"not publicly disclosed","s":"Ahold Delhaize confirmed a data theft incident following a cyberattack attributed to the ransomware group INC Ransom. The company stated that certain files were taken from its U.S. business systems, and the investigation is ongoing to determine the extent of the data affected.","src":["https://www.bleepingcomputer.com/news/security/ahold-delhaize-confirms-data-theft-after-inc-ransomware-claims-attack/"]},{"v":"Fourlis Group","g":"not publicly disclosed","d":"November 27, 2024","c":"Greece","fin":"$23 million","ran":"not publicly disclosed","dt":"Temporary disruptions in store replenishment and e-commerce operations from December 2024 through February 2025; systems restored with external cybersecurity experts' help.","di":"not publicly disclosed","s":"Fourlis Group, the operator of IKEA stores in Eastern Europe, suffered a ransomware attack just before Black Friday on November 27, 2024, leading to estimated losses of $23 million. The attack primarily impacted IKEA's business operations, causing temporary disruptions in store replenishment and e-commerce, but no evidence of data theft or leaks was found.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-cost-ikea-operator-in-eastern-europe-23-million/"]},{"v":"Sam's Club","g":"Clop","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Sam's Club is investigating claims of a ransomware breach by the Clop group, which has added the company to its dark web leak site. The company has not confirmed the breach but is prioritizing the security of its members' information.","src":["https://www.bleepingcomputer.com/news/security/retail-giant-sams-club-investigates-clop-ransomware-breach-claims/"]},{"v":"Avery Products Corporation","g":"not publicly disclosed","d":"December 9, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"61,193 customers affected; first and last names, billing and shipping address, email address, phone number, payment card number, CVV code, expiration date, purchase amount","s":"Avery Products Corporation reported a data breach after its website was hacked to steal customers' credit card and personal information. The breach occurred between July 18, 2024, and December 9, 2024, affecting 61,193 customers. Avery is offering free credit monitoring services to impacted individuals and has set up a dedicated assistance line for inquiries.","src":["https://www.bleepingcomputer.com/news/security/label-giant-avery-says-website-hacked-to-steal-credit-cards/"]},{"v":"AutoCanada","g":"Hunters International","d":"August 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Operational disruptions occurred, but business continued at AutoCanada's 66 dealerships with some customer service operations impacted by delays.","di":"Employee data including full names, addresses, dates of birth, payroll information, social insurance numbers, bank account numbers, and scans of government-issued identification documents.","s":"AutoCanada experienced a ransomware attack in August 2023, claimed by the Hunters International gang, which may have exposed employee data. The company is notifying affected individuals and has implemented measures to enhance security and minimize future risks.","src":["https://www.bleepingcomputer.com/news/security/autocanada-says-ransomware-attack-may-impact-employee-data/"]},{"v":"MarineMax","g":"Rhysida","d":"March 10, 2024","c":"USA","fin":"$2.39 billion revenue, $835.3 million gross profit","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"123,494 individuals affected; personal identifier information","s":"MarineMax, the world's largest recreational boat and yacht retailer, experienced a data breach impacting over 123,000 individuals. The Rhysida ransomware gang claimed responsibility for the attack, which involved the theft of personal data from the company's systems. The breach was detected on March 10, 2024, after the attackers gained access to the network on March 1, 2024.","src":["https://www.bleepingcomputer.com/news/security/yacht-giant-marinemax-data-breach-impacts-over-123-000-people/"]},{"v":"Rite Aid","g":"RansomHub","d":"June 6, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"2.2 million customers' personal information including name, address, date of birth, and driver's license number","s":"Rite Aid reported a data breach impacting 2.2 million customers, where personal information was stolen after attackers breached their network using an employee's credentials. The RansomHub ransomware gang claimed responsibility for the breach, stating they obtained over 10 GB of customer information and threatened to leak it if ransom negotiations failed.","src":["https://www.bleepingcomputer.com/news/security/rite-aid-says-june-data-breach-impacts-22-million-people/"]},{"v":"London Drugs","g":"LockBit","d":"April 2024","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"LockBit ransomware claimed responsibility for a cyberattack on Canadian pharmacy chain London Drugs in April 2024. The FBI has recovered over 7,000 decryption keys from LockBit, which can help victims recover their encrypted data. Despite law enforcement efforts to disrupt LockBit's operations, the group remains active and continues to target organizations worldwide.","src":["https://www.bleepingcomputer.com/news/security/fbi-recovers-7-000-lockbit-keys-urges-ransomware-victims-to-reach-out/"]},{"v":"VF Corporation","g":"not publicly disclosed","d":"December 15, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"VF has substantially restored the IT systems encrypted in the incident but continues to work through minor operational impacts.","di":"approximately 35.5 million individual consumers' personal data","s":"VF Corporation, the owner of brands like Vans and The North Face, reported a ransomware attack that affected over 35 million customers. The breach involved the encryption of IT systems and the theft of personal data, although sensitive information like social security numbers and payment details were not compromised. The company has restored most of its systems but continues to face operational challenges as it investigates the incident.","src":["https://www.bleepingcomputer.com/news/security/vans-north-face-owner-says-ransomware-breach-affects-35-million-people/"]},{"v":"AutoZone","g":"Clop","d":"May 28, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"184,995 people; full names, social security numbers, employee names, email addresses, parts supply details, tax information, payroll documents, Oracle database files, data about stores, production and sales information","s":"AutoZone experienced a data breach due to the Clop ransomware gang's exploitation of a MOVEit vulnerability, affecting the data of 184,995 individuals. The breach was reported on May 28, 2023, and the gang published the stolen data on July 7, 2023, which included sensitive employee information but no customer data.","src":["https://www.bleepingcomputer.com/news/security/auto-parts-giant-autozone-warns-of-moveit-data-breach/"]},{"v":"Est e Lauder","g":"ALPHV/BlackCat","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The ALPHV ransomware gang, also known as BlackCat, has introduced a new API for their data leak site to increase pressure on victims to pay ransoms. This follows their breach of Est e Lauder, which ignored the gang's ransom demands, prompting the group to mock the company's security measures.","src":["https://www.bleepingcomputer.com/news/security/alphv-ransomware-adds-data-leak-api-in-new-extortion-strategy/"]},{"v":"Shutterfly","g":"Clop","d":"July 14th 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Shutterfly, an online retail and photography manufacturing platform, was hit by a Clop ransomware attack. The company stated that the attack did not impact customer data.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-july-21st-2023-avaddon-back-as-noescape/"]},{"v":"Saks Fifth Avenue","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not disclosed","s":"The Clop ransomware gang claims to have attacked Saks Fifth Avenue, threatening to leak data if a ransom is not paid. The retailer has stated that mock data was stolen, but the specifics of the breach remain unclear.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-march-24th-2023-clop-overload/"]},{"v":"Indigo Books Music","g":"not publicly disclosed","d":"February 9th 2023","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The website was made unavailable to customers and only cash payments were accepted.","di":"not publicly disclosed","s":"Indigo Books Music, the largest bookstore chain in Canada, was struck by a cyberattack that caused the company to shut down its website and only accept cash payments. The incident occurred on February 9th, 2023, and the details regarding the financial impact and ransom are not publicly disclosed.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-february-10th-2023-clops-back/"]},{"v":"Arnold Clark","g":"Play","d":"December 23, 2022","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company's systems were disconnected from the Internet on December 24, and they are working on restoring the compromised systems in a new segregated environment.","di":"Personal information including names, contact details, dates of birth, vehicle details, ID documents (such as passports and driver's licenses), National Insurance numbers (in limited cases), and bank account details were stolen.","s":"Arnold Clark, Europe's largest independent car retailer, experienced a cyberattack on December 23, 2022, claimed by the Play ransomware group. The attack resulted in the theft of personal information from customers, prompting the company to notify affected clients and take measures to secure their systems.","src":["https://www.bleepingcomputer.com/news/security/arnold-clark-customer-data-stolen-in-attack-claimed-by-play-ransomware/"]},{"v":"Sobeys","g":"Black Basta","d":"November 11th 2022","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems issues since last weekend","di":"not publicly disclosed","s":"Sobeys, a Canadian food retail giant, has been experiencing IT systems issues due to a ransomware attack attributed to the Black Basta group. The attack has affected grocery stores and pharmacies under the Sobeys brand.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-november-11th-2022-lockbit-feeling-the-heat/"]},{"v":"Pendragon Group","g":"LockBit","d":"not publicly disclosed","c":"United Kingdom","fin":"not publicly disclosed","ran":"$60 million","dt":"no impact on operations","di":"5% of the database stolen","s":"Pendragon Group, a U.K. car dealer, was targeted by the LockBit ransomware gang, who demanded a ransom of $60 million to decrypt files and prevent the leak of stolen data. The company confirmed the breach but stated that it did not affect their operations and they have chosen not to pay the ransom. Pendragon reported the incident to law enforcement and the data protection office in the U.K.","src":["https://www.bleepingcomputer.com/news/security/pendragon-car-dealer-refuses-60-million-lockbit-ransomware-demand/"]},{"v":"Damart","g":"Hive","d":"August 15, 2022","c":"France","fin":"$2 million","ran":"$2 million demanded","dt":"Operations disrupted since August 15; 92 stores impacted and customer support unavailable.","di":"not publicly disclosed","s":"Damart, a French clothing company, was hit by a ransomware attack from the Hive gang, demanding a ransom of $2 million. The attack led to the encryption of some systems and significant operational disruptions, affecting 92 stores and customer services since August 15, 2022.","src":["https://www.bleepingcomputer.com/news/security/damart-clothing-store-hit-by-hive-ransomware-2-million-demanded/"]},{"v":"7-Eleven Denmark","g":"not publicly disclosed","d":"not publicly disclosed","c":"Denmark","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All 7-Eleven stores in Denmark were shut down while the company investigated the incident. Some stores have resumed operations using local solutions.","di":"not publicly disclosed","s":"7-Eleven Denmark confirmed a ransomware attack that led to the closure of 175 stores across the country. The attack prevented stores from using cash registers or accepting payments, prompting an investigation in cooperation with the police. While there is no evidence of customer data being affected, the potential for data theft remains a concern.","src":["https://www.bleepingcomputer.com/news/security/7-eleven-denmark-confirms-ransomware-attack-behind-store-closures/"]},{"v":"Walmart","g":"Yanluowang","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$55 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Walmart has denied being attacked by the Yanluowang ransomware gang, which claimed to have encrypted between 40,000 and 50,000 of their computers. The gang demanded a ransom of $55 million but stated they did not receive a response from Walmart, which maintains that no successful attack occurred.","src":["https://www.bleepingcomputer.com/news/security/walmart-denies-being-hit-by-yanluowang-ransomware-attack/"]},{"v":"Fast Shop","g":"not publicly disclosed","d":"not publicly disclosed","c":"Brazil","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"network disruption and temporary closure of its online store","di":"not publicly disclosed","s":"Fast Shop, one of Brazil's largest retailers, has suffered an extortion cyberattack that led to network disruption and the temporary closure of its online store. The details regarding the ransom demanded or paid have not been disclosed.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-24th-2022-splinter-cells/"]},{"v":"Shoprite Holdings","g":"RansomHouse","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$400,000","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Shoprite Holdings, Africa's largest supermarket chain, was hit by a ransomware attack. The RansomHouse group extorted the company, leading to significant operational disruptions.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-17th-2022-have-i-been-ransomed/"]}],"stats":[{"m":"Retailers hit by ransomware who paid the ransom (2025)","v":"58% (up from ~30% in 2021), nearly doubling over 5 years","s":"Sophos, The State of Ransomware in Retail 2025 (survey of 361 retail IT/security leaders, 16 countries, Jan-Mar 2025)","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Median ransom demand, retail sector (2025)","v":"$2,000,000 (doubled from $1,000,000 in 2024)","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Median ransom payment, retail sector (2025)","v":"$1,000,000 (up 5% from $950,000 in 2024)","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Average recovery cost excluding ransom, retail sector (2025)","v":"$1.65M, down 40% year-over-year, lowest in 3 years","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Data encryption rate in retail ransomware attacks (2025)","v":"48% of attacks resulted in encryption (5-year low); extortion-only (no encryption) attacks rose from 2% in 2023 to 6% in 2025","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Root cause of retail ransomware attacks (2025)","v":"Exploited vulnerability: 30% of incidents; \"lack of expertise/capacity in-house\" cited as root cause in 45% of attacks - the highest rate of any sector Sophos surveyed","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Average ransomware payment, all sectors, Q2 2025","v":"$1.13 million","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average ransomware payment, all sectors, Q3 2025","v":"$376,941","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average ransomware payment, all sectors, Q4 2025","v":"$591,988","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Consumer Services sector victim postings observed on ransomware.live (snapshot)","v":"~120 posted victims in the roughly 2-month window (approx. May 20 - Jul 19, 2026) returned by the API's sectorvictims endpoint; dominant claiming groups in this window: Qilin, TheGentlemen, SafePay, DragonForce, Akira, ShinyHunters, Settra, and Nova","s":"ransomware.live API v2/sectorvictims/Consumer Services (direct pull, not a third-party report)","u":"https://api.ransomware.live/v2/sectorvictims/Consumer%20Services"}]},{"name":"Telecommunications","tag":"Telecommunication","overview":"The telecommunications sector - internet service providers, mobile network operators, fixed-line/cable carriers, tower/infrastructure companies, and satellite/media-adjacent telecom firms - has become an increasingly frequent ransomware and data-extortion target. Ransomware.live's own sector tracker lists 357 telecom-sector victims (tag \"Telecommunication\") with a pronounced acceleration in 2025-2026 (124 posted in 2025 alone, the sector's most active year on record, plus 62 more in the first ~7 months of 2026), corroborated by Cyble/Cybersecurity Dive research showing telecom ransomware attack volume grew roughly fourfold from 24 in 2022 to 90 in 2025. The threat-actor landscape is dominated by prolific double-extortion RaaS groups (Qilin, Akira, LockBit variants, Play, Clop) alongside a newer wave of pure data-extortion/leak-only crews with no encryption capability (Arkana Security, ShinyHunters, DragonForce) that specifically target telecom's dense stores of subscriber PII, SIM/USIM credentials, and call-detail metadata. What distinguishes telecom from most other industries in this taxonomy is the sector's dual exposure: (1) a large, regulated subscriber-PII attack surface comparable to healthcare or financial services, and (2) an \"OT-equivalent\" core-network/availability layer (HSS/HLR, BGP routing, voice/SMS switching, physical tower infrastructure) where a successful intrusion can cascade into regional or national service outages - as seen in incidents ranging from Vodafone Portugal's multi-day national outage to Cellcom's week-long US regional voice/SMS blackout. Third-party and supply-chain exposure is also unusually acute, given telecom's dependence on field-service subcontractors, MVNO/reseller relationships, shared backend SaaS platforms, and industry bodies - Verizon's 2025 DBIR found third-party involvement in 30% of all breaches, up sharply from roughly 15% the year before. Regulatory consequences have grown correspondingly severe, exemplified by SK Telecom's record $97.2M Korean privacy-regulator fine and mandated per-subscriber compensation after its 2025 USIM-data breach.","distinct":"357 tracked victims with pronounced acceleration, 124 in 2025, the sector's most active year on record, plus 62 more in the first seven months of 2026. Carriers are single points of failure for downstream connectivity, so an outage propagates into every dependent business and household. Uniquely combines mass subscriber PII, core network and signaling systems functioning as OT-equivalents, and lawful-intercept and critical-infrastructure systems whose compromise carries national-security consequence beyond commercial loss.","leverage":"Service availability affecting large downstream populations, plus mass subscriber PII and call-detail records with regulatory and surveillance sensitivity.","tolerance":"Very low. Minutes to hours for core network and signaling; regulatory service-obligation and SLA penalties begin accruing almost immediately.","bulk":{"total":357,"years":{"2017":5,"2019":4,"2020":11,"2021":28,"2022":43,"2023":68,"2024":12,"2025":124,"2026":62},"groups":[["qilin",25],["akira",22],["lockbit3",17],["play",12],["clop",12],["bianlian",10],["lockbit2",10],["dragonforce",9]],"countries":[["US",89],["GB",14],["CA",13],["FR",10],["AU",9],["IT",8]],"pressPct":4,"ransomPct":1},"incidents":[{"v":"Telecom Argentina S.A.","g":"REvil / Sodinokibi","d":"2020-07-18","c":"Argentina","fin":"Not publicly disclosed beyond the ransom demand itself; no confirmed customer-facing outage cost figures reported.","ran":"$7.5 million in Monero demanded, rising to $15 million after a 48-hour deadline passed. Telecom Argentina stated it contained the attack and regained access without paying.","dt":"Internal corporate systems (not customer-facing telecom/internet service) were disrupted; company said it isolated affected systems and restored operations using backups, without paying the ransom. Precise recovery timeline/cost not publicly disclosed.","di":"Internal corporate/IT systems affected; no large-scale confirmed customer PII leak was publicly documented.","s":"Argentina's largest telecom operator was hit by REvil ransomware that spread via a phishing email to a hijacked internal Domain Admin account, ultimately encrypting more than 18,000 workstations and disrupting internal systems including Office 365, OneDrive, corporate VPN, Citrix, Genesys and customer/field-service virtual machines.","src":["https://www.welivesecurity.com/2020/07/21/telecom-argentina-hit-major-ransomware-attack/","https://www.infosecurity-magazine.com/news/telecom-argentina-tuesday-75/","https://www.secureworld.io/industry-news/argentinian-isp-hit-with-7.5-million-ransomware-attack"]},{"v":"Cincinnati Bell (now altafiber)","g":"Yanluowang","d":"2022-07-02","c":"United States","fin":"Not publicly disclosed; no SEC filing or press disclosure of a specific dollar cost was located.","ran":"Ransom amount not publicly disclosed; company confirmed it did not pay.","dt":"Specific downtime duration and recovery cost not publicly disclosed in available reporting.","di":"Scope/type of data exfiltrated by Yanluowang not publicly detailed in available sources.","s":"US regional telecom/broadband provider Cincinnati Bell was listed as a victim on the Yanluowang ransomware group's leak site; the company publicly refused to pay the ransom.","src":["https://www.ransomware.live/id/Q2luY2lubmF0aSBiZWxsIGRpZG7igJl0IHBheSB0aGUgcmFuc29t@yanluowang","https://cti.fyi/groups/yanluowang.html"]},{"v":"Telecommunications Services of Trinidad and Tobago (TSTT)","g":"RansomEXX","d":"2023-10-09","c":"Trinidad and Tobago","fin":"Not publicly disclosed. Trinidad and Tobago has no mandatory breach-notification law, which delayed and limited public cost disclosure.","ran":"Ransom amount not publicly disclosed.","dt":"TSTT reported the breach affected availability of internal virtual infrastructure/private cloud; full recovery timeline not publicly quantified. CEO Lisa Agard was subsequently fired following the incident.","di":"Over 1.2 million customer records (mobile, fixed line, broadband) leaked, including full names, emails, national ID numbers, phone numbers and ID scans; the leaked CSV was downloaded 13,000+ times within two weeks; TSTT internal GitLab projects and database dumps were also exposed.","s":"The Caribbean nation's state-owned telecom provider had an administrator's credentials compromised (October 3), leading to a security breach on October 9 that affected its internal virtual infrastructure/private cloud. RansomEXX later released a CSV of customer data on the dark web as proof of the hack.","src":["https://technewstt.com/tstt-ransomexx-exploit/","https://trinidadexpress.com/news/local/over-one-million-tstt-customer-records-on-dark-web/article_a21817e2-79eb-11ee-9c24-c35f8111013c.html","https://advox.globalvoices.org/2023/11/08/trinidad-tobagos-state-telecommunications-provider-is-hacked-raising-questions-about-data-protection-laws/"]},{"v":"WideOpenWest (WOW!)","g":"Arkana Security","d":"2025-03-28","c":"United States","fin":"In its March 28, 2025 SEC Form 8-K, WideOpenWest stated the incident had not had a material impact on operations and it did not believe it was reasonably likely to materially affect financial condition or results; the company also disputed that sensitive personal information was accessed, contrary to the attacker's claims.","ran":"WOW! was given a deadline to negotiate or the data would be sold/leaked; specific dollar ransom demand not publicly disclosed.","dt":"No confirmed customer-facing service outage reported; incident was primarily a backend data-access/exfiltration event rather than an encryption/downtime event.","di":"Arkana claimed theft of 403,000 WOW! user account records (names, usernames, salted passwords, emails, login histories, security Q&As) plus a separate CSV of 2.2 million records (names, addresses, phone numbers, device data).","s":"A newly-emerged data-extortion group, Arkana Security, breached major US cable/ISP WOW! after an employee's device was infected with infostealer malware in September 2024, harvesting credentials for backend platforms Symphonica and AppianCloud that gave attackers alleged full backend control (they released a demo video). This was Arkana's debut, high-profile attack.","src":["https://www.securityweek.com/new-ransomware-group-claims-attack-on-us-telecom-firm-wideopenwest/","https://cybersecuritynews.com/arkana-ransomware-stolen-2-2-million-customer-records/","https://www.theregister.com/2025/03/28/arkana_wow_ransomware/","https://www.sec.gov/Archives/edgar/data/1701051/000110465925029187/tm2428184d1_8k.htm"]},{"v":"SK Telecom","g":"Attributed on ransomware.live to 'coinbasecartel' data-extortion listing; technical intrusion used BPFDoor malware (attribution to a distinct ransomware crew is contested/unclear in public reporting)","d":"2025-04-19","c":"South Korea","fin":"Record $97.2 million (KRW 134.8 billion) fine from South Korea's Personal Information Protection Committee, plus a ~$7,000 fine for late breach reporting; the Korea Consumer Agency separately ordered SK Telecom to pay ~$67 (100,000 won) compensation to each of the 23 million affected users; SK Telecom committed roughly $514 million to a security-overhaul 'Accountability and Commitment Program,' plus bill discounts, fee waivers and free data.","ran":"No ransom payment publicly reported; this was primarily treated as a state-linked/criminal espionage-style data breach rather than a classic encryption ransomware case, though listed as a data-leak/extortion incident by dark-web trackers.","dt":"No major network outage; SK Telecom offered free SIM replacements to all customers as remediation.","di":"25 types of personal information for 23.2 million subscribers exposed, including phone numbers, IMSI numbers, and USIM authentication keys - raising SIM-swap and surveillance risk.","s":"South Korea's largest mobile carrier (~23M subscribers) disclosed a breach of its Home Subscriber Server after detecting unusual traffic on April 22, 2025. Investigation found BPFDoor malware present undetected on at least 28 servers (33 variants) since as early as 2022, exfiltrating USIM authentication keys and other subscriber identifiers.","src":["https://techcrunch.com/2025/05/08/a-timeline-of-south-korean-telco-giant-skts-data-breach/","https://cybermagazine.com/news/sk-telecom-face-mammoth-us-97m-data-breach-fine","https://www.koreaherald.com/article/10563945","https://www.zeebiz.com/companies/news-sk-telecom-told-to-pay-100000-won-each-to-23-million-users-after-massive-data-breach-386203"]},{"v":"Colt Technology Services","g":"WarLock","d":"2025-08-12","c":"United Kingdom (multinational operations across ~40 countries)","fin":"Specific dollar cost of the incident not publicly disclosed by Colt; impact described qualitatively as affecting 27,000+ customers across ~40 countries.","ran":"WarLock demanded $200,000 for the stolen data cache and posted samples on dark-web forums as proof.","dt":"Outage began August 12, 2025; Colt stated the majority of recovery would take 8-10 weeks, with customer portal, hosting APIs and voice-on-demand tools still offline in early October 2025 - a multi-month recovery, unusually long for a major telecom provider.","di":"WarLock claimed theft of over one million documents including employee salary data, customer contact information, internal executive personal information, and confidential emails.","s":"Global business telecom provider Colt was breached via exploitation of the SharePoint remote-code-execution vulnerability CVE-2025-53770, leading to a multi-day (ultimately multi-week/multi-month) outage of Colt Online customer portal, hosting APIs, and Voice API/porting platforms; core network infrastructure reportedly remained largely unaffected. Colt publicly attributed responsibility to the WarLock ransomware group.","src":["https://www.theregister.com/2025/08/15/london_telco_colts_services_disrupted/","https://securityaffairs.com/181247/data-breach/colt-technology-faces-multi-day-outage-after-warlock-ransomware-attack.html","https://www.sdxcentral.com/news/colt-ransomware-recovery-to-continue-close-to-year-end/","https://www.computerweekly.com/news/366629873/Warlock-claims-more-victims-as-cyber-attacks-hit-Colt-and-Orange"]},{"v":"Orange S.A. (Orange Group, incl. Orange Belgium subsidiary)","g":"WarLock","d":"2025-07-25","c":"France (with Belgium subsidiary separately affected)","fin":"Not publicly disclosed.","ran":"Specific ransom amount not publicly disclosed for the Orange S.A. incident.","dt":"Orange stated the attacker had only limited access and exfiltrated mostly 'outdated or low-sensitivity data'; no major prolonged network outage reported (unlike Colt).","di":"~4GB of internal data published on the dark web by WarLock; Orange characterized the exposed data as largely outdated/low-sensitivity. The related Orange Belgium breach separately impacted 850,000 customer accounts.","s":"French telecom giant Orange disclosed a security incident at the end of July 2025 involving internal systems, using the same SharePoint exploitation chain (webshells, Group Policy abuse, credential theft, lateral movement) attributed to WarLock. The group publicly claimed the attack on August 17, 2025 and released roughly 4GB of data. A separate, related incident hit Orange Belgium, affecting 850,000 customer accounts.","src":["https://www.bloomberg.com/news/articles/2025-08-22/ransomware-hack-hit-orange-telecom-data-published-on-dark-web","https://slcyber.io/blog/warlock-ransomware-gang-targets-orange-and-colt/","https://www.securityweek.com/orange-belgium-data-breach-impacts-850000-customers/","https://www.insurancejournal.com/news/international/2025/08/25/836826.htm"]},{"v":"American Tower Corporation","g":"ShinyHunters","d":"2026-06-12","c":"United States","fin":"Not publicly disclosed as of this research.","ran":"Extortion demand made; American Tower did not comply and data was leaked. Specific dollar figure not publicly disclosed.","dt":"No network/tower service outage publicly reported; incident was a data-exfiltration/extortion event rather than an encryption/availability event.","di":"Attackers claimed over 5.2 million records including customer and landowner PII, records referencing other companies' infrastructure (T-Mobile, Verizon, US DHS), tower asset records with GPS coordinates, and plaintext physical access/gate codes for cell tower compounds; 216,601 accounts were added to Have I Been Pwned on June 26, 2026.","s":"One of the world's largest cell-tower/telecom infrastructure REITs was breached in a 'pay-or-leak' extortion campaign by ShinyHunters. After American Tower did not pay by the group's June 15, 2026 deadline, the attackers published the stolen files - notable for exposing physical-security data (tower gate/access codes) rather than just customer records, illustrating the physical-infrastructure risk unique to telecom tower operators.","src":["https://www.dexpose.io/shinyhunters-breach-american-tower-corporation/","https://www.technadu.com/american-tower-data-breach-215000-accounts-exposed-in-shinyhunters-attack/629952/","https://haveibeenpwned.com/Breach/AmericanTower"]},{"v":"Lumen Technologies, Inc.","g":"not publicly disclosed","d":"2023-03-27","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company implemented business continuity plans to restore functionality to its customers’ operational and business systems.","di":"A limited amount of data was extracted, but the specific number of records or individuals affected is not publicly disclosed.","s":"On March 27, 2023, Lumen Technologies announced two cybersecurity incidents. A ransomware attack affected a limited number of the Company’s servers, degrading operations for some enterprise customers. Additionally, a separate intrusion involved unauthorized access to internal IT systems, including data extraction.","src":["https://www.sec.gov/Archives/edgar/data/18926/000119312523079847/d467138d8k.htm"]},{"v":"Ascom","g":"HellCat","d":"","c":"Switzerland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"no impact on the company s business operations","di":"44GB of data stolen, including source code, project details, invoices, confidential documents, and issues from the ticketing system","s":"Ascom, a Swiss telecommunications company, confirmed a cyberattack by the HellCat hacking group that targeted its Jira servers. The hackers claimed to have stolen 44GB of sensitive data, including source code and confidential documents, but the company stated that the incident did not impact its business operations.","src":["https://www.bleepingcomputer.com/news/security/hellcat-hackers-go-on-a-worldwide-jira-hacking-spree/"]},{"v":"BT Group","g":"Black Basta","d":"","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Some servers were taken offline and isolated, but BT Conferencing services remained fully operational.","di":"500GB of data allegedly stolen, including financial and organizational data, users data and personal documents, NDA documents, and confidential information.","s":"BT Group's BT Conferencing division experienced a breach by the Black Basta ransomware gang, which claimed to have stolen 500GB of sensitive data. Although the company stated that the incident did not impact their operations, they took certain servers offline as a precaution. The attackers threatened to leak the stolen data on their dark web site.","src":["https://www.bleepingcomputer.com/news/security/bt-conferencing-division-took-servers-offline-after-black-basta-ransomware-attack/"]},{"v":"Frontier Communications","g":"RansomHub","d":"April 14, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Some systems were shut down to contain the attack; customers reported Internet connection issues during the attack.","di":"751895 customers' full names and Social Security Numbers (SSNs) were confirmed as breached; 5GB of data allegedly stolen containing information of 2 million customers.","s":"Frontier Communications reported a data breach affecting 750,000 customers after a cyberattack attributed to the RansomHub ransomware group. The breach exposed personal information, including full names and Social Security Numbers, and the attackers threatened to leak additional data unless their demands were met.","src":["https://www.bleepingcomputer.com/news/security/frontier-warns-750-000-of-a-data-breach-after-extortion-threats/"]},{"v":"Tigo Business","g":"Black Hunt","d":"","c":"Paraguay","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 330 servers encrypted; backups compromised","s":"Tigo Business, the largest mobile carrier in Paraguay, suffered a ransomware attack attributed to the Black Hunt group, impacting their cloud and hosting services. The attack reportedly encrypted over 330 servers and compromised backups, affecting more than 300 associated companies.","src":["https://www.bleepingcomputer.com/news/security/paraguay-warns-of-black-hunt-ransomware-attacks-after-tigo-business-breach/"]},{"v":"Grupo GTD","g":"Rorschach","d":"2023-10-23","c":"Chile","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Partial impact on services, including IaaS platform and shared services; specific services like IP telephony and VPNs were affected.","di":"not publicly disclosed","s":"Chilean telecom giant Grupo GTD was hit by a ransomware attack on October 23, 2023, impacting its Infrastructure as a Service (IaaS) platform and disrupting various online services. The attack involved the Rorschach ransomware gang, which utilized DLL sideloading vulnerabilities to execute the ransomware payload.","src":["https://www.bleepingcomputer.com/news/security/chilean-telecom-giant-gtd-hit-by-the-rorschach-ransomware-gang/"]},{"v":"Intrado","g":"Royal Ransomware","d":"December 1","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$60 million","dt":"Intrado experienced a widespread outage impacting all services, including Unified Communication Services and Healthcare, starting December 1. Most services have been restored, but healthcare services were still experiencing intermittent issues as of December 21.","di":"Internal documents, passports, and employee driver's licenses","s":"Royal Ransomware claimed responsibility for a cyber attack on telecommunications provider Intrado, demanding a ransom of $60 million after stealing sensitive data. The attack coincided with a significant outage affecting Intrado's services, and the group threatened to leak the stolen data unless the ransom is paid.","src":["https://www.bleepingcomputer.com/news/security/royal-ransomware-claims-attack-on-intrado-telecom-provider/"]},{"v":"Bell Technical Solutions (BTS)","g":"Hive","d":"September 15th 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Hive ransomware gang claimed responsibility for a cyberattack on Bell Technical Solutions, a subsidiary of Bell Canada. The details regarding the extent of the attack and the data affected have not been disclosed.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-september-16th-2022-iranian-sanctions/"]},{"v":"Bell Technical Solutions","g":"Hive","d":"August 20, 2022","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"BTS' website is currently inaccessible; immediate steps were taken to secure affected systems.","di":"operational company and employee information; names, addresses, and phone numbers of residential and small business customers in Ontario and Quebec who booked a technician visit","s":"The Hive ransomware gang claimed responsibility for a cyberattack on Bell Technical Solutions, a subsidiary of Bell Canada. The attack, which occurred on August 20, 2022, resulted in the encryption of BTS' systems and unauthorized access to operational company and employee information, as well as customer details. Bell Canada has since alerted customers and is investigating the incident with law enforcement.","src":["https://www.bleepingcomputer.com/news/security/hive-ransomware-claims-cyberattack-on-bell-canada-subsidiary/"]},{"v":"Mitel","g":"not publicly disclosed","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hackers exploited a zero-day vulnerability in Mitel MiVoice VOIP appliances, believed to be part of a ransomware attack. Although the attack was stopped, the vulnerability allowed for remote code execution and potential lateral movement within the network.","src":["https://www.bleepingcomputer.com/news/security/mitel-zero-day-used-by-hackers-in-suspected-ransomware-attack/"]}],"stats":[{"m":"Telecom sector ransomware victims listed (all-time, ransomware.live)","v":"357 victims listed under 'Telecommunication' sector tag as of July 2026; 124 posted in 2025 alone (peak year to date), 62 already in partial-year 2026","s":"ransomware.live API (api.ransomware.live/v2/sectorvictims/Telecommunication)","u":"https://www.ransomware.live/api"},{"m":"Top threat actor groups targeting telecom (by victim count, ransomware.live dataset)","v":"Qilin (25), Akira (22), LockBit3 (17), Play (12), Clop (12), LockBit2 (10), BianLian (10), DragonForce (9), ALPHV/BlackCat (9), INC Ransom (8)","s":"ransomware.live API (author's own aggregation of the pulled dataset)","u":"https://www.ransomware.live/api"},{"m":"Telecom ransomware attack volume growth","v":"Ransomware attacks on telecom companies grew nearly 4x from 24 in 2022 to 90 in 2025; 444 telecom data-theft incidents identified with 133 stolen-database listings; ~70% of 2025 telecom attacks targeted the Americas; Qilin, Akira and Play were the leading groups (corroborates ransomware.live figures above)","s":"Cyble research via Cybersecurity Dive","u":"https://www.cybersecuritydive.com/news/telecom-ransomware-spike-cyble/809224/"},{"m":"Ransomware presence in breaches / median payout (all sectors, 2025)","v":"Ransomware present in 44% of breaches overall; median ransomware payout fell to $115,000 and 64% of victims refused to pay; third-party involvement was a factor in 30% of all breaches (up from ~15% the prior year) - relevant to telecom's heavy vendor/reseller/MVNO dependence; edge/VPN device exploitation as an initial-access vector rose 8x, with only 54% patched (median 32 days to patch)","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Average/median ransom payment (all sectors, 2025)","v":"Mean ransom payment fell from $2M (2024) to $1M (2025); by sector, state/local government paid the highest median ($2.5M) and healthcare the lowest ($150K); telecom not broken out separately in public summary","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Quarterly average/median ransom payments, 2025","v":"Q2 2025: avg $1,130,070 / median $400,000. Q3 2025: avg ~$377,000 / median $140,000 (down 66%/65% QoQ). Q4 2025: avg $591,988 / median $325,000 (up 57%/132% QoQ)","s":"Coveware Quarterly Ransomware Reports","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Global data breach cost by industry, 2025","v":"Global average cost of a data breach: $4.44M (down 9% YoY). By industry: Healthcare $7.42M (highest, 14th year running), Financial Services $5.56M, Industrial $5M, Energy $4.83M, Technology $4.79M. Telecommunications/Communications was not broken out as a distinct line item in the public summaries reviewed - noted as a data gap","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global on-chain ransomware payments, 2025","v":"Ransomware actors received more than $820M in on-chain payments in 2025, an 8% YoY decline from $892M in 2024; median payment per victim rose 368% (from $12,738 in 2024 to $59,556 in 2025) even as total payments fell, and eCrime.ch-tracked claimed victims rose ~50% YoY to the most active year on record - consistent with 'more attacks, fewer big payouts, higher per-incident asks' dynamic seen in telecom cases like Colt and WOW!","s":"Chainalysis 2025/2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-crime-ransomware-victim-extortion-2025/"}]},{"name":"Transportation and Warehousing","tag":"Transportation/Logistics","overview":"Transportation and Warehousing (ransomware.live sector tag \"Transportation/Logistics\") is a high-frequency, high-consequence ransomware target because it sits at the intersection of critical infrastructure, thin operating margins, and deeply interconnected IT/OT systems. The sector has seen some of history's costliest cyber incidents (Maersk/NotPetya, ~$300M) as well as cases where a ransomware attack directly caused a long-established company's insolvency (KNP Logistics, ~730 jobs lost). Live ransomware.live tracking shows a very high and steadily growing victim count across trucking, freight forwarding, maritime/port operators, warehousing, and fleet-technology vendors, spanning dozens of active ransomware groups and dozens of countries. Industry reporting for 2025 shows both attack frequency (+34% YoY) and average ransom demands (+685% YoY, to $2.19M) rising sharply, with third-party/supply-chain exposure (shared ELD, TMS, and port-terminal software) acting as a key amplifier, a single vendor compromise can cascade operational disruption across many otherwise-unrelated carriers simultaneously.","distinct":"Sits at the intersection of critical infrastructure, thin operating margins and tightly coupled IT/OT. Produced both the costliest cyber incident on record (Maersk/NotPetya, roughly $300 million) and a documented insolvency directly caused by ransomware (KNP Logistics, roughly 730 jobs lost), the clearest evidence that thin margins convert a survivable outage into a terminal one. Dispatch, freight and warehouse management systems have no manual fallback at modern volume.","leverage":"Halted freight movement and dispatch, with cascading contractual penalties and downstream customer disruption across the shipping chain.","tolerance":"Very low. Hours. Perishable and time-definite freight has effectively no tolerance, and margin structure leaves little buffer to absorb extended interruption.","bulk":{"total":1331,"years":{"2016":1,"2017":3,"2018":2,"2019":1,"2020":19,"2021":77,"2022":103,"2023":230,"2024":345,"2025":349,"2026":201},"groups":[["lockbit3",93],["clop",93],["qilin",74],["play",69],["akira",69],["thegentlemen",41],["ransomhub",39],["lockbit2",36]],"countries":[["US",388],["CA",70],["GB",46],["DE",39],["BR",33],["FR",32]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"A.P. Moller-Maersk","g":"NotPetya (masqueraded as Petya ransomware; attributed to Sandworm/Russian military intelligence, not a typical criminal ransomware gang)","d":"2017-06-27","c":"Denmark (global operations across 130+ countries)","fin":"Maersk publicly estimated total costs of $200-300 million (lost revenue, IT restoration, and extraordinary operating costs), disclosed in investor communications; widely cited as one of the costliest cyber incidents in history at the time.","ran":"Not applicable in the traditional sense, NotPetya had no functioning decryption mechanism; no ransom was viably payable or paid despite a nominal $300 in Bitcoin demanded on-screen.","dt":"Core systems were down for roughly 10 days; a full IT rebuild (including a 'miracle' surviving domain controller found in Ghana) took an emergency response team working around the clock roughly a week to restore booking systems, with normal port operations taking longer to stabilize.","di":"Primarily an operational/availability impact (systems wiped) rather than a data-exfiltration/breach event; no large-scale customer PII exposure was reported.","s":"The NotPetya wiper, disguised as ransomware, spread globally via a compromised Ukrainian accounting software update (M.E.Doc) and crippled Maersk's global IT infrastructure, forcing the reinstallation of roughly 4,000 servers and 45,000 PCs and halting container booking and port operations across multiple countries.","src":["https://www.cnbc.com/2017/08/16/maersk-says-notpetya-cyberattack-could-cost-300-million.html","https://www.forbes.com/sites/leemathews/2017/08/16/notpetya-ransomware-attack-cost-shipping-giant-maersk-over-200-million/","https://www.csoonline.com/article/567845/rebuilding-after-notpetya-how-maersk-moved-forward.html","https://www.techtarget.com/searchsecurity/news/450424681/NotPetya-ransomware-impact-costs-Maersk-hundreds-of-millions"]},{"v":"Toll Group","g":"Mailto (Netwalker family) initially; Nefilim in the second, follow-on attack","d":"2020-02-05 (first attack, Mailto/Nefilim-linked); second attack 2020-05-05 (Nefilim)","c":"Australia","fin":"Not publicly disclosed as a specific dollar figure by Toll Group; operational disruption affected freight booking, invoicing, and customer service for weeks across both incidents.","ran":"Not publicly disclosed; Toll Group stated it did not pay.","dt":"First attack: core IT systems and ~1,000 servers taken offline, with a multi-week recovery of booking/tracking portals. Second attack (three months later): MyToll portal and other systems again disrupted for an extended period while freight shipments continued via manual workarounds.","di":"Nefilim attackers stole and published approximately 220GB of data from at least one server, including current and former employee information.","s":"Australian freight and logistics giant Toll Group was hit by ransomware twice within three months in 2020. The first attack infected roughly 1,000 servers and forced a full network shutdown; the second (Nefilim, a double-extortion group) again took down the MyToll customer portal and stole and threatened to leak data.","src":["https://threatpost.com/ransomware-attack-toll-group-systems-again/155505/","https://www.bleepingcomputer.com/news/security/toll-group-hit-by-ransomware-a-second-time-deliveries-affected/","https://www.itnews.com.au/news/toll-group-suffers-second-ransomware-attack-this-year-547757"]},{"v":"Expeditors International of Washington","g":"Not publicly attributed to a named ransomware group in company disclosures","d":"2022-02-20","c":"United States (global freight forwarding operations)","fin":"Per SEC 10-K/8-K filings: approximately $62 million in incremental demurrage charges (inability to timely move shipments through ports) and approximately $28 million in investigation, recovery, and remediation expenses in H1 2022, commonly summarized in press coverage as roughly $60 million in total incident-related costs; company also disclosed lower shipment volumes and revenue impact as customers shifted to competitors during the outage.","ran":"Not publicly disclosed.","dt":"Systems were shut down company-wide starting February 20, 2022; recovery of operating and accounting systems extended over several weeks, with the company still describing 'material adverse impact' months later in its Q1 2022 disclosures.","di":"Not detailed in public filings as a large-scale data breach; disclosures focused primarily on operational/financial impact rather than confirmed record counts of exposed data.","s":"Global freight forwarder Expeditors International proactively shut down most of its global operating systems after detecting a cyberattack, disrupting its ability to move shipments through ports and process customer orders for weeks, with effects disclosed as materially impacting quarterly results in SEC filings.","src":["https://www.sec.gov/Archives/edgar/data/746515/000156459022027382/expd-ex991_6.htm","https://www.sec.gov/Archives/edgar/data/746515/000095017023005412/expd-20221231.htm","https://www.thestack.technology/expeditors-ransomware-costs-freight-forwarding/","https://www.geekwire.com/2022/supply-chain-giant-expeditors-is-still-recovering-from-cyberattack-expects-material-adverse-impact/"]},{"v":"Port of Nagoya (Nagoya Harbor Transportation Association / Nagoya United Terminal System)","g":"LockBit 3.0 (claimed credit; not officially confirmed by port authorities)","d":"2023-07-04","c":"Japan","fin":"Not publicly quantified in dollar terms; impact described qualitatively as significant given the port's role in ~10% of Japan's total trade volume and its handling of major automotive exports (Toyota).","ran":"Not publicly disclosed.","dt":"Container operations were fully suspended for roughly 2-3 days (attack detected July 4, most terminals resumed by July 6) after servers were isolated and systems restored from backup.","di":"Primarily an OT/operational-availability incident (terminal management system encrypted); no large-scale personal data exposure was publicly reported.","s":"Japan's largest and busiest cargo port (handling ~10% of Japan's trade volume, including Toyota vehicle exports) suffered a ransomware attack on its Nagoya Port Unified Terminal System (NUTS), the central OT/IT system managing container terminal operations, halting all container loading/unloading operations.","src":["https://edition.cnn.com/2023/07/06/tech/japan-port-ransomware-attack","https://www.dragos.com/blog/ot-cybersecurity-breach-disrupts-operations-at-the-port-of-nagoya-japan","https://www.theregister.com/2023/07/06/lockbit_nagoya_attack/","https://maritime-executive.com/article/ransomware-attack-stops-container-operations-japan-s-nagoya-port"]},{"v":"KNP Logistics Group (Knights of Old)","g":"Akira","d":"2023-06","c":"United Kingdom","fin":"Not disclosed as a precise incident-remediation cost; the ultimate financial outcome was total business collapse, KNP Logistics Group entered insolvency/administration, with the ransomware attack cited by administrators as a decisive contributing factor alongside pre-existing market pressures.","ran":"Ransom demand reported at approximately GBP 5 million (some reporting cites GBP 5-6 million); not paid.","dt":"Critical operational and financial systems were encrypted and unusable; the company was unable to recover operationally and ceased trading roughly three months after the attack rather than completing a technical recovery.","di":"Financial and operational data was encrypted/compromised; approximately 730 employees lost their jobs when the company subsequently collapsed into administration.","s":"Akira ransomware operators brute-forced a weak employee password (no MFA in place) to breach 158-year-old UK haulage firm KNP Logistics, encrypting critical systems and data. The already financially strained company was unable to secure emergency investment in the aftermath and entered administration roughly three months later.","src":["https://therecord.media/knp-logistics-ransomware-insolvency-uk","https://www.weightmans.com/media-centre/news/how-ransomware-crippled-knp-logistics-group/","https://thehackernews.com/2025/09/how-one-bad-password-ended-158-year-old.html","https://dig.watch/updates/historic-uk-knp-transport-firm-collapses-after-ransomware-attack"]},{"v":"Estes Express Lines","g":"LockBit","d":"2023-09-26 (network access); breach discovered/disclosed October-December 2023","c":"United States","fin":"Not publicly disclosed as a specific dollar figure; costs would include forensic investigation, legal defense of the resulting class action, and regulatory notification expenses.","ran":"Estes publicly stated it refused to pay the ransom; specific demand amount not disclosed.","dt":"Forensic investigation concluded November 7, 2023; notification to affected individuals began December 4, 2023, roughly ten weeks after initial network access. Operational downtime specifics were not detailed in public reporting.","di":"Breach affected 21,184 individuals per filing with the Maine Attorney General; compromised data included names and Social Security numbers of current/former employees, job applicants, and/or customers. LockBit published the stolen data on its leak site November 13, 2023.","s":"Major North American less-than-truckload (LTL) freight carrier Estes Express Lines was breached by the LockBit ransomware gang, which stole personal data and later published it on its leak site after Estes declined to pay. Estes disclosed the breach to regulators and affected individuals over the following months, triggering a class-action lawsuit.","src":["https://www.theregister.com/2024/01/03/estes_ransomware/","https://www.classaction.org/news/trucking-company-estes-hit-with-class-action-over-cyberattack-affecting-21k","https://www.truckingdive.com/news/estes-express-lines-cyberattack-social-security-numbers-update/703427/","https://www.comparitech.com/news/freight-forwarder-estes-notifies-data-breach-victims-ransomware-gang-takes-credit/"]},{"v":"ORBCOMM (FleetManager / BT-series ELD platform)","g":"Not publicly attributed to a named group in available reporting","d":"2023-09-06","c":"United States (impact felt across the broader North American trucking industry as a third-party/supply-chain event)","fin":"Not publicly disclosed by ORBCOMM; downstream financial impact on the many trucking companies dependent on the affected ELD/FleetManager services was not separately quantified in public reporting.","ran":"Not publicly disclosed.","dt":"Outage began September 6, 2023; ORBCOMM targeted September 28, 2023 for full restoration of impacted services, an outage window of roughly three weeks.","di":"Primarily an availability/operational-technology impact (fleet tracking and ELD compliance systems down) rather than a disclosed data-exfiltration event; the Federal Motor Carrier Safety Administration (FMCSA) issued a temporary enforcement waiver allowing affected carriers to use paper logs beyond the normal 8-day limit.","s":"ORBCOMM, a major provider of Electronic Logging Device (ELD) and fleet-tracking technology used by numerous trucking companies, suffered a ransomware attack that took down its FleetManager platform and BT500/BT504 ELD hardware line, forcing truckers using affected devices to revert to paper logs. Illustrates concentrated third-party/supply-chain risk in transportation: a single vendor outage cascaded across many downstream carriers and triggered a federal regulatory response.","src":["https://www.bleepingcomputer.com/news/security/orbcomm-ransomware-attack-causes-trucking-fleet-management-outage/","https://therecord.media/orbcomm-trucking-software-ransomware","https://www.freightwaves.com/news/ransomware-attack-hits-orbcomms-bt-series-of-elds-paper-logs-are-back"]},{"v":"JAS Worldwide","g":"Not officially attributed by JAS in public statements; some industry reporting associated the incident with the broader RansomHub-era wave of attacks, though this was not confirmed by the company","d":"2024-08-27","c":"United States (global freight-forwarding operations, headquartered in Atlanta, Georgia)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Disruption began August 27, 2024; the company reported most core systems restored and functioning normally within days, with full recovery and resumption of pre-incident business levels across most geographies described as substantially complete within roughly two weeks.","di":"JAS disclosed a leak of over 400 data records; the majority of its contract logistics business and several entities were reported unaffected.","s":"Global freight forwarder JAS Worldwide suffered a ransomware/malware attack that disrupted core operating systems, customer service, billing/payment systems, and its central operations platform (C1) and customer-facing JAS SmartHub portal.","src":["https://www.freightwaves.com/news/global-freight-forwarder-confirms-malware-attack-for-technical-disruptions","https://theloadstar.com/jas-worldwide-suffers-cyber-attack/","https://thecyberexpress.com/cyberattack-on-jas-worldwide/","https://dysruptionhub.com/ransomware-attack-disrupts-global-operations-of-jas-worldwide/"]},{"v":"RTX Corporation","g":"not publicly disclosed","d":"2025-09-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Customers have shifted to back-up or manual processes and have experienced certain flight delays and cancellations.","di":"not publicly disclosed","s":"On September 19, 2025, RTX Corporation reported a ransomware incident affecting its Multi-User System Environment (MUSE) passenger processing software. The company activated its incident response plan and is investigating the incident with the help of cybersecurity experts while communicating with affected airlines and airports.","src":["https://www.sec.gov/Archives/edgar/data/101829/000010182925000036/rtx-20250919.htm"]},{"v":"Manchester Airports Group","g":"not publicly disclosed","d":"","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident has not resulted in any operational disruption, and customer parking services continue to operate normally.","di":"Potentially 8.9 million travelers' data including email addresses, phone numbers, vehicle registration numbers, and postcodes.","s":"Manchester Airports Group disclosed that hackers breached its systems and stole customer data, including Wi-Fi sign-ups and details related to car park, lounge, and Fast Track bookings. The attack did not access payment details and had no impact on airport operations, but MAG has temporarily suspended its online Manage My Booking service as a precaution.","src":["https://www.bleepingcomputer.com/news/security/manchester-airports-group-says-hackers-stole-travelers-data/"]},{"v":"Port of Seattle","g":"Rhysida","d":"August 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"disrupted multiple services and systems, including reservation check-in systems, passenger display boards, the Port of Seattle website, and delayed flights","di":"approximately 90,000 individuals affected; data types include names, dates of birth, Social Security numbers, driver's license numbers, and some medical information","s":"The Port of Seattle experienced a ransomware attack in August 2024, impacting the personal information of roughly 90,000 individuals. The Rhysida ransomware group was identified as the perpetrator, and the Port refused to pay the ransom despite threats to publish stolen data.","src":["https://www.bleepingcomputer.com/news/security/port-of-seattle-says-ransomware-breach-impacts-90-000-people/"]},{"v":"Americold","g":"Cactus ransomware","d":"April 26, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Americold had to shut down its IT network to contain the breach and rebuild the impacted systems.","di":"Over 129,000 employees and their dependents had their personal information stolen, including names, addresses, Social Security numbers, driver's license/state ID numbers, passport numbers, financial account information, and employment-related health insurance and medical information.","s":"Cold storage giant Americold confirmed a data breach after an April attack claimed by Cactus ransomware, affecting over 129,000 employees and their dependents. The attackers stole personal information and leaked a 6GB archive of sensitive documents, prompting Americold to shut down its IT network to contain the breach.","src":["https://www.bleepingcomputer.com/news/security/cold-storage-giant-americold-discloses-data-breach-after-april-malware-attack/"]},{"v":"Allied Pilots Association","g":"not publicly disclosed","d":"October 30, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The IT team and outside experts are working on restoring systems impacted by the ransomware attack from backups, focusing on pilot-facing products and tools.","di":"not publicly disclosed","s":"The Allied Pilots Association, representing 15,000 American Airlines pilots, experienced a ransomware attack that encrypted certain systems. The union is currently investigating the incident and working to restore affected systems with the help of cybersecurity experts.","src":["https://www.bleepingcomputer.com/news/security/american-airlines-pilot-union-hit-by-ransomware-attack/"]},{"v":"Air Canada","g":"BianLian","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"210GB of data stolen","s":"The BianLian extortion group claims to have breached the network of Air Canada, stealing 210GB of data. As a result, they are extorting the airline, threatening to leak the stolen data if their demands are not met.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-october-13th-2023-increasing-attacks/"]},{"v":"ORBCOMM","g":"not publicly disclosed","d":"September 6, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Service restoration expected by September 29, 2023","di":"not publicly disclosed","s":"ORBCOMM, a trucking and fleet management solutions provider, confirmed a ransomware attack on September 6, 2023, causing significant service outages for customers. The attack has impacted their FleetManager platform and Blue Tree product line, preventing trucking companies from managing their fleets effectively.","src":["https://www.bleepingcomputer.com/news/security/orbcomm-ransomware-attack-causes-trucking-fleet-management-outage/"]},{"v":"Auckland Transport","g":"not publicly disclosed","d":"","c":"New Zealand","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"AT's website and HOP services might return to normal operations early next week.","di":"not publicly disclosed","s":"Auckland Transport in New Zealand is experiencing a widespread outage due to a suspected ransomware attack, affecting various customer services including the HOP integrated ticketing system. Investigations are ongoing, and while there are concerns about potential data exposure, AT believes the incident is isolated and that no personal or financial data has been accessed.","src":["https://www.bleepingcomputer.com/news/security/auckland-transport-authority-hit-by-suspected-ransomware-attack/"]},{"v":"Port of Nagoya","g":"not publicly disclosed","d":"2023-07-04","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Operations planned to resume by 08:30 AM the day after the attack.","di":"not publicly disclosed","s":"The Port of Nagoya, Japan's largest port, was hit by a ransomware attack on July 4, 2023, disrupting container terminal operations. The attack caused significant financial losses and halted all container loading and unloading operations.","src":["https://www.bleepingcomputer.com/news/security/japans-largest-port-stops-operations-after-ransomware-attack/"]},{"v":"Royal Mail","g":"LockBit","d":"January 10, 2023","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Royal Mail experienced severe service disruption to its international export services but has resumed some services as of February 3, 2023.","di":"not publicly disclosed","s":"The LockBit ransomware gang claimed responsibility for a cyberattack on Royal Mail that disrupted international shipping services. The attack was detected on January 10, 2023, and Royal Mail is investigating the incident with external forensic experts and UK security agencies. LockBit has threatened to publish stolen data if their ransom is not paid.","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-gang-claims-royal-mail-cyberattack/"]},{"v":"Wabtec Corporation","g":"LockBit","d":"2022-03-15","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Wabtec Corporation experienced a data breach following a ransomware attack by LockBit, which exposed sensitive personal information. The breach was detected on June 26, 2022, and data was leaked on August 20, 2022, after a ransom was presumably not paid.","src":["https://www.bleepingcomputer.com/news/security/rail-giant-wabtec-discloses-data-breach-after-lockbit-ransomware-attack/"]},{"v":"Port of Lisbon Administration (APL)","g":"LockBit","d":"2022-12-25","c":"Portugal","fin":"not publicly disclosed","ran":"$1,500,000","dt":"The port's official website remains offline, but operations were not impacted according to the company statement.","di":"Financial reports, audits, budgets, contracts, cargo information, ship logs, crew details, customer PII, port documentation, email correspondence.","s":"The LockBit ransomware gang claimed an attack on the Port of Lisbon Administration on Christmas day, threatening to leak stolen data unless a ransom of $1,500,000 is paid. The port's operations were reportedly unaffected, but the official website is currently offline, and the gang has already published samples of the stolen data.","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-claims-attack-on-port-of-lisbon-in-portugal/"]},{"v":"transportation and logistics organizations in Ukraine and Poland","g":"Sandworm","d":"not publicly disclosed","c":"Ukraine and Poland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"A series of ransomware attacks targeting transportation and logistics organizations in Ukraine and Poland have been linked to the Russian Sandworm threat group. The attacks, utilizing Prestige ransomware, have been noted for their sophisticated deployment methods and are part of a broader pattern of Russian state-aligned cyber activity in the region.","src":["https://www.bleepingcomputer.com/news/security/russian-military-hackers-linked-to-ransomware-attacks-in-ukraine/"]},{"v":"TAP Air Portugal","g":"Ragnar Locker","d":"not publicly disclosed","c":"Portugal","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The website and app experienced instability and were unable to function properly due to the cyberattack.","di":"Hundreds of Gigabytes of data might have been compromised, including customer information such as names, dates of birth, emails, and addresses.","s":"TAP Air Portugal was targeted by the Ragnar Locker ransomware gang, which claimed to have attacked the airline's systems. Although TAP stated that the attack was blocked and no customer data was accessed, the ransomware group threatened to release evidence contradicting this claim, suggesting that significant amounts of customer data may have been compromised.","src":["https://www.bleepingcomputer.com/news/security/ragnar-locker-ransomware-claims-attack-on-portugals-flag-airline/"]},{"v":"SpiceJet","g":"not publicly disclosed","d":"May 25, 2022","c":"India","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Flights experienced delays ranging from two to five hours, with some cancellations due to operational restrictions.","di":"not applicable","s":"SpiceJet, a low-cost Indian airline, faced an attempted ransomware attack that impacted its systems and caused significant flight delays. The IT team managed to contain the attack, restoring normal operations, but customer reports indicated ongoing issues with service availability and booking systems.","src":["https://www.bleepingcomputer.com/news/security/spicejet-airline-passengers-stranded-after-ransomware-attack/"]}],"stats":[{"m":"Transportation sector ransomware attack increase, 2024→2025","v":"34% year-over-year increase in ransomware attacks against the transportation sector (108 incidents in Q1 2025, up from 69 in Q4 2024, ~15% of total tracked ransomware activity)","s":"Industry ransomware tracking roundups (aggregated in Asimily 'Largest Transportation and Logistics Cyberattacks of 2025' citing IC3/IBM X-Force data)","u":"https://asimily.com/blog/largest-transportation-and-logistics-cyberattacks/"},{"m":"Average ransom demand, transportation sector, 2025 vs 2024","v":"$2.19 million average demand in 2025 vs. $279,000 in 2024, a 685% year-over-year increase, one of the sharpest jumps of any industry","s":"Comparitech Worldwide Ransomware Roundup: 2025 End-of-Year Report","u":"https://www.comparitech.com/news/worldwide-ransomware-roundup-2025-end-of-year-report/"},{"m":"Transportation sector attack growth (OT/IoT-linked)","v":"382% year-over-year increase in attacks targeting the transportation sector","s":"Zscaler ThreatLabz 2025 Mobile, IoT & OT Threat Report","u":"https://www.zscaler.com/blogs/security-research/industry-attacks-surge-mobile-malware-spreads-threatlabz-2025-mobile-iot-ot"},{"m":"Financial motivation share of transportation-sector breaches","v":"99% of breaches in the transportation sector are financially motivated, among the highest of any industry tracked","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Ransomware share of breaches (all industries)","v":"Ransomware present in 44% of breaches overall in 2025; median ransom payout fell to $115K; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Average / median ransom payment (all industries), Q4 2024","v":"Average payment $553,959 (up 16% QoQ); median payment $110,890 (down 45% QoQ); only 25% of victims paid a ransom in Q4 2024","s":"Coveware Quarterly Ransomware Report, Q4 2024 ('Will Law Enforcement success against ransomware continue in 2025?')","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Ransom payment rate trend into 2025","v":"Payment rate fell to roughly 20% of victims by Q4 2025, continuing the multi-year decline as more organizations refuse to pay","s":"Coveware Quarterly Ransomware Reports (aggregated via secondary reporting)","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Third-party/supply-chain breach share (all industries)","v":"Third-party involvement rose to 30% of all breaches in 2025 (doubling from prior year), directly relevant to transportation/logistics given reliance on TMS/ELD/freight-forwarding software vendors","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Data encryption rate in successful attacks (cross-industry, useful baseline)","v":"Percentage of ransomware attacks resulting in actual data encryption fell from 70% (2024) to 50% (2025), with extortion-only (no encryption) attacks rising to 10% from 3%, reflecting a broader shift toward pure data-theft extortion also seen in logistics incidents (e.g., JAS Worldwide, Estes)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Global ransomware attack volume, 2025 vs 2024","v":"7,419 ransomware attacks recorded globally in 2025, a 32% increase over 5,631 in 2024","s":"Comparitech Worldwide Ransomware Roundup: 2025 End-of-Year Report","u":"https://www.comparitech.com/news/worldwide-ransomware-roundup-2025-end-of-year-report/"},{"m":"Ransomware.live tracked victim volume, Transportation/Logistics sector","v":"500+ individually tracked victim postings across the Transportation/Logistics sector tag on ransomware.live as of July 2026, spanning dozens of ransomware groups (Thegentlemen, Akira, Qilin, Deadlock, Ailock, Arcusmedia, Safepay, Chaos, Cry0, Krybit, and others) and 20+ countries in just the most recent weeks of listings observed","s":"ransomware.live sector activity feed (Transportation/Logistics)","u":"https://www.ransomware.live/activity/Transportation-Logistics"}]}],"hazards":[{"key":"initial access vectors","name":"Initial Access Vectors","fam":"Initial Access","desc":"How attackers first get in; retail/consumer-services shows a disproportionate reliance on social-engineering of people and processes rather than pure technical exploitation, refle
