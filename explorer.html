id/RmVycm92aWFsQEFpTG9jaw==","https://sosransomware.com/en/ransomware-groups/ailock-ransomware-the-raas-operator-threatening-to-alert-regulators-and-competitors/","https://darkwebinformer.com/ransomware-attack-update-july-14th-2026/"]},{"v":"Balfour Beatty","g":"INC Ransom (Oct 2025); CoinbaseCartel (Apr 2026)","d":"October 12, 2025 and April 8, 2026 (two separate claimed incidents)","c":"United Kingdom (international infrastructure group, LSE-listed)","fin":"Not publicly disclosed for either incident.","ran":"Not publicly disclosed for either incident.","dt":"Not publicly disclosed for either incident.","di":"Leak size described as 'unknown' in available secondary reporting for both incidents; no confirmed data-type breakdown found in public sources.","s":"Balfour Beatty, a leading UK-headquartered international infrastructure group delivering construction, engineering and support services across transportation, power, buildings and civil works in the UK, US and other markets, was claimed by two different ransomware groups within a six-month span: INC Ransom in October 2025 (targeting US operations) and CoinbaseCartel in April 2026 (UK).","src":["https://www.ransomware.live/id/QmFsZm91ciBCZWF0dHlAaW5jcmFuc29t","https://www.ransomware.live/id/QmFsZm91ciBCZWF0dHlAY29pbmJhc2VjYXJ0ZWw","https://www.dexpose.io/coinbasecartel-strikes-balfour-beatty-in-uk-ransomware-attack/","https://www.breachsense.com/breaches/balfour-beatty-data-breach/"]},{"v":"Bechtel Corporation","g":"Clop","d":"Claimed November 20-21, 2025","c":"United States (privately held, one of the world's largest engineering/construction/project-management firms, major US government contractor)","fin":"Not publicly disclosed by Bechtel; no company statement located.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Specific data types/volume exfiltrated from Bechtel were not detailed in available sources; the broader Oracle EBS campaign is understood to have exposed enterprise financial, HR and procurement data (the standard EBS module set) at affected organizations generally.","s":"Bechtel was named by the Clop ransomware group as part of a large-scale extortion wave exploiting a zero-day vulnerability (CVE-2025-61882) in Oracle E-Business Suite. Clop posted roughly 39 victim organizations across many industries within a 24-hour window in this campaign; Clop had earlier exfiltrated data via the Oracle EBS flaw in August 2025 and followed up with mass extortion emails in late September 2025 before publishing leak-site listings in November.","src":["https://www.dexpose.io/clop-ransomware-targets-bechtel-corporation/","https://www.cybersecuritydive.com/news/hackers-clop-extortion-campaign-executives/801808/","https://dailydarkweb.net/clop-ransomware-group-lists-39-global-victims-including-mazda-canon/"]},{"v":"Kier Group plc (KIER.CO.UK)","g":"Clop","d":"Discovered/claimed November 6-7, 2025","c":"United Kingdom (major listed construction, property and infrastructure services company, LSE:KIE)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed; Clop threatened to release data absent negotiation.","dt":"Not publicly disclosed.","di":"Per secondary reporting citing infostealer-derived telemetry on the incident record: 4 employees, 120 users, and 23 third-party employee credentials referenced as compromised/exposed; specific stolen-file categories from the Clop leak itself were not detailed in available sources.","s":"Kier Group, a leading UK construction, civil-engineering, property and infrastructure services company operating across defence, transportation, health, education and utilities, was claimed by Clop as part of the same Oracle E-Business Suite CVE-2025-61882 mass-exploitation campaign that hit Bechtel days later.","src":["https://www.dexpose.io/clop-ransomware-targets-kier-co-uk-in-uk-cyberattack/","https://ransomware.live/id/S0lFUi5DTy5VS0BjbG9w","https://www.breachsense.com/breaches/kier-group-data-breach/"]},{"v":"Kajima Europe","g":"Qilin","d":"Claimed November 22, 2025","c":"United Kingdom / continental Europe operations of Kajima Corporation (Japan, one of the world's largest construction firms)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed/documented in available sources.","di":"Approximately 400 GB of data reported exfiltrated, including engineering documents, CAD designs and blueprints, financial and investment records, construction contracts and procurement documentation, internal communications, subcontractor lists and payment schedules, employee HR files/credentials, and project-management files.","s":"Qilin, one of the most prolific ransomware groups globally in 2025 (claiming roughly 800 victims across 50+ countries since January 2025, and dominant in Europe with 65 Q3-2025 victims per Cyble), claimed Kajima Europe, the European arm of major Japanese construction group Kajima Corporation, exfiltrating a large volume of corporate and project data.","src":["https://www.dexpose.io/qilin-ransomware-strikes-kajima-europe/","https://botcrawl.com/kajima-europe-data-breach/","https://cyble.com/blog/europe-ransomware-attacks-q3-2025/"]},{"v":"AECOM","g":"Pysa","d":"Discovered November 8-9, 2021","c":"United States (Fortune 500 global engineering, design and infrastructure-consulting firm)","fin":"Specific incident-response, remediation or credit-monitoring costs were not publicly disclosed; no stock-impact or insurance-payout figures found in public sources.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Personal information of present and former AECOM employees was exposed, including names, addresses, Social Security numbers, and personal bank account and routing numbers, via compromise of the US payroll system; exact number of employees affected was not confirmed in available public sources.","s":"AECOM was compromised in a payroll-system hack attributed to the Pysa (Mespinoza) ransomware group's double-extortion operators; AECOM subsequently notified current and former employees that their personal data had been exposed and reported the incident to the California Attorney General's office. This is one of the better-documented incidents in the sector because it produced a formal breach notification rather than only a leak-site claim.","src":["https://www.breachsense.com/breaches/aecom-com/","https://www.malwarebytes.com/blog/news/2021/03/pysa-the-ransomware-attacking-schools","https://www.upguard.com/security-report/aecom"]},{"v":"Turner Construction Company","g":"Everest","d":"Discovered March 7, 2022","c":"United States (one of the largest construction management firms in the US)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Specific data types/volume were not detailed in available public sources beyond the leak-site listing itself.","s":"Turner Construction Company was listed as a victim by the Everest ransomware group, a double-extortion (and increasingly pure data-extortion) operator active since December 2020 that has targeted government, healthcare, manufacturing and IT-services organizations across North America, Europe and Asia. Turner's inclusion illustrates the group's willingness to target top-tier construction management firms.","src":["https://www.ransomware.live/group/everest","https://cti.fyi/groups/everest.html","https://www.ransomware.live/activity/Construction"]},{"v":"Sando","g":"Donut","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Donut extortion group has been confirmed to deploy ransomware in double-extortion attacks, targeting various enterprises including the multinational construction company Sando. The group uses customized ransomware that encrypts files and appends a specific extension, while also engaging in theatrics with their ransom notes and marketing strategies.","src":["https://www.bleepingcomputer.com/news/security/donut-extortion-group-also-targets-victims-with-ransomware/"]},{"v":"Knauf Group","g":"Black Basta","d":"June 29, 2022","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Knauf's global IT team shut down all IT systems to isolate the incident and is in the process of forensic investigation, incident response, and remediation.","di":"20% of the files allegedly exfiltrated included email communication, user credentials, employee contact information, production documents, and ID scans.","s":"Knauf Group, a multinational building materials producer, was targeted by the Black Basta ransomware gang on June 29, 2022. The attack disrupted business operations, leading to a complete shutdown of IT systems while the company investigates and responds to the incident. Black Basta claimed responsibility and leaked 20% of the stolen files, indicating ongoing negotiations for a ransom payment.","src":["https://www.bleepingcomputer.com/news/security/building-materials-giant-knauf-hit-by-black-basta-ransomware-gang/"]}],"stats":[{"m":"Total Construction-sector victims recorded (all-time, through mid-July 2026)","v":"1,362 victims","s":"ransomware.live (data.ransomware.live/victims.json, filtered to activity=Construction; cross-checked against www.ransomware.live/activity/Construction which independently shows the same 1,362 total)","u":"https://www.ransomware.live/activity/Construction"},{"m":"Construction-sector victims by year (2021-2026, partial 2026)","v":"2021: 73 | 2022: 136 | 2023: 307 | 2024: 62 (likely data-completeness gap) | 2025: 513 | 2026 (through mid-July): 267","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Most active ransomware groups targeting Construction (all-time victim count)","v":"Akira 135, Qilin 131, LockBit3 88, Play 82, DragonForce 61, LockBit2 47, ALPHV/BlackCat 41, Sinobi 39, INC Ransom 39, SafePay 33, 8Base 31, Medusa 30, BianLian 28, Lynx 27, TheGentlemen 25, Clop 23, BlackBasta 21, Cactus 20, LockBit5 20, Conti 18","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Top countries for Construction-sector victims","v":"US 509, GB 73, CA 49, DE 31, AU 28, FR 28, IT 20, CH 16, SG 15, AT 12, ES 11, BR 10, MY 10, SA 9 (383 records had no country coded)","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Percentage of ransomware victims (all industries) who paid the ransom, 2025","v":"49% paid (down from 56% in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average recovery cost excluding ransom payment, 2025 (all industries)","v":"$1.53 million (down 44% from $2.73 million in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Ransom demand/payment size distribution, 2025","v":"57% of ransom demands and 52% of actual payments were $1 million or more; organizations that paid disbursed ~85% of the initial demand on average","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Recovery speed, 2025","v":"53% of victim organizations fully recovered within one week (up from 35% in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Data-theft-plus-encryption rate, construction/property/energy sectors vs. manufacturing","v":"Only ~15% of construction/property/energy organizations faced combined data theft and encryption, versus 39% for manufacturers","s":"Sophos, cited via industry press coverage of Sophos ransomware research (construction/property/energy breakout)","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Ransomware victims who paid, Q4 2024 (all industries)","v":"25% paid (a historic low at time of report)","s":"Coveware Quarterly Ransomware Report, Q4 2024","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average and median ransom payment, Q4 2024 (all industries)","v":"Average payment $553,959 (+16% QoQ); median payment $110,890 (-45% QoQ)","s":"Coveware Quarterly Ransomware Report, Q4 2024","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Total on-chain ransomware payments, 2025 (all industries, global)","v":"More than $820 million (down ~8% YoY from $892 million in 2024), though claimed attacks rose 50% YoY and the median ransom payment grew 368% YoY to nearly $60,000","s":"Chainalysis 2026 Crypto Crime Report (covering 2025 data)","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Global average total cost of a data breach, 2025 (all industries)","v":"$4.44 million","s":"IBM Cost of a Data Breach Report 2025 (via databreachcost.com aggregation; construction is not broken out as a separate sector in IBM's 17-industry taxonomy - closest proxy 'Industrial' sector averaged $5 million)","u":"https://databreachcost.com/by-industry"},{"m":"Ransomware involvement in breaches overall, 2025","v":"Ransomware present in 44% of all reviewed breaches (up from 32% the prior year); 39% of large-enterprise breaches vs. 88% of SMB breach cases involved ransomware (not construction-specific)","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"}]},{"name":"Educational Services","tag":"Education","overview":"The ransomware.live Education sector dataset returned 1,296 named victims spanning 2016 through 20 July 2026. Volume by year shows the sector's escalation and persistence: 2016 (2), 2017 (1), 2018 (2), 2019 (4), 2020 (15), 2021 (74), 2022 (157), 2023 (307), 2024 (248), 2025 (328), and 158 already recorded in the first ~7 months of 2026. 2023 and 2025 are the peak full years; the 2024 dip did not hold, and 2026 is tracking broadly in line with recent years. Attribution is highly fragmented, with 135 distinct groups named. The top claimants across the full period are lockbit3 (114), qilin (73), incransom (72), vicesociety (63), rhysida (57), pysa (50), medusa (45), clop (44), ransomhub (43), and safepay (39); the top ten groups account for only 46.3% of postings, confirming a long tail of smaller and short-lived brands. Composition has shifted materially: restricting to 2025-2026, the leaders become qilin (65), incransom (47), safepay (29), interlock (25), thegentlemen (24), lockbit5 (19), fog (19), nova (18), shinyhunters (14), and rhysida (13) - i.e. LockBit-era dominance and the education-specialist Vice Society and PYSA brands have been displaced by Qilin, INC Ransom, Interlock and SafePay, alongside pure-extortion actors such as ShinyHunters. Geographically the sector is heavily US-weighted: of 947 records with a resolved country, the US accounts for 519 (54.8% of known-country victims, 78 countries represented in total). Other leading countries are GB (66), FR (31), CA (30), BR (28), IN (23), DE (22), AU (21), IT (16), TH (13), ES (9), MX (8), TW (7) and IL (7); 349 records carry no country. By region, Europe accounts for roughly 191 victims, APAC 96, Latin America and the Caribbean 59, and Canada 30. Structurally the sector shows three distinct victim populations that behave very differently: US K-12 districts (overwhelmingly the largest count, typically small IT teams, frequently posted by Interlock, Qilin, Medusa and INC Ransom), universities and research institutions (higher data value, research IP and often regulated health data, targeted by Qilin, Rhysida and Fog), and edtech/SIS/LMS vendors, which are numerically rare but produce catastrophic aggregation events - the PowerSchool SIS compromise (Dec 2024) and the Instructure/Canvas LMS breaches (May 2026) each affected thousands of institutions from a single intrusion. Extortion economics in the leak-site data are modest relative to other sectors: only 12 of 1,296 records carried an explicit ransom figure, clustered between $50,000 and $400,000 (largely Medusa postings against US K-12 districts), with the notable outlier being Asia University, Taiwan (crazyhunter, March 2025) at $1,500,000. Only 21 records disclosed a data volume, ranging from 20MB to 1.5TB. Press coverage is attached to just 170 of 1,296 records (13%), meaning the large majority of education ransomware events receive no public reporting, and loss figures for the sector must be inferred from survey data rather than incident disclosure.","distinct":"1,295 tracked victim records, rising from 15 in 2020 to 307 in 2023 and 328 in 2025, with 157 already in the first seven months of 2026, a sustained upward trajectory. Heavily US-concentrated (519 of 946 country-attributed records) and dominated by LockBit3 (114), Qilin (73), INC Ransom (72), Vice Society (63) and Rhysida (57); the prominence of Vice Society and Rhysida reflects deliberate specialization in schools and universities as soft, data-rich, under-defended targets. Distinctive combination of open-by-design networks, BYOD and research-collaboration culture, minors' data raising notification sensitivity, and constrained appropriated budgets that limit both prevention spend and ransom payment. FERPA is substantively strict but historically weak on financial penalty, so the regulatory tail is thinner than healthcare's at comparable data sensitivity, with state student-privacy statutes and litigation carrying the real exposure. Universities add research IP of nation-state interest.","leverage":"Exposure of student records including minors' data, staff PII and research IP, plus disruption timed to enrollment, examination and term-start pressure points.","tolerance":"Moderate to high in absolute terms, days to weeks absorbed by academic calendars, but sharply lower at term start, enrollment and examination periods. Weak budget capacity for both ransom and rapid restoration means outages run longer than tolerance alone would predict.","bulk":{"total":1298,"years":{"2016":2,"2017":1,"2018":2,"2019":4,"2020":15,"2021":74,"2022":157,"2023":307,"2024":248,"2025":328,"2026":160},"groups":[["lockbit3",114],["qilin",73],["incransom",72],["vicesociety",63],["rhysida",57],["pysa",50],["medusa",45],["clop",44]],"countries":[["US",519],["GB",66],["CA",32],["FR",31],["BR",28],["IN",23]],"pressPct":13,"ransomPct":1},"incidents":[{"v":"PowerSchool (SIS vendor serving K-12 districts in the US, Canada and elsewhere)","g":"Not a named ransomware brand - single-actor extortion; US DOJ charged Matthew D. Lane, then a 19-year-old student at Assumption University","d":"December 2024 (disclosed January 2025; district-level re-extortion May 2025)","c":"US","fin":"Total programme cost not publicly disclosed. PowerSchool offered two years of identity protection and credit monitoring to affected students and educators; class-action litigation followed. Individual district remediation and notification costs were not publicly itemised.","ran":"Approximately $2.85 million in bitcoin demanded and PAID by PowerSchool, per US Department of Justice court documents made public 20 May 2025. Amounts sought in the subsequent district-level extortion attempts were not publicly disclosed.","dt":"No mass encryption event - this was exfiltration-only extortion, so districts did not suffer the closure pattern typical of encryption attacks. Recovery centred on notification, credit monitoring, credential resets and multi-jurisdiction regulatory response, extending well beyond a year and reopening when re-extortion began in May 2025.","di":"The attacker claimed data on 62.4 million students and 9.5 million teachers across approximately 6,505 school districts in the US, Canada and other countries. Exposed fields included names, addresses, dates of birth, contact details, and for some individuals Social Security numbers and medical/grade information. Affected populations are overwhelmingly minors, whose identity exposure persists for decades.","s":"The defining edtech aggregation event. An attacker used compromised credentials to access PowerSchool's PowerSource support portal and exfiltrate student and teacher data from the hosted SIS environment. PowerSchool paid an extortion demand in exchange for a video purporting to show deletion of the only copy of the data. The deletion proved worthless: in May 2025 the same data was used to extort individual school districts directly in Canada and North Carolina, with attackers sending samples to schools. PowerSchool stated it did not believe this was a new intrusion because the samples matched the December theft. This is the clearest available demonstration that paying for a deletion promise transfers no risk downstream, and that a single vendor compromise generates thousands of correlated district-level losses.","src":["https://www.bleepingcomputer.com/news/security/powerschool-hacker-now-extorting-individual-school-districts/","https://techcrunch.com/2025/05/08/powerschool-paid-a-hackers-ransom-but-now-schools-say-they-are-being-extorted/","https://www.edweek.org/technology/powerschool-paid-a-hackers-ransom-now-cyber-criminals-are-threatening-schools/2025/05","https://www.k12dive.com/news/college-student-charged-in-connection-with-powerschool-data-breach/748747/","https://www.cybersecuritydive.com/news/powerschool-data-breach-school-extortion-attempts/747801/","https://www.the74million.org/article/powerschool-paid-off-hackers-after-huge-breach-now-theyre-extorting-districts/"]},{"v":"Instructure Holdings, Inc. (Canvas LMS)","g":"shinyhunters","d":"2026-05-01 (intrusion 29-30 April 2026; second breach within roughly two weeks)","c":"US","fin":"Not publicly disclosed. Institutional costs spanned incident response, forensic review, portal remediation after defacement, and notification across thousands of schools.","ran":"Ransom PAID by Instructure under an agreement reached 11 May 2026; the amount was not publicly disclosed. Attackers reportedly returned the data and supplied 'shred logs' as claimed proof of destruction - the same unverifiable deletion assurance seen in the PowerSchool case.","dt":"Instructure took Canvas, Canvas Beta and Canvas Test offline on 7 May 2026 for investigation and restored service the following day; Canvas Data 2 and Canvas Beta had been in maintenance since 1 May. The Free-For-Teacher account programme was permanently shut down as a remediation measure. Roughly 330 institutions additionally had to remediate defaced login portals.","di":"ShinyHunters claimed 3.6TB covering 275 million users across approximately 9,000 institutions (reporting also cites 8,809 universities, education ministries and other bodies) - figures Instructure has not confirmed. Instructure confirmed exposure of names, email addresses, student ID numbers and some private messages between Canvas users, and stated there was no evidence that passwords, financial data or SSNs were taken. Attacker leak-site copy claimed billions of private student-teacher and student-student messages.","s":"Described in reporting as the largest education-sector breach on record. ShinyHunters exploited Instructure's Free-For-Teacher (FFT) programme - which allowed educators to create Canvas accounts without institutional verification - to reach production data, then breached the platform a second time within about two weeks. After Instructure missed the initial 7 May negotiation deadline, the group escalated by defacing Canvas login portals at roughly 330 institutions and pivoting to direct school-by-school extortion with a final 12 May deadline. Instructure reached a payment agreement on 11 May, one day before the leak deadline. The incident is the purest example of LMS vendor concentration risk: Canvas is used by 41% of US higher education institutions, so a single platform intrusion simultaneously exposed thousands of otherwise unconnected insureds.","src":["https://www.bleepingcomputer.com/news/security/edu-tech-firm-instructure-discloses-cyber-incident-probes-impact/","https://thehackernews.com/2026/05/instructure-reaches-ransom-agreement.html","https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers","https://en.wikipedia.org/wiki/2026_Canvas_security_incident","https://www.halcyon.ai/ransomware-alerts/education-sector-in-the-crosshairs-shinyhunters-extortion-campaign-against-instructure","https://www.reedsmith.com/articles/canvasinstructure-cyberattack-key-developments-and-action-items-for-higher-education-institutions/"]},{"v":"University of Hawai'i Cancer Center","g":"noescape (per ransomware.live leak-site attribution; press reporting did not definitively confirm the group)","d":"2025-08-31 (discovered on or around 31 August 2025)","c":"US","fin":"Not publicly disclosed. Costs included ransom payment, third-party forensic and recovery support, and notification plus remediation for up to 1.15 million individuals.","ran":"Ransom PAID - the centre worked with third-party cybersecurity experts to obtain a decryption tool and paid to prevent publication of the stolen data. The amount was not publicly disclosed.","dt":"Encrypted data was recovered using a decryption tool obtained through the payment. Specific outage duration was not publicly disclosed. Notification lagged roughly four months behind discovery, with the centre compiling names and addresses for study participants well after the August 2025 intrusion.","di":"Up to 1.15 million individuals affected (some reporting cites approximately 1.2 million). Exposed data included Social Security numbers and driver's licence numbers sourced from the Hawai'i State Department of Transportation, and City and County of Honolulu voter registration records from 1998. Much of the affected population were research study participants rather than students or employees.","s":"A university research-archive breach that illustrates how higher education accumulates liability for populations who were never students or staff. Attackers reached data from the Multiethnic Cohort (MEC) Study, a longitudinal epidemiological study established in 1993, plus files from three other diet-and-cancer studies. Compounding the event, the university did not notify affected study participants for roughly four months - a delay that drew specific public criticism and independent regulatory risk. Notably, the university PAID to prevent publication, making this one of the few education cases with a confirmed payment decision.","src":["https://www.hipaajournal.com/university-of-hawaii-cancer-center-ransomware-data-breach/","https://therecord.media/university-of-hawaii-ransomware-data-breach","https://www.bleepingcomputer.com/news/security/university-of-hawaii-cancer-center-ransomware-attack-affects-nearly-12-million-people/","https://www.securityweek.com/hackers-accessed-university-of-hawaii-cancer-center-patient-data-they-werent-immediately-notified/","https://www.govinfosecurity.com/cancer-center-research-study-hack-affects-12m-a-30912"]},{"v":"Highline Public Schools","g":"Not publicly attributed (district confirmed ransomware; FBI engaged)","d":"2024-09-07 (discovered Saturday 7 September 2024)","c":"US","fin":"Not publicly disclosed. Costs included district-wide re-imaging of all student and staff devices, third-party forensic engagement, and three days of lost instruction across 34 schools.","ran":"Not publicly disclosed - the district declined to say how much was demanded, citing the ongoing investigation, and did not publicly confirm any payment.","dt":"All schools and activities closed for three days, from Monday 9 September through Wednesday 11 September 2024, reopening Thursday 12 September. Network systems remained disrupted into October 2024, when all student and staff devices had been re-imaged - roughly a month of degraded operation after classes resumed.","di":"The district confirmed that highly sensitive personal, financial and medical data was breached. The precise number of affected students and staff was not publicly disclosed in the reporting reviewed.","s":"The canonical K-12 operational-disruption case. Highline, a Washington state district of 34 schools serving roughly 17,500 students and 2,000 staff, detected the intrusion on a Saturday and immediately isolated critical systems - then closed every school and all activities for three days because core instructional and safety systems could not be trusted. It demonstrates the sector's defining characteristic for insurers: a school district has no degraded operating mode, so business interruption manifests as total closure of an essential public service, with statutory make-up obligations and knock-on effects to transport and meal programmes.","src":["https://www.bleepingcomputer.com/news/security/highline-public-schools-confirms-ransomware-attack-was-behind-september-shut-down/","https://therecord.media/highline-public-schools-washington-state-cyberattack","https://www.infosecurity-magazine.com/news/sensitive-data-highline-ransomware/","https://www.seattletimes.com/education-lab/hackers-target-seattle-area-school-district-for-ransomware-attack/","https://www.securitymagazine.com/articles/101037-cyberattack-compromises-and-shuts-down-highline-public-schools"]},{"v":"British Library","g":"rhysida","d":"2023-10-28 (attack late October 2023)","c":"GB","fin":"Approximately GBP 6-7 million in recovery costs, funded from roughly 40% of the library's financial reserves - about ten times the ransom demanded.","ran":"20 bitcoin demanded, approximately GBP 596,000 at the time. NOT PAID - the library refused, and Rhysida published the data.","dt":"Services were severely disrupted for months. The main catalogue returned online on 15 January 2024 in read-only format, roughly two and a half months after the attack, with other services expected to remain unavailable for months beyond that. Recovery was complicated by legacy infrastructure and constrained funding, documented in the library's own transparency reporting and subsequent academic analysis.","di":"Approximately 600GB of material leaked publicly after refusal to pay, including internal documents and staff and user data. Full affected-individual counts were not publicly itemised in the reporting reviewed.","s":"The UK's national library, described as one of the worst cyber incidents in British history. Rhysida rendered almost all VMware ESXi servers unavailable, taking down the website, on-site services and Wi-Fi; the library remained physically open but could accept only cash payments. The institution refused to pay and Rhysida published the stolen material. The case is the reference point for catastrophic recovery severity in a public, non-commercial education/research body: the recovery cost dwarfed the ransom demand by an order of magnitude, and the library had to consume roughly 40% of its financial reserves - a funding mechanism with no analogue in the commercial sector and a key consideration for public-institution insureds.","src":["https://en.wikipedia.org/wiki/British_Library_cyberattack","https://www.theregister.com/2023/10/31/british_library_it_outage/","https://www.securityweek.com/details-and-lessons-learned-from-the-ransomware-attack-on-the-british-library/","https://ital.corejournals.org/index.php/ital/article/view/17112","https://www.imd.org/ibyimd/technology/full-transparency-10-lessons-from-the-cyber-attack-on-the-british-library/"]},{"v":"University of Manchester","g":"Not publicly attributed to a named leak-site brand; triple-extortion tactics consistent with groups active against UK/US higher education in 2023","d":"2023-06-05 (intrusion began 5 June 2023; detected 9 June; containment from 14 June)","c":"GB","fin":"Not publicly disclosed.","ran":"Not publicly disclosed. No public confirmation of payment; the university worked with the ICO, NCSC and National Crime Agency.","dt":"Detected 9 June 2023 with containment beginning 14 June. Specific outage duration and full recovery timeline were not publicly disclosed; response ran in parallel with ICO and NCSC engagement.","di":"Around 250GB of data accessed. Included NHS records relating to 1.1 million patients across more than 200 hospitals, gathered for medical research - with NHS numbers and the first three letters of patients' postcodes among the fields, plus major-trauma and terrorist-attack victim treatment data. Separately, student and alumni data was leaked including names, contact details, gender, dates of birth, university ID numbers and fee status. Students and staff received direct threats to sell their data.","s":"The clearest illustration of research-data liability in higher education. Attackers reached a research archive holding NHS patient records gathered from more than 200 hospitals for medical research purposes - including major-trauma patient reports and treatment records for victims of terrorist attacks - alongside current student and alumni data. Attackers then emailed students and staff directly threatening to sell their data, a triple-extortion pressure tactic. The incident triggered questions in UK health and education policy about universities holding national-scale clinical datasets under research governance rather than clinical security controls.","src":["https://www.itpro.com/security/data-breaches/nhs-data-leak-raises-serious-questions-about-manchester-university-cyber-attack","https://www.digitalhealth.net/2023/06/nhs-patient-data-compromised-in-university-cyber-attack-report/","https://www.cpomagazine.com/cyber-security/250gb-of-nhs-patient-data-leaked-in-the-university-of-manchester-cyber-attack/","https://www.govinfosecurity.com/trauma-terrorist-victim-data-breached-in-university-attack-a-22409","https://www.csoonline.com/article/644235/nhs-data-reportedly-compromised-in-university-of-manchester-cyberattack.html"]},{"v":"Minneapolis Public Schools (Special School District No. 1)","g":"medusa","d":"2023-02-17 (encryption discovered 17 February 2023)","c":"US","fin":"Not publicly disclosed. Costs included forensic investigation, restoration from backups, and notification plus credit monitoring for 105,617 individuals.","ran":"$1,000,000 demanded by Medusa with a 17 March 2023 deadline; the leak site also offered a $50,000-per-day deadline extension and listed the data for outright purchase at $1 million. NOT PAID - the district restored from internal backups and Medusa published the stolen files.","dt":"Widespread digital disruption following the 17 February 2023 encryption event; the district recovered encrypted data from internal backups rather than paying. Precise system-restoration duration was not publicly disclosed. Notification took seven months, completing in September 2023.","di":"105,617 people notified as affected. Nearly 200,000 individual files containing sensitive student and educator information were released publicly, including student psychological and welfare records. Cybersecurity experts confirmed campus security maps and school security blueprints were among the leaked material - creating ongoing physical-safety risk to students.","s":"The reference case for extortion harm to minors and for notification failure. Medusa demanded $1 million with a 17 March deadline, posted the district on its leak site with a countdown, offered to sell the data to any buyer for $1 million, and offered the district the option to pay $50,000 per additional day of delay. The district refused and restored from internal backups - but Medusa then published the files. Analysts confirmed the leaked corpus included school security blueprints, a physical-safety exposure that cannot be remediated by notification or credit monitoring. The district publicly characterised the event as an 'encryption event' and did not notify the 105,617 affected individuals until September 2023, seven months later.","src":["https://www.the74million.org/article/kept-in-the-dark-inside-the-minneapolis-schools-cyberattack/","https://therecord.media/minneapolis-schools-say-data-breach-affected-100000","https://www.bleepingcomputer.com/news/security/ransomware-gang-posts-video-of-data-stolen-from-minneapolis-schools/","https://www.cbsnews.com/minnesota/news/cybersecurity-experts-confirm-security-blueprints-stolen-mps-ransomware-attack/","https://www.campussafetymagazine.com/news/over-189000-files-leaked-minneapolis-public-schools-data-breach/123369/","https://www.minnpost.com/other-nonprofit-media/2023/03/hackers-use-stolen-student-data-against-minneapolis-schools-in-brazen-new-threat/"]},{"v":"Los Angeles Unified School District (LAUSD)","g":"vicesociety","d":"2022-09-03 (attack 3 September 2022; leak-site posting 30 September 2022; data published 2 October 2022)","c":"US","fin":"Not publicly disclosed as a single figure. The district funded incident response, credit monitoring for affected individuals including contractors whose SSNs were exposed, and a subsequent security programme uplift.","ran":"Demand amount not publicly disclosed. NOT PAID - LAUSD publicly refused, stating public dollars are better spent on students than on criminals, and Vice Society published the data on its leak blog on 2 October 2022.","dt":"The attack disrupted district systems in early September 2022 at the start of the school year, though schools remained open. Threat actors had persistent access from 31 July to 3 September 2022 before detection - a dwell time of over a month. Full remediation timeline was not publicly disclosed.","di":"500GB of data stolen and published. The trove included student psychological assessments, health information including COVID-19 test data, and prior conviction reports. LAUSD separately confirmed that contractors' Social Security numbers were among the stolen data. Passport data and other sensitive identifiers were also reported as potentially included.","s":"The attack that made K-12 ransomware a national policy issue in the US. Vice Society - the group that dominated education targeting in this period, ranking fourth all-time in the Education dataset with 63 victims - dwelled in the network of the second-largest US school district for over a month, from 31 July to 3 September 2022. LAUSD publicly refused to pay on the principle that 'dollars must be used to fund students and education' and that paying never guarantees full recovery, following FBI guidance. Vice Society published the full 500GB trove in retaliation. The leaked data's contents - student psychological assessments, health and COVID-19 test data, and prior conviction reports - established the template for how education extortion inflicts harm on minors specifically.","src":["https://techcrunch.com/2022/10/03/los-angeles-school-district-ransomware-data/","https://www.bleepingcomputer.com/news/security/lausd-says-vice-society-ransomware-gang-stole-contractors-ssns/","https://www.axios.com/2022/10/03/hackers-stolen-data-la-school-district-ransomware","https://www.cybersecuritydive.com/news/vice-society-threatens-los-angeles-schools-ransomware/633076/","https://www.npr.org/2022/09/07/1121422336/a-cyberattack-hits-the-los-angeles-school-district-raising-alarm-across-the-coun","https://www.upguard.com/blog/how-did-lausd-get-hacked"]},{"v":"Texas Tech University System","g":"Hive0163","d":"2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Interlock ransomware attack utilized a new malware strain called Slopoly, which was likely generated using AI tools. The attack involved data theft and extortion, with the threat group Hive0163 being responsible for the incident, which affected the Texas Tech University System.","src":["https://www.bleepingcomputer.com/news/security/ai-generated-slopoly-malware-used-in-interlock-ransomware-attack/"]},{"v":"La Sapienza University","g":"Femwar02","d":"","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The university's website remains offline, and technicians are working to restore systems from backups.","di":"not publicly disclosed","s":"La Sapienza University in Rome experienced a cyberattack that caused significant operational disruptions and led to the shutdown of its IT systems. Reports suggest that the attack is a ransomware incident linked to a pro-Russian group called Femwar02, which may have resulted in data encryption.","src":["https://www.bleepingcomputer.com/news/security/italian-university-la-sapienza-goes-offline-after-cyberattack/"]},{"v":"Kyowon Group","g":"not publicly disclosed","d":"January","c":"South Korea","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company is working to restore its online services, a process that is reportedly in its final stages.","di":"Over 9.6 million accounts registered, corresponding to about 5.5 million people may have had their information exposed.","s":"Kyowon Group, a South Korean conglomerate, confirmed a ransomware attack that disrupted its operations and potentially exposed customer information. The attack occurred in January, affecting approximately 600 out of 800 servers, and the company is currently investigating the extent of the data breach while working to restore services.","src":["https://www.bleepingcomputer.com/news/security/south-korean-giant-kyowon-confirms-data-theft-in-ransomware-attack/"]},{"v":"Baltimore City Public Schools","g":"Cloak ransomware","d":"February 13, 2025","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 31,000 individuals affected, including sensitive data belonging to roughly 1,150 students, current and former employees, volunteers, and contractors","s":"Baltimore City Public Schools experienced a data breach in February 2025, affecting over 31,000 individuals. The breach involved unauthorized access to sensitive documents, including social security numbers and student data, and has been linked to the Cloak ransomware group. The school district is providing credit monitoring services to those impacted.","src":["https://www.bleepingcomputer.com/news/security/baltimore-city-public-schools-data-breach-affects-over-31-000-people/"]},{"v":"Pennsylvania State Education Association (PSEA)","g":"Rhysida","d":"July 6, 2024","c":"United States","fin":"not publicly disclosed","ran":"20 BTC","dt":"not publicly disclosed","di":"517,487 individuals affected; personal, financial, and health data including driver's license or state IDs, social security numbers, account PINs, security codes, payment card information, passport information, taxpayer ID numbers, credentials, health insurance and medical information","s":"The Pennsylvania State Education Association (PSEA) experienced a data breach on July 6, 2024, affecting over 500,000 individuals. The Rhysida ransomware gang claimed responsibility for the breach, demanding a ransom of 20 BTC and threatening to leak the stolen data if not paid.","src":["https://www.bleepingcomputer.com/news/security/pennsylvania-education-union-data-breach-hit-500-000-people/"]},{"v":"Texas Tech University Health Sciences Center","g":"Interlock","d":"September 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"temporary disruption to some computer systems and applications","di":"1,465,000 people; Full name, Date of birth, Physical address, Social Security number, Driver's license number, Government ID number, Financial account information, Health insurance information, Medical information, Billing/claims data, Diagnosis and treatment information","s":"The Texas Tech University Health Sciences Center suffered a cyberattack in September 2024, impacting the data of 1.4 million patients. The attack was claimed by the Interlock ransomware group, which leaked 2.1 million files totaling 2.6 TB of data on their extortion portal.","src":["https://www.bleepingcomputer.com/news/security/texas-tech-university-system-data-breach-impacts-14-million-patients/"]},{"v":"Toronto District School Board","g":"not publicly disclosed","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All systems are operational and none of their operations are disrupted.","di":"Approximately 247,000 students and 40,000 staff members potentially impacted; sensitive information may have been exposed.","s":"The Toronto District School Board (TDSB) experienced a ransomware attack on its software testing environment, prompting an investigation into potential exposure of personal information. TDSB has confirmed that all systems remain operational and that they are working with law enforcement and cybersecurity experts to assess the situation.","src":["https://www.bleepingcomputer.com/news/security/toronto-district-school-board-hit-by-a-ransomware-attack/"]},{"v":"University System of Georgia","g":"Clop","d":"2023-05-01","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"800,000 individuals affected; Full or partial Social Security Number, Date of Birth, Bank account number(s), Federal income tax documents with Tax ID number, Driver's license number or identification card number","s":"The University System of Georgia was impacted by the Clop ransomware gang's MOVEit attacks, resulting in the exposure of sensitive data for 800,000 individuals. The organization began notifying affected individuals in April 2024 after determining that Clop had stolen sensitive files from its systems.","src":["https://www.bleepingcomputer.com/news/security/university-system-of-georgia-800k-exposed-in-2023-moveit-attack/"]},{"v":"Stanford University","g":"Akira","d":"September 27, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"27,000 individuals; personally identifiable information (PII) including date of birth, Social Security number, government ID, passport number, driver's license number, biometric data, health/medical information, email address with password, username with password, security questions and answers, digital signature, credit card information with security codes","s":"Stanford University experienced a ransomware attack that resulted in the theft of personal information belonging to 27,000 individuals. The attack was discovered on September 27, 2023, and was attributed to the Akira ransomware gang, which claimed to have stolen 430Gb of files from the university's systems and published the data on their dark web leak site.","src":["https://www.bleepingcomputer.com/news/security/stanford-data-of-27-000-people-stolen-in-september-ransomware-attack/"]},{"v":"Truman State University","g":"not publicly disclosed","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"several days of shutdowns","di":"not publicly disclosed","s":"A ransomware attack on Truman State University caused several days of shutdowns and required the engagement of external security teams. The attack highlights the vulnerabilities educational institutions face, particularly regarding the protection of sensitive personal data.","src":["https://www.bleepingcomputer.com/news/security/back-to-school-security-against-ransomware-attacks-on-k-12-and-colleges/"]},{"v":"Colorado Department of Higher Education","g":"not publicly disclosed","d":"2023-06-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"CDHE took steps to secure the network and have been working with third-party specialists to conduct a thorough investigation into this incident. CDHE also worked to restore systems and return to normal operations.","di":"The data stolen includes full names, social security numbers, dates of birth, addresses, proof of addresses (statements/bills), photocopies of government IDs, and for some, police reports or complaints regarding identity theft. The breach impacts students, past students, and teachers who attended public institutions in Colorado between 2004 and 2020.","s":"The Colorado Department of Higher Education disclosed a massive data breach following a ransomware attack on June 19, 2023. The attack compromised sensitive data affecting students, past students, and teachers, with the threat actors having access to the systems from June 11 to June 19, 2023. The stolen data includes personal information such as social security numbers and addresses, prompting the CDHE to offer identity theft monitoring to those impacted.","src":["https://www.bleepingcomputer.com/news/security/colorado-department-of-higher-education-warns-of-massive-data-breach/"]},{"v":"University of Waterloo","g":"not publicly disclosed","d":"2023-05-30","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"On May 30th, 2023, the University of Waterloo experienced a ransomware attack targeting their Microsoft Exchange email service. As a result, the university mandated a mass password reset for staff, faculty, and students, affecting approximately 42,000 individuals. The reset process was scheduled to be completed by June 22nd, 2023, to mitigate potential security risks.","src":["https://www.bleepingcomputer.com/news/security/how-to-manage-a-mass-password-reset-due-to-a-ransomware-attack/"]},{"v":"Hawai'i Community College","g":"not publicly disclosed","d":"July 28th 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"paid a ransom","dt":"not publicly disclosed","di":"approximately 28,000 people","s":"Hawai'i Community College admitted to paying a ransom to prevent the leaking of stolen data. The incident involved the data of approximately 28,000 individuals being at risk due to a ransomware attack.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-july-28th-2023-new-extortion-tactics/"]},{"v":"Colorado State University","g":"Clop","d":"July 12, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Colorado State University confirmed that the Clop ransomware operation stole sensitive personal information of current and former students and employees during the MOVEit Transfer data-theft attacks. The breach impacts data from as far back as 2021, affecting personal identifiable information such as names, dates of birth, and social security numbers.","src":["https://www.bleepingcomputer.com/news/security/colorado-state-university-says-data-breach-impacts-students-staff/"]},{"v":"Des Moines Public Schools","g":"BlackCat","d":"January 9, 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"forced to take all networked systems offline","di":"data of not publicly disclosed number of people","s":"Des Moines Public Schools confirmed a ransomware attack that occurred on January 9, 2023. The BlackCat ransomware gang claimed responsibility for the attack, which involved data theft. The school district had to take all networked systems offline as a result of the incident.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-23rd-2023-the-reddit-files/"]},{"v":"Bluefield University","g":"AvosLocker","d":"2023-04-30","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All examinations were postponed; remediation and system restoration efforts are still underway.","di":"1.2 TB of files, including admissions data from thousands of students, W-2 Tax Form for the University's President, and a document related to their insurance policy.","s":"The Avos ransomware gang hijacked Bluefield University's emergency alert system to threaten students and staff with the release of stolen personal data unless a ransom was paid. The incident led to the postponement of examinations and the release of some stolen data, including sensitive documents.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-hijacks-university-alert-system-to-issue-threats/"]},{"v":"Open University of Cyprus","g":"Medusa","d":"March 27, 2023","c":"Cyprus","fin":"not publicly disclosed","ran":"$100,000","dt":"Several central services and critical systems went offline; extensions for assignment submissions were provided by academic staff.","di":"Student lists with personally identifiable information, financial details of research contractors, and more.","s":"The Medusa ransomware gang claimed a cyberattack on the Open University of Cyprus, disrupting operations and leading to the offline status of critical systems. The group demanded a ransom of $100,000 and published data samples to prove their claims, affecting sensitive information of students and contractors.","src":["https://www.bleepingcomputer.com/news/security/medusa-ransomware-claims-attack-on-open-university-of-cyprus/"]},{"v":"Technion - Israel Institute of Technology","g":"DarkBit","d":"February 12, 2023","c":"Israel","fin":"$1,745,200","ran":"$1.7 million","dt":"The university is currently carrying out incident response activities and has blocked all communication networks. Some technical systems are gradually being restored, but the incident response is ongoing.","di":"not publicly disclosed","s":"Technion - Israel Institute of Technology was hit by a ransomware attack from a group called DarkBit, which demanded a ransom of approximately $1.7 million. The attack was reportedly motivated by protests against tech layoffs and anti-Israel sentiments, and the university is actively responding to the incident while maintaining normal campus operations.","src":["https://www.bleepingcomputer.com/news/security/ransomware-hits-technion-university-to-protest-tech-layoffs-and-israel/"]},{"v":"University of Duisburg-Essen","g":"Vice Society","d":"November 2022","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"ongoing reconstruction of IT infrastructure","di":"not publicly disclosed","s":"The Vice Society ransomware gang claimed responsibility for a cyberattack on the University of Duisburg-Essen in November 2022. The attack forced the university to reconstruct its IT infrastructure, a process that is still ongoing.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-january-20th-2023-targeting-crypto-exchanges/"]},{"v":"Queensland University of Technology","g":"Royal ransomware","d":"January 1, 2023","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Campuses reopened on January 3, 2023, but system disruptions are expected to continue for some weeks.","di":"10% of the data stolen includes HR files, email and letter communications, ID cards and documents, and financial and administrative documents.","s":"The Royal ransomware gang claimed responsibility for a cyberattack on the Queensland University of Technology, leaking data they allege was stolen during the breach. The university experienced significant service disruptions and shut down all IT systems to contain the attack, while also warning students and staff about potential risks.","src":["https://www.bleepingcomputer.com/news/security/royal-ransomware-claims-attack-on-queensland-university-of-technology/"]},{"v":"Cincinnati State Technical and Community College","g":"Vice Society","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Restoration of on-campus networks and email, partial internet access, and classroom computers; however, voicemail, network printing, VPN access, and shared drives are unavailable, causing significant disruption.","di":"10,000 students and 1,000 staff members affected; leaked documents contain personally identifiable information (PII).","s":"Vice Society ransomware claimed responsibility for a cyberattack on Cincinnati State Technical and Community College, leaking data allegedly stolen during the attack. The college informed its students and staff about the cybersecurity incident, indicating that online services and restoration to regular operations will take time.","src":["https://www.bleepingcomputer.com/news/security/vice-society-ransomware-claims-attack-on-cincinnati-state-college/"]},{"v":"Los Angeles Unified School District","g":"Vice Society","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"3,400 students and 2,200 employees affected","s":"Vice Society has been targeting the education sector with multiple ransomware strains, including a recent attack on the Los Angeles Unified School District. The group is known for exfiltrating data before encryption and threatening to leak it if ransom demands are not met. Microsoft has reported that Vice Society has been active in the U.S. education sector since at least July 2022, using various ransomware families and tactics.","src":["https://www.bleepingcomputer.com/news/security/microsoft-vice-society-targets-schools-with-multiple-ransomware-families/"]},{"v":"Spanish National Research Council (CSIC)","g":"not publicly disclosed","d":"July 18, 2023","c":"Spain","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most centers still disconnected; just over 25% online as of the latest update.","di":"not publicly disclosed","s":"The Spanish National Research Council (CSIC) was hit by a ransomware attack attributed to Russian hackers over the weekend of July 16-17, 2023. Following the attack, the agency activated its cybersecurity protocols and isolated several research centers to control the situation, with most still offline as recovery efforts continue.","src":["https://www.bleepingcomputer.com/news/security/spanish-research-agency-still-recovering-after-ransomware-attack/"]},{"v":"Maastricht University","g":"TA505","d":"December 2019","c":"Netherlands","fin":"not publicly disclosed","ran":"30 bitcoin (approximately 200,000 at the time)","dt":"not publicly disclosed","di":"approximately 4,500 employees' data including research, educational, and staff data, as well as salary payment information","s":"Maastricht University experienced a ransomware attack in December 2019, leading to the payment of a ransom to decrypt files. The attack was linked to the hacker group TA505, and the university later recovered the ransom amount through law enforcement efforts.","src":["https://www.bleepingcomputer.com/news/security/maastricht-university-wound-up-earning-money-from-its-ransom-payment/"]},{"v":"Medical University of Innsbruck","g":"Vice Society","d":"June 20, 2022","c":"Austria","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The university experienced an IT outage on June 20, 2022, and gradually restored its online services in the days that followed.","di":"3,400 students and 2,200 employees; extensive list of documents allegedly stolen.","s":"The Vice Society ransomware gang claimed responsibility for a cyberattack on the Medical University of Innsbruck, causing significant IT service disruption and the alleged theft of data. Following the attack, the university reset all account passwords and began restoring services, while the gang leaked documents on their site, indicating a potential dead end in ransom negotiations.","src":["https://www.bleepingcomputer.com/news/security/vice-society-claims-ransomware-attack-on-med-university-of-innsbruck/"]},{"v":"Chicago Public Schools","g":"not publicly disclosed","d":"December 1, 2021","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"495,448 students and 56,138 employees; personal information and assessment scores","s":"A ransomware attack on Battelle for Kids exposed the data of nearly 500,000 students and over 56,000 employees of the Chicago Public Schools. The breach involved personal information and assessment scores from the school years 2015-2019, with CPS learning about the breach four months after it occurred.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-exposes-data-of-500-000-chicago-students/"]},{"v":"Lincoln College","g":"not publicly disclosed","d":"December 2021","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All systems required for recruitment, retention, and fundraising efforts were inoperable until fully restored in March 2022.","di":"no personal identifying information was exposed","s":"Lincoln College, a liberal-arts school in Illinois, announced its closure after 157 years due to the financial impact of a ransomware attack in December 2021. The attack disrupted admissions activities and hindered access to institutional data, leading to significant enrollment shortfalls and ultimately the decision to cease all academic activity by May 13, 2022.","src":["https://www.bleepingcomputer.com/news/security/lincoln-college-to-close-after-157-years-due-ransomware-attack/"]},{"v":"Austin Peay State University","g":"not publicly disclosed","d":"April 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"shut down portions of their network while investigating the attack","di":"not publicly disclosed","s":"Austin Peay State University suffered a ransomware attack, prompting the institution to shut down parts of its network for investigation. The attack was confirmed in late April 2022, and the university took measures to mitigate the impact on its operations.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-april-29th-2022-new-operations-emerge/"]}],"stats":[{"m":"Median ransom PAID - lower education (K-12)","v":"$800,000 in 2025, down 88% from $6.60M in 2024","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Median ransom PAID - higher education","v":"$463,000 in 2025, down from $4.41M in 2024","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Median ransom DEMANDED - lower vs higher education","v":"Lower education $1.02M (down from $3.85M); higher education $697,000 (down from $3.55M)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Mean recovery cost excluding ransom - lower vs higher education","v":"Lower education $2.20M (down from $3.76M); higher education $0.90M (down from $4.02M) - higher education was the joint lowest of all industries surveyed","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Rate of data encryption in attacks","v":"Lower education 29% encrypted (67% stopped before encryption, up from 14%); higher education 58% encrypted (38% stopped before encryption, up from 21%)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Leading root cause of attack","v":"Higher education: exploited vulnerabilities, 35% of cases. Lower education: phishing, 22% of cases","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Recovery from backups (declining reliability)","v":"59% of encrypted-data cases in lower education (down from 75%); 47% in higher education (down from 78%). 97% of education providers with encrypted data eventually recovered it","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Speed of full recovery","v":"50% of lower education and 59% of higher education fully recovered within one week, up from 30% for both in 2024","s":"Sophos / Infosecurity Magazine coverage of State of Ransomware in Education 2025","u":"https://www.infosecurity-magazine.com/news/ransomware-payments-plummet/"},{"m":"Extortion-only attacks (exfiltration without encryption)","v":"Lower education 4% (up from 1%); higher education 3% (up from 2%)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Organisational weaknesses cited","v":"Lower education: lack of expertise and limited incident-response capacity, 42% each. Higher education: unknown security gaps, 49% - the most commonly cited issue","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Global education ransomware attack volume (2025)","v":"251 attacks worldwide (94 confirmed by the victim, 157 unconfirmed); 130 in the US of which 50 confirmed; a 2% year-over-year increase, indicating a plateau after 2024","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Records breached in confirmed education attacks (2025)","v":"3,962,869 records, of which 3.89 million were in the US; over 241TB of data allegedly stolen across all attacks","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Average ransom demand in education (2025)","v":"$464,000 across all attacks (down 33% from $694,000 in 2024); $392,300 across confirmed attacks only; largest single demand $1.5M (Asia University, Taiwan)","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Most active groups claiming education victims (2025)","v":"Qilin 37 claimed attacks, SafePay 23, Fog and Interlock 18 each, INC Ransom 17; Interlock took credit for the most confirmed attacks (11)","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Average downtime per education ransomware incident","v":"10.7 days of system unavailability per attack, with 2023 the worst year at 12.6 days average; estimated cost of approximately $548,185 per day of downtime","s":"Comparitech, Ransomware attacks on US schools and colleges (2018 to mid-2024)","u":"https://www.comparitech.com/blog/information-security/school-ransomware-attacks/"},{"m":"Ransom demand distribution and payment gap (US schools/colleges)","v":"Demands ranged from $5,000 to $40M with an average of approximately $1.4M, while actual payments averaged approximately $169,000; 491 incidents affecting 8,054 institutions and over 6.7 million records over the study period","s":"Comparitech, Ransomware attacks on US schools and colleges (2018 to mid-2024)","u":"https://www.comparitech.com/blog/information-security/school-ransomware-attacks/"},{"m":"Average total cost of a data breach - education sector","v":"$3.8M, below the $4.44M global all-industry average; education was one of the few sectors where breach costs ROSE year over year against a global decline","s":"IBM, Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Ransomware presence in breaches (all sectors, for benchmarking)","v":"48% of analysed breaches in the 2026 DBIR, up from 44% in the 2025 edition (which was itself a 37% year-over-year rise)","s":"Verizon, 2026 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Top breach patterns in the Educational Services chapter","v":"Social engineering 42% and system intrusion 35% as leading patterns; stolen credentials were the top initial access vector across all sectors at 22% of breaches, with phishing starting 16%","s":"Verizon, Data Breach Investigations Report (Educational Services chapter)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Third-party and supply-chain involvement in breaches","v":"Third parties featured in 48% of breaches in the 2026 DBIR with supply-chain breaches up 60%; the 2025 edition had already recorded third-party involvement doubling to 30% from 15%","s":"Verizon, 2026 Data Breach Investigations Report / Campus Technology analysis","u":"https://campustechnology.com/articles/2026/01/22/ransomware-attacks-plateau-in-education-sector-while-third-party-risks-loom-large.aspx"},{"m":"Ransom payment rate (all sectors, for benchmarking)","v":"Fell to approximately 20% in Q4 2025 - a historic low - from 23% in Q3 2025","s":"Coveware by Veeam, quarterly ransomware reports 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average and median ransom payment (all sectors, for benchmarking)","v":"Q4 2025 average $591,988 and median $325,000; Q2 2025 peaked at an average of $1,130,070 with a $400,000 median before falling sharply in Q3","s":"Coveware by Veeam, quarterly ransomware reports 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Leak-site victim count, Education sector (primary dataset)","v":"1,296 named victims from 2016 to 20 July 2026 across 135 distinct groups and 78 countries; peak years 2023 (307) and 2025 (328), with 158 recorded in the first ~7 months of 2026","s":"ransomware.live API v2, /v2/sectorvictims/Education","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Geographic concentration of education leak-site victims","v":"US 519 of 947 records with a resolved country (54.8%); GB 66, FR 31, CA 30, BR 28, IN 23, DE 22, AU 21, IT 16. By region: Europe approximately 191, APAC 96, Latin America and Caribbean 59","s":"ransomware.live API v2, /v2/sectorvictims/Education (own analysis)","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Disclosure completeness in education leak-site records","v":"Press coverage on only 170 of 1,296 records (13%); an explicit ransom figure on 12 (0.9%); a data volume on 21 (1.6%); country absent on 349 (27%) - severely limiting incident-level loss modelling","s":"ransomware.live API v2, /v2/sectorvictims/Education (own analysis)","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Independent corroboration of group ranking (ransomwatch)","v":"507 education-matching posts of 16,072 total: 2021 (57), 2022 (105), 2023 (193), 2024 (112), 2025 (40, partial). Top groups lockbit3 58, vicesociety 50, pysa 39, rhysida 39, FOG 27 - consistent with ransomware.live. Dataset stale after 16 June 2025","s":"ransomwatch (joshhighet), posts.json","u":"https://raw.githubusercontent.com/joshhighet/ransomwatch/main/posts.json"}]},{"name":"Energy and Utilities","tag":"Energy","overview":"The Energy and Utilities sector (ransomware.live tag \"Energy,\" ~826 indexed victim records at time of research) spans oil & gas exploration/production, pipelines and midstream transport, refining, oilfield services, electric power generation/transmission/distribution, gas distribution, and water/wastewater utilities. It is a top-tier ransomware target because it blends two high-leverage traits: (1) it is critical national infrastructure where downtime has cascading physical, economic, and public-safety consequences, giving attackers extraordinary extortion leverage; and (2) it runs a large, aging, and often flat-networked mix of IT and operational technology (OT/ICS/SCADA). Even when malware only hits corporate IT, operators frequently shut down OT preemptively out of caution (as Colonial Pipeline and Conpet did), so IT-only intrusions still cause operational and physical-world disruption (fuel shortages, offline payment at fuel retail, halted shipment planning). Financially the sector is among the most expensive to recover: Sophos put mean recovery cost for energy/oil-gas/utilities at ~$3.12M (2024), IBM put average energy-sector breach cost at $4.83M, and the sector reports the highest ransom-payment propensity (61% pay) and lowest backup-restoration rate of any industry. Dominant groups observed against the sector include DarkSide/BlackCat(ALPHV) lineage, RansomHub, Qilin, Akira, DragonForce, LockBit, Everest, and Handala (hacktivist/geopolitical). Attacks cluster around stolen credentials/infostealers, VPN/remote-access and edge-device exploitation, and third-party/supply-chain footholds, with double- and triple-extortion (encryption + data theft + regulatory/press pressure) now standard.","distinct":"Roughly 826 indexed victims across oil and gas, pipelines, refining, power generation and transmission, and water/wastewater. Blends critical-national-infrastructure status, where downtime carries cascading physical, economic and public-safety consequence, with large, aged, geographically dispersed OT estates. Uniquely, the precautionary IT/OT shutdown is itself the loss event: operators halt physical operations defensively when IT is compromised, as Colonial Pipeline showed, so business interruption occurs even where OT is never touched. Heaviest regulatory overlay including CIRCIA and sector-specific mandates.","leverage":"Threat to physical operational continuity and public-safety consequence, giving attackers extraordinary leverage disproportionate to the data actually held.","tolerance":"Extremely low. Minutes to hours for grid, pipeline and water operations, where interruption is a public-safety and regulatory event, not merely a commercial one.","bulk":{"total":826,"years":{"2017":3,"2019":1,"2020":16,"2021":45,"2022":95,"2023":166,"2024":168,"2025":198,"2026":134},"groups":[["lockbit3",58],["qilin",51],["akira",44],["clop",40],["alphv",36],["play",35],["ransomhub",24],["hunters",22]],"countries":[["US",192],["CA",33],["DE",25],["ID",18],["GB",17],["IT",15]],"pressPct":4,"ransomPct":0},"incidents":[{"v":"Colonial Pipeline","g":"DarkSide","d":"2021-05-07","c":"USA","fin":"No single official total disclosed by the company; national gasoline price spiked to a 6+ year high (~$3.04/gal). Ransom of $4.4M paid (see below). Widespread regional economic disruption from fuel shortages.","ran":"$4.4M paid (75 bitcoin) within hours, overseen by the FBI. On June 7, 2021 the DOJ announced seizure/recovery of 63.7 BTC, then worth ~$2.3M (lower than paid amount due to BTC price drop).","dt":"All pipeline operations halted May 7; systems and operations returned to normal by May 15 (~6-day shutdown). Decryptor tool from DarkSide was slow, so recovery largely relied on Colonial's own restoration.","di":"Attackers exfiltrated roughly 100GB of data prior to encryption (double-extortion); primary impact was operational/physical rather than a large PII breach.","s":"The largest refined-fuels pipeline in the US (Houston to the Southeast) was hit by DarkSide ransomware on its IT systems. Colonial proactively halted ALL pipeline operations to contain the attack. The 6-day shutdown interrupted fuel distribution to 17 states, triggering panic-buying, fuel shortages, and the highest average US gasoline price in over six years (~$3.04/gal by May 18). It is the defining cyber-physical energy ransomware case and prompted new TSA pipeline security directives.","src":["https://en.wikipedia.org/wiki/Colonial_Pipeline_ransomware_attack","https://www.energy.gov/ceser/colonial-pipeline-cyber-incident","https://www.chainalysis.com/blog/darkside-colonial-pipeline-ransomware-seizure-case-study/","https://www.huntress.com/threat-library/ransomware/colonial-pipeline-ransomware"]},{"v":"Halliburton","g":"RansomHub","d":"2024-08-21","c":"USA","fin":"~$35M direct pretax cost reported in Q3 2024 results (filed late Oct 2024); ~$0.02 adjusted-EPS impact for the quarter from lost/delayed revenue during system unavailability.","ran":"Not publicly disclosed, Halliburton did not confirm whether a ransom was demanded, negotiated, or paid.","dt":"Precautionary shutdown of parts of IT infrastructure caused client-system disconnections and temporary inability to generate critical business documents; company described operational impact as limited and restored systems over subsequent weeks. Exact downtime not itemized.","di":"Data exfiltration confirmed; company stated information was taken from its systems. Specific record counts/data types not fully disclosed publicly.","s":"One of the world's largest oilfield-services companies detected unauthorized access to corporate IT on Aug 21, 2024 and precautionarily shut down certain applications, including production-planning and shipment-tracking systems used in customer delivery. RansomHub claimed the attack and listed the company on its leak site; Halliburton confirmed data was stolen. Disclosed via SEC Form 8-K (Aug 23) and 8-K/A.","src":["https://www.bleepingcomputer.com/news/security/halliburton-reports-35-million-loss-after-ransomware-attack/","https://www.bleepingcomputer.com/news/security/halliburton-cyberattack-linked-to-ransomhub-ransomware-gang/","https://www.bleepingcomputer.com/news/security/halliburton-confirms-data-stolen-in-recent-cyberattack/","https://www.cpomagazine.com/cyber-security/oil-giant-halliburton-lost-35-million-due-to-the-august-2024-ransomhub-ransomware-data-breach/"]},{"v":"Suncor Energy / Petro-Canada","g":"Not publicly attributed (undisclosed threat actor)","d":"2023-06-21","c":"Canada","fin":"Not publicly quantified as a single figure; disruption spanned 1,500+ retail sites over a weekend plus remediation costs (Suncor replaced employee laptops/computers as part of response).","ran":"Not publicly disclosed; Suncor characterized it as a 'cybersecurity incident' and did not confirm a ransom.","dt":"Payment-system disruptions began ~June 21 and were largely resolved over the following days; Suncor swapped out employee computers as a remediation measure, extending internal recovery activity.","di":"Unauthorized party accessed basic information of Petro-Points loyalty members; affected members and privacy regulators were notified. No large-scale financial-data theft publicly confirmed.","s":"A cybersecurity incident at Canadian integrated-energy giant Suncor disrupted its Petro-Canada retail subsidiary (1,500+ stations). Many stations went cash-only, unable to accept credit/debit or rewards; the Petro-Canada app, Petro-Points login, and car washes were unavailable at various sites. Illustrates downstream retail/payment-system exposure in vertically integrated energy firms.","src":["https://www.cbc.ca/news/business/petro-canada-suncor-cybersecurity-1.6888723","https://www.bleepingcomputer.com/news/security/suncor-energy-cyberattack-impacts-petro-canada-gas-stations/","https://www.cybersecuritydive.com/news/suncor-hackers-breached-petro-canada-customer-data/685365/","https://www.cbc.ca/news/canada/calgary/suncor-cybersecurity-incident-energy-sector-1.6898118"]},{"v":"Encevo Group (Creos & Enovos, Luxembourg)","g":"ALPHV / BlackCat","d":"2022-07-22","c":"Luxembourg","fin":"Not publicly disclosed as a dollar figure; operational impact limited to customer-portal outages (no supply interruption).","ran":"Ransom amount not publicly disclosed; ALPHV threatened to publish stolen data if unpaid.","dt":"Creos and Enovos customer portals were rendered non-operational following the July 22-23 intrusion; portals were restored over subsequent days/weeks while supply services remained running.","di":"ALPHV claimed exfiltration of 150GB+ across 180,000+ files, published on its leak site July 29, contracts, agreements, ID copies, invoices, and emails; analyses found 2,270+ files containing plaintext credentials/passwords and 100,000+ documents marked confidential.","s
