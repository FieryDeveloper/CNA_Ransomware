cting large, distributed, high-turnover workforces and heavy reliance on outsourced IT support.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Initial access vectors","subs":["Help-desk / call-center social engineering and vishing to reset MFA or credentials (Scattered Spider-style attacks on MGM, Caesars)","Phishing and callback phishing (e.g., Silent Ransom Group-style tactics)","Compromised or purchased credentials, often sourced via infostealer malware from employee or third-party devices","Exploitation of internet-facing PMS, booking, or POS software vulnerabilities","Compromise of third-party IT support/managed service providers with privileged remote access","Compromise via franchise/partner networks with shared or federated access to corporate systems"]},"Agriculture, Forestry, Fishing and Food Production":{"raw":"Initial Access Vectors","subs":["Phishing / business email compromise targeting procurement, logistics and finance staff (single-click compromise, as in the Ahold Delhaize USA breach)","Exploitation of internet-facing/edge devices and unpatched VPNs, RDP and firewalls at remote farms, elevators, plants and cold-storage sites","Mass-exploitation of zero-day/managed-file-transfer and enterprise software vulnerabilities (Cl0p-style campaigns against the sector)","Valid/stolen credentials sourced from infostealer logs (ransomware.live records infostealer-linked exposure for many food/ag domains)","Compromise of third-party IT/OT integrators, MSPs, ag-tech SaaS and remote maintenance access into plant networks","Weak segmentation between corporate IT and plant OT allowing lateral movement from an office foothold into production"]},"Construction":{"raw":"Initial Access Vectors","subs":["Phishing/BEC targeting project managers, estimators and accounts-payable staff (construction's high-value, milestone-based subcontractor and supplier payments make it a prime invoice-fraud/BEC target, often paired with or following a ransomware intrusion)","Exploited perimeter and file-transfer/ERP vulnerabilities in widely-used enterprise software (e.g., Clop's 2025 Oracle E-Business Suite CVE-2025-61882 zero-day campaign hit multiple construction firms, including Bechtel and Kier, within days of each other)","Compromised VPN/RDP credentials, including access issued to jobsite trailers and temporary site networks with weaker controls than corporate HQ","Infostealer-harvested credentials from employee and third-party devices (Ferrovial's July 2026 AiLock incident was linked to over 100 compromised employee and third-party credential sets surfaced via infostealer telemetry)","Compromised or over-privileged subcontractor/vendor remote-access accounts on shared project extranets"]},"Energy and Utilities":{"raw":"Initial Access Vectors","subs":["Stolen/compromised credentials (IBM: #1 vector at 16%; e.g., Conpet infostealer on an IT admin's personal device)","Infostealer malware harvesting VPN/WSUS/RDP credentials from employee or contractor devices","Internet-facing VPN, firewall, and remote-access appliance exploitation (Fortinet/Citrix/Ivanti-class edge devices)","Phishing / business email compromise (energy/utilities are hit harder by email-borne attacks than most sectors)","Abuse of legitimate internal infrastructure (e.g., WSUS/patch-management to push a malicious 'fake update' at Conpet)","Exploitation of unpatched internet-facing enterprise apps and public-facing customer/billing portals","Third-party/vendor and MSP remote-access compromise"]},"Finance and Insurance":{"raw":"Initial Access Vectors","subs":["Exploitation of internet-facing remote-access appliances (e.g., Citrix NetScaler CVE-2023-4966/4967 in the ICBC incident)","Phishing and malicious links leading to credential/endpoint compromise (e.g., Evolve Bank & Trust employee click)","Stolen/leaked credentials sourced from infostealer logs (54% of ransomware victims per 2025 Verizon DBIR had prior credential exposure)","Compromise via a shared/downstream vendor rather than the institution's own perimeter (Frost/Citizens shared vendor; Deutsche Bank marketing-platform vendor)","Exploitation of unpatched known CVEs in edge/VPN infrastructure","Business email compromise as a precursor to ransomware deployment"]},"Healthcare and Social Assistance":{"raw":"Initial Access Vectors","subs":["Exploitation of unpatched, internet-facing VPN/remote-access appliances and edge devices (a leading Verizon DBIR-cited vector for healthcare breaches, up sharply year over year)","Compromised or purchased VPN/RDP/Citrix credentials, including credentials harvested by infostealer malware from employee or third-party devices (ransomware.live 'infostealer' telemetry shows large stealer-log exposure tied to healthcare victims, e.g. Medibank)","Phishing and business-email-compromise targeting clinical, billing, and admin staff","Compromise of managed service providers (MSPs), IT vendors, and EHR/practice-management software resellers who hold privileged access across many small provider networks","Exploitation of vulnerabilities in widely-deployed healthcare-adjacent software (file-transfer tools, VoIP/telehealth platforms, backup software) as mass 'one-to-many' entry points","Insider-enabled access or credential sale by disgruntled or compromised employees/contractors"]},"Information Technology":{"raw":"Initial Access Vectors","subs":["Exploitation of internet-facing/VPN and edge appliances (e.g., Palo Alto GlobalProtect at Ingram Micro, Fortinet/Citrix, Microsoft Exchange as used against Acer)","Exploitation of managed file transfer / edge software (MOVEit, GoAnywhere, Accellion) for mass exfiltration","Leaked or purchased credentials and infostealer logs (initial-access-broker marketplaces)","Abuse of remote monitoring & management (RMM) and remote-access tooling","Phishing / social engineering of admins and developers","Exploitation of zero-day/n-day vulnerabilities in the vendor's own shipped products, turning the product into an attack vector against customers"]},"Manufacturing":{"raw":"Initial Access Vectors","subs":["Exposed/unsecured RDP and remote-access services (documented initial vector in the Honda/EKANS 2020 case)","Exploited public-facing vulnerabilities (leading root cause per Sophos 2025, 32% of manufacturing incidents; e.g., Citrix NetScaler CVE exploited by INC Ransom)","Phishing/spearphishing and malicious email attachments (Norsk Hydro's LockerGoga entry point)","Compromised/stolen credentials, including via infostealer malware","Malicious browser downloads by employees (Continental AG 2022 vector)","Third-party/vendor/MSP remote-access compromise"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Initial access vectors","subs":["Voice phishing (vishing) targeting IT helpdesk/employees to obtain SaaS/CRM credentials (Cushman & Wakefield/ShinyHunters pattern)","Business email compromise / spear-phishing against client-facing consulting, legal, and accounting staff","Exploited VPN/RDP and edge-device vulnerabilities into MSP and IT-services provider networks","Infostealer malware harvesting employee and third-party credentials (RedLine, Lumma, generic stealers observed heavily across ransomware.live Business Services listings)","Compromise of exposed EDI, order-processing, and warehouse-management portals in wholesale/distribution firms","Compromised MSP/RMM tooling providing one-to-many access into multiple downstream client environments"]},"Public Administration (Government)":{"raw":"Initial Access Vectors","subs":["Exploitation of unpatched internet-facing systems and legacy/end-of-life software (VPN concentrators, Citrix/RDP gateways, Exchange, file-transfer appliances like MOVEit) common in underfunded agencies","Exposed / brute-forced Remote Desktop Protocol (RDP) - the classic SamSam vector used against Atlanta","Phishing and business-email-compromise against government email accounts and elected officials","Stolen/valid credentials and weak or absent MFA on remote-access and privileged accounts","Compromise via managed service providers (MSPs) and shared statewide/county IT systems that serve many agencies at once","Third-party/software supply-chain compromise (e.g. mass-exploited file-transfer and remote-management tools)"]},"Retail Trade and Consumer Services":{"raw":"Initial Access Vectors","subs":["Help-desk/service-desk vishing and impersonation (Scattered Spider-style)","Third-party IT vendor or identity-provider (Okta/SSO) compromise","Exploited public-facing vulnerabilities (VPN, web app, edge devices)","SaaS/OAuth and connected-app abuse (e.g., fake Salesforce Data Loader)","Phishing/credential theft against store, warehouse, or corporate staff","Compromised franchise or dealer-network credentials"]},"Telecommunications":{"raw":"Initial Access Vectors","subs":["Infostealer-harvested employee/admin credentials (WOW!/Arkana; Orange Spain RIPE-account takeover)","Exploitation of internet-facing edge devices, VPNs and collaboration platforms (Colt/Orange - SharePoint CVE-2025-53770; DBIR notes 8x rise in edge/VPN exploitation, only 54% patched)","Phishing and social engineering leading to hijacked Domain Admin accounts (Telecom Argentina/REvil)","Compromised third-party/vendor or subcontractor credentials (Bell Technical Solutions/Hive)","Rapid weaponization of zero-day/critical vulnerabilities in internet-facing network equipment (Cyble finding)","Stolen or weak administrative credentials (TSTT/RansomEXX)"]},"Transportation and Warehousing":{"raw":"Initial Access Vectors","subs":["Weak/brute-forced credentials and absent MFA on remote-access or VPN accounts (e.g., KNP Logistics/Akira, single weak password, no MFA)","Exploited public-facing vulnerabilities in logistics/ERP software and edge devices","Phishing and stolen-credential campaigns targeting dispatch, billing, and operations staff","Compromise of a shared/upstream software vendor whose platform many carriers depend on (supply-chain trojan, e.g., NotPetya's spread via M.E.Doc)","Legacy or unpatched OT/ICS components in port terminal and warehouse-automation systems with long refresh cycles"]}}},{"key":"extortion tactics","name":"Extortion Tactics","fam":"Extortion & Impact","desc":"The mechanisms attackers use to monetize a manufacturing compromise, increasingly shifting from pure encryption toward data theft as manufacturers improve encryption-prevention (per Sophos 2025: encryption success dropped from 74% to 40% YoY).","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Extortion tactics","subs":["Encryption of operational systems (PMS, POS, reservations) causing immediate, highly visible service disruption","Data exfiltration and double/triple extortion (threatening publication of guest/loyalty PII, ID scans, financial data)","Direct harassment of executives, guests, or loyalty-program members with stolen data","Publication of sensitive operational or IP-like materials (e.g., unreleased attraction designs, menus, pricing) as leverage distinct to entertainment/theme-park operators","Timing attacks to coincide with peak seasons, holidays, or major events to maximize revenue-loss pressure and increase likelihood of ransom payment","Pure data-theft extortion without encryption (e.g., ShinyHunters/Scattered Spider-linked groups increasingly skip encryption and threaten-to-leak only)"]},"Construction":{"raw":"Extortion Tactics","subs":["Double extortion: encryption plus exfiltration and leak-site publication of stolen files (the dominant model seen across Qilin, LockBit, Akira, Play, DragonForce, INC Ransom incidents in the dataset)","Triple extortion / regulatory and reputational threats (AiLock explicitly threatens to notify regulators and competitors and gives victims a 72-hour response window)","Pure data-theft extortion without encryption (Everest has shifted toward this model; used against Turner Construction)","Threats to leak competitively sensitive bid, pricing and design data to rival bidders or competitors ahead of tender awards","Mass 'name-and-shame' campaigns where dozens of victims across many industries (including construction) are listed together after a single shared-software exploit, increasing pressure via public exposure even before individualized negotiation"]},"Energy and Utilities":{"raw":"Extortion Tactics","subs":["Encryption of IT systems (production planning, shipment tracking, billing, ERP)","Data exfiltration + leak-site publication (double extortion; e.g., ALPHV 150GB from Creos/Encevo, Qilin ~1TB from Conpet)","Triple extortion: added pressure via press/regulators, and threats to customers/partners whose data was stolen","Threat/harassment of executives, employees, and Petro-Points/loyalty-style customer bases","DDoS as an added coercion layer","Auctioning/selling stolen files to highest bidder (RansomHub model)","Geopolitical/hacktivist extortion and 'name-and-shame' with no intent to decrypt (e.g., Handala targeting Gulf oil majors)"]},"Finance and Insurance":{"raw":"Extortion Tactics","subs":["Encryption of core systems to force operational downtime (classic single extortion)","Data exfiltration and double extortion (threat of publishing stolen customer/financial records - dominant pattern in nearly all example incidents above)","Leak-site countdown deadlines to pressure fast payment (e.g., Everest's 6-day deadline on Frost/Citizens)","Harassment of executives, customers, or regulators directly (naming institutions publicly, contacting affected customers)","Reputational/'shaming' posts calling out incident-response vendors or refusal to negotiate (ALPHV's public post against FNF)","Threats of onward sale of data to third parties rather than public leak, as a middle-ground pressure tactic (MAPFRE/Lapsus$)"]},"Healthcare and Social Assistance":{"raw":"Extortion Tactics","subs":["Encryption of clinical, administrative, and financial systems (EHR, PACS, pharmacy, lab, scheduling) forcing 'downtime procedures' and patient diversion","Data exfiltration and double/triple extortion, publishing or threatening to publish stolen PHI on leak sites (roughly three-quarters of recent healthcare cases reportedly involve exfiltration, per Coveware)","Targeted harassment of especially vulnerable patients using stolen sensitive records (e.g., ALPHV/BlackCat's publication of nude cancer-patient treatment photos at Lehigh Valley Health Network; Medibank attackers publishing abortion and addiction-treatment records) to increase payment pressure","Direct extortion emails/calls to patients or plan members threatening individual data release unless the organization (or the individual) pays","DDoS attacks layered on top of encryption/exfiltration to pressure incident-response teams","'Re-victimization', re-posting or re-selling the same stolen healthcare dataset by multiple groups or brokers after an initial attack (dispossessor/second-hand leak listings observed in the dataset)"]},"Information Technology":{"raw":"Extortion Tactics","subs":["Encryption of production, build/CI-CD and virtualization (VMware ESXi) systems","Data exfiltration and public leak-site publication (double extortion)","Triple/quadruple extortion: DDoS and direct harassment of the victim's downstream customers, partners and employees","Threatened disclosure of source code, product blueprints and signing keys/certificates","Ransom escalation and event-timed pressure (e.g., REvil publicizing Quanta/Apple leak during Apple's launch event)"]},"Manufacturing":{"raw":"Extortion Tactics","subs":["Encryption of production/IT systems (traditional single-extortion, e.g. Norsk Hydro, Honda)","Data exfiltration and double-extortion (leak-site publication threats, e.g. Continental, Nissan, Yamaha)","Backup destruction to eliminate recovery options and increase payment pressure (Foxconn Mexico: 20-30TB of backups deleted)","Deadline-driven public leak-site pressure campaigns","Triple extortion (secondary harassment of customers/partners named in stolen data, or DDoS layered on top)","Direct sale of stolen IP/data to third parties independent of ransom negotiation (Continental data offered for sale at $50M/$40M)"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Extortion tactics","subs":["Double extortion: encryption plus exfiltration threat of client/case data (law, accounting, consulting firms)","Pure data-exfiltration extortion without encryption, increasingly common via SaaS/CRM compromise (no file-encryption downtime, but reputational/regulatory leverage)","Leak-site 'countdown' publication of stolen client and employee data to pressure payment","Multi-group/competing extortion claims on the same victim (seen with Cushman & Wakefield, claimed by both ShinyHunters and Qilin) complicating incident response and negotiation","Harassment of downstream clients/customers whose data was exposed, used as secondary leverage against the professional-services victim","DDoS as an auxiliary pressure tactic during negotiation stand-offs"]},"Public Administration (Government)":{"raw":"Extortion Tactics","subs":["Encryption of servers/endpoints halting citizen-facing and back-office services (double-extortion base case)","Data exfiltration + public leak-site posting when governments refuse to pay (e.g. Rhysida dumping ~600GB from the British Library; Interlock posting 43GB from St. Paul; Play leaking Oakland data)","Publication/auctioning of citizen PII, employee HR/payroll files, and law-enforcement records to shame and pressure","Direct harassment / notification of affected citizens and media to amplify political pressure on officials","Framing attacks as acts of 'terrorism' / national-security events (Costa Rica) to maximize coercion","DDoS and repeat-attack threats layered on top of encryption (triple-extortion)"]},"Retail Trade and Consumer Services":{"raw":"Extortion Tactics","subs":["Traditional encryption of ERP/POS/inventory systems (operational shutdown)","Extortion-only data exfiltration with no encryption (fastest-growing tactic)","Double extortion (encrypt + threaten to leak)","Direct executive/leadership harassment (calls, Teams messages, emails to C-suite)","Deadline-based public leak-site threats naming victims before payment","Threats against downstream customers/members directly (name-and-shame of loyalty program members)"]},"Telecommunications":{"raw":"Extortion Tactics","subs":["Double extortion: encryption plus data exfiltration (RansomEXX/TSTT, Yanluowang/Cincinnati Bell)","Pure data-leak/'pay-or-leak' extortion with no encryption (Arkana/WOW!, ShinyHunters/American Tower, ShinyHunters/Charter)","Public shaming, 'wall of shame' and doxxing tactics (Arkana Security's stated model)","Proof-of-hack demonstration videos and backend-access showcases (Arkana/WOW!)","Reupload/re-extortion of previously leaked data by a different or same group (SK-Telecom 'data reuploaded' listing)","Deadline-driven negotiation windows escalating ransom demands over time (Telecom Argentina's $7.5M to $15M escalation)"]},"Transportation and Warehousing":{"raw":"Extortion Tactics","subs":["Traditional file/system encryption halting dispatch, billing, and tracking operations","Double extortion, data theft plus threatened leak (Nefilim/Toll Group, LockBit/Estes)","Extortion-only attacks with no encryption payload, relying purely on stolen shipment/customer/financial data (a rising share industry-wide per Sophos 2025)","Harassment of customers, partners, or drivers via leaked contact data to pressure payment","Wiper malware disguised as ransomware for disruption rather than profit (NotPetya/Maersk)"]}}},{"key":"insider and workforce risk","name":"Insider and Workforce Risk","fam":"Insider & Workforce","desc":"Sophos data shows retail has the highest rate of any surveyed sector attributing root cause to \"lack of in-house security expertise,\" reflecting thin IT/security staffing relative to large distributed physical footprints.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Insider and workforce-related risk","subs":["High staff turnover creating stale/orphaned credentials and inconsistent access de-provisioning","Seasonal and temporary/contract staff with broad system access and less security training","Front-desk/POS-level social engineering targets (staff empowered to make account/reservation changes)","Shared or weakly managed credentials across large, decentralized property networks"]},"Construction":{"raw":"Insider and Workforce Risk","subs":["Shared or generic site-login credentials used across union labor, day laborers and rotating temp/subcontractor staff","Weak or inconsistent offboarding across multi-employer jobsites when subcontractor personnel change frequently","Disgruntled former employees or terminated subcontractors retaining VPN/portal access","Field staff use of personal/BYOD devices for project apps, increasing infostealer and credential-theft exposure outside corporate IT control"]},"Energy and Utilities":{"raw":"Insider & Human-Factor Risk","subs":["Privileged IT/OT administrator credential theft (Conpet root cause)","Use of personal/unmanaged devices for work access","Contractor and seasonal/field-workforce access sprawl","Weak MFA coverage on remote-access and OT jump hosts","Malicious or negligent insiders with SCADA access"]},"Finance and Insurance":{"raw":"Insider and Human-Factor Risk","subs":["Single-employee phishing susceptibility as a root cause (Evolve Bank & Trust)","Inadequate or inconsistent security controls across a large branch/subsidiary/M&A footprint","Insider threats (raised as a growing concern in Coveware's late-2025 reporting alongside falling payment rates)","Vendor-employee access management gaps at outsourced processors"]},"Healthcare and Social Assistance":{"raw":"Insider and Workforce Risk","subs":["Widespread, broad EHR access privileges among clinical staff increasing blast radius of a single compromised account","Credential reuse and shadow-IT tools (e.g., unsanctioned messaging/file-sharing apps used by clinicians) bypassing security controls","Chronic cybersecurity staffing/budget shortfalls relative to IT complexity, especially at rural hospitals, nursing homes, and behavioral-health/social-assistance providers","Third-party staffing and locum/travel clinician access management gaps","Social engineering of help-desk/password-reset workflows (a rising vector per 2025-2026 reporting, including at Change Healthcare-adjacent and other large-health-system incidents)"]},"Manufacturing":{"raw":"Insider and Human-Factor Risk","subs":["Employee-initiated compromise (malicious downloads, credential reuse, phishing susceptibility)","Insufficient in-house security expertise to detect/respond in time (cited by 42.5% of manufacturing ransomware victims per Sophos 2025)","Disgruntled or negligent insiders with OT/production-system access","Contractor and temporary-worker access-control gaps on factory floors"]},"Public Administration (Government)":{"raw":"Insider & Human-Factor Risk","subs":["Negligent insiders (credential reuse, susceptibility to phishing, workaround shadow-IT during outages)","Malicious/disgruntled insiders and access-broker recruitment (Costa Rica alleged in-country facilitators)","Weak privileged-access governance and over-provisioned admin accounts","Elected-official and executive account targeting (high-value, low-training)"]},"Retail Trade and Consumer Services":{"raw":"Insider and Human-Factor Risk","subs":["Under-resourced in-house security teams relative to store/location count","Susceptibility of frontline/call-center/help-desk staff to social engineering","High employee turnover complicating access management and training","Malicious or negligent insider access at franchise/third-party locations"]},"Transportation and Warehousing":{"raw":"Insider & Workforce Risk","subs":["Credential reuse/weak passwords among widely distributed field and warehouse staff","High employee/contractor turnover complicating access-deprovisioning","Limited security-awareness training budgets relative to operational/safety training priorities","Malicious or coerced insiders with access to dispatch or customs-clearance systems"]}}},{"key":"third party and supply chain risk","name":"Third Party and Supply Chain Risk","fam":"Third-Party & Supply Chain","desc":"Healthcare is unusually dependent on a small number of concentrated technology and services intermediaries (claims clearinghouses, pathology/lab partners, billing processors, EHR vendors), making single points of failure catastrophic and systemic.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Third-party and supply-chain risk","subs":["Managed service provider (MSP) / IT help-desk vendor compromise (root cause of MGM and Caesars incidents)","SaaS booking, PMS, or supply-chain platform compromise affecting many downstream hotel/restaurant brands simultaneously (mirrors Blue Yonder-type incidents Verizon DBIR flagged for accommodation/food services)","Construction, renovation, or facilities contractor breaches exposing sensitive operational data (Disneyland Paris partner breach)","Franchise/master-licensor shared infrastructure compromise cascading to independently owned locations","Payment processor or gift-card platform compromise"]},"Construction":{"raw":"Third-Party and Supply-Chain Risk","subs":["Shared collaboration/BIM platforms (e.g., Procore, Autodesk Construction Cloud/BIM 360) linking general contractors, architects, engineers, and dozens of subcontractors","Common enterprise software creating simultaneous multi-victim exposure (Bechtel and Kier Group were both hit within the same week during Clop's Oracle EBS campaign, despite being unrelated companies)","General contractor -> subcontractor -> sub-subcontractor credential and data flows, where the weakest link in the chain can expose the whole project","Architecture/engineering design partners and
