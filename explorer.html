}}},{"key":"physical and building adjacent operational technology","name":"Physical and Building Adjacent Operational Technology","fam":"OT & Operational Disruption","desc":"Consumer-services subsectors (grocery, hospitality, fitness, healthcare-adjacent services) operate physical/IoT systems whose disruption creates safety and spoilage risk beyond pure data loss.","inds":{"Retail Trade and Consumer Services":{"raw":"Physical and Building-Adjacent Operational Technology","subs":["Refrigeration/HVAC and building management systems (grocery, food service)","Digital key/access-card systems (hospitality/casino)","Warehouse robotics and automated fulfillment hardware","Fitness/wellness facility access and scheduling systems"]}}},{"key":"physical and critical infrastructure assets","name":"Physical and Critical Infrastructure Assets","fam":"OT & Operational Disruption","desc":"Because transportation is designated critical infrastructure in most jurisdictions, exposure extends beyond data to physical assets and public safety/regulatory systems.","inds":{"Transportation and Warehousing":{"raw":"Physical & Critical-Infrastructure Assets","subs":["Ports, container terminals, and intermodal rail yards","Vehicle fleets rendered inoperable when dispatch/ELD/telematics systems are locked","Cold-chain and hazmat tracking systems where downtime creates spoilage or safety risk","Cross-border/customs clearance systems whose outage can halt trade flows nationally","Airport ground-handling and cargo-processing systems"]}}},{"key":"physical and field infrastructure","name":"Physical and Field Infrastructure","fam":"OT & Operational Disruption","desc":"Telecom's unusual exposure of physical assets and access controls alongside digital ones - a hazard largely absent in pure IT/software industries.","inds":{"Telecommunications":{"raw":"Physical & Field Infrastructure","subs":["Cell tower compounds and physical access/gate codes (American Tower incident)","Colocation and data center facility access systems","Field service technician and subcontractor credentials/networks (Bell Technical Solutions-style)","Tower/asset GPS location data"]}}},{"key":"physical goods livestock and continuity assets","name":"Physical Goods Livestock and Continuity Assets","fam":"OT & Operational Disruption","desc":"Sector-unique tangible exposures that convert cyber downtime into direct physical loss.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Physical Goods, Livestock & Continuity Assets","subs":["Perishable raw materials and finished inventory at risk of spoilage during outages","Live animals dependent on automated feeding, watering and climate control (welfare and mortality risk)","Cold-chain integrity across storage and transit","Seasonal/time-critical processing windows (harvest, slaughter, planting) with no slack to absorb downtime","Manual-workaround capacity and business-continuity/backup infrastructure","Brand/reputation and consumer-trust assets tied to food safety and availability"]}}},{"key":"physical operational continuity systems","name":"Physical Operational Continuity Systems","fam":"OT & Operational Disruption","desc":"Facility and logistics systems whose disruption has direct patient-safety consequences distinct from pure data risk.","inds":{"Healthcare and Social Assistance":{"raw":"Physical/Operational Continuity Systems","subs":["Ambulance/EMS dispatch and diversion coordination","Pharmacy and blood-bank inventory/cold-chain management systems","Hospital building management/access-control systems","Emergency department and OR scheduling systems"]}}},{"key":"physical plant and multi site infrastructure","name":"Physical Plant and Multi Site Infrastructure","fam":"OT & Operational Disruption","desc":"Geographically distributed physical facilities whose network segmentation (or lack thereof) determines how far a single compromise can spread.","inds":{"Manufacturing":{"raw":"Physical Plant and Multi-Site Infrastructure","subs":["Multiple manufacturing plants/sites on shared corporate networks","Regional/subsidiary networks with varying security maturity (e.g., overseas subsidiaries)","Industrial network segmentation boundaries (IT/OT air gaps or lack thereof)","Remote/unmanned facility connections"]}}},{"key":"point of sale pos and payment systems","name":"Point of Sale POS and Payment Systems","fam":"Other","desc":"In-store POS terminals, payment gateways/processors, e-commerce checkout flows, and PCI-scoped cardholder data environments. Encryption or manipulation of these systems can halt in-store sales entirely; breach of stored/tokenized card data drives PCI-DSS liability.","inds":{"Retail Trade and Consumer Services":{"raw":"Point-of-Sale (POS) and Payment Systems","subs":["In-store POS terminals and card readers","Payment gateway / processor integrations","E-commerce checkout and shopping-cart platforms","Tokenization/PCI cardholder data environments","Gift card and loyalty-point redemption systems"]}}},{"key":"production and manufacturing execution systems","name":"Production and Manufacturing Execution Systems","fam":"OT & Operational Disruption","desc":"Software layers that plan, schedule, and track physical production, encryption or corruption here halts output even if OT hardware itself is untouched.","inds":{"Manufacturing":{"raw":"Production and Manufacturing Execution Systems","subs":["Manufacturing Execution Systems (MES)","ERP systems tied to production scheduling and inventory (SAP, Oracle, etc.)","Quality-control and batch/lot-tracking systems","Warehouse management and inventory-control systems","Historian/data-collection servers bridging IT and OT"]}}},{"key":"production and operational technology systems","name":"Production and Operational Technology Systems","fam":"OT & Operational Disruption","desc":"The plant-floor and field systems whose disruption stops physical output and threatens food safety and animal welfare.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Production & Operational Technology Systems","subs":["Processing-line SCADA/PLC/DCS (slaughter, milling, pasteurization, cooking, canning, bottling)","Cold-storage / refrigeration / HVAC and environmental controls","Automated milking, feeding, ventilation and livestock climate systems","Precision-ag equipment, telematics, GPS guidance, irrigation and grain-drying controls","Food-safety and quality monitoring/sensor systems (temperature logging, HACCP instrumentation)","Warehouse automation, robotics and conveyance in distribution centers"]}}},{"key":"project and design data","name":"Project and Design Data","fam":"Other","desc":"The core intellectual property of a construction or engineering firm, of high value both for extortion leverage and to competitors.","inds":{"Construction":{"raw":"Project and Design Data","subs":["CAD and BIM (Building Information Modeling) files","Architectural drawings and blueprints","Structural, MEP and civil engineering calculations","Geotechnical and site-survey data","Proprietary construction methods and engineering IP"]}}},{"key":"protected health information phi and personal data","name":"Protected Health Information PHI and Personal Data","fam":"Data & IP Confidentiality","desc":"The core data asset that makes healthcare an attractive double-extortion target, spanning highly sensitive clinical and identity data.","inds":{"Healthcare and Social Assistance":{"raw":"Protected Health Information (PHI) and Personal Data","subs":["Patient demographic and insurance/Medicare-Medicaid identifiers","Clinical/treatment records including mental health, substance-abuse, and reproductive-health data","Sensitive images (e.g., oncology treatment photos leaked at Lehigh Valley Health Network)","Genetic and biometric data","Social Security numbers, financial and payment-card data collected for billing"]}}},{"key":"public safety and emergency systems","name":"Public Safety and Emergency Systems","fam":"OT & Operational Disruption","desc":"Life-safety systems whose disruption elevates a data incident to a public-safety emergency.","inds":{"Public Administration (Government)":{"raw":"Public-Safety & Emergency Systems","subs":["911 / emergency dispatch and computer-aided-dispatch (CAD) (Dallas)","First-responder and police/fire records and communications","Emergency notification and alerting systems","Jail/detention and body-camera/evidence management systems"]}}},{"key":"real estate specific systems and data","name":"Real Estate Specific Systems and Data","fam":"Other","desc":"Systems and data unique to commercial/residential real estate services firms.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Real estate-specific systems and data","subs":["Property management and lease/tenant databases","Building access-control and physical security systems (e.g., Open Options access-control platform incident)","Title, escrow, and transaction-closing data","Facilities/IoT building-management systems"]}}},{"key":"regulatory lawful intercept and critical infrastructure systems","name":"Regulatory Lawful Intercept and Critical Infrastructure Systems","fam":"Regulatory & Legal","desc":"Government-facing and critical-infrastructure-designated systems that create outsized regulatory and national-security exposure when compromised.","inds":{"Telecommunications":{"raw":"Regulatory, Lawful-Intercept & Critical-Infrastructure Systems","subs":["Lawful intercept and law-enforcement request-handling systems","Critical infrastructure/national security designated network segments","Breach-notification and regulatory reporting systems (subject to GDPR, PIPC, FCC, Ofcom, etc.)"]}}},{"key":"research data intellectual property and regulated research health data","name":"Research Data Intellectual Property and Regulated Research Health Data","fam":"Regulatory & Legal","desc":"The exposure unique to higher education. Universities hold pre-publication research, proprietary and licensed datasets, export-controlled work and long-running human-subjects cohorts. The University of Manchester attack reached NHS records for 1.1 million patients gathered from over 200 hospitals for medical research, and the University of Hawai'i Cancer Center incident exposed decades-old epidemiological cohort data affecting up to 1.15 million individuals - demonstrating that research archives create liability for populations who were never students or staff.","inds":{"Educational Services":{"raw":"Research Data, Intellectual Property and Regulated Research Health Data","subs":["Human-subjects research cohorts and longitudinal study data","Clinical, patient and genomic research datasets (HIPAA-regulated)","Pre-publication research, grant applications and unpublished results","Patents, licensing pipelines and technology-transfer records","Export-controlled, defence and dual-use research","Industry-sponsored and contract research under NDA","HPC clusters, lab instrumentation and research computing storage","Licensed third-party datasets with contractual breach penalties","IRB records and participant consent/identity linkage files"]}}},{"key":"software development and source code assets","name":"Software Development and Source Code Assets","fam":"Data & IP Confidentiality","desc":"The crown-jewel assets unique to technology firms; their exposure enables both direct IP loss and downstream supply-chain compromise.","inds":{"Information Technology":{"raw":"Software Development and Source-Code Assets","subs":["Source-code repositories (Git/GitHub/GitLab/Bitbucket)","CI/CD build and release pipelines","Code-signing keys and certificates","Container registries and artifact stores","Product designs, hardware blueprints and chip/EDA design data"]}}},{"key":"student information systems sis and core records","name":"Student Information Systems Sis and Core Records","fam":"Other","desc":"The system of record for enrolment, demographics, attendance, discipline and transcripts, and the highest-value single target in education because it concentrates minors' PII for an entire district or institution in one platform. SIS compromise is both a direct exposure at the institution and, via the vendor, the sector's principal aggregation event - the PowerSchool intrusion reached a claimed 62.4 million students and 9.5 million teachers across approximately 6,505 districts.","inds":{"Educational Services":{"raw":"Student Information Systems (SIS) and Core Records","subs":["Enrolment, demographic and household records","Attendance and truancy data","Disciplinary and behavioural records","Transcripts, grades and academic history","Special-education (IEP/504) records","Immunisation and student health records held in SIS","Emergency contact and guardian/custody information","Free and reduced-price meal eligibility (income-linked)","Vendor-hosted SIS instances and SIS data warehouses"]}}},{"key":"subscriber and customer pii","name":"Subscriber and Customer PII","fam":"Data & IP Confidentiality","desc":"The high-volume personal data telecom operators uniquely hold by virtue of serving as national-scale identity and communications intermediaries.","inds":{"Telecommunications":{"raw":"Subscriber & Customer PII","subs":["Names, addresses, dates of birth, national ID/passport/driver's license scans","Call Detail Records (CDRs) - who called whom, when, duration, cell-tower location metadata","Billing, payment card and bank account data","Login credentials, security questions, and account history (WOW!-style)","Device/handset data and device financing records"]}}},{"key":"supply chain and third party vendor networks","name":"Supply Chain and Third Party Vendor Networks","fam":"Third-Party & Supply Chain","desc":"Manufacturing's deep tiered-supplier interdependency means exposure extends well beyond the insured entity's own network perimeter.","inds":{"Manufacturing":{"raw":"Supply Chain and Third-Party/Vendor Networks","subs":["Tier 1/2/3 supplier and subcontractor network connections (EDI, VPN, shared portals)","Just-in-time (JIT) logistics and shipping/freight coordination systems","Contract manufacturers and OEM/ODM partners","Third-party MSPs/OT integrators with remote access credentials","Raw material and component sourcing platforms"]}}},{"key":"supply chain inventory and store operations systems","name":"Supply Chain Inventory and Store Operations Systems","fam":"Third-Party & Supply Chain","desc":"ERP, warehouse management, automated ordering, and inventory/replenishment systems whose disruption forces retailers back to manual, paper-based operations - the single biggest driver of revenue loss in major incidents like M&S.","inds":{"Retail Trade and Consumer Services":{"raw":"Supply Chain, Inventory, and Store Operations Systems","subs":["ERP / enterprise resource planning platforms","Warehouse management and logistics/routing systems","Automated stock replenishment and ordering systems","Store network and in-store IT infrastructure (self-checkout, digital signage)","Click-and-collect / omnichannel fulfillment systems"]}}},{"key":"telehealth and remote care platforms","name":"Telehealth and Remote Care Platforms","fam":"Other","desc":"Patient-facing digital care delivery channels that expand the network's external attack surface.","inds":{"Healthcare and Social Assistance":{"raw":"Telehealth and Remote-Care Platforms","subs":["Telehealth/video-visit platforms","Remote patient monitoring and wearable-device data feeds","Patient portals and appointment-scheduling systems"]}}},{"key":"third parties and interconnections","name":"Third Parties and Interconnections","fam":"Other","desc":"External entities and links whose compromise transmits risk into or out of the operator.","inds":{"Energy and Utilities":{"raw":"Third Parties & Interconnections","subs":["Oilfield-service, drilling, and EPC contractors","ICS/automation vendors and remote-maintenance channels","Fuel/payment processors and retail franchisees","Interconnected pipeline/grid operators and shared telemetry","MSPs, IT outsourcers, and shared group-IT platforms","Software/firmware/update supply chain (WSUS abuse, vendor patches)"]}}},{"key":"third party and shared service dependencies","name":"Third Party and Shared Service Dependencies","fam":"Third-Party & Supply Chain","desc":"External providers and shared platforms whose compromise exposes the agency (aggregation risk).","inds":{"Public Administration (Government)":{"raw":"Third-Party & Shared-Service Dependencies","subs":["MSPs, IT contractors, and outsourced help-desk/network providers","Shared statewide/county data centers and regional service cooperatives","Cloud/SaaS vendors for benefits, tax, HR, and records processing","File-transfer and remote-management software (MOVEit-style mass-exploit exposure)","Election and voter-registration technology vendors","Payment processors and identity-verification providers"]}}},{"key":"third party and subcontractor networks","name":"Third Party and Subcontractor Networks","fam":"Third-Party & Supply Chain","desc":"External parties and shared infrastructure that extend a construction firm's attack surface beyond its own perimeter.","inds":{"Construction":{"raw":"Third-Party and Subcontractor Networks","subs":["Shared extranets/portals used by subcontractors, architects and engineers","Owner and lender draw-request/financing portals","Common enterprise software shared industry-wide, creating correlated multi-victim exposure","Managed IT/security service providers used by smaller subcontractors"]}}},{"key":"third party and supply chain exposure","name":"Third Party and Supply Chain Exposure","fam":"Third-Party & Supply Chain","desc":"Extensive outsourcing and franchise/partner relationships common to hospitality, food service, and entertainment create indirect exposure when a vendor, franchisee, or partner is compromised.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Third-party and supply-chain exposure","subs":["IT help desk / managed service providers (a common initial-access vector, e.g., MGM/Caesars)","Third-party booking, ticketing, and OTA platforms","Food & beverage supply chain and distribution/logistics vendors (e.g., Blue Yonder-type SaaS incidents)","Construction, renovation, and facilities contractors with access to internal systems/data (e.g., Disneyland Paris partner breach)","Staffing agencies and payroll/HR outsourcing providers","Franchise and multi-brand management companies operating shared back-office systems across many independently branded properties"]}}},{"key":"third party and vendor ecosystem","name":"Third Party and Vendor Ecosystem","fam":"Third-Party & Supply Chain","desc":"The dense web of business associates and downstream partners that extend a healthcare organization's effective risk surface far beyond its own network.","inds":{"Healthcare and Social Assistance":{"raw":"Third-Party and Vendor Ecosystem","subs":["EHR, practice-management, and health IT software vendors","Managed service providers (MSPs) and IT outsourcers serving multiple clinics/hospitals","Medical billing/collections and revenue-cycle-management firms","Lab, imaging, and pathology outsourcing partners","Staffing agencies and home-health/senior-care service providers","Health insurers and third-party administrators handling member PHI"]}}},{"key":"third party edtech cloud and identity infrastructure","name":"Third Party Edtech Cloud and Identity Infrastructure","fam":"Third-Party & Supply Chain","desc":"Modern institutions outsource most of their data estate, so a large share of exposure sits outside the insured's own perimeter and outside its control. This is the exposure that converts individual education risks into portfolio-level correlated loss, and Verizon's 2026 DBIR reported third parties featuring in 48% of breaches with supply-chain breaches up 60% year over year.","inds":{"Educational Services":{"raw":"Third-Party Edtech, Cloud and Identity Infrastructure","subs":["SIS, LMS and assessment vendors (aggregation nodes)","Managed service providers and regional education service agencies","Cloud tenancies (Microsoft 365, Google Workspace) and OAuth token estates","Federated identity providers and SSO trust fabric (Shibboleth, InCommon, eduGAIN)","Managed file transfer and data exchange platforms","Payment processors, tuition plans and collections agencies","Library systems, catalogues, e-resource and publisher platforms","Transcript, credentialing, admissions and enrolment-verification services","Backup, DR and archival providers","Student wellbeing, tutoring, safety-monitoring and communications apps"]}}},{"key":"third party franchise and vendor dealer networks","name":"Third Party Franchise and Vendor Dealer Networks","fam":"Third-Party & Supply Chain","desc":"Retail and consumer-services businesses depend heavily on shared platforms (DMS/SaaS providers), franchise networks, and outsourced IT help desks, creating single points of failure that can cascade an attack on one vendor into thousands of affected businesses.","inds":{"Retail Trade and Consumer Services":{"raw":"Third-Party, Franchise, and Vendor/Dealer Networks","subs":["Shared SaaS/dealer-management-system providers (e.g., DMS platforms for auto dealers)","Franchise and multi-location operator networks","Outsourced/third-party IT help desks and identity providers (Okta and similar)","Payment processors and financial intermediaries","Marketing, loyalty, and analytics vendors with data-sharing access"]}}},{"key":"third party partner and downstream data","name":"Third Party Partner and Downstream Data","fam":"Third-Party & Supply Chain","desc":"Data and access that telecom operators hold on behalf of, or shared with, other organizations - amplifying blast radius beyond the operator's own customers.","inds":{"Telecommunications":{"raw":"Third-Party, Partner & Downstream Data","subs":["MVNO (mobile virtual network operator) and reseller partner data","Interconnect/roaming carrier data and industry-association data (e.g., GSMA)","Data belonging to enterprise customers hosted, routed, or processed by the telecom (managed services, hosting, colocation)","References to other companies' infrastructure held incidentally (e.g., tower records referencing other carriers' equipment)"]}}},{"key":"third party vendor and fintech partner ecosystem","name":"Third Party Vendor and Fintech Partner Ecosystem","fam":"Third-Party & Supply Chain","desc":"Financial institutions increasingly outsource operational functions and partner with fintechs, creating shared/concentrated exposure where a single vendor breach cascades across multiple unrelated institutions and their end customers.","inds":{"Finance and Insurance":{"raw":"Third-Party, Vendor, and Fintech-Partner Ecosystem","subs":["Banking-as-a-service (BaaS) infrastructure providers and their downstream fintech clients (e.g., Evolve Bank & Trust exposing Affirm, Wise, Mercury customers)","Statement printing, mailing, and document-fulfillment vendors (e.g., Frost/Citizens shared vendor)","Marketing, loyalty, and incentive-platform vendors serving bank sales partners (e.g., Deutsche Bank third-party marketing platform)","Core-processing and payments technology vendors (e.g., Fiserv, TSYS-type processors)","Title, escrow, and closing-services platforms tied to real estate transactions (e.g., FNF)","Credit bureaus, KYC/identity-verification, and data-aggregation partners","Managed IT/security service providers and outsourced call centers"]}}},{"key":"wholesale trade and logistics systems","name":"Wholesale Trade and Logistics Systems","fam":"OT & Operational Disruption","desc":"Systems supporting the physical movement and distribution of goods.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Wholesale trade and logistics systems","subs":["Warehouse management systems (WMS) and inventory databases","Freight/transportation management and dispatch s logy","Healthcare","Consumer Services","Financial Services","Construction","Transportation/Logistics","Education","Public Sector","Agriculture and Food Production","Energy","Hospitality and Tourism","Telecommunication"],"cells":[[415,323,161,143,110,104,88,93,114,112,106,58,50,17],[276,304,182,178,118,128,131,74,73,82,89,51,62,25],[330,363,130,54,103,99,135,69,25,11,89,44,48,22],[190,142,213,72,159,84,23,93,44,15,43,40,21,12],[221,263,117,9,67,42,82,69,6,17,56,35,38,12],[166,98,95,128,48,41,39,28,72,51,27,19,23,8],[213,109,129,81,23,37,11,39,43,39,39,24,25,2],[139,145,57,33,80,34,47,36,22,38,44,16,29,10],[162,112,60,68,46,55,41,23,21,30,34,36,17,9],[125,105,62,39,38,29,61,35,10,10,33,19,21,9]]},"coverage":{"total":148,"fields":[{"field":"Financial impact stated","disclosed":57,"undisclosed":91,"pct":39},{"field":"Financial amount ($)","disclosed":31,"undisclosed":117,"pct":21},{"field":"Ransom amount ($)","disclosed":29,"undisclosed":119,"pct":20},{"field":"Ransom demanded","disclosed":45,"undisclosed":103,"pct":30},{"field":"Ransom paid","disclosed":25,"undisclosed":123,"pct":17},{"field":"Downtime / recovery","disclosed":122,"undisclosed":26,"pct":82},{"field":"Data impact","disclosed":119,"undisclosed":29,"pct":80}]},"financial":[{"victim":"Change Healthcare (subsidiary of UnitedHealth Group/Optum)","industry":"Healthcare and Social Assistance","usd":2900000000,"raw":"UnitedHealth Group's total reported cyberattack impact reached approximately $2.9 billion for fiscal year 2024 (direct response costs plus business disruption); an initial Q1 2024 estimate of $0.74/share grew through the year to a full-year estimate of $1.90-$2.05/share. UnitedHealth also advanced more than $9 billion in interim/interest-free funding to affected providers by Q2 2024 to offset cash-flow disruption across the industry."},{"victim":"CDK Global","industry":"Information Technology","usd":1000000000,"raw":"Anderson Economic Group estimated total dealer losses exceeding $1 billion (revised up from ~$944M) from roughly two-plus weeks of disruption."},{"victim":"Health Service Executive (HSE), Ireland's national public health system","industry":"Healthcare and Social Assistance","usd":600000000,"raw":"Estimates for recovery costs varied widely across reporting: the HSE's director general cited a June 2021 estimate exceeding $600 million; other analyses put full recovery cost at roughly $100 million, and yet other reporting cited about $83 million; figures differ by scope (pure IT rebuild vs. total health-system impact) and are not fully reconciled in public reporting."},{"victim":"CommonSpirit Health, ~140+ hospitals across ~13 US states","industry":"Healthcare and Social Assistance","usd":150000000,"raw":"CommonSpirit initially estimated the cost at approximately $150 million, later revising the total to approximately $160 million (business interruption, remediation, and related expenses) as reported in 2023 disclosures."},{"victim":"MGM Resorts International","industry":"Accommodation, Food Services, Arts and Entertainment","usd":100000000,"raw":"MGM disclosed an estimated ~$100 million negative impact to Adjusted Property EBITDAR for Las Vegas Strip and Regional Operations, plus under $10 million in one-time remediation/legal/incident-response costs; company said it expected to be largely covered by cyber insurance. A related shareholder/consumer class-action settlement was reached in 2025."},{"victim":"SK Telecom","industry":"Telecommunications","usd":97200000,"raw":"Record $97.2 million (KRW 134.8 billion) fine from South Korea's Personal Information Protection Committee, plus a ~$7,000 fine for late breach reporting; the Korea Consumer Agency separately ordered SK Telecom to pay ~$67 (100,000 won) compensation to each of the 23 million affected users; SK Telecom committed roughly $514 million to a security-overhaul 'Accountability and Commitment Program,' plus bill discounts, fee waivers and free data."},{"victim":"Universal Health Services (UHS), ~400 US hospitals/care sites","industry":"Healthcare and Social Assistance","usd":67000000,"raw":"UHS reported approximately $67 million in total pre-tax losses tied to the attack (lost operating income, reduced patient activity, billing-delay reserves, and recovery costs), and stated it expected to recover most of this through cyber insurance."},{"victim":"Lehigh Valley Health Network (LVHN)","industry":"Healthcare and Social Assistance","usd":65000000,"raw":"LVHN agreed to a $65 million class-action settlement (finalized November 2024), one of the largest healthcare ransomware-related settlements on record; of this, $52 million was earmarked for patients whose nude treatment images were published."},{"victim":"Expeditors International of Washington","industry":"Transportation and Warehousing","usd":62000000,"raw":"Per SEC 10-K/8-K filings: approximately $62 million in incremental demurrage charges (inability to timely move shipments through ports) and approximately $28 million in investigation, recovery, and remediation expenses in H1 2022, commonly summarized in press coverage as roughly $60 million in total incident-related costs; company also disclosed lower shipment volumes and revenue impact as customers shifted to competitors during the outage."},{"victim":"Cognizant Technology Solutions","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":50000000,"raw":"Cognizant CFO disclosed in a Q1 2020 SEC filing / earnings call that the incident would cost the company an estimated $50 million to $70 million in Q2 2020, covering investigation, containment, remediation, legal fees, and security investment (not counting potential lost revenue)."},{"victim":"Sopra Steria","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":48000000,"raw":"Company estimated the negative impact on gross operating margin at between EUR40 million and EUR50 million (roughly $48M-$60M), of which approximately EUR30 million was expected to be covered by cyber insurance."},{"victim":"CNA Financial Corporation","industry":"Finance and Insurance","usd":40000000,"raw":"Reportedly paid $40 million in ransom - among the largest ransom payments publicly reported at the time. Full cost of remediation/legal/breach-notification beyond the ransom itself is not publicly disclosed in aggregate."},{"victim":"Government of Costa Rica (national ministries)","industry":"Public Administration (Government)","usd":38000000,"raw":"Economic drag estimated at ~$38 million per day of downtime; the Costa Rican Chamber of Foreign Commerce estimated losses exceeding $125 million in the first two days alone (halted tax/customs). Costa Rica invested ~$25 million in recovery; the U.S. State Department pledged $25 million in March 2023 to aid recovery and cyber-capacity building."},{"victim":"Halliburton","industry":"Energy and Utilities","usd":35000000,"raw":"~$35M direct pretax cost reported in Q3 2024 results (filed late Oct 2024); ~$0.02 adjusted-EPS impact for the quarter from lost/delayed revenue during system unavailability."},{"victim":"Rackspace Technology","industry":"Information Technology","usd":30000000,"raw":"~$30M"}],"ransom":[{"victim":"Kaseya (VSA platform)","industry":"Information Technology","usd":70000000,"raw":"REvil demanded a single universal-decryptor payment of $70 million in Bitcoin. Kaseya states it did NOT pay the ransom; it obtained a universal decryptor from a 'trusted third party' (later reported as provided via the FBI)."},{"victim":"CNA Financial Corporation","industry":"Finance and Insurance","usd":60000000,"raw":"Attackers initially demanded $60 million; CNA paid approximately $40 million roughly two weeks after data theft began."},{"victim":"Quanta Computer (Apple supplier)","industry":"Information Technology","usd":50000000,"raw":"REvil demanded $50 million, reportedly escalating toward $100M; the ransom was not paid by Quanta (and REvil eventually removed the leaked files). No confirmed payment."},{"victim":"Continental AG","industry":"Manufacturing","usd":50000000,"raw":"LockBit publicly listed the stolen data for sale at $50 million on November 9, 2022, reduced to $40 million by November 29, 2022; negotiation transcripts published by LockBit show discussions beginning September 23, 2022, but Continental has stated it aborted contact with the group rather than paying."},{"victim":"Accenture","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":50000000,"raw":"LockBit demanded $50 million; Accenture has not confirmed paying any ransom."},{"victim":"Foxconn (CTBG MX plant, Ciudad Juárez)","industry":"Manufacturing","usd":34000000,"raw":"DoppelPaymer demanded 1,804.0955 BTC, reported at the time as approximately $34 million (some sources cite ~$32.97 million); Foxconn did not pay, and stolen data was later published on the dark web."},{"victim":"Caesars Entertainment","industry":"Accommodation, Food Services, Arts and Entertainment","usd":30000000,"raw":"Attackers initially demanded $30 million; Caesars paid approximately $15 million in cryptocurrency. The FBI later tracked and froze a portion of the payment as it moved through crypto exchanges."},{"victim":"Software AG","industry":"Information Technology","usd":23000000,"raw":"Clop demanded approximately $23 million. Software AG refused to pay."},{"victim":"JBS S.A. / JBS USA","industry":"Agriculture, Forestry, Fishing and Food Production","usd":22500000,"raw":"REvil initially demanded $22.5 million; JBS negotiated and paid $11 million in Bitcoin."},{"victim":"Change Healthcare (subsidiary of UnitedHealth Group/Optum)","industry":"Healthcare and Social Assistance","usd":22000000,"raw":"UnitedHealth confirmed paying a ransom reported by multiple outlets at roughly $22 million in bitcoin to the ALPHV/BlackCat affiliate; a second group (RansomHub) subsequently claimed to still hold the stolen data and re-extorted the company."},{"victim":"Health Service Executive (HSE), Ireland's national public health system","industry":"Healthcare and Social Assistance","usd":19999000,"raw":"Conti demanded $19,999,000; the HSE refused to pay and instead worked with Ireland's National Cyber Security Centre; a free decryptor was later released by the attackers."},{"victim":"Medibank Private (major Australian health insurer)","industry":"Healthcare and Social Assistance","usd":10000000,"raw":"Initial demand of roughly US$10 million (A$15 million), later reduced to approximately US$9.7 million; Medibank refused to pay, consistent with Australian government guidance against ransom payments."},{"victim":"CDK Global","industry":"Information Technology","usd":10000000,"raw":"BlackSuit initially demanded ~$10M, reportedly escalating toward $50M+. CDK is widely reported to have paid approximately $25 million in Bitcoin (wallets tied to BlackSuit received ~$25M about two days after the attack, per CyberScoop)."},{"victim":"CWT (Carlson Wagonlit Travel)","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":10000000,"raw":"Initial demand of $10 million negotiated down to a paid ransom of $4.5 million (414 BTC), received by attackers July 28, 2020."},{"victim":"Government of Costa Rica (national ministries)","industry":"Public Administration (Government)","usd":10000000,"raw":"Conti demanded US$10 million, later doubled to US$20 million; the government declined to pay."}]},"global":[{"m":"Total on-chain ransomware payments, 2025","v":"Approximately $820 million, the lowest full-year total since 2021 and an 8% decline from 2024's revised $892 million. Chainalysis notes the figure may approach or exceed $900 million as further incidents are attributed.","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median on-chain ransom payment, 2025","v":"$59,556, up 368% from $12,738 in 2024","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Share of ransom demands paid, 2025","v":"Potentially an all-time low of approximately 28%","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Claimed victims posted to leak sites, 2025","v":"7,874 globally, a 50% year-over-year increase and the most active year on record. The United States remains the most heavily targeted country, followed by Canada, Germany and the UK. US targeting of critical infrastructure, supply chain/logistics and government rose 45-56% year over year.","s":"Chainalysis 2026 Crypto Crime Report (citing eCrime.ch data)","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median ransom payment, 2026","v":"$769,000, down from $1 million the prior year","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Median ransom demand, 2026","v":"$698,000, down 65% over two years","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Average recovery cost excluding ransom, 2026","v":"$1.7 million per incident, up 11% year over year (2025 figure was $1.53 million, itself down 44% from $2.73 million in 2024)","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Ransom payment rate among encrypted victims, 2026","v":"48% paid, the second-lowest rate on record after 2023 (46%); four-year average payment rate is 50%. Among those paying, 51% negotiated below the initial demand.","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Attack encryption success rate, 2026","v":"56% of attacks succeeded in encrypting data, up from 50% the prior year but below the 75% peak in 2023","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Identity-based attack origin, 2026","v":"79% of ransomware attacks started with an identity-based approach. Root causes: malicious email 26%, phishing 24%, compromised credentials 23%, exploited vulnerabilities 18%, brute-force 6%.","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Recovery speed, 2025","v":"53% of victims recovered within one week, up from 35% in 2024","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average and median ransom payment, Q4 2025","v":"Average $591,988; median $325,000. Quarterly averages were volatile across 2025, moving from $1.13 million (Q2) to $376,941 (Q3) to $591,988 (Q4); the mean-median gap reflects a small number of multi-million-dollar settlements.","s":"Coveware Quarterly Report, Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Ransom payment rate, Q4 2025","v":"Approximately 20%, a historic low (23% in Q3 2025)","s":"Coveware Quarterly Report, Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Ransomware share of all data breaches, 2025","v":"Present in 44% of breaches, up from 32% the prior year","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Median ransom paid and non-payment rate, 2025","v":"Median payment $115,000, down from $150,000; 64% of victim organizations did not pay, up from 50% two years earlier","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"SMB versus large-organization ransomware exposure, 2025","v":"Ransomware was a component of 88% of SMB breaches versus 39% of breaches at large organizations","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Average cost of an extortion or ransomware incident, 2025","v":"$5.08 million, against a global all-cause data breach average of $4.44 million (down 9% from $4.88 million in 2024). US average breach cost rose 9% to an all-time high of $10.22 million.","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Breach identification and containment time, 2025","v":"241 days on average to identify and contain a breach, a nine-year low. 63% of organizations refused to pay ransom demands, up from 59%.","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"}],"comparison":"Ransomware is often discussed as a single peril, but the underwriting reality across these fourteen industries is that the peril's shape changes with what the victim cannot afford to lose. The clearest dividing line is between uptime-driven extortion leverage and data-sensitivity-driven leverage. In manufacturing, energy and utilities, transportation and warehousing, and agriculture/food production, the attacker's leverage is the clock. A stopped production line, an idled pipeline scheduling system, a freight dispatch outage, or a cold-chain failure converts directly into per-hour revenue loss, spoilage, or contractual penalty, and the loss accrues whether or not any data is ever published. Manufacturing has been the single most-targeted sector for five consecutive years through 2025 (4,434 leak-site postings on the ransomware.live Manufacturing tag) precisely because this pressure reliably shortens the decision cycle toward payment. Energy (~826 indexed victims) adds cascading physical and public-safety consequence on top of revenue loss, and agriculture/food adds perishability: a processor cannot bank a week of downtime because the inventory itself degrades. In these sectors the ransom demand is effectively priced against business-interruption cost, and the IT/OT boundary is the critical underwriting question, because segmentation failure is what turns an IT encryption event into a physical production halt. Against that sits data-sensitivity-driven leverage, which dominates healthcare, finance and insurance, education, and the professional-services group. Here the threat is publication, regulatory consequence, and downstream liability rather than lost output per hour. Healthcare is the hybrid worst case and the reason it consistently prices worst: it carries both severe data sensitivity (PHI, 2,443 posted victims) and a genuine safety-driven uptime constraint, since diverted ambulances and delayed oncology treatment are patient-harm events, not inconvenience. Finance carries acute data sensitivity plus real-time settlement obligations, but generally has the maturity, redundancy, and capital to recover without paying. Education and the professional-services group are closer to pure data-leverage plays: a law firm's privileged client files or a university's student records create liability and reputational damage on publication, but a two-week outage, while painful, is rarely existential. The 1,295 education victim records show the classic data-extortion signature, dominated by LockBit3 (114), Qilin (73), INC Ransom (72), Vice Society (63) and Rhysida (57), with Vice Society's and Rhysida's prominence reflecting deliberate specialization in schools and universities as soft, data-rich, under-defended targets. Regulatory exposure differs enough to change loss composition, not merely loss size. HIPAA gives healthcare the most punitive and most mechanically triggered regime: breach notification thresholds, OCR investigation, and near-automatic class-action follow-on mean that third-party liability and regulatory defense frequently exceed first-party restoration cost. Finance faces GLBA and, for EU-touching entities, DORA, which shifts the burden upstream into operational-resilience testing, ICT third-party register maintenance, and rapid incident reporting, a compliance-failure exposure that exists independent of whether an attack succeeds. Education sits under FERPA, which is substantively strict but historically weak on financial penalty, so education's regulatory tail is thinner than healthcare's even at comparable data sensitivity; the real education tail is state student-privacy statutes and litigation. Critical-infrastructure sectors, energy, transportation, water, manufacturing, food, are increasingly shaped by CIRCIA reporting obligations, which compress disclosure timelines and raise the cost of an unprepared incident-response function. Public administration adds political and public-records exposure that has no private-sector analogue: the incident becomes a governance event, with disclosure often mandatory and negotiation frequently prohibited by policy. Downtime tolerance and ability to pay interact in ways that matter for expected severity. Healthcare, energy, transportation and food production have the lowest tolerance measured in hours; retail and hospitality tolerate hours-to-days but suffer disproportionately in peak season, where a POS outage over a holiday weekend or a casino floor outage during a major event compresses an entire quarter's margin; construction, education and much of professional services tolerate days-to-weeks, since project schedules and academic calendars absorb slippage. Ability to pay cuts across this and often inverts it. Corporate victims in finance, IT, telecom and large manufacturing can fund both ransom and rapid restoration. Public administration and education frequently cannot: budgets are appropriated, not discretionary, ransom payment may be legally or politically foreclosed, and the practical consequence is longer outages, deeper reliance on insurance and public funds, and greater restoration cost even where the ransom itself is never paid. This is why public-sector and education severity should not be underwritten off ransom-demand size, the loss migrates into extended business interruption, forensic and rebuild cost, and notification expense. Small organizations across every sector show the same asymmetry: Verizon's 2025 DBIR found ransomware present in 88% of SMB breaches versus 39% at large organizations, and Sophos's 2026 data shows only 34% of 100-250 employee firms stopped attacks before encryption versus 46% at 3,001-5,000 employees. Finally, third-party and supply-chain concentration varies enormously and is the dominant driver of correlated, portfolio-level loss. Information technology is the extreme case: MSPs, SaaS platforms, managed file-transfer products and distributors sit upstream of thousands of customers, and Kaseya, MOVEit, CDK Global and Ingram Micro each demonstrated that one intrusion produces simultaneous outages across an entire book. Telecommunications is structurally similar, carriers are single points of failure for downstream connectivity, and its 357 tracked victims with sharp 2025-2026 acceleration (124 in 2025, 62 in the first seven months of 2026) suggest attackers have recognized this. Manufacturing and transportation carry tiered supplier concentration where a single Tier-2 supplier outage idles multiple OEMs, producing contingent business interruption that the direct victim's own policy never captures. Healthcare concentrates through claims clearinghouses and billing intermediaries, finance through fintech partners and market infrastructure, retail through shared dealer-management and CRM platforms, and agriculture through a small number of processors and cooperatives controlling large shares of throughput. Construction and hospitality, by contrast, are comparatively fragmented, losses there are more numerous but far less correlated. For a cyber portfolio, this distinction matters more than raw frequency: fragmented sectors generate attritional loss, concentrated sectors generate the accumulation event that threatens solvency.","takeaways":["Frequency and severity are decoupling, and pricing must follow both curves separately. Leak-site victims hit a record 7,874 in 2025, up 50%, while total on-chain ransom payments fell 8% to roughly $820 million and payment rates hit historic lows, approximately 28% per Chainalysis, around 20% in Coveware's Q4 2025 book, 48% of encrypted victims per Sophos. More insureds are being hit and fewer are paying, so portfolio loss is migrating out of ransom reimbursement and into business interruption, restoration and liability. Sophos's average recovery cost rose 11% to $1.7 million in 2026 even as median payments fell to $769,000.","Underwrite the extortion lever, not the sector label. Uptime-leveraged sectors (manufacturing, energy, transportation, agriculture/food) generate BI-dominated loss where the IT/OT segmentation question and documented manual-fallback procedures are the decisive controls. Data-leveraged sectors (healthcare, finance, education, professional services) generate liability-dominated loss where data minimization, retention discipline and encryption-at-rest matter more than recovery speed. Healthcare is the only sector where both levers are simultaneously severe, which is why it prices worst.","Identity is now the control that matters most. Sophos found 79% of 2026 attacks began with an identity-based approach, with compromised credentials (23%) rivaling malicious email (26%) and phishing (24%) as root cause. Phishing-resistant MFA on all remote access and privileged accounts, help-desk identity-verification procedures resistant to voice social engineering, and tiered Active Directory administration should be treated as baseline binding requirements rather than credits.","Backup existence is not backup resilience, and the distinction is now the primary determinant of severity. Attackers routinely destroy backups, snapshots, hypervisor volumes and Active Directory before detonation. Require evidence of immutable or air-gapped backups, tested full-environment restoration within a stated RTO, and AD forest recovery capability. Sophos found 53% of victims recovered within a week in 2025 versus 35% the prior year, that gap is where severity is won or lost.","Exfiltration-only extortion defeats the backup-based recovery story entirely. A rising share of incidents involve no encryption, so an insured with excellent restoration capability can still face full notification, regulatory and litigation cost. Data-liability limits should be underwritten independently of business-interruption limits, and questions about data inventory, retention schedules and volume of retained personal records should carry real weight.","Third-party and supply-chain concentration is the accumulation exposure that threatens portfolio solvency, and it differs by an order of magnitude across sectors. Information technology and telecommunications are structurally concentrated, Kaseya, MOVEit, CDK Global and Ingram Micro each turned one intrusion into thousands of simultaneous claims. Manufacturing, transportation, healthcare claims processing and agriculture concentrate through tiered suppliers and intermediaries; construction and hospitality are comparatively fragmented and produce attritional rather than correlated loss. Map shared platform dependencies across the book, not just insured-by-insured controls, and consider explicit aggregation limits for shared SaaS and MSP platforms.","Ability to pay is inversely related to severity in the public sector and education, which inverts the usual intuition. Where appropriated budgets, policy or politics foreclose ransom payment, loss does not disappear, it lengthens into extended interruption, forensic rebuild and notification cost. Do not underwrite these segments off ransom-demand size, and expect longer claim durations and higher restoration expense than the demand would suggest.","Small insureds carry disproportionate ransomware exposure across every sector. Verizon's 2025 DBIR found ransomware in 88% of SMB breaches versus 39% at large organizations, and Sophos found only 34% of 100-250 employee firms stopped attacks before encryption versus 46% at 3,001-5,000 employees. SME cyber books need materially different control expectations and pricing assumptions than mid-market, and control credits validated at enterprise scale should not be extended downmarket unexamined.","Regulatory regime drives loss composition, not just loss size, and should shape limit structure. HIPAA produces the deepest liability tail; GLBA and DORA create compliance-failure exposure independent of attack success and demand evidence of resilience testing and ICT third-party registers; CIRCIA compresses disclosure timelines for critical-infrastructure insureds, raising the cost of an unprepared IR function; FERPA is strict but financially weak, leaving education's real tail in state statutes and litigation. Pre-arranged breach counsel and IR retainers measurably reduce this component."],"highest":["Manufacturing, highest frequency. The single most-targeted sector for five consecutive years through 2025, with 4,434 leak-site postings, the largest count in the dataset. Severity is driven by production-halt business interruption priced per hour, and aggregation risk arrives through tiered supplier concentration where one Tier-2 outage idles multiple OEMs.","Healthcare and Social Assistance, highest severity. 2,443 posted victims with accelerating pace, and uniquely both extortion levers at maximum: patient-safety downtime intolerance measured in hours plus the most punitive regulatory regime (HIPAA notification, OCR enforcement, near-automatic class actions). Loss composition skews heavily toward third-party liability and regulatory defense, and IBM's 2025 data places extortion-incident cost at $5.08 million on average before healthcare's sector premium.","Information Technology, highest systemic/accumulation risk. Second most-targeted industry and the one most capable of producing a single correlated loss across an entire portfolio. Kaseya, MOVEit, CDK Global and Ingram Micro each converted one intrusion into thousands of simultaneous downstream victims. Chainalysis records US supply-chain and logistics targeting up 45-56% year over year, indicating attackers are deliberately pursuing this multiplier.","Public Administration (Government), high frequency with structurally extended severity. Chronically under-funded legacy estates and vast citizen PII holdings, combined with a constrained payment decision: where payment is politically or legally foreclosed, loss migrates into prolonged interruption, forensic rebuild and notification cost. Outage durations run longer than in any comparably targeted private sector.","Energy and Utilities, highest consequence severity. Roughly 826 indexed victims, but severity is disproportionate to frequency because the precautionary IT/OT shutdown is itself the loss event, as Colonial Pipeline demonstrated: business interruption occurs even where control systems are never touched. Downtime carries cascading physical, public-safety and regulatory consequence under CIRCIA and sector mandates.","Transportation and Warehousing, highest tail risk relative to revenue. The only sector with both the costliest recorded cyber loss (Maersk/NotPetya, roughly $300 million) and a documented ransomware-caused insolvency (KNP Logistics, roughly 730 jobs). Thin operating margins mean an outage survivable elsewhere becomes terminal here, making this the clearest sector for total-loss rather than partial-loss outcomes.","Educational Services, high and sharply rising frequency with weak recovery capacity. 1,295 tracked victims on a sustained upward trajectory, targeted by groups (Vice Society, Rhysida) that specialize in the sector precisely because it is soft and data-rich. Minors' data raises notification sensitivity while appropriated budgets constrain both prevention and recovery, so incidents resolve slowly and expensively even at modest ransom demands."]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ND = /^(not (publicly )?(disclosed|reported|available|known)|unknown|undisclosed|n\/a)/i;
const fmt = (v) => !v ? '<span class="nd">not recorded</span>' : (ND.test(v) ? '<span class="nd">' + esc(v) + '</span>' : esc(v));
const num = (n) => n.toLocaleString('en-US');

/* metrics strip */
$('#metrics').innerHTML = [
  [num(D.meta.bulkTotal), 'victims scraped'],
  [D.meta.incidents, 'researched'],
  [D.meta.hazards, 'hazards'],
  [D.meta.exposures, 'exposures'],
  [num(D.meta.subcats), 'subcategories'],
].map(([b, s]) => '<div class="metric"><b>' + b + '</b><span>' + s + '</span></div>').join('');

/* tabs */
const TABS = [['matrix','Matrix'],['insights','Insights'],['ind','Industries'],['cat','Categories'],['inc','Incidents'],['syn','Cross-industry']];
$('#nav').innerHTML = TABS.map(([id,t],i) =>
  '<button role="tab" data-t="'+id+'" aria-selected="'+(i===0)+'">'+t+'</button>').join('');
$('#nav').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  document.querySelectorAll('#nav button').forEach((x) => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p' + '-' + b.dataset.t));
});

/* ---------- drawer ---------- */
const drawer = $('#drawer'), scrim = $('#scrim');
let lastFocus = null;
function open(html) {
  lastFocus = document.activeElement;
  $('#dbody').innerHTML = html;
  drawer.classList.add('on'); scrim.classList.add('on');
  drawer.setAttribute('aria-hidden', 'false');
  drawer.scrollTop = 0; $('#closeBtn').focus();
}
function close() {
  drawer.classList.remove('on'); scrim.classList.remove('on');
  drawer.setAttribute('aria-hidden', 'true');
  if (lastFocus) lastFocus.focus();
}
$('#closeBtn').onclick = close; scrim.onclick = close;

/* ---------- matrix ---------- */
const INDS = D.industries.map((i) => i.name);
const short = (n) => n.replace(/ and .*/, '').replace(/,.*/, '').slice(0, 22);
let MODE = 'fam';
/** Collapse categories into families: a family is "present" in an industry if
 *  any of its member categories is. Keeps member categories for the drawer. */
function byFamily(list) {
  const m = new Map();
  for (const c of list) {
    if (!m.has(c.fam)) m.set(c.fam, { key: 'fam:' + c.fam, name: c.fam, fam: c.fam, desc: '', inds: {}, members: [] });
    const f = m.get(c.fam);
    f.members.push(c);
    for (const i of Object.keys(c.inds)) {
      if (!f.inds[i]) f.inds[i] = { raw: [], subs: [] };
      f.inds[i].raw.push(c.inds[i].raw);
      f.inds[i].subs.push(...c.inds[i].subs);
    }
  }
  return [...m.values()].sort((a, b) => Object.keys(b.inds).length - Object.keys(a.inds).length);
}

function buildMatrix() {
  const rows = [];
  const section = (list, kind) => {
    rows.push('<tr class="famrow"><th colspan="' + (INDS.length + 2) + '" style="color:var(--' + (kind === 'h' ? 'hazard' : 'exposure') + ')!important;letter-spacing:.04em;text-transform:uppercase">'
      + (kind === 'h' ? 'Hazards' : 'Exposures') + ' · ' + list.length + '</th></tr>');
    for (const c of list) {
      const n = Object.keys(c.inds).length;
      rows.push('<tr><th title="' + esc(c.name) + (c.members ? ', ' + c.members.length + ' reported labels' : '') + '">' + esc(c.name)
        + (c.members && c.members.length > 1 ? ' <span style="color:var(--faint);font-weight:400">(' + c.members.length + ')</span>' : '')
        + '</th><td class="reach">' + n + '/' + INDS.length + '</td>'
        + INDS.map((i) => {
            const on = !!c.inds[i];
            return '<td>' + (on
              ? '<button class="cell ' + kind + '" data-c="' + esc(c.key) + '" data-k="' + kind + '" data-i="' + esc(i) + '" title="' + esc(i + ': ' + c.name) + '" aria-label="' + esc(i + ', ' + c.name) + '"></button>'
              : '<span class="cell off" aria-hidden="true"></span>') + '</td>';
          }).join('') + '</tr>');
    }
  };
  // Families are applied to HAZARDS ONLY, deliberately.
  //
  // Hazards are mechanisms — a handful of them, reworded per industry, so
  // grouping reveals the shared structure. Exposures are assets — EHR systems,
  // SCADA, student information systems — and their specificity IS the content.
  // Grouping them produced an "Other" bucket of 38 unrelated entries, which
  // told us nothing. So exposures always show as reported.
  const H = MODE === 'fam' ? byFamily(D.hazards) : D.hazards;
  const E = D.exposures;
  CUR = { h: H, e: E };
  const head = '<thead><tr><th>' + (MODE === 'fam' ? 'Hazard family / exposure' : 'Category as reported') + '</th><th class="reach">Reach</th>'
    + INDS.map((i) => '<th class="rot"><div>' + esc(short(i)) + '</div></th>').join('') + '</tr></thead>';
  $('#matrix').innerHTML = head + '<tbody>' + (section(H, 'h'), section(E, 'e'), rows.join('')) + '</tbody>';

  const uniq = E.filter((c) => Object.keys(c.inds).length === 1).length;
  $('#mnote').innerHTML = MODE === 'fam'
    ? '<b>Hazards</b> are grouped into families, because industries reported the same mechanism under different wordings. “Insider and Credential Risk” and '
      + '“Insider Identity and Privileged Access Risk” are one family. Grouped, five hazard families reach <b>every industry</b>. '
      + '<b>Exposures are left as reported</b> on purpose: they are assets, not mechanisms, and their specificity is the content, and grouping them just produced a meaningless “Other” bucket. '
      + '<b>' + uniq + ' of ' + E.length + '</b> exposures appear in only one industry. '
      + 'That asymmetry is the finding. <em>How</em> you get attacked is nearly universal, <em>what you stand to lose</em> is almost entirely industry-specific.'
    : 'Hazard labels exactly as each industry’s research reported them. The long tail of 1/14 rows is mostly wording variation rather than genuinely unique risk. '
      + 'which is why “By family” compares industries better. Click any cell for that industry’s specifics.';
}
let CUR = { h: [], e: [] };
$('#bFam').onclick = () => { MODE = 'fam'; $('#bFam').setAttribute('aria-pressed', 'true'); $('#bRaw').setAttribute('aria-pressed', 'false'); buildMatrix(); };
$('#bRaw').onclick = () => { MODE = 'raw'; $('#bRaw').setAttribute('aria-pressed', 'true'); $('#bFam').setAttribute('aria-pressed', 'false'); buildMatrix(); };

  : v >= 1e6 ? '$' + Math.round(v / 1e6) + 'M'
  : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'K' : '$' + v;
function tipMove(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tt.offsetWidth + 8 > innerWidth) x = e.clientX - tt.offsetWidth - pad;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function wireTips(root) {
  root.querySelectorAll('[data-tip]').forEach((el) => {
    el.addEventListener('mouseenter', () => { tt.innerHTML = el.dataset.tip; tt.classList.add('on'); });
    el.addEventListener('mousemove', tipMove);
    el.addEventListener('mouseleave', () => tt.classList.remove('on'));
  });
}

/** Horizontal magnitude bars. Single hue: length carries the value. */
function bars(data, o) {
  const mx = o.max || Math.max(...data.map(o.value));
  return '<div class="bars">' + data.map((d) => {
    const v = o.value(d), pct = Math.max(1.5, (v / mx) * 100);
    return '<div class="brow" data-tip="<b>' + esc(o.label(d)) + '</b><br>' + esc(o.tip ? o.tip(d) : o.fmt(v)) + '">'
      + '<span class="bl" title="' + esc(o.label(d)) + '">' + esc(o.label(d)) + '</span>'
      + '<div class="btrack"><div class="bfill' + (o.money ? ' money' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<span class="bv">' + o.fmt(v) + '</span></div>';
  }).join('') + '</div>';
}

function heatmap(hm) {
  const secs = hm.sectors, grps = hm.groups, cells = hm.cells;
  const mx = Math.max(...cells.flat());
  const bucket = (v) => !v ? 0 : Math.min(5, Math.max(1, Math.ceil(Math.sqrt(v / mx) * 5)));
  const cols = '150px repeat(' + secs.length + ',1fr)';
  let h = '<div class="hm"><div class="hmgrid" style="grid-template-columns:' + cols + '">';
  h += '<div class="hmcell lab"></div>' + secs.map((s) => '<div class="hmcell lab col">' + esc(short(s)) + '</div>').join('');
  grps.forEach((g, gi) => {
    h += '<div class="hmcell lab row" title="' + esc(g) + '">' + esc(g) + '</div>';
    secs.forEach((s, si) => {
      const v = cells[gi][si];
      h += '<div class="hmcell hm' + bucket(v) + '"' + (v ? ' data-v="1" data-tip="<b>' + esc(g) + '</b> in ' + esc(short(s)) + '<br>' + fmtN(v) + ' victims"' : '') + '></div>';
    });
  });
  return h + '</div></div>';
}

/** Area chart for one time series, with crosshair + tooltip. */
function area(data, id) {
  const W = 580, H = 180, pl = 6, pr = 6, pt = 12, pb = 24;
  const n = data.length, mx = Math.max(...data.map((d) => d.n));
  const X = (i) => pl + (i / (n - 1)) * (W - pl - pr);
  const Y = (v) => pt + (1 - v / mx) * (H - pt - pb);
  const pts = data.map((d, i) => [X(i), Y(d.n)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fill = line + ' L' + X(n - 1).toFixed(1) + ' ' + (H - pb) + ' L' + X(0).toFixed(1) + ' ' + (H - pb) + ' Z';
  const gridY = [0, 0.5, 1].map((t) => { const y = pt + t * (H - pt - pb); return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/>'; }).join('');
  const labs = data.map((d, i) => (i % 2 === 0 || i === n - 1) ? '<text class="axis" x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.year + '</text>' : '').join('');
  const dots = pts.map((p) => '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5"/>').join('');
  const hits = data.map((d, i) => '<rect x="' + (X(i) - (W / n / 2)) + '" y="0" width="' + (W / n) + '" height="' + H + '" fill="transparent" data-x="' + X(i).toFixed(1) + '" data-tip="<b>' + d.year + '</b><br>' + fmtN(d.n) + ' victims"></rect>').join('');
  return '<div class="area"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" id="' + id + '">'
    + '<g class="grid">' + gridY + '</g><path class="fill" d="' + fill + '"/><path class="stroke" d="' + line + '"/>' + dots
    + '<line class="cross" id="' + id + 'c" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" style="opacity:0"/>'
    + '<g class="axis">' + labs + '</g>' + hits + '</svg></div>';
}

function card(title, cap, body, wide) {
  return '<div class="chart' + (wide ? ' wide' : '') + '"><h3>' + title + '</h3><div class="cap">' + cap + '</div>' + body + '</div>';
}

  $('#inote').innerHTML = 'Sector, year, group and country charts come from the full <b>' + fmtN(I.total)
    + '</b>-victim leak-site scrape and measure <b>frequency</b>. The two money charts come from the '
    + '<b>107 researched incidents</b> and measure <b>severity</b> &mdash; blanks in that layer are undisclosed figures, not zeros, '
    + 'so these are the disclosed subset. Frequency is blue, money is red throughout.'
    + '<span id="livebadge"></span>';
}

/* Live mode: when served by scripts/server.js, replace the baked-in snapshot
   with fresh Atlas data. Opened as a plain file, this fetch fails and the
   snapshot stands — so the self-contained file keeps working either way. */
async function goLive() {
  try {
    const r = await fetch('api/insights', { cache: 'no-store' });
    if (!r.ok) return;
    const live = await r.json();
    if (!live || !live.total) return;
    I = live;
    renderInsights();
    const when = live.generated_at ? new Date(live.generated_at).toISOString().slice(0, 10) : '';
    const b = $('#livebadge');
    if (b) b.innerHTML = ' <span class="live">live from Atlas' + (when ? ' · ' + when : '') + '</span>';
  } catch (e) { /* offline / static file — keep snapshot */ }
}

/* ---------- wiring ---------- */
function delegate(sel, attr, fn) {
  const el = $(sel);
  el.addEventListener('click', (e) => { const c = e.target.closest('[' + attr + ']'); if (c) fn(c); });
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.closest('[' + attr + ']'); if (c) { e.preventDefault(); fn(c); }
  });
}
delegate('#inds', 'data-ind', (c) => showInd(c.dataset.ind));
delegate('#cats', 'data-cat', (c) => showCat((c.dataset.kind === 'h' ? D.hazards : D.exposures).find((x) => x.key === c.dataset.cat)));
delegate('#incs', 'data-inc', (c) => {
  const e = ALLINC[+c.dataset.inc];
  open('<div class="kicker">' + esc(e.ind) + '</div><h2>' + esc(e.v) + '</h2><p>' + esc(e.s) + '</p>' + inc(e));
});
$('#qi').addEventListener('input', (e) => renderInds(e.target.value));
$('#qc').addEventListener('input', (e) => renderCats(e.target.value));
$('#qn').addEventListener('input', (e) => renderIncs(e.target.value));

buildMatrix(); renderInds(); renderCats(); renderIncs(); renderInsights(); goLive();
</script>
</body>
</html>
