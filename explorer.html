m/news/powerschool-data-breach-school-extortion-attempts/747801/","https://www.the74million.org/article/powerschool-paid-off-hackers-after-huge-breach-now-theyre-extorting-districts/"]},{"v":"Instructure Holdings, Inc. (Canvas LMS)","g":"shinyhunters","d":"2026-05-01 (intrusion 29-30 April 2026; second breach within roughly two weeks)","c":"US","fin":"Not publicly disclosed. Institutional costs spanned incident response, forensic review, portal remediation after defacement, and notification across thousands of schools.","ran":"Ransom PAID by Instructure under an agreement reached 11 May 2026; the amount was not publicly disclosed. Attackers reportedly returned the data and supplied 'shred logs' as claimed proof of destruction - the same unverifiable deletion assurance seen in the PowerSchool case.","dt":"Instructure took Canvas, Canvas Beta and Canvas Test offline on 7 May 2026 for investigation and restored service the following day; Canvas Data 2 and Canvas Beta had been in maintenance since 1 May. The Free-For-Teacher account programme was permanently shut down as a remediation measure. Roughly 330 institutions additionally had to remediate defaced login portals.","di":"ShinyHunters claimed 3.6TB covering 275 million users across approximately 9,000 institutions (reporting also cites 8,809 universities, education ministries and other bodies) - figures Instructure has not confirmed. Instructure confirmed exposure of names, email addresses, student ID numbers and some private messages between Canvas users, and stated there was no evidence that passwords, financial data or SSNs were taken. Attacker leak-site copy claimed billions of private student-teacher and student-student messages.","s":"Described in reporting as the largest education-sector breach on record. ShinyHunters exploited Instructure's Free-For-Teacher (FFT) programme - which allowed educators to create Canvas accounts without institutional verification - to reach production data, then breached the platform a second time within about two weeks. After Instructure missed the initial 7 May negotiation deadline, the group escalated by defacing Canvas login portals at roughly 330 institutions and pivoting to direct school-by-school extortion with a final 12 May deadline. Instructure reached a payment agreement on 11 May, one day before the leak deadline. The incident is the purest example of LMS vendor concentration risk: Canvas is used by 41% of US higher education institutions, so a single platform intrusion simultaneously exposed thousands of otherwise unconnected insureds.","src":["https://www.bleepingcomputer.com/news/security/edu-tech-firm-instructure-discloses-cyber-incident-probes-impact/","https://thehackernews.com/2026/05/instructure-reaches-ransom-agreement.html","https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers","https://en.wikipedia.org/wiki/2026_Canvas_security_incident","https://www.halcyon.ai/ransomware-alerts/education-sector-in-the-crosshairs-shinyhunters-extortion-campaign-against-instructure","https://www.reedsmith.com/articles/canvasinstructure-cyberattack-key-developments-and-action-items-for-higher-education-institutions/"]},{"v":"University of Hawai'i Cancer Center","g":"noescape (per ransomware.live leak-site attribution; press reporting did not definitively confirm the group)","d":"2025-08-31 (discovered on or around 31 August 2025)","c":"US","fin":"Not publicly disclosed. Costs included ransom payment, third-party forensic and recovery support, and notification plus remediation for up to 1.15 million individuals.","ran":"Ransom PAID - the centre worked with third-party cybersecurity experts to obtain a decryption tool and paid to prevent publication of the stolen data. The amount was not publicly disclosed.","dt":"Encrypted data was recovered using a decryption tool obtained through the payment. Specific outage duration was not publicly disclosed. Notification lagged roughly four months behind discovery, with the centre compiling names and addresses for study participants well after the August 2025 intrusion.","di":"Up to 1.15 million individuals affected (some reporting cites approximately 1.2 million). Exposed data included Social Security numbers and driver's licence numbers sourced from the Hawai'i State Department of Transportation, and City and County of Honolulu voter registration records from 1998. Much of the affected population were research study participants rather than students or employees.","s":"A university research-archive breach that illustrates how higher education accumulates liability for populations who were never students or staff. Attackers reached data from the Multiethnic Cohort (MEC) Study, a longitudinal epidemiological study established in 1993, plus files from three other diet-and-cancer studies. Compounding the event, the university did not notify affected study participants for roughly four months - a delay that drew specific public criticism and independent regulatory risk. Notably, the university PAID to prevent publication, making this one of the few education cases with a confirmed payment decision.","src":["https://www.hipaajournal.com/university-of-hawaii-cancer-center-ransomware-data-breach/","https://therecord.media/university-of-hawaii-ransomware-data-breach","https://www.bleepingcomputer.com/news/security/university-of-hawaii-cancer-center-ransomware-attack-affects-nearly-12-million-people/","https://www.securityweek.com/hackers-accessed-university-of-hawaii-cancer-center-patient-data-they-werent-immediately-notified/","https://www.govinfosecurity.com/cancer-center-research-study-hack-affects-12m-a-30912"]},{"v":"Highline Public Schools","g":"Not publicly attributed (district confirmed ransomware; FBI engaged)","d":"2024-09-07 (discovered Saturday 7 September 2024)","c":"US","fin":"Not publicly disclosed. Costs included district-wide re-imaging of all student and staff devices, third-party forensic engagement, and three days of lost instruction across 34 schools.","ran":"Not publicly disclosed - the district declined to say how much was demanded, citing the ongoing investigation, and did not publicly confirm any payment.","dt":"All schools and activities closed for three days, from Monday 9 September through Wednesday 11 September 2024, reopening Thursday 12 September. Network systems remained disrupted into October 2024, when all student and staff devices had been re-imaged - roughly a month of degraded operation after classes resumed.","di":"The district confirmed that highly sensitive personal, financial and medical data was breached. The precise number of affected students and staff was not publicly disclosed in the reporting reviewed.","s":"The canonical K-12 operational-disruption case. Highline, a Washington state district of 34 schools serving roughly 17,500 students and 2,000 staff, detected the intrusion on a Saturday and immediately isolated critical systems - then closed every school and all activities for three days because core instructional and safety systems could not be trusted. It demonstrates the sector's defining characteristic for insurers: a school district has no degraded operating mode, so business interruption manifests as total closure of an essential public service, with statutory make-up obligations and knock-on effects to transport and meal programmes.","src":["https://www.bleepingcomputer.com/news/security/highline-public-schools-confirms-ransomware-attack-was-behind-september-shut-down/","https://therecord.media/highline-public-schools-washington-state-cyberattack","https://www.infosecurity-magazine.com/news/sensitive-data-highline-ransomware/","https://www.seattletimes.com/education-lab/hackers-target-seattle-area-school-district-for-ransomware-attack/","https://www.securitymagazine.com/articles/101037-cyberattack-compromises-and-shuts-down-highline-public-schools"]},{"v":"British Library","g":"rhysida","d":"2023-10-28 (attack late October 2023)","c":"GB","fin":"Approximately GBP 6-7 million in recovery costs, funded from roughly 40% of the library's financial reserves - about ten times the ransom demanded.","ran":"20 bitcoin demanded, approximately GBP 596,000 at the time. NOT PAID - the library refused, and Rhysida published the data.","dt":"Services were severely disrupted for months. The main catalogue returned online on 15 January 2024 in read-only format, roughly two and a half months after the attack, with other services expected to remain unavailable for months beyond that. Recovery was complicated by legacy infrastructure and constrained funding, documented in the library's own transparency reporting and subsequent academic analysis.","di":"Approximately 600GB of material leaked publicly after refusal to pay, including internal documents and staff and user data. Full affected-individual counts were not publicly itemised in the reporting reviewed.","s":"The UK's national library, described as one of the worst cyber incidents in British history. Rhysida rendered almost all VMware ESXi servers unavailable, taking down the website, on-site services and Wi-Fi; the library remained physically open but could accept only cash payments. The institution refused to pay and Rhysida published the stolen material. The case is the reference point for catastrophic recovery severity in a public, non-commercial education/research body: the recovery cost dwarfed the ransom demand by an order of magnitude, and the library had to consume roughly 40% of its financial reserves - a funding mechanism with no analogue in the commercial sector and a key consideration for public-institution insureds.","src":["https://en.wikipedia.org/wiki/British_Library_cyberattack","https://www.theregister.com/2023/10/31/british_library_it_outage/","https://www.securityweek.com/details-and-lessons-learned-from-the-ransomware-attack-on-the-british-library/","https://ital.corejournals.org/index.php/ital/article/view/17112","https://www.imd.org/ibyimd/technology/full-transparency-10-lessons-from-the-cyber-attack-on-the-british-library/"]},{"v":"University of Manchester","g":"Not publicly attributed to a named leak-site brand; triple-extortion tactics consistent with groups active against UK/US higher education in 2023","d":"2023-06-05 (intrusion began 5 June 2023; detected 9 June; containment from 14 June)","c":"GB","fin":"Not publicly disclosed.","ran":"Not publicly disclosed. No public confirmation of payment; the university worked with the ICO, NCSC and National Crime Agency.","dt":"Detected 9 June 2023 with containment beginning 14 June. Specific outage duration and full recovery timeline were not publicly disclosed; response ran in parallel with ICO and NCSC engagement.","di":"Around 250GB of data accessed. Included NHS records relating to 1.1 million patients across more than 200 hospitals, gathered for medical research - with NHS numbers and the first three letters of patients' postcodes among the fields, plus major-trauma and terrorist-attack victim treatment data. Separately, student and alumni data was leaked including names, contact details, gender, dates of birth, university ID numbers and fee status. Students and staff received direct threats to sell their data.","s":"The clearest illustration of research-data liability in higher education. Attackers reached a research archive holding NHS patient records gathered from more than 200 hospitals for medical research purposes - including major-trauma patient reports and treatment records for victims of terrorist attacks - alongside current student and alumni data. Attackers then emailed students and staff directly threatening to sell their data, a triple-extortion pressure tactic. The incident triggered questions in UK health and education policy about universities holding national-scale clinical datasets under research governance rather than clinical security controls.","src":["https://www.itpro.com/security/data-breaches/nhs-data-leak-raises-serious-questions-about-manchester-university-cyber-attack","https://www.digitalhealth.net/2023/06/nhs-patient-data-compromised-in-university-cyber-attack-report/","https://www.cpomagazine.com/cyber-security/250gb-of-nhs-patient-data-leaked-in-the-university-of-manchester-cyber-attack/","https://www.govinfosecurity.com/trauma-terrorist-victim-data-breached-in-university-attack-a-22409","https://www.csoonline.com/article/644235/nhs-data-reportedly-compromised-in-university-of-manchester-cyberattack.html"]},{"v":"Minneapolis Public Schools (Special School District No. 1)","g":"medusa","d":"2023-02-17 (encryption discovered 17 February 2023)","c":"US","fin":"Not publicly disclosed. Costs included forensic investigation, restoration from backups, and notification plus credit monitoring for 105,617 individuals.","ran":"$1,000,000 demanded by Medusa with a 17 March 2023 deadline; the leak site also offered a $50,000-per-day deadline extension and listed the data for outright purchase at $1 million. NOT PAID - the district restored from internal backups and Medusa published the stolen files.","dt":"Widespread digital disruption following the 17 February 2023 encryption event; the district recovered encrypted data from internal backups rather than paying. Precise system-restoration duration was not publicly disclosed. Notification took seven months, completing in September 2023.","di":"105,617 people notified as affected. Nearly 200,000 individual files containing sensitive student and educator information were released publicly, including student psychological and welfare records. Cybersecurity experts confirmed campus security maps and school security blueprints were among the leaked material - creating ongoing physical-safety risk to students.","s":"The reference case for extortion harm to minors and for notification failure. Medusa demanded $1 million with a 17 March deadline, posted the district on its leak site with a countdown, offered to sell the data to any buyer for $1 million, and offered the district the option to pay $50,000 per additional day of delay. The district refused and restored from internal backups - but Medusa then published the files. Analysts confirmed the leaked corpus included school security blueprints, a physical-safety exposure that cannot be remediated by notification or credit monitoring. The district publicly characterised the event as an 'encryption event' and did not notify the 105,617 affected individuals until September 2023, seven months later.","src":["https://www.the74million.org/article/kept-in-the-dark-inside-the-minneapolis-schools-cyberattack/","https://therecord.media/minneapolis-schools-say-data-breach-affected-100000","https://www.bleepingcomputer.com/news/security/ransomware-gang-posts-video-of-data-stolen-from-minneapolis-schools/","https://www.cbsnews.com/minnesota/news/cybersecurity-experts-confirm-security-blueprints-stolen-mps-ransomware-attack/","https://www.campussafetymagazine.com/news/over-189000-files-leaked-minneapolis-public-schools-data-breach/123369/","https://www.minnpost.com/other-nonprofit-media/2023/03/hackers-use-stolen-student-data-against-minneapolis-schools-in-brazen-new-threat/"]},{"v":"Los Angeles Unified School District (LAUSD)","g":"vicesociety","d":"2022-09-03 (attack 3 September 2022; leak-site posting 30 September 2022; data published 2 October 2022)","c":"US","fin":"Not publicly disclosed as a single figure. The district funded incident response, credit monitoring for affected individuals including contractors whose SSNs were exposed, and a subsequent security programme uplift.","ran":"Demand amount not publicly disclosed. NOT PAID - LAUSD publicly refused, stating public dollars are better spent on students than on criminals, and Vice Society published the data on its leak blog on 2 October 2022.","dt":"The attack disrupted district systems in early September 2022 at the start of the school year, though schools remained open. Threat actors had persistent access from 31 July to 3 September 2022 before detection - a dwell time of over a month. Full remediation timeline was not publicly disclosed.","di":"500GB of data stolen and published. The trove included student psychological assessments, health information including COVID-19 test data, and prior conviction reports. LAUSD separately confirmed that contractors' Social Security numbers were among the stolen data. Passport data and other sensitive identifiers were also reported as potentially included.","s":"The attack that made K-12 ransomware a national policy issue in the US. Vice Society - the group that dominated education targeting in this period, ranking fourth all-time in the Education dataset with 63 victims - dwelled in the network of the second-largest US school district for over a month, from 31 July to 3 September 2022. LAUSD publicly refused to pay on the principle that 'dollars must be used to fund students and education' and that paying never guarantees full recovery, following FBI guidance. Vice Society published the full 500GB trove in retaliation. The leaked data's contents - student psychological assessments, health and COVID-19 test data, and prior conviction reports - established the template for how education extortion inflicts harm on minors specifically.","src":["https://techcrunch.com/2022/10/03/los-angeles-school-district-ransomware-data/","https://www.bleepingcomputer.com/news/security/lausd-says-vice-society-ransomware-gang-stole-contractors-ssns/","https://www.axios.com/2022/10/03/hackers-stolen-data-la-school-district-ransomware","https://www.cybersecuritydive.com/news/vice-society-threatens-los-angeles-schools-ransomware/633076/","https://www.npr.org/2022/09/07/1121422336/a-cyberattack-hits-the-los-angeles-school-district-raising-alarm-across-the-coun","https://www.upguard.com/blog/how-did-lausd-get-hacked"]}],"stats":[{"m":"Median ransom PAID - lower education (K-12)","v":"$800,000 in 2025, down 88% from $6.60M in 2024","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Median ransom PAID - higher education","v":"$463,000 in 2025, down from $4.41M in 2024","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Median ransom DEMANDED - lower vs higher education","v":"Lower education $1.02M (down from $3.85M); higher education $697,000 (down from $3.55M)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Mean recovery cost excluding ransom - lower vs higher education","v":"Lower education $2.20M (down from $3.76M); higher education $0.90M (down from $4.02M) - higher education was the joint lowest of all industries surveyed","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Rate of data encryption in attacks","v":"Lower education 29% encrypted (67% stopped before encryption, up from 14%); higher education 58% encrypted (38% stopped before encryption, up from 21%)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Leading root cause of attack","v":"Higher education: exploited vulnerabilities, 35% of cases. Lower education: phishing, 22% of cases","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Recovery from backups (declining reliability)","v":"59% of encrypted-data cases in lower education (down from 75%); 47% in higher education (down from 78%). 97% of education providers with encrypted data eventually recovered it","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Speed of full recovery","v":"50% of lower education and 59% of higher education fully recovered within one week, up from 30% for both in 2024","s":"Sophos / Infosecurity Magazine coverage of State of Ransomware in Education 2025","u":"https://www.infosecurity-magazine.com/news/ransomware-payments-plummet/"},{"m":"Extortion-only attacks (exfiltration without encryption)","v":"Lower education 4% (up from 1%); higher education 3% (up from 2%)","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Organisational weaknesses cited","v":"Lower education: lack of expertise and limited incident-response capacity, 42% each. Higher education: unknown security gaps, 49% - the most commonly cited issue","s":"Sophos, The State of Ransomware in Education 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-education-2025"},{"m":"Global education ransomware attack volume (2025)","v":"251 attacks worldwide (94 confirmed by the victim, 157 unconfirmed); 130 in the US of which 50 confirmed; a 2% year-over-year increase, indicating a plateau after 2024","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Records breached in confirmed education attacks (2025)","v":"3,962,869 records, of which 3.89 million were in the US; over 241TB of data allegedly stolen across all attacks","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Average ransom demand in education (2025)","v":"$464,000 across all attacks (down 33% from $694,000 in 2024); $392,300 across confirmed attacks only; largest single demand $1.5M (Asia University, Taiwan)","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Most active groups claiming education victims (2025)","v":"Qilin 37 claimed attacks, SafePay 23, Fog and Interlock 18 each, INC Ransom 17; Interlock took credit for the most confirmed attacks (11)","s":"Comparitech, Education Ransomware Roundup 2025","u":"https://www.comparitech.com/news/education-ransomware-roundup-2025-stats-on-attacks-ransoms-and-data-breaches/"},{"m":"Average downtime per education ransomware incident","v":"10.7 days of system unavailability per attack, with 2023 the worst year at 12.6 days average; estimated cost of approximately $548,185 per day of downtime","s":"Comparitech, Ransomware attacks on US schools and colleges (2018 to mid-2024)","u":"https://www.comparitech.com/blog/information-security/school-ransomware-attacks/"},{"m":"Ransom demand distribution and payment gap (US schools/colleges)","v":"Demands ranged from $5,000 to $40M with an average of approximately $1.4M, while actual payments averaged approximately $169,000; 491 incidents affecting 8,054 institutions and over 6.7 million records over the study period","s":"Comparitech, Ransomware attacks on US schools and colleges (2018 to mid-2024)","u":"https://www.comparitech.com/blog/information-security/school-ransomware-attacks/"},{"m":"Average total cost of a data breach - education sector","v":"$3.8M, below the $4.44M global all-industry average; education was one of the few sectors where breach costs ROSE year over year against a global decline","s":"IBM, Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Ransomware presence in breaches (all sectors, for benchmarking)","v":"48% of analysed breaches in the 2026 DBIR, up from 44% in the 2025 edition (which was itself a 37% year-over-year rise)","s":"Verizon, 2026 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Top breach patterns in the Educational Services chapter","v":"Social engineering 42% and system intrusion 35% as leading patterns; stolen credentials were the top initial access vector across all sectors at 22% of breaches, with phishing starting 16%","s":"Verizon, Data Breach Investigations Report (Educational Services chapter)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Third-party and supply-chain involvement in breaches","v":"Third parties featured in 48% of breaches in the 2026 DBIR with supply-chain breaches up 60%; the 2025 edition had already recorded third-party involvement doubling to 30% from 15%","s":"Verizon, 2026 Data Breach Investigations Report / Campus Technology analysis","u":"https://campustechnology.com/articles/2026/01/22/ransomware-attacks-plateau-in-education-sector-while-third-party-risks-loom-large.aspx"},{"m":"Ransom payment rate (all sectors, for benchmarking)","v":"Fell to approximately 20% in Q4 2025 - a historic low - from 23% in Q3 2025","s":"Coveware by Veeam, quarterly ransomware reports 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average and median ransom payment (all sectors, for benchmarking)","v":"Q4 2025 average $591,988 and median $325,000; Q2 2025 peaked at an average of $1,130,070 with a $400,000 median before falling sharply in Q3","s":"Coveware by Veeam, quarterly ransomware reports 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Leak-site victim count, Education sector (primary dataset)","v":"1,296 named victims from 2016 to 20 July 2026 across 135 distinct groups and 78 countries; peak years 2023 (307) and 2025 (328), with 158 recorded in the first ~7 months of 2026","s":"ransomware.live API v2, /v2/sectorvictims/Education","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Geographic concentration of education leak-site victims","v":"US 519 of 947 records with a resolved country (54.8%); GB 66, FR 31, CA 30, BR 28, IN 23, DE 22, AU 21, IT 16. By region: Europe approximately 191, APAC 96, Latin America and Caribbean 59","s":"ransomware.live API v2, /v2/sectorvictims/Education (own analysis)","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Disclosure completeness in education leak-site records","v":"Press coverage on only 170 of 1,296 records (13%); an explicit ransom figure on 12 (0.9%); a data volume on 21 (1.6%); country absent on 349 (27%) - severely limiting incident-level loss modelling","s":"ransomware.live API v2, /v2/sectorvictims/Education (own analysis)","u":"https://api.ransomware.live/v2/sectorvictims/Education"},{"m":"Independent corroboration of group ranking (ransomwatch)","v":"507 education-matching posts of 16,072 total: 2021 (57), 2022 (105), 2023 (193), 2024 (112), 2025 (40, partial). Top groups lockbit3 58, vicesociety 50, pysa 39, rhysida 39, FOG 27 - consistent with ransomware.live. Dataset stale after 16 June 2025","s":"ransomwatch (joshhighet), posts.json","u":"https://raw.githubusercontent.com/joshhighet/ransomwatch/main/posts.json"}]},{"name":"Energy and Utilities","tag":"Energy","overview":"The Energy and Utilities sector (ransomware.live tag \"Energy,\" ~826 indexed victim records at time of research) spans oil & gas exploration/production, pipelines and midstream transport, refining, oilfield services, electric power generation/transmission/distribution, gas distribution, and water/wastewater utilities. It is a top-tier ransomware target because it blends two high-leverage traits: (1) it is critical national infrastructure where downtime has cascading physical, economic, and public-safety consequences, giving attackers extraordinary extortion leverage; and (2) it runs a large, aging, and often flat-networked mix of IT and operational technology (OT/ICS/SCADA). Even when malware only hits corporate IT, operators frequently shut down OT preemptively out of caution (as Colonial Pipeline and Conpet did), so IT-only intrusions still cause operational and physical-world disruption (fuel shortages, offline payment at fuel retail, halted shipment planning). Financially the sector is among the most expensive to recover: Sophos put mean recovery cost for energy/oil-gas/utilities at ~$3.12M (2024), IBM put average energy-sector breach cost at $4.83M, and the sector reports the highest ransom-payment propensity (61% pay) and lowest backup-restoration rate of any industry. Dominant groups observed against the sector include DarkSide/BlackCat(ALPHV) lineage, RansomHub, Qilin, Akira, DragonForce, LockBit, Everest, and Handala (hacktivist/geopolitical). Attacks cluster around stolen credentials/infostealers, VPN/remote-access and edge-device exploitation, and third-party/supply-chain footholds, with double- and triple-extortion (encryption + data theft + regulatory/press pressure) now standard.","distinct":"Roughly 826 indexed victims across oil and gas, pipelines, refining, power generation and transmission, and water/wastewater. Blends critical-national-infrastructure status, where downtime carries cascading physical, economic and public-safety consequence, with large, aged, geographically dispersed OT estates. Uniquely, the precautionary IT/OT shutdown is itself the loss event: operators halt physical operations defensively when IT is compromised, as Colonial Pipeline showed, so business interruption occurs even where OT is never touched. Heaviest regulatory overlay including CIRCIA and sector-specific mandates.","leverage":"Threat to physical operational continuity and public-safety consequence, giving attackers extraordinary leverage disproportionate to the data actually held.","tolerance":"Extremely low. Minutes to hours for grid, pipeline and water operations, where interruption is a public-safety and regulatory event, not merely a commercial one.","bulk":{"total":826,"years":{"2017":3,"2019":1,"2020":16,"2021":45,"2022":95,"2023":166,"2024":168,"2025":198,"2026":134},"groups":[["lockbit3",58],["qilin",51],["akira",44],["clop",40],["alphv",36],["play",35],["ransomhub",24],["hunters",22]],"countries":[["US",192],["CA",33],["DE",25],["ID",18],["GB",17],["IT",15]],"pressPct":4,"ransomPct":0},"incidents":[{"v":"Colonial Pipeline","g":"DarkSide","d":"2021-05-07","c":"USA","fin":"No single official total disclosed by the company; national gasoline price spiked to a 6+ year high (~$3.04/gal). Ransom of $4.4M paid (see below). Widespread regional economic disruption from fuel shortages.","ran":"$4.4M paid (75 bitcoin) within hours, overseen by the FBI. On June 7, 2021 the DOJ announced seizure/recovery of 63.7 BTC, then worth ~$2.3M (lower than paid amount due to BTC price drop).","dt":"All pipeline operations halted May 7; systems and operations returned to normal by May 15 (~6-day shutdown). Decryptor tool from DarkSide was slow, so recovery largely relied on Colonial's own restoration.","di":"Attackers exfiltrated roughly 100GB of data prior to encryption (double-extortion); primary impact was operational/physical rather than a large PII breach.","s":"The largest refined-fuels pipeline in the US (Houston to the Southeast) was hit by DarkSide ransomware on its IT systems. Colonial proactively halted ALL pipeline operations to contain the attack. The 6-day shutdown interrupted fuel distribution to 17 states, triggering panic-buying, fuel shortages, and the highest average US gasoline price in over six years (~$3.04/gal by May 18). It is the defining cyber-physical energy ransomware case and prompted new TSA pipeline security directives.","src":["https://en.wikipedia.org/wiki/Colonial_Pipeline_ransomware_attack","https://www.energy.gov/ceser/colonial-pipeline-cyber-incident","https://www.chainalysis.com/blog/darkside-colonial-pipeline-ransomware-seizure-case-study/","https://www.huntress.com/threat-library/ransomware/colonial-pipeline-ransomware"]},{"v":"Halliburton","g":"RansomHub","d":"2024-08-21","c":"USA","fin":"~$35M direct pretax cost reported in Q3 2024 results (filed late Oct 2024); ~$0.02 adjusted-EPS impact for the quarter from lost/delayed revenue during system unavailability.","ran":"Not publicly disclosed, Halliburton did not confirm whether a ransom was demanded, negotiated, or paid.","dt":"Precautionary shutdown of parts of IT infrastructure caused client-system disconnections and temporary inability to generate critical business documents; company described operational impact as limited and restored systems over subsequent weeks. Exact downtime not itemized.","di":"Data exfiltration confirmed; company stated information was taken from its systems. Specific record counts/data types not fully disclosed publicly.","s":"One of the world's largest oilfield-services companies detected unauthorized access to corporate IT on Aug 21, 2024 and precautionarily shut down certain applications, including production-planning and shipment-tracking systems used in customer delivery. RansomHub claimed the attack and listed the company on its leak site; Halliburton confirmed data was stolen. Disclosed via SEC Form 8-K (Aug 23) and 8-K/A.","src":["https://www.bleepingcomputer.com/news/security/halliburton-reports-35-million-loss-after-ransomware-attack/","https://www.bleepingcomputer.com/news/security/halliburton-cyberattack-linked-to-ransomhub-ransomware-gang/","https://www.bleepingcomputer.com/news/security/halliburton-confirms-data-stolen-in-recent-cyberattack/","https://www.cpomagazine.com/cyber-security/oil-giant-halliburton-lost-35-million-due-to-the-august-2024-ransomhub-ransomware-data-breach/"]},{"v":"Suncor Energy / Petro-Canada","g":"Not publicly attributed (undisclosed threat actor)","d":"2023-06-21","c":"Canada","fin":"Not publicly quantified as a single figure; disruption spanned 1,500+ retail sites over a weekend plus remediation costs (Suncor replaced employee laptops/computers as part of response).","ran":"Not publicly disclosed; Suncor characterized it as a 'cybersecurity incident' and did not confirm a ransom.","dt":"Payment-system disruptions began ~June 21 and were largely resolved over the following days; Suncor swapped out employee computers as a remediation measure, extending internal recovery activity.","di":"Unauthorized party accessed basic information of Petro-Points loyalty members; affected members and privacy regulators were notified. No large-scale financial-data theft publicly confirmed.","s":"A cybersecurity incident at Canadian integrated-energy giant Suncor disrupted its Petro-Canada retail subsidiary (1,500+ stations). Many stations went cash-only, unable to accept credit/debit or rewards; the Petro-Canada app, Petro-Points login, and car washes were unavailable at various sites. Illustrates downstream retail/payment-system exposure in vertically integrated energy firms.","src":["https://www.cbc.ca/news/business/petro-canada-suncor-cybersecurity-1.6888723","https://www.bleepingcomputer.com/news/security/suncor-energy-cyberattack-impacts-petro-canada-gas-stations/","https://www.cybersecuritydive.com/news/suncor-hackers-breached-petro-canada-customer-data/685365/","https://www.cbc.ca/news/canada/calgary/suncor-cybersecurity-incident-energy-sector-1.6898118"]},{"v":"Encevo Group (Creos & Enovos, Luxembourg)","g":"ALPHV / BlackCat","d":"2022-07-22","c":"Luxembourg","fin":"Not publicly disclosed as a dollar figure; operational impact limited to customer-portal outages (no supply interruption).","ran":"Ransom amount not publicly disclosed; ALPHV threatened to publish stolen data if unpaid.","dt":"Creos and Enovos customer portals were rendered non-operational following the July 22-23 intrusion; portals were restored over subsequent days/weeks while supply services remained running.","di":"ALPHV claimed exfiltration of 150GB+ across 180,000+ files, published on its leak site July 29, contracts, agreements, ID copies, invoices, and emails; analyses found 2,270+ files containing plaintext credentials/passwords and 100,000+ documents marked confidential.","s":"Luxembourg's main energy supplier/distribution group, network operator Creos and supplier Enovos, under parent Encevo, was hit overnight July 22-23, 2022 by ALPHV/BlackCat (the DarkSide/Colonial lineage rebrand). Customer portals of Creos and Enovos were knocked offline, though electricity and gas supply and breakdown services continued uninterrupted. Demonstrates data-exfil-led extortion against European grid infrastructure.","src":["https://www.utilitydive.com/news/encevo-creos-envovos-ransomware/628644/","https://www.cybersecuritydive.com/news/encevo-creos-envovos-ransomware/628604/","https://therecord.media/luxembourg-energy-companies-struggling-with-alleged-ransomware-attack-data-breach","https://securityaffairs.co/wordpress/133899/cyber-crime/alphv-blackcat-ransomware-creos-luxembourg.html"]},{"v":"Conpet","g":"Qilin","d":"2026-02-03","c":"Romania","fin":"Not publicly quantified; company emphasized transport operations were unaffected, limiting operational/financial disruption.","ran":"Not publicly disclosed.","dt":"Business IT systems were isolated in response; SCADA/telecom and pipeline transport operations remained operational throughout (no OT downtime reported). IT recovery/remediation ongoing after Feb 2026 disclosure.","di":"Qilin alleged exfiltration of ~1TB including financial records, personnel data, and passport scans, and published sample images; Conpet confirmed data was stolen.","s":"Romania's national oil-pipeline transport operator detected a cyberattack on Feb 3, 2026 affecting its business IT infrastructure. Crucially, OT systems, SCADA and telecommunications, stayed fully functional and pipeline transport continued. Qilin claimed the attack and alleged theft of ~1TB of data. Root cause was an infostealer on an IT administrator's personal device; with valid WSUS credentials attackers abused Conpet's own update infrastructure to push a malicious 'fake update' delivering Qilin ransomware.","src":["https://www.bleepingcomputer.com/news/security/romanias-oil-pipeline-operator-conpet-confirms-data-stolen-in-attack/","https://industrialcyber.co/mining-oil-gas/romanias-oil-pipeline-operator-conpet-targeted-in-cyberattack-as-qilin-alleges-1tb-data-breach/","https://therecord.media/romania-conpet-oil-pipeline-ransomware-attack","https://shieldworkz.com/blogs/how-a-side-hustle-paralyzed-romania%E2%80%99s-national-oil-pipeline"]},{"v":"Ecopetrol","g":"TheGentlemen","d":"2026-07-17","c":"Colombia","fin":"Not publicly disclosed at time of research.","ran":"Not publicly disclosed at time of research.","dt":"Not publicly disclosed at time of research.","di":"Claimed on ransomware.live leak-tracking; specifics of stolen data not independently confirmed at time of research.","s":"Ecopetrol, Colombia's state-controlled national oil company and one of Latin America's largest energy firms, was listed as a victim by the 'TheGentlemen' ransomware group on ransomware.live (attack date 2026-07-17). Included as a recent, geographically diverse, large-state-oil-company data point from the ransomware.live Energy sector feed. Detailed public reporting was not yet available at research time (July 19, 2026).","src":["https://www.ransomware.live/activity/Energy"]},{"v":"Newpark Resources, Inc.","g":"not publicly disclosed","d":"2024-10-29","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident caused disruptions and limitation of access to certain information systems, but manufacturing and field operations continued utilizing established downtime procedures.","di":"not publicly disclosed","s":"On October 29, 2024, Newpark Resources, Inc. detected a ransomware incident where an unauthorized third party accessed its internal information systems. The company activated its cybersecurity response plan and is investigating the incident with external advisors.","src":["https://www.sec.gov/Archives/edgar/data/71829/000007182924000111/nr-20241029.htm"]}],"stats":[{"m":"Mean cost to recover from a ransomware attack, energy, oil/gas & utilities","v":"$3.12M in 2024 (vs $3.17M in 2023)","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/press/press-releases/2024/07/median-recovery-costs-2-critical-infrastructure-sectors-energy-and"},{"m":"Median ransom payment, energy/oil-gas/utilities","v":"$2.5M (2024); of those paying, 48% paid the original demand, 27% paid more, 26% paid less","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Ransom-payment propensity vs backup restoration, energy sector","v":"61% paid the ransom to recover data; only 51% restored from backups, the lowest backup-use rate of any sector","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Share of computers impacted per attack, energy/oil-gas/utilities","v":"62% of machines affected on average, vs 49% cross-sector average","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Average total cost of a data breach, energy sector","v":"$4.83M (2024)","s":"IBM Cost of a Data Breach Report 2024","u":"https://www.ibm.com/reports/data-breach"},{"m":"Most common initial attack vector (all sectors, relevant to energy)","v":"Stolen/compromised credentials, 16% of breaches; longest to identify & contain (~10 months)","s":"IBM Cost of a Data Breach Report 2024","u":"https://newsroom.ibm.com/2024-07-30-ibm-report-escalating-data-breach-disruption-pushes-costs-to-new-highs"},{"m":"Ransomware attacks on industrial/OT organizations (incl. energy)","v":"1,693 attacks in 2024 (+87% YoY); groups targeting industrials rose to 80 (+60%). In 2025, 119 groups impacting ~3,300 organizations.","s":"Dragos 8th Annual OT Cybersecurity Year in Review (2024/2025)","u":"https://www.dragos.com/resources/press-release/dragos-reports-ot-ics-cyber-threats-escalate-amid-geopolitical-conflicts-and-increasing-ransomware-attacks"},{"m":"OT operational impact of ransomware (industrial sectors incl. energy)","v":"25% of observed OT ransomware cases involved a full OT-site shutdown; 75% caused some operational disruption","s":"Dragos OT Cybersecurity Year in Review","u":"https://www.dragos.com/blog/dragos-8th-annual-ot-cybersecurity-year-in-review-is-now-available"},{"m":"Confirmed ransomware attacks on global energy & utilities sector (2025)","v":"187 confirmed successful attacks in 2025 (per industry reporting aggregated in search); Cyfirma noted 72 victims, +64% over prior period","s":"Industry reporting (BlackFog / Cyfirma via Industrial Cyber), 2025","u":"https://industrialcyber.co/utilities-energy-power-water-waste/energy-and-utilities-cyber-threats-escalate-as-ransomware-and-apt-activity-rise-cyfirma-reports/"}]},{"name":"Finance and Insurance","tag":"Financial Services","overview":"Finance and insurance is one of the most consistently targeted industries in the ransomware threat landscape, combining three features attackers prize: high-value, tightly regulated data (PII, account/payment details, claims and underwriting data); low tolerance for downtime given real-time payment, trading, and claims obligations; and deep interdependency through vendors, fintech partners, and market infrastructure that lets a single compromise cascade well beyond one victim. Recent ransomware.live data (100 most-recent sector-tagged victims, spanning roughly April-July 2026) shows the sector being hit across the full spectrum of institution types - community banks and credit unions, insurers and brokers, wealth/asset managers, fintech and payments firms, and even a central bank - by a wide range of groups (Qilin, Everest, DragonForce, Akira, Everest, LockBit successors, Lapsus$, and newer entrants like Unsafe and Krybit), with double-extortion (encrypt-and-exfiltrate) now the dominant pattern. Notable historical and recent incidents illustrate two especially distinctive hazards for this industry versus others: (1) systemic/market-contagion risk, where ransomware against a market-infrastructure or processing vendor (ICBC, ION Group) disrupts trading and settlement across many unaffiliated institutions simultaneously, and (2) concentrated third-party/vendor risk, where a single shared vendor breach (Frost Bank/Citizens Bank's shared document-fulfillment vendor, Deutsche Bank's marketing-platform vendor, Evolve Bank & Trust's BaaS/fintech-partner network) exposes customers of multiple otherwise-unrelated financial brands at once. Authoritative industry reporting (Sophos, IBM, Coveware, Verizon DBIR) consistently ranks financial services among the highest-cost, highest-ransom-demand sectors, while regulatory regimes (GLBA, DORA, SEC disclosure rules) compress response timelines and add materially to breach cost relative to most other industries.","distinct":"Combines the highest-value regulated data with real-time payment, trading and claims obligations and dense interconnection through fintech partners and market infrastructure that permits contagion beyond the direct victim. Generally the most mature sector in controls, capital and recovery capability, which lowers payment likelihood while raising regulatory and systemic-risk scrutiny under GLBA and, for EU-touching entities, DORA.","leverage":"Exposure of customer PII/PFI, account and counterparty data, plus regulatory and market-confidence consequence. Availability leverage is real for payments and trading but blunted by mature redundancy.","tolerance":"Very low for transaction processing and settlement (minutes to hours); moderate for back-office and underwriting functions.","bulk":{"total":1643,"years":{"2017":3,"2019":3,"2020":16,"2021":92,"2022":156,"2023":329,"2024":311,"2025":475,"2026":258},"groups":[["qilin",128],["lockbit3",104],["akira",99],["clop",84],["alphv",55],["play",42],["SilentRansomGroup",42],["incransom",41]],"countries":[["US",569],["CA",62],["GB",61],["IN",37],["AU",24],["DE",20]],"pressPct":5,"ransomPct":0},"incidents":[{"v":"CNA Financial Corporation","g":"Evil Corp / Phoenix CryptoLocker","d":"March 2021 (attack); ransom paid ~May 2021","c":"United States","fin":"Reportedly paid $40 million in ransom - among the largest ransom payments publicly reported at the time. Full cost of remediation/legal/breach-notification beyond the ransom itself is not publicly disclosed in aggregate.","ran":"Attackers initially demanded $60 million; CNA paid approximately $40 million roughly two weeks after data theft began.","dt":"Multi-week disruption to remote access, corporate email, and phone systems; CNA stated it was able to recover encrypted/stolen data with no indication the exfiltrated data was viewed, retained, or shared further after payment.","di":"Corporate and some employee/customer data was copied/exfiltrated prior to encryption; CNA said no indication the data was subsequently misused, though the scope of records affected was not fully broken out publicly.","s":"One of the largest U.S. commercial insurers was hit by a new variant of Phoenix CryptoLocker (attributed to the Russia-linked Evil Corp syndicate). Attackers accessed systems from March 5-21, 2021, exfiltrating data before deploying ransomware and knocking core systems offline, including remote access, email, and phone systems.","src":["https://thehackernews.com/2021/05/insurance-firm-cna-financial-reportedly.html","https://www.bloomberg.com/news/articles/2021-05-20/cna-financial-paid-40-million-in-ransom-after-march-cyberattack","https://www.msspalert.com/cybersecurity-breaches-and-attacks/ransomware/cna-payment-40-million-dollars/","https://cisomag.com/suffered-attack-paid-ransom-restored-systems-the-cnas-ransomware-timeline/"]},{"v":"Industrial and Commercial Bank of China (ICBC) - U.S. broker-dealer/financial services unit","g":"LockBit 3.0","d":"November 8-9, 2023","c":"China / United States","fin":"Not a disclosed single dollar loss figure for ICBC itself, but market-wide impact was measurable: more than $62 billion of U.S. Treasurys reportedly failed to deliver on one day, and settlement of over $9 billion in Treasury-backed assets was disrupted.","ran":"No ransom amount publicly confirmed as demanded or paid by ICBC.","dt":"ICBC's unit lost access to corporate email and had to physically courier settlement details via USB stick to counterparties in Manhattan while systems were restored; disruption lasted several days before normal electronic settlement resumed.","di":"Data exfiltration/theft was claimed by LockBit but the specific volume/type of records taken was not comprehensively disclosed publicly.","s":"LockBit compromised ICBC's U.S. financial-services division (believed via Citrix NetScaler vulnerabilities CVE-2023-4966/4967), disrupting settlement of U.S. Treasury trades and repo financing at the world's largest bank by assets - a rare ransomware incident with visible, market-wide operational impact.","src":["https://www.bitdefender.com/en-us/blog/hotforsecurity/worlds-biggest-bank-hit-by-ransomware-forced-to-trade-via-usb-stick","https://www.resecurity.com/blog/article/icbc-ransomware-attack-strikes-at-the-heart-of-the-global-financial-order-lockbit-on-a-roll","https://home.treasury.gov/news/press-releases/jy2114","https://securityaffairs.com/155178/cyber-crime/lockbit-icbc-ransomware-attack.html"]},{"v":"Fidelity National Financial (FNF)","g":"ALPHV/BlackCat","d":"November 2023","c":"United States","fin":"Specific dollar cost of the incident (remediation, business interruption, legal) not publicly broken out by FNF; real estate closings nationwide were delayed for the outage period, an indirect economic impact not quantified publicly.","ran":"No official ransom figure disclosed by FNF; ALPHV's swift removal of FNF from its leak site is widely read by researchers as an indicator a payment was made, but this is inference, not confirmed disclosure.","dt":"Systems were offline for nearly a week, disrupting title/escrow closings for home buyers and real estate agents nationwide during that period.","di":"Data of approximately 1.3 million individuals was confirmed stolen and subject to breach notification.","s":"A Fortune 500 title-insurance and real-estate services provider (handles closings for a large share of U.S. home sales) had systems taken offline for about a week; ALPHV/BlackCat claimed the intrusion, and the gang's removal of FNF from its leak site is widely interpreted as a sign a ransom was paid.","src":["https://therecord.media/fidelity-national-financial-ransomware-alphv-black-cat","https://www.bleepingcomputer.com/news/security/fidelity-national-financial-hackers-stole-data-of-13-million-people/","https://www.theregister.com/2023/11/23/blackcat_ransomware_fnf/","https://www.malwarebytes.com/blog/news/2024/01/fidelity-national-financial-acknowledges-data-breach-affecting-1-3-million-customers"]},{"v":"ION Group / ION Cleared Derivatives","g":"LockBit","d":"January 31, 2023","c":"United Kingdom (global client base incl. U.S., Europe)","fin":"No public disclosure of direct financial loss to ION or its clients; the incident's significance was systemic/operational (derivatives clearing workflow disruption) rather than a disclosed dollar figure.","ran":"LockBit threatened to publish stolen data by February 4, 2023 if unpaid; no ransom amount or payment/non-payment was publicly confirmed by ION.","dt":"Affected servers were isolated and the incident contained to a specific environment; several days of manual/workaround trade processing for affected clients while remediation continued.","di":"LockBit claimed data was exfiltrated during the intrusion; scope/type of data was not comprehensively disclosed publicly by ION.","s":"A UK-based financial software vendor whose platforms underpin derivatives clearing/trading for major banks and brokers was hit by LockBit, forcing at least 42 clients - including major U.S. and European financial institutions - to fall back to manual trade processing for cleared derivatives.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-on-ion-group-impacts-derivatives-trading-market/","https://techcrunch.com/2023/02/02/ion-group-lockbit-derivatives-ransomware/","https://iongroup.com/press-release/markets/cleared-derivatives-cyber-event/","https://www.darkreading.com/cyberattacks-data-breaches/cyberattack-fintech-firm-disrupts-derivatives-trading"]},{"v":"Evolve Bank & Trust","g":"LockBit","d":"Intrusion February 2024; disclosed/data published June-July 2024","c":"United States","fin":"Specific dollar cost not publicly disclosed by Evolve; the company offered two years of free credit monitoring/identity protection to affected individuals, an ongoing cost not quantified publicly. Reputational/partner-relationship impact on its fintech clients was significant but not dollar-quantified.","ran":"Evolve confirmed it did NOT pay the ransom demand (amount not publicly disclosed), leading LockBit to publish the stolen data.","dt":"Attackers accessed and downloaded data from Evolve's databases/file shares over a window from February to May 2024 before the bank discovered the intrusion in May 2024; public notification did not begin until July 8, 2024.","di":"At least 7.6 million individuals' personal data affected, including names, Social Security numbers, bank account details, card PANs, wire/settlement files, in clear text; downstream fintech partners (Affirm, Mercury, Wise, and others) were also impacted.","s":"A U.S. banking-as-a-service (BaaS) bank whose infrastructure underpins numerous fintech apps (e.g., Affirm, Wise, Mercury) was breached after an employee clicked a malicious link; Evolve refused to pay, so LockBit published the stolen data, exposing both direct banking customers and downstream fintech partner customers - a clear third-party/supply-chain risk case for the sector.","src":["https://techcrunch.com/2024/07/09/evolve-bank-says-ransomware-gang-stole-personal-data-on-millions-of-customers/","https://www.theregister.com/2024/07/09/evolve_lockbit_attack/","https://www.infosecurity-magazine.com/news/cyber-attack-evolve-bank-exposed/","https://www.getevolved.com/cybersecurity-incident/"]},{"v":"Central Bank of Libya","g":"Qilin","d":"Disclosed June 9, 2026; Qilin claimed responsibility June 22, 2026","c":"Libya","fin":"Not publicly disclosed. The bank characterized the incident as affecting only a limited set of systems, with no reported disruption to national payment operations.","ran":"No ransom amount publicly disclosed or confirmed.","dt":"Bank stated the incident was 'fully contained' as of late June 2026, with recovery/system restoration ongoing per an internal plan; no extended public-facing outage reported.","di":"Qilin threatened to release confidential banking data but as of the incident's public reporting, the specific volume/type of data was not independently confirmed or publicly itemized.","s":"Libya's central bank disclosed a cyberattack affecting a limited number of systems/technical services; the Qilin ransomware-as-a-service operation later publicly claimed the breach and threatened to release confidential banking data, illustrating ransomware's expansion into national financial-infrastructure/central-bank targets.","src":["https://libyaherald.com/2026/06/cyber-incident-announced-on-9-june-has-been-fully-contained-cbl","https://www.dexpose.io/qilin-strikes-central-bank-of-libya-in-ransomware-assault/","https://www.centralbanking.com/central-banks/financial-stability/7976224/libya-says-cyber-security-incident-under-control","https://issa-eg.org/qilin-ransomware-group-claims-breach-of-central-bank-of-libya-following-confirmed-cyberattack/"]},{"v":"Frost Bank and Citizens Financial Group (Citizens Bank) - shared third-party vendor breach","g":"Everest","d":"April 16-20, 2026 (Everest claims posted)","c":"United States","fin":"Not publicly disclosed by either bank in dollar terms; both institutions face customer class-action lawsuits alleging inadequate safeguarding of data via the vendor relationship, with litigation costs not yet quantified publicly.","ran":"No ransom amount publicly disclosed; Everest gave a six-day deadline before threatening to publish the full data dump.","dt":"Both banks stated their own core systems were not directly breached (the incident occurred in the third-party vendor's environment); no extended outage of banking services was reported.","di":"Everest claimed roughly 250,000 Frost Bank client records (Social Security numbers, tax IDs, names, mortgage rates, investment/income data, home addresses) and additional Citizens Bank records, with combined exposure reported by researchers at up to approximately 3.65 million records across both institutions.","s":"The Everest ransomware gang claimed breaches of two unrelated major U.S. banks, Frost Bank (San Antonio) and Citizens Financial Group, tracing back to a single shared third-party vendor that handled statement printing (for Citizens) and tax-document fulfillment (for Frost) - a textbook example of concentrated third-party/vendor risk in the financial sector, since one vendor compromise exposed customers of multiple unrelated institutions.","src":["https://cybernews.com/security/everest-ransomware-frost-citizens-bank-breach/","https://www.dexpose.io/everest-ransomware-attack-targets-frost-bank/","https://www.americanbanker.com/news/customers-sue-citizens-frost-over-third-party-data-breach","https://slingscore.com/everest-ransomware-gang-hits-frost-bank-and-citizens-bank-via-third-party-vendor-exposing-up-to-3-65-million-records/","https://schneiderdowns.com/our-thoughts-on/third-party-cyber-risk-in-banking-everest-ransomware-claims/"]},{"v":"Deutsche Bank (via third-party marketing/incentive platform vendor)","g":"Unsafe","d":"Claimed on leak site July 4, 2026","c":"Germany","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"No disruption to core Deutsche Bank banking services reported; investigation of the third-party provider's environment was ongoing at time of disclosure.","di":"Group claimed employee email addresses, password hashes, and physical mailing addresses among the exposed records; scope limited to data held within the third-party marketing/incentive platform rather than core customer banking data, per Deutsche Bank's statement.","s":"The 'Unsafe' ransomware-as-a-service group added Deutsche Bank to its leak site, posting screenshots purporting to show database exports (employee emails, password hashes, mailing addresses). Deutsche Bank clarified the actual incident occurred at an external German service provider operating a marketing/incentive platform for the bank's sales partners, not within Deutsche Bank's own core banking environment - another illustration of third-party/vendor exposure at a major global bank.","src":["https://cybernews.com/security/deutsche-bank-ransomware-data-breach/","https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach","https://compliancehub.wiki/deutsche-bank-unsafe-ransomware-third-party-breach-dora-2026/","https://techchannel.news/unsafe-ransomware-group-claims-deutsche-bank-breach/"]},{"v":"SEI Investments Company","g":"not publicly disclosed","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"SEI Investments Company reported a ransomware attack on a third-party vendor. The company has issued a forward-looking statement regarding the potential impacts of this incident.","src":["https://www.sec.gov/Archives/edgar/data/350894/000035089423000088/seic-20231026.htm"]},{"v":"River Financial Corporation","g":"not publicly disclosed","d":"2026-06-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Certain operations have been impacted, but River is working with external cybersecurity professionals to fully restore these operations.","di":"not publicly disclosed","s":"On June 16, 2026, an unauthorized threat actor gained access to River Financial Corporation's network and deployed ransomware. The company identified the incident on June 19, 2026, and is currently investigating the scope and impact of the breach with the help of a third-party forensic firm.","src":["https://www.sec.gov/Archives/edgar/data/1641601/000119312526282946/ck0001641601-20260619.htm"]},{"v":"Navient Corporation","g":"not publicly disclosed","d":"2026-06-08","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"borrower information including customer names, date of birth, addresses, and Social Security numbers","s":"On June 8, 2026, Navient Corporation was informed of a ransomware attack affecting a third-party law firm that provides services to the company. The attack resulted in unauthorized access to sensitive borrower information maintained by the law firm. The company has initiated an investigation and is notifying affected individuals and regulators as required.","src":["https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm"]},{"v":"Prudential Financial, Inc.","g":"alphv","d":"2024-02-05","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"limited data including some client information and personally identifiable information, Company administrative and user data, and a small percentage of Company user accounts associated with employees and contractors","s":"On February 5, 2024, Prudential Financial, Inc. detected unauthorized access to its systems by a threat actor starting February 4, 2024. The investigation revealed that the threat actor accessed and exfiltrated limited client information and Company data, but no evidence of malware or ransomware was found, and the incident has not materially impacted operations.","src":["https://www.sec.gov/Archives/edgar/data/1137774/000119312524040749/d766318d8ka.htm"]},{"v":"Globe Life Inc.","g":"not publicly disclosed","d":"2024-10-17","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not applicable","di":"Approximately 5,000 individuals affected; includes names, email addresses, phone numbers, postal addresses, Social Security numbers, health-related data, and other policy information.","s":"Globe Life Inc. received communications from an unknown threat actor attempting to extort money in exchange for not disclosing certain customer information. The company activated its incident response plan and is cooperating with federal law enforcement while investigating the claims made by the threat actor.","src":["https://www.sec.gov/Archives/edgar/data/320335/000032033524000056/gl-20241017.htm"]}],"stats":[{"m":"Median ransom demand, financial services sector (2025)","v":"$3,000,000 (highest of any industry surveyed)","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Median ransom payment, financial services sector (2025)","v":"$2,100,000","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Average cost to fully recover from a ransomware attack, financial services (2025)","v":"$1.74 million (down from $2.58 million in 2024)","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Root cause cited as 'security gaps / lack of adequate protection', financial services respondents (2025)","v":"66-67%","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Average total cost of a data breach, financial services sector (2025)","v":"$5.56 million (2nd highest of 17 industries, behind healthcare; 25% above global average; down from $6.08M in 2024)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average cost of a data breach, all industries (2025)","v":"$4.44 million (US companies averaged $10.22 million)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Breach lifecycle detection & escalation share of cost, financial services vs. global","v":"~34% in financial services vs. ~29% global average, driven by compressed regulator-notification timelines","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Highest median ransom payment by sector, full-year 2025","v":"Financial services sector had the highest median ransom payments among sectors tracked, at $2.0 million","s":"Coveware Quarterly Ransomware Reports (2025 series)","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Overall ransom payment rate (all sectors), Q4 2025","v":"~20% (a historic low)","s":"Coveware Quarterly Ransomware Report, Q4 2025","u":"https://www.coveware.com/blog/2025/10/24/insider-threats-loom-while-ransom-payment-rates-plummet"},{"m":"Average / median ransom payment (all sectors), Q4 2025","v":"Average $591,988 (up 57% QoQ); median $325,000 (up 132% QoQ)","s":"Coveware Quarterly Ransomware Report, Q4 2025","u":"https://www.coveware.com/blog/2025/10/24/insider-threats-loom-while-ransom-payment-rates-plummet"},{"m":"Confirmed breaches involving ransomware, all industries (2024 data)","v":"44% of confirmed breaches involved ransomware, up from 32% the year before","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Financial and Insurance sector incidents/breaches (VERIS industry classification, 2024 data)","v":"3,336 incidents and 927 confirmed breaches","s":"Verizon 2025 DBIR, Finance Snapshot","u":"https://www.verizon.com/business/resources/infographics/2025-dbir-finance-snapshot.pdf"},{"m":"Median ransom payment, all industries (2024 data)","v":"$115,000, down from $150,000 in 2023","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Organizations refusing to pay ransom, all industries (2024)","v":"64%, up from 50% in 2022","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Ransomware victims prior credentials exposed in infostealer logs (all industries, 2024 data)","v":"54%","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"}]},{"name":"Healthcare and Social Assistance","tag":"Healthcare","overview":"Healthcare and Social Assistance is one of the most heavily targeted sectors in the ransomware ecosystem, driven by a combination of low tolerance for downtime (patient safety), high-value PHI, fragmented and legacy IT/OT environments, and a long tail of small, under-resourced providers (clinics, home health agencies, billing firms) alongside a handful of giant, deeply interconnected health systems and claims processors. Ransomware.live's \"Healthcare\" sector tag currently lists 2,443 posted victims spanning 2015-2026 (dataset pulled 2026-07-19/20), with the pace of incidents accelerating sharply since 2020 (34 in 2020 vs. 627 in 2025 and 387 already in the first ~6.5 months of 2026). The threat-actor landscape is fragmented across 206 distinct named groups in the dataset, with Qilin (178), LockBit3 (143), Inc Ransom (128), BianLian (92), RansomHub (81), Clop (72), ALPHV/BlackCat (68), Everest (63) and Medusa (63) the most prolific against this sector. Geographically the US dominates (1,092 recorded victims), followed by the UK (58), Australia (58), Canada (57), India (56), Germany (55), France (47) and Brazil (45), reflecting both the concentration of large private health systems in the US and the global reach of double-extortion groups. Industry-wide cost data consistently shows healthcare as the single costliest sector for data breaches (IBM: ~$7.4M average per breach in 2025, down from ~$9.8M in 2024 but still #1 of all industries for the 14th consecutive year), even as 2025 ransom demands and payments in healthcare specifically have fallen sharply (Sophos/Coveware both report demands down roughly 90% from 2024's average and healthcare among the least likely sectors to pay). The single largest loss event on record for the sector by far is the February 2024 Change Healthcare/UnitedHealth Group attack, whose total company-reported impact reached roughly $2.9 billion for fiscal year 2024 alone, disrupting an estimated one-third of all US patient medical records and claims processing nationwide via a critical, deeply embedded third-party clearinghouse, illustrating the sector's acute concentration/third-party-dependency risk.","distinct":"2,443 posted victims with sharply accelerating pace. The only sector where both extortion levers are simultaneously severe: PHI carries the most punitive and mechanically triggered regulatory regime (HIPAA breach notification, OCR investigation, near-automatic class-action follow-on), while downtime is a patient-safety event producing ambulance diversion and delayed treatment. Fragmented estates, unpatchable connected medical devices, and a long tail of small under-resourced providers sit alongside a few giant claims processors whose compromise cascades industry-wide.","leverage":"Dual: patient-safety-driven urgency to restore clinical operations, plus PHI publication carrying regulatory penalty and litigation exposure.","tolerance":"Lowest of any sector. Hours for clinical and emergency systems, where outage translates directly into patient harm rather than financial loss alone.","bulk":{"total":2444,"years":{"2015":2,"2016":2,"2017":2,"2018":4,"2019":3,"2020":34,"2021":106,"2022":206,"2023":443,"2024":627,"2025":627,"2026":388},"groups":[["qilin",178],["lockbit3",143],["incransom",128],["bianlian",92],["ransomhub",81],["clop",72],["alphv",68],["everest",63]],"countries":[["US",1092],["GB",58],["AU",58],["CA",57],["IN",56],["DE",55]],"pressPct":9,"ransomPct":1},"incidents":[{"v":"Change Healthcare (subsidiary of UnitedHealth Group/Optum)","g":"ALPHV/BlackCat (initial encryption/exfiltration); RansomHub (subsequent extortion/data listing after an alleged 'exit scam' by ALPHV affiliates)","d":"Attack began February 21, 2024; disclosed February 2024; extortion/data-listing activity continued into April 2024","c":"United States","fin":"UnitedHealth Group's total reported cyberattack impact reached approximately $2.9 billion for fiscal year 2024 (direct response costs plus business disruption); an initial Q1 2024 estimate of $0.74/share grew through the year to a full-year estimate of $1.90-$2.05/share. UnitedHealth also advanced more than $9 billion in interim/interest-free funding to affected providers by Q2 2024 to offset cash-flow disruption across the industry.","ran":"UnitedHealth confirmed paying a ransom reported by multiple outlets at roughly $22 million in bitcoin to the ALPHV/BlackCat affiliate; a second group (RansomHub) subsequently claimed to still hold the stolen data and re-extorted the company.","dt":"Core clearinghouse and pharmacy/claims systems were down for multiple weeks beginning February 21, 2024, with a phased, multi-month restoration of full transaction volumes through spring 2024.","di":"UnitedHealth later disclosed the breach affected the personal/health information of approximately 190 million individuals (one of the largest healthcare data breaches ever reported to HHS), including medical records, billing/claims data, SSNs, and insurance information.","s":"The largest and most disruptive healthcare ransomware incident on record. Attackers used compromised credentials to access a Citrix portal lacking multi-factor authentication, then deployed ransomware against Change Healthcare, the dominant US claims clearinghouse processing roughly one-third of all patient records and ~15 billion transactions annually. The outage froze prescription processing, insurance eligibility checks, and provider payments nationwide for weeks.","src":["https://www.sec.gov/Archives/edgar/data/731766/000073176624000146/a2024q1exhibit991.htm","https://www.sec.gov/Archives/edgar/data/731766/000073176624000242/a2024q2exhibit991.htm","https://www.bankinfosecurity.com/change-healthcare-attack-cost-estimate-reaches-nearly-29b-a-26541","https://prowritersins.com/cyber-insurance-blog/united-healthcare-ransomware-payment/","https://hyperproof.io/resource/understanding-the-change-healthcare-breach/"]},{"v":"Universal Health Services (UHS), ~400 US hospitals/care sites","g":"Ryuk","d":"September 27, 2020","c":"United States","fin":"UHS reported approximately $67 million in total pre-tax losses tied to the attack (lost operating income, reduced patient activity, billing-delay reserves, and recovery costs), and stated it expected to recover most of this through cyber insurance.","ran":"UHS did not pay a ransom and recovered from backups; no confirmed ransom amount was publicly reported.","dt":"EHR and other core IT applications were down across all ~400 UHS care sites for roughly three weeks before full restoration.","di":"No large-scale confirmed public data leak was widely reported for this incident (Ryuk at the time was primarily an encryption-only/non-exfiltration operation); primary impact was operational/clinical disruption rather than a mass PHI leak.","s":"One of the earliest large-scale hospital-system ransomware attacks; Ryuk encrypted IT systems across UHS's national network, forcing staff onto paper documentation, diverting ambulances, and suspending IT applications company-wide.","src":["https://www.bleepingcomputer.com/news/security/universal-health-services-lost-67-million-due-to-ryuk-ransomware-attack/","https://www.cybersecuritydive.com/news/uhs-ryuk-ransomware-damage-cost/595946/","https://www.techtarget.com/healthtechsecurity/news/366595382/UHS-Ransomware-Attack-Cost-67M-in-Lost-Revenue-Recovery-Efforts","https://www.hipaajournal.com/universal-health-services-ransomware-attack-cost/"]},{"v":"Health Service Executive (HSE), Ireland's national public health system","g":"Conti","d":"May 14, 2021","c":"Ireland","fin":"Estimates for recovery costs varied widely across reporting: the HSE's director general cited a June 2021 estimate exceeding $600 million; other analyses put full recovery cost at roughly $100 million, and yet other reporting cited about $83 million; figures differ by scope (pure IT rebuild vs. total health-system impact) and are not fully reconciled in public reporting.","ran":"Conti demanded $19,999,000; the HSE refused to pay and instead worked with Ireland's National Cyber Security Centre; a free decryptor was later released by the attackers.","dt":"National IT systems were shut down immediately upon detection; full recovery across the health system took approximately four months.","di":"Patient data was exfiltrated and reportedly used to attempt individual extortion of patients; Ireland's HSE has since (as of reporting around 2025) offered approximately EUR750 in compensation to affected individuals whose personal data was compromised.","s":"A nationwide ransomware attack that forced Ireland's entire public health IT infrastructure offline, disrupting hospital appointments, cancer treatment scheduling, radiology, and COVID-19 vaccine registration systems across the country. Conti later provided a free decryptor under international pressure but retained and later leveraged stolen patient data.","src":["https://krebsonsecurity.com/2021/12/inside-irelands-public-healthcare-ransomware-scare/","https://www.bankinfosecurity.com/irish-ransomware-attack-recovery-cost-estimate-600-million-a-16931","https://www.cpomagazine.com/cyber-security/irish-healthcare-system-requires-more-than-100-million-to-recover-from-the-conti-ransomware-attack/","https://www.controleng.com/throwback-attack/ireland-ransomware-attack-costs-hse-83-million/","https://www.bitdefender.com/en-us/blog/hotforsecurity/four-years-later-irish-health-service-offers-eu750-to-victims-of-ransomware-attack","https://www.hhs.gov/sites/default/files/lessons-learned-hse-attack.pdf"]},{"v":"CommonSpirit Health, ~140+ hospitals across ~13 US states","g":"Unattributed publicly at the time (not clearly listed under a named leak-site group in available tracking)","d":"Initial access September 16, 2022; ransomware detected/disclosed October 2-3, 2022","c":"United States","fin":"CommonSpirit initially estimated the cost at approximately $150 million, later revising the total to approximately $160 million (business interruption, remediation, and related expenses) as reported in 2023 disclosures.","ran":"Not publicly disclosed.","dt":"Multi-week system outages beginning October 2022 affecting more than 100-160+ facilities; precise full-recovery date not specified in public reporting.","di":"Personal data of more than 623,700 patients was reported exposed; the breach affected over 150 facilities and led to two class-action lawsuits.","s":"One of the largest US nonprofit hospital operators was forced to take systems offline across more than 100 facilities in at least 13 states, delaying access to EHRs and disrupting patient care, following network compromise weeks before the ransomware deployment was detected.","src":["https://www.cshub.com/attacks/news/commonspirit-health-reports-that-ransomware-attack-cost-160-million","https://www.hipaajournal.com/commonspirit-health-increases-ransomware-attack-cost-estimate-to-160-million/","https://www.healthcare-brew.com/stories/2023/05/25/commonspirit-reports-usd160-million-loss-from-last-year-s-ransomware-attack","https://www.beckershospitalreview.com/healthcare-information-technology/cybersecurity/the-commonspirit-ransomware-attack-1-year-later/"]},{"v":"Lehigh Valley Health Network (LVHN)","g":"ALPHV/BlackCat","d":"Detected February 6, 2023","c":"United States","fin":"LVHN agreed to a $65 million class-action settlement (finalized November 2024), one of the largest healthcare ransomware-related settlements on record; of this, $52 million was earmarked for patients whose nude treatment images were published.","ran":"LVHN refused to pay the ransom; the specific dollar amount demanded was not publicly disclosed.","dt":"Specific system-downtime duration not publicly detailed in available reporting; the affected system was a specific practice's oncology imaging network rather than network-wide LVHN infrastructure.","di":"More than 134,000 patients were affected/eligible for settlement compensation; leaked data included sensitive treatment photographs and other PHI published on BlackCat's leak site.","s":"Attackers compromised a network supporting a Lackawanna County physician practice, including a radiation-oncology imaging system, and, after LVHN refused to pay, published highly sensitive clinical photos of breast cancer patients (nude from the waist up) to pressure payment, an unusually aggressive harassment-based extortion tactic.","src":["https://www.hipaajournal.com/lehigh-valley-health-network-blackcat-settlement/","https://therecord.media/lehigh-valley-health-network-data-breach-settlement","https://www.fiercehealthcare.com/providers/lehigh-valley-health-network-agrees-65m-settlement-over-ransomware-attack
