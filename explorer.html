emediation, legal fees, and security investment (not counting potential lost revenue)."},{"victim":"Sopra Steria","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":48000000,"raw":"Company estimated the negative impact on gross operating margin at between EUR40 million and EUR50 million (roughly $48M-$60M), of which approximately EUR30 million was expected to be covered by cyber insurance."}],"ransom":[{"victim":"Cencora","industry":"Healthcare and Social Assistance","usd":75000000,"raw":"$75 million"},{"victim":"Kaseya (VSA platform)","industry":"Information Technology","usd":70000000,"raw":"REvil demanded a single universal-decryptor payment of $70 million in Bitcoin. Kaseya states it did NOT pay the ransom; it obtained a universal decryptor from a 'trusted third party' (later reported as provided via the FBI)."},{"victim":"TSMC (Taiwan Semiconductor Manufacturing Company)","industry":"Information Technology","usd":70000000,"raw":"$70 million"},{"victim":"Taiwan Semiconductor Manufacturing Company (TSMC)","industry":"Manufacturing","usd":70000000,"raw":"$70 million"},{"victim":"CNA Financial Corporation","industry":"Finance and Insurance","usd":60000000,"raw":"Attackers initially demanded $60 million; CNA paid approximately $40 million roughly two weeks after data theft began."},{"victim":"Pendragon Group","industry":"Retail Trade and Consumer Services","usd":60000000,"raw":"$60 million"},{"victim":"Intrado","industry":"Telecommunications","usd":60000000,"raw":"$60 million"},{"victim":"McKesson","industry":"Healthcare and Social Assistance","usd":55236150,"raw":"$55,236,150"},{"victim":"Walmart","industry":"Retail Trade and Consumer Services","usd":55000000,"raw":"$55 million"},{"victim":"Johnson Controls International","industry":"Manufacturing","usd":51000000,"raw":"$51 million"},{"victim":"Quanta Computer (Apple supplier)","industry":"Information Technology","usd":50000000,"raw":"REvil demanded $50 million, reportedly escalating toward $100M; the ransom was not paid by Quanta (and REvil eventually removed the leaked files). No confirmed payment."},{"victim":"Continental AG","industry":"Manufacturing","usd":50000000,"raw":"LockBit publicly listed the stolen data for sale at $50 million on November 9, 2022, reduced to $40 million by November 29, 2022; negotiation transcripts published by LockBit show discussions beginning September 23, 2022, but Continental has stated it aborted contact with the group rather than paying."},{"victim":"Accenture","industry":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","usd":50000000,"raw":"LockBit demanded $50 million; Accenture has not confirmed paying any ransom."},{"victim":"Foxconn (CTBG MX plant, Ciudad Juárez)","industry":"Manufacturing","usd":34000000,"raw":"DoppelPaymer demanded 1,804.0955 BTC, reported at the time as approximately $34 million (some sources cite ~$32.97 million); Foxconn did not pay, and stolen data was later published on the dark web."},{"victim":"Caesars Entertainment","industry":"Accommodation, Food Services, Arts and Entertainment","usd":30000000,"raw":"Attackers initially demanded $30 million; Caesars paid approximately $15 million in cryptocurrency. The FBI later tracked and froze a portion of the payment as it moved through crypto exchanges."}]},"global":[{"m":"Total on-chain ransomware payments, 2025","v":"Approximately $820 million, the lowest full-year total since 2021 and an 8% decline from 2024's revised $892 million. Chainalysis notes the figure may approach or exceed $900 million as further incidents are attributed.","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median on-chain ransom payment, 2025","v":"$59,556, up 368% from $12,738 in 2024","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Share of ransom demands paid, 2025","v":"Potentially an all-time low of approximately 28%","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Claimed victims posted to leak sites, 2025","v":"7,874 globally, a 50% year-over-year increase and the most active year on record. The United States remains the most heavily targeted country, followed by Canada, Germany and the UK. US targeting of critical infrastructure, supply chain/logistics and government rose 45-56% year over year.","s":"Chainalysis 2026 Crypto Crime Report (citing eCrime.ch data)","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median ransom payment, 2026","v":"$769,000, down from $1 million the prior year","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Median ransom demand, 2026","v":"$698,000, down 65% over two years","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Average recovery cost excluding ransom, 2026","v":"$1.7 million per incident, up 11% year over year (2025 figure was $1.53 million, itself down 44% from $2.73 million in 2024)","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Ransom payment rate among encrypted victims, 2026","v":"48% paid, the second-lowest rate on record after 2023 (46%); four-year average payment rate is 50%. Among those paying, 51% negotiated below the initial demand.","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Attack encryption success rate, 2026","v":"56% of attacks succeeded in encrypting data, up from 50% the prior year but below the 75% peak in 2023","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Identity-based attack origin, 2026","v":"79% of ransomware attacks started with an identity-based approach. Root causes: malicious email 26%, phishing 24%, compromised credentials 23%, exploited vulnerabilities 18%, brute-force 6%.","s":"Sophos State of Ransomware 2026","u":"https://www.sophos.com/en-us/blog/sophos-state-of-ransomware-2026"},{"m":"Recovery speed, 2025","v":"53% of victims recovered within one week, up from 35% in 2024","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average and median ransom payment, Q4 2025","v":"Average $591,988; median $325,000. Quarterly averages were volatile across 2025, moving from $1.13 million (Q2) to $376,941 (Q3) to $591,988 (Q4); the mean-median gap reflects a small number of multi-million-dollar settlements.","s":"Coveware Quarterly Report, Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Ransom payment rate, Q4 2025","v":"Approximately 20%, a historic low (23% in Q3 2025)","s":"Coveware Quarterly Report, Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Ransomware share of all data breaches, 2025","v":"Present in 44% of breaches, up from 32% the prior year","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Median ransom paid and non-payment rate, 2025","v":"Median payment $115,000, down from $150,000; 64% of victim organizations did not pay, up from 50% two years earlier","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"SMB versus large-organization ransomware exposure, 2025","v":"Ransomware was a component of 88% of SMB breaches versus 39% of breaches at large organizations","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Average cost of an extortion or ransomware incident, 2025","v":"$5.08 million, against a global all-cause data breach average of $4.44 million (down 9% from $4.88 million in 2024). US average breach cost rose 9% to an all-time high of $10.22 million.","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Breach identification and containment time, 2025","v":"241 days on average to identify and contain a breach, a nine-year low. 63% of organizations refused to pay ransom demands, up from 59%.","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"}],"comparison":"Ransomware is often discussed as a single peril, but the underwriting reality across these fourteen industries is that the peril's shape changes with what the victim cannot afford to lose. The clearest dividing line is between uptime-driven extortion leverage and data-sensitivity-driven leverage. In manufacturing, energy and utilities, transportation and warehousing, and agriculture/food production, the attacker's leverage is the clock. A stopped production line, an idled pipeline scheduling system, a freight dispatch outage, or a cold-chain failure converts directly into per-hour revenue loss, spoilage, or contractual penalty, and the loss accrues whether or not any data is ever published. Manufacturing has been the single most-targeted sector for five consecutive years through 2025 (4,434 leak-site postings on the ransomware.live Manufacturing tag) precisely because this pressure reliably shortens the decision cycle toward payment. Energy (~826 indexed victims) adds cascading physical and public-safety consequence on top of revenue loss, and agriculture/food adds perishability: a processor cannot bank a week of downtime because the inventory itself degrades. In these sectors the ransom demand is effectively priced against business-interruption cost, and the IT/OT boundary is the critical underwriting question, because segmentation failure is what turns an IT encryption event into a physical production halt. Against that sits data-sensitivity-driven leverage, which dominates healthcare, finance and insurance, education, and the professional-services group. Here the threat is publication, regulatory consequence, and downstream liability rather than lost output per hour. Healthcare is the hybrid worst case and the reason it consistently prices worst: it carries both severe data sensitivity (PHI, 2,443 posted victims) and a genuine safety-driven uptime constraint, since diverted ambulances and delayed oncology treatment are patient-harm events, not inconvenience. Finance carries acute data sensitivity plus real-time settlement obligations, but generally has the maturity, redundancy, and capital to recover without paying. Education and the professional-services group are closer to pure data-leverage plays: a law firm's privileged client files or a university's student records create liability and reputational damage on publication, but a two-week outage, while painful, is rarely existential. The 1,295 education victim records show the classic data-extortion signature, dominated by LockBit3 (114), Qilin (73), INC Ransom (72), Vice Society (63) and Rhysida (57), with Vice Society's and Rhysida's prominence reflecting deliberate specialization in schools and universities as soft, data-rich, under-defended targets. Regulatory exposure differs enough to change loss composition, not merely loss size. HIPAA gives healthcare the most punitive and most mechanically triggered regime: breach notification thresholds, OCR investigation, and near-automatic class-action follow-on mean that third-party liability and regulatory defense frequently exceed first-party restoration cost. Finance faces GLBA and, for EU-touching entities, DORA, which shifts the burden upstream into operational-resilience testing, ICT third-party register maintenance, and rapid incident reporting, a compliance-failure exposure that exists independent of whether an attack succeeds. Education sits under FERPA, which is substantively strict but historically weak on financial penalty, so education's regulatory tail is thinner than healthcare's even at comparable data sensitivity; the real education tail is state student-privacy statutes and litigation. Critical-infrastructure sectors, energy, transportation, water, manufacturing, food, are increasingly shaped by CIRCIA reporting obligations, which compress disclosure timelines and raise the cost of an unprepared incident-response function. Public administration adds political and public-records exposure that has no private-sector analogue: the incident becomes a governance event, with disclosure often mandatory and negotiation frequently prohibited by policy. Downtime tolerance and ability to pay interact in ways that matter for expected severity. Healthcare, energy, transportation and food production have the lowest tolerance measured in hours; retail and hospitality tolerate hours-to-days but suffer disproportionately in peak season, where a POS outage over a holiday weekend or a casino floor outage during a major event compresses an entire quarter's margin; construction, education and much of professional services tolerate days-to-weeks, since project schedules and academic calendars absorb slippage. Ability to pay cuts across this and often inverts it. Corporate victims in finance, IT, telecom and large manufacturing can fund both ransom and rapid restoration. Public administration and education frequently cannot: budgets are appropriated, not discretionary, ransom payment may be legally or politically foreclosed, and the practical consequence is longer outages, deeper reliance on insurance and public funds, and greater restoration cost even where the ransom itself is never paid. This is why public-sector and education severity should not be underwritten off ransom-demand size, the loss migrates into extended business interruption, forensic and rebuild cost, and notification expense. Small organizations across every sector show the same asymmetry: Verizon's 2025 DBIR found ransomware present in 88% of SMB breaches versus 39% at large organizations, and Sophos's 2026 data shows only 34% of 100-250 employee firms stopped attacks before encryption versus 46% at 3,001-5,000 employees. Finally, third-party and supply-chain concentration varies enormously and is the dominant driver of correlated, portfolio-level loss. Information technology is the extreme case: MSPs, SaaS platforms, managed file-transfer products and distributors sit upstream of thousands of customers, and Kaseya, MOVEit, CDK Global and Ingram Micro each demonstrated that one intrusion produces simultaneous outages across an entire book. Telecommunications is structurally similar, carriers are single points of failure for downstream connectivity, and its 357 tracked victims with sharp 2025-2026 acceleration (124 in 2025, 62 in the first seven months of 2026) suggest attackers have recognized this. Manufacturing and transportation carry tiered supplier concentration where a single Tier-2 supplier outage idles multiple OEMs, producing contingent business interruption that the direct victim's own policy never captures. Healthcare concentrates through claims clearinghouses and billing intermediaries, finance through fintech partners and market infrastructure, retail through shared dealer-management and CRM platforms, and agriculture through a small number of processors and cooperatives controlling large shares of throughput. Construction and hospitality, by contrast, are comparatively fragmented, losses there are more numerous but far less correlated. For a cyber portfolio, this distinction matters more than raw frequency: fragmented sectors generate attritional loss, concentrated sectors generate the accumulation event that threatens solvency.","takeaways":["Frequency and severity are decoupling, and pricing must follow both curves separately. Leak-site victims hit a record 7,874 in 2025, up 50%, while total on-chain ransom payments fell 8% to roughly $820 million and payment rates hit historic lows, approximately 28% per Chainalysis, around 20% in Coveware's Q4 2025 book, 48% of encrypted victims per Sophos. More insureds are being hit and fewer are paying, so portfolio loss is migrating out of ransom reimbursement and into business interruption, restoration and liability. Sophos's average recovery cost rose 11% to $1.7 million in 2026 even as median payments fell to $769,000.","Underwrite the extortion lever, not the sector label. Uptime-leveraged sectors (manufacturing, energy, transportation, agriculture/food) generate BI-dominated loss where the IT/OT segmentation question and documented manual-fallback procedures are the decisive controls. Data-leveraged sectors (healthcare, finance, education, professional services) generate liability-dominated loss where data minimization, retention discipline and encryption-at-rest matter more than recovery speed. Healthcare is the only sector where both levers are simultaneously severe, which is why it prices worst.","Identity is now the control that matters most. Sophos found 79% of 2026 attacks began with an identity-based approach, with compromised credentials (23%) rivaling malicious email (26%) and phishing (24%) as root cause. Phishing-resistant MFA on all remote access and privileged accounts, help-desk identity-verification procedures resistant to voice social engineering, and tiered Active Directory administration should be treated as baseline binding requirements rather than credits.","Backup existence is not backup resilience, and the distinction is now the primary determinant of severity. Attackers routinely destroy backups, snapshots, hypervisor volumes and Active Directory before detonation. Require evidence of immutable or air-gapped backups, tested full-environment restoration within a stated RTO, and AD forest recovery capability. Sophos found 53% of victims recovered within a week in 2025 versus 35% the prior year, that gap is where severity is won or lost.","Exfiltration-only extortion defeats the backup-based recovery story entirely. A rising share of incidents involve no encryption, so an insured with excellent restoration capability can still face full notification, regulatory and litigation cost. Data-liability limits should be underwritten independently of business-interruption limits, and questions about data inventory, retention schedules and volume of retained personal records should carry real weight.","Third-party and supply-chain concentration is the accumulation exposure that threatens portfolio solvency, and it differs by an order of magnitude across sectors. Information technology and telecommunications are structurally concentrated, Kaseya, MOVEit, CDK Global and Ingram Micro each turned one intrusion into thousands of simultaneous claims. Manufacturing, transportation, healthcare claims processing and agriculture concentrate through tiered suppliers and intermediaries; construction and hospitality are comparatively fragmented and produce attritional rather than correlated loss. Map shared platform dependencies across the book, not just insured-by-insured controls, and consider explicit aggregation limits for shared SaaS and MSP platforms.","Ability to pay is inversely related to severity in the public sector and education, which inverts the usual intuition. Where appropriated budgets, policy or politics foreclose ransom payment, loss does not disappear, it lengthens into extended interruption, forensic rebuild and notification cost. Do not underwrite these segments off ransom-demand size, and expect longer claim durations and higher restoration expense than the demand would suggest.","Small insureds carry disproportionate ransomware exposure across every sector. Verizon's 2025 DBIR found ransomware in 88% of SMB breaches versus 39% at large organizations, and Sophos found only 34% of 100-250 employee firms stopped attacks before encryption versus 46% at 3,001-5,000 employees. SME cyber books need materially different control expectations and pricing assumptions than mid-market, and control credits validated at enterprise scale should not be extended downmarket unexamined.","Regulatory regime drives loss composition, not just loss size, and should shape limit structure. HIPAA produces the deepest liability tail; GLBA and DORA create compliance-failure exposure independent of attack success and demand evidence of resilience testing and ICT third-party registers; CIRCIA compresses disclosure timelines for critical-infrastructure insureds, raising the cost of an unprepared IR function; FERPA is strict but financially weak, leaving education's real tail in state statutes and litigation. Pre-arranged breach counsel and IR retainers measurably reduce this component."],"highest":["Manufacturing, highest frequency. The single most-targeted sector for five consecutive years through 2025, with 4,434 leak-site postings, the largest count in the dataset. Severity is driven by production-halt business interruption priced per hour, and aggregation risk arrives through tiered supplier concentration where one Tier-2 outage idles multiple OEMs.","Healthcare and Social Assistance, highest severity. 2,443 posted victims with accelerating pace, and uniquely both extortion levers at maximum: patient-safety downtime intolerance measured in hours plus the most punitive regulatory regime (HIPAA notification, OCR enforcement, near-automatic class actions). Loss composition skews heavily toward third-party liability and regulatory defense, and IBM's 2025 data places extortion-incident cost at $5.08 million on average before healthcare's sector premium.","Information Technology, highest systemic/accumulation risk. Second most-targeted industry and the one most capable of producing a single correlated loss across an entire portfolio. Kaseya, MOVEit, CDK Global and Ingram Micro each converted one intrusion into thousands of simultaneous downstream victims. Chainalysis records US supply-chain and logistics targeting up 45-56% year over year, indicating attackers are deliberately pursuing this multiplier.","Public Administration (Government), high frequency with structurally extended severity. Chronically under-funded legacy estates and vast citizen PII holdings, combined with a constrained payment decision: where payment is politically or legally foreclosed, loss migrates into prolonged interruption, forensic rebuild and notification cost. Outage durations run longer than in any comparably targeted private sector.","Energy and Utilities, highest consequence severity. Roughly 826 indexed victims, but severity is disproportionate to frequency because the precautionary IT/OT shutdown is itself the loss event, as Colonial Pipeline demonstrated: business interruption occurs even where control systems are never touched. Downtime carries cascading physical, public-safety and regulatory consequence under CIRCIA and sector mandates.","Transportation and Warehousing, highest tail risk relative to revenue. The only sector with both the costliest recorded cyber loss (Maersk/NotPetya, roughly $300 million) and a documented ransomware-caused insolvency (KNP Logistics, roughly 730 jobs). Thin operating margins mean an outage survivable elsewhere becomes terminal here, making this the clearest sector for total-loss rather than partial-loss outcomes.","Educational Services, high and sharply rising frequency with weak recovery capacity. 1,295 tracked victims on a sustained upward trajectory, targeted by groups (Vice Society, Rhysida) that specialize in the sector precisely because it is soft and data-rich. Minors' data raises notification sensitivity while appropriated budgets constrain both prevention and recovery, so incidents resolve slowly and expensively even at modest ransom demands."]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ND = /^(not (publicly )?(disclosed|reported|available|known)|unknown|undisclosed|n\/a)/i;
const fmt = (v) => !v ? '<span class="nd">not recorded</span>' : (ND.test(v) ? '<span class="nd">' + esc(v) + '</span>' : esc(v));
const num = (n) => n.toLocaleString('en-US');

$('#metrics').innerHTML = [
  [num(D.meta.bulkTotal), 'victims scraped'],
  [D.meta.incidents, 'researched'],
  [D.meta.hazards, 'hazards'],
  [D.meta.exposures, 'exposures'],
  [num(D.meta.subcats), 'subcategories'],
].map(([b, s]) => '<div class="metric"><b>' + b + '</b><span>' + s + '</span></div>').join('');

/* tabs */
const TABS = [['matrix','Matrix'],['insights','Insights'],['freq','Frequency'],['ind','Industries'],['cat','Categories'],['inc','Incidents'],['syn','Cross-industry']]
  .filter(([id]) => id !== 'freq' || D.freq);   // hide Frequency until the pipeline has run
$('#nav').innerHTML = TABS.map(([id,t],i) =>
  '<button role="tab" data-t="'+id+'" aria-selected="'+(i===0)+'">'+t+'</button>').join('');
$('#nav').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  document.querySelectorAll('#nav button').forEach((x) => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p' + '-' + b.dataset.t));
});

/* ---------- drawer ---------- */
const drawer = $('#drawer'), scrim = $('#scrim');
let lastFocus = null;
function open(html) {
  lastFocus = document.activeElement;
  $('#dbody').innerHTML = html;
  drawer.classList.add('on'); scrim.classList.add('on');
  drawer.setAttribute('aria-hidden', 'false');
  drawer.scrollTop = 0; $('#closeBtn').focus();
}
function close() {
  drawer.classList.remove('on'); scrim.classList.remove('on');
  drawer.setAttribute('aria-hidden', 'true');
  if (lastFocus) lastFocus.focus();
}
$('#closeBtn').onclick = close; scrim.onclick = close;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer.classList.contains('on')) close(); });

/* ---------- matrix ---------- */
const INDS = D.industries.map((i) => i.name);
const short = (n) => n.replace(/ and .*/, '').replace(/,.*/, '').slice(0, 22);
let MODE = 'fam';
/** Collapse categories into families: a family is "present" in an industry if
 *  any of its member categories is. Keeps member categories for the drawer. */
function byFamily(list) {
  const m = new Map();
  for (const c of list) {
    if (!m.has(c.fam)) m.set(c.fam, { key: 'fam:' + c.fam, name: c.fam, fam: c.fam, desc: '', inds: {}, members: [] });
    const f = m.get(c.fam);
    f.members.push(c);
    for (const i of Object.keys(c.inds)) {
      if (!f.inds[i]) f.inds[i] = { raw: [], subs: [] };
      f.inds[i].raw.push(c.inds[i].raw);
      f.inds[i].subs.push(...c.inds[i].subs);
    }
  }
  return [...m.values()].sort((a, b) => Object.keys(b.inds).length - Object.keys(a.inds).length);
}

function buildMatrix() {
  const rows = [];
  const section = (list, kind) => {
    rows.push('<tr class="famrow"><th colspan="' + (INDS.length + 2) + '" style="color:var(--' + (kind === 'h' ? 'hazard' : 'exposure') + ')!important;letter-spacing:.04em;text-transform:uppercase">'
      + (kind === 'h' ? 'Hazards' : 'Exposures') + ' · ' + list.length + '</th></tr>');
    for (const c of list) {
      const n = Object.keys(c.inds).length;
      rows.push('<tr><th title="' + esc(c.name) + (c.members ? ', ' + c.members.length + ' reported labels' : '') + '">' + esc(c.name)
        + (c.members && c.members.length > 1 ? ' <span style="color:var(--faint);font-weight:400">(' + c.members.length + ')</span>' : '')
        + '</th><td class="reach">' + n + '/' + INDS.length + '</td>'
        + INDS.map((i) => {
            const on = !!c.inds[i];
            return '<td>' + (on
              ? '<button class="cell ' + kind + '" data-c="' + esc(c.key) + '" data-k="' + kind + '" data-i="' + esc(i) + '" title="' + esc(i + ': ' + c.name) + '" aria-label="' + esc(i + ', ' + c.name) + '"></button>'
              : '<span class="cell off" aria-hidden="true"></span>') + '</td>';
          }).join('') + '</tr>');
    }
  };
  // Families are applied to HAZARDS ONLY, deliberately.
  //
  // Hazards are mechanisms — a handful of them, reworded per industry, so
  // grouping reveals the shared structure. Exposures are assets — EHR systems,
  // SCADA, student information systems — and their specificity IS the content.
  // Grouping them produced an "Other" bucket of 38 unrelated entries, which
  // told us nothing. So exposures always show as reported.
  const H = MODE === 'fam' ? byFamily(D.hazards) : D.hazards;
  const E = D.exposures;
  CUR = { h: H, e: E };
  const head = '<thead><tr><th>' + (MODE === 'fam' ? 'Hazard family / exposure' : 'Category as reported') + '</th><th class="reach">Reach</th>'
    + INDS.map((i) => '<th class="rot"><div>' + esc(short(i)) + '</div></th>').join('') + '</tr></thead>';
  $('#matrix').innerHTML = head + '<tbody>' + (section(H, 'h'), section(E, 'e'), rows.join('')) + '</tbody>';

  const uniq = E.filter((c) => Object.keys(c.inds).length === 1).length;
  $('#mnote').innerHTML = MODE === 'fam'
    ? '<b>Hazards</b> are grouped into families, because industries reported the same mechanism under different wordings. “Insider and Credential Risk” and '
      + '“Insider Identity and Privileged Access Risk” are one family. Grouped, five hazard families reach <b>every industry</b>. '
      + '<b>Exposures are left as reported</b> on purpose: they are assets, not mechanisms, and their specificity is the content, and grouping them just produced a meaningless “Other” bucket. '
      + '<b>' + uniq + ' of ' + E.length + '</b> exposures appear in only one industry. '
      + 'That asymmetry is the finding. <em>How</em> you get attacked is nearly universal, <em>what you stand to lose</em> is almost entirely industry-specific.'
    : 'Hazard labels exactly as each industry’s research reported them. The long tail of 1/14 rows is mostly wording variation rather than genuinely unique risk. '
      + 'which is why “By family” compares industries better. Click any cell for that industry’s specifics.';
}
let CUR = { h: [], e: [] };
$('#bFam').onclick = () => { MODE = 'fam'; $('#bFam').setAttribute('aria-pressed', 'true'); $('#bRaw').setAttribute('aria-pressed', 'false'); buildMatrix(); };
$('#bRaw').onclick = () => { MODE = 'raw'; $('#bRaw').setAttribute('aria-pressed', 'true'); $('#bFam').setAttribute('aria-pressed', 'false'); buildMatrix(); };
$('#matrix').addEventListener('click', (e) => {
  const b = e.target.closest('.cell[data-c]'); if (!b) return;
  const list = b.dataset.k === 'h' ? CUR.h : CUR.e;
  showCat(list.find((c) => c.key === b.dataset.c), b.dataset.i, b.dataset.k);
});

/* ---------- category detail ---------- */
function showCat(c, focusInd, kindHint) {
  if (!c) return;
  const kind = (kindHint ? kindHint === 'h' : D.hazards.includes(c)) ? 'Hazard' : 'Exposure';
  const names = Object.keys(c.inds);
  const ordered = focusInd ? [focusInd, ...names.filter((n) => n !== focusInd)] : names;
  const isFam = !!c.members;
  open('<div class="kicker">' + kind + (isFam ? ' family' : '') + ' · present in ' + names.length + ' of ' + INDS.length + ' industries</div>'
    + '<h2>' + esc(c.name) + '</h2>'
    + (c.desc ? '<p>' + esc(c.desc) + '</p>' : '')
    + (isFam && c.members.length > 1
        ? '<h4>Reported under ' + c.members.length + ' labels</h4><p>'
          + c.members.map((m) => '<span class="tag">' + esc(m.name) + '</span>').join('') + '</p>'
        : '')
    + ordered.map((n) => {
        const v = c.inds[n];
        const raws = Array.isArray(v.raw) ? [...new Set(v.raw)] : [v.raw];
        return '<h4>' + esc(n) + (n === focusInd ? ' (selected)' : '') + '</h4>'
          + (isFam ? '<p style="font-size:12px;margin-bottom:5px">' + raws.map((r) => esc(r)).join(' · ') + '</p>' : '')
          + '<ul>' + v.subs.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>';
      }).join(''));
}

    + '<h4>Exposures (' + ex.length + ')</h4><p>' + ex.map((c) => '<span class="tag e">' + esc(c.name) + '</span>').join('') + '</p>'

const tt = $('#tt');

function tipMove(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + tt.offsetWidth + 8 > innerWidth) x = e.clientX - tt.offsetWidth - pad;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function wireTips(root) {
  root.querySelectorAll('[data-tip]').forEach((el) => {
    el.addEventListener('mouseenter', () => { tt.innerHTML = el.dataset.tip; tt.classList.add('on'); });
    el.addEventListener('mousemove', tipMove);
    el.addEventListener('mouseleave', () => tt.classList.remove('on'));
  });
}

/** Horizontal magnitude bars. Single hue: length carries the value. */
function bars(data, o) {
  const mx = o.max || Math.max(...data.map(o.value));
  return '<div class="bars">' + data.map((d) => {
    const v = o.value(d), pct = Math.max(1.5, (v / mx) * 100);
    return '<div class="brow" data-tip="<b>' + esc(o.label(d)) + '</b><br>' + esc(o.tip ? o.tip(d) : o.fmt(v)) + '">'
      + '<span class="bl" title="' + esc(o.label(d)) + '">' + esc(o.label(d)) + '</span>'
      + '<div class="btrack"><div class="bfill' + (o.money ? ' money' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<span class="bv">' + o.fmt(v) + '</span></div>';
  }).join('') + '</div>';
}

function heatmap(hm) {
  const secs = hm.sectors, grps = hm.groups, cells = hm.cells;
  const mx = Math.max(...cells.flat());
  const bucket = (v) => !v ? 0 : Math.min(5, Math.max(1, Math.ceil(Math.sqrt(v / mx) * 5)));
  const cols = '150px repeat(' + secs.length + ',1fr)';
  let h = '<div class="hm"><div class="hmgrid" style="grid-template-columns:' + cols + '">';
  h += '<div class="hmcell lab"></div>' + secs.map((s) => '<div class="hmcell lab col">' + esc(short(s)) + '</div>').join('');
  grps.forEach((g, gi) => {
    h += '<div class="hmcell lab row" title="' + esc(g) + '">' + esc(g) + '</div>';
    secs.forEach((s, si) => {
      const v = cells[gi][si];
      h += '<div class="hmcell hm' + bucket(v) + '"' + (v ? ' data-v="1" data-tip="<b>' + esc(g) + '</b> in ' + esc(short(s)) + '<br>' + fmtN(v) + ' victims"' : '') + '></div>';
    });
  });
  return h + '</div></div>';
}

/** Area chart for one time series, with crosshair + tooltip. */
function area(data, id) {
  const W = 580, H = 180, pl = 6, pr = 6, pt = 12, pb = 24;
  const n = data.length, mx = Math.max(...data.map((d) => d.n));
  const X = (i) => pl + (i / (n - 1)) * (W - pl - pr);
  const Y = (v) => pt + (1 - v / mx) * (H - pt - pb);
  const pts = data.map((d, i) => [X(i), Y(d.n)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fill = line + ' L' + X(n - 1).toFixed(1) + ' ' + (H - pb) + ' L' + X(0).toFixed(1) + ' ' + (H - pb) + ' Z';
  const gridY = [0, 0.5, 1].map((t) => { const y = pt + t * (H - pt - pb); return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/>'; }).join('');
  const labs = data.map((d, i) => (i % 2 === 0 || i === n - 1) ? '<text class="axis" x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.year + '</text>' : '').join('');
  const dots = pts.map((p) => '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5"/>').join('');
  const hits = data.map((d, i) => '<rect x="' + (X(i) - (W / n / 2)) + '" y="0" width="' + (W / n) + '" height="' + H + '" fill="transparent" data-x="' + X(i).toFixed(1) + '" data-tip="<b>' + d.year + '</b><br>' + fmtN(d.n) + ' victims"></rect>').join('');
  return '<div class="area"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" id="' + id + '">'
    + '<g class="grid">' + gridY + '</g><path class="fill" d="' + fill + '"/><path class="stroke" d="' + line + '"/>' + dots
    + '<line class="cross" id="' + id + 'c" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" style="opacity:0"/>'
    + '<g class="axis">' + labs + '</g>' + hits + '</svg></div>';
}

function card(title, cap, body, wide) {
  return '<div class="chart' + (wide ? ' wide' : '') + '"><h3>' + title + '</h3><div class="cap">' + cap + '</div>' + body + '</div>';
}

/* ---------- Frequency ----------
   The one tab that reports a RATE rather than a count. Everything else in this
   explorer is a numerator; here each number is divided by how many firms exist,
   so "Manufacturing is hit a lot" becomes "a manufacturer carries N times the
   risk of a restaurant". Bars are deliberately plain: length is the only encoding. */
function renderFreq() {
  const F = D.freq;
  if (!F) return;
  const pct = (v) => (v * 100).toFixed(1) + '%';
  const per10k = (v) => (v == null ? 'n/a' : v.toFixed(v < 10 ? 2 : 1));

  $('#ftiles').innerHTML = [
    [F.allRate + '%', 'per firm, per year (central)'],
    [F.spread + '×', 'spread, highest to lowest sector'],
    [fmtN(F.allObs), 'US victims in ' + F.year],
    [fmtN(F.allFirms), 'firms in the denominator'],
    [F.R.central + '×', 'under-reporting multiplier'],
    ['b = ' + F.size.elasticity_b.toFixed(2), 'size elasticity (R² ' + F.size.weighted_r2.toFixed(2) + ')'],
  ].map(([b, s]) => '<div class="tile"><b>' + b + '</b><span>' + s + '</span></div>').join('');

  const ch = [];

  /* --- the headline table ------------------------------------------------- */
  ch.push(card('Attack rate by industry',
    'Expected victims per <b>10,000 firms per year</b>, ' + F.year + ', US. '
    + '<b>Observed</b> counts confirmed-US leak-site listings only and is the defensible floor; '
    + '<b>central</b> additionally corrects for country gaps and under-reporting. '
    + 'The low–high band is the under-reporting scenario range, not a confidence interval.',
    '<div class="mwrap"><table class="freqt"><thead><tr>'
    + '<th>Industry</th><th class="r">Victims</th><th class="r">Firms</th>'
    + '<th class="r">obs/10k</th><th class="r">central/10k</th><th class="r">low–high</th>'
    + '<th class="r">R</th><th>Crosswalk</th></tr></thead><tbody>'
    + F.industries.map((d) =>
        '<tr data-tip="<b>' + esc(d.name) + '</b><br>' + esc(d.tag)
        + '<br>denominator unit: ' + esc(d.unit)
        + '<br>observed count 95% Poisson CI: ' + (d.ci ? d.ci.join('–') : 'n/a')
        + (d.regimes.length ? '<br>regimes: ' + esc(d.regimes.join(', ')) : '') + '">'
        + '<td>' + esc(d.tag) + (d.sensitive ? ' <span class="pill sens">sensitive</span>' : '') + '</td>'
        + '<td class="r mono">' + fmtN(d.obs) + '</td>'
        + '<td class="r mono">' + fmtN(d.firms) + '</td>'
        + '<td class="r mono">' + per10k(d.rObs) + '</td>'
        + '<td class="r mono str">' + per10k(d.rCen) + '</td>'
        + '<td class="r mono dim">' + per10k(d.rLow) + '–' + per10k(d.rHigh) + '</td>'
        + '<td class="r mono">' + d.mult + '<span class="pill ' + (d.multBasis === 'estimated' ? 'meas' : 'asm') + '">'
        + (d.multBasis === 'estimated' ? 'measured' : 'assumed') + '</span></td>'
        + '<td><span class="pill c-' + esc(d.conf) + '">' + esc(d.conf) + '</span></td></tr>').join('')
    + '</tbody></table></div>', true));

  ch.push(card('Relative risk, central estimate',
    'Same numbers as bars, so the spread is visible. Telecommunication and Energy sit at the top on '
    + 'small denominators; Construction and Hospitality at the bottom because their firm counts are '
    + 'dominated by very small businesses.',
    bars(F.industries, { label: (d) => d.tag, value: (d) => d.rCen,
      fmt: (v) => per10k(v), tip: (d) => 'central ' + per10k(d.rCen) + ' per 10k/yr<br>observed '
        + per10k(d.rObs) + '<br>' + fmtN(d.firms) + ' ' + d.unit }), true));

  /* --- size dimension ----------------------------------------------------- */
  ch.push(card('Risk scales with headcount',
    'Relative attack rate by employee band, where 1.0 is an average firm. Fitted curve is '
    + '<b>rate ∝ employees<sup>' + F.size.elasticity_b.toFixed(2) + '</sup></b> '
    + '(weighted R² ' + F.size.weighted_r2.toFixed(2) + ', n = ' + F.size.n_labelled + '). '
    + 'Flat above 1,000 employees: the raw power law over-predicts the top band about 4×, and very '
    + 'large firms are plausibly <b>less</b> likely to be listed given an attack.',
    '<div class="mwrap"><table class="freqt"><thead><tr><th>Employees</th>'
    + '<th class="r">Firms</th><th class="r">% of firms</th><th class="r">Labelled victims</th>'
    + '<th class="r">% of victims</th><th class="r">Observed</th><th class="r">Fitted</th>'
    + '</tr></thead><tbody>'
    + F.bands.map((b) =>
        '<tr><td class="mono">' + esc(b.band) + '</td>'
        + '<td class="r mono">' + fmtN(b.firms) + '</td>'
        + '<td class="r mono dim">' + pct(b.share) + '</td>'
        + '<td class="r mono">' + b.victims + '</td>'
        + '<td class="r mono dim">' + pct(b.vshare) + '</td>'
        + '<td class="r mono">' + b.emp.toFixed(2) + '×</td>'
        + '<td class="r mono str">' + b.fit.toFixed(2) + '×</td></tr>').join('')
    + '</tbody></table></div>'
    + '<p class="cap" style="margin-top:9px">Weakest link in the whole model: these labels come from '
    + 'firmographic profiles that are sparse below about 5–10 employees, so the 1–4 band '
    + '— <b>63% of all US firms</b> — rests on 7 records, and b is probably too steep.</p>', true));

  /* --- under-reporting ---------------------------------------------------- */
  if (F.strata.length) {
    const ks = F.strata[0].sweep.map((x) => x.k);
    ch.push(card('Under-reporting, measured rather than assumed',
      'Leak sites show only part of reality. Rather than assume the multiplier, we estimate it by '
      + '<b>capture–recapture</b> against an independently-built victim list: how much the two lists '
      + 'overlap tells you how much both are missing. Only 3 of 14 sectors have a list clean enough '
      + 'to stratify. Columns sweep the assumption that some of the overlap is one list copying the '
      + 'other, which is bounded by the data itself.',
      '<div class="mwrap"><table class="freqt"><thead><tr><th>Stratum</th>'
      + '<th class="r">Leak-site</th><th class="r">Independent</th><th class="r">Both</th>'
      + ks.map((k) => '<th class="r">' + (k * 100) + '% copied</th>').join('')
      + '</tr></thead><tbody>'
      + F.strata.map((x) =>
          '<tr><td>' + esc(x.name) + '</td>'
          + '<td class="r mono">' + fmtN(x.A) + '</td>'
          + '<td class="r mono">' + fmtN(x.B) + '</td>'
          + '<td class="r mono">' + x.M + '</td>'
          + x.sweep.map((sw) => '<td class="r mono' + (sw.k === 0.25 ? ' str' : ' dim') + '">'
              + (sw.R == null ? 'n/a' : sw.R.toFixed(1) + '×') + '</td>').join('')
          + '</tr>').join('')
      + '</tbody></table></div>'
      + (F.schedule ? '<p class="cap" style="margin-top:9px">Published schedule, <b>derived</b> from that '
          + 'sweep rather than asserted: low <b>' + F.schedule.low.value + '×</b> / central <b>'
          + F.schedule.central.value + '×</b> / high <b>' + F.schedule.high.value
          + '×</b>. The 0% column assumes the two lists are independent, which they are not, so it '
          + 'is a hard <b>lower bound</b>.</p>' : ''), true));
  }

  if (F.hhs) {
    ch.push(card('A second route disagrees by 3×',
      'The estimate above leans on a voluntary list. Healthcare breach reporting to HHS is '
      + '<b>mandatory</b> above 500 individuals, so within that frame the list is close to a census '
      + 'and the leak-site capture rate can be read directly — no independence assumption needed. '
      + 'It comes out under 5%, implying a multiplier above 20×. <b>Max capture</b> is the ceiling '
      + 'set by the two list sizes: near 100% means the low capture is real, not an artifact of '
      + 'comparing a small list to a large one.',
      '<div class="mwrap"><table class="freqt"><thead><tr><th>HHS stratum</th>'
      + '<th class="r">Records</th><th class="r">Matched</th><th class="r">Capture</th>'
      + '<th class="r">Implied R</th><th class="r">Max capture</th></tr></thead><tbody>'
      + F.hhs.variants.map((v) =>
          '<tr' + (v.name.indexOf('2019') > -1 ? ' class="hl"' : '') + '><td class="mono">'
          + esc(v.name.replace(/_/g, ' ')) + '</td>'
          + '<td class="r mono">' + fmtN(v.B) + '</td><td class="r mono">' + v.M + '</td>'
          + '<td class="r mono str">' + pct(v.cap) + '</td>'
          + '<td class="r mono">' + v.R.toFixed(1) + '×</td>'
          + '<td class="r mono dim">' + pct(v.maxCap) + '</td></tr>').join('')
      + '</tbody></table></div>'
      + '<p class="cap" style="margin-top:9px">Neither route is clean: capture–recapture is biased '
      + '<b>down</b> by list dependence, the HHS reciprocal biased <b>up</b> by frame mismatch (the 500 '
      + 'floor excludes the small practices that dominate healthcare; HHS records legal names where leak '
      + 'sites post brands). The table above follows the conservative route, so these rates are more '
      + 'likely <b>too low</b> than too high.</p>', true));
  }

  /* --- process dependence ------------------------------------------------- */
  if (F.pdi && F.pdi.by_sector) {
    const rows = Object.entries(F.pdi.by_sector).map(([k, v]) => ({ k, v }));
    ch.push(card('Process dependence',
      'Share of each industry’s hazard and exposure taxonomy that is about <b>operations stopping</b> '
      + 'rather than data leaking. Carried as segmentation only and deliberately <b>not</b> multiplied '
      + 'into the rates: it is a severity-flavoured measure, and folding it into frequency would '
      + 'double-count it.',
      bars(rows, { label: (d) => d.k, value: (d) => d.v,
        fmt: (v) => v.toFixed(3), tip: (d) => (d.v * 100).toFixed(1) + '% of taxonomy entries are operational' })));
  }

  /* --- the audit spine ---------------------------------------------------- */
  ch.push(card('What is measured, and what is assumed',
    'Every number in this tab carries a basis. Nothing here is a bare figure: '
    + '<span class="pill meas">measured</span> comes from a source, '
    + '<span class="pill asm">assumed</span> is a judgement we are declaring.',
    '<div class="asml">' + F.assumptions.map((a) =>
      '<div class="asmrow"><span class="pill b-' + esc(a.basis) + '">' + esc(a.basis) + '</span>'
      + '<span class="asmt"><b class="mono">' + esc(a.id) + '</b> ' + esc(a.statement)
      + (a.bias && a.bias !== 'n/a' && a.bias !== 'unknown'
          ? ' <i class="dim">(bias: ' + esc(a.bias) + ')</i>' : '') + '</span></div>').join('')
    + '</div>', true));

  ch.push(card('Read the ranking, not the level',
    'The under-reporting multiplier scales every rate together, so it moves the level but largely '
    + 'cancels out of the ordering. That is checked, not asserted.',
    '<div class="statrow"><span class="m"><b>Ranking stability</b><br>'
    + (F.ranking.identical ? 'identical in all ' + F.ranking.of + ' positions'
        : F.ranking.positions_held + ' of ' + F.ranking.of + ' positions held')
    + ' between the observed and the fully-adjusted numerator</span>'
    + '<span class="s">' + (F.ranking.identical ? 'stable' : 'partial') + '</span></div>'
    + '<ul class="lims">' + F.limitations.map((l) => '<li>' + esc(l) + '</li>').join('') + '</ul>', true));

  $('#fcharts').innerHTML = ch.join('');
  $('#fnote').innerHTML = 'Denominator: US Census SUSB ' + (F.size.fit_population ? '2022' : '')
    + ' employer-firm counts, NAICS-crosswalked. Numerator: leak-site listings for ' + F.year
    + ', the only year with complete 12-month coverage across all 14 sectors. '
    + '<b>This measures how often a firm is listed on a leak site, not how often one is attacked</b> '
    + '— attack date equals discovery date for 65% of records. Sanity anchor: NAIC reports 1.14% '
    + 'all-cyber claim frequency for 2024, and ransomware is a subset of that, so '
    + F.allRate + '% sitting below it is the expected result.';
  wireTips($('#fcharts'));
}


function renderInsights() {
  const yrs = I.byYear.filter((y) => +y.year >= 2018); // pre-2018 is a negligible long tail
  const peak = I.byYear.reduce((a, b) => b.n > a.n ? b : a);
  $('#tiles').innerHTML = [
    [fmtN(I.total), 'victims scraped'],
    [fmtN(I.groupCount), 'ransomware groups'],
    [fmtN(I.countryCount), 'countries hit'],
    [I.bySector.length, 'sectors'],
    [peak.year, 'peak year (' + fmtN(peak.n) + ')'],
    [fmtUSD(I.financial[0].usd), 'costliest incident'],
  ].map(([b, s]) => '<div class="tile"><b>' + b + '</b><span>' + s + '</span></div>').join('');

  const charts = [];
  charts.push(card('Victims by sector', 'Leak-site postings per industry, all years. <b>Frequency, not severity.</b>',
    bars(I.bySector, { label: (d) => d.sector, value: (d) => d.n, fmt: fmtN }), true));

  charts.push(card('Victims by year', 'Leak-site postings 2018 to date. 2026 is partial.',
    area(yrs, 'yr'), true));

  charts.push(card('Most active groups', 'Top 15 by victim count across all sectors.',
    bars(I.topGroups, { label: (d) => d.group, value: (d) => d.n, fmt: fmtN })));

  charts.push(card('Most-targeted countries', 'Top 12 by victim count.',
    bars(I.topCountries, { label: (d) => d.country, value: (d) => d.n, fmt: fmtN })));

  charts.push(card('Who hits whom', 'Top 10 groups &times; sector. Darker = more victims. The specialists show as bright rows in one or two columns.',
    heatmap(I.heatmap), true));

  if (I.coverage) {
    const cv = I.coverage;
    const covBody = '<div class="cov">' + cv.fields.map((f) => {
      const dw = (f.disclosed / cv.total) * 100;
      return '<div class="covrow" data-tip="<b>' + esc(f.field) + '</b><br>' + f.disclosed + ' of ' + cv.total + ' disclosed (' + f.pct + '%)<br>' + f.undisclosed + ' not publicly reported">'
        + '<span class="covl">' + esc(f.field) + '</span>'
        + '<div class="covtrack"><div class="covfill" style="width:' + dw + '%"></div></div>'
        + '<span class="covv">' + f.pct + '%</span></div>';
    }).join('') + '</div>';
    charts.push(card('Disclosure coverage', 'Of the <b>' + cv.total + ' researched incidents</b>, how many actually report each figure. Filled = disclosed, rest = not publicly reported. These are reporting gaps, <b>not zeros</b>.',
      covBody, true));
  }

  charts.push(card('Costliest incidents', 'Reported total impact, researched incidents. <b>Mixed basis</b> (company cost, recovery, fines) &mdash; read each source.',
    bars(I.financial, { label: (d) => d.victim.split(' (')[0], value: (d) => d.usd, fmt: fmtUSD, money: true, tip: (d) => d.industry + '<br>' + d.raw.slice(0, 120) })));

  charts.push(card('Largest ransoms', 'Demanded or paid, where publicly reported.',
    bars(I.ransom, { label: (d) => d.victim.split(' (')[0], value: (d) => d.usd, fmt: fmtUSD, money: true, tip: (d) => d.industry + '<br>' + d.raw.slice(0, 120) })));

  $('#charts').innerHTML = charts.join('');
  wireTips($('#charts'));

  // area crosshair
  const svg = $('#yr'), cross = $('#yrc');
  if (svg) svg.querySelectorAll('rect[data-x]').forEach((r) => {
    r.addEventListener('mouseenter', () => { cross.setAttribute('x1', r.dataset.x); cross.setAttribute('x2', r.dataset.x); cross.style.opacity = '1'; });
    r.addEventListener('mouseleave', () => { cross.style.opacity = '0'; });
  });

  $('#inote').innerHTML = 'Sector, year, group and country charts come from the full <b>' + fmtN(I.total)
    + '</b>-victim leak-site scrape and measure <b>frequency</b>. The two money charts come from the '
    + '<b>107 researched incidents</b> and measure <b>severity</b> &mdash; blanks in that layer are undisclosed figures, not zeros, '
    + 'so these are the disclosed subset. Frequency is blue, money is red throughout.'
    + '<span id="livebadge"></span>';
}

/* Live mode: when served by scripts/server.js, replace the baked-in snapshot
   with fresh Atlas data. Opened as a plain file, this fetch fails and the
   snapshot stands — so the self-contained file keeps working either way. */
async function goLive() {
  try {
    const r = await fetch('api/insights', { cache: 'no-store' });
    if (!r.ok) return;
    const live = await r.json();
    if (!live || !live.total) return;
    I = live;
    renderInsights();
    const when = live.generated_at ? new Date(live.generated_at).toISOString().slice(0, 10) : '';
    const b = $('#livebadge');
    if (b) b.innerHTML = ' <span class="live">live from Atlas' + (when ? ' · ' + when : '') + '</span>';
  } catch (e) { /* offline / static file — keep snapshot */ }
}

/* ---------- wiring ---------- */
function delegate(sel, attr, fn) {
  const el = $(sel);
  el.addEventListener('click', (e) => { const c = e.target.closest('[' + attr + ']'); if (c) fn(c); });
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.closest('[' + attr + ']'); if (c) { e.preventDefault(); fn(c); }
  });
}
delegate('#inds', 'data-ind', (c) => showInd(c.dataset.ind));
delegate('#cats', 'data-cat', (c) => showCat((c.dataset.kind === 'h' ? D.hazards : D.exposures).find((x) => x.key === c.dataset.cat)));
delegate('#incs', 'data-inc', (c) => {
  const e = ALLINC[+c.dataset.inc];
  open('<div class="kicker">' + esc(e.ind) + '</div><h2>' + esc(e.v) + '</h2><p>' + esc(e.s) + '</p>' + inc(e));
});
$('#qi').addEventListener('input', (e) => renderInds(e.target.value));
$('#qc').addEventListener('input', (e) => renderCats(e.target.value));
$('#qn').addEventListener('input', (e) => renderIncs(e.target.value));

buildMatrix(); renderInds(); renderCats(); renderIncs(); renderInsights(); renderFreq(); goLive();
</script>
</body>
