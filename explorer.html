<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ransomware Risk Taxonomy Explorer</title>
<style>
/* Palette: chrome is neutral graphite so the only two chromatic elements on the
   page are the data hues. Hazard warm, exposure cool, and deliberately red vs
   blue rather than red vs green so the matrix survives deuteranopia. */
:root{
  --ground:#F4F3F0; --surface:#FCFBF9; --surface-2:#EFEEEA;
  --ink:#191C1F; --muted:#5A6268; --faint:#8B9298;
  --line:#DEDCD6; --line-strong:#BFBCB4;
  --accent:#2B3238; --accent-ink:#FCFBF9;
  --hazard:#A2432B; --hazard-soft:#EFE1DB;
  --exposure:#2A5578; --exposure-soft:#DDE4EC;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#101315; --surface:#171A1D; --surface-2:#1E2226;
    --ink:#E4E5E2; --muted:#9AA1A7; --faint:#6C737A;
    --line:#282D32; --line-strong:#3C434A;
    --accent:#D6D8D4; --accent-ink:#171A1D;
    --hazard:#C9714F; --hazard-soft:#2A1B15;
    --exposure:#7BA5CA; --exposure-soft:#161F29;
  }
}
:root[data-theme="dark"]{
  --ground:#101315; --surface:#171A1D; --surface-2:#1E2226;
  --ink:#E4E5E2; --muted:#9AA1A7; --faint:#6C737A;
  --line:#282D32; --line-strong:#3C434A;
  --accent:#D6D8D4; --accent-ink:#171A1D;
  --hazard:#C9714F; --hazard-soft:#2A1B15;
  --exposure:#7BA5CA; --exposure-soft:#161F29;
}
:root[data-theme="light"]{
  --ground:#F4F3F0; --surface:#FCFBF9; --surface-2:#EFEEEA;
  --ink:#191C1F; --muted:#5A6268; --faint:#8B9298;
  --line:#DEDCD6; --line-strong:#BFBCB4;
  --accent:#2B3238; --accent-ink:#FCFBF9;
  --hazard:#A2432B; --hazard-soft:#EFE1DB;
  --exposure:#2A5578; --exposure-soft:#DDE4EC;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;text-wrap:balance;margin:0}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

header{border-bottom:1px solid var(--line-strong);background:var(--surface);position:sticky;top:0;z-index:20}
.hwrap{max-width:1560px;margin:0 auto;padding:13px 22px;display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17.5px;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:12.5px}
.metrics{margin-left:auto;display:flex;gap:0;flex-wrap:wrap;align-items:stretch}
.metric{text-align:right;padding:0 15px;border-left:1px solid var(--line)}
.metric:first-child{border-left:0}
.metric b{display:block;font-size:14.5px;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.metric span{font-size:10.5px;color:var(--faint)}

nav{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;gap:0;border-bottom:1px solid var(--line)}
nav button{
  font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:9px 15px;border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav button:focus-visible{outline:1px solid var(--ink);outline-offset:-3px}

main{max-width:1560px;margin:0 auto;padding:18px 22px 40px}
.panel{display:none}
.panel.on{display:block}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search]{
  font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line-strong);
  border-radius:3px;background:var(--surface);color:var(--ink);min-width:260px;
}
input[type=search]:focus{outline:1px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;padding:6px 13px;background:var(--surface);color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible{outline:1px solid var(--ink);outline-offset:-3px}
.famrow th{font-family:Georgia,serif!important;font-size:11.5px!important;color:var(--ink)!important;background:var(--surface-2)!important;letter-spacing:.03em}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.dot.h{background:var(--hazard)} .dot.e{background:var(--exposure)}

/* ---- matrix ---- */
.mwrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th,td{padding:0;text-align:left}
thead th{
  position:sticky;top:0;background:var(--surface);z-index:3;
  border-bottom:1px solid var(--line-strong);vertical-align:bottom;
  padding:8px 6px;font-weight:600;font-size:11px;color:var(--muted);
}
thead th.rot{height:132px;white-space:nowrap;width:26px;min-width:26px}
thead th.rot>div{transform:rotate(-90deg);transform-origin:left bottom;width:22px;margin-left:50%}
tbody th{
  position:sticky;left:0;background:var(--surface);z-index:2;
  padding:7px 12px 7px 14px;font-weight:500;font-size:12.5px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line-strong);
  white-space:nowrap;max-width:290px;overflow:hidden;text-overflow:ellipsis;
}
tbody tr:hover th,tbody tr:hover td{background:var(--surface-2)}
tbody td{border-bottom:1px solid var(--line);text-align:center;width:26px}
.cell{width:14px;height:14px;border-radius:2px;display:inline-block;cursor:pointer;border:0;padding:0}
.cell:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.cell.h{background:var(--hazard)} .cell.e{background:var(--exposure)}
.cell.off{background:var(--line);opacity:.6}
.reach{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--faint);padding-right:10px;text-align:right;width:44px}

/* ---- cards / lists ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;background:var(--line);border:1px solid var(--line-strong);border-radius:3px}
.card{background:var(--surface);padding:13px 15px}
.card h3{font-size:14.5px;margin-bottom:4px;line-height:1.3}
.card .meta{font-size:11.5px;color:var(--faint);margin-bottom:7px;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.card p{margin:0 0 8px;color:var(--muted);font-size:13px}
.tag{
  display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--line-strong);color:var(--muted);margin:2px 3px 2px 0;
}
.tag.h{border-color:var(--hazard);color:var(--hazard);background:var(--hazard-soft)}
.tag.e{border-color:var(--exposure);color:var(--exposure);background:var(--exposure-soft)}
.clickable{cursor:pointer}
.clickable:hover{background:var(--surface-2)}
.clickable:focus-visible{outline:1px solid var(--ink);outline-offset:-2px}

/* ---- detail drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.4);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
aside{
  position:fixed;top:0;right:0;height:100%;width:min(560px,92vw);z-index:50;
  background:var(--surface);border-left:1px solid var(--line-strong);
  transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;padding:22px 24px 60px;
}
aside.on{transform:none}
aside h2{font-size:18.5px;margin-bottom:4px}
aside .kicker{font-size:11.5px;color:var(--faint);margin-bottom:9px;font-family:ui-monospace,Consolas,monospace}
aside h4{font-size:12px;color:var(--ink);margin:19px 0 6px;font-family:Georgia,serif;font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--line)}
aside p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 10px}
aside ul{margin:0;padding-left:17px;font-size:13px;color:var(--muted);line-height:1.6}
aside li{margin-bottom:4px}
.close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px}
.close:hover{color:var(--ink);background:var(--surface-2)}
.close:focus-visible{outline:2px solid var(--accent)}
.inc{border-left:2px solid var(--line-strong);padding:2px 0 2px 12px;margin-bottom:14px}
.inc b{font-size:13.5px}
.inc .f{font-size:12.5px;color:var(--muted);margin-top:3px}
.inc .f i{font-style:normal;color:var(--faint);font-size:11.5px;margin-right:6px;display:inline-block;min-width:66px;font-family:ui-monospace,Consolas,monospace}
.nd{color:var(--faint);font-style:italic}
a{color:var(--accent)}
.srcs{font-size:11px;word-break:break-all}
.srcs a{margin-right:8px}

/* ---- bulk bars ---- */
.years{display:flex;align-items:flex-end;gap:3px;height:60px;margin:8px 0}
.years div{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.years div:hover{opacity:1}
.ylab{display:flex;gap:3px;font-size:9px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}
.ylab span{flex:1;text-align:center}

.note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.6;max-width:80ch}
.prose{max-width:76ch}
.prose p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 13px}
.prose h3{font-size:15px;margin:22px 0 8px}
.statrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.statrow .v{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ink);flex:0 0 auto}
.statrow .m{color:var(--muted);flex:1}
.statrow .s{color:var(--faint);font-size:11px;flex:0 0 auto;text-align:right;max-width:190px}
@media (max-width:720px){
  .metrics{width:100%;margin-left:0;justify-content:flex-start;gap:14px}
  .metric{text-align:left}
  .statrow{flex-wrap:wrap}
}
/* ---- insights ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line-strong);border-radius:3px;margin-bottom:18px}
.tile{background:var(--surface);padding:13px 16px}
.tile b{display:block;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;letter-spacing:-.01em}
.tile span{font-size:11.5px;color:var(--faint)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.chart{background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:14px 16px 16px}
.chart.wide{grid-column:1/-1}
.chart h3{font-size:14px;margin-bottom:2px}
.chart .cap{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.chart .cap b{color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:5px}
.brow{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:9px;font-size:12px}
.brow .bl{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{background:var(--surface-2);border-radius:0 2px 2px 0;height:15px;position:relative;overflow:hidden}
.bfill{height:100%;border-radius:0 2px 2px 0;background:var(--freq)}
.bfill.money{background:var(--sev)}
.brow .bv{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ink);font-size:11.5px;min-width:38px;text-align:right}
.brow:hover .bl{color:var(--ink)}
.brow:hover .btrack{outline:1px solid var(--line-strong)}
/* coverage bars */
.cov{display:flex;flex-direction:column;gap:6px}
.covrow{display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:10px;font-size:12.5px}
.covl{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.covtrack{height:16px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,transparent 4px,transparent 8px);border:1px solid var(--line);position:relative;overflow:hidden}
.covfill{height:100%;background:var(--exposure);border-radius:0}
.covrow .covv{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink);min-width:34px;text-align:right}
.covrow:hover .covl{color:var(--ink)}
.covrow:hover .covtrack{outline:1px solid var(--line-strong)}
@media (max-width:520px){.covrow{grid-template-columns:120px 1fr auto}}
/* heatmap */
.hm{overflow-x:auto}
.hmgrid{display:grid;gap:2px;font-size:11px;min-width:640px}
.hmcell{aspect-ratio:2.4;border-radius:2px;cursor:default}
.hmcell.lab{background:none;display:flex;align-items:center;color:var(--muted);font-size:10.5px;cursor:default;aspect-ratio:auto}
.hmcell.lab.col{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-end;padding-bottom:3px;height:96px}
.hmcell.lab.row{justify-content:flex-end;padding-right:6px;white-space:nowrap}
.hm0{background:var(--surface-2)}
.hm1{background:var(--hm1)} .hm2{background:var(--hm2)} .hm3{background:var(--hm3)} .hm4{background:var(--hm4)} .hm5{background:var(--hm5)}
.hmcell[data-v]:hover{outline:2px solid var(--ink);outline-offset:-1px}
/* area chart */
.area svg{display:block;width:100%;height:auto;overflow:visible}
.area .grid line{stroke:var(--line)} .area .axis{fill:var(--faint);font-size:10px;font-family:ui-monospace,Consolas,monospace}
.area .fill{fill:var(--freq);opacity:.14} .area .stroke{stroke:var(--freq);stroke-width:2;fill:none}
.area .dot{fill:var(--freq)} .area .cross{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
/* tooltip */
#tt{position:fixed;z-index:60;background:var(--accent);color:var(--accent-ink);font-size:11.5px;line-height:1.4;padding:6px 9px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:240px;font-family:ui-monospace,Consolas,monospace}
#tt.on{opacity:1}
#tt b{font-family:Georgia,serif}
.live{display:inline-block;font-size:10.5px;font-family:ui-monospace,Consolas,monospace;color:var(--exposure);border:1px solid var(--exposure);border-radius:2px;padding:1px 6px;margin-left:6px}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--exposure);margin-right:5px;vertical-align:middle}
:root{--freq:#2A5578;--sev:#A2432B;--hm1:#E7EEF4;--hm2:#BBD0E0;--hm3:#7FA6C4;--hm4:#4A7BA1;--hm5:#24557A}
@media (prefers-color-scheme:dark){:root{--freq:#5E8FB8;--sev:#C9714F;--hm1:#1B2A38;--hm2:#254A66;--hm3:#356B90;--hm4:#5A8DB4;--hm5:#8FBCDD}}
:root[data-theme="dark"]{--freq:#5E8FB8;--sev:#C9714F;--hm1:#1B2A38;--hm2:#254A66;--hm3:#356B90;--hm4:#5A8DB4;--hm5:#8FBCDD}
:root[data-theme="light"]{--freq:#2A5578;--sev:#A2432B;--hm1:#E7EEF4;--hm2:#BBD0E0;--hm3:#7FA6C4;--hm4:#4A7BA1;--hm5:#24557A}
@media (max-width:520px){.brow{grid-template-columns:96px 1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1>Ransomware Risk Taxonomy</h1>
      <div class="sub">Hazards, exposures and researched losses across 14 industries</div>
    </div>
    <div class="metrics" id="metrics"></div>
  </div>
</header>
<nav id="nav" role="tablist"></nav>
<main>
  <section class="panel on" id="p-matrix" role="tabpanel">
    <div class="bar">
      <div class="seg" role="group" aria-label="Grouping">
        <button id="bFam" aria-pressed="true">By family</button><button id="bRaw" aria-pressed="false">As reported</button>
      </div>
      <div class="legend">
        <span><span class="dot h"></span>Hazard: what happens to you</span>
        <span><span class="dot e"></span>Exposure: what you own that gets hit</span>
      </div>
    </div>
    <div class="mwrap"><table id="matrix"></table></div>
    <p class="note" id="mnote"></p>
  </section>

  <section class="panel" id="p-ind" role="tabpanel">
    <div class="bar"><input type="search" id="qi" placeholder="Filter industries…" aria-label="Filter industries"></div>
    <div class="grid" id="inds"></div>
  </section>

  <section class="panel" id="p-cat" role="tabpanel">
    <div class="bar">
      <input type="search" id="qc" placeholder="Search categories and subcategories…" aria-label="Search categories">
      <div class="legend"><span><span class="dot h"></span>Hazards</span><span><span class="dot e"></span>Exposures</span></div>
    </div>
    <div class="grid" id="cats"></div>
  </section>

  <section class="panel" id="p-inc" role="tabpanel">
    <div class="bar"><input type="search" id="qn" placeholder="Search victims, groups, impacts…" aria-label="Search incidents"></div>
    <div class="grid" id="incs"></div>
  </section>

  <section class="panel" id="p-insights" role="tabpanel">
    <div class="tiles" id="tiles"></div>
    <div class="charts" id="charts"></div>
    <p class="note" id="inote"></p>
  </section>

  <section class="panel" id="p-syn" role="tabpanel">
    <div class="prose" id="syn"></div>
  </section>
</main>

<div id="tt" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" role="dialog" aria-label="Detail"><button class="close" id="closeBtn" aria-label="Close">&times;</button><div id="dbody"></div></aside>

const D = {"meta":{"industries":14,"incidents":148,"hazards":50,"exposures":86,"subcats":984,"stats":179,"bulkTotal":27108,"generated":"2026-08-20"},"industries":[{"name":"Accommodation, Food Services, Arts and Entertainment","tag":"Hospitality and Tourism","overview":"The Accommodation, Food Services, Arts and Entertainment industry (ransomware.live sector tag \"Hospitality and Tourism\") is a high-frequency, high-visibility ransomware target: 771 victims have been tracked on ransomware.live's leak-site monitoring platform since roughly 2018, spanning hotels, casinos, restaurants, theme parks, cruise lines, museums, theaters, and travel/tour operators across 65+ countries (with the US, GB, FR, ES, CA, AU, DE and IT most represented). The sector is attacked by a broad spread of ransomware groups -- LockBit (in its 2/3/5 variants), Qilin, Akira, Play, Medusa, IncRansom, RansomHub, DragonForce and Clop are the most prolific -- and has produced some of the highest-profile ransomware incidents in history (MGM Resorts, Caesars Entertainment) due to the combination of large, valuable guest/loyalty databases, PCI-regulated payment systems, IT/OT-blended physical operations (casino floors, digital key/lock systems, POS), heavy third-party/franchise dependency, and a business model highly sensitive to even brief guest-facing downtime -- all of which make organizations in this sector both frequent targets and comparatively willing payers.","distinct":"771 tracked victims across 65+ countries spanning hotels, casinos, restaurants, theme parks, cruise lines and museums. Distinctively franchised and multi-site, with inconsistent security maturity across properties and heavy seasonal revenue concentration. Casino and gaming operations add regulator-supervised systems and cage/loyalty data. Guest-facing outages are immediately public and directly convert to booking loss and brand damage.","leverage":"Guest-facing service disruption timed to peak periods, combined with exposure of guest PII, payment card data and loyalty records.","tolerance":"Low to moderate. Days in the ordinary course, but effectively hours during peak season or a major event, when a single weekend outage can absorb a quarter's margin.","bulk":{"total":771,"years":{"2018":1,"2020":3,"2021":39,"2022":73,"2023":133,"2024":166,"2025":212,"2026":144},"groups":[["qilin",62],["lockbit3",50],["akira",48],["play",38],["lockbit2",29],["ransomhub",25],["incransom",23],["medusa",23]],"countries":[["US",218],["GB",38],["ES",31],["FR",31],["CA",23],["AU",17]],"pressPct":5,"ransomPct":1},"incidents":[{"v":"MGM Resorts International","g":"ALPHV/BlackCat (via Scattered Spider social engineering)","d":"September 2023 (breach began Sept 9, disclosed Sept 11, 2023)","c":"United States","fin":"MGM disclosed an estimated ~$100 million negative impact to Adjusted Property EBITDAR for Las Vegas Strip and Regional Operations, plus under $10 million in one-time remediation/legal/incident-response costs; company said it expected to be largely covered by cyber insurance. A related shareholder/consumer class-action settlement was reached in 2025.","ran":"MGM has stated it did not pay a ransom (unlike sister-incident Caesars); no confirmed dollar figure for a demand specific to MGM has been publicly disclosed.","dt":"Core systems (slot machines, digital key cards, reservations, payment processing) were down for approximately 10 days before full restoration.","di":"Personal information (names, contact details, driver's license/SSN/passport numbers for some) of roughly 37 million MGM Rewards members was compromised.","s":"Scattered Spider used a vishing/social-engineering attack against MGM's IT help desk to obtain credentials, then deployed ALPHV/BlackCat ransomware, forcing MGM to shut down casino floor systems, digital hotel room keys, slot machines, ATMs, restaurant/payment systems and websites across 30+ properties for roughly 10 days.","src":["https://www.bleepingcomputer.com/news/security/mgm-resorts-ransomware-attack-led-to-100-million-loss-data-theft/","https://www.infosecurity-magazine.com/news/mgm-resorts-dollar100m-costs/","https://www.techtarget.com/searchsecurity/news/366554695/MGM-faces-100M-loss-from-ransomware-attack","https://www.forbes.com/sites/steveweisman/2025/03/12/mgm-ransomware--attack-update/"]},{"v":"Caesars Entertainment","g":"Scattered Spider / ALPHV-linked extortion","d":"August 2023 (breach began Aug 18, disclosed mid-September 2023)","c":"United States","fin":"Caesars disclosed the incident in an SEC 8-K; ongoing consumer class-action litigation (Caesars Entertainment Data Breach Litigation). Specific total incident cost beyond the ransom payment not publicly broken out.","ran":"Attackers initially demanded $30 million; Caesars paid approximately $15 million in cryptocurrency. The FBI later tracked and froze a portion of the payment as it moved through crypto exchanges.","dt":"Caesars stated its hotel, casino and online operations were not significantly disrupted (unlike MGM); recovery was largely on the data-breach/notification track rather than an operational-outage track.","di":"Loyalty program database of more than 65 million Caesars Rewards members exposed, including driver's license and Social Security numbers for a subset of members.","s":"Attackers compromised a third-party IT support vendor via social engineering to breach Caesars' network and exfiltrate the ~6TB Caesars Rewards loyalty database before Caesars negotiated and paid a ransom; the attack occurred just before, and is closely associated with, the MGM incident by the same threat-actor ecosystem.","src":["https://www.pymnts.com/news/security-and-risk/2023/report-caesars-entertainment-paid-15-million-ransom-after-cyberattack/","https://www.cnbc.com/2023/09/14/caesars-paid-millions-in-ransom-to-cybercrime-group-prior-to-mgm-hack.html","https://cybernews.com/news/caesars-15m-ransom-sec-breach-report-6t-stolen-data/","https://www.chainalysis.com/blog/chainalysis-fbi-caesars-ransomware-recovery/","https://www.cohenmilstein.com/case-study/caesars-data-breach-litigation/"]},{"v":"Carnival Corporation & plc","g":"ShinyHunters","d":"April 2026 (initial access April 14; discovered/blocked April 22; disclosed publicly ~mid-May 2026)","c":"United States","fin":"Not publicly disclosed as a specific dollar figure by Carnival; the company began offering two years of complimentary TransUnion credit monitoring to affected US residents, an ongoing cost. Litigation/regulatory exposure likely given the scale of records.","ran":"Not publicly disclosed; ShinyHunters is an extortion-focused (data-theft, not necessarily encryption) group and threatened to publish/sell the data if terms were not met.","dt":"No major operational/cruise-booking outage reported; this was primarily a data-theft/social-engineering incident rather than an encryption/downtime event.","di":"Data breach notice filed in Maine listed 5,995,277 affected individuals; ShinyHunters claimed 8.7 million records stolen. Exposed data included names, addresses, emails, phone numbers, dates of birth, and government ID numbers (driver's license, passport).","s":"ShinyHunters used social engineering to trick a Carnival employee into granting IT system access, then used the compromised account to copy personal data from a limited portion of Carnival's systems before being blocked; the gang later claimed 8.7 million stolen records and published data on its leak site.","src":["https://www.bleepingcomputer.com/news/security/carnival-cruise-confirms-data-breach-affecting-nearly-6-million-people/","https://www.malwarebytes.com/blog/data-breaches/2026/05/carnival-confirms-data-breach-impacting-nearly-6-million","https://www.securityweek.com/carnival-data-breach-exposed-6-million-people/","https://www.helpnetsecurity.com/2026/05/28/carnival-corporation-data-breach/"]},{"v":"Compass Group Australia (Sydney-based catering/support services group)","g":"Medusa (two separate affiliate attacks)","d":"September 2024 (first attack disclosed Sept 4; second Medusa-affiliate attack later in September, data posted Sept 18, 2024)","c":"Australia","fin":"Not publicly disclosed by Compass Group; company activated its incident response plan and notified employees, clients, suppliers and regulators.","ran":"First attack: Medusa demanded US$2 million to delete/not publish the ~785.5GB of stolen data (with a US$100,000/day deadline-extension fee). Second (separate) attack: ransom demanded was US$100,000. Not publicly confirmed whether any payment was made.","dt":"Specific downtime duration not publicly detailed in press coverage; company stated it secured systems and launched an investigation with external cybersecurity specialists.","di":"Near 1TB combined across both incidents; data included employee wage declarations and scanned passports/driver's licenses of contractors and staff, with the threat actor threatening publication on its dark-web leak site.","s":"Medusa ransomware affiliates breached Compass Group's Australian IT network twice within the same month, exfiltrating close to 1TB of data combined, including employee wage records and scanned passports/driver's licenses of contractors, then threatened publication on Medusa's leak site.","src":["https://www.cyberdaily.au/security/11128-exclusive-sydney-based-compass-group-confirms-medusa-ransomware-attack","https://www.cyberdaily.au/security/11139-exclusive-australian-compass-group-confirms-second-hack","https://www.halcyon.ai/attacks/medusa-ransomware-hits-compass-group-australia-in-major-cyberattack"]},{"v":"Panera Bread","g":"Unclaimed / unattributed (no group publicly took credit)","d":"March 2024 (outage began March 22, resolved around March 26, 2024)","c":"United States","fin":"Not publicly disclosed by Panera; the company did not release financial figures. Independent security analysts estimated such multi-day enterprise ransomware disruptions typically cost tens of millions of dollars in lost sales and recovery, but no Panera-specific figure has been confirmed.","ran":"Not publicly disclosed; no group claimed responsibility and Panera did not comment on any ransom demand or payment.","dt":"Approximately one week (March 22-26, 2024) of major IT outage across point-of-sale, online ordering, loyalty and phone systems before restoration.","di":"A subsequent notice confirmed an employee data breach tied to the March incident (SSNs and other employee personal data); customer payment-data exposure was not confirmed.","s":"A ransomware attack encrypted numerous Panera Bread virtual machines, taking down point-of-sale systems, online/mobile ordering, the loyalty (MyPanera) program, and internal phone systems across the chain's roughly 2,160 cafés; stores stayed open but had to fall back to cash-only transactions during the outage.","src":["https://www.bleepingcomputer.com/news/security/panera-bread-week-long-it-outage-caused-by-ransomware-attack/","https://www.bleepingcomputer.com/news/security/panera-warns-of-employee-data-breach-after-march-ransomware-attack/","https://www.restaurantbusinessonline.com/technology/panera-breads-digital-outage-reportedly-blamed-ransomware-attack"]},{"v":"Nordic Choice Hotels","g":"Conti","d":"December 2021 (attack began Dec 2, disclosed Dec 6-8, 2021)","c":"Norway/Scandinavia (200 properties across Scandinavia, Finland, and the Baltics)","fin":"Not publicly disclosed as a specific dollar figure.","ran":"Nordic Choice stated it deliberately did not contact Conti and had not received (or did not intend to pay) a ransom demand; no payment reported.","dt":"Replacement/workaround solutions were in place at most hotels within days of the attack (over the following weekend), with normal operations restored within about a week.","di":"Guest booking data and Nordic Choice Club (loyalty) member data were confirmed potentially exposed; no indication passwords or payment card data were affected.","s":"Conti ransomware hit Nordic Choice Hotels' central IT systems, disabling reservation, check-in/check-out, room key-card and payment systems across its ~200-property, 16,000-employee hotel network; staff fell back to manual processes while replacement systems were rolled out property-by-property.","src":["https://www.bleepingcomputer.com/news/security/nordic-choice-hotels-hit-by-conti-ransomware-no-ransom-demand-yet/","https://www.bitdefender.com/en-us/blog/hotforsecurity/nordic-choice-hotels-confirm-ransomware-attack","https://www.intelligentciso.com/2021/12/08/nordic-choice-hotels-hit-by-conti-ransomware/"]},{"v":"Rivers Casino Des Plaines / Rush Street Gaming","g":"Cicada3301 (2023 breach discovered Nov 2023; Cicada3301 also separately claimed Rivers Casino Philadelphia data in a later 2025 extortion post)","d":"August 2023 (breach occurred ~Aug 12, 2023; discovered/disclosed November 2023)","c":"United States","fin":"Not publicly disclosed; the casino faced a class-action lawsuit over the data breach.","ran":"For the 2025 Rivers Casino Philadelphia/Rush Street Gaming Cicada3301 claim, an undisclosed ransom was demanded with a stated deadline (Feb 15, 2025); no payment publicly confirmed. No ransom figure disclosed for the 2023 Illinois breach.","dt":"No major operational outage publicly reported; this was primarily a data-theft/notification incident rather than an encryption/downtime event.","di":"Names, birth dates, contact info, driver's license/government ID numbers, Social Security numbers, bank account and tax ID information, and passport numbers for a subset of customers and employees (at least 8,151 individuals per Comparitech); the 2025 Cicada3301 claim alleged 2.56TB of data stolen from Rush Street Gaming.","s":"Hackers accessed files containing personal data of customers and employees at Rivers Casino (Illinois); the breach was discovered months after the intrusion, leading to consumer notification, class-action litigation, and a separate 2025 Cicada3301 extortion claim against the related Rivers Casino Philadelphia/Rush Street Gaming entity.","src":["https://chicago.suntimes.com/2023/11/17/23965433/rivers-casino-data-breach-des-plaines-hackers","https://www.comparitech.com/news/ransomware-gang-claims-data-breach-at-philadelphia-casino-ssns-and-bank-account-info-leaked/","https://www.redpacketsecurity.com/cicada3301-ransomware-victim-rivers-casino-and-rush-street-gaming/","https://cdcgaming.com/brief/illinois-rivers-casino-des-plaines-hit-with-class-action-over-data-breach/"]},{"v":"Disneyland Paris","g":"Anubis","d":"June 2025 (claimed on leak site June 20, 2025; group teased on social media June 12)","c":"France","fin":"Not publicly disclosed; Disneyland Paris had not acknowledged the breach in public statements found.","ran":"Not publicly disclosed/unclear whether a ransom was demanded of Disneyland Paris directly versus its partner firm.","dt":"No park operational disruption reported; this was a third-party/supply-chain data-exposure incident rather than an IT outage at the park itself.","di":"Approximately 64GB / ~39,000 files of construction and renovation-related documents and media allegedly exposed via a Disneyland partner company, not confirmed to include guest personal data.","s":"Anubis ransomware claimed the largest data leak in Disneyland Paris's history, alleging the data (obtained via breach of a construction/renovation partner company rather than Disneyland directly) included ~39,000 files of park construction and renovation plans, exposing images/videos of attraction designs (Crush's Coaster, Frozen, Ratatouille, Buzz Lightyear, Phantom Manor, etc.). Disneyland Paris had not publicly confirmed the claims as of the reporting.","src":["https://hackread.com/anubis-ransomware-lists-disneyland-paris-new-victim/","https://www.scworld.com/brief/disneyland-paris-data-allegedly-stolen-by-anubis-ransomware","https://cybernews.com/security/anubis-ransomware-gang-claims-disneyland-paris/","https://dailysecurityreview.com/security-spotlight/anubis-ransomware-gang-claims-64gb-disneyland-paris-leak-in-alleged-construction-data-breach/"]},{"v":"Inspired Entertainment, Inc.","g":"not publicly disclosed","d":"2023-11-08","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The affected IT systems have now been substantially restored to full operational capabilities.","di":"Company data, including personal data, was exfiltrated.","s":"On November 8, 2023, Inspired Entertainment, Inc. detected a ransomware attack that disrupted its corporate IT systems. The company initiated response protocols and engaged cybersecurity experts, later discovering that personal data had been exfiltrated on November 15, 2023.","src":["https://www.sec.gov/Archives/edgar/data/1615063/000149315223042355/form8-k.htm"]},{"v":"Yum! Brands, Inc.","g":"not publicly disclosed","d":"2023-01-18","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Less than 300 restaurants in the United Kingdom were closed for one day; all stores are now operational and systems are expected to be largely restored in the coming days.","di":"Data was taken from the Company's network; no evidence that customer databases were stolen.","s":"On January 18, 2023, Yum! Brands, Inc. announced a ransomware attack that impacted certain information technology systems. The company initiated response protocols and engaged cybersecurity professionals, while confirming that less than 300 restaurants in the UK were temporarily closed but are now operational.","src":["https://www.sec.gov/Archives/edgar/data/1041061/000110465923004769/tm233852d1_8k.htm"]}],"stats":[{"m":"Total Hospitality and Tourism sector victims listed (cumulative, since ~2018 leak-site monitoring began)","v":"771 victims (as of 2026-07-19)","s":"ransomware.live v2 API (sectorvictims/Hospitality and Tourism) and ransomware.live sector activity page","u":"https://api.ransomware.live/v2/sectorvictims/Hospitality%20and%20Tourism"},{"m":"Top ransomware groups by victim count in this sector (of the 771 tracked)","v":"LockBit3 (50), Qilin (62), Akira (48), Play (38), LockBit2 (29), Medusa (23), IncRansom (23), RansomHub (25), DragonForce (21), Clop (21)","s":"ransomware.live v2 API sector victim data, aggregated by this analysis","u":"https://api.ransomware.live/v2/sectorvictims/Hospitality%20and%20Tourism"},{"m":"Share of ransomware.live-tracked sector victims located in the US","v":"~218 of 584 victims with a listed country (~37%), followed by GB (38), FR (31), ES (31), CA (23), AU (17), DE (17), IT (16)","s":"ransomware.live v2 API sector victim data, aggregated by this analysis","u":"https://api.ransomware.live/v2/sectorvictims/Hospitality%20and%20Tourism"},{"m":"Retail sector (closest published proxy vertical to hospitality/F&B) median ransom payment, 2025","v":"$1,000,000 (up from $950K in 2024); median ransom demand doubled to $2,000,000","s":"Sophos State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Retail sector share paying the ransom, 2025","v":"58% of organizations with encrypted data paid (2nd-highest rate in 5 years)","s":"Sophos State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Retail sector average ransomware recovery cost (excluding ransom), 2025","v":"$1.65 million (mean), down 40% year-over-year","s":"Sophos State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Cross-industry average ransomware recovery cost (excluding ransom), 2025","v":"$1.53 million (mean), down 44% from $2.73M in 2024","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Cross-industry average ransomware downtime","v":"~24 days average; 53% of victims recovered within a week","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Global average ransom payment, Q2 2025","v":"Mean $1.13 million / Median $400,000","s":"Coveware Quarterly Ransomware Report Q2 2025","u":"https://www.veeam.com/company/press-release/coveware-by-veeam-reveals-q2-2025-ransomware-surge-social-engineering-and-data-exfiltration-drive-record-payouts.html"},{"m":"Global average ransom payment, Q4 2025","v":"Mean $591,988 / Median $325,000","s":"Coveware Quarterly Ransomware Report Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Ransomware present in breaches, cross-industry (accommodation/food services cited as exposed to SaaS/third-party supply-chain compromises alongside retail)","v":"44% of all breaches involved ransomware (up from 32% prior year); third-party involvement in 30% of breaches (up from ~15%)","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Global on-chain ransomware payments, 2025","v":"$820 million total (down ~8% YoY from $892M); median payment rose 368% to $59,556 even as total claimed attacks rose ~50%","s":"Chainalysis 2026 Crypto Crime Report (2025 ransomware data)","u":"https://www.chainalysis.com/blog/crypto-crime-ransomware-victim-extortion-2025/"},{"m":"Cost of a data breach, industries including hospitality/entertainment/retail bucking the general 2025 cost decline","v":"Global average breach cost fell 9% to $4.44M in 2025, but entertainment, media, hospitality, education, retail and public sector cost trends moved against that decline (rose); US average breach cost hit $10.22M","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"}]},{"name":"Agriculture, Forestry, Fishing and Food Production","tag":"Agriculture and Food Production","overview":"The Agriculture, Forestry, Fishing and Food Production sector is a designated critical-infrastructure sector (Food & Agriculture / FA) that has become one of the fastest-growing ransomware targets. It spans a \"farm-to-fork\" chain of primary producers (crop farms, livestock/poultry, dairy, aquaculture/fisheries, forestry/timber), cooperatives and grain elevators, agri-input suppliers (seed, fertilizer, agrochemicals), food and beverage processors/manufacturers, cold-storage and logistics providers, and grocery/food distributors. The sector's defining risk characteristic is an extraordinarily low tolerance for downtime: perishable inputs and finished goods spoil, livestock require continuous feeding/climate control, and processing is time-and-temperature critical, so an IT outage rapidly cascades into physical, food-safety and food-security consequences. This combination, thin IT/OT security maturity, seasonal/just-in-time operations, heavy automation (SCADA in plants, precision-ag telematics, automated milking/feeding), and consolidation that concentrates single points of failure (a handful of meatpackers, one dominant grocery distributor), makes victims unusually likely to pay ransoms. Ransomware.live's 'Agriculture and Food Production' sector tag returned 1,219 tracked victim postings (2019–2026) at time of pull, dominated by LockBit, Akira, Qilin, Play, Cl0p, Black Basta, RansomHub and DragonForce, with the United States (321), Canada, Brazil, Italy, France, Germany, UK and Spain most represented. Independent tracking by the Food and Ag-ISAC recorded 212 sector incidents in 2024 (5.8% of all attacks) rising to 265 in 2025, part of an 82% year-over-year surge in overall ransomware volume.","distinct":"A designated critical-infrastructure sector and one of the fastest-growing targets, spanning farm-to-fork from primary producers through cooperatives, processors, cold-storage and distribution. Defining characteristic is perishability: unlike any other sector, the inventory itself degrades during an outage, so downtime destroys assets rather than merely deferring revenue. Heavy concentration in a few large processors and cooperatives controlling large throughput shares, paired with generally low security maturity among producers, creates food-security consequence at national scale.","leverage":"Spoilage-driven urgency and disruption of processing and cold chain, amplified by food-security and public-health visibility.","tolerance":"Extremely low during harvest, processing and cold-chain operation, hours before irreversible product loss; higher in off-season and administrative functions.","bulk":{"total":1220,"years":{"2019":3,"2020":11,"2021":76,"2022":121,"2023":244,"2024":267,"2025":289,"2026":209},"groups":[["lockbit3",106],["qilin",89],["akira",89],["play",56],["lockbit2",44],["clop",43],["ransomhub",39],["blackbasta",39]],"countries":[["US",322],["CA",58],["BR",43],["IT",42],["FR",37],["DE",37]],"pressPct":4,"ransomPct":0},"incidents":[{"v":"JBS S.A. / JBS USA","g":"REvil (Sodinokibi)","d":"2021-05-30","c":"Brazil / United States / Canada / Australia","fin":"Direct operational disruption to global meat supply; JBS did not publicly quantify total losses beyond the ransom. Widely cited as one of the most consequential critical-infrastructure attacks of 2021.","ran":"REvil initially demanded $22.5 million; JBS negotiated and paid $11 million in Bitcoin.","dt":"Multiple North American and Australian plants shut for roughly a day-plus; JBS said the majority of facilities were operational again within days, choosing to pay to avoid prolonged disruption and possible data exfiltration.","di":"JBS said it paid partly to ensure no data was exfiltrated; no large-scale data leak was confirmed at the time.","s":"The world's largest meat processor was hit by REvil, forcing shutdown of beef and pork slaughterhouses across the US, Canada and Australia and disrupting roughly a fifth of US meat capacity. Internal DHS records later characterized JBS's pre-attack cybersecurity as unusually poor. Ransomware.live also tracks a later 2026 'coinbasecartel' posting recycling ~3TB of JBS data, illustrating re-extortion.","src":["https://www.cnbc.com/2021/06/09/jbs-paid-11-million-in-response-to-ransomware-attack-.html","https://www.bleepingcomputer.com/news/security/jbs-paid-11-million-to-revil-ransomware-225m-first-demanded/","https://en.wikipedia.org/wiki/JBS_S.A._ransomware_attack","https://iowacapitaldispatch.com/2023/06/11/jbss-cybersecurity-was-unusually-poor-prior-to-2021-ransomware-attack-internal-homeland-security-records-show/"]},{"v":"United Natural Foods, Inc. (UNFI)","g":"Not publicly attributed","d":"2025-06-05","c":"United States","fin":"Estimated $350–$400 million reduction in fiscal-2025 net sales; net income impact of $50–$60 million and adjusted EBITDA impact of ~$40–$50 million. Included ~$20 million in manual-workaround costs and ~$5 million in remediation. Company said it expects insurance proceeds to be adequate to substantially offset losses.","ran":"Not publicly disclosed.","dt":"Systems taken offline in early June 2025; company ran manual workarounds and said the operational impact was mostly contained to the quarter, with phased restoration over subsequent weeks.","di":"Not detailed publicly; impact framed primarily as operational/supply disruption.","s":"North America's largest grocery distributor and primary supplier to Whole Foods was forced to take core systems offline after a June 2025 cyberattack, crippling electronic ordering and invoicing across its 53 distribution centers serving 30,000+ retail locations and emptying shelves nationwide. One of the largest quantified financial hits in the sector.","src":["https://www.securityweek.com/united-natural-foods-projects-up-to-400m-sales-hit-from-june-cyberattack/","https://www.cybersecuritydive.com/news/unfi-cyberattack-reduce-quarterly-earnings/751849/","https://cyberscoop.com/united-natural-foods-cyberattack-400-million/","https://www.grocerydive.com/news/unfi-cyberattack-losses-insurance-grocery-distribution/753223/"]},{"v":"Dole plc (Dole Food Company)","g":"Ransomware (group not publicly confirmed)","d":"2023-02-01","c":"United States / Chile","fin":"Total incident impact of $10.5 million for the quarter ended March 31, 2023 (of which $4.8 million related to continuing operations); CEO warned the financial impact would not be fully recoverable through insurance.","ran":"Not publicly disclosed.","dt":"North American operations briefly shut down; most disruptive to Fresh Vegetables and Chilean businesses. All impacted servers and end-user computers were subsequently restored or rebuilt with third-party IR support.","di":"Dole later disclosed the attack breached data of almost 3,900 US workers.","s":"One of the world's largest fresh-produce suppliers suffered a February 2023 ransomware attack that hit about half of Legacy Dole's servers and a quarter of end-user computers, briefly shutting North American operations and causing widely reported packaged-salad shortages on US store shelves.","src":["https://industrialcyber.co/critical-infrastructure/dole-ransomware-incident-affected-half-of-its-legacy-servers-with-direct-costs-reaching-10-5-million/","https://www.theregister.com/2023/02/23/dole_ransomware_attack/","https://www.cybersecuritydive.com/news/dole-ransomware-breached-data-workers/653650/","https://www.sec.gov/Archives/edgar/data/1857475/000162828023018832/dole-20230331_d2.htm"]},{"v":"Ahold Delhaize USA (Giant Food, Hannaford, Food Lion, Stop & Shop, The Giant Company)","g":"INC Ransom","d":"2024-11-06","c":"Netherlands / United States","fin":"Not separately quantified in dollar terms publicly; costs include breach response and two years of free credit monitoring/identity protection for 2.24M affected individuals.","ran":"No ransom reported paid, attackers published ~800GB of data on their leak site, indicating non-payment.","dt":"Network issues across US pharmacies and supermarkets in November 2024; systems restored over following weeks.","di":"Breach affected 2,242,521 people; leaked data included names, postal/email addresses, phone numbers, dates of birth and government IDs (SSNs, driver's licenses, passports).","s":"The US division of the multinational grocery/food retailer detected unauthorized access on Nov 6, 2024, disrupting pharmacies and supermarket network systems. INC Ransom claimed the attack in April 2025, asserting up to 6TB of stolen data; the incident became one of the largest food-retail data breaches on record.","src":["https://www.securityweek.com/ahold-delhaize-data-breach-impacts-2-2-million-people/","https://www.bleepingcomputer.com/news/security/ahold-delhaize-confirms-data-theft-after-inc-ransomware-claims-attack/","https://www.cybersecuritydive.com/news/ahold-delhaize-confirms-data-stolen-after-threat-group-claims-credit-for-no/745715/"]},{"v":"NEW Cooperative Inc.","g":"BlackMatter","d":"2021-09-20","c":"United States","fin":"Not publicly disclosed; the co-op proactively took systems offline to contain impact rather than pay.","ran":"BlackMatter demanded $5.9 million, escalating to $11.8 million if unpaid within five days. Reporting indicated the co-op did not pay.","dt":"Systems taken offline proactively to contain the threat; operations managed via workarounds while remediation proceeded with law enforcement and security experts.","di":"BlackMatter claimed theft of financial information, HR data, R&D information and source code for the 'SoilMap' agricultural technology platform.","s":"An Iowa farm cooperative providing feed, grain and crop-protection services was hit by BlackMatter, which locked systems used to manage food supply chains and animal-feeding schedules. The co-op said ~40% of US grain production runs through its software and warned the attack could 'break the supply chain very shortly,' making it a landmark food-security incident.","src":["https://www.washingtonpost.com/business/2021/09/21/new-cooperative-hack-ransomware/","https://industrialcyber.co/news/blackmatter-ransomware-group-strikes-new-cooperative-makes-demand-of-5-9-million/","https://www.farmprogress.com/business/blackmatter-hits-grain-cooperative-with-ransomware-attack"]},{"v":"KP Snacks","g":"Conti","d":"2022-01-28","c":"United Kingdom","fin":"Not publicly disclosed; disruption to order processing and distribution for roughly two months with supply-chain knock-on to retailers.","ran":"Conti operated double-extortion with a leak-site countdown; ransom amount and any payment not publicly confirmed.","dt":"Order placement and delivery disrupted from late January with no normal service expected until at least end of March 2022.","di":"Conti published samples including credit-card statements, birth certificates, and spreadsheets with employee addresses and phone numbers on its leak site.","s":"The UK snack maker (Hula Hoops, McCoy's, KP Nuts, Tyrrells, Butterkist) discovered a Conti ransomware attack on Jan 28, 2022 that disrupted IT systems so severely it could not safely process orders or dispatch goods, prompting warnings of crisp and snack shortages through at least March.","src":["https://www.bleepingcomputer.com/news/security/kp-snacks-giant-hit-by-conti-ransomware-deliveries-disrupted/","https://www.computerweekly.com/news/252512873/Crisp-supply-shortage-looms-after-KP-Snacks-hit-by-ransomware","https://www.cpomagazine.com/cyber-security/conti-ransomware-attack-on-uks-kp-snacks-to-cause-major-supply-chain-problems-for-popular-treats/"]},{"v":"Maple Leaf Foods","g":"Black Basta","d":"2022-11-06","c":"Canada","fin":"Company acknowledged the outage would cause operational and financial impact and expected full resolution to take time; specific loss figure not itemized publicly.","ran":"Not publicly disclosed; Maple Leaf publicly indicated it would not accede to criminal demands.","dt":"System outage began early November 2022 with recovery efforts extending over subsequent weeks while the company used workarounds to maintain supply.","di":"Not detailed publicly at scale; primarily an operational-disruption event.","s":"One of Canada's largest packaged-meats and food producers suffered a November 2022 outage attributed to Black Basta ransomware, causing a system disruption that affected operations and order fulfillment across its network; recorded in the ransomware.live sector dataset as a Black Basta victim.","src":["https://www.bleepingcomputer.com/news/security/kp-snacks-giant-hit-by-conti-ransomware-deliveries-disrupted/","https://api.ransomware.live/v2/sectorvictims/Agriculture%20and%20Food%20Production"]}],"stats":[{"m":"Food & Agriculture sector ransomware incidents tracked in 2025","v":"265 incidents, accounting for ~4.2% of 6,377 total ransomware incidents tracked across all sectors","s":"Food and Ag-ISAC / IT-ISAC 2025 Ransomware Report (via Industrial Cyber and The Record)","u":"https://industrialcyber.co/reports/food-and-ag-isac-reports-82-surge-in-ransomware-attacks-as-qilin-akira-and-cl0p-lead-campaigns-against-sector/"},{"m":"Food & Agriculture sector ransomware incidents in 2024","v":"212 incidents (~5.8% of 3,494 total tracked ransomware incidents)","s":"Food and Ag-ISAC / IT-ISAC 2024 Ransomware Report","u":"https://www.agdaily.com/news/how-ransomware-attacks-impacted-ag-in-2024/"},{"m":"Year-over-year growth in overall ransomware volume (2024 to 2025)","v":"82% increase (3,508 tracked incidents in 2024 to 6,377 in 2025); food & ag attacks roughly doubled year over year","s":"Food and Ag-ISAC 2025 Ransomware Report","u":"https://therecord.media/ransomware-attacks-food-and-ag-double-2025"},{"m":"Top ransomware groups targeting food & agriculture (2025)","v":"Qilin (dominant), Akira, CL0P, Play and Lynx, together nearly 50% of recorded sector incidents","s":"Food and Ag-ISAC 2025 Ransomware Landscape","u":"https://www.foodandag-isac.org/post/navigating-the-2025-food-and-agriculture-sector-ransomware-landscape"},{"m":"Ransomware.live 'Agriculture and Food Production' sector victim postings (cumulative, 2019–2026)","v":"1,219 tracked victim records; top groups LockBit3 (106), Akira (89), Qilin (89), Play (56), LockBit2 (44), Cl0p (43); top country US (321), then Canada, Brazil, Italy, France, Germany, UK, Spain","s":"ransomware.live API v2 (/v2/sectorvictims/Agriculture and Food Production), pulled 2026-07-19","u":"https://api.ransomware.live/v2/sectorvictims/Agriculture%20and%20Food%20Production"},{"m":"Average ransom payment (all sectors, 2024)","v":"$2.0 million average ransom paid (up from ~$400,000 in 2023); overall recovery cost excluding ransom rose to $2.73 million (up ~50%)","s":"Sophos, The State of Ransomware 2024","u":"https://www.sophos.com/en-us/press/press-releases/2024/04/ransomware-payments-increase-500-last-year-finds-sophos-state"},{"m":"Organizations hit by ransomware in the prior year (all sectors, 2024)","v":"59% of organizations reported being hit (down from 66% in the prior two years)","s":"Sophos, The State of Ransomware 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2024"},{"m":"Total cost of an average ransomware attack (all-in, 2024)","v":"~$5.13 million average total cost (ransom + recovery + indirect damage); average downtime ~24 days; ransom often only ~15% of total cost","s":"Industry cost aggregations (PurpleSec / Acronis / Halcyon, 2024–2025)","u":"https://purplesec.us/learn/average-cost-of-ransomware-attacks/"},{"m":"Downtime sensitivity in food & beverage","v":"More than one-third of food & beverage respondents said one hour of operational downtime would cost at least $1 million in revenue, driving high ransom-payment propensity","s":"TXOne Networks, From Farm to Fallout / Food & Beverage cybersecurity analysis","u":"https://txone.com/blog/from-farm-to-fallout-ransomwares-impact-on-the-food-chain"},{"m":"Sector ranking among critical infrastructure (2025)","v":"Food & agriculture is a mid-tier but fast-rising target; critical manufacturing led with 1,440 attacks (22.7%), then commercial facilities 1,107 (17.5%), IT 746 (11.8%), healthcare 580 (9.2%), financial services 463 (7.3%)","s":"Food and Ag-ISAC 2025 Ransomware Report","u":"https://industrialcyber.co/reports/food-and-ag-isac-reports-82-surge-in-ransomware-attacks-as-qilin-akira-and-cl0p-lead-campaigns-against-sector/"}]},{"name":"Construction","tag":"Construction","overview":"The Construction sector (general contractors, engineering/design firms, infrastructure operators, homebuilders, specialty trades, and building-materials suppliers) is one of the most heavily and consistently targeted industries by ransomware groups. Ransomware.live's full victim dataset shows 1,362 distinct Construction-sector victims posted to ransomware leak sites from 2019 through mid-July 2026, with volume climbing sharply from 2021 onward and 2025 alone accounting for 513 posted victims - more than any prior full year (2026 already shows 267 through mid-July). The sector combines several features attackers find attractive: large numbers of small/mid-size subcontractors with weak security maturity sitting inside supply chains for very large general contractors and government owners; time-sensitive, contractually penalized project schedules that increase pressure to pay quickly; large transient, multi-employer workforces with sprawling credential/access footprints; and high-value intellectual property (design/BIM data, bids, proprietary engineering methods) alongside sensitive employee PII (payroll, SSNs) in HR/finance systems. Victims range from small regional contractors to the world's largest construction and infrastructure firms (Ferrovial, Balfour Beatty, Bechtel, Kier Group, Kajima, AECOM, Turner Construction), and the sector has repeatedly been swept up in mass, single-vulnerability exploitation campaigns (e.g., Clop's 2025 Oracle E-Business Suite zero-day campaign) that hit many unrelated construction firms simultaneously through shared enterprise software.","distinct":"1,362 distinct victims posted 2019 through mid-July 2026, with 2025 alone accounting for 513, more than any prior full year, and 267 already recorded through mid-July 2026. Distinguished by project-based rather than continuous operations, low IT maturity relative to revenue, and a highly fragmented subcontractor web that widens the trust boundary. Bid and tender data is uniquely sensitive: its exposure creates competitive rather than regulatory harm. Government-owner project work pulls public-sector data and clearance obligations into scope.","leverage":"Exposure of confidential bid, contract and design data plus project schedule delay and associated liquidated damages; encryption leverage is comparatively weaker.","tolerance":"Moderate to high. Days to weeks. Physical site work continues during an IT outage, though payroll, procurement and design-file access degrade progressively.","bulk":{"total":1362,"years":{"2019":1,"2020":3,"2021":73,"2022":136,"2023":306,"2024":64,"2025":513,"2026":266},"groups":[["akira",135],["qilin",131],["lockbit3",88],["play",82],["dragonforce",61],["lockbit2",47],["alphv",41],["incransom",39]],"countries":[["US",509],["GB",73],["CA",49],["DE",31],["AU",28],["FR",28]],"pressPct":2,"ransomPct":1},"incidents":[{"v":"Ferrovial","g":"AiLock","d":"Claimed July 15, 2026","c":"Spain (global infrastructure operator, Nasdaq/Euronext-listed)","fin":"Not publicly disclosed; no company financial statement or disclosed cost found.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Per HudsonRock infostealer telemetry referenced on the incident's ransomware.live page: 147 compromised employee accounts, 16 compromised user accounts, 106 third-party employee credentials, and 27 external attack-surface exposures identified. Underlying stolen data types/volume from the ransomware group's own leak were not detailed in available sources as of this writing (incident is very recent/still developing).","s":"AiLock, a double-extortion RaaS group active since March 2025, claimed Ferrovial - a global infrastructure and mobility operator involved in construction and design plus toll-road concessions - on its leak site. AiLock's model gives victims a 72-hour response window and up to five days to pay, threatening regulator notification and competitor disclosure if unpaid.","src":["https://www.ransomware.live/id/RmVycm92aWFsQEFpTG9jaw==","https://sosransomware.com/en/ransomware-groups/ailock-ransomware-the-raas-operator-threatening-to-alert-regulators-and-competitors/","https://darkwebinformer.com/ransomware-attack-update-july-14th-2026/"]},{"v":"Balfour Beatty","g":"INC Ransom (Oct 2025); CoinbaseCartel (Apr 2026)","d":"October 12, 2025 and April 8, 2026 (two separate claimed incidents)","c":"United Kingdom (international infrastructure group, LSE-listed)","fin":"Not publicly disclosed for either incident.","ran":"Not publicly disclosed for either incident.","dt":"Not publicly disclosed for either incident.","di":"Leak size described as 'unknown' in available secondary reporting for both incidents; no confirmed data-type breakdown found in public sources.","s":"Balfour Beatty, a leading UK-headquartered international infrastructure group delivering construction, engineering and support services across transportation, power, buildings and civil works in the UK, US and other markets, was claimed by two different ransomware groups within a six-month span: INC Ransom in October 2025 (targeting US operations) and CoinbaseCartel in April 2026 (UK).","src":["https://www.ransomware.live/id/QmFsZm91ciBCZWF0dHlAaW5jcmFuc29t","https://www.ransomware.live/id/QmFsZm91ciBCZWF0dHlAY29pbmJhc2VjYXJ0ZWw","https://www.dexpose.io/coinbasecartel-strikes-balfour-beatty-in-uk-ransomware-attack/","https://www.breachsense.com/breaches/balfour-beatty-data-breach/"]},{"v":"Bechtel Corporation","g":"Clop","d":"Claimed November 20-21, 2025","c":"United States (privately held, one of the world's largest engineering/construction/project-management firms, major US government contractor)","fin":"Not publicly disclosed by Bechtel; no company statement located.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Specific data types/volume exfiltrated from Bechtel were not detailed in available sources; the broader Oracle EBS campaign is understood to have exposed enterprise financial, HR and procurement data (the standard EBS module set) at affected organizations generally.","s":"Bechtel was named by the Clop ransomware group as part of a large-scale extortion wave exploiting a zero-day vulnerability (CVE-2025-61882) in Oracle E-Business Suite. Clop posted roughly 39 victim organizations across many industries within a 24-hour window in this campaign; Clop had earlier exfiltrated data via the Oracle EBS flaw in August 2025 and followed up with mass extortion emails in late September 2025 before publishing leak-site listings in November.","src":["https://www.dexpose.io/clop-ransomware-targets-bechtel-corporation/","https://www.cybersecuritydive.com/news/hackers-clop-extortion-campaign-executives/801808/","https://dailydarkweb.net/clop-ransomware-group-lists-39-global-victims-including-mazda-canon/"]},{"v":"Kier Group plc (KIER.CO.UK)","g":"Clop","d":"Discovered/claimed November 6-7, 2025","c":"United Kingdom (major listed construction, property and infrastructure services company, LSE:KIE)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed; Clop threatened to release data absent negotiation.","dt":"Not publicly disclosed.","di":"Per secondary reporting citing infostealer-derived telemetry on the incident record: 4 employees, 120 users, and 23 third-party employee credentials referenced as compromised/exposed; specific stolen-file categories from the Clop leak itself were not detailed in available sources.","s":"Kier Group, a leading UK construction, civil-engineering, property and infrastructure services company operating across defence, transportation, health, education and utilities, was claimed by Clop as part of the same Oracle E-Business Suite CVE-2025-61882 mass-exploitation campaign that hit Bechtel days later.","src":["https://www.dexpose.io/clop-ransomware-targets-kier-co-uk-in-uk-cyberattack/","https://ransomware.live/id/S0lFUi5DTy5VS0BjbG9w","https://www.breachsense.com/breaches/kier-group-data-breach/"]},{"v":"Kajima Europe","g":"Qilin","d":"Claimed November 22, 2025","c":"United Kingdom / continental Europe operations of Kajima Corporation (Japan, one of the world's largest construction firms)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed/documented in available sources.","di":"Approximately 400 GB of data reported exfiltrated, including engineering documents, CAD designs and blueprints, financial and investment records, construction contracts and procurement documentation, internal communications, subcontractor lists and payment schedules, employee HR files/credentials, and project-management files.","s":"Qilin, one of the most prolific ransomware groups globally in 2025 (claiming roughly 800 victims across 50+ countries since January 2025, and dominant in Europe with 65 Q3-2025 victims per Cyble), claimed Kajima Europe, the European arm of major Japanese construction group Kajima Corporation, exfiltrating a large volume of corporate and project data.","src":["https://www.dexpose.io/qilin-ransomware-strikes-kajima-europe/","https://botcrawl.com/kajima-europe-data-breach/","https://cyble.com/blog/europe-ransomware-attacks-q3-2025/"]},{"v":"AECOM","g":"Pysa","d":"Discovered November 8-9, 2021","c":"United States (Fortune 500 global engineering, design and infrastructure-consulting firm)","fin":"Specific incident-response, remediation or credit-monitoring costs were not publicly disclosed; no stock-impact or insurance-payout figures found in public sources.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Personal information of present and former AECOM employees was exposed, including names, addresses, Social Security numbers, and personal bank account and routing numbers, via compromise of the US payroll system; exact number of employees affected was not confirmed in available public sources.","s":"AECOM was compromised in a payroll-system hack attributed to the Pysa (Mespinoza) ransomware group's double-extortion operators; AECOM subsequently notified current and former employees that their personal data had been exposed and reported the incident to the California Attorney General's office. This is one of the better-documented incidents in the sector because it produced a formal breach notification rather than only a leak-site claim.","src":["https://www.breachsense.com/breaches/aecom-com/","https://www.malwarebytes.com/blog/news/2021/03/pysa-the-ransomware-attacking-schools","https://www.upguard.com/security-report/aecom"]},{"v":"Turner Construction Company","g":"Everest","d":"Discovered March 7, 2022","c":"United States (one of the largest construction management firms in the US)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Not publicly disclosed.","di":"Specific data types/volume were not detailed in available public sources beyond the leak-site listing itself.","s":"Turner Construction Company was listed as a victim by the Everest ransomware group, a double-extortion (and increasingly pure data-extortion) operator active since December 2020 that has targeted government, healthcare, manufacturing and IT-services organizations across North America, Europe and Asia. Turner's inclusion illustrates the group's willingness to target top-tier construction management firms.","src":["https://www.ransomware.live/group/everest","https://cti.fyi/groups/everest.html","https://www.ransomware.live/activity/Construction"]}],"stats":[{"m":"Total Construction-sector victims recorded (all-time, through mid-July 2026)","v":"1,362 victims","s":"ransomware.live (data.ransomware.live/victims.json, filtered to activity=Construction; cross-checked against www.ransomware.live/activity/Construction which independently shows the same 1,362 total)","u":"https://www.ransomware.live/activity/Construction"},{"m":"Construction-sector victims by year (2021-2026, partial 2026)","v":"2021: 73 | 2022: 136 | 2023: 307 | 2024: 62 (likely data-completeness gap) | 2025: 513 | 2026 (through mid-July): 267","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Most active ransomware groups targeting Construction (all-time victim count)","v":"Akira 135, Qilin 131, LockBit3 88, Play 82, DragonForce 61, LockBit2 47, ALPHV/BlackCat 41, Sinobi 39, INC Ransom 39, SafePay 33, 8Base 31, Medusa 30, BianLian 28, Lynx 27, TheGentlemen 25, Clop 23, BlackBasta 21, Cactus 20, LockBit5 20, Conti 18","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Top countries for Construction-sector victims","v":"US 509, GB 73, CA 49, DE 31, AU 28, FR 28, IT 20, CH 16, SG 15, AT 12, ES 11, BR 10, MY 10, SA 9 (383 records had no country coded)","s":"ransomware.live full victim dataset, filtered and aggregated","u":"https://data.ransomware.live/"},{"m":"Percentage of ransomware victims (all industries) who paid the ransom, 2025","v":"49% paid (down from 56% in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average recovery cost excluding ransom payment, 2025 (all industries)","v":"$1.53 million (down 44% from $2.73 million in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Ransom demand/payment size distribution, 2025","v":"57% of ransom demands and 52% of actual payments were $1 million or more; organizations that paid disbursed ~85% of the initial demand on average","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Recovery speed, 2025","v":"53% of victim organizations fully recovered within one week (up from 35% in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Data-theft-plus-encryption rate, construction/property/energy sectors vs. manufacturing","v":"Only ~15% of construction/property/energy organizations faced combined data theft and encryption, versus 39% for manufacturers","s":"Sophos, cited via industry press coverage of Sophos ransomware research (construction/property/energy breakout)","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Ransomware victims who paid, Q4 2024 (all industries)","v":"25% paid (a historic low at time of report)","s":"Coveware Quarterly Ransomware Report, Q4 2024","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average and median ransom payment, Q4 2024 (all industries)","v":"Average payment $553,959 (+16% QoQ); median payment $110,890 (-45% QoQ)","s":"Coveware Quarterly Ransomware Report, Q4 2024","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Total on-chain ransomware payments, 2025 (all industries, global)","v":"More than $820 million (down ~8% YoY from $892 million in 2024), though claimed attacks rose 50% YoY and the median ransom payment grew 368% YoY to nearly $60,000","s":"Chainalysis 2026 Crypto Crime Report (covering 2025 data)","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Global average total cost of a data breach, 2025 (all industries)","v":"$4.44 million","s":"IBM Cost of a Data Breach Report 2025 (via databreachcost.com aggregation; construction is not broken out as a separate sector in IBM's 17-industry taxonomy - closest proxy 'Industrial' sector averaged $5 million)","u":"https://databreachcost.com/by-industry"},{"m":"Ransomware involvement in breaches overall, 2025","v":"Ransomware present in 44% of all reviewed breaches (up from 32% the prior year); 39% of large-enterprise breaches vs. 88% of SMB breach cases involved ransomware (not construction-specific)","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"}]},{"name":"Educational Services","tag":"Education","overview":"The ransomware.live Education sector dataset returned 1,296 named victims spanning 2016 through 20 July 2026. Volume by year shows the sector's escalation and persistence: 2016 (2), 2017 (1), 2018 (2), 2019 (4), 2020 (15), 2021 (74), 2022 (157), 2023 (307), 2024 (248), 2025 (328), and 158 already recorded in the first ~7 months of 2026. 2023 and 2025 are the peak full years; the 2024 dip did not hold, and 2026 is tracking broadly in line with recent years. Attribution is highly fragmented, with 135 distinct groups named. The top claimants across the full period are lockbit3 (114), qilin (73), incransom (72), vicesociety (63), rhysida (57), pysa (50), medusa (45), clop (44), ransomhub (43), and safepay (39); the top ten groups account for only 46.3% of postings, confirming a long tail of smaller and short-lived brands. Composition has shifted materially: restricting to 2025-2026, the leaders become qilin (65), incransom (47), safepay (29), interlock (25), thegentlemen (24), lockbit5 (19), fog (19), nova (18), shinyhunters (14), and rhysida (13) - i.e. LockBit-era dominance and the education-specialist Vice Society and PYSA brands have been displaced by Qilin, INC Ransom, Interlock and SafePay, alongside pure-extortion actors such as ShinyHunters. Geographically the sector is heavily US-weighted: of 947 records with a resolved country, the US accounts for 519 (54.8% of known-country victims, 78 countries represented in total). Other leading countries are GB (66), FR (31), CA (30), BR (28), IN (23), DE (22), AU (21), IT (16), TH (13), ES (9), MX (8), TW (7) and IL (7); 349 records carry no country. By region, Europe accounts for roughly 191 victims, APAC 96, Latin America and the Caribbean 59, and Canada 30. Structurally the sector shows three distinct victim populations that behave very differently: US K-12 districts (overwhelmingly the largest count, typically small IT teams, frequently posted by Interlock, Qilin, Medusa and INC Ransom), universities and research institutions (higher data value, research IP and often regulated health data, targeted by Qilin, Rhysida and Fog), and edtech/SIS/LMS vendors, which are numerically rare but produce catastrophic aggregation events - the PowerSchool SIS compromise (Dec 2024) and the Instructure/Canvas LMS breaches (May 2026) each affected thousands of institutions from a single intrusion. Extortion economics in the leak-site data are modest relative to other sectors: only 12 of 1,296 records carried an explicit ransom figure, clustered between $50,000 and $400,000 (largely Medusa postings against US K-12 districts), with the notable outlier being Asia University, Taiwan (crazyhunter, March 2025) at $1,500,000. Only 21 records disclosed a data volume, ranging from 20MB to 1.5TB. Press coverage is attached to just 170 of 1,296 records (13%), meaning the large majority of education ransomware events receive no public reporting, and loss figures for the sector must be inferred from survey data rather than incident disclosure.","distinct":"1,295 tracked victim records, rising from 15 in 2020 to 307 in 2023 and 328 in 2025, with 157 already in the first seven months of 2026, a sustained upward trajectory. Heavily US-concentrated (519 of 946 country-attributed records) and dominated by LockBit3 (114), Qilin (73), INC Ransom (72), Vice Society (63) and Rhysida (57); the prominence of Vice Society and Rhysida reflects deliberate specialization in schools and universities as soft, data-rich, under-defended targets. Distinctive combination of open-by-design networks, BYOD and research-collaboration culture, minors' data raising notification sensitivity, and constrained appropriated budgets that limit both prevention spend and ransom payment. FERPA is substantively strict but historically weak on financial penalty, so the regulatory tail is thinner than healthcare's at comparable data sensitivity, with state student-privacy statutes and litigation carrying the real exposure. Universities add research IP of nation-state interest.","leverage":"Exposure of student records including minors' data, staff PII and research IP, plus disruption timed to enrollment, examination and term-start pressure points.","tolerance":"Moderate to high in absolute terms, days to weeks absorbed by academic calendars, but sharply lower at term start, enrollment and examination periods. Weak budget capacity for both ransom and rapid restoration means outages run longer than tolerance alone would predict.","bulk":{"total":1298,"years":{"2016":2,"2017":1,"2018":2,"2019":4,"2020":15,"2021":74,"2022":157,"2023":307,"2024":248,"2025":328,"2026":160},"groups":[["lockbit3",114],["qilin",73],["incransom",72],["vicesociety",63],["rhysida",57],["pysa",50],["medusa",45],["clop",44]],"countries":[["US",519],["GB",66],["CA",32],["FR",31],["BR",28],["IN",23]],"pressPct":13,"ransomPct":1},"incidents":[{"v":"PowerSchool (SIS vendor serving K-12 districts in the US, Canada and elsewhere)","g":"Not a named ransomware brand - single-actor extortion; US DOJ charged Matthew D. Lane, then a 19-year-old student at Assumption University","d":"December 2024 (disclosed January 2025; district-level re-extortion May 2025)","c":"US","fin":"Total programme cost not publicly disclosed. PowerSchool offered two years of identity protection and credit monitoring to affected students and educators; class-action litigation followed. Individual district remediation and notification costs were not publicly itemised.","ran":"Approximately $2.85 million in bitcoin demanded and PAID by PowerSchool, per US Department of Justice court documents made public 20 May 2025. Amounts sought in the subsequent district-level extortion attempts were not publicly disclosed.","dt":"No mass encryption event - this was exfiltration-only extortion, so districts did not suffer the closure pattern typical of encryption attacks. Recovery centred on notification, credit monitoring, credential resets and multi-jurisdiction regulatory response, extending well beyond a year and reopening when re-extortion began in May 2025.","di":"The attacker claimed data on 62.4 million students and 9.5 million teachers across approximately 6,505 school districts in the US, Canada and other countries. Exposed fields included names, addresses, dates of birth, contact details, and for some individuals Social Security numbers and medical/grade information. Affected populations are overwhelmingly minors, whose identity exposure persists for decades.","s":"The defining edtech aggregation event. An attacker used compromised credentials to access PowerSchool's PowerSource support portal and exfiltrate student and teacher data from the hosted SIS environment. PowerSchool paid an extortion demand in exchange for a video purporting to show deletion of the only copy of the data. The deletion proved worthless: in May 2025 the same data was used to extort individual school districts directly in Canada and North Carolina, with attackers sending samples to schools. PowerSchool stated it did not believe this was a new intrusion because the samples matched the December theft. This is the clearest available demonstration that paying for a deletion promise transfers no risk downstream, and that a single vendor compromise generates thousands of correlated district-level losses.","src":["https://www.bleepingcomputer.com/news/security/powerschool-hacker-now-extorting-individual-school-districts/","https://techcrunch.com/2025/05/08/powerschool-paid-a-hackers-ransom-but-now-schools-say-they-are-being-extorted/","https://www.edweek.org/technology/powerschool-paid-a-hackers-ransom-now-cyber-criminals-are-threatening-schools/2025/05","https://www.k12dive.com/news/college-student-charged-in-connection-with-powerschool-data-breach/748747/","https://www.cybersecuritydive.co
