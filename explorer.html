atched VSA restored around July 11-12; a universal decryptor was distributed on July 22-23, 2021 to help victims restore data. Recovery for downstream MSP clients ran days to weeks.","di":"Primarily encryption/availability impact rather than mass data theft; up to ~1,500 downstream organizations had systems encrypted.","s":"REvil exploited zero-day vulnerabilities in Kaseya's VSA remote-monitoring-and-management software to push ransomware through ~60 direct MSP customers to their downstream clients, the archetypal IT supply-chain cascade attack.","src":["https://en.wikipedia.org/wiki/Kaseya_VSA_ransomware_attack","https://www.cisa.gov/news-events/alerts/2021/07/04/cisa-fbi-guidance-msps-and-their-customers-affected-kaseya-vsa-supply-chain-ransomware-attack","https://www.csoonline.com/article/571081/the-kaseya-ransomware-attack-a-timeline.html"]},{"v":"Progress Software (MOVEit Transfer)","g":"Clop (Cl0p / TA505)","d":"2023-05-27","c":"United States","fin":"Aggregate downstream cost estimated by Emsisoft at roughly $10.6B-$15.8B (using IBM's per-record cost); some scaled estimates ran far higher. Progress Software's own direct costs not fully disclosed; it faced an SEC investigation and dozens of class-action lawsuits (40M+ claimants).","ran":"Clop did not encrypt systems; it demanded extortion payments from individual victim organizations (amounts varied and were not publicly itemized). Many victims declined to pay.","dt":"This was a data-theft (not encryption) event, so impact was breach-remediation and notification rather than operational downtime; remediation and victim-notification stretched over many months into 2024.","di":"Over 2,700 organizations confirmed impacted and approximately 93.3 million individuals' personal data exposed (estimates ranged 64M-95M+ over time).","s":"Clop mass-exploited a zero-day SQL-injection flaw (CVE-2023-34362) in Progress Software's MOVEit managed-file-transfer product to steal data from thousands of organizations worldwide, one of the largest supply-chain data-extortion campaigns on record.","src":["https://en.wikipedia.org/wiki/2023_MOVEit_data_breach","https://www.emsisoft.com/en/blog/44123/unpacking-the-moveit-breach-statistics-and-analysis/","https://techcrunch.com/2023/08/25/moveit-mass-hack-by-the-numbers/","https://www.cybersecuritydive.com/news/progress-software-moveit-meltdown/703659/"]},{"v":"CDK Global","g":"BlackSuit","d":"2024-06-18","c":"United States","fin":"Anderson Economic Group estimated total dealer losses exceeding $1 billion (revised up from ~$944M) from roughly two-plus weeks of disruption.","ran":"BlackSuit initially demanded ~$10M, reportedly escalating toward $50M+. CDK is widely reported to have paid approximately $25 million in Bitcoin (wallets tied to BlackSuit received ~$25M about two days after the attack, per CyberScoop).","dt":"Dealerships reverted to manual/pen-and-paper processes for nearly two weeks; CDK announced services restored for nearly all dealerships by around July 4, 2024.","di":"Primarily operational outage; extent of any data exfiltration less publicly quantified than the operational and financial disruption.","s":"BlackSuit ransomware crippled CDK Global's Dealer Management System SaaS, which powers operations for ~15,000 auto dealerships across the U.S. and Canada; a second intrusion during recovery on June 19 prolonged the outage.","src":["https://cyberscoop.com/cdk-ransom-blacksuit-25-million/","https://www.techtarget.com/whatis/feature/The-CDK-Global-outage-Explaining-how-it-happened","https://www.blackfog.com/cdk-global-ransomware-attack/"]},{"v":"Ingram Micro","g":"SafePay","d":"2025-07-03","c":"United States","fin":"Specific revenue loss not publicly disclosed; multi-day global halt of order processing at a distributor with ~$48B annual revenue implies material lost/delayed transactions, though the company did not quantify it publicly.","ran":"Ransom amount not publicly disclosed; on July 29-30, 2025 SafePay threatened to leak ~3.5TB of allegedly stolen data unless paid. No confirmation of payment.","dt":"Systems failed around 8:00 AM ET on July 3; website and staged order processing resumed July 7-8; the company reported operations back to normal worldwide by July 9, 2025.","di":"Reported exposure of personal data of over 42,000 employees and applicants; SafePay claimed ~3.5TB of data.","s":"SafePay ransomware caused a global outage at Ingram Micro, one of the world's largest IT distributors; intrusion is attributed to compromised credentials on the Palo Alto GlobalProtect VPN, halting worldwide order processing.","src":["https://www.bleepingcomputer.com/news/security/ingram-micro-outage-caused-by-safepay-ransomware-attack/","https://www.darkreading.com/cyberattacks-data-breaches/ransomware-attack-outage-ingram-micro","https://www.webpronews.com/ingram-micro-ransomware-attack-by-safepay-exposes-42000-employee-records/"]},{"v":"Quanta Computer (Apple supplier)","g":"REvil / Sodinokibi","d":"2021-04-20","c":"Taiwan","fin":"Not publicly disclosed. Impact was primarily reputational and IP-confidentiality loss (leaked device blueprints) rather than reported revenue loss.","ran":"REvil demanded $50 million, reportedly escalating toward $100M; the ransom was not paid by Quanta (and REvil eventually removed the leaked files). No confirmed payment.","dt":"Operational downtime not the primary reported impact; this was chiefly a data-exfiltration/IP-leak extortion event.","di":"Theft and partial publication of confidential design schematics/blueprints for unreleased Apple devices (MacBook, Apple Watch drawings).","s":"After Quanta (a major Apple ODM) declined to pay, REvil pivoted to extort Apple directly, publishing stolen schematics for unreleased products, timed to Apple's 'Spring Loaded' launch event, a landmark IP-theft extortion in the tech hardware supply chain.","src":["https://www.techrepublic.com/article/apple-supplier-quanta-hit-with-50-million-ransomware-attack-from-revil/","https://www.forbes.com/sites/daveywinder/2021/04/23/ransomware-gang-demands-50-million-for-apple-watch-and-macbook-pro-blueprints/","https://www.cnbc.com/2021/04/23/axis-of-revil-inside-the-hacker-collective-taunting-apple.html"]},{"v":"Software AG","g":"Clop (Cl0p)","d":"2020-10-03","c":"Germany","fin":"Direct financial loss not fully disclosed; the company reported internal-network disruption but said customer-facing cloud services were unaffected.","ran":"Clop demanded approximately $23 million. Software AG refused to pay.","dt":"Internal network, help desk and some internal communications were disrupted for a period in October 2020; customer cloud services remained operational.","di":"About 1TB of data stolen, including employee passport/ID data, health-related documents and internal emails; screenshots and files leaked publicly after negotiations broke down.","s":"Clop ransomware struck German enterprise-software giant Software AG, encrypting internal systems and stealing about 1TB of data, then publishing files after the company refused to negotiate, an early high-profile double-extortion case in the software industry.","src":["https://www.bleepingcomputer.com/news/security/software-ag-it-giant-hit-with-23-million-ransom-by-clop-ransomware/","https://threatpost.com/software-ag-data-clop-ransomware/160042/","https://www.infosecurity-magazine.com/news/software-ag-datastealing/"]},{"v":"Tata Technologies","g":"Hunters International","d":"2025-01","c":"India","fin":"Not publicly disclosed; the company said client-delivery services remained unaffected. No quantified revenue loss reported.","ran":"Specific ransom amount not disclosed; Hunters International threatened public release of the data and, when unpaid, leaked it (~730,000 files) on its dark-web site in March 2025.","dt":"Temporary disruption to some IT services per the January stock-exchange disclosure; client delivery reported unaffected. Detailed recovery timeline not publicly quantified.","di":"Claimed theft of 1.4TB (~730,000 files) including current/former employee personal details, purchase orders and confidential customer contracts (India and U.S. customers).","s":"Hunters International claimed a January 2025 ransomware attack on Tata Technologies (engineering/IT-services arm of the Tata group), later leaking 1.4TB of stolen data; Tata Motors disclosed a ransomware incident to Indian stock exchanges.","src":["https://www.bleepingcomputer.com/news/security/hunters-international-ransomware-claims-attack-on-tata-technologies/","https://techcrunch.com/2025/03/11/tata-technologies-data-leaked-by-ransomware-gang/","https://securityaffairs.com/174953/data-breach/ransomware-group-hunters-international-claims-to-have-hacked-tata-technologies.html","https://www.bleepingcomputer.com/news/security/indian-tech-giant-tata-technologies-hit-by-ransomware-attack/"]},{"v":"QuickLogic Corporation","g":"not publicly disclosed","d":"January 20, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company has continued its business operations during this incident and successfully restored all of its critical operational data.","di":"not publicly disclosed","s":"On January 20, 2023, QuickLogic Corporation detected a ransomware infection affecting a limited number of IT systems. The Company promptly began an assessment, notified law enforcement, and engaged cybersecurity professionals to investigate the incident.","src":["https://www.sec.gov/Archives/edgar/data/882508/000143774923006511/ex_488676.htm"]},{"v":"NCR Corporation","g":"not publicly disclosed","d":"2023-04-17","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"On April 17, 2023, NCR Corporation announced that a single data center outage affecting some functionality for its commerce customers was caused by a cyber ransomware incident. The company is assessing the impact of the incident on its operations and financial results.","src":["https://www.sec.gov/Archives/edgar/data/70866/000119312523103016/d472247d8k.htm","https://www.sec.gov"]},{"v":"Dish Network","g":"Black Basta","d":"February 23, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"massive outage that affected its websites and apps","di":"296,851 individuals affected; exposed information includes names, personal identifiers, driver's license numbers, health insurance information, and COVID-19 vaccination status","s":"Dish Network experienced a ransomware attack on February 23, 2023, which likely resulted in the payment of a ransom based on the company's communications. The attack compromised confidential records and sensitive information of current and former employees, but customer data was not affected. The incident has led to multiple class-action lawsuits against the company for alleged cybersecurity failures.","src":["https://www.bleepingcomputer.com/news/security/dish-network-likely-paid-ransom-after-recent-ransomware-attack/","https://www.sec.gov/Archives/edgar/data/1001082/000155837023002254/dish-20230223x8k.htm"]},{"v":"NCR Voyix Corporation","g":"not publicly disclosed","d":"April 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"NCR Voyix Corporation experienced a ransomware incident in April 2023, which impacted its business operations. The company has since been working on efforts to prevent or mitigate such incidents in the future.","src":["https://www.sec.gov/Archives/edgar/data/70866/000007086624000023/exhibit992-q12024callsli.htm"]},{"v":"AFG Companies, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"AFG Companies, Inc. is facing a lawsuit from Brand Engagement Network Inc. (BEN) for allegedly concealing a ransomware attack on their network prior to an agreement signed in August 2023. The lawsuit claims that this concealment hindered BEN's ability to deliver AI solutions to automotive dealerships, causing significant delays and damaging trust in the partnership.","src":["https://www.sec.gov/Archives/edgar/data/1838163/000149315225002670/ex99-1.htm"]},{"v":"Rackspace Technology","g":"Play ransomware","d":"late 2022","c":"not publicly disclosed","fin":"~$30M","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Rackspace Technology experienced a ransomware attack at the end of 2022, which was highly publicized and resulted in a loss of approximately $30 million in high-margin revenue. The company has since implemented a strategy to transform its business and mitigate the impact of the attack.","src":["https://www.sec.gov/Archives/edgar/data/1810019/000181001924000029/rxtlenderpresentationcle.htm","https://www.bleepingcomputer.com/news/security/new-play-ransomware-linux-version-targets-vmware-esxi-vms/"]},{"v":"Ingram Micro Holding Corporation","g":"not publicly disclosed","d":"July 5, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company is working diligently to restore the affected systems to process and ship orders.","di":"not publicly disclosed","s":"Ingram Micro identified ransomware on certain internal systems and took steps to secure the environment, including taking systems offline. The Company is investigating the incident with cybersecurity experts and has notified law enforcement.","src":["https://www.sec.gov/Archives/edgar/data/1897762/000162828025034372/pressrelease-cybersecurity.htm"]},{"v":"Data I/O Corporation","g":"not publicly disclosed","d":"August 16, 2025","c":"USA","fin":"$180,000","ran":"not publicly disclosed","dt":"All systems operational with no impact to customers or orders; incident contained and remediated.","di":"not publicly disclosed","s":"Data I/O Corporation reported a ransomware incident that was identified on August 16, 2025. The attack was not targeted and originated from a vulnerability in a third-party firewall service. The company has restored all systems and believes there was no revenue loss due to the incident.","src":["https://www.sec.gov/Archives/edgar/data/351998/000165495425010613/daio_ex990.htm"]},{"v":"Trio-Tech International","g":"not publicly disclosed","d":"2026-03-11","c":"Singapore","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The subsidiary took its network offline and is in the process of restoring affected systems.","di":"The scope of the data potentially affected has not yet been fully determined.","s":"On March 11, 2026, Trio-Tech International's subsidiary in Singapore experienced a ransomware incident that resulted in the encryption of certain files. The incident escalated on March 18, leading to the unauthorized disclosure of company data, prompting the company to activate response protocols and notify law enforcement.","src":["https://www.sec.gov/Archives/edgar/data/732026/000143774926009193/trt20260320_8k.htm"]},{"v":"Brand Engagement Network Inc.","g":"not publicly disclosed","d":"2025-01-16","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Brand Engagement Network Inc. reported a ransomware attack on its network shortly before the termination of an Exclusive Reseller Agreement with AFG Companies, Inc. The company has filed a lawsuit against AFG alleging fraudulent misrepresentation and breach of contract related to the attack.","src":["https://www.sec.gov/Archives/edgar/data/1838163/000149315225002670/form8-k.htm"]},{"v":"SonicWall","g":"INC Ransomware","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"CISA has confirmed that ransomware gangs are exploiting vulnerabilities in SonicWall's SMA1000 appliances. The vulnerabilities, tracked as CVE-2026-15409 and CVE-2026-15410, have been linked to the deployment of custom malware by a threat actor identified as UTA0533.","src":["https://www.bleepingcomputer.com/news/security/cisa-sonicwall-sma1000-flaws-now-exploited-by-ransomware-gangs/"]},{"v":"Palo Alto Networks","g":"Qilin","d":"June 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Qilin ransomware gang exploited a critical vulnerability in Palo Alto Networks' GlobalProtect VPN to breach networks and deploy ransomware. Multiple distinct intrusions were reported in June 2026, leading to domain-wide encryption and suggesting ongoing exploitation of the flaw.","src":["https://www.bleepingcomputer.com/news/security/critical-globalprotect-vpn-bug-now-exploited-in-ransomware-attacks/"]},{"v":"Langflow","g":"JadePuffer","d":"not publicly disclosed","c":"not publicly disclosed","fin":"$75,000 to $500,000 per model","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The JadePuffer threat actor has launched a ransomware attack targeting AI model data using a custom malware called EncForge. This ransomware specifically encrypts AI assets such as training datasets and model checkpoints, potentially costing organizations significant time and financial resources to recover.","src":["https://www.bleepingcomputer.com/news/security/jadepuffer-agentic-attacks-now-target-ai-model-data-with-ransomware/"]},{"v":"Trellix","g":"RansomHouse","d":"2025-04-17","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Trellix, an international cybersecurity firm, experienced a breach of its source code repository, claimed by the RansomHouse hackers. The threat actor leaked a small set of images as proof and indicated that data encryption occurred during the intrusion. Trellix is currently investigating the incident and has notified law enforcement.","src":["https://www.bleepingcomputer.com/news/security/trellix-source-code-breach-claimed-by-ransomhouse-hackers/"]},{"v":"cPanel users","g":"Sorry ransomware","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"A critical flaw in cPanel, tracked as CVE-2026-41940, is being exploited in mass ransomware attacks by the Sorry ransomware group. The attacks have compromised at least 44,000 IP addresses running cPanel, encrypting files and demanding ransom payments from victims.","src":["https://www.bleepingcomputer.com/news/security/critrical-cpanel-flaw-mass-exploited-in-sorry-ransomware-attacks/"]},{"v":"Cisco","g":"Interlock","d":"March 4, 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Interlock ransomware gang exploited a zero-day vulnerability in Cisco's Secure Firewall Management Center software, allowing remote code execution. Cisco patched the flaw on March 4, 2026, after it was exploited for over a month, impacting multiple organizations.","src":["https://www.bleepingcomputer.com/news/security/interlock-ransomware-exploited-secure-fmc-flaw-in-zero-day-attacks-since-january/"]},{"v":"DigitalMint","g":"BlackCat (ALPHV)","d":"not publicly disclosed","c":"United States","fin":"$26,793,000 and $25,660,000","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The U.S. Department of Justice charged Angelo Martino, a former employee of DigitalMint, for conspiracy related to his involvement with the BlackCat ransomware operation. Martino and accomplices were accused of demanding ransom payments while threatening to leak stolen data from victims' networks, with at least five U.S. organizations affected, including a nonprofit and a financial services firm that paid significant ransoms.","src":["https://www.bleepingcomputer.com/news/security/us-charges-another-ransomware-negotiator-linked-to-blackcat-attacks/"]},{"v":"Marquis Software Solutions","g":"not publicly disclosed","d":"August 14, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Marquis Software Solutions experienced a ransomware attack on August 14, 2025, after hackers breached its network via a compromised SonicWall firewall. The attackers stole files containing personal information from business partners, affecting operations at 74 U.S. banks and leading Marquis to file a lawsuit against SonicWall for negligence and misrepresentation.","src":["https://www.bleepingcomputer.com/news/security/marquis-sues-sonicwall-over-backup-breach-that-led-to-ransomware-attack/"]},{"v":"Advantest Corporation","g":"not publicly disclosed","d":"February 15","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Advantest Corporation, a Japanese tech giant, was targeted in a ransomware attack that may have affected customer or employee data. The company detected unusual activity in its IT environment on February 15 and is currently investigating the incident with the help of third-party cybersecurity specialists.","src":["https://www.bleepingcomputer.com/news/security/japanese-tech-giant-advantest-hit-by-ransomware-attack/"]},{"v":"SmarterTools","g":"Warlock ransomware gang","d":"January 29","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"impacted systems were isolated, and data was restored from fresh backups","di":"12 Windows servers compromised; customer data not directly impacted","s":"SmarterTools confirmed a breach by the Warlock ransomware gang, which exploited a vulnerability in its SmarterMail software. Although the attackers gained access to the network, encryption of data was prevented by security measures, and the company restored data from backups.","src":["https://www.bleepingcomputer.com/news/security/hackers-breach-smartertools-network-using-flaw-in-its-own-software/"]},{"v":"Hitachi Vantara","g":"Akira","d":"2025-04-26","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Hitachi Vantara took servers offline to contain the incident and is working with third-party experts to remediate the situation and bring systems back online.","di":"not publicly disclosed","s":"Hitachi Vantara experienced a ransomware attack attributed to the Akira group, leading to the company taking servers offline to contain the incident. The attack disrupted some systems, but customers with self-hosted environments could still access their data as usual.","src":["https://www.bleepingcomputer.com/news/security/hitachi-vantara-takes-servers-offline-after-akira-ransomware-attack/"]},{"v":"Microsoft","g":"not publicly disclosed","d":"October 27, 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"1 ShibaCoin","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Two malicious VSCode Marketplace extensions were found deploying in-development ransomware, exposing gaps in Microsoft's review process. The extensions, which were downloaded a few times before removal, contained a PowerShell command that downloaded ransomware from a remote server, encrypting files in a specific folder and demanding payment in ShibaCoin for recovery.","src":["https://www.bleepingcomputer.com/news/security/vscode-extensions-found-downloading-early-stage-ransomware/"]},{"v":"Forescout","g":"Mora_001","d":"January 2025","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Mora_001 ransomware group has been exploiting Fortinet vulnerabilities to deploy a custom ransomware strain called SuperBlack. The attacks involve gaining super admin privileges, stealing data, and encrypting files for double extortion, with evidence suggesting links to the LockBit ransomware operation.","src":["https://www.bleepingcomputer.com/news/security/new-superblack-ransomware-exploits-fortinet-auth-bypass-flaws/"]},{"v":"Lee Enterprises","g":"Qilin","d":"February 3, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"significant operational disruptions, losing access to internal systems and cloud storage, corporate VPNs not working","di":"120,000 files totaling 350GB, including government ID scans, non-disclosure agreements, financial spreadsheets, contracts/agreements, and other confidential documents","s":"Lee Enterprises was attacked by the Qilin ransomware gang on February 3, 2025, leading to significant operational disruptions and the encryption of critical applications. The attackers have threatened to leak 120,000 stolen files unless a ransom is paid by March 5, 2025.","src":["https://www.bleepingcomputer.com/news/security/qilin-ransomware-claims-attack-at-lee-enterprises-leaks-stolen-data/"]},{"v":"Atos","g":"Space Bears","d":"December 28, 2024","c":"France","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Atos, a French government contractor, denied claims by the Space Bears ransomware gang that they compromised one of its databases. The group threatened to leak stolen data on their dark web site, but Atos stated there was no evidence of a breach affecting their systems and that they had received no ransom demand.","src":["https://www.bleepingcomputer.com/news/security/french-govt-contractor-atos-denies-space-bears-ransomware-attack-claims/"]},{"v":"Snowflake","g":"not publicly disclosed","d":"April 2024","c":"not publicly disclosed","fin":"$2.5 million","ran":"$2.5 million","dt":"not publicly disclosed","di":"hundreds of millions of individuals affected, including 109 million call logs from AT&T and 560 million customers from TicketMaster","s":"In April 2024, threat actors exploited compromised credentials to access customer accounts on the Snowflake cloud data platform, exporting databases and extorting companies to prevent public release of the data. The attacks affected numerous organizations, including AT&T and TicketMaster, leading to significant data exposure and financial demands.","src":["https://www.bleepingcomputer.com/news/security/the-biggest-cybersecurity-and-cyberattack-stories-of-2024/"]},{"v":"Cleo","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Clop ransomware gang has claimed responsibility for data theft attacks against Cleo, utilizing zero-day vulnerabilities to breach corporate networks and steal data. The gang confirmed they are behind the exploitation of vulnerabilities CVE-2024-50623 and CVE-2024-55956, which allowed them to gain unauthorized access and install backdoors for further data theft.","src":["https://www.bleepingcomputer.com/news/security/clop-ransomware-claims-responsibility-for-cleo-data-theft-attacks/"]},{"v":"Blue Yonder","g":"Termite","d":"November 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Blue Yonder has since brought back online some of the impacted customers and is now working with external cybersecurity experts to help others return to normal business operations.","di":"680GB of files including database dumps, email lists for future attacks (over 16000), documents (over 200000), reports, insurance documents.","s":"Blue Yonder, a SaaS provider, was breached by the Termite ransomware gang in November 2023. The attackers claimed to have stolen 680GB of data and caused significant operational disruptions for Blue Yonder's customers, including major retailers. The company is currently investigating the claims and working to restore services for affected clients.","src":["https://www.bleepingcomputer.com/news/security/blue-yonder-saas-giant-breached-by-termite-ransomware-gang/"]},{"v":"Zyxel Europe","g":"Helldown","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Helldown ransomware operation exploits vulnerabilities in Zyxel firewalls to breach networks, steal data, and encrypt devices. As of November 7, 2024, Helldown listed 31 victims on its extortion portal, including Zyxel Europe, indicating a potential ransom payment by some victims.","src":["https://www.bleepingcomputer.com/news/security/helldown-ransomware-exploits-zyxel-vpn-flaw-to-breach-networks/"]},{"v":"Veeam","g":"Frag","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"A critical vulnerability in Veeam Backup Replication software was exploited to deploy Frag ransomware, following similar attacks by Akira and Fog ransomware groups. The vulnerability allowed threat actors to gain remote code execution and access backup data, leading to the deployment of the Frag ransomware on compromised networks.","src":["https://www.bleepingcomputer.com/news/security/critical-veeam-rce-bug-now-used-in-frag-ransomware-attacks/"]},{"v":"Young Consulting (now Connexure)","g":"BlackSuit","d":"April 10, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"950,000 records; full names, Social Security numbers (SSNs), dates of birth, insurance claim information","s":"Young Consulting, a software solutions provider, suffered a ransomware attack by BlackSuit on April 10, 2024, leading to the exposure of sensitive data of 950,000 individuals. The company began notifying affected individuals about the breach and offered complimentary credit monitoring services after discovering the attack three days later when the attackers triggered encryption of their systems.","src":["https://www.bleepingcomputer.com/news/security/blacksuit-ransomware-stole-data-of-950-000-from-software-vendor/"]},{"v":"Young Consulting (Connexure)","g":"BlackSuit","d":"April 10, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"950,000 records; full names, Social Security numbers (SSNs), dates of birth, insurance claim information","s":"Young Consulting, a software solutions provider, was attacked by the BlackSuit ransomware on April 10, 2024, leading to the theft of sensitive data from approximately 950,000 individuals. The company began notifying affected individuals about the breach and offered complimentary credit monitoring services after discovering the attack three days later when the attackers triggered encryption of their systems.","src":["https://www.bleepingcomputer.com/news/security/blacksuit-ransomware-stole-data-of-950-000-from-software-vendor/"]},{"v":"AnyDesk users","g":"Mad Liberator","d":"July 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Mad Liberator gang targets AnyDesk users by using a fake Windows update screen to distract victims while exfiltrating data. They do not encrypt data but drop ransom notes, threatening to publish stolen files if their demands are not met.","src":["https://www.bleepingcomputer.com/news/security/new-mad-liberator-gang-uses-fake-windows-update-screen-to-hide-data-theft/"]},{"v":"Progress Software","g":"Clop","d":"","c":"not publicly disclosed","fin":"$75-100 million","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"95 million people affected, data types not specified","s":"The SEC has concluded its investigation into Progress Software's handling of the MOVEit Transfer zero-day flaw that exposed data of over 95 million people. The Clop ransomware gang exploited this vulnerability to conduct a large-scale data theft campaign affecting numerous organizations worldwide.","src":["https://www.bleepingcomputer.com/news/security/sec-ends-probe-into-moveit-attacks-impacting-95-million-people/"]},{"v":"Austal USA, Hoya, Integris Health, Fred Hutch Cancer Center","g":"Hunters International","d":"January 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Hunters International ransomware group is targeting IT workers with a new malware called SharpRhino, which facilitates initial infection and privilege escalation. The group has been active in 2024, announcing 134 ransomware attacks against various organizations worldwide, including notable victims such as Austal USA and Hoya.","src":["https://www.bleepingcomputer.com/news/security/hunters-international-ransomware-gang-targets-it-workers-with-new-sharprhino-malware/"]},{"v":"Federal Civilian Executive Branch agencies","g":"Storm-0506, Storm-1175, Octo Tempest, Manatee Tempest","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"causing outages and disrupting business operations","di":"sensitive data from VMs","s":"CISA has warned that a VMware ESXi authentication bypass vulnerability (CVE-2024-37085) is being exploited in ransomware attacks by several gangs. These attackers gain admin privileges on hypervisors, steal sensitive data, and encrypt the file system, leading to significant operational disruptions.","src":["https://www.bleepingcomputer.com/news/security/cisa-warns-of-vmware-esxi-bug-exploited-in-ransomware-attacks/"]},{"v":"KADOKAWA corporation","g":"BlackSuit","d":"June 8, 2023","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most operations continue to be impacted, with all Niconico services still suspended. Accounting functions expected to be restored in early July.","di":"Contacts, confidential documents, employee data, business plans, and financial data.","s":"The BlackSuit ransomware gang claimed a cyberattack on KADOKAWA corporation, threatening to publish stolen data if a ransom is not paid. The attack, which occurred on June 8, has caused significant service outages across the company's operations, including its subsidiary Niconico.","src":["https://www.bleepingcomputer.com/news/security/blacksuit-ransomware-gang-claims-attack-on-kadokawa-corporation/"]},{"v":"Redis servers","g":"not publicly disclosed","d":"May 16, 2024","c":"not publicly disclosed","fin":"$10,000","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"P2PInfect botnet has activated a ransomware module targeting Redis servers, encrypting files with specific extensions and appending '.encrypted' to them. The ransomware operates with limited privileges, primarily affecting configuration files due to Redis's in-memory deployment.","src":["https://www.bleepingcomputer.com/news/security/p2pinfect-botnet-targets-redis-servers-with-new-ransomware-module/"]},{"v":"Philadelphia Inquirer","g":"Cuba ransomware","d":"May 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The attack disrupted the publication of the print newspaper, with home-delivery subscribers asked to catch up with the latest news using the newspaper's website, which remained unaffected.","di":"25,549 individuals affected; personal and financial information including names, financial account numbers, credit/debit card numbers, security codes, access codes, passwords, or PINs.","s":"In May 2023, the Philadelphia Inquirer experienced a security breach where attackers stole personal and financial information of over 25,000 individuals. The Cuba ransomware gang claimed responsibility for the attack, stating they had stolen various financial documents and threatened to leak them, although the newspaper disputed the authenticity of the leaked files.","src":["https://www.bleepingcomputer.com/news/security/philadelphia-inquirer-data-of-over-25-000-people-stolen-in-2023-breach/"]},{"v":"CD Projekt Red, Cisco","g":"HelloGookie","d":"October 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"450 GB of source code and internal information, including source code for Witcher 3, Gwent, Cyberpunk 2077, and Cisco network information","s":"The HelloKitty ransomware operation has rebranded to HelloGookie and released sensitive data from previous attacks on CD Projekt Red and Cisco. This includes source code for popular games and internal Cisco information, alongside decryption keys for older ransomware victims.","src":["https://www.bleepingcomputer.com/news/security/hellokitty-ransomware-rebrands-releases-cd-projekt-and-cisco-data/"]},{"v":"CD Projekt Red and Cisco","g":"HelloGookie","d":"October 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"450 GB of source code and internal information, including source code for Witcher 3, Gwent, Cyberpunk 2077, and various console SDKs","s":"The HelloKitty ransomware operation has rebranded to HelloGookie, releasing previously stolen data from CD Projekt Red and Cisco. This includes source code for popular games and internal information, along with decryption keys for older attacks. The threat actor claims to be the original creator of HelloKitty and has launched a new dark web portal for their operations.","src":["https://www.bleepingcomputer.com/news/security/hellokitty-ransomware-rebrands-releases-cd-projekt-and-cisco-data/"]},{"v":"Xplain","g":"Play","d":"May 23, 2023","c":"Switzerland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"65,000 government documents leaked, including personal data (names, email addresses, telephone numbers, and addresses), technical details, classified information, and account passwords","s":"Xplain, a Swiss technology provider, was attacked by the Play ransomware gang on May 23, 2023, leading to the leak of 65,000 sensitive government documents. The leaked data, which includes personal and classified information, was published on the darknet in early June 2023, prompting an investigation by the Swiss government.","src":["https://www.bleepingcomputer.com/news/security/switzerland-play-ransomware-leaked-65-000-government-documents/"]},{"v":"Insomniac Games","g":"Rhysida","d":"November 2023","c":"USA","fin":"not publicly disclosed","ran":"$2 million","dt":"not publicly disclosed","di":"over 1.3 million files, including personal information of employees, former employees, and independent contractors","s":"Insomniac Games, a subsidiary of Sony, experienced a ransomware attack by the Rhysida group, resulting in the theft and online leak of personal information belonging to employees. After refusing to pay a $2 million ransom, the group leaked 1.67 TB of documents, including sensitive employment data and internal documents.","src":["https://www.bleepingcomputer.com/news/security/insomniac-games-alerts-employees-hit-by-ransomware-data-breach/"]},{"v":"Blackbaud","g":"not publicly disclosed","d":"May 2020","c":"United States","fin":"$250,000","ran":"24 Bitcoin (worth around $250,000 at the time)","dt":"not publicly disclosed","di":"over 13,000 Blackbaud business customers and their clients, including banking information, social security numbers, and plaintext credentials","s":"Blackbaud experienced a ransomware attack in May 2020, leading to a data breach that affected millions of individuals. The company paid a ransom of 24 Bitcoin after the attackers threatened to leak the stolen data, which included sensitive personal information from over 13,000 customers.","src":["https://www.bleepingcomputer.com/news/security/ftc-orders-blackbaud-to-boost-security-after-massive-data-breach/"]},{"v":"Tietoevry","g":"Akira","d":"2024-01-20","c":"Sweden","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company is in the process of restoring infrastructure and services, but customers remain impacted as servers are brought back online.","di":"not publicly disclosed","s":"Tietoevry, a Finnish IT services company, suffered an Akira ransomware attack that impacted one of its data centers in Sweden, causing outages for multiple customers including Filmstaden and various universities and government agencies. The attack encrypted virtualization and management servers, leading to significant disruptions in services.","src":["https://www.bleepingcomputer.com/news/security/tietoevry-ransomware-attack-causes-outages-for-swedish-firms-cities/"]},{"v":"Xerox Business Solutions (XBS)","g":"INC Ransomware","d":"January 2nd 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"limited amount of personal information possibly exposed","s":"Xerox Business Solutions (XBS) suffered a ransomware attack claimed by the INC Ransomware group. The attack resulted in a limited amount of personal information being potentially exposed, according to Xerox Corporation's statement.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-january-5th-2024-secret-decryptors/"]},{"v":"HTC Global Services","g":"ALPHV","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"HTC Global Services confirmed a cyberattack after the ALPHV ransomware gang leaked screenshots of stolen data online. The leaked data includes sensitive information such as passports, contact lists, emails, and confidential documents. The company is investigating the incident and has engaged cybersecurity experts to address the situation.","src":["https://www.bleepingcomputer.com/news/security/htc-global-services-confirms-cyberattack-after-data-leaked-online/"]},{"v":"Qlik","g":"Cactus ransomware","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Cactus ransomware has been exploiting critical vulnerabilities in the Qlik Sense data analytics solution to breach networks. The attackers deploy the ransomware after gaining access through these vulnerabilities, utilizing various tools to maintain persistence and exfiltrate data.","src":["https://www.bleepingcomputer.com/news/security/cactus-ransomware-exploiting-qlik-sense-flaws-to-breach-networks/"]},{"v":"Black Basta","g":"Black Basta","d":"April 2022","c":"not publicly disclosed","fin":"at least $107 million","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Black Basta ransomware, a Russian-linked group, has extorted at least $107 million from over 90 victims since its emergence in April 2022. The group employs double-extortion tactics, stealing sensitive data before encrypting systems and threatening to publish the data if ransoms are not paid. Notable victims include the American Dental Association and Capita, among others.","src":["https://www.bleepingcomputer.com/news/security/black-basta-ransomware-made-over-100-million-from-extortion/"]},{"v":"MeridianLink","g":"ALPHV/BlackCat","d":"November 7, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"minimal business interruption","di":"not publicly disclosed","s":"The ALPHV/BlackCat ransomware gang filed a complaint with the U.S. SEC against MeridianLink for not disclosing a cyberattack that allegedly impacted customer data. The gang claims to have stolen data from MeridianLink's network without encrypting it and threatened to leak the data unless a ransom is paid within 24 hours.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-files-sec-complaint-over-victims-undisclosed-breach/"]},{"v":"SysAid","g":"Lace Tempest","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Threat actors exploited a zero-day vulnerability in SysAid's IT service management software to deploy Clop ransomware and exfiltrate data. The vulnerability, identified as CVE-2023-47246, allowed unauthorized code execution, leading to the installation of additional malware and data theft.","src":["https://www.bleepingcomputer.com/news/security/microsoft-sysaid-zero-day-flaw-exploited-in-clop-ransomware-attacks/"]},{"v":"Atlassian","g":"Cerber","d":"November 5, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Attackers exploited a critical vulnerability in Atlassian Confluence to deploy Cerber ransomware, encrypting victims' files. The vulnerability, tracked as CVE-2023-22518, was actively targeted following the release of a proof-of-concept exploit, leading to multiple attacks against exposed Confluence servers.","src":["https://www.bleepingcomputer.com/news/security/critical-atlassian-confluence-bug-exploited-in-cerber-ransomware-attacks/"]},{"v":"Sony Interactive Entertainment","g":"Clop","d":"May 28, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The platform was taken offline on June 2, 2023, and the vulnerability was remediated.","di":"6,791 individuals affected; personal information exposed.","s":"Sony Interactive Entertainment experienced a data breach impacting approximately 6,800 individuals due to a zero-day vulnerability in the MOVEit Transfer platform. The Clop ransomware gang exploited this vulnerability, leading to the unauthorized download of sensitive information. Sony has since notified affected individuals and is offering credit monitoring services.","src":["https://www.bleepingcomputer.com/news/security/sony-confirms-data-breach-impacting-thousands-in-the-us/"]},{"v":"Openfire server operators","g":"not publicly disclosed","d":"June 2023","c":"Korea","fin":"$2,300 to $3,500","ran":"ransom demands ranging from .09 to .12 bitcoins","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hackers exploited a vulnerability in Openfire messaging servers to encrypt files with ransomware, appending the .locked1 extension. Reports indicate that multiple Openfire servers were affected, with ransom demands typically between .09 to .12 bitcoins.","src":["https://www.bleepingcomputer.com/news/security/hackers-actively-exploiting-openfire-flaw-to-encrypt-servers/"]},{"v":"Sophos","g":"BlackCat","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"39 Azure Storage accounts encrypted","s":"The BlackCat ransomware gang utilized a new Sphynx encryptor to breach Sophos, encrypting 39 Azure Storage accounts after gaining access through stolen credentials. The attackers employed various tools and techniques to infiltrate the victim's systems, leading to significant data encryption and potential exposure.","src":["https://www.bleepingcomputer.com/news/security/blackcat-ransomware-hits-azure-storage-with-sphynx-encryptor/"]},{"v":"LogicMonitor","g":"not publicly disclosed","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"LogicMonitor is currently working on restoring time-series data for trial/demo customer portals located in the US-WEST region. Trial/demo customer portals in the EU-WEST and US-EAST region that were impacted earlier have now been restored and are fully accessible.","di":"not publicly disclosed","s":"LogicMonitor confirmed that some users of its SaaS platform were victims of ransomware attacks. Anonymous sources indicated that threat actors hacked customer accounts and deployed ransomware using the platform's on-premise Collector sensors. The company is working with affected customers to mitigate the impact of the attacks.","src":["https://www.bleepingcomputer.com/news/security/logicmonitor-customers-hacked-in-reported-ransomware-attacks/"]},{"v":"Citrix","g":"FIN8","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Citrix NetScaler systems have been compromised by a threat actor linked to the FIN8 hacking group, exploiting a critical remote code execution flaw (CVE-2023-3519). Sophos reports that the campaign involves payload injections and is assessed to be part of a ransomware attack chain, with evidence of numerous webshells deployed across compromised servers.","src":["https://www.bleepingcomputer.com/news/security/attacks-on-citrix-netscaler-systems-linked-to-ransomware-actor/"]},{"v":"CloudNordic and AzeroCloud","g":"not publicly disclosed","d":"not publicly disclosed","c":"Denmark","fin":"not publicly disclosed","ran":"not paying ransom","dt":"Systems shut down, recovery process ongoing but not smooth; some servers restored without data.","di":"Majority of customer data lost, affecting several hundred Danish companies.","s":"CloudNordic and AzeroCloud, Danish hosting providers, suffered a ransomware attack that resulted in the loss of most customer data and forced a complete shutdown of their systems. The firms have stated they will not pay the ransom and are working with security experts to assess the damage and recover data, but many customers have lost everything stored in the cloud.","src":["https://www.bleepingcomputer.com/news/security/hosting-firm-says-it-lost-all-customer-data-after-ransomware-attack/"]},{"v":"LolekHosted","g":"Netwalker","d":"2023-08-08","c":"Poland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"LolekHosted, a bulletproof hosting provider, was seized by law enforcement on August 8, 2023, for facilitating Netwalker ransomware attacks. Five administrators were arrested, and the service was used by cybercriminals to execute approximately 50 ransomware attacks globally. The operation was part of a coordinated effort by the FBI, IRS, and Europol.","src":["https://www.bleepingcomputer.com/news/security/lolekhosted-admin-arrested-for-aiding-netwalker-ransomware-gang/"]},{"v":"TSMC (Taiwan Semiconductor Manufacturing Company)","g":"LockBit","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$70 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The LockBit ransomware gang demanded $70 million from TSMC, claiming to have stolen sensitive data. TSMC denied being hacked, stating that the breach occurred at one of its IT hardware suppliers, Kinmax Technology, which experienced a cybersecurity incident leading to data exfiltration.","src":["https://www.bleepingcomputer.com/news/security/tsmc-denies-lockbit-hack-as-ransomware-gang-demands-70-million/"]},{"v":"Zellis","g":"Clop","d":"not publicly disclosed","c":"UK","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"disconnected the server that utilizes MOVEit software and engaged an expert external security incident response team","di":"not publicly disclosed","s":"The Clop ransomware gang has claimed responsibility for the MOVEit Transfer data-theft attacks, exploiting a zero-day vulnerability to breach servers of hundreds of companies. Zellis, a UK payroll and HR solutions provider, confirmed it suffered a data breach due to these attacks, impacting some of its customers, while Aer Lingus and British Airways also reported being affected.","src":["https://www.bleepingcomputer.com/news/security/clop-ransomware-claims-responsibility-for-moveit-extortion-attacks/"]},{"v":"L3Harris","g":"Abyss","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"L3Harris, a defense company, was targeted by a ransomware operation named Abyss. The attack has drawn attention due to the company's significant size and the nature of the threat posed by the ransomware group.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-may-19th-2023-a-shifting-landscape/"]},{"v":"Zimbra servers","g":"MalasLocker","d":"March 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"donation to a non-profit charity","dt":"not publicly disclosed","di":"169 Zimbra configurations and data from three companies","s":"MalasLocker ransomware targets Zimbra servers, encrypting emails and demanding donations to a charity instead of traditional ransom payments. The operation began in March 2023, with victims reporting encrypted files and unusual ransom notes requesting proof of charity donations for decryption.","src":["https://www.bleepingcomputer.com/news/security/malaslocker-ransomware-targets-zimbra-servers-demands-charity-donation/"]},{"v":"ScanSource","g":"not publicly disclosed","d":"2023-05-14","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company is working diligently to bring affected systems back online, while also mitigating the impact on its business.","di":"not publicly disclosed","s":"ScanSource, a U.S.-based technology provider, confirmed it suffered a ransomware attack on May 14, 2023, impacting its systems and customer portals. The attack has caused significant operational disruptions, with delays expected in service provision to customers in North America and Brazil.","src":["https://www.bleepingcomputer.com/news/security/scansource-says-ransomware-attack-behind-multi-day-outages/"]},{"v":"Constellation Software","g":"ALPHV","d":"","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company contained the attack and has restored all impacted IT infrastructure systems.","di":"A limited amount of personal information of individuals and business partner data was impacted.","s":"Constellation Software confirmed a ransomware attack by the ALPHV gang, which involved the theft of over 1 TB of confidential data. The company stated that the incident was limited to a small number of systems and that they have restored the affected IT infrastructure. Business partners and individuals whose information was stolen are being contacted with further details.","src":["https://www.bleepingcomputer.com/news/security/alphv-gang-claims-ransomware-attack-on-constellation-software/"]},{"v":"Yellow Pages Canada","g":"Black Basta","d":"April 24th 2023","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Yellow Pages Canada has confirmed that it suffered a cyber attack attributed to the Black Basta ransomware group. The attack resulted in the leakage of data, although specific details about the data affected have not been disclosed.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-april-28th-2023-clop-at-it-again/"]},{"v":"PaperCut","g":"Clop and LockBit","d":"April 13, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Microsoft has attributed recent attacks on PaperCut servers to the Clop and LockBit ransomware operations, which exploited vulnerabilities to steal corporate data. The Clop gang confirmed their involvement, stating they used the vulnerabilities for initial access rather than directly stealing documents from the server.","src":["https://www.bleepingcomputer.com/news/security/microsoft-clop-and-lockbit-ransomware-behind-papercut-server-hacks/"]},{"v":"Yellow Pages Group","g":"Black Basta","d":"March 15, 2023","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Substantially all of our services have now been restored.","di":"sensitive documents including ID documents, tax documents, sales and purchase agreements, and financial spreadsheets","s":"Yellow Pages Canada confirmed a cyber attack by the Black Basta ransomware group, which leaked sensitive customer and employee data. The attack is believed to have occurred on or after March 15, 2023, and the company is notifying impacted individuals and reporting to privacy authorities.","src":["https://www.bleepingcomputer.com/news/security/yellow-pages-canada-confirms-cyber-attack-as-black-basta-leaks-data/"]},{"v":"Fortra","g":"Clop","d":"2023-01-18","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"data stolen from 130 companies","s":"Fortra reported that the Clop ransomware gang exploited a zero-day vulnerability in the GoAnywhere MFT solution to steal data from over 130 companies. The exploitation occurred between January 18 and January 30, 2023, leading to unauthorized access and data breaches.","src":["https://www.bleepingcomputer.com/news/security/fortra-shares-findings-on-goanywhere-mft-zero-day-attacks/"]},{"v":"Action1 Corporation","g":"Monti","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Action1 RMM software is being abused by threat actors in ransomware attacks, allowing them to gain persistence and execute commands on compromised networks. The software has been linked to multiple ransomware incidents, with tactics resembling those of the Monti group, which exploited the Log4Shell vulnerability.","src":["https://www.bleepingcomputer.com/news/security/hackers-start-abusing-action1-rmm-in-ransomware-attacks/"]},{"v":"MSI (Micro-Star International)","g":"Money Message","d":"","c":"Taiwan","fin":"not publicly disclosed","ran":"$4,000,000","dt":"MSI's IT department has initiated information security defense mechanism and recovery procedures.","di":"approximately 1.5TB of documents, including ERP databases, software source code, private keys, and BIOS firmware","s":"MSI confirmed a security breach following claims of a ransomware attack by the Money Message gang, which has threatened to leak stolen files unless a ransom of $4 million is paid. The company reported that some of its information service systems were affected but stated that there has been no significant operational or financial impact.","src":["https://www.bleepingcomputer.com/news/security/msi-confirms-security-breach-following-ransomware-attack-claims/"]},{"v":"VMware","g":"ESXiArgs","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 2,400 servers affected; .vmxf, .vmx, .vmdk, .vmsd, and .nvra files encrypted","s":"VMware has issued a warning regarding a large-scale ransomware campaign targeting unpatched ESXi servers, specifically exploiting the OpenSLP service. The ransomware, known as ESXiArgs, encrypts various file types on compromised servers, affecting thousands of targets worldwide.","src":["https://www.bleepingcomputer.com/news/security/vmware-warns-admins-to-patch-esxi-servers-disable-openslp-service/"]},{"v":"VMware ESXi servers","g":"not publicly disclosed","d":"not publicly disclosed","c":"not publicly disclosed","fin":"$88,000","ran":"four ransom payments","dt":"not publicly disclosed","di":"not publicly disclosed","s":"A massive ransomware attack targeting VMware ESXi servers has been reported, exploiting a known vulnerability (CVE-2021-21974). Approximately 2,400 devices were compromised, with only four ransom payments totaling $88,000 made, likely due to available recovery resources for affected admins.","src":["https://www.bleepingcomputer.com/news/security/massive-esxiargs-ransomware-attack-targets-vmware-esxi-servers-worldwide/"]},{"v":"Avast","g":"not publicly disclosed","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Avast has released a free decryptor for the BianLian ransomware strain, allowing victims to recover locked files without paying the hackers. The decryptor is designed to assist those affected by known variants of the ransomware, which encrypts files and threatens to publish private data if demands are not met.","src":["https://www.bleepingcomputer.com/news/security/avast-releases-free-bianlian-ransomware-decryptor/"]},{"v":"Heilbronn Stimme","g":"not publicly disclosed","d":"","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Printing systems were crippled, leading to emergency editions being printed via a third party. Communication via phone and email was offline during the weekend.","di":"not publicly disclosed","s":"A ransomware attack on Heilbronn Stimme disrupted the printing systems of the newspaper and its parent media group, Stimme Mediengruppe. The attack led to the publication of an emergency six-page edition and the lifting of the paywall on their website due to circulation issues. The media group is collaborating with police and cybersecurity experts to resolve the situation.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-halts-circulation-of-some-german-newspapers/"]},{"v":"QNAP and Asustor NAS device users","g":"DeadBolt","d":"not publicly disclosed","c":"Netherlands","fin":"not publicly disclosed","ran":"0.03 bitcoin","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Dutch National Police, in collaboration with Responders.NU, successfully tricked the DeadBolt ransomware gang into providing 155 decryption keys by faking ransom payments. This operation allowed victims of the DeadBolt ransomware to recover their files without incurring costs, as the police managed to cancel the transactions before they were confirmed on the Bitcoin blockchain.","src":["https://www.bleepingcomputer.com/news/security/police-tricks-deadbolt-ransomware-out-of-155-decryption-keys/"]},{"v":"QNAP and Asustor Network Attached Storage (NAS) device users","g":"DeadBolt","d":"not publicly disclosed","c":"Netherlands","fin":"not publicly disclosed","ran":"0.03 bitcoin","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Dutch National Police, in collaboration with Responders.NU, successfully tricked the DeadBolt ransomware gang into providing 155 decryption keys by faking ransom payments. This operation allowed victims of the DeadBolt ransomware to recover their files without incurring costs, as the police managed to cancel the transactions before they were confirmed on the Bitcoin blockchain.","src":["https://www.bleepingcomputer.com/news/security/police-tricks-deadbolt-ransomware-out-of-155-decryption-keys/"]},{"v":"Microsoft Exchange servers","g":"LockBit","d":"July 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1.3 TB of data stolen","s":"Microsoft Exchange servers were hacked to deploy LockBit ransomware, utilizing a previously deployed web shell to escalate privileges and encrypt network systems. The attackers stole approximately 1.3 TB of data within a week of gaining access to the Active Directory admin account.","src":["https://www.bleepingcomputer.com/news/security/microsoft-exchange-servers-hacked-to-deploy-lockbit-ransomware/"]},{"v":"ADATA","g":"RansomHouse","d":"","c":"Taiwan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1TB of documents claimed stolen, originally from a May 2021 RagnarLocker ransomware attack","s":"ADATA denies a recent cyberattack by RansomHouse, asserting that the leaked data is from a 2021 breach. RansomHouse claims to have stolen 1TB of documents in a 2022 attack, but ADATA states that no successful attacks have occurred since their 2021 incident.","src":["https://www.bleepingcomputer.com/news/security/adata-denies-ransomhouse-cyberattack-says-leaked-data-from-2021-breach/"]},{"v":"TargetCompany","g":"FARGO","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"TargetCompany has been targeted by the FARGO ransomware, which specifically focuses on Microsoft SQL servers. The ransomware encrypts files and threatens to leak stolen data unless a ransom is paid, exploiting vulnerabilities and weak credentials in database management systems.","src":["https://www.bleepingcomputer.com/news/security/microsoft-sql-servers-hacked-in-targetcompany-ransomware-attacks/"]},{"v":"QNAP Systems, Inc.","g":"DeadBolt","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"just over a thousand USD","dt":"not publicly disclosed","di":"not publicly disclosed","s":"QNAP Systems, Inc. is facing ongoing DeadBolt ransomware attacks that exploit a zero-day vulnerability in Photo Station. The company has released patches to address the security flaw, but attacks continue to affect NAS devices directly connected to the Internet.","src":["https://www.bleepingcomputer.com/news/security/qnap-patches-zero-day-used-in-new-deadbolt-ransomware-attacks/"]},{"v":"Baker & Taylor","g":"not publicly disclosed","d":"August 23, 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Systems were down for more than a week as technical teams worked on restoring impacted servers.","di":"not publicly disclosed","s":"Baker & Taylor, a leading library services firm, confirmed it was hit by a ransomware attack that disrupted its business-critical systems. The company is actively working to restore its systems after the attack, which occurred over the weekend prior to August 23, 2022.","src":["https://www.bleepingcomputer.com/news/security/leading-library-services-firm-baker-and-taylor-hit-by-ransomware/"]},{"v":"Entrust","g":"LockBit","d":"June 18","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"343GB of files stolen","s":"Entrust suffered a data breach on June 18, where LockBit ransomware gang stole data and threatened to leak it. Although Entrust did not pay the ransom, LockBit announced plans to publish the stolen data, which they later did on August 27, despite facing a DDoS attack that temporarily hindered their operations.","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-gang-gets-aggressive-with-triple-extortion-tactic/"]},{"v":"Bandai Namco","g":"BlackCat","d":"July 3, 2022","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Bandai Namco confirmed a cyberattack on July 3, 2022, which may have resulted in the theft of customer personal data. The BlackCat ransomware group claimed responsibility for the breach, indicating that corporate data was stolen during the attack.","src":["https://www.bleepingcomputer.com/news/security/bandai-namco-confirms-hack-after-alphv-ransomware-data-leak-threat/"]},{"v":"QNAP","g":"Checkmate","d":"not publicly disclosed","c":"not publicly disclosed","fin":"$15,000","ran":"$15,000 worth of bitcoins","dt":"not publicly disclosed","di":"not publicly disclosed","s":"QNAP has warned customers about a new ransomware strain called Checkmate that targets NAS devices. The ransomware encrypts files and demands a ransom of $15,000 in bitcoins for decryption. The attacks exploit weak passwords and SMB services exposed to the internet, prompting QNAP to advise users to secure their devices and use strong passwords.","src":["https://www.bleepingcomputer.com/news/security/qnap-warns-of-new-checkmate-ransomware-targeting-nas-devices/"]},{"v":"Macmillan","g":"LockBit","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"forced to shut down their network and offices while recovering from a security incident","di":"not publicly disclosed","s":"Macmillan, a publishing giant, was forced to shut down their network and offices due to a likely ransomware attack. The incident appears to be linked to the LockBit ransomware group, which has been active in targeting various organizations.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-july-1st-2022-bug-bounties/"]},{"v":"Atlassian Confluence users","g":"AvosLocker and Cerber2021","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"AvosLocker and Cerber2021 ransomware gangs are exploiting a recently patched vulnerability in Atlassian Confluence servers to gain unauthorized access and deploy ransomware. Multiple organizations worldwide have been targeted, leading to significant security concerns and calls for immediate patching of the affected systems.","src":["https://www.bleepingcomputer.com/news/security/confluence-servers-hacked-to-deploy-avoslocker-cerber2021-ransomware/"]},{"v":"Mandiant","g":"LockBit","d":"June 6, 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"356,841 files claimed to be stolen, specific data types not disclosed","s":"LockBit ransomware gang claimed to have hacked Mandiant and stolen 356,841 files, threatening to leak them online. Mandiant stated there is no evidence supporting these claims and is investigating the situation.","src":["https://www.bleepingcomputer.com/news/security/mandiant-no-evidence-we-were-hacked-by-lockbit-ransomware/"]},{"v":"Nikkei","g":"Conti","d":"2022-05-13","c":"Singapore","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Nikkei's Singapore branch suffered a ransomware attack on May 13, 2022, attributed to the Conti ransomware gang. This incident is part of a broader trend of ransomware attacks affecting various organizations globally.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-may-20th-2022-another-one-bites-the-dust/","https://t.co/EPFLIfCsNY"]},{"v":"Nikkei Group Asia","g":"not publicly disclosed","d":"2022-05-13","c":"Singapore","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Nikkei Group Asia immediately shut down the affected server and took other measures to minimize the impact.","di":"The affected server likely contained customer data, but no evidence of a data leak has been found so far.","s":"Nikkei's Asian unit was hit by a ransomware attack on May 13, 2022, prompting an internal investigation. The company shut down the affected server and is currently assessing the nature and scope of the attack, including whether customer data was accessed.","src":["https://www.bleepingcomputer.com/news/security/media-giant-nikkeis-asian-unit-hit-by-ransomware-attack/"]},{"v":"EKZ","g":"LockBit 2.0","d":"April 18, 2022","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most systems have been restored, but invoice issuing and order processing are still impacted by delays.","di":"not publicly disclosed","s":"Onleihe, an online library app, faced issues after a cyberattack targeted its service provider EKZ on April 18, 2022. The attack led to system failures and data leaks, with LockBit 2.0 claiming responsibility. The incident affected various media formats, causing streaming errors and incomplete e-book files for users.","src":["https://www.bleepingcomputer.com/news/security/online-library-app-onleihe-faces-issues-after-cyberattack-on-provider/"]},{"v":"Onleihe","g":"LockBit 2.0","d":"April 18, 2022","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most systems have been restored, but invoice issuing and order processing are still impacted by delays.","di":"not publicly disclosed","s":"Onleihe faced significant issues after a cyberattack on its service provider EKZ, which occurred on April 18, 2022. The attack led to system failures that affected the lending of various media formats, including eBooks, audiobooks, and videos, with many files requiring re-encryption and re-uploading. The LockBit 2.0 group claimed responsibility for the attack and subsequently leaked data allegedly stolen from EKZ.","src":["https://www.bleepingcomputer.com/news/security/online-library-app-onleihe-faces-issues-after-cyberattack-on-provider/"]}],"stats":[{"m":"Technology share of ransomware incidents (2nd most-targeted sector, behind manufacturing at 14%)","v":"~9% of incidents","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/content/state-of-ransomware"},{"m":"Average ransomware recovery cost (all sectors, excl. ransom)","v":"$1.53M (down 44% from $2.73M in 2024)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Median ransom payment (all sectors)","v":"$1.0M (down from $1.26M prior year)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average cost of an extortion/ransomware incident","v":"$5.08M","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Average data-breach cost, Technology sector","v":"$4.79M","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average data-breach cost (all industries)","v":"$4.44M (down 9% from $4.88M)","s":"IBM Cost of a Data Breach 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Average ransom payment, Q4 2024","v":"$553,959 (+16% QoQ)","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Median ransom payment, Q4 2024","v":"$110,890 (-45% QoQ)","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Share of victims paying a ransom, Q4 2024 (all-time low)","v":"25%","s":"Coveware Q4 2024 Quarterly Report","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Share of breaches involving ransomware","v":"44% (up from 32% prior year); 88% among SMBs","s":"Verizon DBIR 2025","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Median ransomware payout / share refusing to pay","v":"Median $115K; 64% of victims refused to pay","s":"Verizon DBIR 2025","u":"https://www.verizon.com/business/resources/reports/dbir/"},{"m":"Total tracked ransom payments, 2024","v":"~$813.55M (down ~35% from $1.25B record in 2023)","s":"Chainalysis 2025 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-crime-ransomware-victim-extortion-2025/"},{"m":"CDK Global downstream dealer losses (single IT-SaaS incident)","v":">$1B (Anderson Economic Group)","s":"Anderson Economic Group via TechTarget/CyberScoop","u":"https://www.techtarget.com/whatis/feature/The-CDK-Global-outage-Explaining-how-it-happened"},{"m":"MOVEit/Progress downstream scope (single IT supply-chain incident)","v":"2,700+ organizations; ~93.3M individuals; est. aggregate cost ~$10.6B-$15.8B","s":"Emsisoft / Wikipedia MOVEit analysis","u":"https://www.emsisoft.com/en/blog/44123/unpacking-the-moveit-breach-statistics-and-analysis/"}]},{"name":"Manufacturing","tag":"Manufacturing","overview":"Manufacturing has been the single most-targeted sector by ransomware operators for five consecutive years through 2025, driven by a combination of high operational-downtime sensitivity (which pressures victims toward paying quickly), widespread reliance on legacy OT/ICS equipment with long refresh cycles, deep tiered supply-chain interdependency that multiplies contingent business-interruption exposure, and valuable intellectual property/trade-secret data. The ransomware.live \"Manufacturing\" sector tag alone contains 4,434 recorded victim postings, with year-over-year posting volume roughly quadrupling from 2021 (295) to 2025 (1,204), and the sector accounting for an estimated one in four ransomware attacks globally by 2025 per industry trackers. Attack economics are shifting: per Sophos's 2025 manufacturing-specific report, successful encryption rates have fallen sharply (74% to 40% YoY) as defenses improve, but attackers are compensating by shifting toward pure data theft and extortion, and average ransom demands against manufacturers have risen even as median demands/payments across all sectors trend down. High-profile incidents, from Norsk Hydro's ~$70M LockerGoga attack (2019) through Honda's global OT-targeted Snake/EKANS shutdown (2020), Foxconn Mexico's $34M DoppelPaymer demand (2020), Bridgestone's 30-plant, 10-day shutdown (2022), Continental's 40TB data-theft/$50M extortion (2022), and Nissan Australia's 100,000-person PII breach (2023), illustrate the sector's dual exposure to both OT-driven physical-production disruption and conventional IT-driven data-theft/extortion, often within the same threat-actor toolkit.","distinct":"The most-targeted sector for five consecutive years through 2025, with 4,434 leak-site postings. Combines legacy OT/ICS estates on decade-plus refresh cycles with deep tiered supply-chain interdependency and valuable trade-secret data. A weak IT/OT boundary means an IT-side encryption event routinely halts physical production, and a single Tier-2 supplier outage idles multiple OEMs, producing contingent business interruption invisible on the direct victim's own policy.","leverage":"Production downtime. Ransom is priced against per-hour output loss and contractual delivery penalties, secondarily against theft of designs, process IP and trade secrets.","tolerance":"Very low. Hours to a few days; continuous-process and just-in-time operations tolerate least, and idle-line cost accrues immediately regardless of data outcome.","bulk":{"total":4439,"years":{"2016":1,"2017":5,"2018":1,"2019":6,"2020":46,"2021":296,"2022":511,"2023":880,"2024":816,"2025":1204,"2026":673},"groups":[["akira",363],["lockbit3",323],["qilin",304],["play",263],["blackbasta",148],["lockbit2",145],["clop",142],["alphv",112]],"countries":[["US",1371],["DE",251],["CA",165],["GB",135],["IT",134],["JP",96]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Norsk Hydro","g":"LockerGoga","d":"2019-03-18","c":"Norway","fin":"Total financial impact reached approximately $70-75 million, per Norsk Hydro's own quarterly financial disclosures; initial Q1 2019 losses were estimated at $35-41 million with additional Q2 losses of $23-29 million.","ran":"Ransom amount not publicly disclosed by attackers in a fixed figure; Norsk Hydro refused to pay the ransom entirely and rebuilt systems from backups instead.","dt":"Several aluminum extrusion plants were forced to switch to manual operations for an extended period; full IT recovery took multiple weeks, with the company reporting it was still not at 100% normal operations several weeks after the attack. Microsoft's incident response team was brought in to assist recovery.","di":"Primarily an availability/encryption event rather than a large-scale data-exfiltration/extortion case (LockerGoga predates widespread double-extortion); no large trove of stolen customer data was reported leaked.","s":"One of the most consequential OT-impacting ransomware attacks in manufacturing history; the g
