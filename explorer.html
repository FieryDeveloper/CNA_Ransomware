/blog/crypto-ransomware-2026/"},{"m":"Business Services sector claimed-victim volume observed on ransomware.live","v":"100+ new claimed victims logged in just the ~3-week window of June 30-July 19, 2026 alone, spanning US, Brazil, South Africa, Czechia, Mexico, Bangladesh, Netherlands, Italy, Japan, Germany, Ireland, Spain, Greece, and Pakistan; dominant claiming groups in that window: Qilin, DragonForce, INC Ransom, TheGentlemen, Deadlock, Akira, and m3rx","s":"ransomware.live v2 API, sectorvictims/Business Services endpoint","u":"https://api.ransomware.live/v2/sectorvictims/Business%20Services"}]},{"name":"Public Administration (Government)","tag":"Public Sector","overview":"Public administration, national ministries, state/provincial agencies, and city/county/municipal governments, plus public libraries, courts, and administrative boards, is one of the most heavily and persistently targeted sectors for ransomware. Governments are attractive targets because they run large, heterogeneous, and often under-funded legacy IT estates; hold vast quantities of citizen PII and sensitive records; deliver essential, hard-to-suspend public services (911/emergency dispatch, tax and revenue collection, benefits, permitting, courts, utilities billing); and are politically visible, which raises the pressure to restore service quickly. Unlike private firms, governments frequently refuse to pay ransoms as a matter of policy, so the dominant financial exposure is not the ransom itself but the downstream cost of downtime, forensic investigation, system rebuild/replacement, credit monitoring for affected citizens, and legal/notification obligations, which routinely run many multiples of the original demand (e.g. Atlanta ~$17M vs a ~$51K demand; Baltimore ~$18M vs a ~$76K demand; Columbus $7.3M recovery vs a $1.9M demand refused). The sector also faces a distinctive blend of financially-motivated ransomware-as-a-service crews (Royal, Rhysida, Play, LockBit, BlackCat/ALPHV, Interlock, Medusa) and, at the national level, state-nexus actors where extortion and espionage overlap. Double- and triple-extortion (encryption plus data leak plus public shaming/notification of citizens) is now standard, making even well-backed-up governments vulnerable to reputational and privacy harm. From a cyber-insurance standpoint, the sector is characterized by high attack frequency, high aggregate downtime/recovery loss, moderate-to-low ransom-payment rates, strong dependence on third-party MSPs and shared statewide systems (systemic/aggregation risk), and significant regulatory and public-accountability exposure.","distinct":"Large, heterogeneous, chronically under-funded legacy estates holding vast citizen PII, delivering essential services that cannot simply be suspended, 911 dispatch, tax collection, benefits, permitting, courts. Uniquely constrained on the payment decision: appropriated budgets, public-records disclosure obligations and political scrutiny mean payment is often legally or politically foreclosed, so loss migrates into extended interruption, forensic rebuild and notification cost rather than ransom. Incidents become governance and electoral events.","leverage":"Disruption of essential and public-safety services combined with citizen PII exposure and acute political/reputational pressure on officials.","tolerance":"Bifurcated. Near-zero for public-safety and emergency dispatch; weeks to months tolerated in practice for administrative functions, largely because recovery capacity rather than acceptable risk sets the timeline.","bulk":{"total":1279,"years":{"2013":2,"2014":2,"2015":4,"2016":10,"2017":14,"2018":11,"2019":18,"2020":23,"2021":78,"2022":142,"2023":221,"2024":249,"2025":335,"2026":170},"groups":[["lockbit3",112],["qilin",82],["incransom",51],["babuk2",45],["ransomhub",39],["lockbit2",38],["medusa",35],["rhysida",31]],"countries":[["US",456],["FR",49],["CA",34],["BR",28],["IL",24],["DE",22]],"pressPct":14,"ransomPct":1},"incidents":[{"v":"Government of Costa Rica (national ministries)","g":"Conti","d":"April-May 2022","c":"Costa Rica","fin":"Economic drag estimated at ~$38 million per day of downtime; the Costa Rican Chamber of Foreign Commerce estimated losses exceeding $125 million in the first two days alone (halted tax/customs). Costa Rica invested ~$25 million in recovery; the U.S. State Department pledged $25 million in March 2023 to aid recovery and cyber-capacity building.","ran":"Conti demanded US$10 million, later doubled to US$20 million; the government declined to pay.","dt":"Critical systems (Hacienda, CCSS) disrupted for weeks to months; a second wave (attributed to HIVE) hit the CCSS health system on 31 May 2022, forcing manual operations across hospitals. Recovery spanned months with international assistance.","di":"Data exfiltrated from the Ministry of Finance and other bodies; Conti published stolen data on its leak site when the ransom was refused.","s":"Conti hit nearly 30 Costa Rican government institutions including the Ministry of Finance (Hacienda), CCSS social security fund, MICITT, labor ministry, and state ISP RACSA. On 8 May 2022 President Rodrigo Chaves declared a national state of emergency and characterized it as an act of terrorism/'war' - the first time a country declared a national emergency over ransomware. Tax collection, customs, and public services were paralyzed.","src":["https://en.wikipedia.org/wiki/2022_Costa_Rican_ransomware_attack","https://www.msspalert.com/news/costa-rica-conti-attack","https://www.sangfor.com/blog/cybersecurity/conti-ransomware-attack-throws-costa-rica-national-state-emergency","https://cyberlaw.ccdcoe.org/wiki/Costa_Rica_ransomware_attack_(2022)"]},{"v":"City of Atlanta, Georgia","g":"SamSam","d":"March 2018","c":"United States","fin":"Recovery ultimately cost approximately $17 million (a confidential report figure), roughly six times the initial ~$3M estimate. Break-down: ~$6M initial response, ~$11M to repair/replace damaged systems, desktops, laptops and devices. The city had initially budgeted ~$6M.","ran":"Attackers demanded about $51,000 (roughly 6 bitcoin) in total; Atlanta did not pay.","dt":"Multiple departments were down or degraded for days to weeks; some systems and data were never fully recovered, and years of police dashcam footage were lost.","di":"Numerous applications and records affected; some data permanently lost (e.g. police dashcam video). Broad operational data loss rather than a quantified PII count.","s":"SamSam ransomware crippled City of Atlanta systems, taking down online bill-pay, court systems, and numerous municipal applications. A landmark early municipal ransomware case; two Iranian nationals (Faramarz Shahi Savandi and Mohammad Mehdi Shah Mansouri) were indicted by the U.S. DOJ in November 2018.","src":["https://en.wikipedia.org/wiki/Atlanta_government_ransomware_attack","https://www.hipaajournal.com/the-high-cost-of-samsam-ransomware-attacks-17-million-for-the-city-of-atlanta/","https://www.bitdefender.com/en-us/blog/hotforsecurity/at-17-million-atlanta-network-recovery-six-times-more-expensive-than-estimated","https://www.securityweek.com/city-atlanta-ransomware-attack-proves-disastrously-expensive/"]},{"v":"City of Baltimore, Maryland","g":"RobbinHood","d":"May 2019","c":"United States","fin":"Estimated ~$18 million total: ~$10 million to restore/rebuild systems plus ~$8 million in lost or deferred revenue.","ran":"Attackers demanded 13 bitcoin (~$76,000-$80,000 at the time); Mayor Bernard 'Jack' Young refused to pay.","dt":"Recovery, initially expected to take weeks, ultimately extended from May into roughly September 2019 (~4 months) for full restoration.","di":"Widespread system encryption; disruption to city databases and payment/records systems. No large single PII-breach count is the headline - impact was primarily operational.","s":"On 7 May 2019 RobbinHood ransomware took most of Baltimore's government systems offline (all servers except essential services). Email was down, forcing employees to use personal Gmail; property transfers and the water-billing/payment systems were frozen, disrupting the real-estate market.","src":["https://en.wikipedia.org/wiki/2019_Baltimore_ransomware_attack","https://www.upi.com/Top_News/US/2019/06/10/Hack-that-cost-Baltimore-18M-a-mystery-after-experts-eye-NSA-link/7961559775882/","https://www.verizon.com/business/resources/articles/s/lessons-from-the-robbinhood-ransomware-attack-on-baltimore/"]},{"v":"City of Dallas, Texas","g":"Royal","d":"May 2023","c":"United States","fin":"The city approved roughly $8.5 million in costs to remediate and recover from the attack (downtime/response costs).","ran":"No ransom payment was publicly reported/confirmed as paid; ransom demand not publicly disclosed.","dt":"Multiple systems, including 911/CAD and municipal court operations, were disrupted for weeks; restoration efforts continued over several weeks into the summer of 2023.","di":"More than 27,000 current and former employees and their dependents were notified that their personally identifiable information was exposed in the attack.","s":"The Royal ransomware gang attacked the City of Dallas in May 2023, disrupting critical services including 911 dispatch systems, police/court operations, and city websites. One of the most significant U.S. municipal attacks of 2023.","src":["https://www.comparitech.com/blog/information-security/government-ransomware-attacks/","https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"]},{"v":"City of Columbus, Ohio","g":"Rhysida","d":"July 2024","c":"United States","fin":"The city spent about $7.3 million on recovery, including ~$2.4M for forensics/remediation/data-mining, ~$1.6M for Experian identity-theft protection, and ~$1.95M for legal counsel.","ran":"Rhysida demanded about $1.9 million (~30 bitcoin); Columbus refused to pay, after which the group leaked stolen data.","dt":"City services and systems were disrupted for weeks; recovery and remediation extended over months, with continued identity-protection provisioning for affected residents.","di":"Large volume of resident and employee data exposed and partially leaked (including data tied to crime victims and city employees); the city offered Experian identity-theft protection to affected individuals (hundreds of thousands).","s":"Rhysida struck the City of Columbus in July 2024. The city refused to pay and, notably, sued a security researcher who publicized the leaked data - drawing national attention to how governments handle post-breach disclosure.","src":["https://blog.knowbe4.com/ransomware-recovery-costs-have-doubled-for-state-and-local-governments","https://www.comparitech.com/blog/information-security/government-ransomware-attacks/","https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"]},{"v":"The British Library","g":"Rhysida","d":"October 2023","c":"United Kingdom","fin":"Recovery expected to consume roughly 40% of the Library's financial reserves - about £6-7 million (~$7.5-9M) - far exceeding the ransom demanded. Follow-on rebuild tenders (e.g. ~£400,000) continued into 2024-2025.","ran":"Rhysida demanded 20 bitcoin (~£596,000 / ~$750,000 at the time); the Library did not pay.","dt":"Severe disruption for months; the main catalogue returned in read-only form on 15 January 2024, with many services degraded well into 2024. Full rebuild extended over more than a year.","di":"Approximately 600GB / nearly 500,000 files exfiltrated - much from the CRM database - including personal data of Library users and staff; ~600GB was publicly dumped when the ransom was refused. ~20,000 authors/illustrators had Public Lending Right payments delayed.","s":"On 28 October 2023 Rhysida attacked the British Library (a UK public/national institution), taking down its website, catalogue, and public Wi-Fi. Described as 'one of the worst cyber incidents in British history'; the Library refused to pay and the attackers leaked the stolen data.","src":["https://en.wikipedia.org/wiki/British_Library_cyberattack","https://www.computerweekly.com/news/366565574/British-Library-ransomware-attack-could-cost-up-to-7m","https://www.securityweek.com/details-and-lessons-learned-from-the-ransomware-attack-on-the-british-library/","https://www.itpro.com/security/cyber-attacks/british-library-eyes-pound400000-rebuild-after-devastating-2023-cyber-attack"]},{"v":"City of Saint Paul, Minnesota","g":"Interlock","d":"July 2025","c":"United States","fin":"Not publicly disclosed as a total figure as of reporting; response involved state resources and the National Guard, indicating substantial cost.","ran":"The city stated it would not pay the ransom; specific demand amount not publicly disclosed.","dt":"Core city systems were down and progressively restored over weeks following the July 25 onset; the National Guard's involvement reflected the complexity of recovery.","di":"After the city refused to pay, Interlock publicly posted approximately 43GB of data stolen from St. Paul.","s":"A cyberattack beginning 25 July 2025 hit the City of St. Paul so severely that the Minnesota National Guard was activated to assist. The mayor confirmed it as a ransomware attack by the Interlock ransomware-as-a-service group. Core systems - internal networks, online payment portals, and public Wi-Fi - were disrupted.","src":["https://en.wikipedia.org/wiki/2025_St._Paul_cyberattack","https://www.govtech.com/security/st-paul-minn-systems-come-back-online-after-cyber-attack","https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"]},{"v":"State of Nevada","g":"Not publicly attributed (ransomware)","d":"August 2025","c":"United States","fin":"Not publicly disclosed at time of reporting.","ran":"Not publicly disclosed.","dt":"Multiple state services - phone systems and agency websites - were interrupted; recovery handled with federal (CISA/FBI) assistance over the following days/weeks.","di":"Under investigation at time of reporting; data-theft impact not fully quantified publicly.","s":"Federal and state authorities investigated a ransomware attack that disrupted key services across the State of Nevada in August 2025, interrupting multiple government services including phone systems and state agency websites - illustrating the escalation of ransomware to the U.S. state-government level.","src":["https://www.cybersecuritydive.com/news/federal-state-investigating-ransomware-nevada/758863/","https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"]},{"v":"Berlin city administration","g":"Rhysida","d":"August 28, 2023","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The affected Senate departments were disconnected from the state network on August 14.","di":"Approximately 1.44 million files, including government, legal, financial, contractual, HR, infrastructure, health, and mapping records; thousands of names, email addresses, phone numbers, and 148 IBANs; plaintext credentials, database accounts, payment-system data, password vaults, and credentials belonging to senior officials; personnel files, payroll information, administrative-offense records, email archives, SQL database dumps, identity documents, and banking information; documents related to disciplinary proceedings and other named cases; allegedly classified or sensitive government material, including Bundesrat committee records and information about handling classified documents; critical-infrastructure security assessments concerning Berlin's water supply; more than 3,200 documents marked as nondisclosure agreements.","s":"Berlin's city administration confirmed a data theft following a ransomware attack by the Rhysida group, which claimed to have exfiltrated 5.79 TB of data. The attackers are extorting the city, threatening to publish the stolen files unless a ransom is paid, while investigations by various security agencies are ongoing.","src":["https://www.bleepingcomputer.com/news/security/berlin-confirms-data-theft-after-rhysida-ransomware-attack-claims/"]},{"v":"Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF)","g":"Qilin","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"ATF terminated connections to the affected environment and initiated incident-response and forensic activities.","di":"not publicly disclosed","s":"The ATF confirmed a major incident involving a breach of one of its systems, linked to the Qilin ransomware gang. While Qilin has added ATF to its dark web leak portal, it has not confirmed whether files were stolen or if a ransom was demanded. The ATF stated that the impacted system operates separately from its main network and that operations were not affected.","src":["https://www.bleepingcomputer.com/news/security/atf-confirms-major-incident-after-recent-qilin-breach-claims/"]},{"v":"Die Linke","g":"Qilin","d":"March 27, 2023","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"sensitive data from internal areas of the party organization and personal information of employees","s":"The Qilin ransomware group has stolen data from the German political party Die Linke and is threatening to leak it. The party confirmed the cyber incident but stated that its membership database was not impacted, and it is working with authorities and IT experts to address the situation.","src":["https://www.bleepingcomputer.com/news/security/die-linke-german-political-party-confirms-data-stolen-by-qilin-ransomware/"]},{"v":"Sedgwick Government Solutions","g":"TridentLocker","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"3.39 GB of documents stolen","s":"Sedgwick Government Solutions, a subsidiary of Sedgwick, confirmed a security breach that was claimed by the TridentLocker ransomware group. The attackers have stolen 3.39 GB of documents and published some of the data on their Tor leak site, although the parent company's network remains unaffected and they continue to serve their clients.","src":["https://www.bleepingcomputer.com/news/security/sedgwick-confirms-breach-at-government-contractor-subsidiary/"]},{"v":"Romanian Waters (Administrația Națională Apele Române)","g":"not publicly disclosed","d":"","c":"Romania","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"approximately 1,000 computer systems affected","s":"The Romanian water authority, Romanian Waters, was hit by a ransomware attack that impacted around 1,000 computer systems across its national and regional offices. The attackers used Windows BitLocker to lock files and left a ransom note, but operations related to water infrastructure remained unaffected during the incident.","src":["https://www.bleepingcomputer.com/news/security/romanian-water-authority-hit-by-ransomware-attack-over-weekend/"]},{"v":"Rhode Island's RIBridges","g":"Brain Cipher","d":"","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"RIBridges was shut down to remediate the threat after confirmation of the breach.","di":"Approximately 650,000 people were impacted; personal data including names, addresses, dates of birth, Social Security numbers, and certain banking information was exposed.","s":"The Brain Cipher ransomware gang leaked data stolen from Rhode Island's RIBridges social services platform, affecting around 650,000 individuals. The breach involved sensitive personal information, prompting state officials to advise residents on protecting their personal information.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-leaks-data-stolen-in-rhode-islands-ribridges-breach/"]},{"v":"Rhode Island State","g":"Brain Cipher","d":"December 5, 2024","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"RIBridges system taken offline for evaluation and recovery efforts.","di":"Potential exposure of names, addresses, dates of birth, Social Security numbers, and certain banking information of impacted residents.","s":"Rhode Island confirmed a data breach after the Brain Cipher ransomware gang attacked its RIBridges system, which manages public assistance programs. The breach exposed personal information of residents, prompting the state to take the system offline for security evaluations and recovery efforts.","src":["https://www.bleepingcomputer.com/news/security/rhode-island-confirms-data-breach-after-brain-cipher-ransomware-attack/"]},{"v":"law enforcement agency in Passaic County, New Jersey","g":"LockBit","d":"June 2020","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Mikhail Pavlovich Matveev, also known as Wazawaka, was arrested for his involvement in ransomware operations, including deploying LockBit ransomware on a law enforcement agency's network in New Jersey. He is accused of developing specialized malware intended to encrypt files of commercial organizations for ransom. Matveev has been linked to multiple ransomware gangs and has a history of cybercriminal activity.","src":["https://www.bleepingcomputer.com/news/security/russia-arrests-cybercriminal-wazawaka-for-ties-with-ransomware-gangs/"]},{"v":"Metropolitan Police Department in Washington, D.C.","g":"LockBit","d":"April 2021","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Mikhail Pavlovich Matveev, also known as Wazawaka, was arrested for his involvement in ransomware operations, including deploying LockBit ransomware on the network of a law enforcement agency in New Jersey. He has been linked to multiple ransomware gangs and is accused of developing malware intended to encrypt data for ransom from commercial organizations.","src":["https://www.bleepingcomputer.com/news/security/russia-arrests-cybercriminal-wazawaka-for-ties-with-ransomware-gangs/"]},{"v":"City of Columbus","g":"Rhysida","d":"July 18, 2024","c":"United States","fin":"$25,000","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"500,000 individuals affected; personal and financial information including names, dates of birth, addresses, bank account information, driver's licenses, Social Security numbers","s":"In July 2024, the City of Columbus experienced a ransomware attack where the Rhysida gang stole personal and financial information of 500,000 individuals. Although no systems were encrypted, the gang leaked 45% of the stolen data on the dark web, prompting the City to notify affected individuals and provide credit monitoring services.","src":["https://www.bleepingcomputer.com/news/security/city-of-columbus-data-of-500-000-stolen-in-july-ransomware-attack/"]},{"v":"Wayne County, Michigan","g":"Interlock","d":"October 2024","c":"United States","fin":"not publicly disclosed","ran":"ransom demands ranging from hundreds of thousands of dollars to millions","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Interlock is a new ransomware operation that targets FreeBSD servers, claiming attacks on multiple organizations including Wayne County, Michigan. After a ransom was not paid, the group published stolen data on their leak site, employing a double-extortion tactic by threatening to leak data if demands are not met.","src":["https://www.bleepingcomputer.com/news/security/meet-interlock-the-new-ransomware-targeting-freebsd-servers/"]},{"v":"Housing Authority of the City of Los Angeles (HACLA)","g":"Cactus","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"891 GB of files including personal identifiable information, database backups, financial documents, executives/employees personal data, customer personal information, corporate confidential data and correspondence","s":"The Housing Authority of the City of Los Angeles (HACLA) confirmed a cyberattack on its IT network claimed by the Cactus ransomware gang. The attackers allegedly stole 891 GB of sensitive data, including personal identifiable information and financial documents, and have published some of this data on their leak site.","src":["https://www.bleepingcomputer.com/news/security/la-housing-authority-confirms-breach-claimed-by-cactus-ransomware/"]},{"v":"U.S. Marshals Service","g":"Hunters International","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The U.S. Marshals Service (USMS) has been listed as a victim by the Hunters International ransomware gang, which claims to have stolen sensitive data. USMS denies any breach, stating that the materials posted do not originate from a new incident. The data allegedly includes sensitive law enforcement information and personally identifiable information.","src":["https://www.bleepingcomputer.com/news/security/us-marshals-service-disputes-ransomware-gangs-breach-claims/"]},{"v":"Los Angeles Superior Court","g":"not publicly disclosed","d":"July 19, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Court was closed for one day to restore systems, with many critical systems remaining offline as of Sunday evening.","di":"not publicly disclosed","s":"The Los Angeles Superior Court experienced a ransomware attack that affected its entire network, leading to the closure of all 36 courthouse locations. The Court is working with law enforcement to investigate the incident and has found no evidence of compromised data.","src":["https://www.bleepingcomputer.com/news/security/los-angeles-superior-court-shuts-down-after-ransomware-attack/"]},{"v":"Dallas County","g":"Play","d":"October 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"201,404 individuals; Full name, Social Security number (SSN), Date of birth, Driver's license, State identification number, Taxpayer identification number, Medical information, Health insurance information","s":"In October 2023, Dallas County was targeted in a ransomware attack by the Play gang, which exposed the personal data of over 200,000 individuals. The county has since implemented security measures and is providing credit monitoring services to those affected.","src":["https://www.bleepingcomputer.com/news/security/dallas-county-data-of-200-000-exposed-in-2023-ransomware-attack/"]},{"v":"Indonesia's National Data Center","g":"Brain Cipher","d":"2023-06-20","c":"Indonesia","fin":"not publicly disclosed","ran":"$8 million","dt":"disrupted over 200 government agencies, affecting immigration services, passport control, and issuing of event permits","di":"not publicly disclosed","s":"On June 20, 2023, the Brain Cipher ransomware operation attacked Indonesia's temporary National Data Center, encrypting government servers and disrupting various online services. The attackers demanded $8 million in Monero cryptocurrency to provide a decryptor and not leak allegedly stolen data.","src":["https://www.bleepingcomputer.com/news/security/meet-brain-cipher-the-new-ransomware-behind-indonesia-data-center-attack/"]},{"v":"Ohio Lottery","g":"DragonForce","d":"December 24, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"538,959 individuals affected; names, Social Security numbers, dates of birth, and other personal identifiers","s":"The Ohio Lottery experienced a ransomware attack on December 24, 2023, which impacted over 538,000 individuals. The DragonForce ransomware gang claimed responsibility, stating they encrypted devices and stole documents, leading to a data leak of personal information.","src":["https://www.bleepingcomputer.com/news/security/ohio-lottery-ransomware-attack-impacts-over-538-000-individuals/"]},{"v":"City of Wichita","g":"LockBit","d":"May 5, 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems used for online bill payment were shut down; services remain unavailable including public Wi-Fi, email communications, and online payment platforms.","di":"not publicly disclosed","s":"The City of Wichita experienced a ransomware attack claimed by the LockBit gang, leading to the shutdown of IT systems for online services. The gang threatened to publish stolen files unless a ransom is paid, and the city is currently assessing the impact of potential data theft.","src":["https://www.bleepingcomputer.com/news/security/city-of-wichita-breach-claimed-by-lockbit-ransomware-gang/"]},{"v":"Jackson County, Missouri","g":"not publicly disclosed","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Assessment, Collection, and Recorder of Deeds offices likely closed until the end of the week as IT department works on restoring systems.","di":"not publicly disclosed","s":"Jackson County, Missouri, declared a state of emergency following a ransomware attack that disrupted several county services. The attack affected the Assessment, Collection, and Recorder of Deeds offices, but officials confirmed that residents' financial information was not impacted as it is stored securely by an external provider.","src":["https://www.bleepingcomputer.com/news/security/jackson-county-in-state-of-emergency-after-ransomware-attack/"]},{"v":"Hessen Consumer Center","g":"Blackcat/ALPHV","d":"February 22, 2023","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Temporary disruption of availability; communication disruptions mostly addressed but ongoing issues remain.","di":"not publicly disclosed","s":"The Hessen Consumer Center in Germany suffered a ransomware attack that encrypted its IT systems, causing temporary disruptions in communication. The Blackcat/ALPHV ransomware gang later claimed responsibility and published data samples on their extortion page.","src":["https://www.bleepingcomputer.com/news/security/hessen-consumer-center-says-systems-encrypted-by-ransomware/"]},{"v":"Fulton County, Georgia","g":"LockBit","d":"January 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Widespread IT outages impacting phone, court, and tax systems; recovery ongoing three weeks after the attack.","di":"Sensitive data containing citizen's personal data; specific records/people affected not publicly disclosed.","s":"LockBit ransomware gang claimed responsibility for a cyberattack on Fulton County, Georgia, threatening to leak confidential documents if a ransom is not paid. The attack caused significant IT outages, affecting various county services, and the county is currently exploring insurance options for recovery.","src":["https://www.bleepingcomputer.com/news/security/lockbit-claims-ransomware-attack-on-fulton-county-georgia/"]},{"v":"Kansas City Area Transportation Authority (KCATA)","g":"Medusa","d":"2023-01-23","c":"USA","fin":"not publicly disclosed","ran":"$2,000,000","dt":"KCATA is working around the clock with outside cyber professionals to restore systems as soon as possible.","di":"not publicly disclosed","s":"The Kansas City Area Transportation Authority (KCATA) was targeted by a ransomware attack on January 23, 2023, impacting all communication systems. The Medusa ransomware group claimed responsibility and demanded a ransom of $2,000,000, threatening to release stolen data if not paid.","src":["https://www.bleepingcomputer.com/news/security/kansas-city-public-transportation-authority-hit-by-ransomware/"]},{"v":"Calvi City Council","g":"not publicly disclosed","d":"","c":"Spain","fin":"$11M","ran":"$11M","dt":"Administrative deadlines suspended until January 31, 2024; ongoing forensic analysis and recovery efforts.","di":"not publicly disclosed","s":"The Calvi City Council in Majorca was targeted by a ransomware attack that demanded a ransom of approximately $11 million. The attack disrupted municipal services, prompting the council to form a crisis committee to assess the damage and restore normal operations. The mayor confirmed that the municipality would not pay the ransom and has reported the incident to the police's cybercrime department.","src":["https://www.bleepingcomputer.com/news/security/majorca-city-calvi-extorted-for-11m-in-ransomware-attack/"]},{"v":"Court Services Victoria","g":"Qilin","d":"December 21, 2023","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The impacted system was immediately isolated and disabled; court operations in Victoria will not be affected, and all cases scheduled for January 2024 are expected to proceed normally.","di":"Recordings of some hearings in courts between 1 November and 21 December 2023 may have been accessed, potentially exposing sensitive information regarding court cases.","s":"Court Services Victoria reported a ransomware attack attributed to the Qilin group, which exposed video recordings of court hearings. The attack was detected on December 21, 2023, but the breach occurred earlier on December 8, 2023, affecting recordings dating back to November 1, 2023.","src":["https://www.bleepingcomputer.com/news/security/victoria-court-recordings-exposed-in-reported-ransomware-attack/"]},{"v":"Court Services Victoria (CSV)","g":"Qilin","d":"December 21, 2023","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The impacted system was immediately isolated and disabled; court operations in Victoria will not be affected, and all cases scheduled for January 2024 are expected to proceed normally.","di":"Recordings of some hearings in courts between November 1 and 21 December 2023 may have been accessed, including public and confidential information.","s":"Court Services Victoria (CSV) reported a ransomware attack attributed to the Qilin group, which exposed video recordings of court hearings. The cyberattack was detected on December 21, 2023, but the breach occurred earlier on December 8, 2023, affecting recordings dating back to November 1, 2023. CSV is notifying impacted parties and restructuring its systems for better security.","src":["https://www.bleepingcomputer.com/news/security/victoria-court-recordings-exposed-in-reported-ransomware-attack/"]},{"v":"Toronto Public Library","g":"Black Basta","d":"not publicly disclosed","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Black Basta ransomware gang has targeted the Toronto Public Library, which is Canada's largest public library system. Researchers have developed a decryptor that exploits a flaw in Black Basta's encryption, allowing some victims to recover their files for free, although newer victims may not benefit from this tool.","src":["https://www.bleepingcomputer.com/news/security/new-black-basta-decryptor-exploits-ransomware-flaw-to-recover-files/"]},{"v":"Kansas Judicial Branch","g":"not publicly disclosed","d":"October 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Several weeks until all systems return to normal status","di":"Sensitive files containing confidential information, including Office of Judicial Administration files and district court case records on appeal","s":"The Kansas Judicial Branch confirmed a cyberattack that resulted in the theft of sensitive data and a ransom demand. The attackers threatened to publish the stolen data on the dark web if their demands were not met, impacting multiple court systems and services.","src":["https://www.bleepingcomputer.com/news/security/kansas-courts-confirm-data-theft-ransom-demand-after-cyberattack/"]},{"v":"State of Maine","g":"Clop ransomware gang","d":"May 31, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1.3 million individuals; Full name, Social Security number (SSN), Date of birth, Driver's license, State identification number, Taxpayer identification number, Health insurance information","s":"The State of Maine reported a data breach affecting approximately 1.3 million individuals due to a vulnerability in the MOVEit file transfer tool exploited by the Clop ransomware gang. The breach exposed sensitive personal information, including Social Security numbers and health insurance details, prompting the state to notify affected citizens and offer credit monitoring services.","src":["https://www.bleepingcomputer.com/news/security/maine-govt-notifies-13-million-people-of-moveit-data-breach/"]},{"v":"Florida First Judicial Circuit","g":"ALPHV","d":"October 2, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The court is prioritizing essential court proceedings but will cancel and reschedule other proceedings and pause related operations for several days, beginning October 2, 2023.","di":"Personal details like Social Security numbers and CVs of employees, including judges; comprehensive network map of the court's systems.","s":"The ALPHV ransomware gang claimed an attack on the Florida First Judicial Circuit, affecting state courts across Northwest Florida. The gang allegedly acquired sensitive personal details and threatened to leak the data online, while the court confirmed an investigation into the cyberattack that disrupted operations starting October 2, 2023.","src":["https://www.bleepingcomputer.com/news/security/alphv-ransomware-gang-claims-attack-on-florida-circuit-court/"]},{"v":"Greater Manchester Police","g":"not publicly disclosed","d":"","c":"United Kingdom","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"personal information of GMP employees, not including financial information","s":"Greater Manchester Police reported a ransomware attack affecting a third-party supplier, which compromised some personal information of its employees. The police department is treating the incident with high priority and is working to understand the impact while keeping employees informed.","src":["https://www.bleepingcomputer.com/news/security/manchester-police-officers-data-exposed-in-ransomware-attack/"]},{"v":"P le emploi","g":"Clop","d":"","c":"France","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"10 million individuals affected; exposed data includes full names and social security numbers","s":"P le emploi, France's governmental unemployment registration and financial aid agency, experienced a data breach that exposed personal data of approximately 10 million individuals. The breach was linked to a violation of the information system of one of its providers, and while sensitive data was compromised, the agency has assured that financial aid programs remain unaffected.","src":["https://www.bleepingcomputer.com/news/security/data-breach-at-french-govt-agency-exposes-info-of-10-million-people/"]},{"v":"Colorado Department of Health Care Policy Financing (HCPF)","g":"Clop","d":"2023-05-28","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"4,091,794 individuals; personal and health information including names, Social Security Numbers, Medicaid ID numbers, Medicare ID numbers, dates of birth, home addresses, contact information, income information, demographic data, clinical data, health insurance information","s":"The Colorado Department of Health Care Policy Financing (HCPF) reported a data breach affecting over four million individuals due to the exploitation of the MOVEit Transfer software by Clop ransomware. Although HCPF's systems were not directly compromised, unauthorized access to certain files containing sensitive personal and health information was confirmed.","src":["https://www.bleepingcomputer.com/news/security/colorado-warns-4-million-of-data-stolen-in-ibm-moveit-breach/"]},{"v":"Maximus","g":"Clop","d":"","c":"United States","fin":"$15 million","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"8 to 11 million individuals affected; personal information including social security numbers and protected health information","s":"Maximus, a U.S. government services contractor, disclosed a data breach affecting 8 to 11 million individuals due to a zero-day flaw in the MOVEit Transfer application exploited by the Clop ransomware gang. The breach involved the theft of personal data, and Maximus plans to incur approximately $15 million in expenses for investigation and remediation activities related to the incident.","src":["https://www.bleepingcomputer.com/news/security/8-million-people-hit-by-data-breach-at-us-govt-contractor-maximus/"]},{"v":"Louisiana and Oregon DMVs","g":"Clop","d":"June 16th 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"millions of driver's licenses exposed","s":"The Clop ransomware gang has begun extorting organizations affected by the MOVEit data theft, including the Louisiana and Oregon DMVs, which reported that millions of driver's licenses were exposed in the breach. The gang has threatened to leak the data if a ransom is not negotiated.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-16th-2023-wave-of-extortion/"]},{"v":"Louisiana Office of Motor Vehicles and Oregon Driver Motor Vehicle Services","g":"Clop","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"approximately 3,500,000 Oregonians and all Louisianans with a state-issued driver's license, ID, or car registration; personal information including Name, Address, Social Security Number, Birth date, Height, Eye Color, Driver's License Number, Vehicle Registration Information, Handicap Placard Information","s":"The MOVEit breach led to the exposure of millions of driver's licenses from Louisiana and Oregon after the Clop ransomware gang hacked the MOVEit Transfer security file transfer systems. Both states have warned their residents about the potential risks to their personal information, although there is no indication that the stolen data has been sold or leaked.","src":["https://www.bleepingcomputer.com/news/security/millions-of-oregon-louisiana-state-ids-stolen-in-moveit-breach/"]},{"v":"Chilean Army","g":"Rhysida","d":"May 27, 2023","c":"Chile","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The network was isolated following the breach, with military security experts starting the recovery process of affected systems.","di":"360,000 documents claimed to be stolen from the Chilean Army's network.","s":"The Rhysida ransomware gang leaked documents they claim to have stolen from the Chilean Army after a security incident detected on May 27, 2023. The gang has published 30% of the stolen data online, and an Army corporal was arrested for involvement in the attack.","src":["https://www.bleepingcomputer.com/news/security/rhysida-ransomware-leaks-documents-stolen-from-chilean-army/"]},{"v":"Swiss government","g":"Play","d":"May 23, 2023","c":"Switzerland","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Swiss government was impacted by a ransomware attack on Xplain, an IT supplier, which resulted in the theft of various confidential documents. The Play ransomware group published the stolen data on June 1, 2023, after failing to extort a ransom from Xplain, leading to concerns about the exposure of sensitive information belonging to the Federal Administration.","src":["https://www.bleepingcomputer.com/news/security/swiss-government-warns-of-ongoing-ddos-attacks-data-leak/"]},{"v":"City of Augusta, Georgia","g":"BlackByte","d":"May 21, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The City of Augusta, Georgia, experienced a cyberattack that disrupted certain computer systems. The BlackByte ransomware operation claimed responsibility for the attack and leaked data that they claimed was stolen during the incident.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-may-26th-2023-cities-under-attack/"]},{"v":"City of Augusta","g":"BlackByte","d":"2023-05-21","c":"United States","fin":"not publicly disclosed","ran":"$400,000","dt":"The city is working to restore full functionality to its systems as soon as possible.","di":"10GB of data leaked, including payroll information, contact details, personally identifiable information (PII), physical addresses, contracts, city budget allocation data.","s":"The City of Augusta in Georgia experienced a cyberattack attributed to the BlackByte ransomware gang, which claimed to have stolen sensitive data and demanded a ransom of $400,000. The city confirmed an IT system outage on May 21, 2023, and is investigating the full impact of the breach while working to restore its systems.","src":["https://www.bleepingcomputer.com/news/security/blackbyte-ransomware-claims-city-of-augusta-cyberattack/"]},{"v":"City of Dallas","g":"Royal","d":"May 1st 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The attack caused the City to shut down some of its IT systems to prevent the attack's spread.","di":"not publicly disclosed","s":"The City of Dallas suffered a Royal ransomware attack that impacted its IT infrastructure, including the police dispatch system and public library's computer network. The attack led to the shutdown of various systems, including the City's website, and ransom notes were printed from network printers as part of the attack.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-may-5th-2023-targeting-the-public-sector/"]},{"v":"City of Oakland","g":"Play ransomware","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Play ransomware group has developed custom tools, Grixba and VSS Copying Tool, to enhance their cyberattack effectiveness. These tools allow attackers to gather information from compromised networks and steal files from Volume Shadow Copy Service, even when in use. The group has targeted several high-profile victims, including the City of Oakland.","src":["https://www.bleepingcomputer.com/news/security/play-ransomware-gang-uses-custom-shadow-volume-copy-data-theft-tool/"]},{"v":"City of Toronto","g":"Clop","d":"","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The City of Toronto confirmed a data theft incident attributed to the Clop ransomware gang, which exploited a vulnerability in Fortra's GoAnywhere secure file transfer tool. The city is investigating the unauthorized access and is committed to notifying affected individuals if their data is compromised.","src":["https://www.bleepingcomputer.com/news/security/city-of-toronto-confirms-data-theft-clop-claims-responsibility/"]},{"v":"Fire Rescue Victoria","g":"Vice Society","d":"2022-12-15","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"widespread IT outage, emergency response services not impacted","di":"approximately 4,500 employees affected; data includes full names, addresses, email addresses, phone numbers, dates of birth, health information, sensitive information (sexual orientation, race, disability, religion, qualifications, employment history, criminal history, political or religious views), bank account details, superannuation details, government-issued identity information, driver's license details, passport details, tax file numbers, birth, death, and marriage certificates","s":"Fire Rescue Victoria experienced a cyberattack on December 15, 2022, claimed by the Vice Society ransomware gang. The attack resulted in a data breach affecting current and former employees, with sensitive information stolen and a warning issued to staff about potential phishing attempts. Despite the IT outages, emergency services continued to operate without disruption.","src":["https://www.bleepingcomputer.com/news/security/vice-society-ransomware-claims-attack-on-australian-firefighting-service/"]},{"v":"Miller County, AK","g":"Vice Society","d":"2022","c":"United States","fin":"$500,000","ran":"$500,000","dt":"not publicly disclosed","di":"not publicly disclosed","s":"In 2022, ransomware attacks impacted over 200 organizations in the U.S. public sector, including 105 counties, 44 universities and colleges, and 24 healthcare providers. Notably, Miller County, AK experienced a significant incident that spread to 55 counties, with Quincy, MA being the only local government known to have paid a ransom of $500,000. Additionally, hackers stole data in at least 27 incidents across these sectors.","src":["https://www.bleepingcomputer.com/news/security/ransomware-impacts-over-200-govt-edu-healthcare-orgs-in-2022/"]},{"v":"City of Antwerp","g":"Play","d":"","c":"Belgium","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The city's IT, email, and phone services were disrupted, with almost all services unavailable or significantly delayed.","di":"557 GB of data was stolen, including personal information, passports, IDs, and financial documents.","s":"The Play ransomware operation has claimed responsibility for a ransomware attack on the city of Antwerp, disrupting its IT services. The attack resulted in the theft of 557 GB of data, with the threat actors threatening to publish the data unless a ransom is paid.","src":["https://www.bleepingcomputer.com/news/security/play-ransomware-claims-attack-on-belgium-city-of-antwerp/"]},{"v":"Zwijndrecht police","g":"Ragnar Locker","d":"","c":"Belgium","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"thousands of car number plates, fines, crime report files, personnel details, investigation reports","s":"The Ragnar Locker ransomware gang targeted the Zwijndrecht police in Belgium, mistakenly believing they were attacking the municipality. The breach exposed sensitive data, including personal information of staff and details related to ongoing investigations, marking it as one of the largest law enforcement data leaks in Belgium's history.","src":["https://www.bleepingcomputer.com/news/security/ransomware-gang-targets-belgian-municipality-hits-police-instead/"]},{"v":"Parliament of Montenegro (Skupstina)","g":"Cuba","d":"","c":"Montenegro","fin":"not publicly disclosed","ran":"$10 million","dt":"The effects of the incident continue for the tenth day, with no estimate on when services will become available.","di":"Financial documents, correspondence with banks, balance sheets, tax documents, compensation, and source code were stolen.","s":"Montenegro's critical infrastructure was hit by a ransomware attack attributed to the Cuba group, which demanded a ransom of $10 million. The attack has caused significant disruptions, with the government unable to provide a timeline for recovery.","src":["https://www.bleepingcomputer.com/news/security/montenegro-hit-by-ransomware-attack-hackers-demand-10-million/"]},{"v":"Instituto Agrario Dominicano","g":"Quantum","d":"August 18, 2023","c":"Dominican Republic","fin":"not publicly disclosed","ran":"$650,000","dt":"not publicly disclosed","di":"over 1TB of data compromised","s":"The Instituto Agrario Dominicano in the Dominican Republic was hit by a Quantum ransomware attack on August 18, 2023, which encrypted multiple services and workstations. The attackers demanded a ransom of $650,000 and claimed to have stolen over 1TB of data, threatening to release it if the ransom was not paid.","src":["https://www.bleepingcomputer.com/news/security/quantum-ransomware-attack-disrupts-govt-agency-in-dominican-republic/"]},{"v":"Argentina's Judiciary of Córdoba","g":"Play","d":"August 15th 2022","c":"Argentina","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems shut down to recover from the attack","di":"not publicly disclosed","s":"Argentina's Judiciary of Córdoba suffered a ransomware attack attributed to the Play ransomware operation, leading to a shutdown of its IT systems. The attack caused significant disruption to the Justice system in the province, with ongoing efforts to recover the affected information.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-19th-2022-evolving-extortion-tactics/"]},{"v":"Judiciary of Córdoba","g":"Play","d":"August 15th 2022","c":"Argentina","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems shut down to recover from the attack","di":"not publicly disclosed","s":"Argentina's Judiciary of Córdoba suffered a ransomware attack attributed to the Play ransomware operation, leading to a shutdown of its IT systems. The attack caused significant disruption to the Justice system in the province, with ongoing recovery efforts to secure information and prevent further spread of the virus.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-19th-2022-evolving-extortion-tactics/"]},{"v":"Judiciary of Córdoba, Argentina","g":"Play","d":"August 15th 2022","c":"Argentina","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems shut down; recovery efforts ongoing","di":"not publicly disclosed","s":"Argentina's Judiciary of Córdoba suffered a ransomware attack attributed to the Play ransomware operation, leading to the shutdown of its IT systems. The attack caused significant disruption, with recovery efforts underway to restore access and secure information.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-19th-2022-evolving-extortion-tactics/"]},{"v":"Italian Internal Revenue Service (L'Agenzia delle Entrate)","g":"LockBit","d":"","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"100 GB of data including company documents, scans, financial reports, and contracts","s":"The LockBit ransomware gang claims to have breached the Italian Internal Revenue Service, stealing 100 GB of sensitive data. They threaten to leak this data online unless a ransom is paid by August 1st. The Italian authorities, including Sogei, are investigating the claims and have stated that no evidence of a cyber attack has been found so far.","src":["https://www.bleepingcomputer.com/news/security/lockbit-claims-ransomware-attack-on-italian-tax-agency/"]},{"v":"Costa Rican government","g":"Conti","d":"not publicly disclosed","c":"Costa Rica","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Conti ransomware gang breached the Costa Rican government's systems, leading to a significant cyberattack. The details of the attack revealed the precision and speed of the gang's operations from initial access to encryption of devices.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-july-22nd-2022-attacks-abound/"]},{"v":"City of Palermo","g":"Vice Society","d":"June 9th 2022","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"large-scale service outage","di":"not publicly disclosed","s":"The Vice Society ransomware group claimed responsibility for a cyber attack on the City of Palermo, Italy, which resulted in a significant service outage affecting various operations. The attack has led to the municipality shutting down all systems to mitigate the impact of the cyber threat.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-10th-2022-targeting-linux/"]},{"v":"Municipality of Palermo","g":"not publicly disclosed","d":"not publicly disclosed","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All services, public websites, and online portals remain offline for at least three days and may last longer.","di":"not publicly disclosed","s":"The municipality of Palermo in Italy suffered a cyberattack that has severely impacted its operations and services, forcing a shutdown of all systems. Local IT experts are working to restore services, but citizens and tourists are unable to access essential online services, leading to significant disruptions.","src":["https://www.bleepingcomputer.com/news/security/italian-city-of-palermo-shuts-down-all-systems-to-fend-off-cyberattack/"]},{"v":"Costa Rican Social Security Fund (CCCS)","g":"Hive","d":"not publicly disclosed","c":"Costa Rica","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"CCCS is now working on restoring the affected systems and critical services, but it is impossible to determine how long it will take until systems are back up.","di":"not publicly disclosed","s":"Costa Rica's public health agency, CCCS, was hit by a Hive ransomware attack, causing all computer systems to go offline. The agency confirmed the attack and is currently working on restoring services, while stating that citizens' health and tax information was not compromised.","src":["https://www.bleepingcomputer.com/news/security/costa-rica-s-public-health-agency-hit-by-hive-ransomware/"]},{"v":"Austrian federal state Carinthia","g":"BlackCat/ALPHV","d":"not publicly disclosed","c":"Austria","fin":"not publicly disclosed","ran":"$5 million","dt":"Thousands of workstations locked; first systems expected to be available again today.","di":"3,000 systems affected; no evidence of data theft reported.","s":"The Austrian federal state Carinthia was hit by the BlackCat ransomware gang, demanding $5 million to unlock encrypted systems. The attack caused severe operational disruptions, affecting government services including passport issuance and COVID-19 test processing. The state plans to restore systems from backups and has not confirmed any data theft.","src":["https://www.bleepingcomputer.com/news/security/blackcat-alphv-ransomware-asks-5-million-to-unlock-austrian-state/"]},{"v":"Saskatchewan Liquor and Gaming Authority (SLGA)","g":"RansomHouse","d":"December 2021","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"RansomHouse is a new data-extortion operation that targets organizations by stealing data and threatening to leak it if a ransom is not paid. The group claims to have launched in December 2021, with the Saskatchewan Liquor and Gaming Authority as one of its first victims, and has since added more victims, including a German airline support service provider.","src":["https://www.bleepingcomputer.com/news/security/new-ransomhouse-group-sets-up-extortion-market-adds-first-victims/"]},{"v":"Costa Rica","g":"Conti","d":"April 2022","c":"Costa Rica","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Costa Rica declared a national emergency following a massive ransomware attack by the Conti group that affected multiple government bodies. The attack caused significant IT system outages, impacting public services and requiring citizens to pay taxes at banks instead of online.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-may-13th-2022-a-national-emergency/"]},{"v":"Costa Rican government agencies","g":"Conti","d":"2022-05-08","c":"Costa Rica","fin":"not publicly disclosed","ran":"$10 million ransom demanded, government declined to pay","dt":"Since April 18th, the Treasury's digital services have been unavailable","di":"672 GB of data dump containing information from multiple government agencies","s":"Costa Rica declared a national emergency due to ongoing cyber attacks from the Conti ransomware group, which has leaked a significant amount of data belonging to government agencies. The group demanded a $10 million ransom from the Ministry of Finance, which the government refused to pay, leading to widespread disruption of digital services.","src":["https://www.bleepingcomputer.com/news/security/costa-rica-declares-national-emergency-after-conti-ransomware-attacks/"]}],"stats":[{"m":"Share of state & local government organizations hit by ransomware in the past year (2024)","v":"34% (down 51% from 69% reported in 2023)","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Mean recovery cost per ransomware attack, state & local government (2024)","v":"$2.83 million (more than double the $1.21M reported in 2023)","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Median ransom payment, state & local government (2024)","v":"$2.2 million; 54% of those hit paid to get data back; victims paid ~104% of the initial demand on average","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Share of computers/devices impacted per attack, state & local government","v":"~56% of machines affected on average (above the 49% cross-sector average); 78% restored data from backups","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Cumulative U.S. government ransomware attacks & estimated downtime cost (2018-Dec 2024)","v":"525 individual attacks on U.S. government organizations, ~$1.09 billion in estimated downtime cost","s":"Comparitech, Government ransomware attacks analysis","u":"https://www.comparitech.com/blog/information-security/government-ransomware-attacks/"},{"m":"Ransomware presence in breaches, all sectors (Verizon 2025 DBIR)","v":"Ransomware present in 44% of breaches (up ~37% YoY); median payout fell to ~$115K; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Ransomware & extortion share of breaches, all sectors (Verizon 2024 DBIR)","v":"Ransomware in ~23% of breaches (one-third when combined with extortion at 9%); median ransom demand ~1.34% of victim revenue","s":"Verizon 2024 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2024-dbir-data-breach-investigations-report.pdf"},{"m":"Espionage-motivated breaches (Verizon 2025 DBIR) - relevant to national government","v":"Espionage breaches up 163% YoY, now 17% of incidents; 28% of state-linked breaches also financially motivated ('double-dipping')","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Global average total cost of a data breach, all industries (2024) - public-sector context","v":"$4.88 million global average (record high); the public sector is consistently among the lowest-cost industries in IBM's dataset (public-sector-specific figure not isolated in accessed sources)","s":"IBM Cost of a Data Breach Report 2024","u":"https://www.ibm.com/think/insights/whats-new-2024-cost-of-a-data-breach-report"},{"m":"Growth in ransomware incidents against government bodies, H1 2025","v":"~65% increase in ransomware incidents affecting government bodies vs. the same period a year earlier","s":"SOCRadar, U.S. State & Local Government Ransomware 2025-2026 trend analysis","u":"https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"},{"m":"Overall ransomware payment trend (Sophos 2024, cross-sector)","v":"Average ransom payments increased ~500% year-over-year across sectors","s":"Sophos, The State of Ransomware 2024 (press release)","u":"https://www.sophos.com/en-us/press/press-releases/2024/04/ransomware-payments-increase-500-last-year-finds-sophos-state"}]},{"name":"Retail Trade and Consumer Services","tag":"Consumer Services","overview":"Retail Trade and Consumer Services (ransomware.live's \"Consumer Services\" sector tag) is one of the highest-volume ransomware targeting categories, spanning everything from single-location dealerships, gyms, and jewelry shops up to multinational department-store chains, casino/hospitality operators, and the shared SaaS platforms (CRM, dealer-management systems) that underpin the industry. A live pull of the ransomware.live sector feed (~120 victim postings across roughly a 2-month window in mid-2026) shows the sector is dominated by high-volume, opportunistic ransomware-as-a-service groups (Qilin, TheGentlemen, SafePay, DragonForce, Akira, Nova, Settra) hitting mostly small/mid-size retailers, HVAC/home-services firms, funeral homes, and franchise operations, alongside a smaller number of large, named-brand victims. Layered on top of this baseline is a distinct and increasingly dominant pattern: pure data-extortion campaigns against enterprise SaaS/CRM platforms (the ShinyHunters Salesforce-vishing campaign hit Ralph Lauren, JCPenney/Catalyst Brands, and Madison Square Garden Sports Corp. in 2025-2026) that steal customer and employee data without ever deploying encryption. The sector's most financially destructive incidents, however, remain operational-shutdown events: Marks & Spencer's 2025 DragonForce/Scattered Spider attack cost over £100m directly and roughly £300m in lost operating profit after weeks of manual, pen-and-paper store operations; the 2024 CDK Global (BlackSuit) attack on a shared auto-dealer platform caused an estimated $600m in dealer losses against a reported $25m ransom; and the 2023 MGM Resorts/Caesars Entertainment (Scattered Spider/ALPHV) attacks on hospitality/gaming caused a combined $100m+ loss and a confirmed $15m ransom payment, respectively. Sophos's 2025 retail-specific survey confirms the trend lines visible in these cases: 58% of retailers paying when hit, rising ransom demands (median $2M) alongside a falling encryption rate (48%, a five-year low) as attackers shift toward pure exfiltration, and the highest \"lack of in-house security expertise\" root-cause rate of any sector surveyed - consistent with a highly distributed, thin-security-staff, high-turnover industry that is unusually exposed to help-desk social engineering and third-party/franchise concentration risk.","distinct":"One of the highest-volume targeting categories, spanning single-location dealerships and gyms up to multinational chains, and dominated by high-volume opportunistic RaaS affiliates rather than targeted operators. Distinguished by extreme seasonal revenue concentration and by shared-platform concentration: dealer-management and CRM systems used across thousands of franchises mean one platform compromise produces simultaneous outages across an entire franchise network, as CDK Global demonstrated. PCI-DSS obligations and payment-card liability attach to nearly every incident.","leverage":"POS and store-network outage timed to peak trading periods, plus customer payment-card and loyalty data exposure with PCI and consumer-notification consequence.","tolerance":"Low. Hours to days, collapsing to near-zero during peak seasonal trading when a short outage consumes a disproportionate share of annual margin.","bulk":{"total":1783,"years":{"2015":1,"2017":2,"2019":1,"2020":11,"2021":129,"2022":211,"2023":386,"2024":96,"2025":598,"2026":348},"groups":[["clop",159],["qilin",118],["lockbit3",110],["akira",103],["lockbit2",80],["play",67],["incransom",48],["safepay",46]],"countries":[["US",534],["CA",74],["DE",56],["IT",49],["GB",47],["AU",44]],"pressPct":3,"ransomPct":1},"incidents":[{"v":"Marks & Spencer (M&S)","g":"DragonForce (attack attributed to the \"Scattered Spider\" affiliate cluster)","d":"Disclosed late April 2025","c":"United Kingdom","fin":"M&S disclosed total incident costs of £101.6 million (£82.7m incident response/recovery, £18.9m third-party costs); the company guided to roughly £300 million of lost operating profit for FY2025/26; statutory pre-tax profit fell from £391.9m to £3.4m over the affected half-year; the attack wiped an estimated £750 million off M&S's market capitalization at its worst point.","ran":"Not publicly confirmed whether M&S paid; DragonForce publicly claimed the encryption/extortion but no verified payment amount has been disclosed.","dt":"Online ordering and click-and-collect were suspended for roughly 6-7 weeks; full operational recovery of automated stock/ordering systems took months.","di":"Customer personal data (names, contact details, order history, dates of birth) was confirmed stolen; M&S stated payment card details were not compromised.","s":"One of the most disruptive retail ransomware incidents on record. Attackers used social-engineering (help-desk/Active Directory compromise) to encrypt core systems; DragonForce contacted M&S's CEO directly via a hacked employee email account. M&S was forced to shut down automated ordering, stock and click-and-collect systems for weeks, reverting to pen-and-paper processes for fresh food and clothing supply.","src":["https://www.securityweek.com/marks-spencer-expects-ransomware-attack-to-cost-400-million/","https://www.computerweekly.com/news/366634121/MS-profits-tumble-after-cyber-attack","https://www.blackfog.com/marks-and-spencer-ransomware-attack/","https://breached.company/the-300-million-aftermath-marks-spencers-profit-collapse-reveals-the-true-cost-of-cyber-resilience/"]},{"v":"Co-op Group","g":"DragonForce","d":"April 2025 (disclosed publicly in stages through mid-2025)","c":"United Kingdom","fin":"Co-op reported £206 million in lost revenue attributable to the incident in its official earnings disclosure.","ran":"DragonForce demanded payment for the stolen member data; Co-op has not disclosed paying a ransom, and the UK National Crime Agency arrested four suspects (aged 17-20) in July 2025 on Computer Misuse Act, blackmail, and money-laundering charges.","dt":"Systems were proactively taken offline to contain the threat; the company described a multi-week restoration process for affected back-office and membership systems.","di":"Personal data of all 6.5 million Co-op members was confirmed stolen (names, dates of birth, emails, phone numbers, home addresses); no financial/payment card data was taken.","s":"Part of the same UK retail campaign that hit M&S and Harrods. DragonForce exfiltrated data via third-party/network access, then escalated to a direct extortion threat via Microsoft Teams and a phone call to Co-op's head of security. Co-op proactively disconnected systems to head off a ransomware deployment, which limited operational disruption relative to M&S but did not stop the data theft.","src":["https://cyberinsider.com/co-op-confirms-cyberattack-exposed-data-of-all-6-5-million-members/","https://cypro.co.uk/insights/co-op-cyber-attack/","https://dailysecurityreview.com/security-spotlight/dragonforce-hackers-disrupt-uk-retail-giant-co-op-in-geopolitically-charged-cyberattack/"]},{"v":"CDK Global (SaaS/DMS provider to ~15,000 US/Canada auto dealerships - third-party supply-chain incident affecting the retail auto sector broadly)","g":"BlackSuit","d":"June 18-19, 2024 (two related attacks)","c":"United States / Canada","fin":"Anderson Economic Group estimated total financial damage to dealers at just over $600 million in the first two weeks of the shutdown alone - roughly 24 times the ransom paid.","ran":"Attackers initially demanded $10 million, escalating to $50 million; blockchain analysis (TRM Labs) traced approximately 387 BTC (~$25 million) to a BlackSuit-linked wallet on June 21, 2024, consistent with a paid ransom, though CDK never officially confirmed payment.","dt":"Dealer systems were down for nearly two weeks; CDK restored services in a phased rollout through late June/early July 2024.","di":"Not publicly detailed at the individual-record level; primary reported impact was operational (sales, financing, service scheduling) rather than a disclosed mass PII leak.","s":"BlackSuit ransomware hit CDK Global, the dominant dealer management system (DMS) provider for North American car dealerships, forcing an industry-wide outage. A second attack during initial recovery on June 19 further delayed restoration. Nearly 15,000 dealerships had to revert to manual, paper-based sales, financing, and service workflows for close to two weeks - a textbook example of concentrated third-party/supply-chain risk in the retail sector.","src":["https://cyberscoop.com/cdk-ransom-blacksuit-25-million/","https://edition.cnn.com/2024/07/11/business/cdk-hack-ransom-tweny-five-million-dollars","https://www.cloudskope.com/breaches/cdk-global-breach-2024","https://www.theregister.com/special-features/2024/07/13/cdk-global-said-to-have-paid-25m-ransom-after-cyberattack/1205919"]},{"v":"MGM Resorts International","g":"Scattered Spider / ALPHV (BlackCat)","d":"September 8-11, 2023","c":"United States","fin":"MGM disclosed a $100 million negative impact on Q3 2023 results, comprising approximately $84 million in lost revenue (from disrupted hotel, casino and online operations) and $10 million in one-time technology consulting, legal, and third-party advisory expenses.","ran":"MGM stated it never considered paying and did not pay a ransom.","dt":"Core systems (reservations, digital key cards, slot machines, ATMs) were down for roughly 10 days; full operational recovery took several weeks.","di":"Customer personal information (names, contact details, dates of birth, driver's license and Social Security/passport numbers for some customers) was confirmed stolen.","s":"Scattered Spider used a 10-minute vishing call to MGM's IT help desk (via LinkedIn-sourced employee impersonation) to obtain Okta admin credentials, then handed off to ALPHV/BlackCat for ransomware deployment. MGM chose not to pay and rebuilt systems from backups, causing days of casino, hotel, and slot-machine outages across its Las Vegas properties.","src":["https://specopssoft.com/blog/mgm-resorts-service-desk-hack/","https://netwrix.com/en/resources/blog/mgm-cyber-attack/","https://www.bbrown.com/us/insight/a-look-back-at-the-mgm-and-caesars-incident/"]},{"v":"Caesars Entertainment","g":"Scattered Spider / ALPHV (BlackCat)","d":"August 2023 (disclosed September 2023)","c":"United States","fin":"Not broken out publicly as a discrete total-cost figure (unlike MGM); reported impact centered on the ransom payment and associated incident-response/legal costs, which were not separately quantified in public filings.","ran":"Attackers initially demanded $30 million; Caesars paid approximately $15 million in cryptocurrency to prevent publication of stolen data.","dt":"Caesars avoided the extended, highly visible operational outages MGM experienced, largely because it paid quickly and did not have hotel/casino systems encrypted in the same way.","di":"Loyalty program (Caesars Rewards) database exposed, including driver's license numbers and, for a significant number of members, Social Security numbers.","s":"Scattered Spider socially engineered a third-party IT support vendor for Caesars' identity provider (Okta) to gain network access, exfiltrating loyalty-program customer data before deploying an extortion threat. Unlike MGM, Caesars opted to negotiate and pay, prioritizing avoiding a public data leak and minimizing operational disruption.","src":["https://cybernews.com/news/caesars-15m-ransom-sec-breach-report-6t-stolen-data/","https://www.chainalysis.com/blog/chainalysis-fbi-caesars-ransomware-recovery/","https://www.infosecurity-magazine.com/news/caesars-entertainment-major/"]},{"v":"Ralph Lauren Corporation","g":"ShinyHunters (Salesforce/vishing-based extortion campaign, UNC6040 cluster)","d":"Compromise reported mid-2025; extortion/leak threats through June 2026","c":"United States","fin":"Not publicly disclosed by Ralph Lauren as a discrete cost figure.","ran":"ShinyHunters issued a public leak deadline as extortion leverage; no confirmed ransom payment amount has been reported.","dt":"No significant operational/store downtime reported - this was a data-theft/extortion event rather than an encryption/availability incident.","di":"More than 220 GB of data claimed stolen, including customer information, transaction records, and documents related to unreleased future product lines.","s":"Part of a broad ShinyHunters campaign that used voice-phishing (vishing) against corporate help desks to trick employees into authorizing a malicious connected app in Salesforce, then exfiltrated data via a modified Salesforce Data Loader - a pure data-extortion attack with no encryption payload, illustrating the sector's growing SaaS/CRM exposure.","src":["https://breachnews.com/breaches/shinyhunters-threatens-council-of-europe-american-tower-jcpenney-and-others-with-imminent-data-leaks/","https://blog.eclecticiq.com/shinyhunters-calling-financially-motivated-data-extortion-group-targeting-enterprise-cloud-applications","https://krebsonsecurity.com/2025/10/shinyhunters-wage-broad-corporate-extortion-spree/"]},{"v":"Madison Square Garden Sports Corp. (parent of the New York Knicks; consumer/entertainment services)","g":"ShinyHunters","d":"Claimed June 2026","c":"United States","fin":"Not publicly disclosed.","ran":"Extortion/leak-deadline threat issued by ShinyHunters; no confirmed payment reported.","dt":"No reported operational outage - data-theft/extortion event, not an encryption event.","di":"ShinyHunters claimed roughly 26 million records, including 9.8 million emails, ~9,500 dates of birth, and close to 5 million street addresses/full names/phone numbers; a leaked \"Talent\" file reportedly included former Knicks players/coaches, MSG executives' family members, and celebrities.","s":"Same ShinyHunters Salesforce-vishing campaign as Ralph Lauren/JCPenney. Attackers socially engineered access to MSG's client/talent CRM database using the old-fashioned vishing technique, then claimed a very large-scale data theft spanning customers, staff, and celebrities/former players.","src":["https://www.cpomagazine.com/cyber-security/data-breach-impacts-madison-square-garden-sports-and-the-new-york-knicks/","https://undercodenews.com/shinyhunters-claims-massive-madison-square-garden-sports-data-breach-affecting-26-million-records-dark-web-recent-claims-video/","https://www.inc.com/chloe-aiello/the-massive-madison-square-garden-hack-exposed-celebrities-and-customers-and-started-with-1-old-school-trick/91365306"]},{"v":"Karl Chevrolet / Karl Auto Group","g":"RansomHouse","d":"Unauthorized access before March 27, 2026; discovered April 4, 2026","c":"United States (Iowa)","fin":"Not publicly disclosed.","ran":"Not disclosed by RansomHouse or the dealership; Karl Auto Group stated it \"did not pay ransom money.\"","dt":"Phone and computer systems were unavailable over the Easter weekend (roughly April 4-8, 2026 and reportedly beyond, per public customer-facing social media posts); an outside forensic firm was engaged and the FBI/FTC were notified.","di":"Data exposed reportedly included full names, Social Security numbers, driver's license/government ID numbers, financial account information, and passport numbers/images; the number of affected individuals was not disclosed.","s":"A regional single-location car dealership example (c
