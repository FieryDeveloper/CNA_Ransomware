nical services - IBM does not break out a standalone 'professional services' category)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Ransomware presence in confirmed breaches (2025 dataset)","v":"Ransomware present in 44% of breaches overall; median ransom payout $115,000; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/Tea/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Breaches involving a third party","v":"30% of all breaches involved a third party in 2025, double the prior year's 15% - directly relevant to this sector's MSP/BPO/vendor exposure","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/Tea/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"SMB breaches with a ransomware component","v":"88% of breaches involving small/medium businesses contained a ransomware component in the 2025 dataset - relevant given the long tail of small professional-services and wholesale firms in this sector","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/infographics/2025-dbir-smb-snapshot.pdf"},{"m":"Total on-chain ransomware payments, 2025","v":"Approximately $820 million globally (down ~8% YoY), though the figure was expected to rise toward $900M as more incidents are later attributed","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Share of ransomware incidents where ransom is paid (2025)","v":"Approximately 28%, a record low, even as claimed victim counts rose roughly 50% YoY","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median individual ransom demand growth, 2025","v":"Grew 368% year-over-year to nearly $60,000","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Business Services sector claimed-victim volume observed on ransomware.live","v":"100+ new claimed victims logged in just the ~3-week window of June 30-July 19, 2026 alone, spanning US, Brazil, South Africa, Czechia, Mexico, Bangladesh, Netherlands, Italy, Japan, Germany, Ireland, Spain, Greece, and Pakistan; dominant claiming groups in that window: Qilin, DragonForce, INC Ransom, TheGentlemen, Deadlock, Akira, and m3rx","s":"ransomware.live v2 API, sectorvictims/Business Services endpoint","u":"https://api.ransomware.live/v2/sectorvictims/Business%20Services"}]},{"name":"Public Administration (Government)","tag":"Public Sector","overview":"Public administration, national ministries, state/provincial agencies, and city/county/municipal governments, plus public libraries, courts, and administrative boards, is one of the most heavily and persistently targeted sectors for ransomware. Governments are attractive targets because they run large, heterogeneous, and often under-funded legacy IT estates; hold vast quantities of citizen PII and sensitive records; deliver essential, hard-to-suspend public services (911/emergency dispatch, tax and revenue collection, benefits, permitting, courts, utilities billing); and are politically visible, which raises the pressure to restore service quickly. Unlike private firms, governments frequently refuse to pay ransoms as a matter of policy, so the dominant financial exposure is not the ransom itself but the downstream cost of downtime, forensic investigation, system rebuild/replacement, credit monitoring for affected citizens, and legal/notification obligations, which routinely run many multiples of the original demand (e.g. Atlanta ~$17M vs a ~$51K demand; Baltimore ~$18M vs a ~$76K demand; Columbus $7.3M recovery vs a $1.9M demand refused). The sector also faces a distinctive blend of financially-motivated ransomware-as-a-service crews (Royal, Rhysida, Play, LockBit, BlackCat/ALPHV, Interlock, Medusa) and, at the national level, state-nexus actors where extortion and espionage overlap. Double- and triple-extortion (encryption plus data leak plus public shaming/notification of citizens) is now standard, making even well-backed-up governments vulnerable to reputational and privacy harm. From a cyber-insurance standpoint, the sector is characterized by high attack frequency, high aggregate downtime/recovery loss, moderate-to-low ransom-payment rates, strong dependence on third-party MSPs and shared statewide systems (systemic/aggregation risk), and significant regulatory and public-accountability exposure.","distinct":"Large, heterogeneous, chronically under-funded legacy estates holding vast citizen PII, delivering essential services that cannot simply be suspended, 911 dispatch, tax collection, benefits, permitting, courts. Uniquely constrained on the payment decision: appropriated budgets, public-records disclosure obligations and political scrutiny mean payment is often legally or politically foreclosed, so loss migrates into extended interruption, forensic rebuild and notification cost rather than ransom. Incidents become governance and electoral events.","leverage":"Disruption of essential and public-safety services combined with citizen PII exposure and acute political/reputational pressure on officials.","tolerance":"Bifurcated. Near-zero for public-safety and emergency dispatch; weeks to months tolerated in practice for administrative functions, largely because recovery capacity rather than acceptable risk sets the timeline.","bulk":{"total":1279,"years":{"2013":2,"2014":2,"2015":4,"2016":10,"2017":14,"2018":11,"2019":18,"2020":23,"2021":78,"2022":142,"2023":221,"2024":249,"2025":335,"2026":170},"groups":[["lockbit3",112],["qilin",82],["incransom",51],["babuk2",45],["ransomhub",39],["lockbit2",38],["medusa",35],["rhysida",31]],"countries":[["US",456],["FR",49],["CA",34],["BR",28],["IL",24],["DE",22]],"pressPct":14,"ransomPct":1},"incidents":[{"v":"Government of Costa Rica (national ministries)","g":"Conti","d":"April-May 2022","c":"Costa Rica","fin":"Economic drag estimated at ~$38 million per day of downtime; the Costa Rican Chamber of Foreign Commerce estimated losses exceeding $125 million in the first two days alone (halted tax/customs). Costa Rica invested ~$25 million in recovery; the U.S. State Department pledged $25 million in March 2023 to aid recovery and cyber-capacity building.","ran":"Conti demanded US$10 million, later doubled to US$20 million; the government declined to pay.","dt":"Critical systems (Hacienda, CCSS) disrupted for weeks to months; a second wave (attributed to HIVE) hit the CCSS health system on 31 May 2022, forcing manual operations across hospitals. Recovery spanned months with international assistance.","di":"Data exfiltrated from the Ministry of Finance and other bodies; Conti published stolen data on its leak site when the ransom was refused.","s":"Conti hit nearly 30 Costa Rican government institutions including the Ministry of Finance (Hacienda), CCSS social security fund, MICITT, labor ministry, and state ISP RACSA. On 8 May 2022 President Rodrigo Chaves declared a national state of emergency and characterized it as an act of terrorism/'war' - the first time a country declared a national emergency over ransomware. Tax collection, customs, and public services were paralyzed.","src":["https://en.wikipedia.org/wiki/2022_Costa_Rican_ransomware_attack","https://www.msspalert.com/news/costa-rica-conti-attack","https://www.sangfor.com/blog/cybersecurity/conti-ransomware-attack-throws-costa-rica-national-state-emergency","https://cyberlaw.ccdcoe.org/wiki/Costa_Rica_ransomware_attack_(2022)"]},{"v":"City of Atlanta, Georgia","g":"SamSam","d":"March 2018","c":"United States","fin":"Recovery ultimately cost approximately $17 million (a confidential report figure), roughly six times the initial ~$3M estimate. Break-down: ~$6M initial response, ~$11M to repair/replace damaged systems, desktops, laptops and devices. The city had initially budgeted ~$6M.","ran":"Attackers demanded about $51,000 (roughly 6 bitcoin) in total; Atlanta did not pay.","dt":"Multiple departments were down or degraded for days to weeks; some systems and data were never fully recovered, and years of police dashcam footage were lost.","di":"Numerous applications and records affected; some data permanently lost (e.g. police dashcam video). Broad operational data loss rather than a quantified PII count.","s":"SamSam ransomware crippled City of Atlanta systems, taking down online bill-pay, court systems, and numerous municipal applications. A landmark early municipal ransomware case; two Iranian nationals (Faramarz Shahi Savandi and Mohammad Mehdi Shah Mansouri) were indicted by the U.S. DOJ in November 2018.","src":["https://en.wikipedia.org/wiki/Atlanta_government_ransomware_attack","https://www.hipaajournal.com/the-high-cost-of-samsam-ransomware-attacks-17-million-for-the-city-of-atlanta/","https://www.bitdefender.com/en-us/blog/hotforsecurity/at-17-million-atlanta-network-recovery-six-times-more-expensive-than-estimated","https://www.securityweek.com/city-atlanta-ransomware-attack-proves-disastrously-expensive/"]},{"v":"City of Baltimore, Maryland","g":"RobbinHood","d":"May 2019","c":"United States","fin":"Estimated ~$18 million total: ~$10 million to restore/rebuild systems plus ~$8 million in lost or deferred revenue.","ran":"Attackers demanded 13 bitcoin (~$76,000-$80,000 at the time); Mayor Bernard 'Jack' Young refused to pay.","dt":"Recovery, initially expected to take weeks, ultimately extended from May into roughly September 2019 (~4 months) for full restoration.","di":"Widespread system encryption; disruption to city databases and payment/records systems. No large single PII-breach count is the headline - impact was primarily operational.","s":"On 7 May 2019 RobbinHood ransomware took most of Baltimore's government systems offline (all servers except essential services). Email was down, forcing employees to use personal Gmail; property transfers and the water-billing/payment systems were frozen, disrupting the real-estate market.","src":["https://en.wikipedia.org/wiki/2019_Baltimore_ransomware_attack","https://www.upi.com/Top_News/US/2019/06/10/Hack-that-cost-Baltimore-18M-a-mystery-after-experts-eye-NSA-link/7961559775882/","https://www.verizon.com/business/resources/articles/s/lessons-from-the-robbinhood-ransomware-attack-on-baltimore/"]},{"v":"City of Dallas, Texas","g":"Royal","d":"May 2023","c":"United States","fin":"The city approved roughly $8.5 million in costs to remediate and recover from the attack (downtime/response costs).","ran":"No ransom payment was publicly reported/confirmed as paid; ransom demand not publicly disclosed.","dt":"Multiple systems, including 911/CAD and municipal court operations, were disrupted for weeks; restoration efforts continued over several weeks into the summer of 2023.","di":"More than 27,000 current and former employees and their dependents were notified that their personally identifiable information was exposed in the attack.","s":"The Royal ransomware gang attacked the City of Dallas in May 2023, disrupting critical services including 911 dispatch systems, police/court operations, and city websites. One of the most significant U.S. municipal attacks of 2023.","src":["https://www.comparitech.com/blog/information-security/government-ransomware-attacks/","https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"]},{"v":"City of Columbus, Ohio","g":"Rhysida","d":"July 2024","c":"United States","fin":"The city spent about $7.3 million on recovery, including ~$2.4M for forensics/remediation/data-mining, ~$1.6M for Experian identity-theft protection, and ~$1.95M for legal counsel.","ran":"Rhysida demanded about $1.9 million (~30 bitcoin); Columbus refused to pay, after which the group leaked stolen data.","dt":"City services and systems were disrupted for weeks; recovery and remediation extended over months, with continued identity-protection provisioning for affected residents.","di":"Large volume of resident and employee data exposed and partially leaked (including data tied to crime victims and city employees); the city offered Experian identity-theft protection to affected individuals (hundreds of thousands).","s":"Rhysida struck the City of Columbus in July 2024. The city refused to pay and, notably, sued a security researcher who publicized the leaked data - drawing national attention to how governments handle post-breach disclosure.","src":["https://blog.knowbe4.com/ransomware-recovery-costs-have-doubled-for-state-and-local-governments","https://www.comparitech.com/blog/information-security/government-ransomware-attacks/","https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"]},{"v":"The British Library","g":"Rhysida","d":"October 2023","c":"United Kingdom","fin":"Recovery expected to consume roughly 40% of the Library's financial reserves - about £6-7 million (~$7.5-9M) - far exceeding the ransom demanded. Follow-on rebuild tenders (e.g. ~£400,000) continued into 2024-2025.","ran":"Rhysida demanded 20 bitcoin (~£596,000 / ~$750,000 at the time); the Library did not pay.","dt":"Severe disruption for months; the main catalogue returned in read-only form on 15 January 2024, with many services degraded well into 2024. Full rebuild extended over more than a year.","di":"Approximately 600GB / nearly 500,000 files exfiltrated - much from the CRM database - including personal data of Library users and staff; ~600GB was publicly dumped when the ransom was refused. ~20,000 authors/illustrators had Public Lending Right payments delayed.","s":"On 28 October 2023 Rhysida attacked the British Library (a UK public/national institution), taking down its website, catalogue, and public Wi-Fi. Described as 'one of the worst cyber incidents in British history'; the Library refused to pay and the attackers leaked the stolen data.","src":["https://en.wikipedia.org/wiki/British_Library_cyberattack","https://www.computerweekly.com/news/366565574/British-Library-ransomware-attack-could-cost-up-to-7m","https://www.securityweek.com/details-and-lessons-learned-from-the-ransomware-attack-on-the-british-library/","https://www.itpro.com/security/cyber-attacks/british-library-eyes-pound400000-rebuild-after-devastating-2023-cyber-attack"]},{"v":"City of Saint Paul, Minnesota","g":"Interlock","d":"July 2025","c":"United States","fin":"Not publicly disclosed as a total figure as of reporting; response involved state resources and the National Guard, indicating substantial cost.","ran":"The city stated it would not pay the ransom; specific demand amount not publicly disclosed.","dt":"Core city systems were down and progressively restored over weeks following the July 25 onset; the National Guard's involvement reflected the complexity of recovery.","di":"After the city refused to pay, Interlock publicly posted approximately 43GB of data stolen from St. Paul.","s":"A cyberattack beginning 25 July 2025 hit the City of St. Paul so severely that the Minnesota National Guard was activated to assist. The mayor confirmed it as a ransomware attack by the Interlock ransomware-as-a-service group. Core systems - internal networks, online payment portals, and public Wi-Fi - were disrupted.","src":["https://en.wikipedia.org/wiki/2025_St._Paul_cyberattack","https://www.govtech.com/security/st-paul-minn-systems-come-back-online-after-cyber-attack","https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"]},{"v":"State of Nevada","g":"Not publicly attributed (ransomware)","d":"August 2025","c":"United States","fin":"Not publicly disclosed at time of reporting.","ran":"Not publicly disclosed.","dt":"Multiple state services - phone systems and agency websites - were interrupted; recovery handled with federal (CISA/FBI) assistance over the following days/weeks.","di":"Under investigation at time of reporting; data-theft impact not fully quantified publicly.","s":"Federal and state authorities investigated a ransomware attack that disrupted key services across the State of Nevada in August 2025, interrupting multiple government services including phone systems and state agency websites - illustrating the escalation of ransomware to the U.S. state-government level.","src":["https://www.cybersecuritydive.com/news/federal-state-investigating-ransomware-nevada/758863/","https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"]}],"stats":[{"m":"Share of state & local government organizations hit by ransomware in the past year (2024)","v":"34% (down 51% from 69% reported in 2023)","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Mean recovery cost per ransomware attack, state & local government (2024)","v":"$2.83 million (more than double the $1.21M reported in 2023)","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Median ransom payment, state & local government (2024)","v":"$2.2 million; 54% of those hit paid to get data back; victims paid ~104% of the initial demand on average","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Share of computers/devices impacted per attack, state & local government","v":"~56% of machines affected on average (above the 49% cross-sector average); 78% restored data from backups","s":"Sophos, The State of Ransomware in State and Local Government 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-state-and-local-government-2024"},{"m":"Cumulative U.S. government ransomware attacks & estimated downtime cost (2018-Dec 2024)","v":"525 individual attacks on U.S. government organizations, ~$1.09 billion in estimated downtime cost","s":"Comparitech, Government ransomware attacks analysis","u":"https://www.comparitech.com/blog/information-security/government-ransomware-attacks/"},{"m":"Ransomware presence in breaches, all sectors (Verizon 2025 DBIR)","v":"Ransomware present in 44% of breaches (up ~37% YoY); median payout fell to ~$115K; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Ransomware & extortion share of breaches, all sectors (Verizon 2024 DBIR)","v":"Ransomware in ~23% of breaches (one-third when combined with extortion at 9%); median ransom demand ~1.34% of victim revenue","s":"Verizon 2024 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2024-dbir-data-breach-investigations-report.pdf"},{"m":"Espionage-motivated breaches (Verizon 2025 DBIR) - relevant to national government","v":"Espionage breaches up 163% YoY, now 17% of incidents; 28% of state-linked breaches also financially motivated ('double-dipping')","s":"Verizon 2025 Data Breach Investigations Report","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Global average total cost of a data breach, all industries (2024) - public-sector context","v":"$4.88 million global average (record high); the public sector is consistently among the lowest-cost industries in IBM's dataset (public-sector-specific figure not isolated in accessed sources)","s":"IBM Cost of a Data Breach Report 2024","u":"https://www.ibm.com/think/insights/whats-new-2024-cost-of-a-data-breach-report"},{"m":"Growth in ransomware incidents against government bodies, H1 2025","v":"~65% increase in ransomware incidents affecting government bodies vs. the same period a year earlier","s":"SOCRadar, U.S. State & Local Government Ransomware 2025-2026 trend analysis","u":"https://socradar.io/blog/us-state-local-government-ransomware-2025-2026/"},{"m":"Overall ransomware payment trend (Sophos 2024, cross-sector)","v":"Average ransom payments increased ~500% year-over-year across sectors","s":"Sophos, The State of Ransomware 2024 (press release)","u":"https://www.sophos.com/en-us/press/press-releases/2024/04/ransomware-payments-increase-500-last-year-finds-sophos-state"}]},{"name":"Retail Trade and Consumer Services","tag":"Consumer Services","overview":"Retail Trade and Consumer Services (ransomware.live's \"Consumer Services\" sector tag) is one of the highest-volume ransomware targeting categories, spanning everything from single-location dealerships, gyms, and jewelry shops up to multinational department-store chains, casino/hospitality operators, and the shared SaaS platforms (CRM, dealer-management systems) that underpin the industry. A live pull of the ransomware.live sector feed (~120 victim postings across roughly a 2-month window in mid-2026) shows the sector is dominated by high-volume, opportunistic ransomware-as-a-service groups (Qilin, TheGentlemen, SafePay, DragonForce, Akira, Nova, Settra) hitting mostly small/mid-size retailers, HVAC/home-services firms, funeral homes, and franchise operations, alongside a smaller number of large, named-brand victims. Layered on top of this baseline is a distinct and increasingly dominant pattern: pure data-extortion campaigns against enterprise SaaS/CRM platforms (the ShinyHunters Salesforce-vishing campaign hit Ralph Lauren, JCPenney/Catalyst Brands, and Madison Square Garden Sports Corp. in 2025-2026) that steal customer and employee data without ever deploying encryption. The sector's most financially destructive incidents, however, remain operational-shutdown events: Marks & Spencer's 2025 DragonForce/Scattered Spider attack cost over £100m directly and roughly £300m in lost operating profit after weeks of manual, pen-and-paper store operations; the 2024 CDK Global (BlackSuit) attack on a shared auto-dealer platform caused an estimated $600m in dealer losses against a reported $25m ransom; and the 2023 MGM Resorts/Caesars Entertainment (Scattered Spider/ALPHV) attacks on hospitality/gaming caused a combined $100m+ loss and a confirmed $15m ransom payment, respectively. Sophos's 2025 retail-specific survey confirms the trend lines visible in these cases: 58% of retailers paying when hit, rising ransom demands (median $2M) alongside a falling encryption rate (48%, a five-year low) as attackers shift toward pure exfiltration, and the highest \"lack of in-house security expertise\" root-cause rate of any sector surveyed - consistent with a highly distributed, thin-security-staff, high-turnover industry that is unusually exposed to help-desk social engineering and third-party/franchise concentration risk.","distinct":"One of the highest-volume targeting categories, spanning single-location dealerships and gyms up to multinational chains, and dominated by high-volume opportunistic RaaS affiliates rather than targeted operators. Distinguished by extreme seasonal revenue concentration and by shared-platform concentration: dealer-management and CRM systems used across thousands of franchises mean one platform compromise produces simultaneous outages across an entire franchise network, as CDK Global demonstrated. PCI-DSS obligations and payment-card liability attach to nearly every incident.","leverage":"POS and store-network outage timed to peak trading periods, plus customer payment-card and loyalty data exposure with PCI and consumer-notification consequence.","tolerance":"Low. Hours to days, collapsing to near-zero during peak seasonal trading when a short outage consumes a disproportionate share of annual margin.","bulk":{"total":1783,"years":{"2015":1,"2017":2,"2019":1,"2020":11,"2021":129,"2022":211,"2023":386,"2024":96,"2025":598,"2026":348},"groups":[["clop",159],["qilin",118],["lockbit3",110],["akira",103],["lockbit2",80],["play",67],["incransom",48],["safepay",46]],"countries":[["US",534],["CA",74],["DE",56],["IT",49],["GB",47],["AU",44]],"pressPct":3,"ransomPct":1},"incidents":[{"v":"Marks & Spencer (M&S)","g":"DragonForce (attack attributed to the \"Scattered Spider\" affiliate cluster)","d":"Disclosed late April 2025","c":"United Kingdom","fin":"M&S disclosed total incident costs of £101.6 million (£82.7m incident response/recovery, £18.9m third-party costs); the company guided to roughly £300 million of lost operating profit for FY2025/26; statutory pre-tax profit fell from £391.9m to £3.4m over the affected half-year; the attack wiped an estimated £750 million off M&S's market capitalization at its worst point.","ran":"Not publicly confirmed whether M&S paid; DragonForce publicly claimed the encryption/extortion but no verified payment amount has been disclosed.","dt":"Online ordering and click-and-collect were suspended for roughly 6-7 weeks; full operational recovery of automated stock/ordering systems took months.","di":"Customer personal data (names, contact details, order history, dates of birth) was confirmed stolen; M&S stated payment card details were not compromised.","s":"One of the most disruptive retail ransomware incidents on record. Attackers used social-engineering (help-desk/Active Directory compromise) to encrypt core systems; DragonForce contacted M&S's CEO directly via a hacked employee email account. M&S was forced to shut down automated ordering, stock and click-and-collect systems for weeks, reverting to pen-and-paper processes for fresh food and clothing supply.","src":["https://www.securityweek.com/marks-spencer-expects-ransomware-attack-to-cost-400-million/","https://www.computerweekly.com/news/366634121/MS-profits-tumble-after-cyber-attack","https://www.blackfog.com/marks-and-spencer-ransomware-attack/","https://breached.company/the-300-million-aftermath-marks-spencers-profit-collapse-reveals-the-true-cost-of-cyber-resilience/"]},{"v":"Co-op Group","g":"DragonForce","d":"April 2025 (disclosed publicly in stages through mid-2025)","c":"United Kingdom","fin":"Co-op reported £206 million in lost revenue attributable to the incident in its official earnings disclosure.","ran":"DragonForce demanded payment for the stolen member data; Co-op has not disclosed paying a ransom, and the UK National Crime Agency arrested four suspects (aged 17-20) in July 2025 on Computer Misuse Act, blackmail, and money-laundering charges.","dt":"Systems were proactively taken offline to contain the threat; the company described a multi-week restoration process for affected back-office and membership systems.","di":"Personal data of all 6.5 million Co-op members was confirmed stolen (names, dates of birth, emails, phone numbers, home addresses); no financial/payment card data was taken.","s":"Part of the same UK retail campaign that hit M&S and Harrods. DragonForce exfiltrated data via third-party/network access, then escalated to a direct extortion threat via Microsoft Teams and a phone call to Co-op's head of security. Co-op proactively disconnected systems to head off a ransomware deployment, which limited operational disruption relative to M&S but did not stop the data theft.","src":["https://cyberinsider.com/co-op-confirms-cyberattack-exposed-data-of-all-6-5-million-members/","https://cypro.co.uk/insights/co-op-cyber-attack/","https://dailysecurityreview.com/security-spotlight/dragonforce-hackers-disrupt-uk-retail-giant-co-op-in-geopolitically-charged-cyberattack/"]},{"v":"CDK Global (SaaS/DMS provider to ~15,000 US/Canada auto dealerships - third-party supply-chain incident affecting the retail auto sector broadly)","g":"BlackSuit","d":"June 18-19, 2024 (two related attacks)","c":"United States / Canada","fin":"Anderson Economic Group estimated total financial damage to dealers at just over $600 million in the first two weeks of the shutdown alone - roughly 24 times the ransom paid.","ran":"Attackers initially demanded $10 million, escalating to $50 million; blockchain analysis (TRM Labs) traced approximately 387 BTC (~$25 million) to a BlackSuit-linked wallet on June 21, 2024, consistent with a paid ransom, though CDK never officially confirmed payment.","dt":"Dealer systems were down for nearly two weeks; CDK restored services in a phased rollout through late June/early July 2024.","di":"Not publicly detailed at the individual-record level; primary reported impact was operational (sales, financing, service scheduling) rather than a disclosed mass PII leak.","s":"BlackSuit ransomware hit CDK Global, the dominant dealer management system (DMS) provider for North American car dealerships, forcing an industry-wide outage. A second attack during initial recovery on June 19 further delayed restoration. Nearly 15,000 dealerships had to revert to manual, paper-based sales, financing, and service workflows for close to two weeks - a textbook example of concentrated third-party/supply-chain risk in the retail sector.","src":["https://cyberscoop.com/cdk-ransom-blacksuit-25-million/","https://edition.cnn.com/2024/07/11/business/cdk-hack-ransom-tweny-five-million-dollars","https://www.cloudskope.com/breaches/cdk-global-breach-2024","https://www.theregister.com/special-features/2024/07/13/cdk-global-said-to-have-paid-25m-ransom-after-cyberattack/1205919"]},{"v":"MGM Resorts International","g":"Scattered Spider / ALPHV (BlackCat)","d":"September 8-11, 2023","c":"United States","fin":"MGM disclosed a $100 million negative impact on Q3 2023 results, comprising approximately $84 million in lost revenue (from disrupted hotel, casino and online operations) and $10 million in one-time technology consulting, legal, and third-party advisory expenses.","ran":"MGM stated it never considered paying and did not pay a ransom.","dt":"Core systems (reservations, digital key cards, slot machines, ATMs) were down for roughly 10 days; full operational recovery took several weeks.","di":"Customer personal information (names, contact details, dates of birth, driver's license and Social Security/passport numbers for some customers) was confirmed stolen.","s":"Scattered Spider used a 10-minute vishing call to MGM's IT help desk (via LinkedIn-sourced employee impersonation) to obtain Okta admin credentials, then handed off to ALPHV/BlackCat for ransomware deployment. MGM chose not to pay and rebuilt systems from backups, causing days of casino, hotel, and slot-machine outages across its Las Vegas properties.","src":["https://specopssoft.com/blog/mgm-resorts-service-desk-hack/","https://netwrix.com/en/resources/blog/mgm-cyber-attack/","https://www.bbrown.com/us/insight/a-look-back-at-the-mgm-and-caesars-incident/"]},{"v":"Caesars Entertainment","g":"Scattered Spider / ALPHV (BlackCat)","d":"August 2023 (disclosed September 2023)","c":"United States","fin":"Not broken out publicly as a discrete total-cost figure (unlike MGM); reported impact centered on the ransom payment and associated incident-response/legal costs, which were not separately quantified in public filings.","ran":"Attackers initially demanded $30 million; Caesars paid approximately $15 million in cryptocurrency to prevent publication of stolen data.","dt":"Caesars avoided the extended, highly visible operational outages MGM experienced, largely because it paid quickly and did not have hotel/casino systems encrypted in the same way.","di":"Loyalty program (Caesars Rewards) database exposed, including driver's license numbers and, for a significant number of members, Social Security numbers.","s":"Scattered Spider socially engineered a third-party IT support vendor for Caesars' identity provider (Okta) to gain network access, exfiltrating loyalty-program customer data before deploying an extortion threat. Unlike MGM, Caesars opted to negotiate and pay, prioritizing avoiding a public data leak and minimizing operational disruption.","src":["https://cybernews.com/news/caesars-15m-ransom-sec-breach-report-6t-stolen-data/","https://www.chainalysis.com/blog/chainalysis-fbi-caesars-ransomware-recovery/","https://www.infosecurity-magazine.com/news/caesars-entertainment-major/"]},{"v":"Ralph Lauren Corporation","g":"ShinyHunters (Salesforce/vishing-based extortion campaign, UNC6040 cluster)","d":"Compromise reported mid-2025; extortion/leak threats through June 2026","c":"United States","fin":"Not publicly disclosed by Ralph Lauren as a discrete cost figure.","ran":"ShinyHunters issued a public leak deadline as extortion leverage; no confirmed ransom payment amount has been reported.","dt":"No significant operational/store downtime reported - this was a data-theft/extortion event rather than an encryption/availability incident.","di":"More than 220 GB of data claimed stolen, including customer information, transaction records, and documents related to unreleased future product lines.","s":"Part of a broad ShinyHunters campaign that used voice-phishing (vishing) against corporate help desks to trick employees into authorizing a malicious connected app in Salesforce, then exfiltrated data via a modified Salesforce Data Loader - a pure data-extortion attack with no encryption payload, illustrating the sector's growing SaaS/CRM exposure.","src":["https://breachnews.com/breaches/shinyhunters-threatens-council-of-europe-american-tower-jcpenney-and-others-with-imminent-data-leaks/","https://blog.eclecticiq.com/shinyhunters-calling-financially-motivated-data-extortion-group-targeting-enterprise-cloud-applications","https://krebsonsecurity.com/2025/10/shinyhunters-wage-broad-corporate-extortion-spree/"]},{"v":"Madison Square Garden Sports Corp. (parent of the New York Knicks; consumer/entertainment services)","g":"ShinyHunters","d":"Claimed June 2026","c":"United States","fin":"Not publicly disclosed.","ran":"Extortion/leak-deadline threat issued by ShinyHunters; no confirmed payment reported.","dt":"No reported operational outage - data-theft/extortion event, not an encryption event.","di":"ShinyHunters claimed roughly 26 million records, including 9.8 million emails, ~9,500 dates of birth, and close to 5 million street addresses/full names/phone numbers; a leaked \"Talent\" file reportedly included former Knicks players/coaches, MSG executives' family members, and celebrities.","s":"Same ShinyHunters Salesforce-vishing campaign as Ralph Lauren/JCPenney. Attackers socially engineered access to MSG's client/talent CRM database using the old-fashioned vishing technique, then claimed a very large-scale data theft spanning customers, staff, and celebrities/former players.","src":["https://www.cpomagazine.com/cyber-security/data-breach-impacts-madison-square-garden-sports-and-the-new-york-knicks/","https://undercodenews.com/shinyhunters-claims-massive-madison-square-garden-sports-data-breach-affecting-26-million-records-dark-web-recent-claims-video/","https://www.inc.com/chloe-aiello/the-massive-madison-square-garden-hack-exposed-celebrities-and-customers-and-started-with-1-old-school-trick/91365306"]},{"v":"Karl Chevrolet / Karl Auto Group","g":"RansomHouse","d":"Unauthorized access before March 27, 2026; discovered April 4, 2026","c":"United States (Iowa)","fin":"Not publicly disclosed.","ran":"Not disclosed by RansomHouse or the dealership; Karl Auto Group stated it \"did not pay ransom money.\"","dt":"Phone and computer systems were unavailable over the Easter weekend (roughly April 4-8, 2026 and reportedly beyond, per public customer-facing social media posts); an outside forensic firm was engaged and the FBI/FTC were notified.","di":"Data exposed reportedly included full names, Social Security numbers, driver's license/government ID numbers, financial account information, and passport numbers/images; the number of affected individuals was not disclosed.","s":"A regional single-location car dealership example (contrasted with the CDK/M&S/MGM enterprise-scale cases) illustrating that ransomware targets consumer-services retailers across the full size spectrum, not just national chains. RansomHouse claimed encryption of dealership systems.","src":["https://dysruptionhub.com/karl-auto-group-iowa-cyberattack/"]},{"v":"PChome (pchome.com.tw) / NetHome Group and subsidiary Bibian","g":"Settra","d":"Claimed June 10, 2026; disclosed publicly late June 2026","c":"Taiwan","fin":"Not publicly disclosed.","ran":"Not disclosed.","dt":"PChome stated its main platforms and payment channels continued operating normally with no evidence of an actual breach to core systems; no confirmed outage was reported.","di":"Settra claimed approximately 102GB of internal data stolen, including personal information for roughly 3.5 million members, nine years of operational records, system architecture diagrams, and employee personnel files; subsidiary Bibian separately confirmed exposure of member names, phone numbers, addresses, and purchase history, which reportedly led to follow-on phishing campaigns against customers.","s":"A major Taiwanese e-commerce/payment platform targeted by the emerging Settra group, illustrating ransomware risk to online-retail and embedded-payment infrastructure outside the US/UK. The parent company publicly disputed that its core systems were breached, while an affiliated subsidiary (Bibian) confirmed a related, separate data breach - a useful example of attacker claims vs. victim denial/dispute dynamics common in this sector.","src":["https://cyberq.tw/2026/06/30/nethome-group-is-caught-in-a-double/"]},{"v":"Citi Trends, Inc.","g":"Hive","d":"2023-01-14","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company activated its incident response and business continuity plan to support the restoration of affected systems. Critical operating systems were restored, and the flow of merchandise to stores began to normalize during the third week of February 2023.","di":"Sensitive customer data is not retained on its systems.","s":"Citi Trends, Inc. experienced a disruption of its back office and distribution center IT systems due to Hive ransomware on January 14, 2023. The FBI provided tools to help restore affected systems, and the company's stores and financial systems remained operational throughout the incident.","src":["https://www.sec.gov/Archives/edgar/data/1318484/000110465923024793/tm237638d1_8k.htm","https://www.sec.gov/Archives/edgar/data/1318484/000131848423000004/ct-20230223.htm"]}],"stats":[{"m":"Retailers hit by ransomware who paid the ransom (2025)","v":"58% (up from ~30% in 2021), nearly doubling over 5 years","s":"Sophos, The State of Ransomware in Retail 2025 (survey of 361 retail IT/security leaders, 16 countries, Jan-Mar 2025)","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Median ransom demand, retail sector (2025)","v":"$2,000,000 (doubled from $1,000,000 in 2024)","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Median ransom payment, retail sector (2025)","v":"$1,000,000 (up 5% from $950,000 in 2024)","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Average recovery cost excluding ransom, retail sector (2025)","v":"$1.65M, down 40% year-over-year, lowest in 3 years","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Data encryption rate in retail ransomware attacks (2025)","v":"48% of attacks resulted in encryption (5-year low); extortion-only (no encryption) attacks rose from 2% in 2023 to 6% in 2025","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Root cause of retail ransomware attacks (2025)","v":"Exploited vulnerability: 30% of incidents; \"lack of expertise/capacity in-house\" cited as root cause in 45% of attacks - the highest rate of any sector Sophos surveyed","s":"Sophos, The State of Ransomware in Retail 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-retail-2025"},{"m":"Average ransomware payment, all sectors, Q2 2025","v":"$1.13 million","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average ransomware payment, all sectors, Q3 2025","v":"$376,941","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Average ransomware payment, all sectors, Q4 2025","v":"$591,988","s":"Coveware Quarterly Ransomware Report","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Consumer Services sector victim postings observed on ransomware.live (snapshot)","v":"~120 posted victims in the roughly 2-month window (approx. May 20 - Jul 19, 2026) returned by the API's sectorvictims endpoint; dominant claiming groups in this window: Qilin, TheGentlemen, SafePay, DragonForce, Akira, ShinyHunters, Settra, and Nova","s":"ransomware.live API v2/sectorvictims/Consumer Services (direct pull, not a third-party report)","u":"https://api.ransomware.live/v2/sectorvictims/Consumer%20Services"}]},{"name":"Telecommunications","tag":"Telecommunication","overview":"The telecommunications sector - internet service providers, mobile network operators, fixed-line/cable carriers, tower/infrastructure companies, and satellite/media-adjacent telecom firms - has become an increasingly frequent ransomware and data-extortion target. Ransomware.live's own sector tracker lists 357 telecom-sector victims (tag \"Telecommunication\") with a pronounced acceleration in 2025-2026 (124 posted in 2025 alone, the sector's most active year on record, plus 62 more in the first ~7 months of 2026), corroborated by Cyble/Cybersecurity Dive research showing telecom ransomware attack volume grew roughly fourfold from 24 in 2022 to 90 in 2025. The threat-actor landscape is dominated by prolific double-extortion RaaS groups (Qilin, Akira, LockBit variants, Play, Clop) alongside a newer wave of pure data-extortion/leak-only crews with no encryption capability (Arkana Security, ShinyHunters, DragonForce) that specifically target telecom's dense stores of subscriber PII, SIM/USIM credentials, and call-detail metadata. What distinguishes telecom from most other industries in this taxonomy is the sector's dual exposure: (1) a large, regulated subscriber-PII attack surface comparable to healthcare or financial services, and (2) an \"OT-equivalent\" core-network/availability layer (HSS/HLR, BGP routing, voice/SMS switching, physical tower infrastructure) where a successful intrusion can cascade into regional or national service outages - as seen in incidents ranging from Vodafone Portugal's multi-day national outage to Cellcom's week-long US regional voice/SMS blackout. Third-party and supply-chain exposure is also unusually acute, given telecom's dependence on field-service subcontractors, MVNO/reseller relationships, shared backend SaaS platforms, and industry bodies - Verizon's 2025 DBIR found third-party involvement in 30% of all breaches, up sharply from roughly 15% the year before. Regulatory consequences have grown correspondingly severe, exemplified by SK Telecom's record $97.2M Korean privacy-regulator fine and mandated per-subscriber compensation after its 2025 USIM-data breach.","distinct":"357 tracked victims with pronounced acceleration, 124 in 2025, the sector's most active year on record, plus 62 more in the first seven months of 2026. Carriers are single points of failure for downstream connectivity, so an outage propagates into every dependent business and household. Uniquely combines mass subscriber PII, core network and signaling systems functioning as OT-equivalents, and lawful-intercept and critical-infrastructure systems whose compromise carries national-security consequence beyond commercial loss.","leverage":"Service availability affecting large downstream populations, plus mass subscriber PII and call-detail records with regulatory and surveillance sensitivity.","tolerance":"Very low. Minutes to hours for core network and signaling; regulatory service-obligation and SLA penalties begin accruing almost immediately.","bulk":{"total":357,"years":{"2017":5,"2019":4,"2020":11,"2021":28,"2022":43,"2023":68,"2024":12,"2025":124,"2026":62},"groups":[["qilin",25],["akira",22],["lockbit3",17],["play",12],["clop",12],["bianlian",10],["lockbit2",10],["dragonforce",9]],"countries":[["US",89],["GB",14],["CA",13],["FR",10],["AU",9],["IT",8]],"pressPct":4,"ransomPct":1},"incidents":[{"v":"Telecom Argentina S.A.","g":"REvil / Sodinokibi","d":"2020-07-18","c":"Argentina","fin":"Not publicly disclosed beyond the ransom demand itself; no confirmed customer-facing outage cost figures reported.","ran":"$7.5 million in Monero demanded, rising to $15 million after a 48-hour deadline passed. Telecom Argentina stated it contained the attack and regained access without paying.","dt":"Internal corporate systems (not customer-facing telecom/internet service) were disrupted; company said it isolated affected systems and restored operations using backups, without paying the ransom. Precise recovery timeline/cost not publicly disclosed.","di":"Internal corporate/IT systems affected; no large-scale confirmed customer PII leak was publicly documented.","s":"Argentina's largest telecom operator was hit by REvil ransomware that spread via a phishing email to a hijacked internal Domain Admin account, ultimately encrypting more than 18,000 workstations and disrupting internal systems including Office 365, OneDrive, corporate VPN, Citrix, Genesys and customer/field-service virtual machines.","src":["https://www.welivesecurity.com/2020/07/21/telecom-argentina-hit-major-ransomware-attack/","https://www.infosecurity-magazine.com/news/telecom-argentina-tuesday-75/","https://www.secureworld.io/industry-news/argentinian-isp-hit-with-7.5-million-ransomware-attack"]},{"v":"Cincinnati Bell (now altafiber)","g":"Yanluowang","d":"2022-07-02","c":"United States","fin":"Not publicly disclosed; no SEC filing or press disclosure of a specific dollar cost was located.","ran":"Ransom amount not publicly disclosed; company confirmed it did not pay.","dt":"Specific downtime duration and recovery cost not publicly disclosed in available reporting.","di":"Scope/type of data exfiltrated by Yanluowang not publicly detailed in available sources.","s":"US regional telecom/broadband provider Cincinnati Bell was listed as a victim on the Yanluowang ransomware group's leak site; the company publicly refused to pay the ransom.","src":["https://www.ransomware.live/id/Q2luY2lubmF0aSBiZWxsIGRpZG7igJl0IHBheSB0aGUgcmFuc29t@yanluowang","https://cti.fyi/groups/yanluowang.html"]},{"v":"Telecommunications Services of Trinidad and Tobago (TSTT)","g":"RansomEXX","d":"2023-10-09","c":"Trinidad and Tobago","fin":"Not publicly disclosed. Trinidad and Tobago has no mandatory breach-notification law, which delayed and limited public cost disclosure.","ran":"Ransom amount not publicly disclosed.","dt":"TSTT reported the breach affected availability of internal virtual infrastructure/private cloud; full recovery timeline not publicly quantified. CEO Lisa Agard was subsequently fired following the incident.","di":"Over 1.2 million customer records (mobile, fixed line, broadband) leaked, including full names, emails, national ID numbers, phone numbers and ID scans; the leaked CSV was downloaded 13,000+ times within two weeks; TSTT internal GitLab projects and database dumps were also exposed.","s":"The Caribbean nation's state-owned telecom provider had an administrator's credentials compromised (October 3), leading to a security breach on October 9 that affected its internal virtual infrastructure/private cloud. RansomEXX later released a CSV of customer data on the dark web as proof of the hack.","src":["https://technewstt.com/tstt-ransomexx-exploit/","https://trinidadexpress.com/news/local/over-one-million-tstt-customer-records-on-dark-web/article_a21817e2-79eb-11ee-9c24-c35f8111013c.html","https://advox.globalvoices.org/2023/11/08/trinidad-tobagos-state-telecommunications-provider-is-hacked-raising-questions-about-data-protection-laws/"]},{"v":"WideOpenWest (WOW!)","g":"Arkana Security","d":"2025-03-28","c":"United States","fin":"In its March 28, 2025 SEC Form 8-K, WideOpenWest stated the incident had not had a material impact on operations and it did not believe it was reasonably likely to materially affect financial condition or results; the company also disputed that sensitive personal information was accessed, contrary to the attacker's claims.","ran":"WOW! was given a deadline to negotiate or the data would be sold/leaked; specific dollar ransom demand not publicly disclosed.","dt":"No confirmed customer-facing service outage reported; incident was primarily a backend data-access/exfiltration event rather than an encryption/downtime event.","di":"Arkana claimed theft of 403,000 WOW! user account records (names, usernames, salted passwords, emails, login histories, security Q&As) plus a separate CSV of 2.2 million records (names, addresses, phone numbers, device data).","s":"A newly-emerged data-extortion group, Arkana Security, breached major US cable/ISP WOW! after an employee's device was infected with infostealer malware in September 2024, harvesting credentials for backend platforms Symphonica and AppianCloud that gave attackers alleged full backend control (they released a demo video). This was Arkana's debut, high-profile attack.","src":["https://www.securityweek.com/new-ransomware-group-claims-attack-on-us-telecom-firm-wideopenwest/","https://cybersecuritynews.com/arkana-ransomware-stolen-2-2-million-customer-records/","https://www.theregister.com/2025/03/28/arkana_wow_ransomware/","https://www.sec.gov/Archives/edgar/data/1701051/000110465925029187/tm2428184d1_8k.htm"]},{"v":"SK Telecom","g":"Attributed on ransomware.live to 'coinbasecartel' data-extortion listing; technical intrusion used BPFDoor malware (attribution to a distinct ransomware crew is contested/unclear in public reporting)","d":"2025-04-19","c":"South Korea","fin":"Record $97.2 million (KRW 134.8 billion) fine from South Korea's Personal Information Protection Committee, plus a ~$7,000 fine for late breach reporting; the Korea Consumer Agency separately ordered SK Telecom to pay ~$67 (100,000 won) compensation to each of the 23 million affected users; SK Telecom committed roughly $514 million to a security-overhaul 'Accountability and Commitment Program,' plus bill discounts, fee waivers and free data.","ran":"No ransom payment publicly reported; this was primarily treated as a state-linked/criminal espionage-style data breach rather than a classic encryption ransomware case, though listed as a data-leak/extortion incident by dark-web trackers.","dt":"No major network outage; SK Telecom offered free SIM replacements to all customers as remediation.","di":"25 types of personal information for 23.2 million subscribers exposed, including phone numbers, IMSI numbers, and USIM authentication keys - raising SIM-swap and surveillance risk.","s":"South Korea's largest mobile carrier (~23M subscribers) disclosed a breach of its Home Subscriber Server after detecting unusual traffic on April 22, 2025. Investigation found BPFDoor malware present undetected on at least 28 servers (33 variants) since as early as 2022, exfiltrating USIM authentication keys and other subscriber identifiers.","src":["https://techcrunch.com/2025/05/08/a-timeline-of-south-korean-telco-giant-skts-data-breach/","https://cybermagazine.com/news/sk-telecom-face-mammoth-us-97m-data-breach-fine","https://www.koreaherald.com/article/10563945","https://www.zeebiz.com/companies/news-sk-telecom-told-to-pay-100000-won-each-to-23-million-users-after-massive-data-breach-386203"]},{"v":"Colt Technology Services","g":"WarLock","d":"2025-08-12","c":"United Kingdom (multinational operations across ~40 countries)","fin":"Specific dollar cost of the incident not publicly disclosed by Colt; impact described qualitatively as affecting 27,000+ customers across ~40 countries.","ran":"WarLock demanded $200,000 for the stolen data cache and posted samples on dark-web forums as proof.","dt":"Outage began August 12, 2025; Colt stated the majority of recovery would take 8-10 weeks, with customer portal, hosting APIs and voice-on-demand tools still offline in early October 2025 - a multi-month recovery, unusually long for a major telecom provider.","di":"WarLock claimed theft of over one million documents including employee salary data, customer contact information, internal executive personal information, and confidential emails.","s":"Global business telecom provider Colt was breached via exploitation of the SharePoint remote-code-execution vulnerability CVE-2025-53770, leading to a multi-day (ultimately multi-week/multi-month) outage of Colt Online customer portal, hosting APIs, and Voice API/porting platforms; core network infrastructure reportedly remained largely unaffected. Colt publicly attributed responsibility to the WarLock ransomware group.","src":["https://www.theregister.com/2025/08/15/london_telco_colts_services_disrupted/","https://securityaffairs.com/181247/data-breach/colt-technology-faces-multi-day-outage-after-warlock-ransomware-attack.html","https://www.sdxcentral.com/news/colt-ransomware-recovery-to-continue-close-to-year-end/","https://www.computerweekly.com/news/366629873/Warlock-claims-more-victims-as-cyber-attacks-hit-Colt-and-Orange"]},{"v":"Orange S.A. (Orange Group, incl. Orange Belgium subsidiary)","g":"WarLock","d":"2025-07-25","c":"France (with Belgium subsidiary separately affected)","fin":"Not publicly disclosed.","ran":"Specific ransom amount not publicly disclosed for the Orange S.A. incident.","dt":"Orange stated the attacker had only limited access and exfiltrated mostly 'outdated or low-sensitivity data'; no major prolonged network outage reported (unlike Colt).","di":"~4GB of internal data published on the dark web by WarLock; Orange characterized the exposed data as largely outdated/low-sensitivity. The related Orange Belgium breach separately impacted 850,000 customer accounts.","s":"French telecom giant Orange disclosed a security incident at the end of July 2025 involving internal systems, using the same SharePoint exploitation chain (webshells, Group Policy abuse, credential theft, lateral movement) attributed to WarLock. The group publicly claimed the attack on August 17, 2025 and released roughly 4GB of data. A separate, related incident hit Orange Belgium, affecting 850,000 customer accounts.","src":["https://www.bloomberg.com/news/articles/2025-08-22/ransomware-hack-hit-orange-telecom-data-published-on-dark-web","https://slcyber.io/blog/warlock-ransomware-gang-targets-orange-and-colt/","https://www.securityweek.com/orange-belgium-data-breach-impacts-850000-customers/","https://www.insurancejournal.com/news/international/2025/08/25/836826.htm"]},{"v":"American Tower Corporation","g":"ShinyHunters","d":"2026-06-12","c":"United States","fin":"Not publicly disclosed as of this research.","ran":"Extortion demand made; American Tower did not comply and data was leaked. Specific dollar figure not publicly disclosed.","dt":"No network/tower service outage publicly reported; incident was a data-exfiltration/extortion event rather than an encryption/availability event.","di":"Attackers claimed over 5.2 million records including customer and landowner PII, records referencing other companies' infrastructure (T-Mobile, Verizon, US DHS), tower asset records with GPS coordinates, and plaintext physical access/gate codes for cell tower compounds; 216,601 accounts were added to Have I Been Pwned on June 26, 2026.","s":"One of the world's largest cell-tower/telecom infrastructure REITs was breached in a 'pay-or-leak' extortion campaign by ShinyHunters. After American Tower did not pay by the group's June 15, 2026 deadline, the attackers published the stolen files - notable for exposing physical-security data (tower gate/access codes) rather than just customer records, illustrating the physical-infrastructure risk unique to telecom tower operators.","src":["https://www.dexpose.io/shinyhunters-breach-american-tower-corporation/","https://www.technadu.com/american-tower-data-breach-215000-accounts-exposed-in-shinyhunters-attack/629952/","https://haveibeenpwned.com/Breach/AmericanTower"]},{"v":"Lumen Technologies, Inc.","g":"not publicly disclosed","d":"2023-03-27","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company implemented business continuity plans to restore functionality to its customers’ operational and business systems.","di":"A limited amount of data was extracted, but the specific number of records or individuals affected is not publicly disclosed.","s":"On March 27, 2023, Lumen Technologies announced two cybersecurity incidents. A ransomware attack affected a limited number of the Company’s servers, degrading operations for some enterprise customers. Additionally, a separate intrusion involved unauthorized access to internal IT systems, including data extraction.","src":["https://www.sec.gov/Archives/edgar/data/18926/000119312523079847/d467138d8k.htm"]}],"stats":[{"m":"Telecom sector ransomware victims listed (all-time, ransomware.live)","v":"357 victims listed under 'Telecommunication' sector tag as of July 2026; 124 posted in 2025 alone (peak year to date), 62 already in partial-year 2026","s":"ransomware.live API (api.ransomware.live/v2/sectorvictims/Telecommunication)","u":"https://www.ransomware.live/api"},{"m":"Top threat actor groups targeting telecom (by victim count, ransomware.live dataset)","v":"Qilin (25), Akira (22), LockBit3 (17), Play (12), Clop (12), LockBit2 (10), BianLian (10), DragonForce (9), ALPHV/BlackCat (9), INC Ransom (8)","s":"ransomware.live API (author's own aggregation of the pulled dataset)","u":"https://www.ransomware.live/api"},{"m":"Telecom ransomware attack volume growth","v":"Ransomware attacks on telecom companies grew nearly 4x from 24 in 2022 to 90 in 2025; 444 telecom data-theft incidents identified with 133 stolen-database listings; ~70% of 2025 telecom attacks targeted the Americas; Qilin, Akira and Play were the leading groups (corroborates ransomware.live figures above)","s":"Cyble research via Cybersecurity Dive","u":"https://www.cybersecuritydive.com/news/telecom-ransomware-spike-cyble/809224/"},{"m":"Ransomware presence in breaches / median payout (all sectors, 2025)","v":"Ransomware present in 44% of breaches overall; median ransomware payout fell to $115,000 and 64% of victims refused to pay; third-party involvement was a factor in 30% of all breaches (up from ~15% the prior year) - relevant to telecom's heavy vendor/reseller/MVNO dependence; edge/VPN device exploitation as an initial-access vector rose 8x, with only 54% patched (median 32 days to patch)","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Average/median ransom payment (all sectors, 2025)","v":"Mean ransom payment fell from $2M (2024) to $1M (2025); by sector, state/local government paid the highest median ($2.5M) and healthcare the lowest ($150K); telecom not broken out separately in public summary","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Quarterly average/median ransom payments, 2025","v":"Q2 2025: avg $1,130,070 / median $400,000. Q3 2025: avg ~$377,000 / median $140,000 (down 66%/65% QoQ). Q4 2025: avg $591,988 / median $325,000 (up 57%/132% QoQ)","s":"Coveware Quarterly Ransomware Reports","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Global data breach cost by industry, 2025","v":"Global average cost of a data breach: $4.44M (down 9% YoY). By industry: Healthcare $7.42M (highest, 14th year running), Financial Services $5.56M, Industrial $5M, Energy $4.83M, Technology $4.79M. Telecommunications/Communications was not broken out as a distinct line item in the public summaries reviewed - noted as a data gap","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global on-chain ransomware payments, 2025","v":"Ransomware actors received more than $820M in on-chain payments in 2025, an 8% YoY decline from $892M in 2024; median payment per victim rose 368% (from $12,738 in 2024 to $59,556 in 2025) even as total payments fell, and eCrime.ch-tracked claimed victims rose ~50% YoY to the most active year on record - consistent with 'more attacks, fewer big payouts, higher per-incident asks' dynamic seen in telecom cases like Colt and WOW!","s":"Chainalysis 2025/2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-crime-ransomware-victim-extortion-2025/"}]},{"name":"Transportation and Warehousing","tag":"Transportation/Logistics","overview":"Transportation and Warehousing (ransomware.live sector tag \"Transportation/Logistics\") is a high-frequency, high-consequence ransomware target because it sits at the intersection of critical infrastructure, thin operating margins, and deeply interconnected IT/OT systems. The sector has seen some of history's costliest cyber incidents (Maersk/NotPetya, ~$300M) as well as cases where a ransomware attack directly caused a long-established company's insolvency (KNP Logistics, ~730 jobs lost). Live ransomware.live tracking shows a very high and steadily growing victim count across trucking, freight forwarding, maritime/port operators, warehousing, and fleet-technology vendors, spanning dozens of active ransomware groups and dozens of countries. Industry reporting for 2025 shows both attack frequency (+34% YoY) and average ransom demands (+685% YoY, to $2.19M) rising sharply, with third-party/supply-chain exposure (shared ELD, TMS, and port-terminal software) acting as a key amplifier, a single vendor compromise can cascade operational disruption across many otherwise-unrelated carriers simultaneously.","distinct":"Sits at the intersection of critical infrastructure, thin operating margins and tightly coupled IT/OT. Produced both the costliest cyber incident on record (Maersk/NotPetya, roughly $300 million) and a documented insolvency directly caused by ransomware (KNP Logistics, roughly 730 jobs lost), the clearest evidence that thin margins convert a survivable outage into a terminal one. Dispatch, freight and warehouse management systems have no manual fallback at modern volume.","leverage":"Halted freight movement and dispatch, with cascading contractual penalties and downstream customer disruption across the shipping chain.","tolerance":"Very low. Hours. Perishable and time-definite freight has effectively no tolerance, and margin structure leaves little buffer to absorb extended interruption.","bulk":{"total":1331,"years":{"2016":1,"2017":3,"2018":2,"2019":1,"2020":19,"2021":77,"2022":103,"2023":230,"2024":345,"2025":349,"2026":201},"groups":[["lockbit3",93],["clop",93],["qilin",74],["play",69],["akira",69],["thegentlemen",41],["ransomhub",39],["lockbit2",36]],"countries":[["US",388],["CA",70],["GB",46],["DE",39],["BR",33],["FR",32]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"A.P. Moller-Maersk","g":"NotPetya (masqueraded as Petya ransomware; attributed to Sandworm/Russian military intelligence, not a typical criminal ransomware gang)","d":"2017-06-27","c":"Denmark (global operations across 130+ countries)","fin":"Maersk publicly estimated total costs of $200-300 million (lost revenue, IT restoration, and extraordinary operating costs), disclosed in investor communications; widely cited as one of the costliest cyber incidents in history at the time.","ran":"Not applicable in the traditional sense, NotPetya had no functioning decryption mechanism; no ransom was viably payable or paid despite a nominal $300 in Bitcoin demanded on-screen.","dt":"Core systems were down for roughly 10 days; a full IT rebuild (including a 'miracle' surviving domain controller found in Ghana) took an emergency response team working around the clock roughly a week to restore booking systems, with normal port operations taking longer to stabilize.","di":"Primarily an operational/availability impact (systems wiped) rather than a data-exfiltration/breach event; no large-scale customer PII exposure was reported.","s":"The NotPetya wiper, disguised as ransomware, spread globally via a compromised Ukrainian accounting software update (M.E.Doc) and crippled Maersk's global IT infrastructure, forcing the reinstallation of roughly 4,000 servers and 45,000 PCs and halting container booking and port operations across multiple countries.","src":["https://www.cnbc.com/2017/08/16/maersk-says-notpetya-cyberattack-could-cost-300-million.html","https://www.forbes.com/sites/leemathews/2017/08/16/notpetya-ransomware-attack-cost-shipping-giant-maersk-over-200-million/","https://www.csoonline.com/article/567845/rebuilding-after-notpetya-how-maersk-moved-forward.html","https://www.techtarget.com/searchsecurity/news/450424681/NotPetya-ransomware-impact-costs-Maersk-hundreds-of-millions"]},{"v":"Toll Group","g":"Mailto (Netwalker family) initially; Nefilim in the second, follow-on attack","d":"2020-02-05 (first attack, Mailto/Nefilim-linked); second attack 2020-05-05 (Nefilim)","c":"Australia","fin":"Not publicly disclosed as a specific dollar figure by Toll Group; operational disruption affected freight booking, invoicing, and customer service for weeks across both incidents.","ran":"Not publicly disclosed; Toll Group stated it did not pay.","dt":"First attack: core IT systems and ~1,000 servers taken offline, with a multi-week recovery of booking/tracking portals. Second attack (three months later): MyToll portal and other systems again disrupted for an extended period while freight shipments continued via manual workarounds.","di":"Nefilim attackers stole and published approximately 220GB of data from at least one server, including current and former employee information.","s":"Australian freight and logistics giant Toll Group was hit by ransomware twice within three months in 2020. The first attack infected roughly 1,000 servers and forced a full network shutdown; the second (Nefilim, a double-extortion group) again took down the MyToll customer portal and stole and threatened to leak data.","src":["https://threatpost.com/ransomware-attack-toll-group-systems-again/155505/","https://www.bleepingcomputer.com/news/security/toll-group-hit-by-ransomware-a-second-time-deliveries-affected/","https://www.itnews.com.au/news/toll-group-suffers-second-ransomware-attack-this-year-547757"]},{"v":"Expeditors International of Washington","g":"Not publicly attributed to a named ransomware group in company disclosures","d":"2022-02-20","c":"United States (global freight forwarding operations)","fin":"Per SEC 10-K/8-K filings: approximately $62 million in incremental demurrage charges (inability to timely move shipments through ports) and approximately $28 million in investigation, recovery, and remediation expenses in H1 2022, commonly summarized in press coverage as roughly $60 million in total incident-related costs; company also disclosed lower shipment volumes and revenue impact as customers shifted to competitors during the outage.","ran":"Not publicly disclosed.","dt":"Systems were shut down company-wide starting February 20, 2022; recovery of operating and accounting systems extended over several weeks, with the company still describing 'material adverse impact' months later in its Q1 2022 disclosures.","di":"Not detailed in public filings as a large-scale data breach; disclosures focused primarily on operational/financial impact rather than confirmed record counts of exposed data.","s":"Global freight forwarder Expeditors International proactively shut down most of its global operating systems after detecting a cyberattack, disrupting its ability to move shipments through ports and process customer orders for weeks, with effects disclosed as materially impacting quarterly results in SEC filings.","src":["https://www.sec.gov/Archives/edgar/data/746515/000156459022027382/expd-ex991_6.htm","https://www.sec.gov/Archives/edgar/data/746515/000095017023005412/expd-20221231.htm","https://www.thestack.technology/expeditors-ransomware-costs-freight-forwarding/","https://www.geekwire.com/2022/supply-chain-giant-expeditors-is-still-recovering-from-cyberattack-expects-material-adverse-impact/"]},{"v":"Port of Nagoya (Nagoya Harbor Transportation Association / Nagoya United Terminal System)","g":"LockBit 3.0 (claimed credit; not officially confirmed by port authorities)","d":"2023-07-04","c":"Japan","fin":"Not publicly quantified in dollar terms; impact described qualitatively as significant given the port's role in ~10% of Japan's total trade volume and its handling of major automotive exports (Toyota).","ran":"Not publicly disclosed.","dt":"Container operations were fully suspended for roughly 2-3 days (attack detected July 4, most terminals resumed by July 6) after servers were isolated and systems restored from backup.","di":"Primarily an OT/operational-availability incident (terminal management system encrypted); no large-scale personal data exposure was publicly reported.","s":"Japan's largest and busiest cargo port (handling ~10% of Japan's trade volume, including Toyota vehicle exports) suffered a ransomware attack on its Nagoya Port Unified Terminal System (NUTS), the central OT/IT system managing container terminal operations, halting all container loading/unloading operations.","src":["https://edition.cnn.com/2023/07/06/tech/japan-port-ransomware-attack","https://www.dragos.com/blog/ot-cybersecurity-breach-disrupts-operations-at-the-port-of-nagoya-japan","https://www.theregister.com/2023/07/06/lockbit_nagoya_attack/","https://maritime-executive.com/article/ransomware-attack-stops-container-operations-japan-s-nagoya-port"]},{"v":"KNP Logistics Group (Knights of Old)","g":"Akira","d":"2023-06","c":"United Kingdom","fin":"Not disclosed as a precise incident-remediation cost; the ultimate financial outcome was total business collapse, KNP Logistics Group entered insolvency/administration, with the ransomware attack cited by administrators as a decisive contributing factor alongside pre-existing market pressures.","ran":"Ransom demand reported at approximately GBP 5 million (some reporting cites GBP 5-6 million); not paid.","dt":"Critical operational and financial systems were encrypted and unusable; the company was unable to recover operationally and ceased trading roughly three months after the attack rather than completing a technical recovery.","di":"Financial and operational data was encrypted/compromised; approximately 730 employees lost their jobs when the company subsequently collapsed into administration.","s":"Akira ransomware operators brute-forced a weak employee password (no MFA in place) to breach 158-year-old UK haulage firm KNP Logistics, encrypting critical systems and data. The already financially strained company was unable to secure emergency investment in the aftermath and entered administration roughly three months later.","src":["https://therecord.media/knp-logistics-ransomware-insolvency-uk","https://www.weightmans.com/media-centre/news/how-ransomware-crippled-knp-logistics-group/","https://thehackernews.com/2025/09/how-one-bad-password-ended-158-year-old.html","https://dig.watch/updates/historic-uk-knp-transport-firm-collapses-after-ransomware-attack"]},{"v":"Estes Express Lines","g":"LockBit","d":"2023-09-26 (network access); breach discovered/disclosed October-December 2023","c":"United States","fin":"Not publicly disclosed as a specific dollar figure; costs would include forensic investigation, legal defense of the resulting class action, and regulatory notification expenses.","ran":"Estes publicly stated it refused to pay the ransom; specific demand amount not disclosed.","dt":"Forensic investigation concluded November 7, 2023; notification to affected individuals began December 4, 2023, roughly ten weeks after initial network access. Operational downtime specifics were not detailed in public reporting.","di":"Breach affected 21,184 individuals per filing with the Maine Attorney General; compromised data included names and Social Security numbers of current/former employees, job applicants, and/or customers. LockBit published the stolen data on its leak site November 13, 2023.","s":"Major North American less-than-truckload (LTL) freight carrier Estes Express Lines was breached by the LockBit ransomware gang, which stole personal data and later published it on its leak site after Estes declined to pay. Estes disclosed the breach to regulators and affected individuals over the following months, triggering a class-action lawsuit.","src":["https://www.theregister.com/2024/01/03/estes_ransomware/","https://www.classaction.org/news/trucking-company-estes-hit-with-class-action-over-cyberattack-affecting-21k","https://www.truckingdive.com/news/estes-express-lines-cyberattack-social-security-numbers-update/703427/","https://www.comparitech.com/news/freight-forwarder-estes-notifies-data-breach-victims-ransomware-gang-takes-credit/"]},{"v":"ORBCOMM (FleetManager / BT-series ELD platform)","g":"Not publicly attributed to a named group in available reporting","d":"2023-09-06","c":"United States (impact felt across the broader North American trucking industry as a third-party/supply-chain event)","fin":"Not publicly disclosed by ORBCOMM; downstream financial impact on the many trucking companies dependent on the affected ELD/FleetManager services was not separately quantified in public reporting.","ran":"Not publicly disclosed.","dt":"Outage began September 6, 2023; ORBCOMM targeted September 28, 2023 for full restoration of impacted services, an outage window of roughly three weeks.","di":"Primarily an availability/operational-technology impact (fleet tracking and ELD compliance systems down) rather than a disclosed data-exfiltration event; the Federal Motor Carrier Safety Administration (FMCSA) issued a temporary enforcement waiver allowing affected carriers to use paper logs beyond the normal 8-day limit.","s":"ORBCOMM, a major provider of Electronic Logging Device (ELD) and fleet-tracking technology used by numerous trucking companies, suffered a ransomware attack that took down its FleetManager platform and BT500/BT504 ELD hardware line, forcing truckers using affected devices to revert to paper logs. Illustrates concentrated third-party/supply-chain risk in transportation: a single vendor outage cascaded across many downstream carriers and triggered a federal regulatory response.","src":["https://www.bleepingcomputer.com/news/security/orbcomm-ransomware-attack-causes-trucking-fleet-management-outage/","https://therecord.media/orbcomm-trucking-software-ransomware","https://www.freightwaves.com/news/ransomware-attack-hits-orbcomms-bt-series-of-elds-paper-logs-are-back"]},{"v":"JAS Worldwide","g":"Not officially attributed by JAS in public statements; some industry reporting associated the incident with the broader RansomHub-era wave of attacks, though this was not confirmed by the company","d":"2024-08-27","c":"United States (global freight-forwarding operations, headquartered in Atlanta, Georgia)","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Disruption began August 27, 2024; the company reported most core systems restored and functioning normally within days, with full recovery and resumption of pre-incident business levels across most geographies described as substantially complete within roughly two weeks.","di":"JAS disclosed a leak of over 400 data records; the majority of its contract logistics business and several entities were reported unaffected.","s":"Global freight forwarder JAS Worldwide suffered a ransomware/malware attack that disrupted core operating systems, customer service, billing/payment systems, and its central operations platform (C1) and customer-facing JAS SmartHub portal.","src":["https://www.freightwaves.com/news/global-freight-forwarder-confirms-malware-attack-for-technical-disruptions","https://theloadstar.com/jas-worldwide-suffers-cyber-attack/","https://thecyberexpress.com/cyberattack-on-jas-worldwide/","https://dysruptionhub.com/ransomware-attack-disrupts-global-operations-of-jas-worldwide/"]},{"v":"RTX Corporation","g":"not publicly disclosed","d":"2025-09-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Customers have shifted to back-up or manual processes and have experienced certain flight delays and cancellations.","di":"not publicly disclosed","s":"On September 19, 2025, RTX Corporation reported a ransomware incident affecting its Multi-User System Environment (MUSE) passenger processing software. The company activated its incident response plan and is investigating the incident with the help of cybersecurity experts while communicating with affected airlines and airports.","src":["https://www.sec.gov/Archives/edgar/data/101829/000010182925000036/rtx-20250919.htm"]}],"stats":[{"m":"Transportation sector ransomware attack increase, 2024→2025","v":"34% year-over-year increase in ransomware attacks against the transportation sector (108 incidents in Q1 2025, up from 69 in Q4 2024, ~15% of total tracked ransomware activity)","s":"Industry ransomware tracking roundups (aggregated in Asimily 'Largest Transportation and Logistics Cyberattacks of 2025' citing IC3/IBM X-Force data)","u":"https://asimily.com/blog/largest-transportation-and-logistics-cyberattacks/"},{"m":"Average ransom demand, transportation sector, 2025 vs 2024","v":"$2.19 million average demand in 2025 vs. $279,000 in 2024, a 685% year-over-year increase, one of the sharpest jumps of any industry","s":"Comparitech Worldwide Ransomware Roundup: 2025 End-of-Year Report","u":"https://www.comparitech.com/news/worldwide-ransomware-roundup-2025-end-of-year-report/"},{"m":"Transportation sector attack growth (OT/IoT-linked)","v":"382% year-over-year increase in attacks targeting the transportation sector","s":"Zscaler ThreatLabz 2025 Mobile, IoT & OT Threat Report","u":"https://www.zscaler.com/blogs/security-research/industry-attacks-surge-mobile-malware-spreads-threatlabz-2025-mobile-iot-ot"},{"m":"Financial motivation share of transportation-sector breaches","v":"99% of breaches in the transportation sector are financially motivated, among the highest of any industry tracked","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Ransomware share of breaches (all industries)","v":"Ransomware present in 44% of breaches overall in 2025; median ransom payout fell to $115K; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Average / median ransom payment (all industries), Q4 2024","v":"Average payment $553,959 (up 16% QoQ); median payment $110,890 (down 45% QoQ); only 25% of victims paid a ransom in Q4 2024","s":"Coveware Quarterly Ransomware Report, Q4 2024 ('Will Law Enforcement success against ransomware continue in 2025?')","u":"https://www.coveware.com/blog/2025/1/31/q4-report"},{"m":"Ransom payment rate trend into 2025","v":"Payment rate fell to roughly 20% of victims by Q4 2025, continuing the multi-year decline as more organizations refuse to pay","s":"Coveware Quarterly Ransomware Reports (aggregated via secondary reporting)","u":"https://www.co
