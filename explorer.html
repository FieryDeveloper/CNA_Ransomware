ure","Fourth-party risk from vendors' own vendors"]},"Telecommunications":{"raw":"Third-Party & Supply Chain Risk","subs":["Compromise via subcontracted field-service/technical-solutions providers","Compromise of shared backend SaaS platforms used across the operator's business (AppianCloud/Symphonica-style)","MVNO/reseller relationship exposure","Industry-body/association compromise with cross-member blast radius (GSMA/Qilin)","Downstream exposure of other carriers' data held incidentally (American Tower's records referencing T-Mobile/Verizon/DHS)"]},"Transportation and Warehousing":{"raw":"Third-Party / Supply-Chain Risk","subs":["Concentration risk in dominant ELD/telematics or TMS/WMS software vendors serving many carriers simultaneously","Cascading customer-service disruption when a shared customer portal or booking platform goes down","Cross-organizational data exposure when EDI/partner data feeds are compromised","Regulatory/compliance cascade, e.g., FMCSA having to issue nationwide ELD enforcement waivers after a single vendor's outage"]}}},{"key":"regulatory and legal exposure","name":"Regulatory and Legal Exposure","fam":"Regulatory & Legal","desc":"Healthcare carries some of the heaviest breach-notification, privacy, and liability regimes of any industry, amplifying the downstream cost of a ransomware event well beyond technical remediation.","inds":{"Construction":{"raw":"Regulatory and Contractual Exposure","subs":["Employee PII/payroll breach notification obligations (AECOM's 2021 incident exposed employee SSNs and bank routing/account numbers and required notification to the California Attorney General)","Government-contractor obligations (major defense/energy/critical-infrastructure contractors such as Bechtel and AECOM handle DoD/DOE and critical-infrastructure work, raising CMMC/DFARS-style breach-notification and controlled-technical-information exposure)","Professional liability/errors-and-omissions exposure if stolen design, CAD/BIM or structural-engineering data proves defective or is misused after a leak","Contractual delay-damages/liquidated-damages exposure if ransomware-driven downtime in scheduling, procurement, or payroll systems cascades into project schedule slippage","Bid-integrity and antitrust-adjacent exposure if leaked tender/pricing data undermines competitive bidding processes"]},"Finance and Insurance":{"raw":"Regulatory and Legal Exposure","subs":["Breach notification regimes with short/compressed timelines (contributing to elevated 'detection & escalation' cost share per IBM 2025 - ~34% in financial services vs ~29% global)","Sector-specific regulatory regimes (GLBA in the U.S., DORA in the EU, functional-regulator rules for banks/insurers)","SEC disclosure obligations for material cybersecurity incidents (as invoked in the FNF SEC filing)","State/national data-protection authority investigations (e.g., Spanish AEPD scrutiny in MAPFRE's 2021 incident)","Follow-on class-action litigation from affected customers, increasingly targeting both the breached entity and its vendors","AML/KYC and financial-stability regulator engagement when core systems or national payment infrastructure are affected"]},"Healthcare and Social Assistance":{"raw":"Regulatory and Legal Exposure","subs":["HIPAA/HHS OCR breach notification, investigation, and potential civil monetary penalties (US)","State attorney-general actions and multistate settlements","Mass tort / class-action litigation from affected patients (e.g., $65M Lehigh Valley Health Network settlement; CommonSpirit and HCA class actions)","GDPR and equivalent international health-data protection regimes for multinational providers and insurers","Government/parliamentary inquiries and mandatory incident reporting for public health systems (Ireland's HSE, UK NHS)","Loss of accreditation, payer contract, or Medicare/Medicaid compliance risk tied to prolonged system unavailability","Cyber-insurance coverage disputes and sub-limits given the scale of potential claims in this sector"]},"Information Technology":{"raw":"Regulatory, Legal and Contractual Exposure","subs":["SEC cyber-incident disclosure obligations and investigations (SEC probe of Progress Software/MOVEit)","GDPR and global breach-notification statutes across many jurisdictions","Mass class-action litigation (MOVEit spawned dozens of suits, 40M+ claimants)","Contractual SLA penalties, indemnities and customer breach-of-contract claims","Cross-border data-transfer and sovereignty complications"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Regulatory and contractual exposure","subs":["Multi-state breach notification obligations when a single incident exposes data spanning many client industries and jurisdictions (Conduent: multi-state AG enforcement, ~10+ class actions)","Contractual indemnification and liability clauses with enterprise clients whose data was exposed via the vendor","SEC disclosure obligations for publicly traded professional-services firms (Cognizant, Sopra Steria, Accenture, Conduent all filed material-impact disclosures)","Professional licensing/ethics exposure for law and accounting firms following confidentiality breaches"]},"Telecommunications":{"raw":"Regulatory & Legal Exposure","subs":["Data-protection regulator fines (SK Telecom's $97.2M PIPC fine; Cosmote/OTE's combined ~$9.25M Greek DPA fines for a related breach)","Mandatory consumer compensation schemes (SK Telecom's per-subscriber payout order)","Breach-notification law gaps/delays in some jurisdictions (Trinidad and Tobago's lack of mandatory notification law)","Securities disclosure obligations for public telecom operators (WideOpenWest 8-K materiality determination)","Executive/leadership accountability actions (TSTT CEO's dismissal post-breach)","National security and critical-infrastructure regulatory scrutiny given telecom's designation in most jurisdictions"]}}},{"key":"business interruption project delay risk","name":"Business Interruption Project Delay Risk","fam":"Business Interruption","desc":"How ransomware translates into operational and financial disruption specific to project-based construction work.","inds":{"Construction":{"raw":"Business Interruption / Project Delay Risk","subs":["Disruption to estimating, scheduling and project-management software halting active bid submissions or project coordination","ERP/accounting/payroll system outages disrupting subcontractor and supplier payments, risking mechanic's-lien and cash-flow disputes","Procurement and material-ordering system outages delaying material delivery to active job sites","Indirect (rather than physical-site) downtime: unlike manufacturing OT shutdowns, ransomware in construction more often stalls back-office/coordination functions than the physical build itself, per Sophos data showing lower rates of data-theft/encryption combination in construction/property/energy versus manufacturing"]}}},{"key":"confidentiality privileged data risk","name":"Confidentiality Privileged Data Risk","fam":"Data & IP Confidentiality","desc":"Professional/technical services firms hold sensitive third-party information whose exposure carries outsized legal and reputational consequences.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Confidentiality / privileged-data risk","subs":["Attorney-client privileged case files and litigation strategy documents (law firms)","M&A due-diligence, financial audit, and pre-earnings material non-public information (accounting/consulting firms)","Engineering drawings, architectural plans, and technical IP (engineering/technical consultancies)","Aggregated multi-client PII/PHI held by BPOs and claims processors, creating breach exposure that multiplies across every underlying client"]}}},{"key":"core network availability disruption ot equivalent risk","name":"Core Network Availability Disruption OT Equivalent Risk","fam":"OT & Operational Disruption","desc":"Telecom's version of OT/ICS risk - attacks that threaten service availability at national or regional scale rather than just confidentiality.","inds":{"Telecommunications":{"raw":"Core Network / Availability Disruption ('OT-equivalent' risk)","subs":["Voice/SMS/data network outages from ransomware or intrusion (Cellcom's week-long voice/SMS blackout)","BGP hijacking / routing manipulation causing internet outages (Orange Spain)","Sabotage-style attacks without malware causing multi-day national outages (Vodafone Portugal, 4.7M mobile + 1M fixed customers affected)","Customer-portal and OSS/BSS downtime cascading into business-customer disruption (Colt's multi-month portal outage)","Emergency-services (911/E911) disruption risk given telecom's critical-infrastructure designation"]}}},{"key":"extortion and impact tactics","name":"Extortion and Impact Tactics","fam":"Extortion & Impact","desc":"The mix of leverage attackers apply. In this sector the physical perishability and food-security angle amplifies pressure to pay quickly.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Extortion & Impact Tactics","subs":["Encryption of production/ERP/warehouse and ordering systems that halts slaughter, processing, packing, invoicing and dispatch (JBS, KP Snacks, UNFI)","Double extortion: exfiltration of data plus threat to leak (Conti/KP Snacks; INC Ransom/Ahold Delhaize; BlackMatter/NEW Cooperative)","Perishability-driven time pressure, spoilage of raw materials, finished goods and livestock welfare used as urgency leverage","Food-security / public-safety framing to raise reputational and regulatory stakes on a critical-infrastructure victim","Re-extortion and data-recycling (e.g., 2026 'coinbasecartel' posting reusing JBS data years after the original event)","Triple extortion / harassment of customers, growers, and downstream retailers whose shelves empty during an outage"]}}},{"key":"extortion leverage from minors and student data","name":"Extortion Leverage From Minors and Student Data","fam":"Extortion & Impact","desc":"Education is uniquely coercible because the hostage data belongs largely to children. Actors have moved from encryption-first to exfiltration-led extortion and apply pressure through channels unavailable in other sectors: publishing psychological evaluations, special-education records and abuse reports, and contacting students and parents directly. In the LAUSD and Minneapolis cases the leaked corpora included student psychological assessments, and in Minneapolis campus security blueprints - creating physical-safety as well as privacy harm. Sophos recorded extortion-only (no encryption) attacks rising in both education strata.","inds":{"Educational Services":{"raw":"Extortion Leverage from Minors' and Student Data","subs":["Publication of minors' PII, disciplinary, special-education and counselling records","Release of student psychological and medical assessments","Direct contact with parents, students and staff to amplify pressure (triple extortion)","Leak of campus security blueprints, floor plans and access-control layouts","FERPA/COPPA notification exposure used as negotiating leverage","Reputational leverage over admissions, enrolment and donor confidence","Timing of attacks to term start, exams, enrolment or financial-aid deadlines","Re-extortion of individual institutions after a vendor has already paid","Auction and resale of student datasets on leak sites"]}}},{"key":"infrastructure and availability risk it data center","name":"Infrastructure and Availability Risk IT Data Center","fam":"OT & Operational Disruption","desc":"For the IT sector the critical 'operational technology' is the data center, network and cloud fabric; loss of availability is the primary business-interruption driver rather than physical production lines.","inds":{"Information Technology":{"raw":"Infrastructure and Availability Risk (IT/Data-Center)","subs":["Data-center / colocation and network-operations disruption","Backup and disaster-recovery system targeting (attackers delete/encrypt backups first)","Virtualization and hypervisor mass-encryption (ESXi)","Prolonged availability loss and business-interruption for both victim and downstream customers"]}}},{"key":"initial access via open and federated campus environments","name":"Initial Access Via Open and Federated Campus Environments","fam":"Initial Access","desc":"Education networks are architecturally adversarial to containment. Universities operate deliberately open networks supporting public research collaboration, guest access, self-managed student devices and thousands of transient accounts per year, while K-12 districts run flat networks with minimal segmentation and small IT teams. Sophos found exploited vulnerabilities to be the single largest root cause in higher education (35% of attacks) and phishing the leading cause in lower education (22%), reflecting the two different failure modes. Verizon DBIR data has repeatedly placed social engineering and system intrusion as the dominant education breach patterns.","inds":{"Educational Services":{"raw":"Initial Access via Open and Federated Campus Environments","subs":["Unpatched internet-facing infrastructure (VPN concentrators, VMware ESXi, Citrix, file transfer appliances)","Phishing and business email compromise against faculty, staff and payroll","Compromised credentials and absent or partial MFA on student/staff SSO","Federated identity and SSO trust chains (Shibboleth, InCommon, eduGAIN, Entra ID) enabling lateral movement across institutions","BYOD and unmanaged student-owned devices on production VLANs","Flat, unsegmented K-12 district networks linking administrative and instructional systems","Research collaboration links, shared HPC clusters and inter-institutional data sharing","Remote and hybrid learning infrastructure, exposed RDP and legacy remote access","Seasonal staffing churn, adjunct and contractor accounts, and stale account deprovisioning"]}}},{"key":"insider and credential based risk","name":"Insider and Credential Based Risk","fam":"Insider & Workforce","desc":"Human-layer risk distinct from bulk phishing - individual employee/admin compromise with outsized consequences given telecom's centralized subscriber-identity role.","inds":{"Telecommunications":{"raw":"Insider & Credential-Based Risk","subs":["Single-employee infostealer infection cascading to full backend compromise (WOW!)","Reused/weak passwords on high-privilege admin or registry accounts (Orange Spain RIPE account)","SIM-swap-enabling data theft (USIM keys, IMSI) creating downstream account-takeover risk for subscribers (SK Telecom)","Insider-facilitated or insider-adjacent credential sale enabling initial access"]}}},{"key":"insider and credential risk","name":"Insider and Credential Risk","fam":"Insider & Workforce","desc":"Distributed, high-turnover workforces common to staffing, real estate brokerage, and professional-services firms increase credential and insider exposure.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Insider and credential risk","subs":["Large contractor/gig and franchise workforces with inconsistent endpoint security and access controls","Privileged access by outsourced IT/helpdesk staff susceptible to social engineering","Departing-employee credential misuse in high-turnover brokerage/consulting environments"]}}},{"key":"insider and student originated threat","name":"Insider and Student Originated Threat","fam":"Insider & Workforce","desc":"Education is the rare sector in which a substantial share of the resident population is both technically capable and directly motivated to attack the institution's systems - for grade alteration, exam access or reputational reasons - while holding legitimate network credentials. The PowerSchool intrusion was ultimately attributed by the US DOJ to a 19-year-old university student, who pleaded guilty. Insider events blur the ransomware/fraud boundary and complicate coverage triggers.","inds":{"Educational Services":{"raw":"Insider and Student-Originated Threat","subs":["Student credential abuse and grade or transcript alteration","Attacks originating from enrolled students against their own institution","Faculty and staff insider data theft","Credential sharing, shadow IT and unauthorised SaaS in departments","Initial access broker purchase of student/staff credentials from infostealer logs","Departing staff and contractor access retention","Negligent insiders and misconfigured shares exposing student records"]}}},{"key":"insider identity and privileged access risk","name":"Insider Identity and Privileged Access Risk","fam":"Insider & Workforce","desc":"IT staff hold the keys to both their own and customers' environments, making identity compromise and privileged-access abuse especially damaging.","inds":{"Information Technology":{"raw":"Insider, Identity and Privileged-Access Risk","subs":["Compromise of privileged admin / domain-admin and cloud root credentials","Developer credential and secrets theft (repo tokens, API keys)","Initial-access-broker recruitment and insider collusion","Weak MFA / SSO federation abuse across tenants"]}}},{"key":"insider workforce and operational maturity risk","name":"Insider Workforce and Operational Maturity Risk","fam":"Insider & Workforce","desc":"Human and organizational weaknesses characteristic of the sector.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Insider, Workforce & Operational-Maturity Risk","subs":["Large seasonal/temporary and low-turnover-training workforce increasing phishing susceptibility","Historically thin cybersecurity budgets and staffing, especially at farms, co-ops and mid-size processors (DHS records noted JBS's pre-attack security as unusually poor)","Legacy and end-of-life systems in plants and back-office (Dole: half of legacy servers affected)","Limited backup/recovery testing and lack of manual fallback procedures for automated operations","Dispersed rural sites with inconsistent monitoring and slow patch cycles","Insider access at co-ops and family/closely-held businesses with informal IT governance"]}}},{"key":"intellectual property and source code theft","name":"Intellectual Property and Source Code Theft","fam":"Data & IP Confidentiality","desc":"IT firms hold uniquely high-value technical IP whose theft is itself the extortion leverage, independent of encryption.","inds":{"Information Technology":{"raw":"Intellectual Property and Source Code Theft","subs":["Product designs and hardware blueprints (Quanta/Apple device schematics)","Semiconductor / chip design and EDA data (ARM, Synopsys as recent leak-site claims)","Proprietary source code and algorithms","Code-signing keys, certificates and secrets enabling further supply-chain abuse","Trade secrets, roadmaps and confidential customer contracts"]}}},{"key":"operational and store network disruption","name":"Operational and Store Network Disruption","fam":"OT & Operational Disruption","desc":"Because retail margins depend on continuous inventory flow and point-of-sale availability, ransomware's operational-availability impact (not just data loss) is often the largest cost driver in this industry.","inds":{"Retail Trade and Consumer Services":{"raw":"Operational and Store-Network Disruption","subs":["Store-wide or chain-wide POS outages halting sales","Automated ordering/replenishment failure forcing manual (paper) processes","E-commerce/website downtime and lost online revenue","Warehouse and logistics disruption causing stockouts","Shared-platform outages cascading across many independent locations (franchise/dealer model)"]}}},{"key":"operational business continuity risk","name":"Operational Business Continuity Risk","fam":"Other","desc":"How ransomware-driven downtime specifically manifests in financial and insurance operations, which are unusually time-sensitive and trust-dependent.","inds":{"Finance and Insurance":{"raw":"Operational/Business-Continuity Risk","subs":["Loss of access to trading/settlement systems forcing manual, error-prone workarounds","Branch, call-center, and digital-channel outages affecting customer-facing service availability","Delayed real estate closings/title transactions when escrow/title systems are down (FNF)","Claims-processing and underwriting delays in insurance operations","Reputational and customer-trust damage disproportionate to direct financial loss, given the sector's dependence on public confidence"]}}},{"key":"operational disruption of instruction and institutional continuity","name":"Operational Disruption of Instruction and Institutional Continuity","fam":"OT & Operational Disruption","desc":"Unlike most commercial insureds, schools cannot fail over to a degraded manual mode: an encrypted district frequently closes entirely. Highline Public Schools shut all 34 schools for three days; the British Library's core services were disrupted for months. Comparitech measured an average of 10.7 days of downtime per education incident, peaking at 12.6 days in 2023. Lost instructional days carry statutory make-up obligations, transport and meal-programme knock-ons, and in higher education can delay terms, research grants and graduation.","inds":{"Educational Services":{"raw":"Operational Disruption of Instruction and Institutional Continuity","subs":["Full school or campus closure and lost instructional days","Statutory make-up day and calendar-extension obligations","Loss of attendance, gradebook, timetabling and transport systems","Disruption to free/reduced meal programmes and student services","Payroll, HR and accounts-payable outage","Research interruption, lost experiments and grant milestone failure","Admissions, enrolment, registration and financial-aid disruption","Extended rebuild and device re-imaging across large fleets","Library, catalogue and digital collection outage"]}}},{"key":"operational logistics disruption","name":"Operational Logistics Disruption","fam":"OT & Operational Disruption","desc":"Hazards specific to wholesale trade and logistics operations where system downtime directly halts physical goods movement.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Operational / logistics disruption","subs":["Warehouse management system (WMS) and inventory database encryption halting order fulfillment","Freight/transportation management system (TMS) and dispatch/scheduling outages delaying deliveries","EDI/order-processing system disruption breaking automated B2B ordering pipelines with retail/wholesale customers","Customer-facing portal outages (e.g., MyToll-style portals) degrading service visibility even when core freight movement continues"]}}},{"key":"operational technology ot and physical safety adjacent risk","name":"Operational Technology OT and Physical Safety Adjacent Risk","fam":"OT & Operational Disruption","desc":"Unlike pure back-office IT sectors, hospitality/entertainment venues integrate IT with physical operations, so a ransomware event can directly disrupt guest safety, access, and physical service delivery, not just data confidentiality.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Operational technology (OT) and physical-safety-adjacent risk","subs":["Casino floor and gaming-machine network disruption","Digital door-lock and access-control system failures stranding guests or preventing check-in","Point-of-sale/payment terminal outages forcing cash-only operations","Ride/attraction control and building-management system exposure at theme parks and large venues","Kitchen, ordering, and inventory system outages disrupting food safety and service continuity"]}}},{"key":"ot critical infrastructure adjacency","name":"OT Critical Infrastructure Adjacency","fam":"OT & Operational Disruption","desc":"Where government IT connects to operational technology and public-safety infrastructure, expanding blast radius beyond data loss.","inds":{"Public Administration (Government)":{"raw":"OT / Critical-Infrastructure Adjacency","subs":["Municipal water and wastewater SCADA/OT overseen by public works departments","Traffic-management, transit, and public-lighting control systems","Public-utility (electric/water) operational systems run by state/municipal authorities","Emergency communications and radio infrastructure","IT/OT flat-network convergence in small municipalities lacking segmentation"]}}},{"key":"ot ics and physical process risk","name":"OT Ics and Physical Process Risk","fam":"OT & Operational Disruption","desc":"Operational-technology exposure specific to farms and food plants where cyber impact becomes physical and food-safety relevant.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"OT / ICS & Physical-Process Risk","subs":["Plant SCADA/PLC and process-control systems for slaughter lines, pasteurization, cooking, canning, milling and bottling","Cold-chain and refrigeration/HVAC controls where downtime causes spoilage or food-safety failures","Automated milking, feeding, ventilation and climate systems in livestock/poultry/dairy operations (animal-welfare risk)","Precision-agriculture and equipment telematics (GPS-guided machinery, grain-drying, irrigation, environmental controls)","Building-management and food-safety monitoring systems (temperature logging, HACCP-linked sensors)","IT/OT convergence and flat networks that let office ransomware reach production floors"]}}},{"key":"ot iot and jobsite facilities technology risk","name":"OT IOT and Jobsite Facilities Technology Risk","fam":"OT & Operational Disruption","desc":"Physical and operational-technology exposure distinct to construction and post-construction facilities management, generally less targeted today than pure-IT systems but a growing concern.","inds":{"Construction":{"raw":"OT, IoT and Jobsite/Facilities Technology Risk","subs":["Building Management/Automation Systems (BMS/BAS) for HVAC, elevators and life-safety systems on projects under a firm's ongoing facilities-management or warranty-service contracts","Connected heavy-equipment telematics and fleet/GPS tracking systems","Jobsite IoT sensors (structural/concrete-cure monitoring, environmental sensors)","Site security systems - cameras, badge/access control - on active construction sites","Potential physical-safety and schedule-disruption consequences if OT/jobsite systems are affected, distinct from pure data-confidentiality harm"]}}},{"key":"ot medical device and clinical operations risk","name":"OT Medical Device and Clinical Operations Risk","fam":"OT & Operational Disruption","desc":"Unlike most sectors, ransomware in healthcare directly threatens physical patient safety through disruption of connected medical equipment and clinical workflows, not just IT/data confidentiality.","inds":{"Healthcare and Social Assistance":{"raw":"OT / Medical-Device and Clinical-Operations Risk","subs":["Forced downtime/diversion of ambulances and emergency departments during EHR outages (documented at UHS 2020 and other hospital-system attacks)","Disruption of networked medical devices, infusion pumps, imaging/PACS systems, and lab analyzers that depend on now-encrypted or isolated networks","Delayed or cancelled surgeries, chemotherapy, dialysis, and elective procedures during recovery windows","Documented contribution to patient harm/death from care delays (UK Coroner findings tied delayed blood-test results after the Synnovis attack to a patient death)","Reversion to paper-based/manual clinical documentation for weeks, increasing medication and diagnostic error risk","OT/IT convergence risk in hospital facilities systems (HVAC, building access, refrigeration for pharmaceuticals/blood products)"]}}},{"key":"ot vs it risk","name":"OT Vs IT Risk","fam":"OT & Operational Disruption","desc":"Transportation/warehousing uniquely blends conventional IT (billing, CRM, EDI) with operational technology controlling physical movement of goods, an intrusion in either domain can halt the other.","inds":{"Transportation and Warehousing":{"raw":"OT vs IT Risk","subs":["Port/terminal operating systems and crane/gate automation as single points of failure (Nagoya Port)","Fleet telematics/ELD systems whose compromise removes real-time visibility and regulatory compliance capability (ORBCOMM)","Warehouse robotics, conveyor, and sortation-system control networks","IT/OT network convergence enabling lateral movement from a compromised office network into operational control systems","Safety and regulatory fallback processes (e.g., manual/paper logging) that partially mitigate but don't eliminate business impact during OT outages"]}}},{"key":"ot vs it risk cyber physical","name":"OT Vs IT Risk Cyber Physical","fam":"OT & Operational Disruption","desc":"The defining hazard of this sector: the interface between enterprise IT and operational technology (ICS/SCADA/DCS) controlling physical energy flows. IT-only ransomware routinely forces OT shutdowns, and OT-capable malware threatens physical damage.","inds":{"Energy and Utilities":{"raw":"OT vs IT Risk (Cyber-Physical)","subs":["Precautionary OT shutdown after an IT-only breach (Colonial Pipeline 6-day halt; Conpet isolated systems)","Flat/poorly-segmented IT-OT networks allowing lateral movement into control systems","SCADA / DCS / HMI / historian compromise and loss of view or loss of control","OT-specific/ICS-tailored malware (e.g., FrostyGoop manipulating Modbus TCP/502; EKANS/Snake targeting ICS processes)","Legacy/unpatchable OT assets and long OT maintenance windows","Safety-instrumented-system (SIS) risk and potential for physical damage to turbines, pipelines, transformers","Dragos: 25% of observed OT ransomware cases involved full OT-site shutdown, 75% caused some operational disruption"]}}},{"key":"ot vs it risk differentiation","name":"OT Vs IT Risk Differentiation","fam":"OT & Operational Disruption","desc":"Manufacturing's unique bifurcated risk profile, attacks can remain IT-contained (data theft) or cross into OT (halting physical production), with dramatically different loss profiles.","inds":{"Manufacturing":{"raw":"OT vs. IT Risk Differentiation","subs":["Pure-IT compromises with data-theft-only impact and limited production disruption","IT-to-OT lateral movement causing plant/production shutdowns","Purpose-built OT/ICS-targeting malware (e.g., Snake/EKANS designed to kill SCADA-associated processes)","Precautionary self-imposed shutdowns to contain spread (Bridgestone's proactive disconnection of ~30 plants)","Safety-system and physical-safety risk where OT compromise intersects with worker/product safety"]}}},{"key":"regulatory and financial exposure","name":"Regulatory and Financial Exposure","fam":"Regulatory & Legal","desc":"Transportation's critical-infrastructure designation and highly interconnected, low-margin business model amplify the downstream consequences of an incident beyond the direct IT-remediation cost.","inds":{"Transportation and Warehousing":{"raw":"Regulatory & Financial Exposure","subs":["Critical-infrastructure sector status triggering mandatory incident reporting (e.g., CISA/TSA requirements in the US)","State/federal breach-notification laws when driver, employee, or customer PII is exposed (Estes Express Lines, 21,184 individuals, Maine AG filing)","Class-action litigation risk following notification delays or inadequate security practices","SEC disclosure obligations for material incidents at public logistics companies (Expeditors International 8-K/10-K)","Thin operating margins meaning even moderate incident costs or demurrage/detention penalties can threaten solvency (KNP Logistics collapse)","Sector-specific safety regulator waivers/interventions (FMCSA ELD enforcement relief after the ORBCOMM outage)"]}}},{"key":"regulatory contractual and reputational exposure","name":"Regulatory Contractual and Reputational Exposure","fam":"Regulatory & Legal","desc":"Data-protection, payment-card, and consumer-protection obligations that shape breach costs and downstream liability specific to guest-data-heavy businesses.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Regulatory, contractual and reputational exposure","subs":["PCI-DSS obligations for any entity processing card payments (hotels, restaurants, casinos, ticketing)","State/national breach-notification laws (frequent driver of disclosed incident detail in this sector, as seen in Maine AG filings)","Gaming-commission and casino-regulator compliance obligations","GDPR/international privacy law exposure for globally operating hotel chains and cruise lines","Consumer class-action litigation risk following large loyalty-program or guest-data breaches (MGM, Caesars, Marriott)","Brand/reputational risk disproportionate to direct financial loss, given guest-trust-dependent business models"]}}},{"key":"regulatory legal and disclosure exposure","name":"Regulatory Legal and Disclosure Exposure","fam":"Regulatory & Legal","desc":"Consumer-facing businesses face a dense, overlapping set of breach-notification, payment-card, and consumer-protection obligations that amplify post-incident cost and litigation risk beyond the direct technical recovery.","inds":{"Retail Trade and Consumer Services":{"raw":"Regulatory, Legal, and Disclosure Exposure","subs":["PCI-DSS liability for payment card data exposure","State/federal breach-notification requirements (and UK/EU GDPR for multinational retailers)","Securities disclosure obligations for public companies (SEC 8-K, equivalent UK/other filings)","Class-action and consumer-litigation exposure over PII/loyalty-data theft","Regulatory scrutiny of ransom payments (OFAC-type sanctions risk on payment recipients)"]}}},{"key":"regulatory legal and food security exposure","name":"Regulatory Legal and Food Security Exposure","fam":"Regulatory & Legal","desc":"Compliance and liability hazards triggered by an incident, heightened by critical-infrastructure designation and personal-data holdings.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Regulatory, Legal & Food-Security Exposure","subs":["Critical-infrastructure reporting obligations (CISA/CIRCIA in the US, NIS2 in the EU) and national food-security scrutiny","Data-breach notification and privacy liability (state AG filings, GDPR) for employee, grower and customer PII/SSNs (Ahold Delhaize 2.2M individuals)","Food-safety regulatory fallout when process/monitoring systems are compromised (FDA/USDA, HACCP records)","Sanctions/OFAC risk when paying groups linked to sanctioned actors","Securities-disclosure exposure for public companies (SEC 8-K / 6-K materiality; Dole and UNFI quantified impacts in filings)","Contractual penalties and litigation from retailers, distributors and cooperative members affected by supply failure"]}}},{"key":"regulatory legal and notification exposure","name":"Regulatory Legal and Notification Exposure","fam":"Regulatory & Legal","desc":"Post-incident compliance and liability obligations that shape the insurable loss beyond the ransom/recovery cost itself, particularly where employee, customer, or government-ID data is exposed.","inds":{"Manufacturing":{"raw":"Regulatory, Legal, and Notification Exposure","subs":["Multi-jurisdictional breach-notification requirements for exposed employee/customer PII (e.g., Nissan's ~100,000-person notification across Australia/New Zealand)","Government-ID and financial-data exposure triggering elevated regulatory scrutiny (Medicare numbers, driver's licenses, passports, tax file numbers, SSNs, banking data seen across the example incidents)","Export-control and trade-secret protection obligations for defense/aerospace-adjacent manufacturers","Securities-disclosure obligations for publicly traded manufacturers (material incident/8-K-style disclosures)","Cross-border data-transfer and subsidiary-notification complexity for multinational manufacturers"]}}},{"key":"regulatory legal and political exposure","name":"Regulatory Legal and Political Exposure","fam":"Regulatory & Legal","desc":"Post-incident obligations and accountability pressures distinctive to public bodies answerable to citizens and oversight bodies.","inds":{"Public Administration (Government)":{"raw":"Regulatory, Legal & Political Exposure","subs":["Breach-notification and data-protection obligations (state breach laws, GDPR/UK-GDPR for foreign governments, sector rules)","Class-action litigation by affected citizens and employees over exposed PII","Public-records/FOIA scrutiny, legislative inquiries, and audits of the response","OFAC sanctions risk when a ransom would flow to a sanctioned group (constrains payment even if desired)","Political and electoral fallout, loss of public trust, and pressure on officials to restore service fast","National-security escalation for attacks on central-government institutions"]}}},{"key":"regulatory legal and reputational exposure","name":"Regulatory Legal and Reputational Exposure","fam":"Regulatory & Legal","desc":"Energy is heavily regulated as critical infrastructure; incidents trigger mandatory reporting, sanctions-screening on ransom payment, and public/political scrutiny.","inds":{"Energy and Utilities":{"raw":"Regulatory, Legal & Reputational Exposure","subs":["NERC CIP (bulk power) and TSA pipeline security-directive obligations","CISA/CIRCIA and national-CERT incident-reporting mandates; SEC 8-K materiality disclosure (Halliburton)","OFAC sanctions exposure when paying ransom to sanctioned/Russian-linked groups","Data-protection/privacy penalties (GDPR in EU; customer PII breaches)","State/national-security scrutiny and geopolitical targeting of energy assets","Litigation and shareholder/stock impact from disclosed material incidents"]}}},{"key":"regulatory notification and litigation exposure","name":"Regulatory Notification and Litigation Exposure","fam":"Regulatory & Legal","desc":"Education carries a dense, overlapping and unusually child-focused compliance regime, so a single ransomware event generates parallel regulatory tracks. FERPA and COPPA apply federally in the US, layered with state student-privacy statutes and state breach laws; UK and EU institutions face UK GDPR/GDPR and ICO scrutiny; universities holding clinical or research-health data additionally trigger HIPAA. Notification is frequently slow - Minneapolis took seven months to notify 105,617 people, and the University of Hawai'i Cancer Center's delay in notifying study participants drew specific criticism - which compounds regulatory and class-action risk.","inds":{"Educational Services":{"raw":"Regulatory, Notification and Litigation Exposure","subs":["FERPA (US student education records)","COPPA and state student-privacy laws (e.g. SOPIPA-style statutes)","State breach-notification statutes and attorney-general inquiries","UK GDPR / EU GDPR and ICO or DPA enforcement","HIPAA exposure for university medical centres, clinics and health research","Research funder, IRB and human-subjects data obligations","Class-action litigation on behalf of students, parents and staff","Delayed-notification liability and credit-monitoring remediation costs","Public-records and transparency obligations for public institutions"]}}},{"key":"reputational and customer trust risk","name":"Reputational and Customer Trust Risk","fam":"Other","desc":"Because purchase decisions in retail and consumer services are discretionary and brand-sensitive, publicized ransomware incidents translate directly into measurable revenue and market-value loss, distinct from the direct IR/ransom cost.","inds":{"Retail Trade and Consumer Services":{"raw":"Reputational and Customer-Trust Risk","subs":["Customer churn and reduced footfall/online conversion post-incident","Stock price / market capitalization impact for public companies","Loyalty-program member attrition after data-theft disclosure","Franchise/brand-license reputational spillover across independently owned locations"]}}},{"key":"service disruption availability risk mission critical public services","name":"Service Disruption Availability Risk Mission Critical Public Services","fam":"OT & Operational Disruption","desc":"Government-specific operational hazards where downtime directly harms public safety and essential service delivery, not just revenue.","inds":{"Public Administration (Government)":{"raw":"Service-Disruption / Availability Risk (mission-critical public services)","subs":["911 / emergency dispatch and first-responder CAD systems (impacted in Dallas)","Tax, revenue, customs, and treasury collection systems (Costa Rica Hacienda; Baltimore property transfers)","Benefits, social-security, and public-assistance payment systems (Costa Rican CCSS social security fund)","Courts, permitting, licensing, vital records, and land/property registries","Public utilities billing, water/electricity administrative systems, and municipal payment portals","Prolonged recovery windows (months) driven by legacy systems and limited in-house restoration capacity"]}}},{"key":"supply chain and business interruption risk","name":"Supply Chain and Business Interruption Risk","fam":"Third-Party & Supply Chain","desc":"Because manufacturers sit inside just-in-time, tightly coupled supply chains, a single-site ransomware event can cascade into contingent business interruption for downstream customers and upstream suppliers well beyond the insured's own balance sheet.","inds":{"Manufacturing":{"raw":"Supply Chain and Business Interruption Risk","subs":["Contingent business interruption to downstream OEM customers relying on JIT delivery","Upstream supplier/sub-contractor compromise propagating into the manufacturer's network","Multi-plant/multi-region shutdowns from a single network-wide compromise (Bridgestone: ~30 plants, 10 days)","Extended full-recovery timelines (100+ days per Sophos 2024 data) prolonging revenue loss beyond initial outage"]}}},{"key":"supply chain and downstream cascade risk","name":"Supply Chain and Downstream Cascade Risk","fam":"Third-Party & Supply Chain","desc":"The signature hazard of the IT industry: because these firms are technology suppliers, a single compromise propagates to their entire customer base, creating catastrophic aggregation/accumulation risk for insurers.","inds":{"Information Technology":{"raw":"Supply-Chain and Downstream Cascade Risk","subs":["MSP/RMM platform compromise cascading to managed clients (Kaseya VSA -> up to ~1,500 downstream businesses)","SaaS/hosted-platform outage cascading to customer operations (CDK Global -> ~15,000 dealerships)","Distribution/reseller channel disruption halting downstream commerce (Ingram Micro order processing)","Software-supply-chain / trojanized-update or embedded-product-vulnerability propagation (MOVEit -> 2,700+ organizations)","Cloud/subprocessor concentration and single-points-of-failure shared across many tenants"]}}},{"key":"supply chain and third party concentration risk","name":"Supply Chain and Third Party Concentration Risk","fam":"Third-Party & Supply Chain","desc":"The sector's consolidation and just-in-time structure mean one victim's outage propagates widely; conversely, victims are exposed through their many upstream vendors.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Supply-Chain & Third-Party Concentration Risk","subs":["Concentration risk in dominant nodes (few large meatpackers, a single primary grocery distributor such as UNFI supplying 30,000+ stores)","Cooperative/shared-platform risk where one hub serves many farms (NEW Cooperative claimed to touch ~40% of US grain production)","Downstream disruption to retailers and food service (empty shelves, salad-kit and crisp shortages) creating contractual and liability exposure","Upstream dependency on agrochemical, seed, feed, packaging and logistics vendors as attack conduits","Ag-tech / SaaS and cloud ERP dependencies (SoilMap-type platforms, farm-management software)","Cross-border, multi-plant footprints that let a single intrusion affect operations on several continents (JBS US/Canada/Australia)"]}}},{"key":"systemic and market contagion risk","name":"Systemic and Market Contagion Risk","fam":"Other","desc":"A hazard category distinct to this industry: ransomware against a single financial institution or vendor can cascade into broader market or payment-system disruption well beyond the immediate victim.","inds":{"Finance and Insurance":{"raw":"Systemic and Market-Contagion Risk","subs":["Disruption to trade clearing/settlement causing failed deliveries at a market level (ICBC: $62B+ in failed Treasury settlements in a single day)","Derivatives/clearing platform outages forcing manual processing across many institutions simultaneously (ION Group affecting 42+ clients)","Central bank/national payment infrastructure targeting with potential monetary-policy or public-confidence implications (Central Bank of Libya)","Contagion through banking-as-a-service and fintech partner networks, where one bank's compromise exposes many unaffiliated fintech brands' customers (Evolve Bank & Trust)"]}}},{"key":"third party and edtech vendor concentration risk","name":"Third Party and Edtech Vendor Concentration Risk","fam":"Third-Party & Supply Chain","desc":"The single most severe systemic hazard in the sector. A handful of SIS, LMS and assessment platforms serve most of the addressable market, so one vendor intrusion becomes a correlated loss across thousands of insureds simultaneously. PowerSchool (Dec 2024) reached a claimed 62.4 million students and 9.5 million teachers across approximately 6,505 districts from one compromised credential; Instructure/Canvas (May 2026) was claimed to affect 275 million users across roughly 9,000 institutions. Verizon's 2026 DBIR reported third-party involvement in 48% of breaches with supply-chain breaches up 60%. For a cyber-insurance portfolio this is the dominant aggregation exposure in the education book.","inds":{"Educational Services":{"raw":"Third-Party and Edtech Vendor Concentration Risk","subs":["Student information system (SIS) platform compromise","Learning management system (LMS) platform compromise","Single-vendor concentration across a large book of district/university insureds","Downstream re-extortion of individual schools using vendor-stolen data","Managed service providers and regional education service agencies serving many districts","Tuition, bursar and payment processor compromise","Assessment, proctoring, transcript and admissions platforms","Cloud file transfer and third-party SaaS (e.g. mass MOVEit/Cleo-style exploitation reaching education via clop)","Contractual gaps in vendor breach notification, indemnity and data-deletion assurance"]}}},{"key":"third party and vendor msp risk","name":"Third Party and Vendor Msp Risk","fam":"Third-Party & Supply Chain","desc":"Reliance on external integrators, MSPs, and cloud/SaaS platforms for both IT and OT management creates an attack surface outside the manufacturer's direct control.","inds":{"Manufacturing":{"raw":"Third-Party and Vendor/MSP Risk","subs":["Compromise via managed service providers or OT system integrators with standing remote access","Shared/interconnected supplier portals and EDI systems as lateral-movement paths","Cloud ERP/MES vendor compromise cascading to multiple manufacturing clients","Sub-tier supplier ransomware indirectly halting the insured's production (contingent BI exposure)"]}}},{"key":"third party supply chain and aggregation risk","name":"Third Party Supply Chain and Aggregation Risk","fam":"Third-Party & Supply Chain","desc":"Systemic exposure unique to government's shared and outsourced service model, where one compromise cascades across many jurisdictions.","inds":{"Public Administration (Government)":{"raw":"Third-Party, Supply-Chain & Aggregation Risk","subs":["Managed service providers (MSPs) and IT contractors serving multiple municipalities simultaneously","Shared statewide platforms, county data centers, and regional cooperatives (single point of failure for many agencies)","SaaS/cloud vendors holding benefits, tax, and records data on behalf of agencies","File-transfer and remote-management software mass-exploitation events hitting many governments at once","Election-system and voter-registration vendor exposure (integrity and confidence risk)"]}}},{"key":"third party vendor and concentration risk","name":"Third Party Vendor and Concentration Risk","fam":"Third-Party & Supply Chain","desc":"Dependence on shared infrastructure and a dense web of subprocessors amplifies both the likelihood and blast radius of incidents.","inds":{"Information Technology":{"raw":"Third-Party, Vendor and Concentration Risk","subs":["Shared cloud/hosting infrastructure and multi-tenant architecture","Subprocessor and nested-vendor dependency chains","Data-processor liability for downstream clients' data held on behalf of customers","Concentration of many customers on one platform (systemic insurer accumulation risk)"]}}},{"key":"threat actor landscape","name":"Threat Actor Landscape","fam":"Other","desc":"The specific ransomware ecosystems and actor types repeatedly hitting government, blending crime and, at national level, state interests.","inds":{"Public Administration (Government)":{"raw":"Threat-Actor Landscape","subs":["Financially-motivated RaaS crews prominent against government: Royal, Rhysida, Play, LockBit, BlackCat/ALPHV, Medusa, Interlock, Conti (defunct)","State-nexus / APT actors where extortion overlaps with espionage (Verizon 2025: espionage breaches up 163%, 28% also financially motivated)","Nation-linked operators (Iranian SamSam actors indicted for Atlanta; pro-Russian Conti against Costa Rica)","Initial-access brokers selling footholds into government networks"]}}},{"key":"underfunded security posture and recovery capability","name":"Underfunded Security Posture and Recovery Capability","fam":"Other","desc":"The sector's loss severity is driven less by attacker sophistication than by chronic under-resourcing. Sophos found lack of expertise and limited incident-response capacity cited by 42% each in lower education, and 49% of higher education institutions citing unknown security gaps. Backup reliability has degraded: recovery from backups fell to 59% in lower education and 47% in higher education. Public institutions face procurement cycles, capital-budget constraints and elected-board approval that slow both hardening and response.","inds":{"Educational Services":{"raw":"Underfunded Security Posture and Recovery Capability","subs":["Small or single-person IT teams in K-12 districts","Legacy and end-of-life systems retained on constrained capital budgets","Backup compromise, untested restores and insufficient offline copies","Absence of 24/7 monitoring, EDR coverage gaps and alert fatigue","Limited or absent cyber insurance and incident-response retainers","Slow public procurement and board-approval cycles","Reserve depletion funding recovery (British Library used c.40% of reserves)","IT staff burnout and turnover following incidents","Decentralised university IT with no central authority over departmental systems"]}}}],"exposures":[{"key":"intellectual property and trade secrets","name":"Intellectual Property and Trade Secrets","fam":"Data & IP Confidentiality","desc":"Proprietary design, engineering, and process data that is high-value theft/extortion leverage distinct to manufacturers, especially in automotive, aerospace, electronics, and industrial-equipment segments.","inds":{"Information Technology":{"raw":"Intellectual Property and Trade Secrets","subs":["Semiconductor and chip-design IP / EDA data","Proprietary algorithms, models and product roadmaps","Unreleased product blueprints and schematics","Trade secrets and competitive/strategic documents"]},"Manufacturing":{"raw":"Intellectual Property and Trade Secrets","subs":["CAD/CAM design files and product blueprints","Source code for embedded/firmware systems in products","R&D data and pre-release product specifications","Proprietary manufacturing process/recipe data","Patents and trade-secret documentation"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Intellectual property and trade secrets","subs":["R&D and engineering IP","Proprietary methodologies and software (e.g., custom CRM/software platforms like All Gather CRM)","Competitive/strategic business intelligence"]}}},{"key":"sensitive data assets","name":"Sensitive Data Assets","fam":"Data & IP Confidentiality","desc":"Data types whose theft drives extortion, regulatory penalties, and national-security concern.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Sensitive Data Assets","subs":["Employee/grower PII including SSNs, driver's licenses and passports (Ahold Delhaize: names, DOB, government IDs)","Customer and loyalty/pharmacy data at grocery-affiliated operations","Financial, banking and payment-card records","Proprietary R&D, recipes, breeding/genetics data and agronomic IP (BlackMatter stole NEW Cooperative's SoilMap source code)","Contracts, pricing, supplier and cooperative-member records","Food-safety, traceability and compliance documentation"]},"Energy and Utilities":{"raw":"Sensitive Data Assets","subs":["Customer PII and payment/loyalty data","Employee PII, HR records, passport/ID scans (Conpet, Creos)","Confidential contracts, agreements, invoices, financial records","Engineering diagrams, pipeline/grid schematics, and control-system documentation (national-security sensitive)","Geophysical/seismic, reserves, and exploration IP (oil & gas trade secrets)","Plaintext credentials and access secrets found in exfiltrated document troves (2,270+ credential-bearing files at Creos)"]}}},{"key":"third party and supply chain dependencies","name":"Third Party and Supply Chain Dependencies","fam":"Third-Party & Supply Chain","desc":"Transportation/warehousing firms rely heavily on shared vendor platforms and interconnected partner networks, concentrating risk in a small number of upstream providers.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Third-Party & Supply-Chain Dependencies","subs":["Grocery retailers, food-service buyers and downstream distributors dependent on continuous supply","Cooperative members and affiliated farms sharing a common platform/hub","Upstream input suppliers (seed, feed, fertilizer, agrochemicals, packaging)","Logistics, cold-chain and 3PL transportation providers","Ag-tech / farm-management SaaS, cloud ERP and remote-support MSPs/integrators","Payment processors and banking partners"]},"Transportation and Warehousing":{"raw":"Third-Party & Supply-Chain Dependencies","subs":["ELD/telematics hardware and software vendors (single-vendor outages cascade across many downstream carriers, as in the ORBCOMM incident)","Freight-forwarding and customs-broker software platforms shared across multiple shipping lines","Cloud-hosted logistics SaaS (booking portals, customer self-service platforms like MyToll or JAS SmartHub)","Interconnected partner/customer networks (3PLs, drayage carriers, warehouse operators) that can propagate an intrusion or be disrupted by a partner's outage","Payment processors and financial clearinghouses for freight settlement"]}}},{"key":"alumni donor and advancement databases","name":"Alumni Donor and Advancement Databases","fam":"Other","desc":"University advancement systems hold high-net-worth individuals' financial profiles, giving histories, wealth-screening assessments and private correspondence. This data is disproportionately valuable relative to its volume, and its exposure damages the institution's fundraising capacity - a material revenue line for higher education - well beyond the incident itself. The University of Manchester breach included alumni records alongside current student data.","inds":{"Educational Services":{"raw":"Alumni, Donor and Advancement Databases","subs":["Alumni contact, employment and biographical records","Donor giving histories and pledge commitments","Wealth screening and capacity/propensity ratings","Major-gift prospect research and confidential correspondence","Payment instruments and recurring donation details","Endowment, trust and planned-giving records","Board, trustee and named-benefactor information","Event, membership and affinity programme data"]}}},{"key":"bid contract and financial data","name":"Bid Contract and Financial Data","fam":"Other","desc":"Commercially sensitive project economics and the financial systems that manage them - a favored ransomware and extortion target.","inds":{"Construction":{"raw":"Bid, Contract and Financial Data","subs":["Tender/bid documents and competitive pricing data","Contract terms and subcontractor pricing schedules","Procurement and vendor/supplier data","ERP and accounting systems (e.g., Oracle E-Business Suite - the shared platform exploited in the 2025 Clop campaign that hit Bechtel and Kier)","Banking and wire-transfer details, a frequent target for invoice-fraud/BEC layered on top of ransomware intrusions"]}}},{"key":"brand product and intellectual property data","name":"Brand Product and Intellectual Property Data","fam":"Data & IP Confidentiality","desc":"Unreleased product designs, pricing strategy, and brand assets are targeted for extortion leverage distinct from customer-data theft, particularly in fashion/apparel and consumer product goods.","inds":{"Retail Trade and Consumer Services":{"raw":"Brand, Product, and Intellectual Property Data","subs":["Unreleased product designs and merchandising plans","Pricing and promotional strategy documents","Supplier/vendor contracts and cost data","Brand and marketing creative assets"]}}},{"key":"building iot and physical operations technology","name":"Building IOT and Physical Operations Technology","fam":"OT & Operationa :["Water/wastewater SCADA and public-works OT","Traffic, transit, and street-lighting control systems","Municipal utility (electric/water) operational systems","Building-management and physical-access-control systems"]}}},{"key":"operational technology industrial control systems ot ics scada","name":"Operational Technology Industrial Control Systems OT Ics Scada","fam":"OT & Operational Disruption","desc":"Physical production infrastructure that, unlike pure IT, ties ransomware impact directly to safety and physical output, the defining exposure that differentiates manufacturing from most other insured industries.","inds":{"Manufacturing":{"raw":"Operational Technology / Industrial Control Systems (OT/ICS/SCADA)","subs":["Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS)","SCADA/HMI supervisory systems","Industrial IoT (IIoT) sensors and connected machinery","Robotics and automated assembly-line controllers","Building/plant management systems (HVAC, energy, safety interlocks) converged with IT networks","Legacy/unpatched OT systems with long refresh cycles (10-20+ year equipment lifespans)"]}}},{"key":"payment and point of sale pos infrastructure","name":"Payment and Point of Sale POS Infrastructure","fam":"Other","desc":"High-volume, PCI-DSS-regulated transaction systems across hotels, restaurants, casinos, and venues that are prime ransomware/extortion targets due to payment card data and operational criticality.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Payment and point-of-sale (POS) infrastructure","subs":["POS terminals and back-office POS servers (restaurants, bars, retail outlets, cafés)","Payment gateways and card-present processing systems","Gift card / stored-value and mobile-order-ahead platforms","Casino cage, kiosk, and cashless-wagering systems","ATMs and self-service payment kiosks on-premises"]}}},{"key":"physical and building adjacent operational technology","name":"Physical and Building Adjacent Operational Technology","fam":"OT & Operational Disruption","desc":"Consumer-services subsectors (grocery, hospitality, fitness, healthcare-adjacent services) operate physical/IoT systems whose disruption creates safety and spoilage risk beyond pure data loss.","inds":{"Retail Trade and Consumer Services":{"raw":"Physical and Building-Adjacent Operational Technology","subs":["Refrigeration/HVAC and building management systems (grocery, food service)","Digital key/access-card systems (hospitality/casino)","Warehouse robotics and automated fulfillment hardware","Fitness/wellness facility access and scheduling systems"]}}},{"key":"physical and critical infrastructure assets","name":"Physical and Critical Infrastructure Assets","fam":"OT & Operational Disruption","desc":"Because transportation is designated critical infrastructure in most jurisdictions, exposure extends beyond data to physical assets and public safety/regulatory systems.","inds":{"Transportation and Warehousing":{"raw":"Physical & Critical-Infrastructure Assets","subs":["Ports, container terminals, and intermodal rail yards","Vehicle fleets rendered inoperable when dispatch/ELD/telematics systems are locked","Cold-chain and hazmat tracking systems where downtime creates spoilage or safety risk","Cross-border/customs clearance systems whose outage can halt trade flows nationally","Airport ground-handling and cargo-processing systems"]}}},{"key":"physical and field infrastructure","name":"Physical and Field Infrastructure","fam":"OT & Operational Disruption","desc":"Telecom's unusual exposure of physical assets and access controls alongside digital ones - a hazard largely absent in pure IT/software industries.","inds":{"Telecommunications":{"raw":"Physical & Field Infrastructure","subs":["Cell tower compounds and physical access/gate codes (American Tower incident)","Colocation and data center facility access systems","Field service technician and subcontractor credentials/networks (Bell Technical Solutions-style)","Tower/asset GPS location data"]}}},{"key":"physical goods livestock and continuity assets","name":"Physical Goods Livestock and Continuity Assets","fam":"OT & Operational Disruption","desc":"Sector-unique tangible exposures that convert cyber downtime into direct physical loss.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Physical Goods, Livestock & Continuity Assets","subs":["Perishable raw materials and finished inventory at risk of spoilage during outages","Live animals dependent on automated feeding, watering and climate control (welfare and mortality risk)","Cold-chain integrity across storage and transit","Seasonal/time-critical processing windows (harvest, slaughter, planting) with no slack to absorb downtime","Manual-workaround capacity and business-continuity/backup infrastructure","Brand/reputation and consumer-trust assets tied to food safety and availability"]}}},{"key":"physical operational continuity systems","name":"Physical Operational Continuity Systems","fam":"OT & Operational Disruption","desc":"Facility and logistics systems whose disruption has direct patient-safety consequences distinct from pure data risk.","inds":{"Healthcare and Social Assistance":{"raw":"Physical/Operational Continuity Systems","subs":["Ambulance/EMS dispatch and diversion coordination","Pharmacy and blood-bank inventory/cold-chain management systems","Hospital building management/access-control systems","Emergency department and OR scheduling systems"]}}},{"key":"physical plant and multi site infrastructure","name":"Physical Plant and Multi Site Infrastructure","fam":"OT & Operational Disruption","desc":"Geographically distributed physical facilities whose network segmentation (or lack thereof) determines how far a single compromise can spread.","inds":{"Manufacturing":{"raw":"Physical Plant and Multi-Site Infrastructure","subs":["Multiple manufacturing plants/sites on shared corporate networks","Regional/subsidiary networks with va inds":{"Public Administration (Government)":{"raw":"Public-Safety & Emergency Systems","subs":["911 / emergency dispatch and computer-aided-dispatch (CAD) (Dallas)","First-responder and police/fire records and communications","Emergency notification and alerting systems","Jail/detention and body-camera/evidence management systems"]}}},{"key":"real estate specific systems and data","name":"Real Estate Specific Systems and Data","fam":"Other","desc":"Systems and data unique to commercial/residential real estate services firms.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Real estate-specific systems and data","subs":["Property management and lease/tenant databases","Building access-control and physical security systems (e.g., Open Options access-control platform incident)","Title, escrow, and transaction-closing data","Facilities/IoT building-management systems"]}}},{"key":"regulatory lawful intercept and critical infrastructure systems","name":"Regulatory Lawful Intercept and Critical Infrastructure Systems","fam":"Regulatory & Legal","desc":"Government-facing and critical-infrastructure-designated systems that create outsized regulatory and national-security exposure when compromised.","inds":{"Telecommunications":{"raw":"Regulatory, Lawful-Intercept & Critical-Infrastructure Systems","subs":["Lawful intercept and law-enforcement request-handling systems","Critical infrastructure/national security designated network segments","Breach-notification and regulatory reporting systems (subject to GDPR, PIPC, FCC, Ofcom, etc.)"]}}},{"key":"research data intellectual property and regulated research health data","name":"Research Data Intellectual Property and Regulated Research Health Data","fam":"Regulatory & Legal","desc":"The exposure unique to higher education. Universities hold pre-publication research, proprietary and licensed datasets, export-controlled work and long-running human-subjects cohorts. The University of Manchester attack reached NHS records for 1.1 million patients gathered from over 200 hospitals for medical research, and the University of Hawai'i Cancer Center incident exposed decades-old epidemiological cohort data affecting up to 1.15 million individuals - demonstrating that research archives create liability for populations who were never students or staff.","inds":{"Educational Services":{"raw":"Research Data, Intellectual Property and Regulated Research Health Data","subs":["Human-subjects research cohorts and longitudinal study data","Clinical, patient and genomic research datasets (HIPAA-regulated)","Pre-publication research, grant applications and unpublished results","Patents, licensing pipelines and technology-transfer records","Export-controlled, defence and dual-use research","Industry-sponsored and contract research under NDA","HPC clusters, lab instrumentation and research computing storage","Licensed third-party datasets with contractual breach penalties","IRB records and participant consent/identity linkage files"]}}},{"key":"software development and source code assets","name":"Software Development and Source Code Assets","fam":"Data & IP Confidentiality","desc":"The crown-jewel assets unique to technology firms; their exposure enables both direct IP loss and downstream supply-chain compromise.","inds":{"Information Technology":{"raw":"Software Development and Source-Code Assets","subs":["Source-code repositories (Git/GitHub/GitLab/Bitbucket)","CI/CD build and release pipelines","Code-signing keys and certificates","Container registries and artifact stores","Product designs, hardware blueprints and chip/EDA design data"]}}},{"key":"student information systems sis and core records","name":"Student Information Systems Sis and Core Records","fam":"Other","desc":"The system of record for enrolment, demographics, attendance, discipline and transcripts, and the highest-value single target in education because it concentrates minors' PII for an entire district or institution in one platform. SIS compromise is both a direct exposure at the institution and, via the vendor, the sector's principal aggregation event - the PowerSchool intrusion reached a claimed 62.4 million students and 9.5 million teachers across approximately 6,505 districts.","inds":{"Educational Services":{"raw":"Student Information Systems (SIS) and Core Records","subs":["Enrolment, demographic and household records","Attendance and truancy data","Disciplinary and behavioural records","Transcripts, grades and academic history","Special-education (IEP/504) records","Immunisation and student health records held in SIS","Emergency contact and guardian/custody information","Free and reduced-price meal eligibility (income-linked)","Vendor-hosted SIS instances and SIS data warehouses"]}}},{"key":"subscriber and customer pii","name":"Subscriber and Customer PII","fam":"Data & IP Confidentiality","desc":"The high-volume personal data telecom operators uniquely hold by virtue of serving as national-scale identity and communications intermediaries.","inds":{"Telecommunications":{"raw":"Subscriber & Customer PII","subs":["Names, addresses, dates of birth, national ID/passport/driver's license scans","Call Detail Records (CDRs) - who called whom, when, duration, cell-tower location metadata","Billing, payment card and bank account data","Login credentials, security questions, and account history (WOW!-style)","Device/handset data and device financing records"]}}},{"key":"supply chain and third party vendor networks","name":"Supply Chain and Third Party Vendor Networks","fam":"Third-Party & Supply Chain","desc":"Manufacturing's deep tiered-supplier interdependency means exposure extends well beyond the insured entity's own network perimeter.","inds":{"Manufacturing":{"raw":"Supply Chain and Third-Party/Vendor Networks","subs":["Tier 1/2/3 supplier and subcontractor network connections (EDI, VPN, shared portals)","Just-in-time (JIT) logistics and shipping/freight coordination systems","Contract manufacturers and OEM/ODM partners","Third-party MSPs/OT integrators with remote access credentials","Raw material and component sourcing platforms"]}}},{"key":"supply chain inventory and store operations systems","name":"Supply Chain Inventory and Store Operations Systems","fam":"Third-Party & Supply Chain","desc":"ERP, warehouse management, automated ordering, and inventory/replenishment systems whose disruption forces retailers back to manual, paper-based operations - the single biggest driver of revenue loss in major incidents like M&S.","inds":{"Retail Trade and Consumer Services":{"raw":"Supply Chain, Inventory, and Store Operations Systems","subs":["ERP / enterprise resource planning platforms","Warehouse management and logistics/routing systems","Automated stock replenishment and ordering systems","Store network and in-store IT infrastructure (self-checkout, digital signage)","Click-and-collect / omnichannel fulfillment systems"]}}},{"key":"telehealth and remote care platforms","name":"Telehealth and Remote Care Platforms","fam":"Other","desc":"Patient-facing digital care delivery channels that expand the network's external attack surface.","inds":{"Healthcare and Social Assistance":{"raw":"Telehealth and Remote-Care Platforms","subs":["Telehealth/video-visit platforms","Remote patient monitoring and wearable-device data feeds","Patient portals and appointment-scheduling systems"]}}},{"key":"third parties and interconnections","name":"Third Parties and Interconnections","fam":"Other","desc":"External entities and links whose compromise transmits risk into or out of the operator.","inds":{"Energy and Utilities":{"raw":"Third Parties & Interconnections","subs":["Oilfield-service, drilling, and EPC contractors","ICS/automation vendors and remote-maintenance channels","Fuel/payment processors and retail franchisees","Interconnected pipeline/grid operators and shared telemetry","MSPs, IT outsourcers, and shared group-IT platforms","Software/firmware/update supply chain (WSUS abuse, vendor patches)"]}}},{"key":"third party and shared service dependencies","name":"Third Party and Shared Service Dependencies","fam":"Third-Party & Supply Chain","desc":"External providers and shared platforms whose compromise exposes the agency (aggregation risk).","inds":{"Public Administration (Government)":{"raw":"Third-Party & Shared-Service Dependencies","subs":["MSPs, IT contractors, and outsourced help-desk/network providers","Shared statewide/county data centers and regional service cooperatives","Cloud/SaaS vendors for benefits, tax, HR, and records processing","File-transfer and remote-management software (MOVEit-style mass-exploit exposure)","Election and voter-registration technology vendors","Payment processors and identity-verification providers"]}}},{"key":"third party and subcontractor networks","name":"Third Party and Subcontractor Networks","fam":"Third-Party & Supply Chain","desc":"External parties and shared infrastructure that extend a construction firm's attack surface beyond its own perimeter.","inds":{"Construction":{"raw":"Third-Party and Subcontractor Networks","subs":["Shared extranets/portals used by subcontractors, architects and engineers","Owner and lender draw-request/financing portals","Common enterprise software shared industry-wide, creating correlated multi-victim exposure","Managed IT/security service providers used by smaller subcontractors"]}}},{"key":"third party and supply chain exposure","name":"Third Party and Supply Chain Exposure","fam":"Third-Party & Supply Chain","desc":"Extensive outsourcing and franchise/partner relationships common to hospitality, food service, and entertainment create indirect exposure when a vendor, franchisee, or partner is compromised.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Third-party and supply-chain exposure","subs":["IT help desk / managed service providers (a common initial-access vector, e.g., MGM/Caesars)","Third-party booking, ticketing, and OTA platforms","Food & beverage supply chain and distribution/logistics vendors (e.g., Blue Yonder-type SaaS incidents)","Construction, renovation, and facilities contractors with access to internal systems/data (e.g., Disneyland Paris partner breach)","Staffing agencies and payroll/HR outsourcing providers","Franchise and multi-brand management companies operating shared back-office systems across many independently branded properties"]}}},{"key":"third party and vendor ecosystem","name":"Third Party and Vendor Ecosystem","fam":"Third-Party & Supply Chain","desc":"The dense web of business associates and downstream partners that extend a healthcare organization's effective risk surface far beyond its own network.","inds":{"Healthcare and Social Assistance":{"raw":"Third-Party and Vendor Ecosystem","subs":["EHR, practice-management, and health IT software vendors","Managed service providers (MSPs) and IT outsourcers serving multiple clinics/hospitals","Medical billing/collections and revenue-cycle-management firms","Lab, imaging, and pathology outsourcing partners","Staffing agencies and home-health/senior-care service providers","Health insurers and third-party administrators handling member PHI"]}}},{"key":"third party edtech cloud and identity infrastructure","name":"Third Party Edtech Cloud and Identity Infrastructure","fam":"Third-Party & Supply Chain","desc":"Modern institutions outsource most of their data estate, so a large share of exposure sits outside the insured's own perimeter and outside its control. This is the exposure that converts individual education risks into portfolio-level correlated loss, and Verizon's 2026 DBIR reported third parties featuring in 48% of breaches with supply-chain breaches up 60% year over year.","inds":{"Educational Services":{"raw":"Third-Party Edtech, Cloud and Identity Infrastructure","subs":["SIS, LMS and assessment vendors (aggregation nodes)","Managed service providers and regional education service agencies","Cloud tenancies (Microsoft 365, Google Workspace) and OAuth token estates","Federated identity providers and SSO trust fabric (Shibboleth, InCommon, eduGAIN)","Managed file transfer and data exchange platforms","Payment processors, tuition plans and collections agencies","Library systems, catalogues, e-resource and publisher platforms","Transcript, credentialing, admissions and enrolment-verification services","Backup, DR and archival providers","Student wellbeing, tutoring, safety-monitoring and communications apps"]}}},{"key":"third party franchise and vendor dealer networks","name":"Third Party Franchise and Vendor Dealer Networks","fam":"Third-Party & Supply Chain","desc":"Retail and consumer-services businesses depend heavily on shared platforms (DMS/SaaS providers), franchise networks, and outsourced IT help desks, creating single points of failure that can cascade an attack on one vendor into thousands of affected businesses.","inds":{"Retail Trade and Consumer Services":{"raw":"Third-Party, Franchise, and Vendor/Dealer Networks","subs":["Shared SaaS/dealer-management-system providers (e.g., DMS platforms for auto dealers)","Franchise and multi-location operator networks","Outsourced/third-party IT help desks and identity providers (Okta and similar)","Payment processors and financial intermediaries","Marketing, loyalty, and analytics vendors with data-sharing access"]}}},{"key":"third party partner and downstream data","name":"Third Party Partner and Downstream Data","fam":"Third-Party & Supply Chain","desc":"Data and access that telecom operators hold on behalf of, or shared with, other organizations - amplifying blast radius beyond the operator's own customers.","inds":{"Telecommunications":{"raw":"Third-Party, Partner & Downstream Data","subs":["MVNO (mobile virtual network operator) and reseller partner data","Interconnect/roaming carrier data and industry-association data (e.g., GSMA)","Data belonging to enterprise customers hosted, routed, or processed by the telecom (managed services, hosting, colocation)","References to other companies' infrastructure held incidentally (e.g., tower records referencing other carriers' equipment)"]}}},{"key":"third party vendor and fintech partner ecosystem","name":"Third Party Vendor and Fintech Partner Ecosystem","fam":"Third-Party & Supply Chain","desc":"Financial institutions increasingly outsource operational functions and partner with fintechs, creating shared/concentrated exposure where a single vendor breach cascades across multiple unrelated institutions and their end customers.","inds":{"Finance and Insurance":{"raw":"Third-Party, Vendor, and Fintech-Partner Ecosystem","subs":["Banking-as-a-service (BaaS) infrastructure providers and their downstream fintech clients (e.g., Evolve Bank & Trust exposing Affirm, Wise, Mercury customers)","Statement printing, mailing, and document-fulfillment vendors (e.g., Frost/Citizens shared vendor)","Marketing, loyalty, and incentive-platform vendors serving bank sales partners (e.g., Deutsche Bank third-party marketing platform)","Core-processing and payments technology vendors (e.g., Fiserv, TSYS-type processors)","Title, escrow, and closing-services platforms tied to real estate transactions (e.g., FNF)","Credit bureaus, KYC/identity-verification, and data-aggregation partners","Managed IT/security service providers and outsourced call centers"]}}},{"key":"wholesale trade and logistics systems","name":"Wholesale Trade and Logistics Systems","fam":"OT & Operational Disruption","desc":"Systems supporting the physical movement and distribution of goods.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Wholesale trade and logistics systems","subs":["Warehouse management systems (WMS) and inventory databases","Freight/transportation management and dispatch systems","EDI and automated B2B order-processing pipelines","Customer-facing tracking/shipping portals"
