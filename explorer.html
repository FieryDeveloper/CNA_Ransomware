lobal aluminum producer was forced into manual/paper-based operations across dozens of plants after LockerGoga encrypted IT systems that also touched production processes. Norsk Hydro refused to pay the ransom and publicly disclosed the incident in near-real time, becoming a widely cited case study in transparent incident response.","src":["https://www.securityweek.com/ransomware-attack-costs-norsk-hydro-tens-millions-dollars/","https://www.computerweekly.com/news/252467199/Norsk-Hydro-cyber-attack-could-cost-up-to-75m","https://news.microsoft.com/source/features/digital-transformation/hackers-hit-norsk-hydro-ransomware-company-responded-transparency/","https://www.darkreading.com/cyberattacks-data-breaches/6-things-to-know-about-the-ransomware-that-hit-norsk-hydro"]},{"v":"Honda Motor Co.","g":"Snake/EKANS","d":"2020-06-07","c":"Japan (global operations affected)","fin":"Not publicly disclosed as a specific dollar figure by Honda; industry analyses characterize the loss as significant given multi-day, multi-plant global production stoppage but no official cost figure was released.","ran":"Not publicly disclosed; no confirmed ransom payment reported.","dt":"Production and sales of cars, motorcycles, and power/marine products was suspended at plants across multiple countries for several days before systems were restored; exact recovery timeline varied by site.","di":"Primarily an OT/production-availability event; no large confirmed customer data leak was publicly reported in connection with this specific 2020 incident.","s":"EKANS ransomware, one of the first ransomware strains purpose-built to target ICS/OT process-control software, hit Honda's internal network, forcing production and sales halts at multiple plants worldwide (Japan, US, UK, Turkey, Brazil, India, and elsewhere). Likely initial access was via an exposed RDP connection.","src":["https://www.theregister.com/2020/06/09/honda_ransomware_snake_ekans_malware/","https://www.computerweekly.com/news/252484389/Honda-investigates-suspected-Snake-ransomware-attack","https://cyote.inl.gov/content/uploads/24/2025/12/CyOTE-Case-Study_EKANS.pdf"]},{"v":"Foxconn (CTBG MX plant, Ciudad Juárez)","g":"DoppelPaymer","d":"2020-11-29","c":"Mexico","fin":"Not publicly disclosed as an official incident-cost figure by Foxconn; the destruction of 20-30 TB of backup data materially increased recovery cost and complexity beyond the ransom figure itself.","ran":"DoppelPaymer demanded 1,804.0955 BTC, reported at the time as approximately $34 million (some sources cite ~$32.97 million); Foxconn did not pay, and stolen data was later published on the dark web.","dt":"Foxconn confirmed the ransomware disrupted production operations at the affected Mexico facility; precise recovery timeline in days not independently confirmed in public reporting beyond confirmation that normal operations were eventually restored.","di":"Approximately 100 GB of unencrypted files were stolen prior to encryption (double-extortion); 20-30 TB of backup data was deliberately deleted by the attackers to hamper recovery.","s":"Electronics-manufacturing giant Foxconn's Mexico facility was hit over the Thanksgiving 2020 weekend; attackers encrypted roughly 1,200 servers, exfiltrated data, and destroyed a large volume of backups before demanding a very large ransom.","src":["https://www.bleepingcomputer.com/news/security/foxconn-electronics-giant-hit-by-ransomware-34-million-ransom/","https://www.securityweek.com/foxconn-confirms-ransomware-hit-factory-mexico/","https://securityaffairs.com/112033/cyber-crime/foxconn-doppelpaymer-ransomware.html"]},{"v":"Volvo Car Corporation","g":"Snatch","d":"2021-11-30","c":"Sweden","fin":"Not publicly disclosed; Volvo did not report a specific financial cost figure for the incident.","ran":"Not publicly disclosed; no confirmed ransom demand amount or payment reported. Volvo stated it maintained control of its data and did not indicate paying any ransom.","dt":"No significant production/operational downtime was publicly reported; this was primarily a data-theft/extortion event rather than an OT-disruptive encryption event.","di":"Snatch leaked approximately 35.6 MB of sample stolen R&D files as proof of the larger theft; Volvo stated it saw no indication of impact to customer safety, vehicle security, or personal customer data.","s":"The Snatch ransomware/extortion group claimed to have breached a Volvo Cars file repository and stole a portion of the automaker's proprietary R&D data, leaking sample files as proof. Volvo disputed being a 'victim of ransomware' per se, framing it as unauthorized third-party access to one file server, but confirmed R&D data theft.","src":["https://techcrunch.com/2021/12/10/volvo-had-some-rd-data-stolen-in-security-breach/","https://www.bleepingcomputer.com/news/security/volvo-cars-discloses-security-breach-leading-to-randd-data-theft/","https://www.cpomagazine.com/cyber-security/volvo-security-breach-led-to-rd-data-theft-by-snatch-threat-actors/"]},{"v":"Bridgestone Americas","g":"LockBit 2.0","d":"2022-02-27","c":"United States (Latin America/North America plants affected)","fin":"Not publicly disclosed as an official total-cost figure; Bridgestone engaged Accenture Security for incident response, adding external forensic/recovery costs on top of ~10 days of idled production across ~30 plants.","ran":"Specific ransom demand amount not publicly disclosed; Bridgestone did not confirm payment, and LockBit proceeded to leak stolen data after the deadline passed.","dt":"Approximately 30 plants across North America and Latin America were shut down for about 10 days; all plants had resumed normal operations by March 9, 2022.","di":"Business records were accessed and stolen, including files containing Social Security numbers, bank information, and other sensitive data belonging to some customers.","s":"The tire and rubber manufacturer detected a security incident in late February 2022; LockBit 2.0 claimed responsibility on March 11, 2022, and threatened to publicly release stolen business and customer data unless a ransom was paid. Bridgestone proactively disconnected manufacturing and retreading facilities across North and Latin America to contain the incident.","src":["https://www.bleepingcomputer.com/news/security/bridgestone-americas-confirms-ransomware-attack-lockbit-leaks-data/","https://www.msspalert.com/news/bridgestone-cyberattack-timeline-and-ransomware-recovery-details","https://industrialcyber.co/threats-attacks/bridgestone-cyberattack-disrupts-manufacturing-raises-supply-chain-concerns/","https://www.darkreading.com/ics-ot-security/bridgestone-ciso-lessons-ransomware-attack-acting-thinking"]},{"v":"Continental AG","g":"LockBit","d":"2022-08 (attack disclosed); extortion escalated Nov-Dec 2022","c":"Germany","fin":"Not publicly disclosed as an official incident-cost figure by Continental beyond confirming systems access occurred; no confirmed operational-loss figure released.","ran":"LockBit publicly listed the stolen data for sale at $50 million on November 9, 2022, reduced to $40 million by November 29, 2022; negotiation transcripts published by LockBit show discussions beginning September 23, 2022, but Continental has stated it aborted contact with the group rather than paying.","dt":"No major manufacturing/plant downtime was publicly reported; this was chiefly a data-exfiltration/extortion event rather than an OT-encryption event.","di":"Attackers claimed to have stolen roughly 40 terabytes of internal files (some early reports mis-stated this as 40 GB), including technical documents and source code, based on screenshots published on the leak site.","s":"The German automotive-parts giant was breached via an employee's browser download; LockBit gained access to internal systems and, after negotiations broke down, publicly offered the stolen dataset for sale on its leak site for a headline figure of $50 million (later reduced to $40 million).","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-claims-attack-on-continental-automotive-giant/","https://www.scworld.com/brief/stolen-data-from-continental-ransomware-attack-for-sale-for-50m","https://www.securityweek.com/ransomware-gang-offers-sell-files-stolen-continental-50-million/","https://borncity.com/win/2022/12/17/ransomware-at-continental-infection-via-an-employees-browser-download/"]},{"v":"Yamaha Motor Philippines, Inc.","g":"INC Ransom","d":"2023-10-25","c":"Philippines","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"Yamaha stood up a countermeasures team and launched an investigation; no specific downtime duration was publicly disclosed, and the impact was described as limited to one server.","di":"Approximately 37 GB of allegedly stolen data was published, including employee ID information, backup files, and corporate/sales information; partial leakage of employees' personal information was confirmed by Yamaha.","s":"A single server managed by Yamaha's Philippines motorcycle-manufacturing/sales subsidiary was breached and hit with ransomware; INC Ransom added the company to its leak site roughly three weeks later and published stolen employee and corporate data.","src":["https://www.bleepingcomputer.com/news/security/yamaha-motor-confirms-ransomware-attack-on-philippines-subsidiary/","https://www.securityweek.com/yamaha-motor-confirms-data-breach-following-ransomware-attack/","https://gbhackers.com/yamaha-ransomware-attack/"]},{"v":"Nissan Australia (Nissan Oceania)","g":"Akira","d":"2023-12-05","c":"Australia (and New Zealand)","fin":"Not publicly disclosed as an official cost figure by Nissan.","ran":"Specific dollar ransom demand not publicly disclosed; negotiations with Nissan reportedly failed and the company did not pay, after which Akira threatened to leak the data.","dt":"No major production-line/OT downtime was publicly reported; primarily a data-breach/extortion event rather than an operational-disruption event.","di":"Approximately 100 GB of documents stolen, affecting an estimated 100,000 individuals; exposed data included around 4,000 Medicare card numbers, 7,500 driver's license numbers, 220 passport numbers, and 1,300 tax file numbers, alongside employee personal information, NDAs, and partner/client details.","s":"Nissan detected an intrusion into its Australian division's network in December 2023; the Akira ransomware gang claimed responsibility and, after negotiations reportedly failed, threatened to leak stolen business and personal data. Nissan confirmed in 2024 that the breach affected roughly 100,000 individuals across Australia and New Zealand, including customers, dealers, and current/former employees.","src":["https://www.bleepingcomputer.com/news/security/nissan-australia-cyberattack-claimed-by-akira-ransomware-gang/","https://www.securityweek.com/nissan-data-breach-affects-100000-individuals/","https://www.cpomagazine.com/cyber-security/nissan-oceania-data-breach-impacts-100000-individuals-in-australia-and-new-zealand/","https://securityaffairs.com/156283/cyber-crime/akira-ransomware-breached-nissan-australia.html"]},{"v":"MKS Instruments, Inc.","g":"not publicly disclosed","d":"February 3, 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Global operations restored following ransomware incident","di":"not publicly disclosed","s":"MKS Instruments, Inc. experienced a ransomware incident identified on February 3, 2023, which disrupted their operations. The company reported that they have restored global operations and are on track to recover revenue by the end of the second quarter of 2023.","src":["https://www.sec.gov/Archives/edgar/data/1049502/000095017023017248/mksi-ex99_1.htm"]},{"v":"Gates Industrial Corporation plc","g":"not publicly disclosed","d":"2023-02-11","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The attack resulted in the temporary inability of most facilities to produce and ship products. Production and shipping have been restored at some facilities, with full restoration expected in the coming days.","di":"It is possible that personally identifiable information (PII) was accessed, but the extent is not yet determined.","s":"On February 11, 2023, Gates Industrial Corporation plc reported being the target of a ransomware attack. The company activated its incident response plans and engaged cybersecurity experts to assess and remediate the situation, which temporarily disrupted production and shipping operations.","src":["https://www.sec.gov/Archives/edgar/data/1718512/000171851223000016/gtes-20230211.htm"]},{"v":"Tecogen Inc.","g":"not publicly disclosed","d":"2023-04-28","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company's network was fully operational on May 1, 2023, after restoring files from the previous evening's back-up.","di":"not publicly disclosed","s":"Tecogen Inc. experienced a ransomware attack on April 28, 2023, which was identified as a spear phishing attack targeting the company's VPN. The company took immediate action to limit access, investigate the threat, and restore affected files, successfully returning to full operational status by May 1, 2023.","src":["https://www.sec.gov/Archives/edgar/data/1537435/000153743523000036/tgen-20230503.htm"]},{"v":"Ultralife Corporation","g":"avoslocker","d":"2023-01-25","c":"United States","fin":"not publicly disclosed","ran":"not applicable","dt":"approximately two weeks of production and shipping downtime; systems have been restored and production resumed","di":"not publicly disclosed","s":"Ultralife Corporation experienced an unauthorized entry into its IT systems, leading to a partial disruption of operations at its Newark and Virginia Beach locations. The company engaged external incident response professionals and did not pay any ransom, as they restored their systems and resumed production.","src":["https://www.sec.gov/Archives/edgar/data/875657/000143774923005169/ulbi20230301_8k.htm"]},{"v":"Hillman Solutions Corp.","g":"not publicly disclosed","d":"May 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hillman Solutions Corp. experienced a ransomware attack in May 2023, which resulted in direct and indirect costs associated with the incident. The company is also expecting insurance receivables related to this cybersecurity incident.","src":["https://www.sec.gov/Archives/edgar/data/1822492/000182249224000059/hillmanpr-termnoterepricin.htm"]},{"v":"PGT Innovations, Inc.","g":"royal","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"PGT Innovations, Inc. reported that their fourth quarter financial results were impacted by a ransomware incident, which affected their ability to expand gross margin. The incident, along with Hurricane Ian, resulted in a revenue impact of approximately $15 million.","src":["https://www.sec.gov/Archives/edgar/data/1354327/000095017023003596/pgti-ex99_1.htm"]},{"v":"HanesBrands Inc.","g":"not publicly disclosed","d":"May 31, 2022","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"HanesBrands Inc. announced that it experienced a ransomware attack on May 31, 2022. The incident raised concerns regarding the adequacy and security of their information technology systems.","src":["https://www.sec.gov/Archives/edgar/data/1359841/000119312523031373/d438262dex991.htm"]},{"v":"Sensata Technologies Holding plc","g":"not publicly disclosed","d":"2025-04-06","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident has temporarily impacted operations, including shipping, receiving, and manufacturing production. The timeline for full restoration is not yet known.","di":"Files were taken from the Company’s environment; specific records or individuals affected are not disclosed.","s":"On April 6, 2025, Sensata Technologies experienced a ransomware incident that encrypted devices in its network. The company activated response protocols, took its network offline, and is investigating the incident with third-party cybersecurity professionals.","src":["https://www.sec.gov/Archives/edgar/data/1477294/000147729425000047/st-20250406.htm"]},{"v":"The Coca-Cola Company","g":"everest","d":"2026-07-16","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production operations at fairlife in the United States are temporarily suspended; investigation and restoration efforts are ongoing.","di":"not publicly disclosed","s":"On July 16, 2026, The Coca-Cola Company announced that its subsidiary fairlife, LLC experienced unauthorized access to its systems due to a ransomware event. The company activated its incident response protocols and is investigating the impact, with production operations in the U.S. temporarily suspended.","src":["https://www.sec.gov/Archives/edgar/data/21344/000162828026048466/ko-20260716.htm"]},{"v":"Mueller Water Products, Inc.","g":"not publicly disclosed","d":"2023-10-28","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company has largely restored the impacted applications and systems and continues to execute business continuity and restoration plans for the remaining impacted applications and systems.","di":"not publicly disclosed","s":"Mueller Water Products, Inc. experienced a cybersecurity incident involving unauthorized access and deployment of ransomware, which disrupted access to business applications and limited the ability to take orders and ship products. The company has contained the incident and is in the process of restoring operations and verifying data.","src":["https://www.sec.gov/Archives/edgar/data/1350593/000135059323000054/mwa-20231129.htm"]},{"v":"Johnson Controls International","g":"Dark Angels","d":"September 23, 2023","c":"Ireland","fin":"$27 million","ran":"$51 million","dt":"The attack forced the firm to shut down large portions of its IT infrastructure, affecting customer-facing systems.","di":"over 27 TB of confidential data stolen","s":"Johnson Controls International confirmed that a ransomware attack in September 2023 cost the company $27 million and resulted in a data breach. The Dark Angels ransomware gang was responsible for the attack, which involved unauthorized access, data exfiltration, and deployment of ransomware, leading to significant service disruptions.","src":["https://www.bleepingcomputer.com/news/security/johnson-controls-says-ransomware-attack-cost-27-million-data-stolen/","https://www.sec.gov/Archives/edgar/data/833444/000083344423000038/jci-20231113.htm"]},{"v":"Hillman Group","g":"not publicly disclosed","d":"May 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hillman Group experienced a ransomware attack in May 2023, which has had direct and indirect costs associated with the incident. The company has mentioned the receipt of expected insurance receivables related to this cybersecurity incident.","src":["https://www.sec.gov/Archives/edgar/data/1822492/000182249224000085/hillmanq12024earningscal.htm"]},{"v":"Coca-Cola Company (Fairlife subsidiary)","g":"Anubis","d":"July 16, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most production in the U.S. has been resumed; temporary suspension of production operations occurred.","di":"One terabyte of files allegedly stolen; specific records/people affected not disclosed.","s":"Coca-Cola confirmed a ransomware attack on its dairy subsidiary, Fairlife, resulting in data theft and disruption of production operations. The Anubis ransomware gang claimed responsibility, threatening to leak stolen data unless a ransom was paid. The company reported the incident to authorities and resumed most production operations shortly after the attack.","src":["https://www.bleepingcomputer.com/news/security/coca-cola-confirms-data-theft-in-fairlife-ransomware-attack/"]},{"v":"Coca-Cola Fairlife","g":"Anubis","d":"July 16, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production at U.S. facilities was suspended due to the attack.","di":"Approximately 1 terabyte of corporate data claimed to be stolen.","s":"The Anubis ransomware gang claimed responsibility for a cyberattack on Coca-Cola's Fairlife subsidiary, threatening to leak stolen corporate data unless a ransom is paid. The attack disrupted Fairlife's operations, leading to a suspension of production at its U.S. facilities, although Canadian operations continued normally.","src":["https://www.bleepingcomputer.com/news/security/anubis-ransomware-claims-coca-cola-fairlife-attack-threatens-data-leak/"]},{"v":"Coca-Cola Company","g":"not publicly disclosed","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production at Fairlife's U.S. facilities has been temporarily suspended while the company responds to the incident and restores impacted systems.","di":"not publicly disclosed","s":"Coca-Cola's Fairlife dairy subsidiary experienced a ransomware attack that disrupted operations and temporarily halted production of Fairlife products across the United States. The company activated its incident response protocols and is investigating the impact of the incident, but has not disclosed whether any data was stolen or if an extortion demand was made.","src":["https://www.bleepingcomputer.com/news/security/coca-cola-says-fairlife-ransomware-attack-halts-us-dairy-production/"]},{"v":"Nidec Corporation","g":"Blackfield","d":"2026-06-22","c":"Japan","fin":"not publicly disclosed","ran":"$2 million","dt":"Emergency measures, including shutting down the affected server and network, were taken to prevent the spread of the damage.","di":"not publicly disclosed","s":"Nidec Corporation, a large Japanese manufacturer, was targeted by the Blackfield ransomware gang, which demanded a $2 million ransom. The attack compromised the company's Taiwanese subsidiary, leading to emergency measures to contain the damage and a potential information leak, although no personal or confidential information has been confirmed leaked online.","src":["https://www.bleepingcomputer.com/news/security/blackfield-ransomware-asks-nidec-corporation-for-2-million-ransom/"]},{"v":"West Pharmaceutical Services, Inc.","g":"not publicly disclosed","d":"May 4, 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Manufacturing has been partially restarted; complete restoration of all systems has not yet been achieved.","di":"not publicly disclosed","s":"West Pharmaceutical Services experienced a cyberattack that involved data exfiltration and system encryption. The incident was detected on May 4, 2026, prompting the company to activate its incident response protocols and take systems offline globally. An investigation is ongoing to determine the full scope of the attack and the data affected.","src":["https://www.bleepingcomputer.com/news/security/west-pharmaceutical-says-hackers-stole-data-encrypted-systems/"]},{"v":"Foxconn","g":"Nitrogen","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The affected factories are currently resuming normal production.","di":"8 TB of data and more than 11 million documents stolen, including confidential instructions, projects, and drawings from major tech companies.","s":"Foxconn confirmed a cyberattack by the Nitrogen ransomware gang, which claimed to have stolen 8 TB of data. The attack affected some of Foxconn's North American factories, prompting the company to activate its cybersecurity response and implement measures to ensure production continuity.","src":["https://www.bleepingcomputer.com/news/security/electronics-giant-foxconn-confirms-cyberattack-on-north-american-factories/"]},{"v":"AkzoNobel","g":"Anubis","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"170GB of data, almost 170,000 files including confidential agreements, email addresses, phone numbers, private email correspondence, passport scans, material testing documents, and internal technical specification sheets","s":"AkzoNobel confirmed a cyberattack at one of its U.S. sites, where the Anubis ransomware gang leaked data after breaching the network. The company stated that the incident has been contained and the impact is limited, while the leaked data includes sensitive information such as client agreements and personal details.","src":["https://www.bleepingcomputer.com/news/security/paint-maker-giant-akzonobel-confirms-cyberattack-on-us-site/"]},{"v":"Sensata Technologies","g":"not publicly disclosed","d":"April 6, 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"temporarily impacted operations, including shipping, receiving, manufacturing production, and various other support functions","di":"data theft confirmed, specific files stolen not yet determined","s":"Sensata Technologies suffered a ransomware attack that encrypted parts of its network and disrupted operations. The attack involved data theft, and the company is currently investigating the extent of the stolen data while taking steps to restore impacted functions.","src":["https://www.bleepingcomputer.com/news/security/sensata-technologies-hit-by-ransomware-attack-impacting-operations/"]},{"v":"WK Kellogg Co","g":"Clop","d":"February 27, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"WK Kellogg Co disclosed a data breach linked to the Clop ransomware gang, revealing that company data was stolen during the Cleo data theft attacks. The breach involved unauthorized access to servers hosting employee files, with exposed data including names and social security numbers.","src":["https://www.bleepingcomputer.com/news/security/food-giant-wk-kellogg-discloses-data-breach-linked-to-clop-ransomware/"]},{"v":"Unimicron Technology","g":"Sarcoma","d":"January 30, 2024","c":"Taiwan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"377 GB of SQL files and documents","s":"Sarcoma ransomware has claimed a breach at Unimicron, a major PCB manufacturer in Taiwan, threatening to leak stolen data unless a ransom is paid. The attack, which occurred on January 30, 2024, has resulted in the exfiltration of significant data, although Unimicron has not confirmed a data breach.","src":["https://www.bleepingcomputer.com/news/security/sarcoma-ransomware-claims-breach-at-giant-pcb-maker-unimicron/"]},{"v":"Mizuno USA","g":"BianLian","d":"2024-10-29","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not disclosed","s":"Mizuno USA confirmed that unknown attackers stole files from its network between August and October 2024, including personal information of individuals. The BianLian ransomware gang claimed responsibility for the attack, stating they had stolen sensitive business and customer data.","src":["https://www.bleepingcomputer.com/news/security/mizuno-usa-says-hackers-stayed-in-its-network-for-two-months/"]},{"v":"Casio","g":"Underground","d":"October 5, 2024","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Most services have returned to normal operational status, though some services have not been recovered yet.","di":"8,500 individuals affected; includes personal data of employees (6,456), business partners (1,931), and customers (91).","s":"Casio experienced a ransomware attack on October 5, 2024, which exposed the personal data of approximately 8,500 individuals, primarily employees and business partners. The Underground ransomware gang claimed responsibility and threatened to disclose sensitive documents unless a ransom was paid, but Casio did not negotiate with the attackers and confirmed that no customer credit card information was compromised.","src":["https://www.bleepingcomputer.com/news/security/casio-says-data-of-8-500-people-exposed-in-october-ransomware-attack/"]},{"v":"Stoli Group","g":"not publicly disclosed","d":"August 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Full recovery not expected until early 2025","di":"not publicly disclosed","s":"Stoli Group's U.S. companies filed for bankruptcy following a ransomware attack in August 2024 that severely disrupted their IT systems, including their ERP platform. The attack forced manual operations across the group, affecting key processes such as accounting and preventing the subsidiaries from providing financial reports to lenders.","src":["https://www.bleepingcomputer.com/news/security/vodka-maker-stoli-files-for-bankruptcy-in-us-after-ransomware-attack/"]},{"v":"Kawasaki Motors Europe","g":"RansomHub","d":"September 5, 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"KME estimates that by the start of next week, 90% of its server infrastructure will have been restored.","di":"487 GB of data stolen; unclear if customer data is included.","s":"Kawasaki Motors Europe experienced a cyberattack attributed to the RansomHub ransomware gang, which threatened to leak 487 GB of stolen data. The company is currently recovering from the attack, having isolated its servers and collaborating with cybersecurity experts to cleanse its systems.","src":["https://www.bleepingcomputer.com/news/security/ransomhub-claims-kawasaki-cyberattack-threatens-to-leak-stolen-data/"]},{"v":"Microchip Technology Incorporated","g":"Play ransomware","d":"August 17, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Operations at multiple manufacturing facilities were affected, but systems are now back online and operations are substantially restored.","di":"Employee contact information and some encrypted and hashed passwords; no customer or supplier data identified as obtained.","s":"Microchip Technology confirmed that employee information was stolen in a cyberattack attributed to the Play ransomware gang. The attack, which occurred on August 17, impacted operations at multiple manufacturing facilities, but the company has since restored its IT systems and resumed processing customer orders.","src":["https://www.bleepingcomputer.com/news/security/microchip-technology-confirms-data-was-stolen-in-cyberattack/"]},{"v":"Keytronic","g":"Black Basta","d":"May 6, 2023","c":"United States","fin":"over $17 million","ran":"not publicly disclosed","dt":"shut down domestic and Mexico operations for two weeks","di":"not publicly disclosed","s":"Keytronic, an electronic manufacturing services provider, reported losses exceeding $17 million due to a ransomware attack detected on May 6, 2023. The attack, attributed to the Black Basta ransomware gang, resulted in the theft of personal information and significant operational disruptions at its facilities in the U.S. and Mexico.","src":["https://www.bleepingcomputer.com/news/security/keytronic-reports-losses-of-over-17-million-after-ransomware-attack/"]},{"v":"North American engineering firm","g":"Black Basta","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Ransomware gangs are exploiting a VMware ESXi authentication bypass vulnerability (CVE-2024-37085) to escalate privileges and deploy ransomware, including Black Basta. The vulnerability allows attackers to gain full administrative access to ESXi hypervisors, enabling them to steal sensitive data and encrypt the hypervisor's file system. The Storm-0506 group has been identified as deploying Black Basta ransomware in attacks on a North American engineering firm after exploiting this vulnerability.","src":["https://www.bleepingcomputer.com/news/microsoft/microsoft-ransomware-gangs-exploit-vmware-esxi-auth-bypass-in-attacks/"]},{"v":"Northern Minerals","g":"BianLian","d":"March 2024","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Northern Minerals, an Australian mining company, disclosed a cybersecurity breach where data was stolen and published on the dark web. The BianLian ransomware group claimed responsibility for the attack, which involved the exfiltration of corporate, operational, and financial information, as well as personal data of employees and shareholders.","src":["https://www.bleepingcomputer.com/news/security/australian-mining-company-discloses-breach-after-bianlian-leaks-data/"]},{"v":"OmniVision","g":"Cactus","d":"2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"OmniVision, a California-based imaging sensors manufacturer, suffered a ransomware attack by the Cactus group in 2023, resulting in the encryption of certain systems and a data breach. The attackers stole personal information and leaked various sensitive documents, but ultimately released all data they held for free.","src":["https://www.bleepingcomputer.com/news/security/omnivision-discloses-data-breach-after-2023-ransomware-attack/"]},{"v":"Nexperia","g":"Dark Angels","d":"March 2024","c":"Netherlands","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Nexperia shut down IT systems and launched an investigation to determine the scope of impact.","di":"1 TB of confidential data, including 371 GB of design and product data, 246 GB of engineering data, 96 GB of commercial and marketing data, 41.5 GB of corporate data, 109 GB of client and user data, and 121.1 GB of various files.","s":"Nexperia confirmed a data breach after the Dark Angels ransomware gang leaked samples of allegedly stolen data. The hackers claimed to have stolen 1 TB of confidential information and threatened to leak more if a ransom was not paid. The company has taken steps to contain the incident and is investigating the breach with third-party experts.","src":["https://www.bleepingcomputer.com/news/security/chipmaker-nexperia-confirms-breach-after-ransomware-gang-leaks-data/"]},{"v":"Hoya Corporation","g":"Hunters International","d":"","c":"Japan","fin":"not publicly disclosed","ran":"$10 million","dt":"Production and order processing impacted; IT outages experienced in several business divisions.","di":"1.7 million stolen files, amounting to 2 TB of data.","s":"Hoya Corporation was targeted by the Hunters International ransomware group, which demanded a $10 million ransom to prevent the release of stolen files. The cyberattack affected production and order processing, leading to IT outages across several divisions, while the company investigates the potential exfiltration of sensitive information.","src":["https://www.bleepingcomputer.com/news/security/optics-giant-hoya-hit-with-10-million-ransomware-demand/"]},{"v":"Nissan","g":"Akira","d":"December 2023","c":"Australia and New Zealand","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"100,000 individuals affected; includes personal employee information, NDAs, project data, and information on partners and clients; compromised government IDs include approximately 4,000 Medicare cards, 7,500 driver's licenses, 220 passports, and 1,300 tax file numbers","s":"Nissan Oceania confirmed a ransomware attack by the Akira group that exposed data of approximately 100,000 individuals. The stolen data includes personal information of current and former employees, as well as customers, with a significant portion of government identification compromised. Akira has leaked the stolen data on the dark web, prompting Nissan to offer support services to affected individuals.","src":["https://www.bleepingcomputer.com/news/security/nissan-confirms-ransomware-attack-exposed-data-of-100-000-people/"]},{"v":"Duvel Moortgat Brewery","g":"Stormous","d":"","c":"Belgium","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production was immediately stopped; it is not yet known when it could restart, but they hope to restart today or tomorrow.","di":"88 GB of data stolen; specific records or people affected not disclosed.","s":"Duvel Moortgat Brewery experienced a ransomware attack that halted beer production in its bottling facilities. The Stormous ransomware group claimed responsibility, stating they hold 88 GB of stolen data and threatened to leak it if a ransom isn't paid by March 25, 2024. Despite the attack, the brewery has enough stock to maintain distribution.","src":["https://www.bleepingcomputer.com/news/security/duvel-says-it-has-more-than-enough-beer-after-ransomware-attack/"]},{"v":"Hyundai Motor Europe","g":"Black Basta","d":"not publicly disclosed","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"3 terabytes of corporate data, including legal, sales, human resources, accounting, IT, and management data","s":"Hyundai Motor Europe suffered a ransomware attack by the Black Basta group, which claimed to have stolen three terabytes of corporate data. The company initially reported IT issues but later confirmed the cyberattack and is investigating the unauthorized access to its network.","src":["https://www.bleepingcomputer.com/news/security/hyundai-motor-europe-hit-by-black-basta-ransomware-attack/"]},{"v":"Nissan Australia","g":"Akira","d":"not publicly disclosed","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Nissan Australia is investigating a cyberattack that targeted its systems, potentially allowing hackers to access personal information. The attack has been claimed by the Akira ransomware gang.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-22nd-2023-blackcat-hacked/"]},{"v":"Austal USA","g":"Hunters International","d":"","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"no impact on operations","di":"not publicly disclosed","s":"Austal USA, a shipbuilding contractor for the U.S. Department of Defense, confirmed a cyberattack by the Hunters International group, which leaked some information as proof of the breach. The company is investigating the incident and has stated that no personal or classified information was accessed or taken by the threat actor.","src":["https://www.bleepingcomputer.com/news/security/navy-contractor-austal-usa-confirms-cyberattack-after-data-leak/"]},{"v":"Yanfeng","g":"Qilin","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"ranging from $25,000 to millions of dollars","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Qilin ransomware gang has developed a sophisticated Linux encryptor targeting VMware ESXi servers, allowing extensive customization for file encryption. The gang employs a double-extortion strategy, stealing data before encrypting files and demanding ransom from victims, including a recent attack on auto-parts giant Yanfeng.","src":["https://www.bleepingcomputer.com/news/security/linux-version-of-qilin-ransomware-focuses-on-vmware-esxi/"]},{"v":"Yanfeng Automotive Interiors","g":"Qilin","d":"","c":"China","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The main website was inaccessible until yesterday, when it returned online without any statements regarding the outage.","di":"multiple samples of financial documents, non-disclosure agreements, quotation files, technical data sheets, and internal reports","s":"The Qilin ransomware group claimed responsibility for a cyber attack on Yanfeng Automotive Interiors, a major automotive parts supplier. They threatened to release sensitive data unless a ransom is paid, impacting production at Stellantis due to the disruption caused by the attack.","src":["https://www.bleepingcomputer.com/news/security/qilin-ransomware-claims-attack-on-automotive-giant-yanfeng/"]},{"v":"Boeing","g":"LockBit","d":"October 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"43GB of data stolen","s":"Boeing was targeted by the LockBit ransomware gang, which exploited the Citrix Bleed vulnerability to gain access to its network. After refusing to pay the ransom, 43GB of data was leaked on the dark web. The incident highlights the ongoing threat posed by the exploitation of this vulnerability.","src":["https://www.bleepingcomputer.com/news/security/citrix-warns-admins-to-kill-netscaler-user-sessions-to-block-hackers/"]},{"v":"Kyocera AVX Components Corporation","g":"LockBit","d":"2023-03-30","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"temporary disruption of certain services","di":"39,111 individuals affected; personal information including full names and Social Security Numbers (SSNs)","s":"Kyocera AVX Components Corporation experienced a ransomware attack that impacted 39,111 individuals, exposing personal information. The attack was claimed by the LockBit ransomware gang, which published samples of the stolen data on their extortion portal, including sensitive documents and technical designs.","src":["https://www.bleepingcomputer.com/news/security/kyocera-avx-says-ransomware-attack-impacted-39-000-individuals/"]},{"v":"Seiko","g":"BlackCat/ALPHV","d":"July 28, 2023","c":"Japan","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"60,000 items of personal data including names, addresses, telephone numbers, email addresses, and employment information","s":"Seiko confirmed it suffered a ransomware attack by the Black Cat gang, leading to a data breach that exposed sensitive customer, partner, and personnel information. The investigation revealed that 60,000 items of personal data were compromised, including customer information and employment applications.","src":["https://www.bleepingcomputer.com/news/security/seiko-says-ransomware-attack-exposed-sensitive-customer-data/"]},{"v":"automotive supplier","g":"LockBit, Hive, ALPHV/BlackCat","d":"April 2022","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"An automotive supplier was breached three times within two months by LockBit, Hive, and ALPHV/BlackCat affiliates. The breaches involved multiple ransomware attacks that resulted in data encryption and significant operational disruption as the victim organization attempted to restore systems while facing simultaneous attacks.","src":["https://www.bleepingcomputer.com/news/security/fbi-dual-ransomware-attack-victims-now-get-hit-within-48-hours/"]},{"v":"Taiwan Semiconductor Manufacturing Company (TSMC)","g":"LockBit","d":"June 30th 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$70 million","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The LockBit ransomware gang demanded a $70 million ransom from TSMC, threatening to leak stolen data. TSMC denied being hacked, stating that the breach involved a third-party vendor.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-june-30th-2023-mistaken-identity/"]},{"v":"ABB","g":"Black Basta","d":"2023-05-07","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Operations disruption, project delays, and significant impact on factories; all remaining affected services and systems are now being restored.","di":"not publicly disclosed","s":"ABB confirmed a ransomware attack that impacted some of its systems and involved data theft. The Black Basta ransomware gang was identified as the attacker, and while the breach has been contained, ABB is working with law enforcement and advisors to mitigate the impact.","src":["https://www.bleepingcomputer.com/news/security/us-govt-contractor-abb-confirms-ransomware-attack-data-theft/"]},{"v":"Rheinmetall AG","g":"BlackBasta","d":"2023-04-14","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Rheinmetall AG, a German automotive and arms manufacturer, confirmed a ransomware attack by the BlackBasta group that impacted its civilian business. The attack was detected on April 14, 2023, and data samples claimed to be stolen include non-disclosure agreements, technical schematics, passport scans, and purchase orders.","src":["https://www.bleepingcomputer.com/news/security/arms-maker-rheinmetall-confirms-blackbasta-ransomware-attack/"]},{"v":"A10 Networks","g":"Play ransomware","d":"January 23, 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"lasted for a few hours before containment","di":"compromised data related to human resources, finance, and legal functions; includes technical documentation, employee and client documents, agreements, and personal data","s":"A10 Networks confirmed a data breach following a Play ransomware attack that occurred on January 23, 2023. The attackers gained access to shared drives and compromised sensitive data, threatening to leak the stolen files. The company has contained the attack and does not expect a material impact on its operations.","src":["https://www.bleepingcomputer.com/news/security/a10-networks-confirms-data-breach-after-play-ransomware-attack/"]},{"v":"Canadian Copper Mountain Mining Corporation","g":"not publicly disclosed","d":"2022-12-27","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The mill was shut down as a preventative measure while other processes switched to manual operations.","di":"not publicly disclosed","s":"The Canadian Copper Mountain Mining Corporation experienced a ransomware attack that led to the shutdown of its mill and impacted operations. The company quickly implemented risk management protocols and isolated infected systems while investigating the source of the attack and working with authorities.","src":["https://www.bleepingcomputer.com/news/security/canadian-mining-firm-shuts-down-mill-after-ransomware-attack/"]},{"v":"Bombardier Recreational Products (BRP)","g":"RansomEXX","d":"August 8, 2022","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Production resumed at four manufacturing sites in Canada, Finland, the U.S., and Austria by August 15, 2022, with the rest expected to follow by the end of that week.","di":"29.9GB of files allegedly stolen, including non-disclosure agreements, passports and IDs, material supply agreements, and contract renewals; no sensitive customer data reported affected.","s":"RansomEXX claimed responsibility for a ransomware attack on Bombardier Recreational Products, leading to a temporary halt in operations and production delays. The gang leaked 29.9GB of files, which included various internal documents but reportedly did not affect sensitive customer data.","src":["https://www.bleepingcomputer.com/news/security/ransomexx-claims-ransomware-attack-on-sea-doo-ski-doo-maker/"]},{"v":"Semikron","g":"LV Ransomware","d":"","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The entire network is currently being studied and adjusted forensic. The company is working on restoring the working ability to minimize disruptions for employees, customers, and contractual partners.","di":"2TB worth of documents allegedly stolen","s":"Semikron, a German semiconductor manufacturer, was hit by an LV ransomware attack that partially encrypted its network. The attackers claimed to have stolen data and are blackmailing the company with threats to leak the information. Semikron is currently investigating the claims and working with authorities to restore its systems.","src":["https://www.bleepingcomputer.com/news/security/semiconductor-manufacturer-semikron-hit-by-lv-ransomware-attack/"]},{"v":"TB Kawashima","g":"LockBit","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company's website is currently down, but production and sales activities have not been impacted and are running at normal parameters.","di":"not publicly disclosed","s":"TB Kawashima, an automotive fabric supplier, announced a cyberattack believed to be from the LockBit ransomware group. The group claimed to have stolen data from the company and has begun leaking it on their data leak site.","src":["https://www.bleepingcomputer.com/news/security/automotive-fabric-supplier-tb-kawashima-announces-cyberattack/"]},{"v":"Nichirin-Flex U.S.A","g":"not publicly disclosed","d":"2022-06-14","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The company took the network offline and moved operations into manual mode. System recovery has been prioritized to resume business operations.","di":"not publicly disclosed","s":"Nichirin-Flex U.S.A, a subsidiary of the Japanese automotive hose maker Nichirin, was hit by a ransomware attack on June 14, 2022, causing significant disruptions in product distribution and order fulfillment. The company is investigating the unauthorized access and has temporarily taken down its website while prioritizing system recovery.","src":["https://www.bleepingcomputer.com/news/security/automotive-hose-maker-nichirin-hit-by-ransomware-attack/"]}],"stats":[{"m":"Manufacturing as share of ransomware attacks (industry rank)","v":"Manufacturing was the most-targeted sector globally for the 5th consecutive year in 2025; ~1 in 4 attacks (roughly 25%) hit manufacturing per one industry tracker, with incidents rising from 937 (2024) to 1,466 (2025), a 56% increase","s":"Industrial Cyber / cyber-insurance industry report roundup, citing 2025 ransomware tracking data","u":"https://industrialcyber.co/reports/global-ransomware-attacks-rose-32-in-2025-as-manufacturers-emerged-as-top-target/"},{"m":"Manufacturing ransomware incident growth (alternate count)","v":"Ransomware attacks against manufacturing rose from 520 to 838 incidents, a 61% year-over-year increase","s":"Industrial Cyber, citing 2025 threat intelligence report","u":"https://industrialcyber.co/manufacturing/manufacturing-absorbs-56-ransomware-surge-of-global-attacks-in-2025-as-raas-legacy-ot-supply-chains-fuel-spike/"},{"m":"Average ransom demand, manufacturing","v":"Rose from $523,000 to $1.16 million year-over-year (per one 2025 tracker); Sophos separately reports average ransom demand of $1.2M in 2025 (down 20% from $1.5M in 2024)","s":"Industrial Cyber (tracker) and Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Median attack cost / ransom payment, manufacturing","v":"Median attack cost ~$500,000 (excluding longer-term operational losses, per tracker); Sophos: median ransom paid $1.0 million in 2025 (down from $1.2M average demand), average payment $1.0M (down from $1.2M in 2024)","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Rate of ransom payment among affected manufacturers","v":"51% of manufacturing organizations with encrypted data paid the ransom in 2025 (Sophos); Coveware separately reported manufacturing had the highest payment rate of any sector in 2024 at 62%, driven by pressure to avoid operational downtime","s":"Sophos 2025 and Coveware 2024/2025 quarterly reports","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Rate of successful encryption vs. attack disruption","v":"40% of attacks on manufacturers resulted in data encryption in 2025 (lowest in 5 years, down from 74% in 2024); 50% of manufacturers stopped the attack before encryption (up from 24% the prior year)","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Mean recovery cost (excluding ransom paid), manufacturing","v":"$1.3 million in 2025, down ~24% from $1.7 million in 2024","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Root causes of manufacturing ransomware incidents","v":"Exploited vulnerabilities are the leading root cause (32% of incidents); lack of in-house expertise to detect/stop attacks cited by 42.5% of victims","s":"Sophos State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Dominant threat actor groups against manufacturing (2025)","v":"Akira, Qilin, and Play identified as the three most active ransomware groups targeting manufacturing/production organizations","s":"Sophos X-Ops, State of Ransomware in Manufacturing and Production 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025"},{"m":"Average total cost of a data breach, industrial sector","v":"$5.56 million (2024 IBM report figure); ~$5M cited in some 2025 summaries. Time to identify/contain a breach: 199 days to identify, 73 days to contain (above the 194/64-day global average)","s":"IBM Cost of a Data Breach Report (2024/2025 industrial sector analysis)","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-industrial-sector"},{"m":"Cost of unplanned manufacturing downtime","v":"Unplanned downtime from ransomware can cost up to $125,000 per hour in manufacturing environments","s":"IBM Cost of a Data Breach industrial sector analysis","u":"https://www.ibm.com/think/insights/cost-of-a-data-breach-industrial-sector"},{"m":"Coveware overall average/median ransom payment trend (all sectors, Q4 2025, for context)","v":"Q4 2025 average ransom payment $591,988 (up 57% QoQ); median ransom payment $325,000 (up 132% QoQ). Q3 2025 average was ~$377,000, median $140,000","s":"Coveware Quarterly Ransomware Report, Q3-Q4 2025","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"ransomware.live Manufacturing sector victim count (this pull)","v":"4,434 total victim/leak-site postings tagged \"Manufacturing\" as of 2026-07-20; top groups by posting volume: Akira (363), LockBit3 (323), Qilin (303), Play (263), Black Basta (148), LockBit2 (145), Clop (142), ALPHV/BlackCat (112); top countries: US (1,370), Germany (249), Canada (164), UK (134), Italy (134); year-over-year posting counts show sharp growth: 2021=295, 2022=511, 2023=880, 2024=816, 2025=1,204, 2026 YTD=668","s":"ransomware.live API v2 (/v2/sectorvictims/Manufacturing), direct pull","u":"https://api.ransomware.live/v2/sectorvictims/Manufacturing"}]},{"name":"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade","tag":"Business Services","overview":"This composite industry group spans consultancies, IT/managed services, law and accounting firms, engineering firms, staffing and BPO providers, travel management companies, commercial real estate services, and wholesale/logistics distributors. Ransomware.live's 'Business Services' sector tag is one of the most heavily populated on the platform, logging dozens of new claimed victims per week in mid-2026, with RaaS/extortion groups Qilin, DragonForce, INC Ransom, TheGentlemen, Akira, RansomHouse, Deadlock, and data-extortion crews like ShinyHunters posting new victims almost daily. The sector's risk profile is distinctive because these firms sit at a structural chokepoint: (1) they hold sensitive, often privileged or regulated client/third-party data (legal, financial, M&A, PII) that amplifies extortion leverage; (2) many are themselves suppliers/vendors (MSPs, SAP integrators, BPOs, staffing firms, travel managers) whose compromise cascades into downstream client organizations, making them attractive 'one-to-many' targets; and (3) wholesale trade/logistics operations depend on time-sensitive order, warehouse, and freight systems where even short outages create cascading supply-chain and revenue impact. Reported financial impact ranges enormously by incident type - from multi-hundred-million-dollar remediation and litigation costs at large diversified BPOs (Conduent) and IT consultancies (Cognizant, Sopra Steria) down to smaller professional firms where impact is mostly data-exposure/breach-notification driven rather than large ransom payments. Across the sector, exfiltration-only and SaaS/CRM (e.g., Salesforce) compromise via vishing/social engineering has become as common a threat vector as classic file-encryption ransomware.","distinct":"One of the most heavily populated leak-site categories, logging dozens of new claimed victims weekly in mid-2026. Spans consultancies, MSPs, law and accounting firms, engineering, staffing/BPO, commercial real estate and wholesale distribution. The defining feature is custodianship of other organizations' confidential material: privileged legal files, audit workpapers, M&A data and client PII. A single firm's breach becomes many clients' breach, and MSPs within this group double as an access path into downstream victims.","leverage":"Confidentiality of privileged and client-owned data, with professional-liability, contractual and regulatory consequence flowing to clients rather than only the insured.","tolerance":"Moderate to high. Days to weeks for most advisory work; wholesale/logistics sub-segments are materially tighter due to order and fulfilment obligations.","bulk":{"total":5209,"years":{"2019":2,"2020":15,"2021":266,"2022":452,"2023":952,"2024":1740,"2025":978,"2026":803},"groups":[["lockbit3",415],["akira",330],["qilin",276],["play",221],["ransomhub",213],["clop",190],["incransom",166],["alphv",162]],"countries":[["US",1970],["GB",262],["CA",209],["DE",152],["FR",131],["AU",112]],"pressPct":3,"ransomPct":0},"incidents":[{"v":"Cognizant Technology Solutions","g":"Maze","d":"2020-04-18 (attack); recovery through Q2 2020","c":"United States (global operations)","fin":"Cognizant CFO disclosed in a Q1 2020 SEC filing / earnings call that the incident would cost the company an estimated $50 million to $70 million in Q2 2020, covering investigation, containment, remediation, legal fees, and security investment (not counting potential lost revenue).","ran":"Not publicly disclosed whether a ransom was demanded of a specific dollar figure or paid.","dt":"Multi-week disruption to internal systems and client-facing services during April-May 2020; full remediation cost/timeline tracked into Q2 2020 earnings.","di":"Some client and employee data reported affected; full scope not publicly quantified in detail.","s":"IT consulting/professional services giant hit by Maze ransomware; internal systems encrypted, disrupting service delivery to client accounts and forcing Cognizant to advise clients to disconnect from Cognizant-managed connections.","src":["https://www.computerweekly.com/news/252482950/Maze-ransomware-attack-will-cost-Cognizant-at-least-50m-to-70m","https://www.ciodive.com/news/cognizant-maze-ransomware/577677/","https://www.secureworld.io/industry-news/cognizant-ceo-on-ransomware-attack-cost-impact"]},{"v":"Accenture","g":"LockBit 2.0","d":"2021-08-11","c":"Ireland (global professional/IT services)","fin":"No specific dollar loss figure was ever disclosed by Accenture; the company confirmed in its Q4/full-year FY2021 financial report (Oct 18, 2021) that data was encrypted and stolen, without quantifying cost.","ran":"LockBit demanded $50 million; Accenture has not confirmed paying any ransom.","dt":"Accenture stated it restored affected systems from backups and reported no material impact to its own operations, though exact downtime duration was not disclosed.","di":"Attackers claimed 6TB of data stolen; roughly 2,000+ files were leaked publicly on the dark web, including internal presentations and client case studies.","s":"LockBit 2.0 claimed to have stolen roughly 6 terabytes of data from Accenture, a top-tier global consulting/IT services firm, and demanded ransom, later publishing files including PowerPoint decks and case studies when payment was not made public.","src":["https://www.bleepingcomputer.com/news/security/accenture-confirms-data-breach-after-august-ransomware-attack/","https://www.securityweek.com/accenture-confirms-data-stolen-ransomware-attack/","https://www.infosecurity-magazine.com/news/accenture-tied-up-in-50m-ransom/"]},{"v":"CWT (Carlson Wagonlit Travel)","g":"Ragnar Locker","d":"2020-07-27","c":"United States (global travel management/business services)","fin":"Direct incident cost beyond the ransom payment not separately disclosed; company cited COVID-19-driven financial strain as a factor in negotiating the ransom down.","ran":"Initial demand of $10 million negotiated down to a paid ransom of $4.5 million (414 BTC), received by attackers July 28, 2020.","dt":"Approximately 30,000 CWT computers were knocked offline; systems were restored following payment, exact full-recovery timeline not publicly detailed.","di":"Attackers claimed to have exfiltrated 2 terabytes of files including financial reports, security documents, and employee personal data (email addresses, salary data).","s":"The world's fifth-largest business travel management company had roughly 30,000 computers taken offline; attackers initially demanded $10 million, citing COVID-19 financial pressure in negotiations.","src":["https://siliconangle.com/2020/08/02/travel-management-company-cwt-hands-4-5m-following-ransomware-attack/","https://www.darkreading.com/cyberattacks-data-breaches/travel-management-firm-cwt-pays-4-5m-to-ransomware-attackers","https://www.theregister.com/2020/07/31/carlson_wagonlit_travel_ragnarlocker_ransom_paid/"]},{"v":"Sopra Steria","g":"Ryuk (new variant)","d":"2020-10-20","c":"France (European IT/professional services)","fin":"Company estimated the negative impact on gross operating margin at between EUR40 million and EUR50 million (roughly $48M-$60M), of which approximately EUR30 million was expected to be covered by cyber insurance.","ran":"Not publicly disclosed; no confirmation Sopra Steria paid a ransom.","dt":"Attack occurred the evening of Oct 20, 2020; company reported 'differing levels of unavailability' of systems persisting for weeks afterward, driving the bulk of the cost.","di":"Limited public detail on records/data types exposed beyond internal systems disruption.","s":"Major French IT services firm hit by a then-new version of Ryuk ransomware, causing extended unavailability across parts of its network and requiring extensive remediation.","src":["https://www.bleepingcomputer.com/news/security/sopra-steria-expects-50-million-loss-after-ryuk-ransomware-attack/","https://www.theregister.com/2020/11/25/sopra_steria_ransomware_damage_50m_euros/","https://www.securityweek.com/financial-impact-ransomware-attack-sopra-steria-could-reach-50-million/"]},{"v":"Toll Group","g":"Nefilim (second attack); earlier 2020 attack attributed to a different ransomware family","d":"2020-01-31 (first attack) and 2020-05-05 (second attack)","c":"Australia (global freight/logistics - wholesale trade)","fin":"No specific total dollar cost figure was publicly disclosed for either incident; company acknowledged 'financial and reputational consequences' without quantifying them.","ran":"Not publicly disclosed; Toll Group publicly stated it would not pay the ransom, and Nefilim subsequently leaked stolen data.","dt":"The May 2020 attack disrupted the MyToll customer portal and back-office systems for approximately six days; freight shipments were largely unaffected but parcel/portal services were degraded.","di":"Exfiltrated data included commercial agreements with current and former enterprise customers and employee personal data from at least one compromised server.","s":"Global freight and logistics provider (1,200+ locations, 50 countries) was hit by ransomware twice in the same year; the May attack used Nefilim and led to exfiltration of commercial and employee data after Toll refused to pay.","src":["https://www.bleepingcomputer.com/news/security/toll-group-hit-by-ransomware-a-second-time-deliveries-affected/","https://www.itnews.com.au/news/toll-groups-corporate-data-stolen-by-attackers-548033","https://www.securitymagazine.com/articles/92334-toll-group-suffers-ransomware-attack-again"]},{"v":"Estes Express Lines","g":"LockBit","d":"2023-09-26 (network access); ransomware deployed and discovered Oct 1, 2023","c":"United States (trucking/freight - wholesale trade logistics)","fin":"No specific total incident cost publicly disclosed; company faced a class-action lawsuit over the breach.","ran":"Amount not publicly disclosed; Estes confirmed it did not pay the ransom.","dt":"Forensic investigation concluded Nov 7, 2023; breach notification letters were not sent to affected individuals until December 2023 (roughly 2.5 months after discovery), pending law enforcement investigation.","di":"Personal information of more than 21,000 individuals exposed, including names and Social Security numbers; data published on LockBit's leak site Nov 13, 2023.","s":"Major U.S. trucking/freight carrier had data stolen and ransomware deployed; LockBit claimed responsibility in November 2023 and published the stolen data after Estes refused to pay, following FBI/regulator guidance.","src":["https://www.securityweek.com/estes-express-lines-says-personal-data-stolen-in-ransomware-attack/","https://www.truckingdive.com/news/estes-express-lines-cyberattack-social-security-numbers-update/703427/","https://www.theregister.com/2024/01/03/estes_ransomware/"]},{"v":"Conduent Business Services, LLC","g":"SafePay (claimed the leak-site listing, later removed - suggesting ransom payment)","d":"Unauthorized access Oct 21, 2024 - Jan 13, 2025 (discovered); publicly disclosed April 2025","c":"United States (government/BPO professional services contractor)","fin":"Company disclosed in SEC 8-K filings that it incurred approximately $9 million in breach-response costs with the expectation of spending a further $16 million by Q1 2026; total related expenses (including likely settlements) estimated to exceed $50 million.","ran":"SafePay claimed theft of ~8.5 terabytes of data and listed Conduent on its leak site, then removed the listing - widely interpreted as evidence a ransom was paid, though Conduent has not confirmed a payment or amount.","dt":"Breach window spanned nearly 3 months (Oct 2024-Jan 2025) before detection; public notification did not begin until October 2025, roughly 9 months after discovery.","di":"Affected individual count grew from an initial ~10.5 million to 25.5 million (Feb 2026) to 62.2 million by June 2026; data types included names, Social Security numbers, addresses, medical histories, and health insurance details. Nearly a dozen class-action lawsuits and multi-state enforcement actions followed.","s":"Major business-process-outsourcing/government-services contractor (payments, healthcare claims, back-office processing) suffered one of the largest reported U.S. breaches of 2025, with the scope of affected individuals repeatedly revised upward over the year.","src":["https://securityboulevard.com/2025/11/conduent-faces-financial-hit-lawsuits-from-breach-affecting-10-5-million/","https://www.hipaajournal.com/conduent-business-solutions-data-breach/","https://cyberpress.org/conduent-data-breach-steals-8-tb/","https://www.cpomagazine.com/cyber-security/data-breach-at-government-contractor-conduent-sparks-nearly-a-dozen-class-action-lawsuits/"]},{"v":"Cushman & Wakefield","g":"ShinyHunters (vishing/Salesforce data theft) and Qilin (separate, coincidentally-timed claim)","d":"2026-05-03 to 2026-05-05 (confirmed)","c":"United States / global (commercial real estate services)","fin":"Not publicly disclosed as of this research; company has not released cost estimates. A shareholder/customer lawsuit has been filed over the breach.","ran":"ShinyHunters demanded an undisclosed ransom with a deadline of May 6, 2026, threatening to leak data; when negotiations reportedly stalled, the group published a 50GB dataset. No confirmation Cushman & Wakefield paid.","dt":"Company described the incident as 'limited' in scope; no significant operational downtime was publicly reported, consistent with a SaaS/CRM data-theft (non-encryption) incident rather than an operational-technology outage.","di":"Over 500,000 Salesforce records containing PII and internal corporate/client data claimed stolen; illustrates third-party/SaaS supply-chain exposure distinct from traditional on-prem ransomware.","s":"One of the world's largest commercial real estate services firms confirmed a 'limited' breach originating from a vishing (voice phishing) social-engineering attack that gave ShinyHunters access to its Salesforce CRM environment; Qilin separately listed the company on its ransomware leak site around the same time.","src":["https://www.theregister.com/security/2026/05/05/cushman-wakefield-confirms-vishing-cyberattack/5228718","https://cybernews.com/news/cushman-wakefield-shinyhunters-salesforce-breach-claim/","https://www.cyberdaily.au/security/13553-real-estate-giant-cushman-wakefield-confirms-cyber-incident-qilin-and-shinyhunters-claim-attack","https://www.credaily.com/briefs/cushman-wakefield-faces-lawsuit-after-data-breach/"]},{"v":"multi-billion-dollar American defense contractor and IT services provider","g":"Kyber","d":"March 2026","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Kyber ransomware gang has targeted Windows systems and VMware ESXi endpoints, deploying two distinct variants in March 2026. The attack involved encrypting files and defacing management interfaces, with claims of using post-quantum encryption that were found to be misleading. A multi-billion-dollar American defense contractor was identified as a victim on the Kyber data extortion portal.","src":["https://www.bleepingcomputer.com/news/security/kyber-ransomware-gang-toys-with-post-quantum-encryption-on-windows/"]},{"v":"State Bar of Texas","g":"INC ransomware","d":"2025-02-12","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The State Bar of Texas reported a data breach after the INC ransomware gang claimed to have attacked the organization and leaked samples of stolen data. The breach occurred between January 28 and February 9, 2025, and was discovered on February 12, 2025, with the gang adding the organization to its dark web extortion page on March 9, 2025.","src":["https://www.bleepingcomputer.com/news/security/texas-state-bar-warns-of-data-breach-after-inc-ransomware-claims-attack/"]},{"v":"CannonDesign","g":"Avos Locker","d":"January 25, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"13,000 current and former employees; names, addresses, social security numbers, driver s license numbers","s":"CannonDesign experienced a data breach due to an Avos Locker ransomware attack, which resulted in the theft of sensitive data from over 13,000 employees. The breach was discovered on January 25, 2023, and involved unauthorized access and data exfiltration, with the stolen data later published online by various groups.","src":["https://www.bleepingcomputer.com/news/security/cannondesign-confirms-avos-locker-ransomware-data-breach/"]},{"v":"Fidelity National Financial","g":"BlackCat","d":"2023-11-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The breach was contained seven days later, with certain IT systems taken offline during containment measures.","di":"Data of 1.3 million customers was stolen.","s":"Fidelity National Financial confirmed a cyberattack on November 19, 2023, claimed by the BlackCat ransomware gang, which exposed the data of 1.3 million customers. The attackers accessed the network using stolen credentials and deployed non-propagating malware to exfiltrate data. The breach was contained within a week, and the company is providing support services to affected customers.","src":["https://www.bleepingcomputer.com/news/security/fidelity-national-financial-hackers-stole-data-of-13-million-people/"]},{"v":"PWC","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Clop ransomware gang has begun leaking data stolen during the MOVEit Transfer attacks on clearweb sites, following a tactic previously used by the ALPHV gang. They created websites for various companies, including PWC, to pressure victims into paying ransom by making stolen data publicly accessible.","src":["https://www.bleepingcomputer.com/news/security/clop-now-leaks-data-stolen-in-moveit-attacks-on-clearweb-sites/"]},{"v":"HWL Ebsworth","g":"ALPHV","d":"April 2023","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1.45 terabytes of data containing over a million documents","s":"HWL Ebsworth, a major Australian law firm, was targeted by the ALPHV ransomware gang, which leaked data they claim was stolen from the firm. The firm has refused to meet the extortion demands, emphasizing their commitment to ethical standards and the privacy of their clients.","src":["https://www.bleepingcomputer.com/news/security/blackcat-ransomware-fails-to-extort-australian-commercial-law-giant/"]},{"v":"Capita","g":"Black Basta","d":"March 22, 2023","c":"United Kingdom","fin":"up to 20 million","ran":"not publicly disclosed","dt":"Capita experienced a weekend-long outage due to the cyberattack, with the breach discovered on March 31.","di":"approximately 470,000 members' personal information including names, dates of birth, National Insurance numbers, and USS member numbers","s":"Capita, a business process outsourcing firm, warned customers to assume their data was stolen following a cyberattack in early April. The Black Basta ransomware gang claimed to have stolen sensitive data, including personal bank account details and passport scans, affecting over 500,000 members of the Universities Superannuation Scheme.","src":["https://www.bleepingcomputer.com/news/security/capita-warns-customers-they-should-assume-data-was-stolen/"]},{"v":"NCR","g":"BlackCat/ALPHV","d":"April 15th 2023","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"NCR suffered an outage on its Aloha point of sale platform after being hit by a ransomware attack claimed by the BlackCat/ALPHV gang. This incident highlights the ongoing threat of ransomware targeting critical business operations.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-april-21st-2023-macs-in-the-crosshairs/"]},{"v":"real estate company","g":"Trigona","d":"not publicly disclosed","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Trigona ransomware operation has been active since late October 2022, utilizing a new Tor negotiation site for ransom payments in Monero. Victims, including a real estate company, have been targeted with file encryption and ransom notes, although the exact ransom amounts and data theft claims remain unverified.","src":["https://www.bleepingcomputer.com/news/security/trigona-ransomware-spotted-in-increasing-attacks-worldwide/"]}],"stats":[{"m":"Global median ransom payment (2025)","v":"$1,000,000 (down ~50% from $2,000,000 in 2024)","s":"Sophos, The State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Average ransom payment, Q2 2025","v":"$1.13 million (up 104% from Q1 2025); median $400,000 (up 100% QoQ)","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://blocksandfiles.com/2025/08/13/coveware-charts-rise-of-data-exfiltration/"},{"m":"Share of ransomware victims that pay","v":"26% (Coveware Q2 2025); professional services, manufacturing, and healthcare rank among the most-targeted sectors","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://www.veeam.com/company/press-release/coveware-by-veeam-reveals-q2-2025-ransomware-surge-social-engineering-and-data-exfiltration-drive-record-payouts.html"},{"m":"Cases involving data exfiltration (vs. encryption-only)","v":"74% of ransomware cases in Q2 2025 involved exfiltration","s":"Coveware Quarterly Ransomware Report, Q2 2025","u":"https://blocksandfiles.com/2025/08/13/coveware-charts-rise-of-data-exfiltration/"},{"m":"Global average total cost of a data breach (2025)","v":"$4.44 million (down from $4.88 million in 2024); Technology sector average $4.79 million, Industrial sector average $5.00 million (closest published proxies to professional/technical services - IBM does not break out a standalone 'professional services' category)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Ransomware presence in confirmed breaches (2025 dataset)","v":"Ransomware present in 44% of breaches overall; median ransom payout $115,000; 64% of victims refused to pay","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/Tea/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Breaches involving a third party","v":"30% of all breaches involved a third party in 2025, double the prior year's 15% - directly relevant to this sector's MSP/BPO/vendor exposure","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/Tea/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"SMB breaches with a ransomware component","v":"88% of breaches involving small/medium businesses contained a ransomware component in the 2025 dataset - relevant given the long tail of small professional-services and wholesale firms in this sector","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/infographics/2025-dbir-smb-snapshot.pdf"},{"m":"Total on-chain ransomware payments, 2025","v":"Approximately $820 million globally (down ~8% YoY), though the figure was expected to rise toward $900M as more incidents are later attributed","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Share of ransomware incidents where ransom is paid (2025)","v":"Approximately 28%, a record low, even as claimed victim counts rose roughly 50% YoY","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com/blog/crypto-ransomware-2026/"},{"m":"Median individual ransom demand growth, 2025","v":"Grew 368% year-over-year to nearly $60,000","s":"Chainalysis 2026 Crypto Crime Report","u":"https://www.chainalysis.com
