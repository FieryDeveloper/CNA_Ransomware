veware.com/ransomware-quarterly-reports"},{"m":"Third-party/supply-chain breach share (all industries)","v":"Third-party involvement rose to 30% of all breaches in 2025 (doubling from prior year), directly relevant to transportation/logistics given reliance on TMS/ELD/freight-forwarding software vendors","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-executive-summary.pdf"},{"m":"Data encryption rate in successful attacks (cross-industry, useful baseline)","v":"Percentage of ransomware attacks resulting in actual data encryption fell from 70% (2024) to 50% (2025), with extortion-only (no encryption) attacks rising to 10% from 3%, reflecting a broader shift toward pure data-theft extortion also seen in logistics incidents (e.g., JAS Worldwide, Estes)","s":"Sophos State of Ransomware 2025","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-2025"},{"m":"Global ransomware attack volume, 2025 vs 2024","v":"7,419 ransomware attacks recorded globally in 2025, a 32% increase over 5,631 in 2024","s":"Comparitech Worldwide Ransomware Roundup: 2025 End-of-Year Report","u":"https://www.comparitech.com/news/worldwide-ransomware-roundup-2025-end-of-year-report/"},{"m":"Ransomware.live tracked victim volume, Transportation/Logistics sector","v":"500+ individually tracked victim postings across the Transportation/Logistics sector tag on ransomware.live as of July 2026, spanning dozens of ransomware groups (Thegentlemen, Akira, Qilin, Deadlock, Ailock, Arcusmedia, Safepay, Chaos, Cry0, Krybit, and others) and 20+ countries in just the most recent weeks of listings observed","s":"ransomware.live sector activity feed (Transportation/Logistics)","u":"https://www.ransomware.live/activity/Transportation-Logistics"}]}],"hazards":[{"key":"initial access vectors","name":"Initial Access Vectors","fam":"Initial Access","desc":"How attackers first get in; retail/consumer-services shows a disproportionate reliance on social-engineering of people and processes rather than pure technical exploitation, reflecting large, distributed, high-turnover workforces and heavy reliance on outsourced IT support.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Initial access vectors","subs":["Help-desk / call-center social engineering and vishing to reset MFA or credentials (Scattered Spider-style attacks on MGM, Caesars)","Phishing and callback phishing (e.g., Silent Ransom Group-style tactics)","Compromised or purchased credentials, often sourced via infostealer malware from employee or third-party devices","Exploitation of internet-facing PMS, booking, or POS software vulnerabilities","Compromise of third-party IT support/managed service providers with privileged remote access","Compromise via franchise/partner networks with shared or federated access to corporate systems"]},"Agriculture, Forestry, Fishing and Food Production":{"raw":"Initial Access Vectors","subs":["Phishing / business email compromise targeting procurement, logistics and finance staff (single-click compromise, as in the Ahold Delhaize USA breach)","Exploitation of internet-facing/edge devices and unpatched VPNs, RDP and firewalls at remote farms, elevators, plants and cold-storage sites","Mass-exploitation of zero-day/managed-file-transfer and enterprise software vulnerabilities (Cl0p-style campaigns against the sector)","Valid/stolen credentials sourced from infostealer logs (ransomware.live records infostealer-linked exposure for many food/ag domains)","Compromise of third-party IT/OT integrators, MSPs, ag-tech SaaS and remote maintenance access into plant networks","Weak segmentation between corporate IT and plant OT allowing lateral movement from an office foothold into production"]},"Construction":{"raw":"Initial Access Vectors","subs":["Phishing/BEC targeting project managers, estimators and accounts-payable staff (construction's high-value, milestone-based subcontractor and supplier payments make it a prime invoice-fraud/BEC target, often paired with or following a ransomware intrusion)","Exploited perimeter and file-transfer/ERP vulnerabilities in widely-used enterprise software (e.g., Clop's 2025 Oracle E-Business Suite CVE-2025-61882 zero-day campaign hit multiple construction firms, including Bechtel and Kier, within days of each other)","Compromised VPN/RDP credentials, including access issued to jobsite trailers and temporary site networks with weaker controls than corporate HQ","Infostealer-harvested credentials from employee and third-party devices (Ferrovial's July 2026 AiLock incident was linked to over 100 compromised employee and third-party credential sets surfaced via infostealer telemetry)","Compromised or over-privileged subcontractor/vendor remote-access accounts on shared project extranets"]},"Energy and Utilities":{"raw":"Initial Access Vectors","subs":["Stolen/compromised credentials (IBM: #1 vector at 16%; e.g., Conpet infostealer on an IT admin's personal device)","Infostealer malware harvesting VPN/WSUS/RDP credentials from employee or contractor devices","Internet-facing VPN, firewall, and remote-access appliance exploitation (Fortinet/Citrix/Ivanti-class edge devices)","Phishing / business email compromise (energy/utilities are hit harder by email-borne attacks than most sectors)","Abuse of legitimate internal infrastructure (e.g., WSUS/patch-management to push a malicious 'fake update' at Conpet)","Exploitation of unpatched internet-facing enterprise apps and public-facing customer/billing portals","Third-party/vendor and MSP remote-access compromise"]},"Finance and Insurance":{"raw":"Initial Access Vectors","subs":["Exploitation of internet-facing remote-access appliances (e.g., Citrix NetScaler CVE-2023-4966/4967 in the ICBC incident)","Phishing and malicious links leading to credential/endpoint compromise (e.g., Evolve Bank & Trust employee click)","Stolen/leaked credentials sourced from infostealer logs (54% of ransomware victims per 2025 Verizon DBIR had prior credential exposure)","Compromise via a shared/downstream vendor rather than the institution's own perimeter (Frost/Citizens shared vendor; Deutsche Bank marketing-platform vendor)","Exploitation of unpatched known CVEs in edge/VPN infrastructure","Business email compromise as a precursor to ransomware deployment"]},"Healthcare and Social Assistance":{"raw":"Initial Access Vectors","subs":["Exploitation of unpatched, internet-facing VPN/remote-access appliances and edge devices (a leading Verizon DBIR-cited vector for healthcare breaches, up sharply year over year)","Compromised or purchased VPN/RDP/Citrix credentials, including credentials harvested by infostealer malware from employee or third-party devices (ransomware.live 'infostealer' telemetry shows large stealer-log exposure tied to healthcare victims, e.g. Medibank)","Phishing and business-email-compromise targeting clinical, billing, and admin staff","Compromise of managed service providers (MSPs), IT vendors, and EHR/practice-management software resellers who hold privileged access across many small provider networks","Exploitation of vulnerabilities in widely-deployed healthcare-adjacent software (file-transfer tools, VoIP/telehealth platforms, backup software) as mass 'one-to-many' entry points","Insider-enabled access or credential sale by disgruntled or compromised employees/contractors"]},"Information Technology":{"raw":"Initial Access Vectors","subs":["Exploitation of internet-facing/VPN and edge appliances (e.g., Palo Alto GlobalProtect at Ingram Micro, Fortinet/Citrix, Microsoft Exchange as used against Acer)","Exploitation of managed file transfer / edge software (MOVEit, GoAnywhere, Accellion) for mass exfiltration","Leaked or purchased credentials and infostealer logs (initial-access-broker marketplaces)","Abuse of remote monitoring & management (RMM) and remote-access tooling","Phishing / social engineering of admins and developers","Exploitation of zero-day/n-day vulnerabilities in the vendor's own shipped products, turning the product into an attack vector against customers"]},"Manufacturing":{"raw":"Initial Access Vectors","subs":["Exposed/unsecured RDP and remote-access services (documented initial vector in the Honda/EKANS 2020 case)","Exploited public-facing vulnerabilities (leading root cause per Sophos 2025, 32% of manufacturing incidents; e.g., Citrix NetScaler CVE exploited by INC Ransom)","Phishing/spearphishing and malicious email attachments (Norsk Hydro's LockerGoga entry point)","Compromised/stolen credentials, including via infostealer malware","Malicious browser downloads by employees (Continental AG 2022 vector)","Third-party/vendor/MSP remote-access compromise"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Initial access vectors","subs":["Voice phishing (vishing) targeting IT helpdesk/employees to obtain SaaS/CRM credentials (Cushman & Wakefield/ShinyHunters pattern)","Business email compromise / spear-phishing against client-facing consulting, legal, and accounting staff","Exploited VPN/RDP and edge-device vulnerabilities into MSP and IT-services provider networks","Infostealer malware harvesting employee and third-party credentials (RedLine, Lumma, generic stealers observed heavily across ransomware.live Business Services listings)","Compromise of exposed EDI, order-processing, and warehouse-management portals in wholesale/distribution firms","Compromised MSP/RMM tooling providing one-to-many access into multiple downstream client environments"]},"Public Administration (Government)":{"raw":"Initial Access Vectors","subs":["Exploitation of unpatched internet-facing systems and legacy/end-of-life software (VPN concentrators, Citrix/RDP gateways, Exchange, file-transfer appliances like MOVEit) common in underfunded agencies","Exposed / brute-forced Remote Desktop Protocol (RDP) - the classic SamSam vector used against Atlanta","Phishing and business-email-compromise against government email accounts and elected officials","Stolen/valid credentials and weak or absent MFA on remote-access and privileged accounts","Compromise via managed service providers (MSPs) and shared statewide/county IT systems that serve many agencies at once","Third-party/software supply-chain compromise (e.g. mass-exploited file-transfer and remote-management tools)"]},"Retail Trade and Consumer Services":{"raw":"Initial Access Vectors","subs":["Help-desk/service-desk vishing and impersonation (Scattered Spider-style)","Third-party IT vendor or identity-provider (Okta/SSO) compromise","Exploited public-facing vulnerabilities (VPN, web app, edge devices)","SaaS/OAuth and connected-app abuse (e.g., fake Salesforce Data Loader)","Phishing/credential theft against store, warehouse, or corporate staff","Compromised franchise or dealer-network credentials"]},"Telecommunications":{"raw":"Initial Access Vectors","subs":["Infostealer-harvested employee/admin credentials (WOW!/Arkana; Orange Spain RIPE-account takeover)","Exploitation of internet-facing edge devices, VPNs and collaboration platforms (Colt/Orange - SharePoint CVE-2025-53770; DBIR notes 8x rise in edge/VPN exploitation, only 54% patched)","Phishing and social engineering leading to hijacked Domain Admin accounts (Telecom Argentina/REvil)","Compromised third-party/vendor or subcontractor credentials (Bell Technical Solutions/Hive)","Rapid weaponization of zero-day/critical vulnerabilities in internet-facing network equipment (Cyble finding)","Stolen or weak administrative credentials (TSTT/RansomEXX)"]},"Transportation and Warehousing":{"raw":"Initial Access Vectors","subs":["Weak/brute-forced credentials and absent MFA on remote-access or VPN accounts (e.g., KNP Logistics/Akira, single weak password, no MFA)","Exploited public-facing vulnerabilities in logistics/ERP software and edge devices","Phishing and stolen-credential campaigns targeting dispatch, billing, and operations staff","Compromise of a shared/upstream software vendor whose platform many carriers depend on (supply-chain trojan, e.g., NotPetya's spread via M.E.Doc)","Legacy or unpatched OT/ICS components in port terminal and warehouse-automation systems with long refresh cycles"]}}},{"key":"extortion tactics","name":"Extortion Tactics","fam":"Extortion & Impact","desc":"The mechanisms attackers use to monetize a manufacturing compromise, increasingly shifting from pure encryption toward data theft as manufacturers improve encryption-prevention (per Sophos 2025: encryption success dropped from 74% to 40% YoY).","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Extortion tactics","subs":["Encryption of operational systems (PMS, POS, reservations) causing immediate, highly visible service disruption","Data exfiltration and double/triple extortion (threatening publication of guest/loyalty PII, ID scans, financial data)","Direct harassment of executives, guests, or loyalty-program members with stolen data","Publication of sensitive operational or IP-like materials (e.g., unreleased attraction designs, menus, pricing) as leverage distinct to entertainment/theme-park operators","Timing attacks to coincide with peak seasons, holidays, or major events to maximize revenue-loss pressure and increase likelihood of ransom payment","Pure data-theft extortion without encryption (e.g., ShinyHunters/Scattered Spider-linked groups increasingly skip encryption and threaten-to-leak only)"]},"Construction":{"raw":"Extortion Tactics","subs":["Double extortion: encryption plus exfiltration and leak-site publication of stolen files (the dominant model seen across Qilin, LockBit, Akira, Play, DragonForce, INC Ransom incidents in the dataset)","Triple extortion / regulatory and reputational threats (AiLock explicitly threatens to notify regulators and competitors and gives victims a 72-hour response window)","Pure data-theft extortion without encryption (Everest has shifted toward this model; used against Turner Construction)","Threats to leak competitively sensitive bid, pricing and design data to rival bidders or competitors ahead of tender awards","Mass 'name-and-shame' campaigns where dozens of victims across many industries (including construction) are listed together after a single shared-software exploit, increasing pressure via public exposure even before individualized negotiation"]},"Energy and Utilities":{"raw":"Extortion Tactics","subs":["Encryption of IT systems (production planning, shipment tracking, billing, ERP)","Data exfiltration + leak-site publication (double extortion; e.g., ALPHV 150GB from Creos/Encevo, Qilin ~1TB from Conpet)","Triple extortion: added pressure via press/regulators, and threats to customers/partners whose data was stolen","Threat/harassment of executives, employees, and Petro-Points/loyalty-style customer bases","DDoS as an added coercion layer","Auctioning/selling stolen files to highest bidder (RansomHub model)","Geopolitical/hacktivist extortion and 'name-and-shame' with no intent to decrypt (e.g., Handala targeting Gulf oil majors)"]},"Finance and Insurance":{"raw":"Extortion Tactics","subs":["Encryption of core systems to force operational downtime (classic single extortion)","Data exfiltration and double extortion (threat of publishing stolen customer/financial records - dominant pattern in nearly all example incidents above)","Leak-site countdown deadlines to pressure fast payment (e.g., Everest's 6-day deadline on Frost/Citizens)","Harassment of executives, customers, or regulators directly (naming institutions publicly, contacting affected customers)","Reputational/'shaming' posts calling out incident-response vendors or refusal to negotiate (ALPHV's public post against FNF)","Threats of onward sale of data to third parties rather than public leak, as a middle-ground pressure tactic (MAPFRE/Lapsus$)"]},"Healthcare and Social Assistance":{"raw":"Extortion Tactics","subs":["Encryption of clinical, administrative, and financial systems (EHR, PACS, pharmacy, lab, scheduling) forcing 'downtime procedures' and patient diversion","Data exfiltration and double/triple extortion, publishing or threatening to publish stolen PHI on leak sites (roughly three-quarters of recent healthcare cases reportedly involve exfiltration, per Coveware)","Targeted harassment of especially vulnerable patients using stolen sensitive records (e.g., ALPHV/BlackCat's publication of nude cancer-patient treatment photos at Lehigh Valley Health Network; Medibank attackers publishing abortion and addiction-treatment records) to increase payment pressure","Direct extortion emails/calls to patients or plan members threatening individual data release unless the organization (or the individual) pays","DDoS attacks layered on top of encryption/exfiltration to pressure incident-response teams","'Re-victimization', re-posting or re-selling the same stolen healthcare dataset by multiple groups or brokers after an initial attack (dispossessor/second-hand leak listings observed in the dataset)"]},"Information Technology":{"raw":"Extortion Tactics","subs":["Encryption of production, build/CI-CD and virtualization (VMware ESXi) systems","Data exfiltration and public leak-site publication (double extortion)","Triple/quadruple extortion: DDoS and direct harassment of the victim's downstream customers, partners and employees","Threatened disclosure of source code, product blueprints and signing keys/certificates","Ransom escalation and event-timed pressure (e.g., REvil publicizing Quanta/Apple leak during Apple's launch event)"]},"Manufacturing":{"raw":"Extortion Tactics","subs":["Encryption of production/IT systems (traditional single-extortion, e.g. Norsk Hydro, Honda)","Data exfiltration and double-extortion (leak-site publication threats, e.g. Continental, Nissan, Yamaha)","Backup destruction to eliminate recovery options and increase payment pressure (Foxconn Mexico: 20-30TB of backups deleted)","Deadline-driven public leak-site pressure campaigns","Triple extortion (secondary harassment of customers/partners named in stolen data, or DDoS layered on top)","Direct sale of stolen IP/data to third parties independent of ransom negotiation (Continental data offered for sale at $50M/$40M)"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Extortion tactics","subs":["Double extortion: encryption plus exfiltration threat of client/case data (law, accounting, consulting firms)","Pure data-exfiltration extortion without encryption, increasingly common via SaaS/CRM compromise (no file-encryption downtime, but reputational/regulatory leverage)","Leak-site 'countdown' publication of stolen client and employee data to pressure payment","Multi-group/competing extortion claims on the same victim (seen with Cushman & Wakefield, claimed by both ShinyHunters and Qilin) complicating incident response and negotiation","Harassment of downstream clients/customers whose data was exposed, used as secondary leverage against the professional-services victim","DDoS as an auxiliary pressure tactic during negotiation stand-offs"]},"Public Administration (Government)":{"raw":"Extortion Tactics","subs":["Encryption of servers/endpoints halting citizen-facing and back-office services (double-extortion base case)","Data exfiltration + public leak-site posting when governments refuse to pay (e.g. Rhysida dumping ~600GB from the British Library; Interlock posting 43GB from St. Paul; Play leaking Oakland data)","Publication/auctioning of citizen PII, employee HR/payroll files, and law-enforcement records to shame and pressure","Direct harassment / notification of affected citizens and media to amplify political pressure on officials","Framing attacks as acts of 'terrorism' / national-security events (Costa Rica) to maximize coercion","DDoS and repeat-attack threats layered on top of encryption (triple-extortion)"]},"Retail Trade and Consumer Services":{"raw":"Extortion Tactics","subs":["Traditional encryption of ERP/POS/inventory systems (operational shutdown)","Extortion-only data exfiltration with no encryption (fastest-growing tactic)","Double extortion (encrypt + threaten to leak)","Direct executive/leadership harassment (calls, Teams messages, emails to C-suite)","Deadline-based public leak-site threats naming victims before payment","Threats against downstream customers/members directly (name-and-shame of loyalty program members)"]},"Telecommunications":{"raw":"Extortion Tactics","subs":["Double extortion: encryption plus data exfiltration (RansomEXX/TSTT, Yanluowang/Cincinnati Bell)","Pure data-leak/'pay-or-leak' extortion with no encryption (Arkana/WOW!, ShinyHunters/American Tower, ShinyHunters/Charter)","Public shaming, 'wall of shame' and doxxing tactics (Arkana Security's stated model)","Proof-of-hack demonstration videos and backend-access showcases (Arkana/WOW!)","Reupload/re-extortion of previously leaked data by a different or same group (SK-Telecom 'data reuploaded' listing)","Deadline-driven negotiation windows escalating ransom demands over time (Telecom Argentina's $7.5M to $15M escalation)"]},"Transportation and Warehousing":{"raw":"Extortion Tactics","subs":["Traditional file/system encryption halting dispatch, billing, and tracking operations","Double extortion, data theft plus threatened leak (Nefilim/Toll Group, LockBit/Estes)","Extortion-only attacks with no encryption payload, relying purely on stolen shipment/customer/financial data (a rising share industry-wide per Sophos 2025)","Harassment of customers, partners, or drivers via leaked contact data to pressure payment","Wiper malware disguised as ransomware for disruption rather than profit (NotPetya/Maersk)"]}}},{"key":"insider and workforce risk","name":"Insider and Workforce Risk","fam":"Insider & Workforce","desc":"Sophos data shows retail has the highest rate of any surveyed sector attributing root cause to \"lack of in-house security expertise,\" reflecting thin IT/security staffing relative to large distributed physical footprints.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Insider and workforce-related risk","subs":["High staff turnover creating stale/orphaned credentials and inconsistent access de-provisioning","Seasonal and temporary/contract staff with broad system access and less security training","Front-desk/POS-level social engineering targets (staff empowered to make account/reservation changes)","Shared or weakly managed credentials across large, decentralized property networks"]},"Construction":{"raw":"Insider and Workforce Risk","subs":["Shared or generic site-login credentials used across union labor, day laborers and rotating temp/subcontractor staff","Weak or inconsistent offboarding across multi-employer jobsites when subcontractor personnel change frequently","Disgruntled former employees or terminated subcontractors retaining VPN/portal access","Field staff use of personal/BYOD devices for project apps, increasing infostealer and credential-theft exposure outside corporate IT control"]},"Energy and Utilities":{"raw":"Insider & Human-Factor Risk","subs":["Privileged IT/OT administrator credential theft (Conpet root cause)","Use of personal/unmanaged devices for work access","Contractor and seasonal/field-workforce access sprawl","Weak MFA coverage on remote-access and OT jump hosts","Malicious or negligent insiders with SCADA access"]},"Finance and Insurance":{"raw":"Insider and Human-Factor Risk","subs":["Single-employee phishing susceptibility as a root cause (Evolve Bank & Trust)","Inadequate or inconsistent security controls across a large branch/subsidiary/M&A footprint","Insider threats (raised as a growing concern in Coveware's late-2025 reporting alongside falling payment rates)","Vendor-employee access management gaps at outsourced processors"]},"Healthcare and Social Assistance":{"raw":"Insider and Workforce Risk","subs":["Widespread, broad EHR access privileges among clinical staff increasing blast radius of a single compromised account","Credential reuse and shadow-IT tools (e.g., unsanctioned messaging/file-sharing apps used by clinicians) bypassing security controls","Chronic cybersecurity staffing/budget shortfalls relative to IT complexity, especially at rural hospitals, nursing homes, and behavioral-health/social-assistance providers","Third-party staffing and locum/travel clinician access management gaps","Social engineering of help-desk/password-reset workflows (a rising vector per 2025-2026 reporting, including at Change Healthcare-adjacent and other large-health-system incidents)"]},"Manufacturing":{"raw":"Insider and Human-Factor Risk","subs":["Employee-initiated compromise (malicious downloads, credential reuse, phishing susceptibility)","Insufficient in-house security expertise to detect/respond in time (cited by 42.5% of manufacturing ransomware victims per Sophos 2025)","Disgruntled or negligent insiders with OT/production-system access","Contractor and temporary-worker access-control gaps on factory floors"]},"Public Administration (Government)":{"raw":"Insider & Human-Factor Risk","subs":["Negligent insiders (credential reuse, susceptibility to phishing, workaround shadow-IT during outages)","Malicious/disgruntled insiders and access-broker recruitment (Costa Rica alleged in-country facilitators)","Weak privileged-access governance and over-provisioned admin accounts","Elected-official and executive account targeting (high-value, low-training)"]},"Retail Trade and Consumer Services":{"raw":"Insider and Human-Factor Risk","subs":["Under-resourced in-house security teams relative to store/location count","Susceptibility of frontline/call-center/help-desk staff to social engineering","High employee turnover complicating access management and training","Malicious or negligent insider access at franchise/third-party locations"]},"Transportation and Warehousing":{"raw":"Insider & Workforce Risk","subs":["Credential reuse/weak passwords among widely distributed field and warehouse staff","High employee/contractor turnover complicating access-deprovisioning","Limited security-awareness training budgets relative to operational/safety training priorities","Malicious or coerced insiders with access to dispatch or customs-clearance systems"]}}},{"key":"third party and supply chain risk","name":"Third Party and Supply Chain Risk","fam":"Third-Party & Supply Chain","desc":"Healthcare is unusually dependent on a small number of concentrated technology and services intermediaries (claims clearinghouses, pathology/lab partners, billing processors, EHR vendors), making single points of failure catastrophic and systemic.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Third-party and supply-chain risk","subs":["Managed service provider (MSP) / IT help-desk vendor compromise (root cause of MGM and Caesars incidents)","SaaS booking, PMS, or supply-chain platform compromise affecting many downstream hotel/restaurant brands simultaneously (mirrors Blue Yonder-type incidents Verizon DBIR flagged for accommodation/food services)","Construction, renovation, or facilities contractor breaches exposing sensitive operational data (Disneyland Paris partner breach)","Franchise/master-licensor shared infrastructure compromise cascading to independently owned locations","Payment processor or gift-card platform compromise"]},"Construction":{"raw":"Third-Party and Supply-Chain Risk","subs":["Shared collaboration/BIM platforms (e.g., Procore, Autodesk Construction Cloud/BIM 360) linking general contractors, architects, engineers, and dozens of subcontractors","Common enterprise software creating simultaneous multi-victim exposure (Bechtel and Kier Group were both hit within the same week during Clop's Oracle EBS campaign, despite being unrelated companies)","General contractor -> subcontractor -> sub-subcontractor credential and data flows, where the weakest link in the chain can expose the whole project","Architecture/engineering design partners and geotechnical/survey consultants with access to shared project data","Owner and lender portals used for draw requests and project financing, exposing financial data outside the contractor's own perimeter"]},"Energy and Utilities":{"raw":"Third-Party & Supply-Chain Risk","subs":["Oilfield-services and drilling contractors as chokepoints (Halliburton disruption rippled to E&P customers)","ICS/automation vendors and remote-maintenance access (e.g., Schneider Electric compromise affecting industrial customers)","Managed service providers and shared IT platforms across utility groups","Software/firmware supply-chain and update-mechanism abuse","Fuel-retail and payment/POS processors (Suncor/Petro-Canada payment outage at 1,500+ stations)","Interconnected grid/pipeline operators and shared SCADA telemetry","Metering, AMI, and smart-grid device supply chain"]},"Finance and Insurance":{"raw":"Third-Party and Supply-Chain Risk","subs":["Concentrated vendor risk - a single vendor compromise affecting multiple unrelated financial institutions (Frost Bank + Citizens Bank via shared print/fulfillment vendor)","Core processor/payments vendor compromise (Fiserv, TSYS-type entities appearing as ransomware group targets)","Fintech/BaaS partner-network exposure cascading to end consumers who never had a direct relationship with the breached entity","Marketing/loyalty platform vendors handling employee or partner data on the institution's behalf","Weak contractual/audit visibility into subcontractors' security posture (a recurring theme in post-incident litigation, e.g., GLBA vendor-accountability suits against Citizens/Frost)"]},"Healthcare and Social Assistance":{"raw":"Third-Party / Supply-Chain Risk","subs":["Claims clearinghouse / revenue-cycle processor compromise (Change Healthcare/Optum, processes ~15 billion transactions/year, roughly a third of US patient records, per reporting) causing nationwide billing and pharmacy disruption far beyond the direct victim","Pathology, lab, and diagnostic-services partner compromise (Synnovis attack on NHS London trusts) halting blood testing and surgeries at hospitals that never touched the attacker directly","EHR, practice-management, and medical-billing software vendor compromise cascading to hundreds of downstream clinics/practices","Managed IT/security services provider compromise granting simultaneous access to many hospital or clinic networks","Business-associate and vendor risk under HIPAA, breach liability extending to the covered entity even when the incident originates at a subcontractor","Group-purchasing, supply, and medical-device-maintenance vendors as pivot points into hospital networks"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Third-party / supply-chain risk","subs":["MSP/IT-services compromise cascading into many downstream client organizations (Cognizant, Accenture, Sopra Steria pattern)","SAP/ERP consultancy and implementation-partner compromise exposing multiple enterprise clients' back-office systems (e.g., Megawork/SAP consultancy incident)","BPO/back-office outsourcing compromise exposing data the vendor processes on behalf of many end clients across other regulated industries (Conduent processing healthcare claims and payments for numerous government/commercial clients)","SaaS/CRM platform (e.g., Salesforce) compromise via a single vendor or employee credential exposing aggregated client contact/PII data across an entire real estate or professional-services portfolio","Franchise, staffing-agency, and subcontractor network risk in wholesale distribution and real estate where security posture varies widely by location"]},"Retail Trade and Consumer Services":{"raw":"Third-Party and Supply-Chain Risk","subs":["Compromise of shared SaaS/DMS/CRM platforms serving many retailers at once","IT help-desk/outsourced support vendor compromise","Payment processor or gateway compromise","Franchise/multi-brand holding-company shared infrastructure","Fourth-party risk from vendors' own vendors"]},"Telecommunications":{"raw":"Third-Party & Supply Chain Risk","subs":["Compromise via subcontracted field-service/technical-solutions providers","Compromise of shared backend SaaS platforms used across the operator's business (AppianCloud/Symphonica-style)","MVNO/reseller relationship exposure","Industry-body/association compromise with cross-member blast radius (GSMA/Qilin)","Downstream exposure of other carriers' data held incidentally (American Tower's records referencing T-Mobile/Verizon/DHS)"]},"Transportation and Warehousing":{"raw":"Third-Party / Supply-Chain Risk","subs":["Concentration risk in dominant ELD/telematics or TMS/WMS software vendors serving many carriers simultaneously","Cascading customer-service disruption when a shared customer portal or booking platform goes down","Cross-organizational data exposure when EDI/partner data feeds are compromised","Regulatory/compliance cascade, e.g., FMCSA having to issue nationwide ELD enforcement waivers after a single vendor's outage"]}}},{"key":"regulatory and legal exposure","name":"Regulatory and Legal Exposure","fam":"Regulatory & Legal","desc":"Healthcare carries some of the heaviest breach-notification, privacy, and liability regimes of any industry, amplifying the downstream cost of a ransomware event well beyond technical remediation.","inds":{"Construction":{"raw":"Regulatory and Contractual Exposure","subs":["Employee PII/payroll breach notification obligations (AECOM's 2021 incident exposed employee SSNs and bank routing/account numbers and required notification to the California Attorney General)","Government-contractor obligations (major defense/energy/critical-infrastructure contractors such as Bechtel and AECOM handle DoD/DOE and critical-infrastructure work, raising CMMC/DFARS-style breach-notification and controlled-technical-information exposure)","Professional liability/errors-and-omissions exposure if stolen design, CAD/BIM or structural-engineering data proves defective or is misused after a leak","Contractual delay-damages/liquidated-damages exposure if ransomware-driven downtime in scheduling, procurement, or payroll systems cascades into project schedule slippage","Bid-integrity and antitrust-adjacent exposure if leaked tender/pricing data undermines competitive bidding processes"]},"Finance and Insurance":{"raw":"Regulatory and Legal Exposure","subs":["Breach notification regimes with short/compressed timelines (contributing to elevated 'detection & escalation' cost share per IBM 2025 - ~34% in financial services vs ~29% global)","Sector-specific regulatory regimes (GLBA in the U.S., DORA in the EU, functional-regulator rules for banks/insurers)","SEC disclosure obligations for material cybersecurity incidents (as invoked in the FNF SEC filing)","State/national data-protection authority investigations (e.g., Spanish AEPD scrutiny in MAPFRE's 2021 incident)","Follow-on class-action litigation from affected customers, increasingly targeting both the breached entity and its vendors","AML/KYC and financial-stability regulator engagement when core systems or national payment infrastructure are affected"]},"Healthcare and Social Assistance":{"raw":"Regulatory and Legal Exposure","subs":["HIPAA/HHS OCR breach notification, investigation, and potential civil monetary penalties (US)","State attorney-general actions and multistate settlements","Mass tort / class-action litigation from affected patients (e.g., $65M Lehigh Valley Health Network settlement; CommonSpirit and HCA class actions)","GDPR and equivalent international health-data protection regimes for multinational providers and insurers","Government/parliamentary inquiries and mandatory incident reporting for public health systems (Ireland's HSE, UK NHS)","Loss of accreditation, payer contract, or Medicare/Medicaid compliance risk tied to prolonged system unavailability","Cyber-insurance coverage disputes and sub-limits given the scale of potential claims in this sector"]},"Information Technology":{"raw":"Regulatory, Legal and Contractual Exposure","subs":["SEC cyber-incident disclosure obligations and investigations (SEC probe of Progress Software/MOVEit)","GDPR and global breach-notification statutes across many jurisdictions","Mass class-action litigation (MOVEit spawned dozens of suits, 40M+ claimants)","Contractual SLA penalties, indemnities and customer breach-of-contract claims","Cross-border data-transfer and sovereignty complications"]},"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Regulatory and contractual exposure","subs":["Multi-state breach notification obligations when a single incident exposes data spanning many client industries and jurisdictions (Conduent: multi-state AG enforcement, ~10+ class actions)","Contractual indemnification and liability clauses with enterprise clients whose data was exposed via the vendor","SEC disclosure obligations for publicly traded professional-services firms (Cognizant, Sopra Steria, Accenture, Conduent all filed material-impact disclosures)","Professional licensing/ethics exposure for law and accounting firms following confidentiality breaches"]},"Telecommunications":{"raw":"Regulatory & Legal Exposure","subs":["Data-protection regulator fines (SK Telecom's $97.2M PIPC fine; Cosmote/OTE's combined ~$9.25M Greek DPA fines for a related breach)","Mandatory consumer compensation schemes (SK Telecom's per-subscriber payout order)","Breach-notification law gaps/delays in some jurisdictions (Trinidad and Tobago's lack of mandatory notification law)","Securities disclosure obligations for public telecom operators (WideOpenWest 8-K materiality determination)","Executive/leadership accountability actions (TSTT CEO's dismissal post-breach)","National security and critical-infrastructure regulatory scrutiny given telecom's name":"Core Network Availability Disruption OT Equivalent Risk","fam":"OT & Operational Disruption","desc":"Telecom's version of OT/ICS risk - attacks that threaten service availability at national or regional scale rather than just confidentiality.","inds":{"Telecommunications":{"raw":"Core Network / Availability Disruption ('OT-equivalent' risk)","subs":["Voice/SMS/data network outages from ransomware or intrusion (Cellcom's week-long voice/SMS blackout)","BGP hijacking / routing manipulation causing internet outages (Orange Spain)","Sabotage-style attacks without malware causing multi-day national outages (Vodafone Portugal, 4.7M mobile + 1M fixed customers affected)","Customer-portal and OSS/BSS downtime cascading into business-customer disruption (Colt's multi-month portal outage)","Emergency-services (911/E911) disruption risk given telecom's critical-infrastructure designation"]}}},{"key":"extortion and impact tactics","name":"Extortion and Impact Tactics","fam":"Extortion & Impact","desc":"The mix of leverage attackers apply. In this sector the physical perishability and food-security angle amplifies pressure to pay quickly.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Extortion & Impact Tactics","subs":["Encryption of production/ERP/warehouse and ordering systems that halts slaughter, processing, packing, invoicing and dispatch (JBS, KP Snacks, UNFI)","Double extortion: exfiltration of data plus threat to leak (Conti/KP Snacks; INC Ransom/Ahold Delhaize; BlackMatter/NEW Cooperative)","Perishability-driven time pressure, spoilage of raw materials, finished goods and livestock welfare used as urgency leverage","Food-security / public-safety framing to raise reputational and regulatory stakes on a critical-infrastructure victim","Re-extortion and data-recycling (e.g., 2026 'coinbasecartel' posting reusing JBS data years after the original event)","Triple extortion / harassment of customers, growers, and downstream retailers whose shelves empty during an outage"]}}},{"key":"extortion leverage from minors and student data","name":"Extortion Leverage From Minors and Student Data","fam":"Extortion & Impact","desc":"Education is uniquely coercible because the hostage data belongs largely to children. Actors have moved from encryption-first to exfiltration-led extortion and apply pressure through channels unavailable in other sectors: publishing psychological evaluations, special-education records and abuse reports, and contacting students and parents directly. In the LAUSD and Minneapolis cases the leaked corpora included student psychological assessments, and in Minneapolis campus security blueprints - creating physical-safety as well as privacy harm. Sophos recorded extortion-only (no encryption) attacks rising in both education strata.","inds":{"Educational Services":{"raw":"Extortion Leverage from Minors' and Student Data","subs":["Publication of minors' PII, disciplinary, special-education and counselling records","Release of student psychological and medical assessments","Direct contact with parents, students and staff to amplify pressure (triple extortion)","Leak of campus security blueprints, floor plans and access-control layouts","FERPA/COPPA notification exposure used as negotiating leverage","Reputational leverage over admissions, enrolment and donor confidence","Timing of attacks to term start, exams, enrolment or financial-aid deadlines","Re-extortion of individual institutions after a vendor has already paid","Auction and resale of student datasets on leak sites"]}}},{"key":"infrastructure and availability risk it data center","name":"Infrastructure and Availability Risk IT Data Center","fam":"OT & Operational Disruption","desc":"For the IT sector the critical 'operational technology' is the data center, network and cloud fabric; loss of availability is the primary business-interruption driver rather than physical production lines.","inds":{"Information Technology":{"raw":"Infrastructure and Availability Risk (IT/Data-Center)","subs":["Data-center / colocation and network-operations disruption","Backup and disaster-recovery system targeting (attackers delete/encrypt backups first)","Virtualization and hypervisor mass-encryption (ESXi)","Prolonged availability loss and business-interruption for both victim and downstream customers"]}}},{"key":"initial access via open and federated campus environments","name":"Initial Access Via Open and Federated Campus Environments","fam":"Initial Access","desc":"Education networks are architecturally adversarial to containment. Universities operate deliberately open networks supporting public research collaboration, guest access, self-managed student devices and thousands of transient accounts per year, while K-12 districts run flat networks with minimal segmentation and small IT teams. Sophos found exploited vulnerabilities to be the single largest root cause in higher education (35% of attacks) and phishing the leading cause in lower education (22%), reflecting the two different failure modes. Verizon DBIR data has repeatedly placed social engineering and system intrusion as the dominant education breach patterns.","inds":{"Educational Services":{"raw":"Initial Access via Open and Federated Campus Environments","subs":["Unpatched internet-facing infrastructure (VPN concentrators, VMware ESXi, Citrix, file transfer appliances)","Phishing and business email compromise against faculty, staff and payroll","Compromised credentials and absent or partial MFA on student/staff SSO","Federated identity and SSO trust chains (Shibboleth, InCommon, eduGAIN, Entra ID) enabling lateral movement across institutions","BYOD and unmanaged student-owned devices on production VLANs","Flat, unsegmented K-12 district networks linking administrative and instructional systems","Research collaboration links, shared HPC clusters and inter-institutional data sharing","Remote and hybrid learning infrastructure, exposed RDP and legacy remote access","Seasonal staffing churn, adjunct and contractor accounts, and stale account deprovisioning"]}}},{"key":"insider and credential based risk","name":"Insider and Credential Based Risk","fam":"Insider & Workforce","desc":"Human-layer risk distinct from bulk phishing - individual employee/admin compromise with outsized consequences given telecom's centralized subscriber-identity role.","inds":{"Telecommunications":{"raw":"Insider & Credential-Based Risk","subs":["Single-employee infostealer infection cascading to full backend compromise (WOW!)","Reused/weak passwords on high-privilege admin or registry accounts (Orange Spain RIPE account)","SIM-swap-enabling data theft (USIM keys, IMSI) creating downstream account-takeover risk for subscribers (SK Telecom)","Insider-facilitated or insider-adjacent credential sale enabling initial access"]}}},{"key":"insider and credential risk","name":"Insider and Credential Risk","fam":"Insider & Workforce","desc":"Distributed, high-turnover workforces common to staffing, real estate brokerage, and professional-services firms increase credential and insider exposure.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Insider and credential risk","subs":["Large contractor/gig and franchise workforces with inconsistent endpoint security and access controls","Privileged access by outsourced IT/helpdesk staff susceptible to social engineering","Departing-employee credential misuse in high-turnover brokerage/consulting environments"]}}},{"key":"insider and student originated threat","name":"Insider and Student Originated Threat","fam":"Insider & Workforce","desc":"Education is the rare sector in which a substantial share of the resident population is both technically capable and directly motivated to attack the institution's systems - for grade alteration, exam access or reputational reasons - while holding legitimate network credentials. The PowerSchool intrusion was ultimately attributed by the US DOJ to a 19-year-old university student, who pleaded guilty. Insider events blur the ransomware/fraud boundary and complicate coverage triggers.","inds":{"Educational Services":{"raw":"Insider and Student-Originated Threat","subs":["Student credential abuse and grade or transcript alteration","Attacks originating from enrolled students against their own institution","Faculty and staff insider data theft","Credential sharing, shadow IT and unauthorised SaaS in departments","Initial access broker purchase of student/staff credentials from infostealer logs","Departing staff and contractor access retention","Negligent insiders and misconfigured shares exposing student records"]}}},{"key":"insider identity and privileged access risk","name":"Insider Identity and Privileged Access Risk","fam":"Insider & Workforce","desc":"IT staff hold the keys to both their own and customers' environments, making identity compromise and privileged-access abuse especially damaging.","inds":{"Information Technology":{"raw":"Insider, Identity and Privileged-Access Risk","subs":["Compromise of privileged admin / domain-admin and cloud root credentials","Developer credential and secrets theft (repo tokens, API keys)","Initial-access-broker recruitment and insider collusion","Weak MFA / SSO federation abuse across tenants"]}}},{"key":"insider workforce and operational maturity risk","name":"Insider Workforce and Operational Maturity Risk","fam":"Insider & Workforce","desc":"Human and organizational weaknesses characteristic of the sector.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Insider, Workforce & Operational-Maturity Risk","subs":["Large seasonal/temporary and low-turnover-training workforce increasing phishing susceptibility","Historically thin cybersecurity budgets and staffing, especially at farms, co-ops and mid-size processors (DHS records noted JBS's pre-attack security as unusually poor)","Legacy and end-of-life systems in plants and back-office (Dole: half of legacy servers affected)","Limited backup/recovery testing and lack of manual fallback procedures for automated operations","Dispersed rural sites with inconsistent monitoring and slow patch cycles","Insider access at co-ops and family/closely-held businesses with informal IT governance"]}}},{"key":"intellectual property and source code theft","name":"Intellectual Property and Source Code Theft","fam":"Data & IP Confidentiality","desc":"IT firms hold uniquely high-value technical IP whose theft is itself the extortion leverage, independent of encryption.","inds":{"Information Technology":{"raw":"Intellectual Property and Source Code Theft","subs":["Product designs and hardware blueprints (Quanta/Apple device schematics)","Semiconductor / chip design and EDA data (ARM, Synopsys as recent leak-site claims)","Proprietary source code and algorithms","Code-signing keys, certificates and secrets enabling further supply-chain abuse","Trade secrets, roadmaps and confidential customer contracts"]}}},{"key":"operational and store network disruption","name":"Operational and Store Network Disruption","fam":"OT & Operational Disruption","desc":"Because retail margins depend on continuous inventory flow and point-of-sale availability, ransomware's operational-availability impact (not just data loss) is often the largest cost driver in this industry.","inds":{"Retail Trade and Consumer Services":{"raw":"Operational and Store-Network Disruption","subs":["Store-wide or chain-wide POS outages halting sales","Automated ordering/replenishment failure forcing manual (paper) processes","E-commerce/website downtime and lost online revenue","Warehouse and logistics disruption causing stockouts","Shared-platform outages cascading across many independent locations (franchise/dealer model)"]}}},{"key":"operational business continuity risk","name":"Operational Business Continuity Risk","fam":"Other","desc":"How ransomware-driven downtime specifically manifests in financial and insurance operations, which are unusually time-sensitive and trust-dependent.","inds":{"Finance and Insurance":{"raw":"Operational/Business-Continuity Risk","subs":["Loss of access to trading/settlement systems forcing manual, error-prone workarounds","Branch, call-center, and digital-channel outages affecting customer-facing service availability","Delayed real estate closings/title transactions when escrow/title systems are down (FNF)","Claims-processing and underwriting delays in insurance operations","Reputational and customer-trust damage disproportionate to direct financial loss, given the sector's dependence on public confidence"]}}},{"key":"operational disruption of instruction and institutional continuity","name":"Operational Disruption of Instruction and Institutional Continuity","fam":"OT & Operational Disruption","desc":"Unlike most commercial insureds, schools cannot fail over to a degraded manual mode: an encrypted district frequently closes entirely. Highline Public Schools shut all 34 schools for three days; the British Library's core services were disrupted for months. Comparitech measured an average of 10.7 days of downtime per education incident, peaking at 12.6 days in 2023. Lost instructional days carry statutory make-up obligations, transport and meal-programme knock-ons, and in higher education can delay terms, research grants and graduation.","inds":{"Educational Services":{"raw":"Operational Disruption of Instruction and Institutional Continuity","subs":["Full school or campus closure and lost instructional days","Statutory make-up day and calendar-extension obligations","Loss of attendance, gradebook, timetabling and transport systems","Disruption to free/reduced meal programmes and student services","Payroll, HR and accounts-payable outage","Research interruption, lost experiments and grant milestone failure","Admissions, enrolment, registration and financial-aid disruption","Extended rebuild and device re-imaging across large fleets","Library, catalogue and digital collection outage"]}}},{"key":"operational logistics disruption","name":"Operational Logistics Disruption","fam":"OT & Operational Disruption","desc":"Hazards specific to wholesale trade and logistics operations where system downtime directly halts physical goods movement.","inds":{"Professional, Scientific, Technical Services, Real Estate and Wholesale Trade":{"raw":"Operational / logistics disruption","subs":["Warehouse management system (WMS) and inventory database encryption halting order fulfillment","Freight/transportation management system (TMS) and dispatch/scheduling outages delaying deliveries","EDI/order-processing system disruption breaking automated B2B ordering pipelines with retail/wholesale customers","Customer-facing portal outages (e.g., MyToll-style portals) degrading service visibility even when core freight movement continues"]}}},{"key":"operational technology ot and physical safety adjacent risk","name":"Operational Technology OT and Physical Safety Adjacent Risk","fam":"OT & Operational Disruption","desc":"Unlike pure back-office IT sectors, hospitality/entertainment venues integrate IT with physical operations, so a ransomware event can directly disrupt guest safety, access, and physical service delivery, not just data confidentiality.","inds":{"Accommodation, Food Services, Arts and Entertainment":{"raw":"Operational technology (OT) and physical-safety-adjacent risk","subs":["Casino floor and gaming-machine network disruption","Digital door-lock and access-control system failures stranding guests or preventing check-in","Point-of-sale/payment terminal outages forcing cash-only operations","Ride/attraction control and building-management system exposure at theme parks and large venues","Kitchen, ordering, and inventory system outages disrupting food safety and service continuity"]}}},{"key":"ot critical infrastructure adjacency","name":"OT Critical Infrastructure Adjacency","fam":"OT & Operational Disruption","desc":"Where government IT connects to operational technology and public-safety infrastructure, expanding blast radius beyond data loss.","inds":{"Public Administration (Government)":{"raw":"OT / Critical-Infrastructure Adjacency","subs":["Municipal water and wastewater SCADA/OT overseen by public works departments","Traffic-management, transit, and public-lighting control systems","Public-utility (electric/water) operational systems run by state/municipal authorities","Emergency communications and radio infrastructure","IT/OT flat-network convergence in small municipalities lacking segmentation"]}}},{"key":"ot ics and physical process risk","name":"OT Ics and Physical Process Risk","fam":"OT & Operational Disruption","desc":"Operational-technology exposure specific to farms and food plants where cyber impact becomes physical and food-safety relevant.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"OT / ICS & Physical-Process Risk","subs":["Plant SCADA/PLC and process-control systems for slaughter lines, pasteurization, cooking, canning, milling and bottling","Cold-chain and refrigeration/HVAC controls where downtime causes spoilage or food-safety failures","Automated milking, feeding, ventilation and climate systems in livestock/poultry/dairy operations (animal-welfare risk)","Precision-agriculture and equipment telematics (GPS-guided machinery, grain-drying, irrigation, environmental controls)","Building-management and food-safety monitoring systems (temperature logging, HACCP-linked sensors)","IT/OT convergence and flat networks that let office ransomware reach production floors"]}}},{"key":"ot iot and jobsite facilities technology risk","name":"OT IOT and Jobsite Facilities Technology Risk","fam":"OT & Operational Disruption","desc":"Physical and operational-technology exposure distinct to construction and post-construction facilities management, generally less targeted today than pure-IT systems but a growing concern.","inds":{"Construction":{"raw":"OT, IoT and Jobsite/Facilities Technology Risk","subs":["Building Management/Automation Systems (BMS/BAS) for HVAC, elevators and life-safety systems on projects under a firm's ongoing facilities-management or warranty-service contracts","Connected heavy-equipment telematics and fleet/GPS tracking systems","Jobsite IoT sensors (structural/concrete-cure monitoring, environmental sensors)","Site security systems - cameras, badge/access control - on active construction sites","Potential physical-safety and schedule-disruption consequences if OT/jobsite systems are affected, distinct from pure data-confidentiality harm"]}}},{"key":"ot medical device and clinical operations risk","name":"OT Medical Device and Clinical Operations Risk","fam":"OT & Operational Disruption","desc":"Unlike most sectors, ransomware in healthcare directly threatens physical patient safety through disruption of connected medical equipment and clinical workflows, not just IT/data confidentiality.","inds":{"Healthcare and Social Assistance":{"raw":"OT / Medical-Device and Clinical-Operations Risk","subs":["Forced downtime/diversion of ambulances and emergency departments during EHR outages (documented at UHS 2020 and other hospital-system attacks)","Disruption of networked medical devices, infusion pumps, imaging/PACS systems, and lab analyzers that depend on now-encrypted or isolated networks","Delayed or cancelled surgeries, chemotherapy, dialysis, and elective procedures during recovery windows","Documented contribution to patient harm/death from care delays (UK Coroner findings tied delayed blood-test results after the Synnovis attack to a patient death)","Reversion to paper-based/manual clinical documentation for weeks, increasing medication and diagnostic error risk","OT/IT convergence risk in hospital facilities systems (HVAC, building access, refrigeration for pharmaceuticals/blood products)"]}}},{"key":"ot vs it risk","name":"OT Vs IT Risk","fam":"OT & Operational Disruption", al and Food Security Exposure","fam":"Regulatory & Legal","desc":"Compliance and liability hazards triggered by an incident, heightened by critical-infrastructure designation and personal-data holdings.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Regulatory, Legal & Food-Security Exposure","subs":["Critical-infrastructure reporting obligations (CISA/CIRCIA in the US, NIS2 in the EU) and national food-security scrutiny","Data-breach notification and privacy liability (state AG filings, GDPR) for employee, grower and customer PII/SSNs (Ahold Delhaize 2.2M individuals)","Food-safety regulatory fallout when process/monitoring systems are compromised (FDA/USDA, HACCP records)","Sanctions/OFAC risk when paying groups linked to sanctioned actors","Securities-disclosure exposure for public companies (SEC 8-K / 6-K materiality; Dole and UNFI quantified impacts in filings)","Contractual penalties and litigation from retailers, distributors and cooperative members affected by supply failure"]}}},{"key":"regulatory legal and notification exposure","name":"Regulatory Legal and Notification Exposure","fam":"Regulatory & Legal","desc":"Post-incident compliance and liability obligations that shape the insurable loss beyond the ransom/recovery cost itself, particularly where employee, customer, or government-ID data is exposed.","inds":{"Manufacturing":{"raw":"Regulatory, Legal, and Notification Exposure","subs":["Multi-jurisdictional breach-notification requirements for exposed employee/customer PII (e.g., Nissan's ~100,000-person notification across Australia/New Zealand)","Government-ID and financial-data exposure triggering elevated regulatory scrutiny (Medicare numbers, driver's licenses, passports, tax file numbers, SSNs, banking data seen across the example incidents)","Export-control and trade-secret protection obligations for defense/aerospace-adjacent manufacturers","Securities-disclosure obligations for publicly traded manufacturers (material incident/8-K-style disclosures)","Cross-border data-transfer and subsidiary-notification complexity for multinational manufacturers"]}}},{"key":"regulatory legal and political exposure","name":"Regulatory Legal and Political Exposure","fam":"Regulatory & Legal","desc":"Post-incident obligations and accountability pressures distinctive to public bodies answerable to citizens and oversight bodies.","inds":{"Public Administration (Government)":{"raw":"Regulatory, Legal & Political Exposure","subs":["Breach-notification and data-protection obligations (state breach laws, GDPR/UK-GDPR for foreign governments, sector rules)","Class-action litigation by affected citizens and employees over exposed PII","Public-records/FOIA scrutiny, legislative inquiries, and audits of the response","OFAC sanctions risk when a ransom would flow to a sanctioned group (constrains payment even if desired)","Political and electoral fallout, loss of public trust, and pressure on officials to restore service fast","National-security escalation for attacks on central-government institutions"]}}},{"key":"regulatory legal and reputational exposure","name":"Regulatory Legal and Reputational Exposure","fam":"Regulatory & Legal","desc":"Energy is heavily regulated as critical infrastructure; incidents trigger mandatory reporting, sanctions-screening on ransom payment, and public/political scrutiny.","inds":{"Energy and Utilities":{"raw":"Regulatory, Legal & Reputational Exposure","subs":["NERC CIP (bulk power) and TSA pipeline security-directive obligations","CISA/CIRCIA and national-CERT incident-reporting mandates; SEC 8-K materiality disclosure (Halliburton)","OFAC sanctions exposure when paying ransom to sanctioned/Russian-linked groups","Data-protection/privacy penalties (GDPR in EU; customer PII breaches)","State/national-security scrutiny and geopolitical targeting of energy assets","Litigation and shareholder/stock impact from disclosed material incidents"]}}},{"key":"regulatory notification and litigation exposure","name":"Regulatory Notification and Litigation Exposure","fam":"Regulatory & Legal","desc":"Education carries a dense, overlapping and unusually child-focused compliance regime, so a single ransomware event generates parallel regulatory tracks. FERPA and COPPA apply federally in the US, layered with state student-privacy statutes and state breach laws; UK and EU institutions face UK GDPR/GDPR and ICO scrutiny; universities holding clinical or research-health data additionally trigger HIPAA. Notification is frequently slow - Minneapolis took seven months to notify 105,617 people, and the University of Hawai'i Cancer Center's delay in notifying study participants drew specific criticism - which compounds regulatory and class-action risk.","inds":{"Educational Services":{"raw":"Regulatory, Notification and Litigation Exposure","subs":["FERPA (US student education records)","COPPA and state student-privacy laws (e.g. SOPIPA-style statutes)","State breach-notification statutes and attorney-general inquiries","UK GDPR / EU GDPR and ICO or DPA enforcement","HIPAA exposure for university medical centres, clinics and health research","Research funder, IRB and human-subjects data obligations","Class-action litigation on behalf of students, parents and staff","Delayed-notification liability and credit-monitoring remediation costs","Public-records and transparency obligations for public institutions"]}}},{"key":"reputational and customer trust risk","name":"Reputational and Customer Trust Risk","fam":"Other","desc":"Because purchase decisions in retail and consumer services are discretionary and brand-sensitive, publicized ransomware incidents translate directly into measurable revenue and market-value loss, distinct from the direct IR/ransom cost.","inds":{"Retail Trade and Consumer Services":{"raw":"Reputational and Customer-Trust Risk","subs":["Customer churn and reduced footfall/online conversion post-incident","Stock price / market capitalization impact for public companies","Loyalty-program member attrition after data-theft disclosure","Franchise/brand-license reputational spillover across independently owned locations"]}}},{"key":"service disruption availability risk mission critical public services","name":"Service Disruption Availability Risk Mission Critical Public Services","fam":"OT & Operational Disruption","desc":"Government-specific operational hazards where downtime directly harms public safety and essential service delivery, not just revenue.","inds":{"Public Administration (Government)":{"raw":"Service-Disruption / Availability Risk (mission-critical public services)","subs":["911 / emergency dispatch and first-responder CAD systems (impacted in Dallas)","Tax, revenue, customs, and treasury collection systems (Costa Rica Hacienda; Baltimore property transfers)","Benefits, social-security, and public-assistance payment systems (Costa Rican CCSS social security fund)","Courts, permitting, licensing, vital records, and land/property registries","Public utilities billing, water/electricity administrative systems, and municipal payment portals","Prolonged recovery windows (months) driven by legacy systems and limited in-house restoration capacity"]}}},{"key":"supply chain and business interruption risk","name":"Supply Chain and Business Interruption Risk","fam":"Third-Party & Supply Chain","desc":"Because manufacturers sit inside just-in-time, tightly coupled supply chains, a single-site ransomware event can cascade into contingent business interruption for downstream customers and upstream suppliers well beyond the insured's own balance sheet.","inds":{"Manufacturing":{"raw":"Supply Chain and Business Interruption Risk","subs":["Contingent business interruption to downstream OEM customers relying on JIT delivery","Upstream supplier/sub-contractor compromise propagating into the manufacturer's network","Multi-plant/multi-region shutdowns from a single network-wide compromise (Bridgestone: ~30 plants, 10 days)","Extended full-recovery timelines (100+ days per Sophos 2024 data) prolonging revenue loss beyond initial outage"]}}},{"key":"supply chain and downstream cascade risk","name":"Supply Chain and Downstream Cascade Risk","fam":"Third-Party & Supply Chain","desc":"The signature hazard of the IT industry: because these firms are technology suppliers, a single compromise propagates to their entire customer base, creating catastrophic aggregation/accumulation risk for insurers.","inds":{"Information Technology":{"raw":"Supply-Chain and Downstream Cascade Risk","subs":["MSP/RMM platform compromise cascading to managed clients (Kaseya VSA -> up to ~1,500 downstream businesses)","SaaS/hosted-platform outage cascading to customer operations (CDK Global -> ~15,000 dealerships)","Distribution/reseller channel disruption halting downstream commerce (Ingram Micro order processing)","Software-supply-chain / trojanized-update or embedded-product-vulnerability propagation (MOVEit -> 2,700+ organizations)","Cloud/subprocessor concentration and single-points-of-failure shared across many tenants"]}}},{"key":"supply chain and third party concentration risk","name":"Supply Chain and Third Party Concentration Risk","fam":"Third-Party & Supply Chain","desc":"The sector's consolidation and just-in-time structure mean one victim's outage propagates widely; conversely, victims are exposed through their many upstream vendors.","inds":{"Agriculture, Forestry, Fishing and Food Production":{"raw":"Supply-Chain & Third-Party Concentration Risk","subs":["Concentration risk in dominant nodes (few large meatpackers, a single primary grocery distributor such as UNFI supplying 30,000+ stores)","Cooperative/shared-platform risk where one hub serves many farms (NEW Cooperative claimed to touch ~40% of US grain production)","Downstream disruption to retailers and food service (empty shelves, salad-kit and crisp shortages) creating contractual and liability exposure","Upstream dependency on agrochemical, seed, feed, packaging and logistics vendors as attack conduits","Ag-tech / SaaS and cloud ERP dependencies (SoilMap-type platforms, farm-management software)","Cross-border, multi-plant footprints that let a single intrusion affect operations on several continents (JBS US/Canada/Australia)"]}}},{"key":"systemic and market contagion risk","name":"Systemic and Market Contagion Risk","fam":"Other","desc":"A hazard category distinct to this industry: ransomware against a single financial institution or vendor can cascade into broader market or payment-system disruption well beyond the immediate victim.","inds":{"Finance and Insurance":{"raw":"Systemic and Market-Contagion Risk","subs":["Disruption to trade clearing/settlement causing failed deliveries at a market level (ICBC: $62B+ in failed Treasury settlements in a single day)","Derivatives/clearing platform outages forcing manual processing across many institutions simultaneously (ION Group affecting 42+ clients)","Central bank/national payment infrastructure targeting with potential monetary-policy or public-confidence implications (Central Bank of Libya)","Contagion through banking-as-a-service and fintech partner networks, where one bank's compromise exposes many unaffiliated fintech brands' customers (Evolve Bank & Trust)"]}}},{"key":"third party and edtech vendor concentration risk","name":"Third Party and Edtech Vendor Concentration Risk","fam":"Third-Party & Supply Chain","desc":"The single most severe systemic hazard in the sector. A handful of SIS, LMS and assessment platforms serve most of the addressable market, so one vendor intrusion becomes a correlated loss across thousands of insureds simultaneously. PowerSchool (Dec 2024) reached a claimed 62.4 million students and 9.5 million teachers across approximately 6,505 districts from one compromised credential; Instructure/Canvas (May 2026) was claimed to affect 275 million users across roughly 9,000 institutions. Verizon's 2026 DBIR reported third-party involvement in 48% of breaches with supply-chain breaches up 60%. For a cyber-insurance portfolio this is the dominant aggregation exposure in the education book.","inds":{"Educational Services":{"raw":"Third-Party and Edtech Vendor Concentration Risk","subs":["Student information system (SIS) platform compromise","Learning management system (LMS) platform compromise","Single-vendor concentration across a large book of district/university insureds","Downstream re-extortion of individual schools using vendor-stolen data","Managed service providers and regional education service agencies serving many districts","Tuition, bursar and payment processor compromise","Assessment, proctoring, transcript and admissions platforms","Cloud file transfer and third-party SaaS (e.g. mass MOVEit/Cleo-style exploitation reaching education via clop)","Contractual gaps in vendor breach notification, indemnity and data-deletion assurance"]}}},{"key":"third party and vendor msp risk","name":"Third Party and Vendor Msp Risk","fam":"Third-Party & Supply Chain","desc":"Reliance on external integrators, MSPs, and cloud/SaaS platforms for both IT and OT management creates an attack surface outside the manufacturer's direct control.","inds":{"Manufacturing":{"raw":"Third-Party and Vendor/MSP Risk","subs":["Compromise via managed service providers or OT system integrators with standing remote access","Shared/interconnected supplier portals and EDI systems as lateral-movement paths","Cloud ERP/MES vendor compromise cascading to multiple manufacturing clients","Sub-tier supplier ransomware indirectly halting the insured's production (contingent BI exposure)"]}}},{"key":"third party supply chain and aggregation risk","name":"Third Party Supply Chain and Aggregation Risk","fam":"Third-Party & Supply Chain","desc":"Systemic exposure unique to government's shared and outsourced service model, where one compromise cascades across many jurisdictions.","inds":{"Public Administration (Government)":{"r ]}}},{"key":"underfunded security posture and recovery capability","name":"Underfunded Security Posture and Recovery Capability","fam":"Other","desc":"The sector's loss severity is driven less by attacker sophistication than by chronic under-resourcing. Sophos found lack of expertise and limited incident-response capacity cited by 42% each in lower education, and 49% of higher education institutions citing unknown security gaps. Backup reliability has degraded: recovery from backups fell to 59% in lower education and 47% in higher education. Public institutions face procurement cycles, capital-budget constraints and elected-board approval that slow both hardening and response.","inds":{"Educational Services":{"raw":"Underfunded Security Posture and Recovery Capability","subs":["Small or single-person IT teams in K-12 districts","Legacy and end-of-life systems retained on constrained capital budgets","Backup compromise, untested restores and insufficient offline copies","Absence of 24/7 monitoring, EDR coverage gaps and alert fatigue","Limited or absent cyber insurance and incident-response retainers","Slow public procurement and board-approval cycles","Reserve depletion funding recovery (British Library used c.40% of reserves)","IT staff burnout and turnover following incidents","Decentralised university IT with no central authority over departmental systems"]}}}],"exposures":[{"key":"intellectual property and trade secrets","name":"Intellectual Property and Trade Secrets","fam":"Data & IP Confidentiality","desc":"Proprietary design, engineering, and process data that is high-value theft/extortion leverage distinct to manufacturers, especially in automotive, aerospace, electronics, and industrial-equipment segments.","inds":{"Information Technology":{"raw":"Intellectual Property and Trade Secrets","subs":["Semiconductor and chip-design IP / EDA data","Proprietary algorithms, models and product roadmaps","Unreleased product blueprints and schematics","Trade secrets a
