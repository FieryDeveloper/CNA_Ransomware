":"Luxembourg's main energy supplier/distribution group, network operator Creos and supplier Enovos, under parent Encevo, was hit overnight July 22-23, 2022 by ALPHV/BlackCat (the DarkSide/Colonial lineage rebrand). Customer portals of Creos and Enovos were knocked offline, though electricity and gas supply and breakdown services continued uninterrupted. Demonstrates data-exfil-led extortion against European grid infrastructure.","src":["https://www.utilitydive.com/news/encevo-creos-envovos-ransomware/628644/","https://www.cybersecuritydive.com/news/encevo-creos-envovos-ransomware/628604/","https://therecord.media/luxembourg-energy-companies-struggling-with-alleged-ransomware-attack-data-breach","https://securityaffairs.co/wordpress/133899/cyber-crime/alphv-blackcat-ransomware-creos-luxembourg.html"]},{"v":"Conpet","g":"Qilin","d":"2026-02-03","c":"Romania","fin":"Not publicly quantified; company emphasized transport operations were unaffected, limiting operational/financial disruption.","ran":"Not publicly disclosed.","dt":"Business IT systems were isolated in response; SCADA/telecom and pipeline transport operations remained operational throughout (no OT downtime reported). IT recovery/remediation ongoing after Feb 2026 disclosure.","di":"Qilin alleged exfiltration of ~1TB including financial records, personnel data, and passport scans, and published sample images; Conpet confirmed data was stolen.","s":"Romania's national oil-pipeline transport operator detected a cyberattack on Feb 3, 2026 affecting its business IT infrastructure. Crucially, OT systems, SCADA and telecommunications, stayed fully functional and pipeline transport continued. Qilin claimed the attack and alleged theft of ~1TB of data. Root cause was an infostealer on an IT administrator's personal device; with valid WSUS credentials attackers abused Conpet's own update infrastructure to push a malicious 'fake update' delivering Qilin ransomware.","src":["https://www.bleepingcomputer.com/news/security/romanias-oil-pipeline-operator-conpet-confirms-data-stolen-in-attack/","https://industrialcyber.co/mining-oil-gas/romanias-oil-pipeline-operator-conpet-targeted-in-cyberattack-as-qilin-alleges-1tb-data-breach/","https://therecord.media/romania-conpet-oil-pipeline-ransomware-attack","https://shieldworkz.com/blogs/how-a-side-hustle-paralyzed-romania%E2%80%99s-national-oil-pipeline"]},{"v":"Ecopetrol","g":"TheGentlemen","d":"2026-07-17","c":"Colombia","fin":"Not publicly disclosed at time of research.","ran":"Not publicly disclosed at time of research.","dt":"Not publicly disclosed at time of research.","di":"Claimed on ransomware.live leak-tracking; specifics of stolen data not independently confirmed at time of research.","s":"Ecopetrol, Colombia's state-controlled national oil company and one of Latin America's largest energy firms, was listed as a victim by the 'TheGentlemen' ransomware group on ransomware.live (attack date 2026-07-17). Included as a recent, geographically diverse, large-state-oil-company data point from the ransomware.live Energy sector feed. Detailed public reporting was not yet available at research time (July 19, 2026).","src":["https://www.ransomware.live/activity/Energy"]},{"v":"Newpark Resources, Inc.","g":"not publicly disclosed","d":"2024-10-29","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident caused disruptions and limitation of access to certain information systems, but manufacturing and field operations continued utilizing established downtime procedures.","di":"not publicly disclosed","s":"On October 29, 2024, Newpark Resources, Inc. detected a ransomware incident where an unauthorized third party accessed its internal information systems. The company activated its cybersecurity response plan and is investigating the incident with external advisors.","src":["https://www.sec.gov/Archives/edgar/data/71829/000007182924000111/nr-20241029.htm"]},{"v":"Oltenia","g":"Gentlemen","d":"","c":"Romania","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Gentlemen ransomware gang has been linked to the compromise of the Romanian energy provider Oltenia. They utilize a suite of EDR killers, including a tool named GentleKiller, to disable defenses during attacks, allowing for unimpeded data theft or encryption processes.","src":["https://www.bleepingcomputer.com/news/security/gentlemen-ransomware-uses-multiple-edr-killers-to-disable-defenses/"]},{"v":"South Staffordshire Water Plc","g":"Cl0p","d":"July 2022","c":"UK","fin":"$1.3 million","ran":"not publicly disclosed","dt":"IT disruption reported, but water supply remains operational","di":"663,887 customers and employees; full names, physical addresses, email addresses, phone numbers, dates of birth, customer account credentials, bank account details, employee HR data such as National Insurance numbers","s":"South Staffordshire Water Plc was fined $1.3 million by the Information Commissioner's Office after a cyberattack exposed the personal data of 663,887 customers and employees. The breach, which began in September 2020 and escalated between May and July 2022, was linked to the Cl0p ransomware gang, although the company initially dismissed these claims. The leaked data included sensitive personal information and was published on the dark web.","src":["https://www.bleepingcomputer.com/news/security/uk-fines-water-supplier-13m-for-exposing-data-of-664k-customers/","https://www.bleepingcomputer.com/news/security/hackers-attack-uk-water-supplier-but-extort-wrong-company/"]},{"v":"Oltenia Energy Complex","g":"Gentlemen","d":"December 2025","c":"Romania","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Gentlemen ransomware group compromised Oltenia Energy Complex, one of Romania's largest energy providers, in December 2025. The attack utilized a botnet of over 1,570 hosts, indicating a focus on corporate victims. The ransomware employs advanced techniques for encryption and lateral movement within networks.","src":["https://www.bleepingcomputer.com/news/security/the-gentlemen-ransomware-now-uses-systembc-for-bot-powered-attacks/"]},{"v":"Southern Water","g":"Black Basta","d":"February 2024","c":"United Kingdom","fin":"£4.5M ($5.7M)","ran":"Initial demand of $3,500,000; proposed payment of $750,000","dt":"not publicly disclosed","di":"Limited part of server estate stolen; personal data may have been at risk","s":"Southern Water, a UK water supplier, suffered a ransomware attack by the Black Basta group in February 2024, incurring costs of £4.5 million. The attack involved the theft of data from a limited part of their server estate, prompting the company to engage cybersecurity experts and legal advisers.","src":["https://www.bleepingcomputer.com/news/security/southern-water-says-black-basta-ransomware-attack-cost-45m-in-expenses/"]},{"v":"Electrica Group","g":"Lynx","d":"","c":"Romania","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Lynx ransomware gang breached Electrica Group, a major electricity supplier in Romania, prompting an investigation in collaboration with national cybersecurity authorities. While critical power supply systems remained operational, the company is currently assessing the impact of the ongoing ransomware attack.","src":["https://www.bleepingcomputer.com/news/security/lynx-ransomware-behind-electrica-energy-supplier-cyberattack/"]},{"v":"Evolution Mining","g":"not publicly disclosed","d":"2024-08-08","c":"Australia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The attack is now fully contained, and the company does not anticipate any material impact on operations.","di":"not publicly disclosed","s":"Evolution Mining, one of Australia's largest gold producers, was targeted by a ransomware attack on August 8, 2024, impacting its IT systems. The company has engaged external cybersecurity experts for remediation and reports that mining operations should continue uninterrupted, indicating that critical systems were likely not affected.","src":["https://www.bleepingcomputer.com/news/security/australian-gold-producer-evolution-mining-hit-by-ransomware/"]},{"v":"IxMetro Powerhost","g":"APT INC","d":"February 2024","c":"Chile","fin":"not publicly disclosed","ran":"two bitcoins per encrypted customer","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The APT INC ransomware group, previously known as SEXi, has targeted IxMetro Powerhost, a Chilean hosting provider, encrypting their VMware ESXi servers. The group has been using the Babuk and LockBit 3 encryptors, demanding ransom payments in bitcoins for the decryption of affected files.","src":["https://www.bleepingcomputer.com/news/security/sexi-ransomware-rebrands-to-apt-inc-continues-vmware-esxi-attacks/"]},{"v":"PSI Software SE","g":"not publicly disclosed","d":"February 15, 2024","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems, including email, were disconnected as a measure to mitigate the risk of data loss.","di":"not publicly disclosed","s":"PSI Software SE, a German software developer for critical infrastructure, confirmed a ransomware attack that impacted its internal systems. The company disconnected several IT systems to prevent data loss and is currently investigating the incident with assistance from authorities.","src":["https://www.bleepingcomputer.com/news/security/critical-infrastructure-software-maker-confirms-ransomware-attack/"]},{"v":"Schneider Electric","g":"Cactus ransomware","d":"January 17, 2023","c":"France","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"1.5TB of data, including sensitive information about customers' industrial control and automation systems and information about environmental and energy regulations compliance","s":"Cactus ransomware claims to have stolen 1.5TB of data from Schneider Electric, threatening to leak it unless a ransom is paid. The group leaked 25MB of allegedly stolen data as proof, including sensitive documents. Schneider Electric's Sustainability Business division was breached on January 17, 2023.","src":["https://www.bleepingcomputer.com/news/security/cactus-ransomware-claim-to-steal-15tb-of-schneider-electric-data/"]},{"v":"Trans-Northern Pipelines Inc.","g":"ALPHV/BlackCat","d":"November 2023","c":"Canada","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The incident was quickly contained and TNPI continues to safely operate its pipeline systems.","di":"183GB of documents stolen, including company information and contact details of several TNPI employees.","s":"Trans-Northern Pipelines confirmed a breach of its internal network in November 2023, linked to claims of data theft by the ALPHV/BlackCat ransomware gang. The gang claims to have stolen 183GB of documents, which have been published on their data leak site, prompting TNPI to investigate the situation.","src":["https://www.bleepingcomputer.com/news/security/trans-northern-pipelines-investigating-alphv-ransomware-attack-claims/","https://www.bleepingcomputer.com/news/security/us-offers-up-to-15-million-for-tips-on-alphv-ransomware-gang/"]},{"v":"Veolia North America","g":"not publicly disclosed","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Some systems were temporarily taken offline for restoration, but are now back online.","di":"Limited number of individuals' personal information may have been impacted.","s":"Veolia North America experienced a ransomware attack that affected its Municipal Water division and disrupted bill payment systems. The company implemented defensive measures and took some systems offline to contain the breach, but confirmed that water treatment operations were not impacted. They are currently assessing the extent of the attack's impact with third-party forensics experts.","src":["https://www.bleepingcomputer.com/news/security/water-services-giant-veolia-north-america-hit-by-ransomware-attack/"]},{"v":"Holding Slovenske Elektrarne (HSE)","g":"Rhysida","d":"November 24, 2023","c":"Slovenia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems and files were locked, but power generation operations remained unaffected.","di":"not publicly disclosed","s":"Slovenia's largest power provider, HSE, suffered a ransomware attack that compromised its systems and encrypted files. The attack did not disrupt electric power production, and the organization is currently engaged in system cleanup while remaining on high alert for potential ransom demands.","src":["https://www.bleepingcomputer.com/news/security/slovenias-largest-power-provider-hse-hit-by-ransomware-attack/"]},{"v":"BHI Energy","g":"Akira","d":"May 30, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The threat actor's foothold on BHI's network was removed on July 7, 2023. The company was able to recover data from a cloud backup solution that hadn't been affected by the ransomware attack, so they were able to restore their systems without paying a ransom.","di":"767,000 files containing 690 GB of data, including employees' personal information such as full name, date of birth, Social Security Number (SSN), and health information.","s":"BHI Energy, a US energy services firm, was attacked by the Akira ransomware gang, which breached their network and stole sensitive data before deploying ransomware to encrypt files. The company managed to recover its systems without paying a ransom and has since enhanced its security measures.","src":["https://www.bleepingcomputer.com/news/security/us-energy-firm-shares-how-akira-ransomware-hacked-its-systems/"]},{"v":"Siemens Energy","g":"Clop","d":"","c":"Germany","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"business operations were not impacted","di":"not publicly disclosed","s":"Siemens Energy confirmed a data breach resulting from the Clop ransomware data-theft attacks exploiting a zero-day vulnerability in the MOVEit Transfer platform. Although data was stolen, the company stated that no critical data was compromised and their operations remained unaffected.","src":["https://www.bleepingcomputer.com/news/security/siemens-energy-confirms-data-breach-after-moveit-data-theft-attack/"]},{"v":"Hitachi Energy","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Hitachi Energy confirmed it suffered a data breach after the Clop ransomware gang stole data using a zero-day vulnerability in the GoAnywhere platform. The Clop gang has shifted its focus to extorting victims by threatening to publish stolen data rather than encrypting it.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-march-17th-2023-shifting-to-data-extortion/"]},{"v":"Empresas Públicas de Medellín (EPM)","g":"BlackCat/ALPHV","d":"December 12th 2022","c":"Colombia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"disrupting the company's operations and taking down online services","di":"not publicly disclosed","s":"Empresas Públicas de Medellín (EPM), a Colombian energy company, suffered a ransomware attack attributed to the BlackCat/ALPHV group. The attack disrupted the company's operations and affected its online services.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-16th-2022-losing-trust/"]},{"v":"Tata Power","g":"Hive","d":"October 2022","c":"India","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Tata Power, India's largest integrated power company, was attacked by the Hive ransomware gang, which claimed to have stolen data from the company's networks. The attack exploited vulnerabilities in the Boa web server, which is still used in IoT devices, leading to a breach of Tata Power's IT infrastructure.","src":["https://www.bleepingcomputer.com/news/security/hackers-breach-energy-orgs-via-bugs-in-discontinued-web-server/"]},{"v":"Gestore dei Servizi Energetici SpA (GSE)","g":"BlackCat/ALPHV","d":"","c":"Italy","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"GSE's website and systems were taken down to block the attackers; the website is still down almost a week after the incident.","di":"approximately 700GB of files stolen, including contracts, reports, project information, accounting documents, and other internal documentation.","s":"The BlackCat/ALPHV ransomware gang claimed responsibility for an attack on Italy's energy agency GSE, resulting in the theft of approximately 700GB of confidential data. GSE's systems were taken down to prevent further access, and the website remains down as investigations continue into the compromised data.","src":["https://www.bleepingcomputer.com/news/security/blackcat-ransomware-claims-attack-on-italian-energy-agency/"]},{"v":"DESFA","g":"LockBit","d":"August 22, 2022","c":"Greece","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"limited scope data breach and IT system outage","di":"not publicly disclosed","s":"DESFA, Greece's largest natural gas distributor, confirmed a limited scope data breach and IT system outage following a ransomware attack attributed to LockBit. The incident led to disruptions in their operations.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-26th-2022-fighting-back/"]},{"v":"Creos Luxembourg S.A.","g":"ALPHV","d":"not publicly disclosed","c":"Luxembourg","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Creos Luxembourg S.A., a natural gas pipeline and electricity network operator, was targeted in a ransomware attack claimed by the ALPHV ransomware gang, also known as BlackCat. The attack resulted in partial encryption of the company's network.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-august-5th-2022-a-look-at-cyber-insurance/"]}],"stats":[{"m":"Mean cost to recover from a ransomware attack, energy, oil/gas & utilities","v":"$3.12M in 2024 (vs $3.17M in 2023)","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/press/press-releases/2024/07/median-recovery-costs-2-critical-infrastructure-sectors-energy-and"},{"m":"Median ransom payment, energy/oil-gas/utilities","v":"$2.5M (2024); of those paying, 48% paid the original demand, 27% paid more, 26% paid less","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Ransom-payment propensity vs backup restoration, energy sector","v":"61% paid the ransom to recover data; only 51% restored from backups, the lowest backup-use rate of any sector","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Share of computers impacted per attack, energy/oil-gas/utilities","v":"62% of machines affected on average, vs 49% cross-sector average","s":"Sophos, The State of Ransomware in Critical Infrastructure 2024","u":"https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-critical-infrastructure-2024"},{"m":"Average total cost of a data breach, energy sector","v":"$4.83M (2024)","s":"IBM Cost of a Data Breach Report 2024","u":"https://www.ibm.com/reports/data-breach"},{"m":"Most common initial attack vector (all sectors, relevant to energy)","v":"Stolen/compromised credentials, 16% of breaches; longest to identify & contain (~10 months)","s":"IBM Cost of a Data Breach Report 2024","u":"https://newsroom.ibm.com/2024-07-30-ibm-report-escalating-data-breach-disruption-pushes-costs-to-new-highs"},{"m":"Ransomware attacks on industrial/OT organizations (incl. energy)","v":"1,693 attacks in 2024 (+87% YoY); groups targeting industrials rose to 80 (+60%). In 2025, 119 groups impacting ~3,300 organizations.","s":"Dragos 8th Annual OT Cybersecurity Year in Review (2024/2025)","u":"https://www.dragos.com/resources/press-release/dragos-reports-ot-ics-cyber-threats-escalate-amid-geopolitical-conflicts-and-increasing-ransomware-attacks"},{"m":"OT operational impact of ransomware (industrial sectors incl. energy)","v":"25% of observed OT ransomware cases involved a full OT-site shutdown; 75% caused some operational disruption","s":"Dragos OT Cybersecurity Year in Review","u":"https://www.dragos.com/blog/dragos-8th-annual-ot-cybersecurity-year-in-review-is-now-available"},{"m":"Confirmed ransomware attacks on global energy & utilities sector (2025)","v":"187 confirmed successful attacks in 2025 (per industry reporting aggregated in search); Cyfirma noted 72 victims, +64% over prior period","s":"Industry reporting (BlackFog / Cyfirma via Industrial Cyber), 2025","u":"https://industrialcyber.co/utilities-energy-power-water-waste/energy-and-utilities-cyber-threats-escalate-as-ransomware-and-apt-activity-rise-cyfirma-reports/"}]},{"name":"Finance and Insurance","tag":"Financial Services","overview":"Finance and insurance is one of the most consistently targeted industries in the ransomware threat landscape, combining three features attackers prize: high-value, tightly regulated data (PII, account/payment details, claims and underwriting data); low tolerance for downtime given real-time payment, trading, and claims obligations; and deep interdependency through vendors, fintech partners, and market infrastructure that lets a single compromise cascade well beyond one victim. Recent ransomware.live data (100 most-recent sector-tagged victims, spanning roughly April-July 2026) shows the sector being hit across the full spectrum of institution types - community banks and credit unions, insurers and brokers, wealth/asset managers, fintech and payments firms, and even a central bank - by a wide range of groups (Qilin, Everest, DragonForce, Akira, Everest, LockBit successors, Lapsus$, and newer entrants like Unsafe and Krybit), with double-extortion (encrypt-and-exfiltrate) now the dominant pattern. Notable historical and recent incidents illustrate two especially distinctive hazards for this industry versus others: (1) systemic/market-contagion risk, where ransomware against a market-infrastructure or processing vendor (ICBC, ION Group) disrupts trading and settlement across many unaffiliated institutions simultaneously, and (2) concentrated third-party/vendor risk, where a single shared vendor breach (Frost Bank/Citizens Bank's shared document-fulfillment vendor, Deutsche Bank's marketing-platform vendor, Evolve Bank & Trust's BaaS/fintech-partner network) exposes customers of multiple otherwise-unrelated financial brands at once. Authoritative industry reporting (Sophos, IBM, Coveware, Verizon DBIR) consistently ranks financial services among the highest-cost, highest-ransom-demand sectors, while regulatory regimes (GLBA, DORA, SEC disclosure rules) compress response timelines and add materially to breach cost relative to most other industries.","distinct":"Combines the highest-value regulated data with real-time payment, trading and claims obligations and dense interconnection through fintech partners and market infrastructure that permits contagion beyond the direct victim. Generally the most mature sector in controls, capital and recovery capability, which lowers payment likelihood while raising regulatory and systemic-risk scrutiny under GLBA and, for EU-touching entities, DORA.","leverage":"Exposure of customer PII/PFI, account and counterparty data, plus regulatory and market-confidence consequence. Availability leverage is real for payments and trading but blunted by mature redundancy.","tolerance":"Very low for transaction processing and settlement (minutes to hours); moderate for back-office and underwriting functions.","bulk":{"total":1643,"years":{"2017":3,"2019":3,"2020":16,"2021":92,"2022":156,"2023":329,"2024":311,"2025":475,"2026":258},"groups":[["qilin",128],["lockbit3",104],["akira",99],["clop",84],["alphv",55],["play",42],["SilentRansomGroup",42],["incransom",41]],"countries":[["US",569],["CA",62],["GB",61],["IN",37],["AU",24],["DE",20]],"pressPct":5,"ransomPct":0},"incidents":[{"v":"CNA Financial Corporation","g":"Evil Corp / Phoenix CryptoLocker","d":"March 2021 (attack); ransom paid ~May 2021","c":"United States","fin":"Reportedly paid $40 million in ransom - among the largest ransom payments publicly reported at the time. Full cost of remediation/legal/breach-notification beyond the ransom itself is not publicly disclosed in aggregate.","ran":"Attackers initially demanded $60 million; CNA paid approximately $40 million roughly two weeks after data theft began.","dt":"Multi-week disruption to remote access, corporate email, and phone systems; CNA stated it was able to recover encrypted/stolen data with no indication the exfiltrated data was viewed, retained, or shared further after payment.","di":"Corporate and some employee/customer data was copied/exfiltrated prior to encryption; CNA said no indication the data was subsequently misused, though the scope of records affected was not fully broken out publicly.","s":"One of the largest U.S. commercial insurers was hit by a new variant of Phoenix CryptoLocker (attributed to the Russia-linked Evil Corp syndicate). Attackers accessed systems from March 5-21, 2021, exfiltrating data before deploying ransomware and knocking core systems offline, including remote access, email, and phone systems.","src":["https://thehackernews.com/2021/05/insurance-firm-cna-financial-reportedly.html","https://www.bloomberg.com/news/articles/2021-05-20/cna-financial-paid-40-million-in-ransom-after-march-cyberattack","https://www.msspalert.com/cybersecurity-breaches-and-attacks/ransomware/cna-payment-40-million-dollars/","https://cisomag.com/suffered-attack-paid-ransom-restored-systems-the-cnas-ransomware-timeline/"]},{"v":"Industrial and Commercial Bank of China (ICBC) - U.S. broker-dealer/financial services unit","g":"LockBit 3.0","d":"November 8-9, 2023","c":"China / United States","fin":"Not a disclosed single dollar loss figure for ICBC itself, but market-wide impact was measurable: more than $62 billion of U.S. Treasurys reportedly failed to deliver on one day, and settlement of over $9 billion in Treasury-backed assets was disrupted.","ran":"No ransom amount publicly confirmed as demanded or paid by ICBC.","dt":"ICBC's unit lost access to corporate email and had to physically courier settlement details via USB stick to counterparties in Manhattan while systems were restored; disruption lasted several days before normal electronic settlement resumed.","di":"Data exfiltration/theft was claimed by LockBit but the specific volume/type of records taken was not comprehensively disclosed publicly.","s":"LockBit compromised ICBC's U.S. financial-services division (believed via Citrix NetScaler vulnerabilities CVE-2023-4966/4967), disrupting settlement of U.S. Treasury trades and repo financing at the world's largest bank by assets - a rare ransomware incident with visible, market-wide operational impact.","src":["https://www.bitdefender.com/en-us/blog/hotforsecurity/worlds-biggest-bank-hit-by-ransomware-forced-to-trade-via-usb-stick","https://www.resecurity.com/blog/article/icbc-ransomware-attack-strikes-at-the-heart-of-the-global-financial-order-lockbit-on-a-roll","https://home.treasury.gov/news/press-releases/jy2114","https://securityaffairs.com/155178/cyber-crime/lockbit-icbc-ransomware-attack.html"]},{"v":"Fidelity National Financial (FNF)","g":"ALPHV/BlackCat","d":"November 2023","c":"United States","fin":"Specific dollar cost of the incident (remediation, business interruption, legal) not publicly broken out by FNF; real estate closings nationwide were delayed for the outage period, an indirect economic impact not quantified publicly.","ran":"No official ransom figure disclosed by FNF; ALPHV's swift removal of FNF from its leak site is widely read by researchers as an indicator a payment was made, but this is inference, not confirmed disclosure.","dt":"Systems were offline for nearly a week, disrupting title/escrow closings for home buyers and real estate agents nationwide during that period.","di":"Data of approximately 1.3 million individuals was confirmed stolen and subject to breach notification.","s":"A Fortune 500 title-insurance and real-estate services provider (handles closings for a large share of U.S. home sales) had systems taken offline for about a week; ALPHV/BlackCat claimed the intrusion, and the gang's removal of FNF from its leak site is widely interpreted as a sign a ransom was paid.","src":["https://therecord.media/fidelity-national-financial-ransomware-alphv-black-cat","https://www.bleepingcomputer.com/news/security/fidelity-national-financial-hackers-stole-data-of-13-million-people/","https://www.theregister.com/2023/11/23/blackcat_ransomware_fnf/","https://www.malwarebytes.com/blog/news/2024/01/fidelity-national-financial-acknowledges-data-breach-affecting-1-3-million-customers"]},{"v":"ION Group / ION Cleared Derivatives","g":"LockBit","d":"January 31, 2023","c":"United Kingdom (global client base incl. U.S., Europe)","fin":"No public disclosure of direct financial loss to ION or its clients; the incident's significance was systemic/operational (derivatives clearing workflow disruption) rather than a disclosed dollar figure.","ran":"LockBit threatened to publish stolen data by February 4, 2023 if unpaid; no ransom amount or payment/non-payment was publicly confirmed by ION.","dt":"Affected servers were isolated and the incident contained to a specific environment; several days of manual/workaround trade processing for affected clients while remediation continued.","di":"LockBit claimed data was exfiltrated during the intrusion; scope/type of data was not comprehensively disclosed publicly by ION.","s":"A UK-based financial software vendor whose platforms underpin derivatives clearing/trading for major banks and brokers was hit by LockBit, forcing at least 42 clients - including major U.S. and European financial institutions - to fall back to manual trade processing for cleared derivatives.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-on-ion-group-impacts-derivatives-trading-market/","https://techcrunch.com/2023/02/02/ion-group-lockbit-derivatives-ransomware/","https://iongroup.com/press-release/markets/cleared-derivatives-cyber-event/","https://www.darkreading.com/cyberattacks-data-breaches/cyberattack-fintech-firm-disrupts-derivatives-trading"]},{"v":"Evolve Bank & Trust","g":"LockBit","d":"Intrusion February 2024; disclosed/data published June-July 2024","c":"United States","fin":"Specific dollar cost not publicly disclosed by Evolve; the company offered two years of free credit monitoring/identity protection to affected individuals, an ongoing cost not quantified publicly. Reputational/partner-relationship impact on its fintech clients was significant but not dollar-quantified.","ran":"Evolve confirmed it did NOT pay the ransom demand (amount not publicly disclosed), leading LockBit to publish the stolen data.","dt":"Attackers accessed and downloaded data from Evolve's databases/file shares over a window from February to May 2024 before the bank discovered the intrusion in May 2024; public notification did not begin until July 8, 2024.","di":"At least 7.6 million individuals' personal data affected, including names, Social Security numbers, bank account details, card PANs, wire/settlement files, in clear text; downstream fintech partners (Affirm, Mercury, Wise, and others) were also impacted. Precise figure later reported as 7,640,112.","s":"A U.S. banking-as-a-service (BaaS) bank whose infrastructure underpins numerous fintech apps (e.g., Affirm, Wise, Mercury) was breached after an employee clicked a malicious link; Evolve refused to pay, so LockBit published the stolen data, exposing both direct banking customers and downstream fintech partner customers - a clear third-party/supply-chain risk case for the sector.","src":["https://techcrunch.com/2024/07/09/evolve-bank-says-ransomware-gang-stole-personal-data-on-millions-of-customers/","https://www.theregister.com/2024/07/09/evolve_lockbit_attack/","https://www.infosecurity-magazine.com/news/cyber-attack-evolve-bank-exposed/","https://www.getevolved.com/cybersecurity-incident/","https://www.bleepingcomputer.com/news/security/evolve-bank-says-data-breach-impacts-76-million-americans/"]},{"v":"Central Bank of Libya","g":"Qilin","d":"Disclosed June 9, 2026; Qilin claimed responsibility June 22, 2026","c":"Libya","fin":"Not publicly disclosed. The bank characterized the incident as affecting only a limited set of systems, with no reported disruption to national payment operations.","ran":"No ransom amount publicly disclosed or confirmed.","dt":"Bank stated the incident was 'fully contained' as of late June 2026, with recovery/system restoration ongoing per an internal plan; no extended public-facing outage reported.","di":"Qilin threatened to release confidential banking data but as of the incident's public reporting, the specific volume/type of data was not independently confirmed or publicly itemized.","s":"Libya's central bank disclosed a cyberattack affecting a limited number of systems/technical services; the Qilin ransomware-as-a-service operation later publicly claimed the breach and threatened to release confidential banking data, illustrating ransomware's expansion into national financial-infrastructure/central-bank targets.","src":["https://libyaherald.com/2026/06/cyber-incident-announced-on-9-june-has-been-fully-contained-cbl","https://www.dexpose.io/qilin-strikes-central-bank-of-libya-in-ransomware-assault/","https://www.centralbanking.com/central-banks/financial-stability/7976224/libya-says-cyber-security-incident-under-control","https://issa-eg.org/qilin-ransomware-group-claims-breach-of-central-bank-of-libya-following-confirmed-cyberattack/"]},{"v":"Frost Bank and Citizens Financial Group (Citizens Bank) - shared third-party vendor breach","g":"Everest","d":"April 16-20, 2026 (Everest claims posted)","c":"United States","fin":"Not publicly disclosed by either bank in dollar terms; both institutions face customer class-action lawsuits alleging inadequate safeguarding of data via the vendor relationship, with litigation costs not yet quantified publicly.","ran":"No ransom amount publicly disclosed; Everest gave a six-day deadline before threatening to publish the full data dump.","dt":"Both banks stated their own core systems were not directly breached (the incident occurred in the third-party vendor's environment); no extended outage of banking services was reported.","di":"Everest claimed roughly 250,000 Frost Bank client records (Social Security numbers, tax IDs, names, mortgage rates, investment/income data, home addresses) and additional Citizens Bank records, with combined exposure reported by researchers at up to approximately 3.65 million records across both institutions.","s":"The Everest ransomware gang claimed breaches of two unrelated major U.S. banks, Frost Bank (San Antonio) and Citizens Financial Group, tracing back to a single shared third-party vendor that handled statement printing (for Citizens) and tax-document fulfillment (for Frost) - a textbook example of concentrated third-party/vendor risk in the financial sector, since one vendor compromise exposed customers of multiple unrelated institutions.","src":["https://cybernews.com/security/everest-ransomware-frost-citizens-bank-breach/","https://www.dexpose.io/everest-ransomware-attack-targets-frost-bank/","https://www.americanbanker.com/news/customers-sue-citizens-frost-over-third-party-data-breach","https://slingscore.com/everest-ransomware-gang-hits-frost-bank-and-citizens-bank-via-third-party-vendor-exposing-up-to-3-65-million-records/","https://schneiderdowns.com/our-thoughts-on/third-party-cyber-risk-in-banking-everest-ransomware-claims/"]},{"v":"Deutsche Bank (via third-party marketing/incentive platform vendor)","g":"Unsafe","d":"Claimed on leak site July 4, 2026","c":"Germany","fin":"Not publicly disclosed.","ran":"Not publicly disclosed.","dt":"No disruption to core Deutsche Bank banking services reported; investigation of the third-party provider's environment was ongoing at time of disclosure.","di":"Group claimed employee email addresses, password hashes, and physical mailing addresses among the exposed records; scope limited to data held within the third-party marketing/incentive platform rather than core customer banking data, per Deutsche Bank's statement.","s":"The 'Unsafe' ransomware-as-a-service group added Deutsche Bank to its leak site, posting screenshots purporting to show database exports (employee emails, password hashes, mailing addresses). Deutsche Bank clarified the actual incident occurred at an external German service provider operating a marketing/incentive platform for the bank's sales partners, not within Deutsche Bank's own core banking environment - another illustration of third-party/vendor exposure at a major global bank.","src":["https://cybernews.com/security/deutsche-bank-ransomware-data-breach/","https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach","https://compliancehub.wiki/deutsche-bank-unsafe-ransomware-third-party-breach-dora-2026/","https://techchannel.news/unsafe-ransomware-group-claims-deutsche-bank-breach/"]},{"v":"SEI Investments Company","g":"not publicly disclosed","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"SEI Investments Company reported a ransomware attack on a third-party vendor. The company has issued a forward-looking statement regarding the potential impacts of this incident.","src":["https://www.sec.gov/Archives/edgar/data/350894/000035089423000088/seic-20231026.htm"]},{"v":"River Financial Corporation","g":"not publicly disclosed","d":"2026-06-19","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Certain operations have been impacted, but River is working with external cybersecurity professionals to fully restore these operations.","di":"not publicly disclosed","s":"On June 16, 2026, an unauthorized threat actor gained access to River Financial Corporation's network and deployed ransomware. The company identified the incident on June 19, 2026, and is currently investigating the scope and impact of the breach with the help of a third-party forensic firm.","src":["https://www.sec.gov/Archives/edgar/data/1641601/000119312526282946/ck0001641601-20260619.htm"]},{"v":"Navient Corporation","g":"not publicly disclosed","d":"2026-06-08","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"borrower information including customer names, date of birth, addresses, and Social Security numbers","s":"On June 8, 2026, Navient Corporation was informed of a ransomware attack affecting a third-party law firm that provides services to the company. The attack resulted in unauthorized access to sensitive borrower information maintained by the law firm. The company has initiated an investigation and is notifying affected individuals and regulators as required.","src":["https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm"]},{"v":"Prudential Financial, Inc.","g":"alphv","d":"2024-02-05","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"limited data including some client information and personally identifiable information, Company administrative and user data, and a small percentage of Company user accounts associated with employees and contractors","s":"On February 5, 2024, Prudential Financial, Inc. detected unauthorized access to its systems by a threat actor starting February 4, 2024. The investigation revealed that the threat actor accessed and exfiltrated limited client information and Company data, but no evidence of malware or ransomware was found, and the incident has not materially impacted operations.","src":["https://www.sec.gov/Archives/edgar/data/1137774/000119312524040749/d766318d8ka.htm","https://www.bleepingcomputer.com/news/security/prudential-financial-now-says-25-million-impacted-by-data-breach/"]},{"v":"Globe Life Inc.","g":"not publicly disclosed","d":"2024-10-17","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not applicable","di":"Approximately 5,000 individuals affected; includes names, email addresses, phone numbers, postal addresses, Social Security numbers, health-related data, and other policy information.","s":"Globe Life Inc. received communications from an unknown threat actor attempting to extort money in exchange for not disclosing certain customer information. The company activated its incident response plan and is cooperating with federal law enforcement while investigating the claims made by the threat actor.","src":["https://www.sec.gov/Archives/edgar/data/320335/000032033524000056/gl-20241017.htm"]},{"v":"Standard Bank","g":"Prinz Eugen","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"1 BTC demanded","dt":"not publicly disclosed","di":"not publicly disclosed","s":"The Prinz Eugen ransomware targets recently modified files for encryption without leaving a ransom note. In a notable incident involving Standard Bank, the attackers demanded a ransom of 1 BTC, which was refused.","src":["https://www.bleepingcomputer.com/news/security/new-prinz-eugen-ransomware-prioritizes-recent-files-for-encryption/"]},{"v":"Marquis","g":"not publicly disclosed","d":"August 14, 2025","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"672,075 individuals affected; personal and financial information including names, dates of birth, addresses, phone numbers, Social Security numbers, Taxpayer Identification Numbers, and financial account information","s":"Marquis, a Texas-based financial services provider, suffered a ransomware attack on August 14, 2025, resulting in the theft of data from over 670,000 individuals. The attack disrupted operations at 74 banks across the United States and was linked to a security breach of a SonicWall firewall.","src":["https://www.bleepingcomputer.com/news/security/marquis-ransomware-gang-stole-data-of-672-000-people-in-2025-cyberattack/"]},{"v":"BridgePay Network Solutions","g":"not publicly disclosed","d":"","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Recovery could take time and is being handled in a secure and responsible manner.","di":"No payment card data has been compromised; any accessed files were encrypted with no evidence of usable data exposure.","s":"BridgePay Network Solutions confirmed a ransomware attack that caused a nationwide outage affecting its payment gateway services. The incident led to disruptions for merchants and organizations relying on BridgePay for card processing, with the company engaging federal law enforcement and external teams for recovery efforts.","src":["https://www.bleepingcomputer.com/news/security/payments-platform-bridgepay-confirms-ransomware-attack-behind-outage/"]},{"v":"Landmark Admin","g":"not publicly disclosed","d":"May 13, 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"IT systems and remote access were shut down to prevent the spread of the attack.","di":"806,519 people; personal information including names, addresses, Social Security numbers, tax identification numbers, driver's license numbers, passport numbers, financial account numbers, medical information, dates of birth, health insurance policy numbers, and life and annuity policy information.","s":"Landmark Admin reported a data breach affecting over 800,000 individuals due to a cyberattack detected on May 13, 2024. The breach involved unauthorized access to sensitive personal information, and the company is currently investigating the incident and notifying affected individuals.","src":["https://www.bleepingcomputer.com/news/security/insurance-admin-landmark-says-data-breach-impacts-800-000-people/"]},{"v":"Patelco","g":"RansomHub","d":"February 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 750,000 customers' personal information exposed","s":"RansomHub ransomware has breached over 210 victims since its emergence in February 2024, focusing on data-theft-based extortion. Notable victims include Patelco, Rite Aid, and Frontier Communications, with the latter warning that personal information of over 750,000 customers was compromised.","src":["https://www.bleepingcomputer.com/news/security/fbi-ransomhub-ransomware-breached-210-victims-since-february/"]},{"v":"Patelco Credit Union","g":"RansomHub","d":"February 2024","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"over 750,000 customers' personal information exposed","s":"RansomHub ransomware has breached over 210 victims since its emergence in February 2024, focusing on data-theft-based extortion. Notable victims include Patelco Credit Union and Frontier Communications, which warned customers about exposed personal information due to the breach.","src":["https://www.bleepingcomputer.com/news/security/fbi-ransomhub-ransomware-breached-210-victims-since-february/"]},{"v":"Affirm","g":"LockBit","d":"June 25, 2024","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"Evolve has responded by resetting passwords globally and implementing various network hardening measures.","di":"Names, Social Security Numbers (SSNs), bank account numbers, and contact information of Affirm Card users and Evolve retail banking customers.","s":"Affirm has warned that its cardholders' personal information may have been exposed due to a data breach at its third-party issuer, Evolve Bank Trust. The breach involved unauthorized access to sensitive data, and Evolve is currently investigating the incident while assuring that the situation has been contained.","src":["https://www.bleepingcomputer.com/news/security/affirm-says-cardholders-impacted-by-evolve-bank-data-breach/"]},{"v":"Infosys McCamish Systems (IMS)","g":"LockBit","d":"November 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"6 million individuals affected; includes Social Security Numbers, dates of birth, medical treatment/record information, biometric data, email addresses and passwords, usernames and passwords, driver's license numbers, financial account information, payment card information, passport numbers, tribal ID numbers, U.S. military ID numbers.","s":"Infosys McCamish Systems (IMS) suffered a ransomware attack by LockBit in November 2023, compromising the personal data of over 6 million individuals. The attack specifically affected sensitive information of about 57,000 Bank of America customers and included various types of personal data. IMS has notified impacted organizations and is providing identity protection services to mitigate risks from the exposure.","src":["https://www.bleepingcomputer.com/news/security/infosys-mccamish-says-lockbit-stole-data-of-6-million-people/"]},{"v":"Equilend Holdings","g":"LockBit","d":"January 22, 2023","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"All client-facing services were back online shortly after the incident.","di":"Personally identifiable information (PII) of employees, including names, dates of birth, and Social Security numbers.","s":"Equilend Holdings confirmed that a ransomware attack in January resulted in the theft of employees' personally identifiable information. The LockBit ransomware group claimed responsibility for the attack, although Equilend did not immediately confirm this. The company is providing affected employees with two years of free identity theft protection services.","src":["https://www.bleepingcomputer.com/news/security/equilend-warns-employees-their-data-was-stolen-by-ransomware-gang/"]},{"v":"loanDepot","g":"ALPHV","d":"January 8","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"16.6 million people's personal information stolen","s":"ALPHV ransomware gang claimed responsibility for breaches at loanDepot and Prudential Financial. loanDepot confirmed a ransomware attack on January 8, affecting 16.6 million individuals, while Prudential reported a breach on February 4, with employee and contractor data stolen but no evidence of customer data exfiltration. ALPHV plans to sell loanDepot's stolen data and release Prudential's data for free after failed negotiations.","src":["https://www.bleepingcomputer.com/news/security/alphv-ransomware-claims-loandepot-prudential-financial-breaches/"]},{"v":"Tipalti","g":"BlackCat","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"256 GB of data, including data for Roblox and Twitch","s":"Tipalti is investigating claims that the BlackCat ransomware gang breached its network and stole 256 GB of data, including sensitive information related to Roblox and Twitch. The investigation is ongoing, and there is currently no confirmation of the breach.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-december-15th-2023-ransomware-drama/"]},{"v":"Toyota Financial Services","g":"Medusa","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$8,000,000","dt":"certain systems taken offline to contain the breach","di":"not publicly disclosed","s":"Toyota Financial Services has reported a data breach that exposed sensitive personal and financial information of its customers. The Medusa ransomware group claimed responsibility for the attack, demanding a ransom of $8 million to delete the stolen data, which has since been leaked on their extortion portal.","src":["https://www.bleepingcomputer.com/news/security/toyota-warns-customers-of-data-breach-exposing-personal-financial-info/"]},{"v":"Industrial and Commercial Bank of China (ICBC)","g":"LockBit","d":"","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"LockBit ransomware exploits the Citrix Bleed vulnerability to breach systems of large organizations, including the Industrial and Commercial Bank of China. The attacks have exposed over 10,400 Citrix servers, with many remaining unpatched despite public disclosure of the flaw. The attacks are believed to be conducted by a LockBit affiliate utilizing this vulnerability to mass-breach networks.","src":["https://www.bleepingcomputer.com/news/security/lockbit-ransomware-exploits-citrix-bleed-in-attacks-10k-servers-exposed/"]},{"v":"Industrial Commercial Bank of China (ICBC)","g":"not publicly disclosed","d":"November 8, 2023","c":"China","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"ICBC is restoring systems and services following the attack and has disconnected and isolated impacted systems to contain the incident.","di":"not publicly disclosed","s":"The Industrial Commercial Bank of China confirmed a ransomware attack that disrupted its financial services systems on November 8, 2023. The attack impacted the U.S. Treasury market, causing issues with equities clearing and preventing the bank from settling trades for other market participants. ICBC is currently conducting a thorough investigation and recovery efforts with the help of information security experts.","src":["https://www.bleepingcomputer.com/news/security/worlds-largest-commercial-bank-icbc-confirms-ransomware-attack/"]},{"v":"American Family Insurance","g":"not publicly disclosed","d":"October 21st 2023","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"shut down portions of its IT systems after customers reported website outages","di":"not publicly disclosed","s":"American Family Insurance confirmed it suffered a cyberattack that caused outages in its IT systems. The attack led to disruptions as customers reported issues accessing the website throughout the week.","src":["https://www.bleepingcomputer.com/news/security/the-week-in-ransomware-october-27th-2023-breaking-records/"]},{"v":"PBI Research Services","g":"Clop","d":"2023-05-27","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"4.75 million individuals; full name, date of birth, social security number, zip code, state of residence, policy number, agent ID","s":"PBI Research Services suffered a data breach due to the MOVEit Transfer attacks initiated by the Clop ransomware gang, exposing data for 4.75 million individuals. The breach affected clients including Genworth Financial, Wilton Reassurance, and CalPERS, with sensitive information such as social security numbers being compromised. The Clop gang has begun extorting companies by listing impacted organizations on their data leak site.","src":["https://www.bleepingcomputer.com/news/security/moveit-breach-impacts-genworth-calpers-as-data-for-32-million-exposed/"]},{"v":"Hatch Bank","g":"Clop","d":"not publicly disclosed","c":"not publicly disclosed","fin":"not publicly disclosed","ran":"$10 million","dt":"not publicly disclosed","di":"139,493 customers' names and social security numbers","s":"Hatch Bank reported a data breach after hackers exploited a vulnerability in the Fortra GoAnywhere MFT platform, stealing personal information of nearly 140,000 customers. The Clop ransomware gang claimed responsibility for the attack and attempted to extort victims by demanding a ransom to prevent the stolen data from being published.","src":["https://www.bleepingcomputer.com/news/security/hatch-bank-discloses-data-breach-after-goanywhere-mft-hack/"]},{"v":"ION Group","g":"LockBit","d":"2023-01-31","c":"UK","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"remediation of services is ongoing","di":"not publicly disclosed","s":"ION Group, a UK-based software company, was targeted in a ransomware attack by the LockBit gang on January 31, 2023. The attack impacted ION Cleared Derivatives, causing significant delays as large customers were forced to switch to manual processing of trades. LockBit has claimed to have stolen data during the intrusion and threatens to publish it, potentially exposing sensitive information of large investors.","src":["https://www.bleepingcomputer.com/news/security/ransomware-attack-on-ion-group-impacts-derivatives-trading-market/"]},{"v":"Bank of Zambia","g":"Hive","d":"2022-05-09","c":"Zambia","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The bank experienced a partial disruption to some of its IT applications, which have since been fully restored.","di":"not publicly disclosed","s":"The Bank of Zambia suffered a ransomware attack by the Hive operation, which claimed to have encrypted the bank's Network Attached Storage device. Instead of paying the ransom, the bank publicly mocked the hackers and confirmed that they would not engage with the threat actors, stating that their core systems were protected.","src":["https://www.bleepingcomputer.com/news/security/national-bank-hit-by-ransomware-trolls-hackers-with-dick-pics/"]}],"stats":[{"m":"Median ransom demand, financial services sector (2025)","v":"$3,000,000 (highest of any industry surveyed)","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Median ransom payment, financial services sector (2025)","v":"$2,100,000","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Average cost to fully recover from a ransomware attack, financial services (2025)","v":"$1.74 million (down from $2.58 million in 2024)","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Root cause cited as 'security gaps / lack of adequate protection', financial services respondents (2025)","v":"66-67%","s":"Sophos, The State of Ransomware in Financial Services 2025","u":"https://www.sophos.com/en-us/resources/white-papers/state-of-ransomware-in-financial-services"},{"m":"Average total cost of a data breach, financial services sector (2025)","v":"$5.56 million (2nd highest of 17 industries, behind healthcare; 25% above global average; down from $6.08M in 2024)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Global average cost of a data breach, all industries (2025)","v":"$4.44 million (US companies averaged $10.22 million)","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Breach lifecycle detection & escalation share of cost, financial services vs. global","v":"~34% in financial services vs. ~29% global average, driven by compressed regulator-notification timelines","s":"IBM Cost of a Data Breach Report 2025","u":"https://www.ibm.com/reports/data-breach"},{"m":"Highest median ransom payment by sector, full-year 2025","v":"Financial services sector had the highest median ransom payments among sectors tracked, at $2.0 million","s":"Coveware Quarterly Ransomware Reports (2025 series)","u":"https://www.coveware.com/ransomware-quarterly-reports"},{"m":"Overall ransom payment rate (all sectors), Q4 2025","v":"~20% (a historic low)","s":"Coveware Quarterly Ransomware Report, Q4 2025","u":"https://www.coveware.com/blog/2025/10/24/insider-threats-loom-while-ransom-payment-rates-plummet"},{"m":"Average / median ransom payment (all sectors), Q4 2025","v":"Average $591,988 (up 57% QoQ); median $325,000 (up 132% QoQ)","s":"Coveware Quarterly Ransomware Report, Q4 2025","u":"https://www.coveware.com/blog/2025/10/24/insider-threats-loom-while-ransom-payment-rates-plummet"},{"m":"Confirmed breaches involving ransomware, all industries (2024 data)","v":"44% of confirmed breaches involved ransomware, up from 32% the year before","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Financial and Insurance sector incidents/breaches (VERIS industry classification, 2024 data)","v":"3,336 incidents and 927 confirmed breaches","s":"Verizon 2025 DBIR, Finance Snapshot","u":"https://www.verizon.com/business/resources/infographics/2025-dbir-finance-snapshot.pdf"},{"m":"Median ransom payment, all industries (2024 data)","v":"$115,000, down from $150,000 in 2023","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Organizations refusing to pay ransom, all industries (2024)","v":"64%, up from 50% in 2022","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"},{"m":"Ransomware victims prior credentials exposed in infostealer logs (all industries, 2024 data)","v":"54%","s":"Verizon 2025 Data Breach Investigations Report (DBIR)","u":"https://www.verizon.com/business/resources/reports/2025-dbir-data-breach-investigations-report.pdf"}]},{"name":"Healthcare and Social Assistance","tag":"Healthcare","overview":"Healthcare and Social Assistance is one of the most heavily targeted sectors in the ransomware ecosystem, driven by a combination of low tolerance for downtime (patient safety), high-value PHI, fragmented and legacy IT/OT environments, and a long tail of small, under-resourced providers (clinics, home health agencies, billing firms) alongside a handful of giant, deeply interconnected health systems and claims processors. Ransomware.live's \"Healthcare\" sector tag currently lists 2,443 posted victims spanning 2015-2026 (dataset pulled 2026-07-19/20), with the pace of incidents accelerating sharply since 2020 (34 in 2020 vs. 627 in 2025 and 387 already in the first ~6.5 months of 2026). The threat-actor landscape is fragmented across 206 distinct named groups in the dataset, with Qilin (178), LockBit3 (143), Inc Ransom (128), BianLian (92), RansomHub (81), Clop (72), ALPHV/BlackCat (68), Everest (63) and Medusa (63) the most prolific against this sector. Geographically the US dominates (1,092 recorded victims), followed by the UK (58), Australia (58), Canada (57), India (56), Germany (55), France (47) and Brazil (45), reflecting both the concentration of large private health systems in the US and the global reach of double-extortion groups. Industry-wide cost data consistently shows healthcare as the single costliest sector for data breaches (IBM: ~$7.4M average per breach in 2025, down from ~$9.8M in 2024 but still #1 of all industries for the 14th consecutive year), even as 2025 ransom demands and payments in healthcare specifically have fallen sharply (Sophos/Coveware both report demands down roughly 90% from 2024's average and healthcare among the least likely sectors to pay). The single largest loss event on record for the sector by far is the February 2024 Change Healthcare/UnitedHealth Group attack, whose total company-reported impact reached roughly $2.9 billion for fiscal year 2024 alone, disrupting an estimated one-third of all US patient medical records and claims processing nationwide via a critical, deeply embedded third-party clearinghouse, illustrating the sector's acute concentration/third-party-dependency risk.","distinct":"2,443 posted victims with sharply accelerating pace. The only sector where both extortion levers are simultaneously severe: PHI carries the most punitive and mechanically triggered regulatory regime (HIPAA breach notification, OCR investigation, near-automatic class-action follow-on), while downtime is a patient-safety event producing ambulance diversion and delayed treatment. Fragmented estates, unpatchable connected medical devices, and a long tail of small under-resourced providers sit alongside a few giant claims processors whose compromise cascades industry-wide.","leverage":"Dual: patient-safety-driven urgency to restore clinical operations, plus PHI publication carrying regulatory penalty and litigation exposure.","tolerance":"Lowest of any sector. Hours for clinical and emergency systems, where outage translates directly into patient harm rather than financial loss alone.","bulk":{"total":2444,"years":{"2015":2,"2016":2,"2017":2,"2018":4,"2019":3,"2020":34,"2021":106,"2022":206,"2023":443,"2024":627,"2025":627,"2026":388},"groups":[["qilin",178],["lockbit3",143],["incransom",128],["bianlian",92],["ransomhub",81],["clop",72],["alphv",68],["everest",63]],"countries":[["US",1092],["GB",58],["AU",58],["CA",57],["IN",56],["DE",55]],"pressPct":9,"ransomPct":1},"incidents":[{"v":"Change Healthcare (subsidiary of UnitedHealth Group/Optum)","g":"ALPHV/BlackCat (initial encryption/exfiltration); RansomHub (subsequent extortion/data listing after an alleged 'exit scam' by ALPHV affiliates)","d":"Attack began February 21, 2024; disclosed February 2024; extortion/data-listing activity continued into April 2024","c":"United States","fin":"UnitedHealth Group's total reported cyberattack impact reached approximately $2.9 billion for fiscal year 2024 (direct response costs plus business disruption); an initial Q1 2024 estimate of $0.74/share grew through the year to a full-year estimate of $1.90-$2.05/share. UnitedHealth also advanced more than $9 billion in interim/interest-free funding to affected providers by Q2 2024 to offset cash-flow disruption across the industry.","ran":"UnitedHealth confirmed paying a ransom reported by multiple outlets at roughly $22 million in bitcoin to the ALPHV/BlackCat affiliate; a second group (RansomHub) subsequently claimed to still hold the stolen data and re-extorted the company.","dt":"Core clearinghouse and pharmacy/claims systems were down for multiple weeks beginning February 21, 2024, with a phased, multi-month restoration of full transaction volumes through spring 2024.","di":"UnitedHealth later disclosed the breach affected the personal/health information of approximately 190 million individuals (one of the largest healthcare data breaches ever reported to HHS), including medical records, billing/claims data, SSNs, and insurance information.","s":"The largest and most disruptive healthcare ransomware incident on record. Attackers used compromised credentials to access a Citrix portal lacking multi-factor authentication, then deployed ransomware against Change Healthcare, the dominant US claims clearinghouse processing roughly one-third of all patient records and ~15 billion transactions annually. The outage froze prescription processing, insurance eligibility checks, and provider payments nationwide for weeks.","src":["https://www.sec.gov/Archives/edgar/data/731766/000073176624000146/a2024q1exhibit991.htm","https://www.sec.gov/Archives/edgar/data/731766/000073176624000242/a2024q2exhibit991.htm","https://www.bankinfosecurity.com/change-healthcare-attack-cost-estimate-reaches-nearly-29b-a-26541","https://prowritersins.com/cyber-insurance-blog/united-healthcare-ransomware-payment/","https://hyperproof.io/resource/understanding-the-change-healthcare-breach/"]},{"v":"Universal Health Services (UHS), ~400 US hospitals/care sites","g":"Ryuk","d":"September 27, 2020","c":"United States","fin":"UHS reported approximately $67 million in total pre-tax losses tied to the attack (lost operating income, reduced patient activity, billing-delay reserves, and recovery costs), and stated it expected to recover most of this through cyber insurance.","ran":"UHS did not pay a ransom and recovered from backups; no confirmed ransom amount was publicly reported.","dt":"EHR and other core IT applications were down across all ~400 UHS care sites for roughly three weeks before full restoration.","di":"No large-scale confirmed public data leak was widely reported for this incident (Ryuk at the time was primarily an encryption-only/non-exfiltration operation); primary impact was operational/clinical disruption rather than a mass PHI leak.","s":"One of the earliest large-scale hospital-system ransomware attacks; Ryuk encrypted IT systems across UHS's national network, forcing staff onto paper documentation, diverting ambulances, and suspending IT applications company-wide.","src":["https://www.bleepingcomputer.com/news/security/universal-health-services-lost-67-million-due-to-ryuk-ransomware-attack/","https://www.cybersecuritydive.com/news/uhs-ryuk-ransomware-damage-cost/595946/","https://www.techtarget.com/healthtechsecurity/news/366595382/UHS-Ransomware-Attack-Cost-67M-in-Lost-Revenue-Recovery-Efforts","https://www.hipaajournal.com/universal-health-services-ransomware-attack-cost/"]},{"v":"Health Service Executive (HSE), Ireland's national public health system","g":"Conti","d":"May 14, 2021","c":"Ireland","fin":"Estimates for recovery costs varied widely across reporting: the HSE's director general cited a June 2021 estimate exceeding $600 million; other analyses put full recovery cost at roughly $100 million, and yet other reporting cited about $83 million; figures differ by scope (pure IT rebuild vs. total health-system impact) and are not fully reconciled in public reporting.","ran":"Conti demanded $19,999,000; the HSE refused to pay and instead worked with Ireland's National Cyber Security Centre; a free decryptor was later released by the attackers.","dt":"National IT systems were shut down immediately upon detection; full recovery across the health system took approximately four months.","di":"Patient data was exfiltrated and reportedly used to attempt individual extortion of patients; Ireland's HSE has since (as of reporting around 2025) offered approximately EUR750 in compensation to affected individuals whose personal data was compromised.","s":"A nationwide ransomware attack that forced Ireland's entire public health IT infrastructure offline, disrupting hospital appointments, cancer treatment scheduling, radiology, and COVID-19 vaccine registration systems across the country. Conti later provided a free decryptor under international pressure but retained and later leveraged stolen patient data.","src":["https://krebsonsecurity.com/2021/12/inside-irelands-public-healthcare-ransomware-scare/","https://www.bankinfosecurity.com/irish-ransomware-attack-recovery-cost-estimate-600-million-a-16931","https://www.cpomagazine.com/cyber-security/irish-healthcare-system-requires-more-than-100-million-to-recover-from-the-conti-ransomware-attack/","https://www.controleng.com/throwback-attack/ireland-ransomware-attack-costs-hse-83-million/","https://www.bitdefender.com/en-us/blog/hotforsecurity/four-years-later-irish-health-service-offers-eu750-to-victims-of-ransomware-attack","https://www.hhs.gov/sites/default/files/lessons-learned-hse-attack.pdf"]},{"v":"CommonSpirit Health, ~140+ hospitals across ~13 US states","g":"Unattributed publicly at the time (not clearly listed under a named leak-site group in available tracking)","d":"Initial access September 16, 2022; ransomware detected/disclosed October 2-3, 2022","c":"United States","fin":"CommonSpirit initially estimated the cost at approximately $150 million, later revising the total to approximately $160 million (business interruption, remediation, and related expenses) as reported in 2023 disclosures.","ran":"Not publicly disclosed.","dt":"Multi-week system outages beginning October 2022 affecting more than 100-160+ facilities; precise full-recovery date not specified in public reporting.","di":"Personal data of more than 623,700 patients was reported exposed; the breach affected over 150 facilities and led to two class-action lawsuits.","s":"One of the largest US nonprofit hospital operators was forced to take systems offline across more than 100 facilities in at least 13 states, delaying access to EHRs and disrupting patient care, following network compromise weeks before the ransomware deployment was detected.","src":["https://www.cshub.com/attacks/news/commonspirit-health-reports-that-ransomware-attack-cost-160-million","https://www.hipaajournal.com/commonspirit-health-increases-ransomware-attack-cost-estimate-to-160-million/","https://www.healthcare-brew.com/stories/2023/05/25/commonspirit-reports-usd160-million-loss-from-last-year-s-ransomware-attack","https://www.beckershospitalreview.com/healthcare-information-technology/cybersecurity/the-commonspirit-ransomware-attack-1-year-later/"]},{"v":"Lehigh Valley Health Network (LVHN)","g":"ALPHV/BlackCat","d":"Detected February 6, 2023","c":"United States","fin":"LVHN agreed to a $65 million class-action settlement (finalized November 2024), one of the largest healthcare ransomware-related settlements on record; of this, $52 million was earmarked for patients whose nude treatment images were published.","ran":"LVHN refused to pay the ransom; the specific dollar amount demanded was not publicly disclosed.","dt":"Specific system-downtime duration not publicly detailed in available reporting; the affected system was a specific practice's oncology imaging network rather than network-wide LVHN infrastructure.","di":"More than 134,000 patients were affected/eligible for settlement compensation; leaked data included sensitive treatment photographs and other PHI published on BlackCat's leak site.","s":"Attackers compromised a network supporting a Lackawanna County physician practice, including a radiation-oncology imaging system, and, after LVHN refused to pay, published highly sensitive clinical photos of breast cancer patients (nude from the waist up) to pressure payment, an unusually aggressive harassment-based extortion tactic.","src":["https://www.hipaajournal.com/lehigh-valley-health-network-blackcat-settlement/","https://therecord.media/lehigh-valley-health-network-data-breach-settlement","https://www.fiercehealthcare.com/providers/lehigh-valley-health-network-agrees-65m-settlement-over-ransomware-attack-leaked-nude","https://whyy.org/articles/lehigh-valley-health-data-breach-settlement/"]},{"v":"Medibank Private (major Australian health insurer)","g":"REvil-affiliated actor (Aleksandr Ermakov, later sanctioned by Australia)","d":"Attack detected October 2022; extortion/data leaks began November 2022","c":"Australia","fin":"Not fully quantified in a single public figure in the sources reviewed; the incident drove significant remediation, regulatory, and reputational costs and a multi-year AFP-led international investigation; precise total company cost not publicly disclosed in the sources found.","ran":"Initial demand of roughly US$10 million (A$15 million), later reduced to approximately US$9.7 million; Medibank refused to pay, consistent with Australian government guidance against ransom payments.","dt":"Primarily a data-theft/extortion event rather than an encryption/operational-outage event; core insurance operations were not reported as extensively down.","di":"Personal and health data of approximately 9.7 million current and former customers was compromised, including about 1.8 million international customers; data included Medicare, passport, and driver's licence numbers plus sensitive medical history.","s":"Attackers stole and threatened to publish highly sensitive personal and health data of Medibank's customers, including records revealing abortions, addiction treatment, and mental-health conditions, after the insurer refused a ransom demand, one of Australia's largest ever data breaches and a landmark case in international ransomware attribution/sanctions.","src":["https://techcrunch.com/2022/11/08/ransomware-medibank-australia-health-data/","https://www.insurancejournal.com/news/international/2022/11/14/694867.htm","https://www.minister.defence.gov.au/media-releases/2025-02-12/further-cyber-sanctions-response-medibank-private-cyberattack","https://heimdalsecurity.com/blog/australian-insurer-medibank-confirms-ransomware-attack/"]},{"v":"Synnovis (pathology/blood-testing partner for NHS trusts in London)","g":"Qilin","d":"June 3-4, 2024","c":"United Kingdom","fin":"Specific total financial cost to Synnovis or the NHS trusts was not found publicly quantified in a single disclosed figure in the sources reviewed; disruption was extensive across South-East London NHS services for months.","ran":"Not publicly disclosed.","dt":"Severe disruption began June 3, 2024, with over 11,000 outpatient/elective procedure appointments delayed; some services were affected for months, with normal service levels reported restored by December 2024, roughly six months.","di":"Qilin published approximately 400GB of stolen data on June 20, 2024, including patient names, NHS numbers, and descriptions of blood tests.","s":"A ransomware attack on a third-party pathology provider partnered with Guy's and St Thomas' and King's College Hospital NHS Trusts caused a critical shortage of O-negative blood, cancelled thousands of appointments and procedures, and was later formally identified as a contributing factor in a patient death, one of the clearest documented cases of ransomware causing loss of life via a healthcare supply-chain/third-party vector.","src":["https://www.hipaajournal.com/care-disrupted-at-london-hospitals-due-to-ransomware-attack-on-pathology-vendor/","https://therecord.media/ransomware-nhs-cyberattack-disruption","https://www.england.nhs.uk/synnovis-cyber-incident/","https://insight.scmagazineuk.com/synnovis-2024-attack-contributing-factor-in-patient-death","https://www.infosecurity-magazine.com/news/synnovis-breach-notification-2024/"]},{"v":"Enzo Biochem, Inc.","g":"not publicly disclosed","d":"2023-04-06","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The Company activated its disaster recovery plan, allowing it to continue operations while restoring systems. Back-up procedures caused operational challenges and delays in processing laboratory specimens.","di":"Certain data was extracted from the Company’s information technology systems; specific records or data types not publicly disclosed.","s":"On April 6, 2023, Enzo Biochem, Inc. experienced a ransomware attack that impacted its IT systems. The Company implemented containment measures and launched an investigation, discovering that certain data was extracted from its systems as part of the incident.","src":["https://www.sec.gov/Archives/edgar/data/316253/000121390023029594/ea176929-8k_enzo.htm"]},{"v":"Omnicell, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"Omnicell, Inc. experienced a ransomware incident that led to significant operational challenges. The company has been focused on addressing the impact of this incident while continuing to provide medication management solutions.","src":["https://www.sec.gov/Archives/edgar/data/926326/000092632623000027/exhibit991q2-23.htm"]},{"v":"Akumin Inc.","g":"bianlian","d":"2023-11-02","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"The majority of systems have been restored, with most cancer centers treating patients and operations online, though some services remain unavailable and certain locations are temporarily closed.","di":"not publicly disclosed","s":"Akumin Inc. announced on November 2, 2023, that it has made significant progress in restoring its business activities and systems following a ransomware incident disclosed on October 16, 2023. Most of its cancer centers are now operational, allowing patient appointments to be scheduled, although some services and locations are still not fully restored.","src":["https://www.sec.gov/Archives/edgar/data/1776197/000177619723000028/aku-20231102.htm","https://akumin.com/service-updates/"]},{"v":"DaVita Inc.","g":"interlock","d":"2025-04-12","c":"United States","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disclosed","s":"On April 12, 2025, DaVita Inc. experienced a ransomware incident that encrypted certain elements of their network. The company activated response protocols, isolated impacted systems, and is working with cybersecurity professionals to assess and remediate the situation while continuing to provide patient care.","src":["https://www.sec.gov/Archives/edgar/data/927066/000119312525079593/d948299d8k.htm"]},{"v":"TELA Bio, Inc.","g":"not publicly disclosed","d":"not publicly disclosed","c":"USA","fin":"not publicly disclosed","ran":"not publicly disclosed","dt":"not publicly disclosed","di":"not publicly disc
